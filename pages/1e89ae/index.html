uGvYLTDwWsejwgtgkYKPqRJg8SV6xaiZ3ZTppGneS4yfH5/66fZSDHv+QZci/+h5c5UHtpy67JUqGppM0sh0Nc1dW6/N1W5Yoqat8/TU/VnadmdeW2PLLSyh0cvxBs3KbqTmwYPpxN4do/mzE8nEpvX/UMu2Wbp74zUAK5q6WkHns7V0eWkdPbPzd3rxkTGybadYySumVzhcaJFbs5UrEkQ/+CK8gF5dnh/6ciIZ73gwQ927L1IitoxKLXYP3SjYdOrHHfTZhRRlFyrorafPk20B3HPD1y2G3qKZME5Jcf3t/HUC13/8tSd++vqFveMUTwAUxSUFI1QekR1+bIze3D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">轻量加密综述<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="rfid-概述"><a href="#rfid-概述" class="header-anchor">#</a> RFID 概述</h2> <p>RFID 认证使用的都是交互式的协议，一般采用挑战-响应的工作模式</p> <ul><li>CIA：<code>Confidentiality, Integrity, Availability</code></li> <li>密码学三大顶会：<code>Crypto, EUROCRYPT, ASIACRYPT</code></li> <li>信息安全四大顶会：<code>ACM CCS, NDSS, IEEE S&amp;P, USENIX Security</code></li></ul> <p>射频识别，Radio Frequency Identification。RFID 系统由标签、读头和后端应用系统三部分组成</p> <img src="/assets/img/rfid-system.52cf58e8.png"> <p>本质上这就是一次表单验证，只不过请求不走 HTTP 而走电磁波：商场防盗门、二代身份证、NFC（RFID 的子集）都是其典型应用。与常见登录验证一样，传输需要考虑加密，但标签存储空间通常只有几字节到几千字节，算力极为有限，因此密文不能过长、计算量不能过大</p> <p>其主要区别在于硬件资源严重受限，采用的加密算法和协议仅限于低成本实现。按认证协议的复杂度（存储与计算开销），安全协议被划分为完备、简单、轻量级和超级轻量级四类，前两类面向有源 RFID 系统，后两类面向无源系统</p> <ul><li>完备协议：非对称以 ECC 为主流，对称以 AES、XTEA 为代表</li> <li>简单协议：轻量化密码算法并基于单向散列函数，研究的重点是双向认证</li> <li>轻量协议：主要依赖 CRC（Cyclic Redundancy Check）和 RNG（Random Number Generator）等硬件原语</li> <li>超轻量协议：如 LMAP、HB 协议族，多为按位运算</li></ul> <p>类比常见的 HTTP 协议，我们的工作大概就是在其上再套一层 TLS 以实现加密场景下的传输；RFID 的特殊之处在于约束从带宽转移到了硬件成本</p> <h3 id="rfid-协议分类"><a href="#rfid-协议分类" class="header-anchor">#</a> RFID 协议分类</h3> <p>在 RFID 系统中，需要轻量化的对象贯穿全链路</p> <ol><li>标签上的非易失性 RAM</li> <li>标签上的 ROM（代码和数据）</li> <li>标签计算</li> <li>阅读器-标签交互中的消息和轮数</li> <li>阅读器-标签交互中的消息大小</li> <li>服务器实时计算</li> <li>服务器存储</li></ol> <p>其中前三项直接影响标签成本，较其余更为重要。据此可将 RFID 安全认证协议分为四个计算量级</p> <table><thead><tr><th>计算量级</th> <th>搭载加密算法</th></tr></thead> <tbody><tr><td>超轻量算法</td> <td>XOR、AND、OR 等</td></tr> <tr><td>轻量级算法</td> <td>RNG、CRC</td></tr> <tr><td>中量级算法</td> <td>one-way hash function、pseudo-random function</td></tr> <tr><td>重量级算法</td> <td>RSA、ElGamal、ECC</td></tr></tbody></table> <h3 id="针对-rfid-系统的攻击"><a href="#针对-rfid-系统的攻击" class="header-anchor">#</a> 针对 RFID 系统的攻击</h3> <p>假冒和欺骗攻击：攻击者截获合法读写器与标签之间的访问消息，获得标签的身份信息并据此克隆，再利用这些非法的克隆标签伪装成合法标签访问系统；同理，攻击者也可通过窃听获取合法读写器的隐私信息，伪装成合法读写器进入 RFID 系统</p> <p>位置与跟踪攻击：RFID 系统要求标签在工作状态下必须对读写器的访问做出响应，又由于标签通信范围有限，攻击者从不同位置发送查询命令并根据返回的响应即可确定目标标签当前所处的位置。若不采取有效的安全措施，便可据此对合法标签实施非法的跟踪和定位</p> <p>密码破译攻击：系统普遍依赖加密保证机密性与完整性，针对算法本身的破译是最常见的攻击方式之一</p> <p>拒绝服务（DoS）攻击：通过阻断读写器读取标签信息发动</p> <h2 id="重量级协议"><a href="#重量级协议" class="header-anchor">#</a> 重量级协议</h2> <blockquote><p>重量级安全认证协议也被部分文献命名为完备 RFID 安全认证协议，可分为对称与非对称两类</p></blockquote> <p>非对称方向主要沿用椭圆曲线密码体制（ECC）。相较 RSA，ECC 速度更快、体积更小、功耗更低，更适合 RFID 场景。多数研究表明，仅使用单个 ECC 算法的协议只能提供单向认证且易受攻击；引入第二个 ECC 算法后才达成双向认证，安全性显著提升，而耦合方式的不同也造成各协议在效率与安全性上的差异</p> <p>相关方案：<code>A secure ECC-based RFID authentication scheme integrated with ID-verifier transfer protocol</code>、<code>A secure RFID mutual authentication protocol for healthcare environments using elliptic curve cryptography</code>、<code>A provably secure RFID authentication protocol based on elliptic curve for healthcare environments</code></p> <p>但即便如此，ECC 用于资源受限的 RFID 仍显勉强，于是功耗与速度优势更明显的对称加密算法被引入，典型方案有</p> <ul><li>基于 AES 的协议：<code>Strong authentication for RFID systems using the AES algorithm</code></li> <li>基于 XTEA 的协议：<code>Chai-tea, cryptographic hardware implementations of xtea</code></li></ul> <p>公钥密码体系的横向对比</p> <table><thead><tr><th><strong>特性</strong></th> <th><strong>RSA</strong></th> <th><strong>ElGamal</strong></th> <th><strong>ECC</strong></th></tr></thead> <tbody><tr><td><strong>数学基础</strong></td> <td>大整数分解问题</td> <td>离散对数问题</td> <td>椭圆曲线上的离散对数问题</td></tr> <tr><td><strong>加密/解密原理</strong></td> <td>指数和模运算</td> <td>指数和模运算，增加随机性</td> <td>椭圆曲线上的点加法和点乘</td></tr> <tr><td><strong>密钥长度</strong></td> <td>较长</td> <td>较长</td> <td>更短，同等安全性下需要的密钥长度更小</td></tr> <tr><td><strong>效率</strong></td> <td>加密慢、解密快（相较 ElGamal）</td> <td>加密快、解密慢</td> <td>加密和解密均快，适合低功耗设备</td></tr> <tr><td><strong>随机性需求</strong></td> <td>不需要随机数</td> <td>需要随机数</td> <td>需要随机数</td></tr> <tr><td><strong>密文长度</strong></td> <td>与密钥长度一致</td> <td>密文长度较长</td> <td>密文较短，更适合资源受限环境</td></tr> <tr><td><strong>主要用途</strong></td> <td>加密、签名、数字证书</td> <td>加密、签名</td> <td>加密、签名、密钥交换、区块链和物联网</td></tr></tbody></table> <h3 id="基于-elgamal"><a href="#基于-elgamal" class="header-anchor">#</a> 基于 ElGamal</h3> <blockquote><p>Universal re-encryption for mixnets</p></blockquote> <p>随机公钥密码系统由密钥生成、加密和解密三个算法构成：KG → (PK, SK)，E(m, r, PK) → C，D(SK, C) → m。语义安全要求无法从密文中学习明文的任何信息</p> <p>所谓重加密，是指在不知道明文的前提下对密文 C 重新加密，且不影响后续解密，即 Re(C, r, PK) → C' 且 D(SK, C') = m</p> <p>该方案可基于任意合适代数群上的 ElGamal 实现：在标准密文后附加一个对单位元的密文，利用 ElGamal 的代数同态，用第二个密文改变第一个密文中的加密因子，从而在无需公钥知识的条件下完成重加密，效率与标准 ElGamal 相当</p> <p>推导过程如下</p> <p>1、密钥生成，取 x ∈ Z_q</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="23.332ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 10312.9 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node=" 4 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(22060.5,0)"><path data-c="5D" d="M22 710V750H159V-250H22V-210H119V710H22Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msup><mi>C</mi><mo data-mjx-alternate="1">′</mo></msup><mo>=</mo><mo stretchy="false">[</mo><mo stretchy="false">(</mo><msubsup><mi>α</mi><mn>0</mn><mo data-mjx-alternate="1">′</mo></msubsup><mo>,</mo><msubsup><mi>β</mi><mn>0</mn><mo data-mjx-alternate="1">′</mo></msubsup><mo stretchy="false">)</mo><mo>,</mo><mo stretchy="false">(</mo><msubsup><mi>α</mi><mn>1</mn><mo data-mjx-alternate="1">′</mo></msubsup><mo>,</mo><msubsup><mi>β</mi><mn>1</mn><mo data-mjx-alternate="1">′</mo></msubsup><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo>=</mo><mo stretchy="false">[</mo><mo stretchy="false">(</mo><msub><mi>α</mi><mn>0</mn></msub><msubsup><mi>α</mi><mn>1</mn><mrow data-mjx-texclass="ORD"><msubsup><mi>k</mi><mn>0</mn><mo data-mjx-alternate="1">′</mo></msubsup></mrow></msubsup><mo>,</mo><msub><mi>β</mi><mn>0</mn></msub><msubsup><mi>β</mi><mn>1</mn><mrow data-mjx-texclass="ORD"><msubsup><mi>k</mi><mn>0</mn><mo data-mjx-alternate="1">′</mo></msubsup></mrow></msubsup><mo stretchy="false">)</mo><mo>,</mo><mo stretchy="false">(</mo><msubsup><mi>α</mi><mn>1</mn><mrow data-mjx-texclass="ORD"><msubsup><mi>k</mi><mn>1</mn><mo data-mjx-alternate="1">′</mo></msubsup></mrow></msubsup><mo>,</mo><msubsup><mi>β</mi><mn>1</mn><mrow data-mjx-texclass="ORD"><msubsup><mi>k</mi><mn>1</mn><mo data-mjx-alternate="1">′</mo></msubsup></mrow></msubsup><mo stretchy="false">)</mo><mo stretchy="false">]</mo></math></mjx-assistive-mml></mjx-container><p>显然重加密后仍有 m₁' = 1 且 m₀' = m</p> <h3 id="基于-ecc"><a href="#基于-ecc" class="header-anchor">#</a> 基于 ECC</h3> <p>Elliptic Curve Cryptography 是一种基于椭圆曲线数学结构的密码学体系</p> <h4 id="schnorr-protocol"><a href="#schnorr-protocol" class="header-anchor">#</a> Schnorr Protocol</h4> <blockquote><p>RFID-tags for anti-counterfeiting</p></blockquote> <p>单密钥的 ECC 认证变体</p> <img src="/assets/img/image-20241113130344973.f4de2c71.png"> <p>攻击者可以使用 ZT 跟踪目标标签，即该方案易受位置跟踪攻击；此外攻击者还可获取特定标签的交换消息 {X, e, y} 与公钥 ZT</p> <h4 id="okamoto-protocol"><a href="#okamoto-protocol" class="header-anchor">#</a> Okamoto Protocol</h4> <blockquote><p>Public-key cryptography for RFID tags</p></blockquote> <p>双密钥结构</p> <img src="/assets/img/image-20241113130455425.5f1aadcd.png"> <p>双密钥增强了安全性，但仍可推算出公钥 Zt，导致标签可追踪；同时该方案还存在可扩展性问题与缺乏前向保密的缺陷</p> <h4 id="ec-rac-protocol"><a href="#ec-rac-protocol" class="header-anchor">#</a> EC-RAC Protocol</h4> <blockquote><p>EC-RAC (ECDLP Based Randomized Access Control): Provably Secure RFID Authentication Protocol</p></blockquote> <p>改进的双密钥结构</p> <img src="/assets/img/image-20241113130837274.8c949f94.png"> <p>由于响应可以是特定标签的固定值，攻击者仍可跟踪标签；若攻击者两次拦截同一标签，或被动窃听三次，即可冒充标签。此外该协议仅考虑标签到读写器的认证，缺少读写器到标签的认证，使标签易受恶意查询影响</p> <h4 id="ecdlp-rk-protocol"><a href="#ecdlp-rk-protocol" class="header-anchor">#</a> ECDLP-RK Protocol</h4> <blockquote><p>An ECDLP-Based Randomized Key RFID Authentication Protocol</p></blockquote> <p>对 EC-RAC 的改进，多引入了一个随机数</p> <img src="/assets/img/image-20241113131346350.bab71cd4.png"> <p>在该方案下，即便攻击者掌握 r3 与 xT'P 也无法获得关于 xT 的信息，随机化后的 ZT' 同样不可追踪。但随着认证更新写入数据库，后台服务器的消耗持续增加，会导致可扩展性下降；同时该方案同样缺乏双向认证</p> <h4 id="liao-hsiao-scheme"><a href="#liao-hsiao-scheme" class="header-anchor">#</a> Liao &amp; Hsiao Scheme</h4> <blockquote><p>A secure ECC-based RFID authentication scheme integrated with ID-verifier transfer protocol</p></blockquote> <img src="/assets/img/image-20241113132314815.4b00b33a.png"> <h2 id="中量级协议"><a href="#中量级协议" class="header-anchor">#</a> 中量级协议</h2> <blockquote><p>中量级协议采用部分轻量化的密码算法且基于单向散列函数，安全性高于轻/超轻量两级，双向认证是此类协议研究最明显的特征</p></blockquote> <p>经典方案包括基于单向散列函数的 Hash-Lock 协议、随机化 Hash-Lock 协议、Hash 链协议、图书馆协议以及抗追踪的 YA-TRAP 协议</p> <ul><li><code>RFID systems and security and privacy implications</code></li> <li><code>Security and privacy aspects of low-cost radio frequency identification systems</code></li> <li><code>Hash-chain based forward-secure privacy protection scheme for lowcost RFID</code></li> <li><code>Privacy and security in library RFID: Issues, practices, and architectures</code></li> <li><code>YA-TRAP: Yet another trivial RFID authentication protocol</code></li></ul> <p>上述前四种方案的安全性对比如下</p> <table><thead><tr><th>协议</th> <th>可追踪性攻击</th> <th>重放攻击</th> <th>欺骗攻击</th> <th>去同步攻击</th> <th>双向认证</th> <th>密钥更新</th></tr></thead> <tbody><tr><td>Hash-Lock</td> <td>×</td> <td>×</td> <td>×</td> <td>×</td> <td>√</td> <td>×</td></tr> <tr><td>随机化</td> <td>√</td> <td>×</td> <td>×</td> <td>×</td> <td>√</td> <td>×</td></tr> <tr><td>Hash 链</td> <td>√</td> <td>√</td> <td>√</td> <td>√</td> <td>×</td> <td>√</td></tr> <tr><td>图书馆</td> <td>√</td> <td>√</td> <td>√</td> <td>√</td> <td>√</td> <td>×</td></tr></tbody></table> <h3 id="hash-lock"><a href="#hash-lock" class="header-anchor">#</a> Hash Lock</h3> <h4 id="hash-lock-2"><a href="#hash-lock-2" class="header-anchor">#</a> Hash-Lock</h4> <blockquote><p>RFID Systems and Security and Privacy Implications</p></blockquote> <p>一种基于哈希函数的访问控制协议，核心思想是用哈希值作为&quot;锁&quot;，用原始数据或其对应信息作为&quot;钥匙&quot;，在符合条件时解锁</p> <p>写入标签时，系统根据一个随机键生成哈希值并写入标签内存，作为该标签的锁</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="17.619ex" hei 是引入随机操作，并借此实现双向认证</p> <img src="/assets/img/image-20241117173301301.79b78d24.png"> <p>认证流程如下</p> <ul><li>标签生成随机数 R，与标签 ID 联结后哈希得到 H，将 R 与 H 一同发给读写器</li> <li>后端遍历所有 ID'，将其与 R 联结哈希得 H'，若 H = H'，则当前 ID' 即为该标签的 ID</li> <li>读写器将 ID' 回传，标签比对本地 ID，一致则本次认证通过</li></ul> <p>联结并非唯一的混淆方式，文中另给出两种形式</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="40.31ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 17817 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(389,0)"><path data-c="1D45F" d="M21 287Q22 290 23 295T28 317T38 348T53 381T73 411T99 433T132 442Q161 442 183 430T214 408T225 388Q227 382 228 382T236 389Q284 441 347 441H350Q398 441 422 400Q430 381 430 363Q430 333 417 315T391 292T366 288Q346 288 334 299T322 328Q322 376 378 392Q356 405 342 405Q286 405 239 331Q229 315 224 298T190 165Q156 25 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 114 189T154 366Q154 405 128 405Q107 405 92 377T68 316T57 280Q55 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(840,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z" style="stroke-width:3;"></path></g><g data-mml-no T289 7T195 -10Q118 -10 86 19T53 87Q53 126 74 143T118 160Q133 160 146 151T160 120Q160 94 142 76T111 58Q109 57 108 57T107 55Q108 52 115 47T146 34T201 27Q237 27 263 38T301 66T318 97T323 122Q323 150 302 164T254 181T195 196T148 231Q131 256 131 289Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(502,-150) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(5926.9,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(6315.9,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msubsup><mi>a</mi><mi>i</mi><mo data-mjx-alternate="1">′</mo></msubsup><mo>=</mo><mi>G</mi><mo stretchy="false">(</mo><msup><mi>H</mi><mi>i</mi></msup><mo stretchy="false">(</mo><msub><mi>s</mi><mn>1</mn></msub><mo stretchy="false">)</mo><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>比较 aᵢ 与 aᵢ′，相等即认证成功，服务器将标签 ID 回传，标签校验 ID 后再进行密钥更新</p> <p>该方案具备不可分辨性与前向保密：攻击者即便拿到输出 a 也无法反推密钥 s，即便拿到当前密钥 s⁽ⁱ⁾ 也无法还原此前任意一轮的密钥，这均得益于单向散列函数的性质</p> <h3 id="ya-trap-协议"><a href="#ya-trap-协议" class="header-anchor">#</a> YA-TRAP 协议</h3> <blockquote><p>YA-TRAP: Yet another trivial RFID authentication protocol</p></blockquote> <p>利用简单的哈希函数和伪随机数生成器实现标签与读写器的双向认证：通过哈希值验证标签合法性，通过随机数保证会话唯一性，从而抵抗重放攻击</p> <p>标签由三个变量初始化</p> <ul><li>Ki：标签唯一标识，同时作为加密密钥（为满足 MAC 要求，实践中需 160 位）</li> <li>T0：标签初始时间戳，位宽取决于时间粒度与可认证次数</li> <li>Tmax：时间戳上限，用于限定标签的认证次数</li></ul> <p>同时每个标签具备一个 PRNG</p> <img src="/assets/img/image-20241118210536815.5799cad2.png"> <p>这本质是一个基于时间戳的消息认证码：Tr 为当前时间戳，<code>PRNG_i^j</code> 表示标签 i 第 j 轮生成的随机数，首轮以 PRNGᵢ(Kᵢ) 即以密钥 Ki 为种子生成</p> <p>显然，只有合法读写器才能查询后台哈希表，这一结构天然完成了对 reader 的认证；而标签每次响应都以 Ki 对变化的时间戳 Tr 加密散列，保证了响应的安全性与动态性。整体思路与 TOTP 十分接近</p> <h2 id="超轻量协议"><a href="#超轻量协议" class="header-anchor">#</a> 超轻量协议</h2> <p>主要涵盖早期的 UMAP 协议族、改进的 SASI 协议，以及面向后量子安全的 HB 协议族</p> <ul><li><code>LMAP: A real lightweight mutual authentication protocol for low-cost RFID tags</code></li> <li><code>EMAP: An efficient mutual-authentication protocol for low-cost RFID tags</code></li> <li><code>M2AP: A minimalist mutual-authentication protocol for low-cost RFID tags</code></li> <li><code>SASI: A new ultralightweight RFID authentication protocol providing strong authentication and strong integrity</code></li> <li><code>Secure human identification protocols</code></li> <li><code>Authenticating pervasive devices with human protocols</code></li> <li><code>Active attack against HB+: a provably secure lightweight authentication protocol</code></li> <li><code>An Ultra-Lightweight Mutual Authentication Protocol Based on LPN Problem with Distance Fraud Resistant</code></li></ul> <h3 id="umap-协议族"><a href="#umap-协议族" class="header-anchor">#</a> UMAP 协议族</h3> <blockquote><p>Ultralightweight Mutual Authentication Protocol，由 Lopez 等人提出，包括 M²AP、LMAP 和 EMAP 三个协议</p></blockquote> <p>基于极简密码学（minimalist cryptography）的思想提升低成本 RFID 的安全性</p> <h4 id="lmap"><a href="#lmap" class="header-anchor">#</a> LMAP</h4> <blockquote><p>LMAP: A real lightweight mutual authentication protocol</p></blockquote> <p>HB 协议于 2001 年提出，本文在 2006 年的绪论中提到 HB 协议族：(HB, HB+) 的安全性与 LPN 噪声问题相关，是最具前途的协议方向，但其在随机实例上的困难性仍是悬而未决的问题</p> <p>LMAP 中标签维护一个 96 位 IDS 和一个 96 位密钥 K，K 均分为 K1~K4。为支持 IDS 与 K 的更新（新旧各一份）需 384 位，再加 96 位静态标识符 ID，标签共计需要 480 bit 存储</p> <p>随机数生成等高成本计算在读写器端执行，标签端仅需按位异或、逐位或、逐位并和有限模加法等简单操作。由于 IDS 的限制，只有拥有权限的读写器才能取到标签密钥 K</p> <img src="/assets/img/image-20241011155745302.21f35079.png"> <p>认证分为两步</p> <ul><li>标签识别：读写器向标签 say hello，标签回送 IDS，读写器合法方可获得标签密钥 K，这是第一次认证（标签认证读写器）</li> <li>双向认证
<ol><li>读写器生成随机数 n1、n2，结合 IDS 与 K 计算密文 A、B、C 发往标签</li> <li>标签用 IDS 与 K 解出 n1、n2，再用 n1、n2 计算密文 D 回送读写器</li></ol></li></ul> <p>最后由读写器判断能否从 D 中解出静态标识符 ID 完成第二次认证。由于 n1、n2 与 IDS 的混淆，静态标识符是被安全传输的。需要注意的是，除读写器与标签外还有一个应用系统，合法的阅读器可通过 IDS 查询到标签的 K 和 ID，因此对读写器而言 ID 是已知的，D 中解出的 ID 可直接比对——EMAP 与 M²AP 的最后一步同理</p> <p>认证成功后 IDS 与密钥 K 同步更新，可有效防止中间人攻击</p> <img src="/assets/img/image-20241011164221959.5e4ecb7a.png"> <p>至此完成一轮完整认证，即&quot;提交 → 明文加密 → 密文解密（标签一次认证）、再加密 → 解密（读写器二次认证）&quot;的过程</p> <h4 id="emap"><a href="#emap" class="header-anchor">#</a> EMAP</h4> <blockquote><p>EMAP: An Efficient Mutual-Authentication Protocol for Low-Cost RFID Tags</p></blockquote> <p>认证流程与 LMAP 基本一致，同为 96 位 IDS 加四分的 96 位密钥 K</p> <img src="/assets/img/image-20241012142701252.b7a42e27.png"> <p>差异在于</p> <ul><li>密文计算方法不同，EMAP 未采用模 2^m 加法</li> <li>标签响应分成 D 与 E 两部分：D 用于认证，读写器通过能否从中解出期望的 n2 判断响应是否合法；E 用于传递静态标识符 ID，经 IDS、n1、n2 与 K 混淆后安全传输</li></ul> <p>IDS 更新策略</p> <img src="/assets/img/image-20241012144151335.5b4fbb59.png"> <p>密钥更新策略</p> <img src="/assets/img/image-20241012144427539.78a2a381.png"> <p>其中 Fp 为奇偶校验函数，KI 长 96 位，奇/偶位各 48 位</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="40.034ex" height="2.787ex" role="img" focusable="false" viewBox="0 -750 17695 1231.9" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-1.09ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D439" d="M48 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H742Q749 676 749 669Q749 664 736 557T722 447Q720 440 702 440H690Q683 445 683 453Q683 454 686 477T689 530Q689 560 682 579T663 610T626 626T575 633T503 634H480Q398 633 3 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(17306,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msub><mi>F</mi><mi>p</mi></msub><mo stretchy="false">(</mo><mi>K</mi><msubsup><mn>3</mn><mrow data-mjx-texclass="ORD"><mi>t</mi><mi>a</mi><mi>g</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msubsup><mo data-mjx-texclass="ORD" stretchy="false">|</mo><mo data-mjx-texclass="ORD" stretchy="false">|</mo><msub><mi>F</mi><mi>p</mi></msub><mo stretchy="false">(</mo><mi>K</mi><msubsup><mn>1</mn><mrow data-mjx-texclass="ORD"><mi>t</mi><mi>a</mi><mi>g</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo></mrow><mrow data-mjx-texclass="ORD"><mi>n</mi></mrow></msubsup><mo data-mjx-texclass="ORD" stretchy="false">|</mo><mo data-mjx-texclass="ORD" stretchy="false">|</mo><mi>I</mi><msub><mi>D</mi><mrow data-mjx-texclass="ORD"><mi>t</mi><mi>a</mi><mi>g</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo></mrow></msub><mo stretchy="false">(</mo><mn>49</mn><mo>:</mo><mn>96</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>三个数以某种规则拼接为一个 96 位的数</p> <h4 id="mmap"><a href="#mmap" class="header-anchor">#</a> MMAP</h4> <blockquote><p>M²AP: A Minimalist Mutual-Authentication Protocol for Low-Cost RFID Tags</p></blockquote> <p>认证过程与 EMAP 类似，读写器发送 A、B、C，标签响应 D、E</p> <img src="/assets/img/image-20241012151827460.bd52b894.png"> <p>IDS 更新</p> <img src="/assets/img/image-20241012152052738.5c128f2a.png"> <p>密钥更新</p> <img src="/assets/img/image-20241012152115790.34faae39.png"> <p>M²AP 是三者中最精简的方案，进一步压缩了参与计算的变量与消息结构，而标签端的算子集合始终维持在有限的按位操作范围内</p> <h3 id="sasi-协议"><a href="#sasi-协议" class="header-anchor">#</a> SASI 协议</h3> <blockquote><p>SASI: A New Ultralightweight RFID Authentication Protocol Providing Strong Authentication and Strong Integrity</p></blockquote> <p>认证过程与 UMAP 协议族一样，合法读写器可通过标签 IDS 从可信系统 V 获取该标签的密钥 K 与静态标识符 ID</p> <img src="/assets/img/image-20241012152328404.43bffa62.png"> <p>与 UMAP 的显著差异是</p> <ul><li>引入 Rot 运算，对密钥 K1、K2 进行旋转以实现加密和密钥更新</li> <li>使用 K1、K2 两个 96 位密钥，为抵抗去同步攻击，IDS、K1、K2 均需存储新旧两份，故标签容量为 96 × 3 × 2 + 96 = 672 位</li></ul> <img src="/assets/img/image-20241017170813948.0635c4ff.png"> <p>另有一类基于置换的安全认证协议可抵抗去同步攻击，而前述 UMAPs 与 SASI 均无法抵抗</p> <ul><li>RCIA：Robust Confidentiality, Integrity, and Authentication</li> <li>RRAP：Reconstruction-based RFID Authentication Protocol</li></ul> <p>所谓去同步攻击，指的是攻击者通过破坏服务器端与标签端密钥/伪名的一致性，使二者不再同步，进而让合法标签在后续会话中被判定为非法并永久拒绝提供服务。这也是 SASI 必须为 IDS、K1、K2 各保留新旧两份副本的原因——一旦更新失败或被打断，仍可回退到上一轮的旧值完成认证</p> <h3 id="hb-协议族"><a href="#hb-协议族" class="header-anchor">#</a> HB 协议族</h3> <blockquote><p>Secure human identification protocols</p></blockquote> <p>由 Hopper 和 Blum 于 2001 年提出，用于在 RFID 标签这类低计算资源设备中实现安全身份认证，以高效和简单的设计著称</p> <p>由于 HB 协议族基于 LPN 问题，其被普遍认为是抗量子的方向</p> <h4 id="lpn-问题"><a href="#lpn-问题" class="header-anchor">#</a> LPN 问题</h4> <blockquote><p>LPN（Learning Parity with Noise），噪声环境下的学习校验，属于基于格的密码学</p></blockquote> <p>LPN 的向量元素均为二进制，即整个系统是模 2 的，其轻量性正来源于此</p> <p>形式化描述</p> <ul><li>设有秘密向量 s，和一组长度为 n 的随机向量 aᵢ</li> <li>计算二者内积 s · aᵢ，并在结果上加入噪声 eᵢ，其中 eᵢ 服从某个噪声分布（常为伯努利分布，通常以微小概率取 1）</li></ul> <p>由此获得一组观测值</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="14.057ex" height="1.783ex" role="img" focusable="false" viewBox="0 -583 6213.3 788" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.464ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(523,-150) scale(0.707)"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(1094.7,0)"><path data-c="3D" ebkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msub><mi>y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>a</mi><mi>i</mi></msub><mo>⋅</mo><mi>s</mi><mo>+</mo><msub><mi>e</mi><mi>i</mi></msub></math></mjx-assistive-mml></mjx-container><p>其中 yᵢ 是一个比特值。执行 n 轮后，一组观测值蕴含的噪声将符合某种概率分布，而破解的目标就是通过观测值 yᵢ 恢复出秘密向量 s</p> <h4 id="hb-协议"><a href="#hb-协议" class="header-anchor">#</a> HB+ 协议</h4> <blockquote><p>Authenticating Pervasive Devices with Human Protocols</p></blockquote> <p>以 HB+ 为例，其采用<strong>提交-挑战-响应-认证</strong>的双密钥结构应用 LPN 问题</p> <ol><li>初始化：双方共享两个密钥 X 和 Y（长为 k 的向量）</li> <li>提交：标签发送随机向量 b 给读写器</li> <li>挑战：读写器发送随机向量 a 给标签</li> <li>认证：标签根据概率模型生成独位的噪声 r
<ul><li>标签计算 <code>z = ax+by+r</code>，并将 z 发回读写器</li> <li>读写器解出 <code>r = ax+by+z</code>，该过程重复 k 轮，最后对 k 长的噪声向量 R 进行检验以判断标签是否合法</li></ul></li></ol> <p>显然这是读写器对标签的单向认证，标签不具备识别合法读写器的能力；且标签需要能够生成随机向量，其资源是否足够受限需要打个问号</p> <h4 id="grs-攻击"><a href="#grs-攻击" class="header-anchor">#</a> GRS 攻击</h4> <blockquote><p>An Active Attack Against HB+: A Provably Secure Lightweight Authentication Protocol</p></blockquote> <p>LPN 问题虽被证明抗量子，但其主要攻击面在于中间人攻击。因为多数 HB 协议族实现的是单边认证，标签阅读器通信总是被认为安全，只考虑 RFID 标签被模拟的可能性。然而物联网需要双向认证，使用两个独立的认证协议会导致中继攻击、重放攻击、非同步攻击和会话劫持的风险上升</p> <p>GRS 攻击的步骤</p> <ol><li>被动监听：监听标签与读写器之间的认证交互，收集多个挑战向量 <code>a</code> 与响应值 <code>z</code></li> <li>主动篡改挑战向量：修改部分挑战向量并监听相应响应</li> <li>噪声消除：利用收集的数据做统计分析，逐步消除噪声 <code>r</code> 的影响，恢复出密钥 <code>x</code></li></ol> <p>常见的抵抗方式是基于 HB 协议实现双向认证，并结合距离边界协议（DB 协议）</p> <h4 id="双向认证"><a href="#双向认证" class="header-anchor">#</a> 双向认证</h4> <blockquote><p>An Ultra-Lightweight Mutual Authentication Protocol Based on LPN Problem with Distance Fraud Resistant</p></blockquote> <p>21 年提出的一个基于 HB 协议族与 LPN 问题的双向认证方案，结合距离边界协议工作以抵抗 GRS 攻击</p> <ul><li>对称密钥体系，共享密钥矩阵 X</li> <li>双向认证过程类似 TCP 三次握手，即在响应的同时发起挑战</li></ul> <p>整体是一个&quot;发起挑战 → 明文加密并发起挑战 → 解密密文（读写器一次认证）、明文加密 → 解密密文（标签二次认证）&quot;的过程</p> <h2 id="轻量级协议"><a href="#轻量级协议" class="header-anchor">#</a> 轻量级协议</h2> <p>多数轻量级安全认证协议是为满足 ISO/IEC18000（EPC C1Gen2）标准而提出的，该类型协议多使用符合标准的简单加密手段，主要包括 CRC 与 RNG</p> <ul><li><code>Strengthening EPC tags against cloning</code></li> <li><code>Enhancing security of EPCglobal gen-2 RFID tag against traceability and cloning</code></li> <li><code>Mutual authentication protocol for RFID conforming to EPC Class 1 Generation 2 standards</code></li> <li><code>An efficient mutual authentication scheme for EPCglobal class-1 generation-2 RFID system</code></li> <li><code>Cryptanalysis of a novel authentication protocol conforming to EPC-C1G2 standard</code></li> <li><code>Securing RFID systems conforming to EPC Class 1 Generation 2 standard</code></li></ul> <h3 id="epc-c1gen2-标准"><a href="#epc-c1gen2-标准" class="header-anchor">#</a> EPC C1Gen2 标准</h3> <blockquote><p>Strengthening EPC tags against cloning</p></blockquote> <p>EPC，Electronic Product Code，专注于产品的唯一识别与追踪，最早的轻量协议即用于此类设备。EPCGlobal Class1 Generation2 UHF 标准（简称 C1Gen2 或 EPCglobal）由 GS1 与 EPC global 发布，定义了超高频 RFID 标签与读写器之间的通信协议，广泛应用于供应链、仓储、物流和零售</p> <p>其主要特征</p> <ul><li>Gen-2 标签是被动的，电力来自读写器发射的电磁场</li> <li>工作于 UHF 频段（800–960 MHz），通信范围可达 2~10 m</li> <li>支持片上 PRNG 与 CRC 计算</li> <li>一旦标签接收到带有有效 32 位杀伤 PIN 的命令可使标签永久失效</li> <li>仅在接收到有效 32 位访问 PIN 后才允许读写标签内存</li></ul> <p>但需要注意，读写器无法单独判断标签是否合法，通常只能查询标识符是否在系统中，如下是一个简单认证</p> <img src="/assets/img/image-20241027205749327.ab8fcbb9.png"> <p>问题在于读写器没有严格的时序划分：攻击者只要持续回送 1，读写器就会认为当前标签一直合法，从而失去正确性判断</p> <p>于是有修正的一版协议</p> <img src="/assets/img/image-20241027210133878.30da0571.png"> <p>BasicTagAuth 引入伪造的 PIN 码（spurious PINs）去试探标签：读写器发送一组 PIN，其中仅下标 j 的那个为标签对应的合法 PIN，标签合法当且仅当对 P[j] 响应 1 而对其余均响应 0。这在一定程度上增强了读写器对标签的认证，抵抗克隆攻击</p> <p>文中还提出一种加强方案，将 32 位 PIN 二分为 16 位的 A 和 K，分两步完成认证</p> <img src="/assets/img/image-20241027220010680.30b02da4.png"> <p>由于读写器并不总是可信（存在中间人攻击），作者引入第三方可信系统 V 存储 PIN 码，读写器 R 仅作为传输者，其余思路与 BasicTagAuth 基本一致</p> <ul><li>缺乏安全的身份验证会导致 EPC 泄露给恶意读写器，此即略读攻击（skimming attack）</li></ul> <img src="/assets/img/image-20241027220649841.2e9e6a8d.png"> <p>引入 V 后还可检测 R 的合法性：V 可判断该读写器是否具备对 T 的访问权限，再决定是否继续认证</p> <ul><li>基于上述协议还衍生出一种分布式 RFID 认证方案 FCPD（Fulfillment-Conditional PIN Distribution），即令可信中心 V 作为结点，读写器作为分布设备向其请求服务以完成对 T 的认证</li></ul> <p>但此类方案并未考虑窃听与隐私问题，缺少对隐私入侵和秘密泄露的防护</p> <h3 id="prng-和-crc"><a href="#prng-和-crc" class="header-anchor">#</a> PRNG 和 CRC</h3> <blockquote><p>Enhancing security of EPCglobal gen-2 RFID tag against traceability and cloning</p></blockquote> <p>EPCGlobal C1Gen2 标签仅支持简单密码原语，本文基于伪随机数生成器、循环冗余校验以及伪名，提出一种抗克隆、防滥用的协议</p> <p>作者的假设是读写器永远不应被完全信任，系统中唯一可信的是后端服务器，所有秘密仅保存在标签与后端数据库中，读写器通过标签的 meta-ID 获取更多信息</p> <ul><li>这与 UMAPs 协议族中的 IDS 扮演同样的角色：读写器通过它查询标签的 K 和 ID</li></ul> <p>这样的好处是</p> <ul><li>问责与访问控制：后端负责查找对象信息，因此可决定谁能获得哪些信息，并保留统计能力</li> <li>读写器到标签的认证：标签查询最为频繁，而读写器必须接触后端才能获知对象信息，因此在此路径上无需额外验证读写器身份，只需在发送 meta-ID 前要求后端对读写器做一次认证</li></ul> <p>安全协议中的变量通常要满足两点：一个值不应被重复使用，且一个值不应可预测</p> <p>保护标签与读写器之间传输的数据以防窃听，最显而易见的办法是使用加密函数，而最简单的加密函数就是流密码中广泛使用的异或。这样做问题随即转化为密钥管理，即确保每个会话都使用新的加密密钥。文中采用伪随机数生成器实现密钥更新：除首轮 seed 外，之后每轮密钥均基于上一轮会话密钥生成</p> <img src="/assets/img/image-20241028165622900.e5cc415e.png"> <p>该更新需在标签与服务器之间保持同步，后续所有通信均基于同步后的会话密钥。由于读写器不可信，它只能作为传输者接收加密形式的 EPC（即前述 meta-ID）</p> <p>认证分为三个子协议</p> <ol><li>Tag querying protocol</li> <li>Tag access protocol</li> <li>Key updating protocol</li></ol> <p>Tag querying protocol</p> <img src="/assets/img/image-20241028172832082.68bd4f65.png"> <ol><li>读写器发起查询，携带随机数 r'</li> <li>标签将自身标识码 EPC 与 r、r' 异或（不足位以 1 填充），再做 CRC 编码并与会话密钥 Ki 异或得到密文 M1，连同自己生成的随机数 r 发给读写器</li> <li>读写器与服务器之间完成双向认证：服务器用共享的 Ki 解出 CRC 编码 M1'，再依据该标签的 EPC 与 r、r' 计算正确的 CRC 进行校验，并将反馈 info 返回给读写器</li></ol> <p>Tag access protocol：由于读写器不可信，info 也需加密传输。这一步实现标签对服务器的验证，即对 PIN 码的认证</p> <ol><li>S → R: M2 = CRC(1 || EPC || PIN || r) ⊕ Ki</li> <li>R → T: 转发认证令牌 M2</li> <li>T: 验证 M2 ⊕ Ki = CRC(1 || EPC || PIN || r) ?</li></ol> <p>实质上是把第一步中读写器生成的随机数 r' 替换成了 PIN</p> <p>Key updating protocol：一轮认证后标签与服务器同步更新密钥，指令由读写器下达（f 为伪随机数生成函数）</p> <ol><li>R → T, S: 'End Session'</li> <li>T: Kᵢ₊₁ = f(Kᵢ)</li> <li>S: Kᵢ₊₁ = f(Kᵢ)</li></ol> <p>该协议与 Juels 方案的对比（后者基本未考虑加密传输，仅是提出一个模型）</p> <img src="/assets/img/image-20241028175219751.64716b8f.png"> <h3 id="cc-协议"><a href="#cc-协议" class="header-anchor">#</a> CC 协议</h3> <blockquote><p>Mutual authentication protocol for RFID conforming to EPC Class 1 Generation 2 standards</p></blockquote> <p>文中先分析了两种前人的方案。其一是 Karthikeyan–Nesterenko 的方案</p> <ul><li><code>RFID security without extensive cryptography</code></li></ul> <img src="/assets/img/image-20241028202904339.b76767c9.png"> <p>该方案无法抵抗 DoS、重放和个人跟踪攻击：标签更新密钥时不校验收到的值 Z，攻击者可用旧值 Z' 或任意随机值 Z* 替换而不被察觉，导致标签将密钥误更新为 K* = Z*(M₂)⁻¹，此后合法读写器与标签再也无法互相验证，DoS 达成；若攻击者用旧的 Z~ 替换，则可在后续会话中重放 Y~ 欺骗标签，甚至可记录多个会话的数据反复发起攻击以持续访问标签（即实现追踪），违背了匿名属性</p> <p>所谓匿名属性，是指标签 ID 不可被人为标记或与某个特定值 Z~ 相关联，即参与者的身份信息受到保护，无法通过常规手段被追踪或关联到特定用户</p> <p>其二是 Duc 等人的方案，即上一小节的 PRNG + CRC 方案</p> <img src="/assets/img/image-20241028204029402.704499a6.png"> <p>其不足是不能抵抗针对标签和读写器的 DoS 攻击，无法检测标签伪装，且不提供前向保密</p> <p>前向保密（Forward Secrecy）指即使长期密钥泄露也无法解密过去的会话数据，这一特性旨在防止攻击者在获取密钥后回溯解密此前的通信内容</p> <p>最后作者提出本文建议的协议，即 CC 协议</p> <img src="/assets/img/image-20241028204649988.f1d07eee.png"> <p>与一些同类型协议的比较</p> <img src="/assets/img/image-20241028204742609.67b605d6.png"> <h2 id="发展与展望"><a href="#发展与展望" class="header-anchor">#</a> 发展与展望</h2> <p>轻量协议的安全性评价维度基本固定，通常从以下几点展开：机密性（数据加密传输）、匿名性/抗追踪（是否引入随机数产生响应）、抗欺骗（能否以历史数据伪造标签）、抗重放、可扩展性（服务器密钥搜索开销）、抗中间人（多见于单向认证，含恶意查询）、抗 DoS、抗去同步（属 DoS 的一种，通过使两端密钥不同步让标签拒绝服务）、是否双向认证、是否前向保密（有无密钥更新策略、更新是否单向）</p> <p>未来的方向主要有二类</p> <ul><li>后量子轻量加密：在格上的轻量加密，如 LPN 问题、LWE 问题、同态加密等</li> <li>与区块链技术结合，借鉴去中心化思想和哈希链的加密方式</li></ul> <p>此外还可考虑矩阵上的轻量加密</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/14, 21:33:42</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/07937a/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">签名算法</div></a> <a href="/pages/cfdbf4/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">前沿密码研讨</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
