p>很多教程里会使用 Arduino IDE 去开发 ESP32，其实就是在 GUI 里集成了 IDF Cli。IDF 指 IoT Development Framework 物联网开发框架 —— 一个以 idf.py 为入口的 Python 包</p> <h3 id="esp-idf"><a href="#esp-idf" class="header-anchor">#</a> ESP-IDF</h3> <blockquote><p>ESP-IDF 的 venv 要用 python3.12</p></blockquote> <p>用 uv 管理 python 环境</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>uv python <span class="token function">install</span> <span class="token number">3.12</span> <span class="token parameter variable">--default</span>
python <span class="token parameter variable">-V</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>下载前置依赖</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>xcode-select <span class="token parameter variable">--install</span>
brew <span class="token function">install</span> cmake ninja dfu-util ccache
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>克隆源码</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> ~/Workspace
<span class="token function">mkdir</span> <span class="token parameter variable">-p</span> esp
<span class="token builtin class-name">cd</span> esp
<span class="token function">git</span> clone <span class="token parameter variable">-b</span> v5.4 <span class="token parameter variable">--depth</span> <span class="token number">1</span> https://github.com/espressif/esp-idf.git
<span class="token builtin class-name">cd</span> esp-idf
<span class="token function">git</span> submodule update <span class="token parameter variable">--init</span> <span class="token parameter variable">--recursive</span> <span class="token parameter variable">--depth</span> <span class="token number">1</span> <span class="token parameter variable">--jobs</span> <span class="token number">8</span> <span class="token parameter variable">--progress</span> <span class="token comment"># 下载子模块</span>
<span class="token function">git</span> submodule status <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-c</span> <span class="token string">'^-'</span> <span class="token comment"># 输出 0 OK</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p><code>install.sh</code> 安装工具链（注意 python3.12）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>./install.sh esp32s3

xtensa-esp32s3-elf-gcc <span class="token parameter variable">--version</span>
<span class="token function">which</span> esptool.py
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="esptool"><a href="#esptool" class="header-anchor">#</a> esptool</h3> <blockquote><p>esptool 是 esp-idf 携带的烧录工具，用于读写固件</p></blockquote> <p>在 export.sh 并且正确识别到固件 <code>/dev/cu.usbmodem1201</code> 后，使用 esptool 查看其容量和 flash 型号</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>northboat@bogon esp-idf % esptool.py <span class="token parameter variable">--chip</span> esp32s3 <span class="token parameter variable">-p</span> /dev/cu.usbmodem1201 flash_id

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br></div></div><p>备份出厂系统（16MB）</p> <ul><li>完整的存储容量由固件信息 <code>Detected flash size: 32MB</code> 得知有 32MB</li> <li>为什么只备份 16MB？分区表里最后的一行 <code>storage, data, spiffs, 0x800000, 8M</code>，初始地址 8MB + 偏移量 8MB 的到出厂固件布局的使用上限（这套固件只设计了前 16MB）</li></ul> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>esptool.py <span class="token parameter variable">--chip</span> esp32s3 <span class="token parameter variable">-p</span> /dev/cu.usbmodem1201 flash_id

esptool.py <span class="token parameter variable">--chip</span> esp32s3 <span class="token parameter variable">-p</span> /dev/cu.usbmodem1201 <span class="token punctuation">\</span>
  read_flash <span class="token number">0</span> 0x1000000 ~/Workspace/esp/factory_backup_16m.bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="freertos"><a href="#freertos" class="header-anchor">#</a> FreeRTOS</h3> <p>ESP32-S3 的内核（几 KB），支持可抢占的任务和线程，单地址空间（读 cache 访问 flash），任务各有栈，通过主程序 <code>void app_main(void)</code> 载入</p> <h2 id="固件开发"><a href="#固件开发" class="header-anchor">#</a> 固件开发</h2> <h3 id="hello-world"><a href="#hello-world" class="header-anchor">#</a> hello-world</h3> <p>新建工程</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>idf.py create-project hello
<span class="token builtin class-name">cd</span> hello
idf.py set-target esp32s3
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>编译</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>idf.py build
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>产物在 <code>build/</code> 下，<code>bootloader.bin</code>、<code>partition-table.bin</code>、<code>hello.bin</code> 三个文件分别对应烧录地址 0x0、0x8000、0x10000</li></ul> <p>烧录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ls</span> /dev/cu.*
idf.py <span class="token parameter variable">-p</span> /dev/cu.usbmodem1101 flash
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>看日志</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>idf.py <span class="token parameter variable">-p</span> /dev/cu.usbmodem1101 monitor
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>Ctrl+]</code> 退出，原生 USB 下 <code>Ctrl+T Ctrl+R</code> 软复位。和烧录合成一条也是一样的</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>idf.py <span class="token parameter variable">-p</span> /dev/cu.usbmodem1101 flash monitor
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>如果只烧录现成的 bin，不装 IDF 也能烧，单独装 esptool 即可</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>brew <span class="token function">install</span> esptool
esptool.py <span class="token parameter variable">--chip</span> esp32s3 <span class="token parameter variable">-p</span> /dev/cu.usbmodem1101 <span class="token parameter variable">-b</span> <span class="token number">460800</span> <span class="token punctuation">\</span>
  write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 hello.bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>也可以先合并成单个文件再一把烧</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>esptool.py <span class="token parameter variable">--chip</span> esp32s3 merge_bin <span class="token parameter variable">-o</span> merged.bin <span class="token punctuation">\</span>
  <span class="token parameter variable">--flash_mode</span> dio <span class="token parameter variable">--flash_size</span> 8MB <span class="token punctuation">\</span>
  0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 hello.bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>卸载 esp-idf</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">rm</span> <span class="token parameter variable">-rf</span> ~/esp ~/.espressif
