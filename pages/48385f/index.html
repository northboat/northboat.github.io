0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>yes</td> <td>yes*</td> <td>no</td> <td>index</td></tr> <tr><td><a href="https://github.com/emirpasic/gods#queues" target="_blank" rel="nofollow noopener noreferrer">Queues<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td></td> <td></td> <td></td> <td></td> <td></td></tr> <tr><td></td> <td><a href="https://github.com/emirpasic/gods#linkedlistqueue" target="_blank" rel="nofollow noopener noreferrer">LinkedListQueue<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>yes</td> <td>yes</td> <td>no</td> <td>index</td></tr> <tr><td></td> <td><a href="https://github.com/emirpasic/gods#arrayqueue" target="_blank" rel="nofollow noopener noreferrer">ArrayQueue<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>yes</td> <td>yes*</td> <td>no</td> <td>index</td></tr> <tr><td></td> <td><a href="https://github.com/emirpasic/gods#circularbuffer" target="_blank" rel="nofollow noopener noreferrer">CircularBuffer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>yes</td> <td>yes*</td> <td>no</td> <td>index</td></tr> <tr><td></td> <td><a href="https://github.com/emirpasic/gods#priorityqueue" target="_blank" rel="nofollow noopener noreferrer">PriorityQueue<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>yes</td> <td>yes*</td> <td>no</td> <td>index</td></tr> <tr><td></td> <td></td> <td></td> <td>*reversible</td> <td></td> <td>*bidirectional</td></tr></tbody></table> <h2 id="并发编程"><a href="#并发编程" class="header-anchor">#</a> 并发编程</h2> <p>Go 语言的协程（goroutine）和通道（channel）是其并发模型的核心</p> <h3 id="goroutine-协程"><a href="#goroutine-协程" class="header-anchor">#</a> Goroutine 协程</h3> <p>Goroutine 是 Go 语言中的一种轻量级线程，它由 Go 运行时（runtime）管理，用户不需要手动管理线程。相比操作系统级别的线程，Goroutine 更加高效，可以轻松创建数十万个 Goroutine，而不会导致大量的资源消耗</p> <p>协程为什么比线程快</p> <table><thead><tr><th>特性</th> <th>协程</th> <th>线程</th></tr></thead> <tbody><tr><td>内存消耗</td> <td>非常小（&lt; 2KB），可动态扩展至 1GB</td> <td>较大（&gt; 1MB）</td></tr> <tr><td>创建 / 销毁</td> <td>由 GO 运行时管理（GPM 模型）</td> <td>由 OS 管理</td></tr> <tr><td>上下文切换</td> <td>都在用户态完成</td> <td>需要在用户态和内核态切换</td></tr> <tr><td>通信方式</td> <td>通过 Channel 通信</td> <td>主要靠共享内存</td></tr></tbody></table> <p>Go 使用 go 关键字创建一个协程</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">import</span> <span class="token punctuation">(</span>
    <span class="token string">&quot;time&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token function">TestGoroutine</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">go</span> <span class="token function">TestInterface</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">3</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>Main 函数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    learning<span class="token punctuation">.</span><span class="token function">TestGoroutine</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>输出</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>I<span class="token string">'m Buddy, I'</span>m a Dog
The Dog Buddy is running
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>注意： <code>main</code>函数是主 Goroutine，若它执行完毕，所有子 Goroutine 也会立即结束，因此需要<code>time.Sleep</code>等待子 Goroutine 执行（这里手动等了 3s）</p> <p>也就是说，如果不等，有可能子协程并没有执行，整个程序就跑完了，非阻塞，这和 Java 的线程很不一样（在 Java 里，主线程是需要等待子线程执行完毕才结束的）</p> <p>在 Go 中，Goroutine 默认是并发的，而不是并行的，如果要让 Go 充分利用多核 CPU 并行执行，需要使用设置 CPU 核心数</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">import</span> <span class="token string">&quot;runtime&quot;</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    runtime<span class="token punctuation">.</span><span class="token function">GOMAXPROCS</span><span class="token punctuation">(</span>runtime<span class="token punctuation">.</span><span class="token function">NumCPU</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">// 设置使用 CPU 核心数</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="channel-通道与-sse-传输"><a href="#channel-通道与-sse-传输" class="header-anchor">#</a> Channel 通道与 SSE 传输</h3> <p>Channel 是 Go 语言中用于协程之间通信的数据结构，可在多个 Goroutine 之间传输数据，Channel 的存在意义</p> <ol><li>Goroutine 之间共享内存可能导致数据竞争，Channel 提供了一种安全的数据传输方式</li> <li>Go 语言提倡通过通信共享内存（CSP 模型，Conmunicating Sequential Process），而不是通过共享内存进行通信</li></ol> <p>通过 make chan 关键字创建通道，可指定数据类型是 any 任意</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> any<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>发送和接收消息</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">TestChannel</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch1 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">)</span>
    ch2 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        ch1 <span class="token operator">&lt;-</span> <span class="token number">42</span> <span class="token comment">// 发送数据</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch2 <span class="token operator">&lt;-</span> <span class="token string">&quot;nmsl&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    num <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch1     <span class="token comment">// 接收数据</span>
    str <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch2     <span class="token comment">// 会被阻塞 1s</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>num<span class="token punctuation">)</span> <span class="token comment">// 输出 42</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>str<span class="token punctuation">)</span> <span class="token comment">// 输出 nmsl</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>Channel 的阻塞特性</p> <ul><li>发送操作 <code>&lt;-</code> 会阻塞，直到数据被接收</li> <li>接收操作 <code>&lt;-</code> 会阻塞，直到数据被发送</li></ul> <p>如上述<code>str := &lt;-ch2</code>会被阻塞 1s 才输出</p> <p>单向 Channel</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">sendData</span><span class="token punctuation">(</span>ch <span class="token keyword">chan</span><span class="token operator">&lt;-</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 只能发送数据</span>
    ch <span class="token operator">&lt;-</span> <span class="token number">100</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">receiveData</span><span class="token punctuation">(</span>ch <span class="token operator">&lt;-</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 只能接收数据</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span>ch<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>带缓冲的 Channel：默认的 Channel 是无缓冲的，发送和接收必须同步进行，如果想要异步通信，可以使用带缓冲的 Channel</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">)</span> <span class="token comment">// 创建一个最多存储 3 个 int 的缓冲通道</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span> <span class="token comment">// 容量为 2</span>

    ch <span class="token operator">&lt;-</span> <span class="token number">1</span>
    ch <span class="token operator">&lt;-</span> <span class="token number">2</span>
    <span class="token comment">// ch &lt;- 3 // 若继续写入，会发生死锁（fatal error）</span>

    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span> ch<span class="token punctuation">)</span> <span class="token comment">// 1</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">&lt;-</span> ch<span class="token punctuation">)</span> <span class="token comment">// 2</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>与智能体的交互，大多都是走的 SSE 流，通过 chan any 管道和<code>&lt;-</code>操作符接收 LLM 的输出并实现“一帧帧”的输出</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token operator">&lt;-</span> ch <span class="token comment">// 只同步数据，不进行接收</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以理解为，清除管道中的数据</p> <h3 id="select-语句和超时控制"><a href="#select-语句和超时控制" class="header-anchor">#</a> Select 语句和超时控制</h3> <p><code>select</code>语句类似<code>switch</code>，专用于处理<code>channel</code>的并发通信</p> <ul><li><code>select</code>会等待某个<code>case</code>变为可用（即<code>channel</code>有数据）</li> <li><code>default</code>分支可选，如果所有<code>case</code>都阻塞，<code>default</code>立即执行</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ch1 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>
    ch2 <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">chan</span> <span class="token builtin">string</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">2</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch1 <span class="token operator">&lt;-</span> <span class="token string">&quot;Message from ch1&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
        ch2 <span class="token operator">&lt;-</span> <span class="token string">&quot;Message from ch2&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">select</span> <span class="token punctuation">{</span>
    <span class="token keyword">case</span> msg1 <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch1<span class="token punctuation">:</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Received:&quot;</span><span class="token punctuation">,</span> msg1<span class="token punctuation">)</span>
    <span class="token keyword">case</span> msg2 <span class="token operator">:=</span> <span class="token operator">&lt;-</span>ch2<span class="token punctuation">:</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Received:&quot;</span><span class="token punctuation">,</span> msg2<span class="token punctuation">)</span>
    <span class="token keyword">case</span> <span class="token operator">&lt;-</span>time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span><span class="token number">3</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span><span class="token punctuation">:</span> <span class="token comment">// 超时控制</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Timeout!&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><h3 id="gpm-调度机制"><a href="#gpm-调度机制" class="header-anchor">#</a> GPM 调度机制</h3> <blockquote><p>Goroutine、Processor and Machine，协程进程和机器</p></blockquote> <p>GPM 调度机制：GPM 是 Go 语言运行时（runtime）用于管理 Goroutine 并发执行的调度模型，它由 Goroutine、Processor 和 Machine 组成</p> <table><thead><tr><th>组件</th> <th>作用</th></tr></thead> <tbody><tr><td>G（Goroutine）</td> <td>Go 协程，执行具体的任务</td></tr> <tr><td>P（Processor）</td> <td>逻辑处理器，负责调度 Goroutine 并提供执行环境</td></tr> <tr><td>M（Machine**）**</td> <td>OS 线程，代表操作系统的线程，运行 Go 代码</td></tr></tbody></table> <p>GPM 关系图</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>多个 Goroutine 绑定到 Processor，Processor 绑定到 Machine，Machine 由 OS 线程提供

OS 线程（M1）    OS 线程（M2）  <span class="token punctuation">..</span>.
    <span class="token operator">|</span>              <span class="token operator">|</span>
Processor（P1）  Processor（P2） <span class="token punctuation">..</span>.
    <span class="token operator">|</span>              <span class="token operator">|</span>
Goroutine（G1, G2, G3<span class="token punctuation">..</span>.）
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h2 id="后端开发"><a href="#后端开发" class="header-anchor">#</a> 后端开发</h2> <h3 id="gin-基础"><a href="#gin-基础" class="header-anchor">#</a> Gin 基础</h3> <p>Gin 依赖：在项目根目录通过 go get 命令导入 gin</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>go get <span class="token parameter variable">-u</span> github.com/gin-gonic/gin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在 Main 函数中定义并启动 Gin Web 服务器，并注入一个简单的 ping 接口</p> <ul><li>在浏览器中访问<code>localhost://8080/ping</code>就会得到 Json 格式的返回<code>{&quot;message&quot;:&quot;pong&quot;}</code></li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">package</span> main

<span class="token keyword">import</span> <span class="token punctuation">(</span>
	<span class="token string">&quot;github.com/gin-gonic/gin&quot;</span>
	<span class="token string">&quot;net/http&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	r <span class="token operator">:=</span> gin<span class="token punctuation">.</span><span class="token function">Default</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 定义一个简单的接口</span>
	r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/ping&quot;</span><span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> gin<span class="token punctuation">.</span>H<span class="token punctuation">{</span>
			<span class="token string">&quot;message&quot;</span><span class="token punctuation">:</span> <span class="token string">&quot;pong&quot;</span><span class="token punctuation">,</span>
		<span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span><span class="token punctuation">)</span>

	<span class="token comment">// 启动服务，监听 8080 端口</span>
	r<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span><span class="token string">&quot;:8080&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>yaml 解析：安装 yaml 文件解析工具</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>go get gopkg.in/yaml.v3
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在 config 目录下编写配置文件 config.yaml，等同于 application.yaml</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">12345</span>

<span class="token key atrule">mysql</span><span class="token punctuation">:</span>
  <span class="token key atrule">host</span><span class="token punctuation">:</span> <span class="token string">&quot;127.0.0.1&quot;</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">3306</span>
  <span class="token key atrule">user</span><span class="token punctuation">:</span> <span class="token string">&quot;root&quot;</span>
  <span class="token key atrule">password</span><span class="token punctuation">:</span> <span class="token string">&quot;&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>而后通过<code>yaml.v3</code>包解析 config.go，将配置写进全局变量 AppConfig 中，在项目中将统一使用这个全局变量 AppConfig 来实现项目的配置</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">package</span> config

<span class="token keyword">import</span> <span class="token punctuation">(</span>
    <span class="token string">&quot;fmt&quot;</span>
    <span class="token string">&quot;gopkg.in/yaml.v3&quot;</span>
    <span class="token string">&quot;os&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">type</span> Config <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Server ServerConfig <span class="token string">`yaml:&quot;server&quot;`</span>
    MySQL  MySQLConfig  <span class="token string">`yaml:&quot;mysql&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> ServerConfig <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Port <span class="token builtin">int</span>    <span class="token string">`yaml:&quot;port&quot;`</span>
    Host <span class="token builtin">string</span> <span class="token string">`yaml:&quot;host&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">type</span> MySQLConfig <span class="token keyword">struct</span> <span class="token punctuation">{</span>
    Host     <span class="token builtin">string</span> <span class="token string">`yaml:&quot;host&quot;`</span>
    Port     <span class="token builtin">int</span>    <span class="token string">`yaml:&quot;port&quot;`</span>
    Username <span class="token builtin">string</span> <span class="token string">`yaml:&quot;username&quot;`</span>
    Password <span class="token builtin">string</span> <span class="token string">`yaml:&quot;password&quot;`</span>
<span class="token punctuation">}</span>

<span class="token keyword">var</span> AppConfig Config

<span class="token keyword">func</span> <span class="token function">LoadConfig</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    file<span class="token punctuation">,</span> err <span class="token operator">:=</span> os<span class="token punctuation">.</span><span class="token function">ReadFile</span><span class="token punctuation">(</span><span class="token string">&quot;config/config.yaml&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span>fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;无法加载配置文件: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    err <span class="token operator">=</span> yaml<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span>file<span class="token punctuation">,</span> <span class="token operator">&amp;</span>AppConfig<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token function">panic</span><span class="token punctuation">(</span>fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;解析 YAML 失败: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br></div></div><p>routes 路由：Gin 开发 Web 接口时的标准函数写法</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">GetRank</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 处理请求的逻辑</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p><code>c *gin.Context</code></p> <ul><li>是这个函数的参数，类型是<code>gin.Context</code></li> <li>这个参数是 Gin 框架每次处理请求时传进来的上下文对象，类似于 Session</li> <li>它包含了请求信息、响应对象、路径参数、请求体、查询参数等</li></ul> <p><strong>接口函数没有返回值</strong>，是因为 Gin 的路由处理函数通常不直接返回值（路由信息已经在上下文中含了），而通过<code>c.JSON()</code>、<code>c.String()</code>等方法直接向客户端写响应，例如</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">GetRank</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// []model.StudentWithSubjectTag</span>
    c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> service<span class="token punctuation">.</span><span class="token function">GetStudentsSortedByAllSubjects</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">GetTop</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// map[string]model.StudentWithSubjectTag</span>
    c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span>http<span class="token punctuation">.</span>StatusOK<span class="token punctuation">,</span> service<span class="token punctuation">.</span><span class="token function">GetTopStudents</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>在 routes 中注册</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">SetupRouter</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">*</span>gin<span class="token punctuation">.</span>Engine <span class="token punctuation">{</span>
    r <span class="token operator">:=</span> gin<span class="token punctuation">.</span><span class="token function">Default</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/ping&quot;</span><span class="token punctuation">,</span> <span class="token keyword">func</span><span class="token punctuation">(</span>c <span class="token operator">*</span>gin<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        c<span class="token punctuation">.</span><span class="token function">JSON</span><span class="token punctuation">(</span><span class="token number">200</span><span class="token punctuation">,</span> gin<span class="token punctuation">.</span>H<span class="token punctuation">{</span>
            <span class="token string">&quot;message&quot;</span><span class="token punctuation">:</span> <span class="token string">&quot;pong&quot;</span><span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>

    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/getRank&quot;</span><span class="token punctuation">,</span> controller<span class="token punctuation">.</span>GetRank<span class="token punctuation">)</span>
    r<span class="token punctuation">.</span><span class="token function">GET</span><span class="token punctuation">(</span><span class="token string">&quot;/getTop&quot;</span><span class="token punctuation">,</span> controller<span class="token punctuation">.</span>GetTop<span class="token punctuation">)</span>
    <span class="token keyword">return</span> r
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>相应的，在 Main 函数中调用 SetupRouter 返回的 Gin 启动运行服务</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    config<span class="token punctuation">.</span><span class="token function">LoadConfig</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    r <span class="token operator">:=</span> routes<span class="token punctuation">.</span><span class="token function">SetupRouter</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token comment">// 启动服务，监听 12345 端口</span>
    r<span class="token punctuation">.</span><span class="token function">Run</span><span class="token punctuation">(</span><span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> strconv<span class="token punctuation">.</span><span class="token function">Itoa</span><span class="token punctuation">(</span>config<span class="token punctuation">.</span>AppConfig<span class="token punctuation">.</span>Server<span class="token punctuation">.</span>Port<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><blockquote><p>GDP 框架</p></blockquote> <p>上面也提到，不同于 Java 接口直接返回 ResultMap，Go 返回的是接口一个标准库中的 net.http.Handler 处理器，这个 Handler 具备处理用户 http 请求的能力，其实际上是一个具有 ServeHTTP 方法的对象</p> <p>向请求的上下文 ctx 中直接写入响应，实现接口返回的功能，这一逻辑通过实现 Handler 接口实现，通过内置的结构体，完成以下逻辑再由统一的工厂创建</p> <ol><li>Init</li> <li>InitBase</li> <li>OnExecute</li></ol> <p>在 routes 中，接口绑定的就是工厂创建的一个个 Handler，Controller 通过实现 Handler 接口实现多态和 IoC</p> <h3 id="gorm"><a href="#gorm" class="header-anchor">#</a> GORM</h3> <blockquote><p><a href="https://gorm.io/zh_CN/docs/index.html" target="_blank" rel="nofollow noopener noreferrer">GORM 指南 | GORM - The fantastic ORM library for Golang, aims to be developer friendly.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>一个样例，因为同时涉及两张表的修改，这里开启一个 DB 事务进行操作</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// UpdateEnvBaseInfo 更新环境基本信息</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">UpdateEnvBaseInfo</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>api<span class="token punctuation">.</span>EnvBaseInfoUpdateReq<span class="token punctuation">)</span> <span class="token punctuation">(</span>err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	env<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">getEnvInstanceById</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">.</span>EnvId<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询实例错误: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">=</span> DefaultAppController<span class="token punctuation">.</span><span class="token function">AllowAppIdOperate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> env<span class="token punctuation">,</span> app<span class="token punctuation">.</span>AppPermissionWrite<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;当前 appid 不具备写权限: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">=</span> envInstance<span class="token punctuation">.</span><span class="token function">AllocOperate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> env<span class="token punctuation">.</span>Username<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;非环境所有人无权限修改环境信息: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>

	<span class="token comment">// 1. 参数校验（事务前）</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdeName <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> req<span class="token punctuation">.</span>IdeName<span class="token punctuation">.</span>Value <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;IdeName 不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>EnvName <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> req<span class="token punctuation">.</span>EnvName<span class="token punctuation">.</span>Value <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境名称不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdePath <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> req<span class="token punctuation">.</span>IdePath<span class="token punctuation">.</span>Value <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;IDE 默认路径不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 2. 统计 devEnvironmentInstance 表的更新</span>
	updates <span class="token operator">:=</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>TeamEnv <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span> <span class="token comment">// 只改团队环境状态，只有 AI 容器可被设置，非 AI 环境会 set 报错</span>
		remark<span class="token punctuation">,</span> errSet <span class="token operator">:=</span> <span class="token function">setTeamEnvRemark</span><span class="token punctuation">(</span>env<span class="token punctuation">,</span> req<span class="token punctuation">.</span>TeamEnv<span class="token punctuation">.</span>Value<span class="token punctuation">)</span>
		<span class="token keyword">if</span> errSet <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;set team env remark fail.err:%v&quot;</span><span class="token punctuation">,</span> errSet<span class="token punctuation">)</span>
			<span class="token keyword">return</span> errSet
		<span class="token punctuation">}</span>
		updates<span class="token punctuation">[</span><span class="token string">&quot;remark&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> remark
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>EnvName <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		updates<span class="token punctuation">[</span><span class="token string">&quot;envName&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> req<span class="token punctuation">.</span>EnvName<span class="token punctuation">.</span>Value
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdePath <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		updates<span class="token punctuation">[</span><span class="token string">&quot;idePath&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> req<span class="token punctuation">.</span>IdePath<span class="token punctuation">.</span>Value
	<span class="token punctuation">}</span>

	<span class="token comment">// 3. 判断本次请求是否存在更新，不存在更新的话直接返回，不消耗 DB 连接</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdeName <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> <span class="token function">len</span><span class="token punctuation">(</span>updates<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 4. 开启事物，因为可能要写两个表</span>
	tx<span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Begin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;begin transaction fail.err:%v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;操作失败&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> r <span class="token operator">:=</span> <span class="token function">recover</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> r <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;panic:%v.err:%v&quot;</span><span class="token punctuation">,</span> r<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
		<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			<span class="token keyword">if</span> e <span class="token operator">:=</span> tx<span class="token punctuation">.</span><span class="token function">Rollback</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> e <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;UpdateEnvBasic Rollback error:%v&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span>
			<span class="token punctuation">}</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 5. 写 user_ide_setting 表</span>
	<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdeName <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ideVersion <span class="token operator">:=</span> <span class="token string">&quot;&quot;</span>
		<span class="token keyword">if</span> req<span class="token punctuation">.</span>IdeVersion <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			ideVersion <span class="token operator">=</span> req<span class="token punctuation">.</span>IdeVersion<span class="token punctuation">.</span>Value
		<span class="token punctuation">}</span>
		err <span class="token operator">=</span> envInstance<span class="token punctuation">.</span><span class="token function">UpdateEnvIdeInfo</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> tx<span class="token punctuation">,</span> env<span class="token punctuation">,</span> <span class="token operator">&amp;</span>api<span class="token punctuation">.</span>EnvInfoUpdateReq<span class="token punctuation">{</span>EnvId<span class="token punctuation">:</span> req<span class="token punctuation">.</span>EnvId<span class="token punctuation">,</span> IdeName<span class="token punctuation">:</span> req<span class="token punctuation">.</span>IdeName<span class="token punctuation">.</span>Value<span class="token punctuation">,</span> IdeVersion<span class="token punctuation">:</span> ideVersion<span class="token punctuation">}</span><span class="token punctuation">)</span>
		<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			<span class="token keyword">return</span> err
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 6. 写 dev_environment_instance 表</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>updates<span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		updates<span class="token punctuation">[</span><span class="token string">&quot;updateTime&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> time<span class="token punctuation">.</span><span class="token function">Now</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		<span class="token keyword">if</span> err <span class="token operator">=</span> tx<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Model</span><span class="token punctuation">(</span>table<span class="token punctuation">.</span>DevEnvironmentInstance<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
			<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;uid=?&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>EnvId<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Updates</span><span class="token punctuation">(</span>updates<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
			ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;update env info fail. envId=%s err=%v&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>EnvId<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
			<span class="token keyword">return</span> err
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> err <span class="token operator">=</span> tx<span class="token punctuation">.</span><span class="token function">Commit</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;commit transaction fail.err:%v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;操作失败&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br><span class="line-number">73</span><br><span class="line-number">74</span><br><span class="line-number">75</span><br><span class="line-number">76</span><br><span class="line-number">77</span><br><span class="line-number">78</span><br><span class="line-number">79</span><br><span class="line-number">80</span><br><span class="line-number">81</span><br><span class="line-number">82</span><br><span class="line-number">83</span><br><span class="line-number">84</span><br><span class="line-number">85</span><br><span class="line-number">86</span><br><span class="line-number">87</span><br><span class="line-number">88</span><br><span class="line-number">89</span><br><span class="line-number">90</span><br><span class="line-number">91</span><br><span class="line-number">92</span><br><span class="line-number">93</span><br><span class="line-number">94</span><br><span class="line-number">95</span><br></div></div><p>可以看到 GORM 是将 SQL 嵌套在业务里进行编写，这和 Java MyBatis 的贫血模型有本质区别</p> <ul><li>在 Java 里，Dao 层只管 DB 读写，上层统一调用 Dao 接口</li> <li>在 Go 里，Dao 操作被封装在业务 business 中，和领域深度绑定</li></ul> <p>这是组合和继承的哲学差异</p> <h3 id="跨版本联调"><a href="#跨版本联调" class="header-anchor">#</a> 跨版本联调</h3> <p>paas 层的服务在另一个仓库，web-server 为上游调用者，在开发过程中，需要用到 paas 层新开发的接口，需要引入这个开发中的 paas 服务进行联调</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> backend/codev-web-server
go get git.woa.com/devcloud/clouddev/proto/environment@<span class="token operator">&lt;</span>mentor的分支名或commit<span class="token operator">&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>或者 mentor 还没 push、只有本地代码（联调期） 用 replace 临时指到他本地 checkout 的路径（跟你本地 protos 一个套路）：</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>replace git.woa.com/devcloud/clouddev/proto/environment =&gt; /他本地/environment/proto的路径
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>等他分支合并/打 tag 后，删掉这个 replace，再 go get ...@正式版本换回伪版本号</p> <p>引进来之后，client 还是那套标准姿势：config.yaml 里加对应服务的 <code>client.service</code> 块 + 代码里 <code>environment.NewXxxClientProxy()</code> 调用</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/fe0625/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">K8s 基础</div></a> <a href="/pages/699675/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">并发、异步和锁</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
