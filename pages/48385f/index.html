很考验功底的事）</li> <li>性能有限：在内存占用和网络带宽上，Go 具备得天独厚的后发优势</li></ul> <p>Go 的开源项目，仙之人兮列如麻，不难看出，Go 同时兼顾系统开发和应用开发的能力</p> <ul><li>Clash（网络代理）</li> <li>Caddy（Web 服务器）</li> <li>Docker（容器）</li> <li>K8S（容器编排）</li> <li>Ollama（大模型本地部署）</li> <li>Hugo（静态网站生成）</li></ul> <h2 id="环境搭建"><a href="#环境搭建" class="header-anchor">#</a> 环境搭建</h2> <h3 id="win-环境配置"><a href="#win-环境配置" class="header-anchor">#</a> Win 环境配置</h3> <p>Golang 镜像站下载：<a href="https://golang.google.cn/dl/" target="_blank" rel="nofollow noopener noreferrer">All releases - The Go Programming Language<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">go</span> version
<span class="token keyword">go</span> env
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>Go Mod 命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>go get package@version <span class="token comment"># 等于 npm install</span>
go mod tidy <span class="token comment"># 移除无用依赖</span>
go mod download <span class="token comment"># 根据 go.mod 下载所有依赖</span>
go mod verify <span class="token comment"># 验证依赖完整性</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>Windows Go 版本管理：<a href="https://github.com/voidint/g" target="_blank" rel="nofollow noopener noreferrer">voidint/g: Golang Version Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>解压压缩包：下载好 g1.6.0.windows-amd64.zip 后，将其解压到自定义目录，例如 D:\gvm</li></ul> <p>配置环境变量</p> <ul><li>Win11 系统：依次点击 “系统”&gt;“系统信息”&gt;“高级系统设置”&gt;“环境变量 (N)…”，在 “系统变量” 中进行设置</li> <li>设置 g 的工作目录，G_HOME=D:\gvm</li> <li>新建变量：创建名为 “GOROOT” 的系统变量，变量值设置为解压后的目录，<code>GOROOT=D:\gvm\go</code></li> <li>修改 Path 变量：在 “系统变量” 中找到 “Path” 变量，点击 “编辑”，然后 “新建”，添加 <code>%G_HOME%</code>和 <code>%GOROOT%\bin</code></li></ul> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>g <span class="token function">env</span>
g <span class="token parameter variable">-v</span>

g <span class="token function">install</span> <span class="token number">1.20</span>.7
go version
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="mac-环境管理"><a href="#mac-环境管理" class="header-anchor">#</a> Mac 环境管理</h3> <p>飞神的键盘配置：把键重复速率和重复前延迟都拉满</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 安装 brew</span>
/bin/bash <span class="token parameter variable">-c</span> <span class="token string">&quot;<span class="token variable"><span class="token variable">$(</span><span class="token function">curl</span> <span class="token parameter variable">-fsSL</span> https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh<span class="token variable">)</span></span>&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>添加环境变量</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> <span class="token string">'eval &quot;$(/opt/homebrew/bin/brew shellenv)&quot;'</span> <span class="token operator">&gt;&gt;</span> ~/.zshrc
<span class="token builtin class-name">source</span> ~/.zshrc
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>iTerm / Git / JDK / Maven 下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>brew <span class="token function">install</span> <span class="token parameter variable">--cask</span> iterm2
brew <span class="token function">install</span> <span class="token function">git</span>
brew search jdk
brew <span class="token function">install</span> openjdk@17
brew <span class="token function">install</span> maven
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>安装 GVM</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>brew <span class="token function">install</span> mercurial
<span class="token function">bash</span> <span class="token operator">&lt;</span> <span class="token operator">&lt;</span><span class="token punctuation">(</span><span class="token function">curl</span> <span class="token parameter variable">-s</span> <span class="token parameter variable">-S</span> <span class="token parameter variable">-L</span> https://raw.githubusercontent.com/moovweb/gvm/master/binscripts/gvm-installer<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>添加环境变量</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 修改 ~/.zshrc 文件</span>
<span class="token punctuation">[</span><span class="token punctuation">[</span> <span class="token parameter variable">-s</span> <span class="token string">&quot;<span class="token environment constant">$HOME</span>/.gvm/scripts/gvm&quot;</span> <span class="token punctuation">]</span><span class="token punctuation">]</span> <span class="token builtin class-name">source</span> <span class="token string">&quot;<span class="token environment constant">$HOME</span>/.gvm/scripts/gvm&quot;</span>

<span class="token builtin class-name">source</span> ~/.zshrc
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>GVM</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>gvm listall
gvm list
gvm <span class="token function">install</span> go1.19 <span class="token parameter variable">-B</span>
gvm <span class="token function">install</span> go1.24.0 <span class="token parameter variable">-B</span>
gvm uninstall go1.19
gvm use go1.24.0 default
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p><code>VS Code</code>：Go 插件自带 gopls 语言服务器，要求 go 版本 1.21 及以上，也可以手动用 go 下载相应版本的 gopls</p> <p>快捷键</p> <ul><li>后退：command + 减号</li> <li>转到定义：command + 鼠标点击</li> <li>删除文件：command + 删除</li></ul> <h3 id="go-命令"><a href="#go-命令" class="header-anchor">#</a> go 命令</h3> <p><code>go build</code>：保持打包和测试环境一致，在开发机 / 代码空间打包，下载本地，推到 EOS 环境运行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token assign-left variable">CGO_ENABLED</span><span class="token operator">=</span><span class="token number">0</span> <span class="token assign-left variable">GOOS</span><span class="token operator">=</span>linux <span class="token assign-left variable">GOARCH</span><span class="token operator">=</span>amd64 go build <span class="token parameter variable">-o</span> <span class="token keyword">function</span> main.go
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>CGO_ENABLE=0</code>禁止 CGO 编译静态链接二进制，防止运行时链接到系统的 glibc，若打包和测试环境的 glibc 不一致会导致执行失败</li> <li><code>GOOS=linux GOARCH=amd64</code>指定系统跨平台编译，本地 Mac，测试环境 Linux</li></ul> <p>启动、查看并重启进程</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 上传服务器并添加执行权限，当前位于 function 目录</span>
<span class="token function">chmod</span> +x ./bin/function
./bin/function <span class="token operator">&gt;</span> /dev/null <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">&amp;</span> <span class="token comment"># 启动程序</span>
<span class="token function">ps</span> <span class="token parameter variable">-ef</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token keyword">function</span>
<span class="token function">kill</span> pid
./bin/function <span class="token operator">&gt;</span> /dev/null <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">&amp;</span> <span class="token comment"># 再次启动</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p><code>go get</code>：同步依赖包，类似于 maven 的使用，可以手动指定 commit hash 替换远端依赖版本</p> <p><code>go mod tidy</code>：自动清理依赖包</p> <h2 id="基础语法"><a href="#基础语法" class="header-anchor">#</a> 基础语法</h2> <h3 id="变量与常量"><a href="#变量与常量" class="header-anchor">#</a> 变量与常量</h3> <p>Hello World</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">package</span> main
<span class="token keyword">import</span> <span class="token punctuation">(</span>
	<span class="token string">&quot;fmt&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 定义变量无需指定变量类型，使用`:=`进行定义</span>
	s <span class="token operator">:=</span> <span class="token string">&quot;Hello Golang!&quot;</span>
    <span class="token comment">// 语句通过换行分割，不用分号（类似于 Python，但不采用司马了的缩进表示嵌套）</span>
	fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span>
	<span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;=</span> <span class="token number">5</span><span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
		fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;i =&quot;</span><span class="token punctuation">,</span> <span class="token number">100</span><span class="token operator">/</span>i<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p><code>fmt.Printf</code>输出</p> <ul><li><code>%v</code> 通用输出，不知道怎么输出就用这个</li> <li><code>%s</code> 是输出字符串，<code>%d</code> 是整数，<code>%f</code> 是浮点</li></ul> <p><code>fmt.Println</code>，等同于 Java 的 <code>sout</code>：在每个参数之间自动插入空格，并在结尾添加换行符（<code>\n</code>），若不想换行，可用<code>Print</code></p> <p>命名规则和习惯</p> <ul><li>文件命名：全小写字母，例如<code>makeppttest</code></li> <li>文件夹、包命名：小写字母连接，比如<code>mycontrolflow</code>，应尽量缩小为单个单词如<code>flow</code>，特殊缩写也应该为小写，如<code>ppt</code></li> <li>变量命名：小写字母起头驼峰，比如<code>numSum := 0</code></li> <li>常量命名：大写字母起头驼峰，比如<code>KeyNum := 4</code></li> <li>函数、结构体、接口、方法命名：驼峰，开头的大小写取决于函数是否可被外部访问，可访问则大写，反之小写，比如<code>MakePPT(), prepareMakePPT()</code></li> <li>测试文件和函数命名：测试文件以小写字母 + 下划线 + test 的方式命名；而测试函数是以 Test 开头的驼峰，比如<code>TestAdd()</code></li></ul> <p>百度的逆天命名：<code>addPPtTask, MakePPT, buildPptAgentGenPptReq</code>在同一个文件</p> <h3 id="控制结构"><a href="#控制结构" class="header-anchor">#</a> 控制结构</h3> <p>if 语句：但条件不需要括号，判断体大括号<code>{}</code>必须存在（这是可读性的要求）</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">if</span> age <span class="token operator">&gt;</span> <span class="token number">18</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Adult&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>在<code>if</code>条件中可以定义变量，但定义的变量作用域仅在<code>if</code>中，如下述的 i</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>num <span class="token operator">:=</span> rand<span class="token punctuation">.</span><span class="token function">Int</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token comment">// 取随机数</span>
<span class="token keyword">if</span> i <span class="token operator">:=</span> num <span class="token operator">-</span> <span class="token number">3875633537609512361</span><span class="token punctuation">;</span> i <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>i<span class="token punctuation">,</span> mypackage<span class="token punctuation">.</span><span class="token function">SayHello</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>i<span class="token punctuation">,</span> mypackage<span class="token punctuation">.</span><span class="token function">SayHelloAgain</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>for 语句：一个经典的 for 循环，同样条件语句没小括号</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> <span class="token number">5</span><span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>注意，Go 中没有 While 循环，统一使用 for</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 死循环</span>
<span class="token keyword">for</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// while 循环平替</span>
i <span class="token operator">:=</span> <span class="token number">0</span>
<span class="token keyword">for</span> i <span class="token operator">&lt;</span> <span class="token number">5</span> <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span>
    i<span class="token operator">++</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>注意条件语句中不允许<code>i++ &lt; 5</code>这样的写法，他只能作为语句存在，不能嵌入到其他表达式（为了可读性做的限制）</p> <p>switch 语句：Go 的<code>switch</code>不需要<code>break</code>，匹配成功后直接 break 跳出</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>day <span class="token operator">:=</span> <span class="token string">&quot;Monday&quot;</span>
<span class="token keyword">switch</span> day <span class="token punctuation">{</span>
<span class="token keyword">case</span> <span class="token string">&quot;Monday&quot;</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Start of the week&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">case</span> <span class="token string">&quot;Friday&quot;</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Weekend is near&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">default</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Midweek&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Start TestSwitch()!\n&quot;</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>多值匹配，用逗号连接</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">switch</span> day <span class="token punctuation">{</span>
<span class="token keyword">case</span> <span class="token string">&quot;Saturday&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;Sunday&quot;</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Weekend&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">default</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Weekday&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>switch 后可以不接变量，而在 case 后添加布尔值，这样 switch 语句将执行第一个为 true 的 case，当作一个 if-else 语句来用</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>score <span class="token operator">:=</span> <span class="token number">85</span>
<span class="token keyword">switch</span> <span class="token punctuation">{</span>
<span class="token keyword">case</span> score <span class="token operator">&gt;=</span> <span class="token number">90</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;A&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">case</span> score <span class="token operator">&gt;=</span> <span class="token number">80</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;B&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">default</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;C&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>使用<code>fallthrough</code>修饰 case，那么执行完当前 case 后将继续执行下一个 case</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">switch</span> num <span class="token operator">:=</span> <span class="token number">2</span><span class="token punctuation">;</span> num <span class="token punctuation">{</span>
<span class="token keyword">case</span> <span class="token number">1</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;One&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">case</span> <span class="token number">2</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Two&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">fallthrough</span>  <span class="token comment">// 继续执行下一个 case</span>
<span class="token keyword">case</span> <span class="token number">3</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Three&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">case</span> <span class="token number">4</span><span class="token punctuation">:</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Four&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>只会往下执行一条，输出为</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>Two
Three
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="指针与地址"><a href="#指针与地址" class="header-anchor">#</a> 指针与地址</h3> <p>取地址与解引用</p> <ul><li><code>&amp;task</code> —— 取地址：得到值所在的指针，是一个指针</li> <li><code>*task</code> —— 解引用：得到指针指向的值，是一个结构体</li> <li><code>task *models.Task</code> —— 声明：表明 task 是一个指针</li> <li><code>task models.Task</code> —— 声明：表示 task 是一个结构体</li></ul> <p>声明指针，一般用这种情况来避免 nil 指针，而后用具体的 task.Uid 来判断是否赋值成功（而不是通过指针是否为 nil）</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>task1 <span class="token operator">:=</span> <span class="token operator">&amp;</span>models<span class="token punctuation">.</span>BackupCronTask<span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>models.BackupCronTask{}</code> 先造一个零值结构体（一个值）</li> <li><code>&amp;</code> 对这个值取地址</li> <li><code>task</code> 的类型是 <code>*models.BackupCronTask</code>，指向一块新分配的、非 nil 的结构体内存</li></ul> <p>声明空指针：只声明「task 的类型是指针」，此时 task == nil，还没有指向任何内存</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">var</span> task2 <span class="token operator">*</span>models<span class="token punctuation">.</span>BackupCronTask
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>对于函数和传参而言，<code>*</code>有两种解释，对于入参声明，带不带星号，表示传入的是指针还是值，但在变量前，<code>*task</code> 解出来是一个结构体，<code>&amp;task</code> 取出来是一个指针，也就是说上述两种声明的指针 task，都可以直接作为以下函数的入参</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">Test</span><span class="token punctuation">(</span>task <span class="token operator">*</span>models<span class="token punctuation">.</span>BackupCronTask<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>

<span class="token function">Test</span><span class="token punctuation">(</span>task1<span class="token punctuation">)</span>
<span class="token function">Test</span><span class="token punctuation">(</span>task2<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>但如果是一个结构体，就必须进行取地址，拿到其指针再传入</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>task3 <span class="token operator">:=</span> models<span class="token punctuation">.</span>BackupCronTask<span class="token punctuation">{</span>Uid<span class="token punctuation">:</span> <span class="token string">&quot;xxx&quot;</span><span class="token punctuation">}</span>
<span class="token function">Test</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>task3<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>指针传递的例子</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetMainContainerImage 从 containerInfo JSON 中取主容器 codev-main 的镜像地址</span>
<span class="token comment">// containerInfo 为空、非法或找不到 codev-main 时返回空串</span>
<span class="token keyword">func</span> <span class="token function">GetMainContainerImage</span><span class="token punctuation">(</span>containerInfo <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> containerInfo <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">var</span> containers <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>environment<span class="token punctuation">.</span>ContainerStatus
	<span class="token keyword">if</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>containerInfo<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>containers<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> c <span class="token operator">:=</span> <span class="token keyword">range</span> containers <span class="token punctuation">{</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span><span class="token function">GetName</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> ContainerMain <span class="token punctuation">{</span>
			<span class="token keyword">return</span> c<span class="token punctuation">.</span><span class="token function">GetImage</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>和上述指针传递效果完全一样的值传递</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">GetMainContainerImage</span><span class="token punctuation">(</span>containerInfo <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
	<span class="token comment">// containerInfoItem 解析 DevEnvironmentInstance.ContainerInfo 里的容器状态数组，只取所需字段</span>
	<span class="token keyword">type</span> containerInfoItem <span class="token keyword">struct</span> <span class="token punctuation">{</span>
		Name  <span class="token builtin">string</span> <span class="token string">`json:&quot;name&quot;`</span>
		Image <span class="token builtin">string</span> <span class="token string">`json:&quot;image&quot;`</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> containerInfo <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">var</span> containers <span class="token punctuation">[</span><span class="token punctuation">]</span>containerInfoItem
	<span class="token keyword">if</span> err <span class="token operator">:=</span> json<span class="token punctuation">.</span><span class="token function">Unmarshal</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token function">byte</span><span class="token punctuation">(</span>containerInfo<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>containers<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> c <span class="token operator">:=</span> <span class="token keyword">range</span> containers <span class="token punctuation">{</span>
		<span class="token keyword">if</span> c<span class="token punctuation">.</span>Name <span class="token operator">==</span> ContainerMain <span class="token punctuation">{</span>
			<span class="token keyword">return</span> c<span class="token punctuation">.</span>Image
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><h3 id="函数"><a href="#函数" class="header-anchor">#</a> 函数</h3> <blockquote><p>在 Go 中，函数是一等公民</p></blockquote> <p>在 go 中，使用关键字<code>func</code>定义一个函数，以下基本覆盖了所有的构造示例</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 依次是函数挂载点，函数名，参数列表，返回列表</span>
<span class="token comment">// 这个编码格式挺有意思，来自于连胜哥的风格，严肃学习</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>p <span class="token operator">*</span>mcp<span class="token punctuation">)</span> AgentPPT <span class="token punctuation">(</span>
    <span class="token comment">// 传参</span>
	ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	extraReq mcpprotocol<span class="token punctuation">.</span>WenchainToolMakePPTReq<span class="token punctuation">,</span>
	params base<span class="token punctuation">.</span>AIGCParams<span class="token punctuation">,</span>
<span class="token punctuation">)</span> <span class="token punctuation">(</span>SSEStreamCh<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 返回</span>
 	<span class="token comment">// 函数体内容   </span>
<span class="token punctuation">}</span>

<span class="token comment">// 如果多个参数类型相同，可以省略前面的类型，只写最后一个，但返回列表需要写全</span>
<span class="token comment">// 在接收时，也用逗号分开 res1, res2 := hello(x, y)</span>
<span class="token keyword">func</span> <span class="token function">hello</span><span class="token punctuation">(</span>x<span class="token punctuation">,</span> y <span class="token builtin">int</span><span class="token punctuation">,</span> name <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// ...</span>
<span class="token punctuation">}</span>

<span class="token comment">// 我们可以在返回值列表直接定义返回变量名，从而在`return`时，可以省略掉`return`的变量</span>
<span class="token comment">// 相当于一个初始化的语法糖</span>
<span class="token keyword">func</span> <span class="token function">rectangleArea</span><span class="token punctuation">(</span>length<span class="token punctuation">,</span> width <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>area <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    area <span class="token operator">=</span> length <span class="token operator">*</span> width
    <span class="token keyword">return</span> <span class="token comment">// 省略 area</span>
<span class="token punctuation">}</span>

<span class="token comment">// 变长入参</span>
<span class="token comment">// 入参列表 (numbers ...int) 会把所有参数作为切片处理</span>
<span class="token comment">// 可变参数可以和普通参数混用，但可变参数必须放在最后</span>
<span class="token keyword">func</span> <span class="token function">sum</span><span class="token punctuation">(</span>numbers <span class="token operator">...</span><span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
    total <span class="token operator">:=</span> <span class="token number">0</span>
    <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> num <span class="token operator">:=</span> <span class="token keyword">range</span> numbers <span class="token punctuation">{</span>
        total <span class="token operator">+=</span> num
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> total
<span class="token punctuation">}</span>

<span class="token comment">// 函数作为入参</span>
<span class="token comment">// 这里的函数 op 是变化的，它可以是 add，也可以是 mul 或其他，他只是一个接受两个 int 变量，返回一个 int 变量的 function</span>
<span class="token comment">// 这样的设计在 MyLisp 的编写中见过，内建函数的实现采用了这种形式</span>
<span class="token keyword">func</span> <span class="token function">operate</span><span class="token punctuation">(</span>a<span class="token punctuation">,</span> b <span class="token builtin">int</span><span class="token punctuation">,</span> op <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token function">op</span><span class="token punctuation">(</span>a<span class="token punctuation">,</span> b<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token comment">// 函数作为返回，在这里`double`作为一个函数变量存在，好玩捏</span>
<span class="token keyword">func</span> <span class="token function">multiplier</span><span class="token punctuation">(</span>factor <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token keyword">func</span><span class="token punctuation">(</span>x <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> x <span class="token operator">*</span> factor
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
<span class="token keyword">func</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    double <span class="token operator">:=</span> <span class="token function">multiplier</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">)</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token function">double</span><span class="token punctuation">(</span><span class="token number">5</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">// 10</span>
<span class="token punctuation">}</span>

<span class="token comment">// 内部函数：定义内部函数，以便操作“全局”变量</span>
<span class="token keyword">func</span> <span class="token function">solve</span><span class="token punctuation">(</span>root <span class="token operator">*</span>TreeNode<span class="token punctuation">,</span> x<span class="token punctuation">,</span> y <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>res <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">// 定义函数返回 res int</span>
    <span class="token comment">// 在声明时，只需要填数据类型即可</span>
    <span class="token keyword">var</span> dfs <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token operator">*</span>TreeNode<span class="token punctuation">)</span> <span class="token builtin">int</span>
    dfs <span class="token operator">=</span> <span class="token keyword">func</span><span class="token punctuation">(</span>node <span class="token operator">*</span>TreeNode<span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
        <span class="token comment">// 操作全局的 res，例如</span>
        res <span class="token operator">+=</span> node<span class="token punctuation">.</span>Val
        <span class="token comment">// ...</span>
    <span class="token punctuation">}</span>
    <span class="token function">dfs</span><span class="token punctuation">(</span>root<span class="token punctuation">)</span>
    <span class="token keyword">return</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br></div></div><p><strong>defer 延迟函数与匿名函数</strong>：在函数体内部定义一个 defer 匿名函数，它会在函数 return 之后执行，通常 defer 与 go func 做搭配，用于控制协程结束前的动作</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">string</span> <span class="token punctuation">{</span>
    <span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;hahaha&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    res <span class="token operator">:=</span> <span class="token string">&quot;wdnmd&quot;</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>res<span class="token punctuation">)</span>
    <span class="token keyword">return</span> res
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>将会依次输出<code>wdnmd, hahaha, nmsl</code>，其顺序为如下，其中 defer1 表示第一个定义的 defer，defer2 表示第二个定义的 defer</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>函数体 → defer2 → defer1 → return
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>其定位类似于 Java 中 finally 的用法，用来关闭资源，还有一个值得注意的是，defer 在定义时将会复制函数体之上的值，即使这个值在 defer 之后修改了，defer 内部不会改变，如以下代码，defer 将会输出 1，但函数会返回 2</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">test</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
    res <span class="token operator">:=</span> <span class="token number">1</span>
    <span class="token keyword">defer</span> fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>res<span class="token punctuation">)</span>
    res<span class="token operator">++</span>
    <span class="token keyword">return</span> res
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p><strong>init 函数</strong>：init() 是 Go 的特殊函数，不能手动调用，由 runtime 自动触发</p> <ul><li>触发时机和顺序：程序启动时，在 main() 之前执行，但这个包必须被（直接或间接）import 进最终的可执行程序 <code>main.go</code>；没被 import 的包，它的 init 永远不跑</li> <li>init 执行顺序
<ol><li>先初始化被依赖的包（import 的包先 init），再 init 当前包 —— 依赖在前</li> <li>同一个包内：先完成所有包级变量的初始化，再执行 init()</li> <li>一个包有多个 init()（甚至多个文件里）都会执行，按文件名字典序</li> <li>每个包的 init 只执行一次，即使被 import 多次</li></ol></li></ul> <p>所以对于一些要初始化的服务，例如定时任务注册、旁路服务拉起，都可以封在业务函数中 init 函数里，然后最后在 main.go 里进行 import</p> <h2 id="数据结构"><a href="#数据结构" class="header-anchor">#</a> 数据结构</h2> <h3 id="slice-数组"><a href="#slice-数组" class="header-anchor">#</a> slice 数组</h3> <p>语法：<code>[]数据类型{初始数据1, 初始数据2, ...}</code></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">}</span>
fnums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">float64</span><span class="token punctuation">{</span><span class="token number">3.14</span><span class="token punctuation">,</span> <span class="token number">2.71</span><span class="token punctuation">,</span> <span class="token number">1.618</span><span class="token punctuation">}</span>
words <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token string">&quot;Hello&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;Go&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;Language&quot;</span><span class="token punctuation">}</span>
flags <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">bool</span><span class="token punctuation">{</span><span class="token boolean">true</span><span class="token punctuation">,</span> <span class="token boolean">false</span><span class="token punctuation">,</span> <span class="token boolean">true</span><span class="token punctuation">}</span>
data <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">byte</span><span class="token punctuation">{</span><span class="token char">'a'</span><span class="token punctuation">,</span> <span class="token char">'b'</span><span class="token punctuation">,</span> <span class="token char">'c'</span><span class="token punctuation">}</span>

<span class="token comment">// 指针切片</span>
x<span class="token punctuation">,</span> y<span class="token punctuation">,</span> z <span class="token operator">:=</span> <span class="token number">10</span><span class="token punctuation">,</span> <span class="token number">20</span><span class="token punctuation">,</span> <span class="token number">30</span>
numbers <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token operator">&amp;</span>x<span class="token punctuation">,</span> <span class="token operator">&amp;</span>y<span class="token punctuation">,</span> <span class="token operator">&amp;</span>z<span class="token punctuation">}</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token operator">*</span>numbers<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token operator">*</span>numbers<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token operator">*</span>numbers<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token comment">// 10 20 30</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>若想定义空的切片</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token comment">// 创建一个容量为 0 的切片</span>
nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
<span class="token keyword">var</span> nums <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>推荐第一种，当然，如果有 nil 的判断，即判断<code>nums == nil</code>是否为空的操作，推荐第三种初始化（在网络编程中，例如 Json 传输，似乎第三种更有利）</p> <p>切片操作：相当于定义一个 List，然后不断 add 和修改</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span> <span class="token comment">// 定义一个空的切片</span>

<span class="token comment">// 追加元素</span>
nums <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>nums<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span>
nums <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>nums<span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">)</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>nums<span class="token punctuation">)</span> <span class="token comment">// 输出: [1 2 3 4]</span>

<span class="token comment">// 修改元素</span>
nums<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">10</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>nums<span class="token punctuation">)</span> <span class="token comment">// 输出: [10 2 3 4]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>可以通过内建的<code>len()</code>和<code>cap()</code>函数来获取切片的长度和容量</p> <ul><li><code>len()</code>返回切片的元素个数（即切片的长度）</li> <li><code>cap()</code>返回切片的底层数组的容量（即切片所能容纳的元素个数，不一定是当前的长度</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">}</span>

fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Length:&quot;</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>nums<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">// 输出: Length: 4</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span><span class="token string">&quot;Capacity:&quot;</span><span class="token punctuation">,</span> <span class="token function">cap</span><span class="token punctuation">(</span>nums<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token comment">// 输出: Capacity: 4（或更大，取决于底层数组的扩展）</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>函数返回</p> <ul><li>数组是定长的，在定义时必须规定长度，类似于 C 中的数组，在函数返回数组时，将复制整个数据结构进行返回，所以函数返回顺序结构时，绝大部分都是选择返回切片</li> <li>切片是引用类型（指针），返回时不会复制底层数据，而是返回其起始指针</li></ul> <p>函数返回数组和切片</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 返回切片</span>
<span class="token keyword">func</span> <span class="token function">getSlice</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span> <span class="token punctuation">{</span>
	<span class="token keyword">var</span> nums <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span>
	<span class="token comment">// nums := make([]int, 0)</span>
	nums <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>nums<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">)</span>
	<span class="token keyword">return</span> nums
<span class="token punctuation">}</span>

<span class="token comment">// 返回一个长度为 3 的整型数组</span>
<span class="token keyword">func</span> <span class="token function">getArray</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">[</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token builtin">int</span> <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token punctuation">[</span><span class="token number">3</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>之前在说到函数接收变长参数时提到一个问题：我定义一个变长参数入参和定义一个切片入参有什么区别？</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">Sum</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token function">Sum1</span><span class="token punctuation">(</span><span class="token function">getSlice</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">...</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">Sum1</span><span class="token punctuation">(</span>nums <span class="token operator">...</span><span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
	sum <span class="token operator">:=</span> <span class="token number">0</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> nums <span class="token punctuation">{</span>
		sum <span class="token operator">+=</span> value
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> sum
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">Sum2</span><span class="token punctuation">(</span>nums <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">int</span> <span class="token punctuation">{</span>
	sum <span class="token operator">:=</span> <span class="token number">0</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> nums <span class="token punctuation">{</span>
		sum <span class="token operator">+=</span> value
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> sum
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>乍一看确实好像没有什么区别，但实际上还是有些微差别，可变入参好于切片入参</p> <ol><li><p>如果是<code>(nums ... int)</code>入参，入参可以为空，但切片不行，至少需要传入一个<code>nil</code>或空切片<code>[]int{}</code>（需要显式传切片）</p></li> <li><p>可变入参可以接受切片作为入参，用以下形式</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">}</span>
<span class="token function">Sum1</span><span class="token punctuation">(</span>nums<span class="token operator">...</span><span class="token punctuation">)</span>  <span class="token comment">// ✅ 正确，将返回 10</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li></ol> <p>for range 遍历切片</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">}</span>
<span class="token keyword">for</span> index<span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> nums <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>index<span class="token punctuation">,</span> value<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>当不需要使用 index 时，用<code>_</code>替代</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>nums <span class="token operator">:=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">}</span>
sum <span class="token operator">:=</span> <span class="token number">0</span>
<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> value <span class="token operator">:=</span> <span class="token keyword">range</span> nums <span class="token punctuation">{</span>
    sum <span class="token operator">+=</span> value
<span class="token punctuation">}</span>
fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>sum<span class="token punctuation">)</span> <span class="token comment">// 输出 6</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="map-哈希表"><a href="#map-哈希表" class="header-anchor">#</a> map 哈希表</h3> <p>map 的定义：<code>map[键]值{}</code>第一个中括号为<strong>键</strong>类型，之后跟<strong>值</strong>类型，大括号中为初始数据</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>strMapInt <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">)</span>
intMapInt <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">int</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">)</span>
intMapStr <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">int</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">)</span>

<span class="token keyword">var</span> strMapInt1 <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span>
strMapInt2 <span class="token operator">:=</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>定义逻辑其实和切片一样，特别是初始化空的情况，用 make 或者 var</p> <p>追加元素：直接定义就行，比如对于<code>m := make(map[string]string)</code>，想要插入元素，直接用<code>m[&quot;nmsl&quot;] = wdnmd</code>就行，他会自行判断容量自动扩容</p> <p>函数返回 map</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 返回一个 map</span>
<span class="token keyword">func</span> <span class="token function">getMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span> <span class="token punctuation">{</span>
    <span class="token keyword">var</span> m <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span>
    <span class="token comment">// m := map[string]int{}</span>
    <span class="token comment">// m := make(map[string]int)</span>
    m<span class="token punctuation">[</span><span class="token string">&quot;one&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">1</span>
    m<span class="token punctuation">[</span><span class="token string">&quot;two&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">2</span>
    <span class="token keyword">return</span> m
<span class="token punctuation">}</span>

<span class="token comment">// 创建函数时定义返回变量</span>
<span class="token keyword">func</span> <span class="token function">getMap1</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>m <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    m<span class="token punctuation">[</span><span class="token string">&quot;one&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">1</span>
    m<span class="token punctuation">[</span><span class="token string">&quot;two&quot;</span><span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token number">2</span>
    <span class="token keyword">return</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>使用 for 和 range 遍历映射</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>m <span class="token operator">:=</span> <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">int</span><span class="token punctuation">{</span><span class="token string">&quot;a&quot;</span><span class="token punctuation">:</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;b&quot;</span><span class="token punctuation">:</span> <span class="token number">2</span><span class="token punctuation">}</span>
<span class="token keyword">for</span> k<span class="token punctuation">,</span> v <span class="token operator">:=</span> <span class="token keyword">range</span> m <span class="token punctuation">{</span>
    fmt<span class="token punctuation">.</span><span class="token function">Println</span><span class="token punctuation">(</span>k<span class="token punctuation">,</span> v<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
