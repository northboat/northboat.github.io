<td>RSA</td> <td>大数分解（Factoring）</td> <td>RSA 体系</td></tr> <tr><td>Rabin</td> <td>二次剩余（Quadratic Residue）</td> <td>Rabin 体系</td></tr> <tr><td>ElGamal</td> <td>离散对数（DLP）</td> <td>传统 ElGamal、ECC</td></tr></tbody></table> <p>但注意</p> <ul><li>RSA 和 Rabin 是基于大数分解问题的，属于数论体系（通常不和 ECC 结合）</li> <li>ElGamal 和 D-H 是基于离散对数问题的，它们既可以在整数域也可以在椭圆曲线上实现</li></ul> <h3 id="接口与抽象类"><a href="#接口与抽象类" class="header-anchor">#</a> 接口与抽象类</h3> <p>Auth 接口</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">Auth</span> <span class="token punctuation">{</span>
    <span class="token keyword">default</span> <span class="token class-name">KeyPair</span> <span class="token function">keygen</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token string">&quot;Key Generation Is Not Supported&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">default</span> <span class="token class-name">CryptoMap</span> <span class="token function">sign</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> sk<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token string">&quot;Sign Is Not Supported&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token string">&quot;Sanitize Is Not Supported&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>CipherSystem 抽象类，实现 Auth 接口，这里提供了 updateable 和 sanitizable 的选项，供之后密钥更新和签名净化扩展</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Getter</span>

><h3 id="数据结构"><a href="#数据结构" class="header-anchor">#</a> 数据结构</h3> <p>数据表设计设想是用一个表来存所有密钥、签名等信息，表设计如下</p> <p>crypto_data</p> <table><thead><tr><th>字段名</th> <th>类型</th> <th>描述</th></tr></thead> <tbody><tr><td>id</td> <td>BIGINT/UUID</td> <td>主键</td></tr> <tr><td>user_id</td> <td>VARCHAR</td> <td>所属用户（如有）</td></tr> <tr><td>algo</td> <td>VARCHAR</td> <td>算法名，如 Schnorr</td></tr> <tr><td>code_type</td> <td>VARCHAR</td> <td>&quot;Base64&quot; / &quot;Hex&quot;，编码方式</td></tr> <tr><td>key_type</td> <td>VARCHAR</td> <td>&quot;private&quot; / &quot;public&quot; / &quot;signature&quot;</td></tr> <tr><td>key_name</td> <td>VARCHAR</td> <td>元素内部名字，如 <code>&quot;d&quot;</code>、<code>&quot;e&quot;</code></td></tr> <tr><td>key_value</td> <td>TEXT</td> <td>Base64 或十六进制存储的值</td></tr> <tr><td>created_at</td> <td>TIMESTAMP</td> <td>创建时间</td></tr></tbody></table> <p>对应加密模块的相关处理，Go 传来对应的参数，Java 只需要关注加密和认证内容，即<code>algo, key_name, key_value</code>三个字段的信息就可以工作，抛开算法名 algo，我们可以用一个 Map 存放<code>key_name: key_value</code>，这是一个初步构想</p> <p>然后，因为涉及到跨语言和 RPC 传输，我不可能在 value 部分直接传输一个 BigInteger 或是 Element，这是无法序列化的，那么想当然的就应该进行编码，将 value 转化为 Base64 或是 16 进制的字符串，然后传给 Go 模块进行 SQL 就行</p> <p>那么，Java 模块应当具备 Base64 和 Element 以及 Hex 和 BigInteger 的相互转化的功能，即一个简单的自动编码</p> <p>那么现在需求就很简单了，我们封装一个类，类里面有一个<code>Map&lt;String, String&gt;</code>，在存入时，根据 value 类型自动编码 put，在取出时，将 String 自动解码为 BigInteger/Element，参与加密计算</p> <p>CryptoMap</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Data</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CryptoMap</span> <span class="token punctuation">{</span>

    <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> cryptoMap<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">CryptoMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        cryptoMap <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">put</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">Element</span> val<span class="token punctuation">)</span><span class="token punctuation">{</span>
        cryptoMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> <span class="token class-name">EncodeUtil</span><span class="token punctuation">.</span><span class="token function">parseElement2Base64Str</span><span class="token punctuation">(</span>val<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>


    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">put</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">BigInteger</span> val<span class="token punctuation">)</span><span class="token punctuation">{</span>
        cryptoMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> <span class="token class-name">EncodeUtil</span><span class="token punctuation">.</span><span class="token function">parseBigInteger2HexStr</span><span class="token punctuation">(</span>val<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">put</span><span class="token punctuation">(</span><span class="token class-name">String</span> <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> kv<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">int</span> n <span class="token operator">=</span> kv<span class="token punctuation">.</span>length<span class="token punctuation">;</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>n <span class="token operator">%</span> <span class="token number">2</span> <span class="token operator">!=</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">return</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> n<span class="token punctuation">;</span> i<span class="token operator">+=</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            cryptoMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>kv<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">,</span> kv<span class="token punctuation">[</span>i<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">get</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> cryptoMap<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>key<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">Element</span> <span class="token function">getE</span><span class="token punctuation">(</span><span class="token class-name">String</span> id<span class="token punctuation">,</span> <span class="token class-name">Field</span> field<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token class-name">EncodeUtil</span><span class="token punctuation">.</span><span class="token function">parseBase64Str2Element</span><span class="token punctuation">(</span>cryptoMap<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">,</span> field<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">BigInteger</span> <span class="token function">getI</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token class-name">EncodeUtil</span><span class="token punctuation">.</span><span class="token function">parseHexStr2BigInteger</span><span class="token punctuation">(</span>cryptoMap<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>key<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> cryptoMap<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br></div></div><p>由于在密钥生成阶段将同时生成私公钥，为了方便后续处理（写数据库），封装一个 KeyPair 维护两个 CryptoMap 用以区分公私钥</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Data</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">KeyPair</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">CryptoMap</span> sk<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">CryptoMap</span> pk<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">KeyPair</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        sk <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CryptoMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        pk <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CryptoMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h3 id="工具类"><a href="#工具类" class="header-anchor">#</a> 工具类</h3> <p>主要是哈希，将字符串（明文）映射到对应的域/群上，通常是 Zr 群</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">HashUtil</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token function">concat</span><span class="token punctuation">(</span><span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> <span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span> arr<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">ByteArrayOutputStream</span> outputStream <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ByteArrayOutputStream</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span><span class="token punctuation">{</span>
            <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> bytes<span class="token operator">:</span> arr<span class="token punctuation">)</span><span class="token punctuation">{</span>
                outputStream<span class="token punctuation">.</span><span class="token function">write</span><span class="token punctuation">(</span>bytes<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">IOException</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;IOException: concat bytes error&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> outputStream<span class="token punctuation">.</span><span class="token function">toByteArray</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">RSA</span> <span class="token keyword">extends</span> <span class="token class-name">CipherSystem</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token function">RSA</span><span class="token punctuation">(</span><span class="token class-name">Field</span> <span class="token class-name">Zr</span><span class="token punctuation">,</span> <span class="token class-name">Boolean</span> sanitizable<span class="token punctuation">,</span> <span class="token class-name">Boolean</span> updatable<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span><span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token keyword">null</span><span class="token punctuation">,</span> <span class="token class-name">Zr</span><span class="token punctuation">,</span> sanitizable<span class="token punctuation">,</span> updatable<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="密钥生成"><a href="#密钥生成" class="header-anchor">#</a> 密钥生成</h3> <p>返回一个公私钥密钥对<code>KeyPair key = keygen()</code>，结构非常简单，就是一对大素数逆元<code>d, e</code>满足</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="43.314ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 19145 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D451" d="M366 683Q367 683 438 688T511 694Q523 694 523 686Q523 679 450 384T375 83T374 68Q374 26 402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487H491Q506 153 506 145Q506 140 503 129Q490 79 473 48T445 8T417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157Q33 205 53 255T101 341Q148 398 195 420T280 442Q336 442 364 400Q369 394 369 396Q370 400 396 505T424 616Q424 629 417 632T378 637H357Q351 643 351 645T353 664Q358 683 366 683ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(742.2,0)"><path data-c="22C5" d="M78 250Q78 274 95 292T138 310Q162 310 180 294T199 251Q199 226 182 208T139 190T96 207T78 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1242.4,0)"><path data-c="1D452" d="M39 168Q39 225 58 272T107 350T174 402T244 433T307 442H310Q355 442 38 <span class="token comment">// 使用签名者的私钥和擦除者的公钥进行签名</span>
<span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token class-name">CryptoMap</span> <span class="token function">sign</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> key<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token class-name">Element</span> sk_sig <span class="token operator">=</span> key<span class="token punctuation">.</span><span class="token function">getE</span><span class="token punctuation">(</span><span class="token string">&quot;sk_sig&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getZr</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 签名私钥</span>

    <span class="token class-name">Element</span> pk_san <span class="token operator">=</span> key<span class="token punctuation">.</span><span class="token function">getE</span><span class="token punctuation">(</span><span class="token string">&quot;pk_san&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getG1</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 擦除公钥</span>

    <span class="token class-name">Element</span> m  <span class="token operator">=</span> <span class="token function">h</span><span class="token punctuation">(</span>message<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 明文哈希 H(m)∈G1</span>
    <span class="token class-name">Element</span> <span class="token class-name">X</span> <span class="token operator">=</span> pk_san<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 构造 mu 和 eta</span>
    <span class="token class-name">Element</span> r <span class="token operator">=</span> <span class="token function">randomZ</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Element</span> <span class="token class-name">R</span> <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>r<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Element</span> mu <span class="token operator">=</span> <span class="token class-name">X</span><span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>sk_sig<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>r<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>


    <span class="token class-name">CryptoMap</span> signature <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CryptoMap</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    signature<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;m&quot;</span><span class="token punctuation">,</span> m<span class="token punctuation">)</span><span class="token punctuation">;</span>

    signature<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;R&quot;</span><span class="token punctuation">,</span> <span class="token class-name">R</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    signature<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;mu&quot;</span><span class="token punctuation">,</span> mu<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token class-name">CryptoMap</span> <span class="token function">sanitize</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> key<span class="token punctuation">,</span> <span class="token class-name">CryptoMap</span> signature<span class="token punctuation">)</span> <span class="token punctuation">{</span>

    <span class="token class-name">Element</span> sk_san <span class="token operator">=</span> key<span class="token punctuation">.</span><span class="token function">getE</span><span class="token punctuation">(</span><span class="token string">&quot;sk_san&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getZr</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">//        sk_san = sk_san.add(this.getI(&quot;1&quot;));</span>
    <span class="token class-name">Element</span> <span class="token class-name">X</span> <span class="token operator">=</span> signature<span class="token punctuation">.</span><span class="token function">getE</span><span class="token punctuation">(</span><span class="token string">&quot;X&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getG1</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Element</span> m <span class="token operator">=</span> signature<span class="token punctuation">.</span><span class="token function">getE</span><span class="token punctuation">(</span><span class="token string">&quot;m&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getZr</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token operator">!</span><span class="token class-name">X</span><span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>sk_san<span class="token punctuation">.</span><span class="token function">invert</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">isEqual</span><span class="token punctuation">(</span>g<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>m<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;不具备擦除权力，签名照旧&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> signature<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token class-name">Element</span> s <span class="token operator">=</span> <span class="token function">h</span><span class="token punctuation">(</span>message<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 根据新的消息更新明文 m</span>
    m <span class="token operator">=</span> m<span class="token punctuation">.</span><span class="token function">mul</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">Element</span> <span class="token constant">X1</span> <span class="token operator">=</span> <span class="token class-name">X</span><span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Element</span> mu1 <span class="token operator">=</span> mu<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>
