<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>定义扫描器扫描 Class 类注解 Annotation</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">private</span> <span class="token class-name">String</span> <span class="token function">resolveBeanScope</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getBeanClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Scope</span> scope <span class="token operator">=</span> beanClass<span class="token punctuation">.</span><span class="token function">getAnnotation</span><span class="token punctuation">(</span><span class="token class-name">Scope</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token keyword">null</span> <span class="token operator">!=</span> scope<span class="token punctuation">)</span> <span class="token keyword">return</span> scope<span class="token punctuation">.</span><span class="token function">value</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token class-name">StrUtil</span><span class="token punctuation">.</span><span class="token constant">EMPTY</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>而后将 spring.xml 转为 spring-scan.xml，指定 bean 的存放空间，进行整个包的扫描注册</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token prolog">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>beans</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span><span class="token namespace">context:</span>component-scan</span> <span class="token attr-name">base-package</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>com.northboat.winterframework.test.bean<span class="token punctuation">&quot;</span></span><span class="token punctuation">/&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>beans</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>3、通过注解注入属性信息：实现<code>@Value</code>和<code>@Autowired</code>注解</p> <ul><li>将<code>xml → applyPropertyValues</code>转为<code>@Value → applyPropertyValues</code></li> <li>将<code>xml → getBean</code>转为<code>@Autowired → getBean</code></li></ul> <p>4、给代理对象的属性设置初始值</p> <ul><li>在创建 Bean 对象 <code>createBean</code> 的生命周期中，有一个阶段是在 Bean 对象属性填充完成以后，执行 Bean 的初始化方法和 BeanPostProcessor 的前置和后置处理，例如：感知 Aware 对象、处理 init-method 方法等。那么在这个阶段的 <code>BeanPostProcessor After</code> 就可以用于创建代理对象操作</li> <li>在 DefaultAdvisorAutoProxyCreator 用于创建代理对象的操作中，需要把创建操作从 postProcessBeforeInstantiation 方法中迁移到 postProcessAfterInitialization，这样才能满足 Bean 属性填充后的创建操作</li></ul> <h2 id="spring-自动装配原理"><a href="#spring-自动装配原理" class="header-anchor">#</a> Spring 自动装配原理</h2> <blockquote><p>DI（Dependency Injection）依赖注入</p></blockquote> <h3 id="springbootapplication"><a href="#springbootapplication" class="header-anchor">#</a> SpringBootApplication</h3> <p>什么是 SpringBoot 的自动装配？</p> <p>在原始的 Spring 中，存在两种配置方式：基于 XML 的配置和基于 JavaConfig 类的配置方式</p> <ul><li>前者使用 ClassPathXmlApplicationContext 来加载配置文件，然后获取 Bean，类似于我们手写的 IoC 容器的实现</li> <li>后者通过<code>@Configuration</code>注解实现 Bean 的注入，类似于<code>AOP 切面 - AOP in Spring - 定义扫描器扫描 Class 类注解 Annotation</code>中的实现</li></ul> <p>而在 SpringBoot 中，一行注解<code>@SpringBootApplication</code>就搞定了 Bean 的装配，如何实现的？</p> <ul><li>自动装配的对象：BeanDefinition</li></ul> <p>对于一个空的 SpringBoot 项目，仅有一个启动类，并且启动类上有唯一的一个注解<code>@SpringBootApplication</code></p> <p>这个注解其实由 n 多注解组成，我们只关注主要的三个</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootConfiguration</span>
<span class="token annotation punctuation">@EnableAutoConfiguration</span>
<span class="token annotation punctuation">@ComponentScan</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="config-与-scan"><a href="#config-与-scan" class="header-anchor">#</a> Config 与 Scan</h3> <p><strong>@SpringBootConfiguration</strong></p> <p>一个 JavaConfig 配置类，用来配置 bean，所以有了这个注解之后，就可以在 SpringBoot 的运行主类中使用<code>@Bean</code>标签配置类</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BootautowireApplication</span><span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">BootautowireApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">A</span> <span class="token function">a</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">A</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p><strong>@ComponentScan</strong></p> <p>扫描组件，规定将扫描 SpringBoot 启动类的当前目录和所以子目录中的 class 文件</p> <p>如对于项目<code>com.northboat.winterframework.WinterframeworkApplication.java</code>，其扫描目录就是<code>com.northboat.winterframework</code></p> <h3 id="enableautoconfiguration"><a href="#enableautoconfiguration" class="header-anchor">#</a> EnableAutoConfiguration</h3> <p>@EnableAutoConfiguration 是最为核心的一个组件，控制配置文件的加载，注解的解析，BeanDefinition 的注入等诸多流程</p> <ul><li>本质上还是加载了固定位置下的配置文件进行 loadProperties</li></ul> <img src="/assets/img/image-20251221155635206.38ef7b01.png"> <p>自动装配的本质</p> <blockquote><ul><li>SpringBoot 自动装配的本质就是通过 Spring 去读取 META-INF/spring.factories 中保存的配置类文件然后加载 bean 定义的过程</li> <li>如果是标了 @Configuration 注解，就是批量加载了里面的 bean 定义</li> <li>如何实现”自动“：通过配置文件获取对应的批量配置类，然后通过配置类批量加载 bean 定义，只要有写好的配置文件 spring.factories 就实现了自动</li></ul></blockquote> <h2 id="容器事件和事件监听器"><a href="#容器事件和事件监听器" class="header-anchor">#</a> 容器事件和事件监听器</h2> <p>在 Spring 中有一个 Event 事件功能，它可以提供事件的定义、发布以及监听事件来完成一些自定义的动作，这是一个向外的接口，Spring 仅提供事件的发送接口，而具体的下游实现由用户自定义实现，这样完成 Spring 容器事件的解耦</p> <p>扩展 ApplicationContext 容器，引入 event 系接口，以提供完善的事件发布和事件监听功能</p> <ul><li>ApplicationEventMulticaster 接口是注册监听器和发布事件的抽象接口</li> <li>ApplicationContextEvent 是事件接口，用于继承实现自定义事件，监听器将通过 Class 类型来分辨事件</li></ul> <p>Event 系接口与上下文 Context 的继承接入关系如下图所示</p> <img src="/assets/img/spring-11-02.7cdd2b8d.png"> <h3 id="定义容器事件"><a href="#定义容器事件" class="header-anchor">#</a> 定义容器事件</h3> <p>按照 Spring 的一贯编码习惯，先开一个接口作为事件定义（这是一个代理模式的实现）</p> <p><strong>com.northboat.winterframework.context.ApplicationEvent</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// EventObject 是 java.util 包中的类，继承了序列化接口</span>
<span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">ApplicationEvent</span> <span class="token keyword">extends</span> <span class="token class-name">EventObject</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">ApplicationEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> source<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>source<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>而后封装一个中间层，实现一些 set 或 get 方法，完成类的初始化工作</p> <p><strong>com.northboat.winterframework.context.event.ApplicationEvent</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ApplicationContextEvent</span> <span class="token keyword">extends</span> <span class="token class-name">ApplicationEvent</span> <span class="token punctuation">{</span>

    <span class="token keyword">public</span> <span class="token class-name">ApplicationContextEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> source<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>source<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token class-name">ApplicationContext</span> <span class="token function">getApplicationContext</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token punctuation">(</span><span class="token class-name">ApplicationContext</span><span class="token punctuation">)</span> <span class="token function">getSource</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>再根据具体需求，把最后的逻辑定义在更下一层的实现类</p> <p><strong>com.northboat.winterframework.context.event.ContextClosedEvent</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ContextClosedEvent</span> <span class="token keyword">extends</span> <span class="token class-name">ApplicationContextEvent</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">ContextClosedEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> source<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>source<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p><strong>com.northboat.winterframework.context.event.ContextRefreshedEvent</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ContextRefreshedEvent</span> <span class="token keyword">extends</span> <span class="token class-name">ApplicationContextEvent</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token class-name">ContextRefreshedEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> source<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>source<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="事件广播器"><a href="#事件广播器" class="header-anchor">#</a> 事件广播器</h3> <p>定义监听器，这里采用泛型的方式接收 ApplicationEvent 的实现类，并扩展 java.util.EventListener 提供监听接口</p> <p><strong>com.northboat.winterframework.context.ApplicationListener</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">ApplicationListener</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">E</span> <span class="token keyword">extends</span> <span class="token class-name">ApplicationEvent</span><span class="token punctuation">&gt;</span></span> <span class="token keyword">extends</span> <span class="token class-name">EventListener</span> <span class="token punctuation">{</span>
    
    <span class="token keyword">void</span> <span class="token function">onApplicationEvent</span><span class="token punctuation">(</span><span class="token class-name">E</span> event<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>定义上层的广播器接口，提供监听器的注册销毁以及事件广播的接口</p> <p><strong>com.northboat.winterframework.context.event.ApplicationEventMulticaster</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">ApplicationEventMulticaster</span> <span class="token punctuation">{</span>
    <span class="token comment">// 添加监听器</span>
    <span class="token keyword">void</span> <span class="token function">addApplicationListener</span><span class="token punctuation">(</span><span class="token class-name">ApplicationListener</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> listener<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 移除监听器</span>
    <span class="token keyword">void</span> <span class="token function">removeApplicationListener</span><span class="token punctuation">(</span><span class="token class-name">ApplicationListener</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> listener<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 向所有监听器广播事件</span>
