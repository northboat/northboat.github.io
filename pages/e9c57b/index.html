nt.com/developer/article/2334525" target="_blank" rel="nofollow noopener noreferrer">Go 每日一库之 134：fsm 基有限状态机库<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在状态机模型内，我们不需要在业务代理判断状态，而只定义规则，关注点完全在</p> <ul><li>源状态（source）</li> <li>事件（event）</li> <li>目标状态（target）</li></ul> <p>不符合规则状态转移路径由状态机引擎自动拦截</p> <p><strong>fsm.go</strong></p> <h3 id="定义状态和事件"><a href="#定义状态和事件" class="header-anchor">#</a> 定义状态和事件</h3> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">const</span> <span class="token punctuation">(</span>

    FsmStateCompleted     <span class="token operator">=</span> <span class="token string">&quot;completed&quot;</span>
<span class="token punctuation">)</span>

<span class="token keyword">const</span> <span class="token punctuation">(</span>
    FsmEventInit          <span class="token operator">=</span> <span class="token string">&quot;init&quot;</span>           <span class="token comment">// 初始化事件</span>
    FsmEventSimpleJudge   <span class="token operator">=</span> <span class="token string">&quot;simple_judge&quot;</span>   <span class="token comment">// 工具判断</span>
    FsmEventModelChoice   <span class="token operator">=</span> <span class="token string">&quot;model_choice&quot;</span>   <span class="token comment">// 选择模式</span>
    FsmEventReason        <span class="token operator">=</span> <span class="token string">&quot;reason&quot;</span>         <span class="token comment">// 推理模型事件</span>
    FsmEventRoundDispatch <span class="token operator">=</span> <span class="token string">&quot;round_dispatch&quot;</span> <span class="token comment">// 对话调度</span>
    FsmEventExecute       <span class="token operator">=</span> <span class="token string">&quot;execute&quot;</span>        <span class="token comment">// 调度事件</span>
    FsmEventCancel        <span class="token operator">=</span> <span class="token string">&quot;cancel&quot;</span>         <span class="token comment">// 任务取消</span>
    FsmEventChat          <span class="token operator">=</span> <span class="token string">&quot;chat&quot;</span>           <span class="token comment">// 对话事件</span>
    FsmEventPause         <span class="token operator">=</span> <span class="token string">&quot;pause&quot;</span>          <span class="token comment">// 暂停事件</span>
    FsmEventError         <span class="token operator">=</span> <span class="token string">&quot;error&quot;</span>          <span class="token comment">// 出现异常</span>
    FsmEventTimeout       <span class="token operator">=</span> <span class="token string">&quot;timeout&quot;</span>        <span class="token comment">// timeout</span>
    FsmEventCompleted     <span class="token operator">=</span> <span class="token string">&quot;completed&quot;</span>      <span class="token comment">// 结束</span>
    FsmEventSingleMessage <span class="token operator">=</span> <span class="token string">&quot;single_message&quot;</span> <span class="token comment">// 单意图模式输出message</span>
<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br></div></div><h3 id="状态机流转与回调"><a href="#状态机流转与回调" class="header-anchor">#</a> 状态机流转与回调</h3> <p>初始化状态机，定义状态机调度流转逻辑</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 初始化状态机</span>

mber">402</span><br><span class="line-number">403</span><br><span class="line-number">404</span><br><span class="line-number">405</span><br><span class="line-number">406</span><br><span class="line-number">407</span><br><span class="line-number">408</span><br><span class="line-number">409</span><br><span class="line-number">410</span><br><span class="line-number">411</span><br><span class="line-number">412</span><br><span class="line-number">413</span><br><span class="line-number">414</span><br><span class="line-number">415</span><br><span class="line-number">416</span><br><span class="line-number">417</span><br><span class="line-number">418</span><br><span class="line-number">419</span><br><span class="line-number">420</span><br><span class="line-number">421</span><br><span class="line-number">422</span><br><span class="line-number">423</span><br><span class="line-number">424</span><br><span class="line-number">425</span><br><span class="line-number">426</span><br><span class="line-number">427</span><br><span class="line-number">428</span><br><span class="line-number">429</span><br><span class="line-number">430</span><br><span class="line-number">431</span><br><span class="line-number">432</span><br><span class="line-number">433</span><br></div></div><p>状态流转路径</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>   init → queue → model_choice

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h3 id="状态机启动"><a href="#状态机启动" class="header-anchor">#</a> 状态机启动</h3> <p>状态机一经初始化，就会自动执行到终止节点，所谓自动状态机的含义就是如此，在以下代码中，首先初始化了状态机，而后通过 <code>util.SafeFSMEvent(g.ctx, g.fsmClient, FsmEventInit)</code> 触发状态机的第一个事件，于是开启自动化流程</p> <p><strong>main.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Run 执行生成流处理任务</span>
<span class="token comment">//</span>
<span class="token comment">// 该方法初始化用户请求信息，设置30分钟超时上下文，并异步执行主处理逻辑。</span>
<span class="token comment">// 返回一个事件通道用于接收处理过程中的状态和结果。</span>
<span class="token comment">//</span>
<span class="token comment">// 参数:</span>
<span class="token comment">//    ctx     - 上游上下文，用于传递请求上下文信息</span>
<span class="token comment">//    req     - 运行请求参数，包含对话消息、频道信息、用户ID等</span>
<span class="token comment">//    httpReq - HTTP请求对象，包含原始HTTP请求信息</span>
<span class="token comment">//</span>
<span class="token comment">// 返回: chan resource.Event - 事件通道，异步返回处理过程中的各种事件</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">Run</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req genflowtypes<span class="token punctuation">.</span>RunReq<span class="token punctuation">,</span> httpReq ghttp<span class="token punctuation">.</span>Request<span class="token punctuation">)</span> <span class="token keyword">chan</span> resource<span class="token punctuation">.</span>Event <span class="token punctuation">{</span>
    <span class="token comment">// 初始化用户请求信息</span>
    g<span class="token punctuation">.</span>req <span class="token operator">=</span> req
    g<span class="token punctuation">.</span><span class="token function">wpURIParamsExtra</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> httpReq<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
    g<span class="token punctuation">.</span>ctx<span class="token punctuation">,</span> g<span class="token punctuation">.</span>ctxCancelFunc <span class="token operator">=</span> context<span class="token punctuation">.</span><span class="token function">WithTimeout</span><span class="token punctuation">(</span>logit<span class="token punctuation">.</span><span class="token function">CopyAllFields</span><span class="token punctuation">(</span>context<span class="token punctuation">.</span><span class="token function">Background</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> ctx<span class="token punctuation">)</span><span class="token punctuation">,</span> time<span class="token punctuation">.</span>Minute<span class="token operator">*</span><span class="token number">30</span><span class="token punctuation">)</span>
    <span class="token comment">// 29min55S 会超时</span>
    g<span class="token punctuation">.</span>backendTimeoutTimer <span class="token operator">=</span> time<span class="token punctuation">.</span><span class="token function">NewTimer</span><span class="token punctuation">(</span>time<span class="token punctuation">.</span>Minute<span class="token operator">*</span><span class="token number">29</span> <span class="token operator">+</span> time<span class="token punctuation">.</span>Second<span class="token operator">*</span><span class="token number">55</span><span class="token punctuation">)</span>
    g<span class="token punctuation">.</span>upstreamCtx <span class="token operator">=</span> ctx
    g<span class="token punctuation">.</span>httpReq <span class="token operator">=</span> httpReq
    
    <span class="token comment">// 执行一系列初始化，包括状态机的初始化</span>
    g<span class="token punctuation">.</span><span class="token function">init</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token comment">// 异步执行任务</span>
    <span class="token keyword">go</span> safely<span class="token punctuation">.</span><span class="token function">RunVoidContext1</span><span class="token punctuation">(</span>g<span class="token punctuation">.</span>ctx<span class="token punctuation">,</span> g<span class="token punctuation">.</span>run<span class="token punctuation">)</span>
    <span class="token keyword">return</span> g<span class="token punctuation">.</span>outch
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br></div></div><p>在 g.init() 里执行了状态机的初始化 initFSM()</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>g <span class="token operator">*</span>genflow<span class="token punctuation">)</span> <span class="token function">init</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

)</span> <span class="token punctuation">(</span>data any<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    svc <span class="token operator">:=</span> genflow<span class="token punctuation">.</span><span class="token function">NewGenflow</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    pauseData <span class="token operator">:=</span> message<span class="token punctuation">.</span>PauseData<span class="token punctuation">{</span>
        Type<span class="token punctuation">:</span>    genflow<span class="token punctuation">.</span>PauseTypeUser<span class="token punctuation">,</span>
        SubType<span class="token punctuation">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
        Message<span class="token punctuation">:</span> u<span class="token punctuation">.</span>params<span class="token punctuation">.</span>Message<span class="token punctuation">,</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br><span class="line-number">73</span><br><span class="line-number">74</span><br><span class="line-number">75</span><br><span class="line-number">76</span><br><span class="line-number">77</span><br><span class="line-number">78</span><br><span class="line-number">79</span><br><span class="line-number">80</span><br><span class="line-number">81</span><br><span class="line-number">82</span><br><span class="line-number">83</span><br><span class="line-number">84</span><br><span class="line-number">85</span><br><span class="line-number">86</span><br><span class="line-number">87</span><br><span class="line-number">88</span><br><span class="line-number">89</span><br><span class="line-number">90</span><br><span class="line-number">91</span><br><span class="line-number">92</span><br><span class="line-number">93</span><br><span class="line-number">94</span><br><span class="line-number">95</span><br><span class="line-number">96</span><br><span class="line-number">97</span><br><span class="line-number">98</span><br><span class="line-number">99</span><br><span class="line-number">100</span><br><span class="line-number">101</span><br><span class="line-number">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br><span class="line-number">108</span><br><span class="line-number">109</span><br><span class="line-number">110</span><br><span class="line-number">111</span><br><span class="line-number">112</span><br><span class="line-number">113</span><br><span class="line-number">114</span><br><span class="line-number">115</span><br><span class="line-number">116</span><br><span class="line-number">117</span><br><span class="line-number">118</span><br><span class="line-number">119</span><br><span class="line-number">120</span><br><span class="line-number">121</span><br><span class="line-number">122</span><br><span class="line-number">123</span><br><span class="line-number">124</span><br><span class="line-number">125</span><br><span class="line-number">126</span><br><span class="line-number">127</span><br><span class="line-number">128</span><br><span class="line-number">129</span><br><span class="line-number">130</span><br><span class="line-number">131</span><br><span class="line-number">132</span><br><span class="line-number">133</span><br><span class="line-number">134</span><br><span class="line-number">135</span><br><span class="line-number">136</span><br><span class="line-number">137</span><br><span class="line-number">138</span><br><span class="line-number">139</span><br><span class="line-number">140</span><br><span class="line-number">141</span><br><span class="line-number">142</span><br><span class="line-number">143</span><br><span class="line-number">144</span><br><span class="line-number">145</span><br><span class="line-number">146</span><br><span class="line-number">147</span><br><span class="line-number">148</span><br><span class="line-number">149</span><br><span class="line-number">150</span><br><span class="line-number">151</span><br><span class="line-number">152</span><br><span class="line-number">153</span><br><span class="line-number">154</span><br><span class="line-number">155</span><br><span class="line-number">156</span><br></div></div><h3 id="文档转存"><a href="#文档转存" class="header-anchor">#</a> 文档转存</h3> <blockquote><p>基于 json 格式操作</p></blockquote> <p>在业务侧，收到的所有文档信息其实都是 bdjson 结构，所有的文档都会经过前置的转码处理，把文档内容解析为 bdjson 并存在 bos 里，业务侧将直接根据 fileID 去 bos 里取 bdjson 实现业务逻辑</p> <p>文档转存 bdjson 是一个异步过程</p> <ol><li>策略请求打过去时直接把 fileID 返回</li> <li>后台执行转码、存 BOS 的操作</li></ol> <p>这里有个问题：如果业务侧通过传回的 fileID 直接去 bos 拿 fileInfo，如果“取的太快”，会出现取到空值的情况，因为 bdjson 还没存好，这里要设置一个 5s 的超时重试（<code>for - try - sleep(1)</code>）</p> <p><strong>getfileInfo.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>p <span class="token operator">*</span>genflowfile<span class="token punctuation">)</span> <span class="token function">GetFileInfosWait</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> fileIDs <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> seconds <span class="token builtin">int</span><span class="token punctuation">,</span> baseParams base<span class="token punctuation">.</span>AIGCParams<span class="token punctuation">)</span> <span class="token punctuation">(</span>
    finishFiles<span class="token punctuation">,</span> processingFiles <span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">,</span> err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

    finishFiles <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">)</span>
    processingFiles <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span>function<span class="token punctuation">.</span>MCPUserKnowledgeFile<span class="token punctuation">)</span>
    <span class="token comment">// 实现等待逻辑</span>
    waitFileIDs <span class="token operator">:=</span> fileIDs
    <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> seconds<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
        files<span class="token punctuation">,</span> err <span class="token operator">:=</span> p<span class="token punctuation">.</span><span class="token function">GetFileInfoMCP</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> waitFileIDs<span class="token punctuation">,</span> baseParams<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;GetFileInfoMCP error&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;err&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span><span class="token punctuation">)</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
        waitFileIDs <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
        <span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> file <span class="token operator">:=</span> <span class="token keyword">range</span> files <span class="token punctuation">{</span>
            <span class="token keyword">if</span> file<span class="token punctuation">.</span>Status <span class="token operator">!=</span> <span class="token number">1</span> <span class="token punctuation">{</span>
                finishFiles<span class="token punctuation">[</span>file<span class="token punctuation">.</span>FileID<span class="token punctuation">]</span> <span class="token operator">=</span> file
                <span class="token function">delete</span><span class="token punctuation">(</span>processingFiles<span class="token punctuation">,</span> file<span class="token punctuation">.</span>FileID<span class="token punctuation">)</span>
            <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
                waitFileIDs <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>waitFileIDs<span class="token punctuation">,</span> file<span class="token punctuation">.</span>FileID<span class="token punctuation">)</span>
                processingFiles<span class="token punctuation">[</span>file<span class="token punctuation">.</span>FileID<span class="token punctuation">]</span> <span class="token operator">=</span> file
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>waitFileIDs<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
            <span class="token keyword">break</span>
        <span class="token punctuation">}</span>
        <span class="token comment">// 等待1秒</span>
        time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">return</span> finishFiles<span class="token punctuation">,</span> processingFiles<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br></div></div><p>在实际测试中，只有链接解析 bdjson 出现了“取空值”的情况，原因可能是网络延迟 + 网页抓取耗时过长，所以这里用 sleep 的方式每秒取一次</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/29, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/108f08/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Agent 静态代码分析</div></a> <a href="/pages/548662/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">模型驱动产品</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
