9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">存储管理<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="内存管理"><a href="#内存管理" class="header-anchor">#</a> 内存管理</h2> <p>内存管理，又称实存管理，用户进程需要全部进入内存，实存管理分为连续（单一、固定、可变）和可离散（页式、段式、段页式）</p> <h3 id="地址空间"><a href="#地址空间" class="header-anchor">#</a> 地址空间</h3> <h4 id="逻辑地址空间和物理地址空间"><a href="#逻辑地址空间和物理地址空间" class="header-anchor">#</a> 逻辑地址空间和物理地址空间</h4> <p>程序和数据执行前需存储于内存。为管理方便，用户编写的程序和最终执行的代码位于不同的地址空间（逻辑地址和物理地址）</p> <p>程序从编写到执行</p> <ul><li>编辑</li> <li>编译：二进制模块</li> <li>链接：二进制模块连接库函数等，变为装入模块</li> <li>装入：将装入模块装入内存</li> <li>执行</li></ul> <p>计算机常使用的 3 类地址</p> <ul><li>符号地址：存储变量名、函数名等，符号地址空间或名空间</li> <li>逻辑地址：目标代码所使用地址从 0 开始编号，相对地址</li> <li>物理地址：绝对地址，实地址</li></ul> <h4 id="地址变换和内存共享保护"><a href="#地址变换和内存共享保护" class="header-anchor">#</a> 地址变换和内存共享保护</h4> <p>重定位：将逻辑地址转化为物理地址</p> <ul><li>静态重定位：装入时一次性完成地址转换</li> <li>动态重定位：边执行边进行地址变换，程序在内存中可移动</li></ul> <p>内存共享：多个进程通过一个物理内存区域进行通信的方式，常见共享方式如下</p> <ul><li>生产者 - 消费者</li> <li>可重入代码：纯代码，执行期间不改变（只读，由 OS 实现），可共享，如编辑软件、编译软件、运行时库、窗口系统、数据库系统等</li></ul> <p>内存保护</p> <ul><li>存取控制保护：读、写、执行操作权限控制，如<code>chmod 777 nmsl.txt</code></li> <li>地址越界保护：确保每个程序只能访问其所属内存地址空间，保护其他程序正常执行
<ul><li>上下界寄存器：分别表示用户程序内存地址空间的最小 / 大地址，在执行时与之比较，超出范围<code>[x,y]</code>则报错</li> <li>基质 / 重定位寄存器和界限寄存器：记录内存最小值和程序长度，访问时通过<code>[x,x+len]</code>进行判断</li></ul></li></ul> <h4 id="内存的分配和回收"><a href="#内存的分配和回收" class="header-anchor">#</a> 内存的分配和回收</h4> <p>内存分配和回收：内存分为系统区和用户区，系统区放 OS，用户区放用户程序</p> <ul><li>分配和回收，以及多道程序，其操作对象一般都是用户程序，均工作在内存用户区</li></ul> <p>碎片：存储分配中无法利用（容量太小，没有利用价值）的内存空间</p> <ul><li>内部碎片：分配给用户程序的用户空间中没有被占用、也不允许其他程序占用的空间。固定大小的存储分配可能导致内部碎片，如固定分区、页式管理、段页式管理等</li> <li>外部碎片：用户区剩余的、无法利用的存储空间。非固定大小的存储分配可能导致外部碎片，如动态分区、分段存储分配等</li></ul> <h3 id="连续分配管理"><a href="#连续分配管理" class="header-anchor">#</a> 连续分配管理</h3> <blockquote><p>分区管理方式（单一、固定、可变分区）均使用<strong>界地址</strong>保护内存</p></blockquote> <p>为用户程序分配连续的内存空间，使得用户程序的逻辑地址相邻，则物理地址也相邻，特点</p> <ul><li>整体性，用户程序全部装入内存（覆盖技术可允许部分装入）</li> <li>不支持虚拟存储器</li> <li>作业运行结束才释放所占空间</li></ul> <p>连续存储管理方式：单一连续分区；固定分区；可变分区</p> <h4 id="分区分配管理"><a href="#分区分配管理" class="header-anchor">#</a> 分区分配管理</h4> <p>单一连续分区：内存用户区最多存放一个用户程序，属于计算机早期的存储方式</p> <ul><li>静态分配，管理简单</li> <li>存在内部碎片；存储器利用率低（单道）；无法实现多道程序共享内存；仅适用于单用户单任务操作系统</li></ul> <p>固定分区：用户区事先划分为多个分区，每个分区最多可存放一个用户程序，是最早、最简单的可运行多道程序的分区式存储管理模式</p> <ul><li>各分区大小可以相等，也可以不等
<ul><li>当大小相等：适用于一台计算机控制多个相同对象的场合</li> <li>当大小不等：灵活性更高，通常划分为多个较小分区、适量中等分区、少量的大分区；一般来说小分区位于物理地址的小地址端，大分区反之</li></ul></li> <li>使用数据结构<strong>分区使用表</strong>管理各个固定分区，记录各个分区的分区号、容量、编号、起始地址和状态信息等，都是事先规定且不能更改的</li> <li>在使用时，OS 首先查询分区使用表，查不到能用的则拒绝执行进程
<ul><li>比较所需内存和分区内存大小</li> <li>查询分区状态，是否已装入</li></ul></li> <li>特点：事先划分分区，每个分区装一个作业；多个分区并发执行；采用静态重定位技术装入内存
<ul><li>可用于多道程序系统，可采用覆盖技术，利用率较高</li> <li>存在区内部碎片，且需要考虑各任务干扰问题，需要内存保护</li></ul></li></ul> <p>可变分区：将用户区分为若干分区，分区的大小、个数可灵活变化</p> <ul><li><p>空闲分区表：每个空闲分区（空闲或未分配）占一个条目，在空闲分区表中，相邻空闲取需要合并</p></li> <li><p>空闲分区链：一个双向链表，将所有空闲分区连接起来，其节点信息类似于</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token keyword">struct</span> <span class="token class-name">node</span><span class="token punctuation">{</span>
    node<span class="token operator">*</span> pre<span class="token punctuation">;</span> <span class="token comment">// 前驱</span>
    node<span class="token operator">*</span> next<span class="token punctuation">;</span> <span class="token comment">// 下一条</span>
    <span class="token keyword">int</span> mem_size<span class="token punctuation">;</span> <span class="token comment">// 分区大小</span>
    <span class="token keyword">int</span> status<span class="token punctuation">;</span> <span class="token comment">// 0 为空闲，1 为已分配</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div></li></ul> <h4 id="动态分区分配算法"><a href="#动态分区分配算法" class="header-anchor">#</a> 动态分区分配算法</h4> <p>首次适应算法</p> <ul><li>空闲分区表按首地址递增排列，顺序查找，直到找到大小满足的空闲分区</li> <li>找到后，根据作业所需大小分配该空闲分区，多余的部分仍存在空闲分区表中（修改相应表项）</li> <li>未找到，分配失败</li></ul> <p>循环首次适应算法：从上次找到的空闲分区的下一个分区开始，寻找符合的内存区域，找到后分配出和作业所需大小一样的内存</p> <ul><li>减少查找开销，避免低地址区存在很多很小的空闲分区</li> <li>造成大分区分得比较小，不利于大作业装入</li></ul> <p>最佳适应算法：空闲分区按容量大小递增排序，每次找到最小的符合作业大小的分区并分配内存</p> <ul><li>贪婪思想的表现，每步均为最佳</li> <li>可能产生许多难以利用的小空闲区，宏观上不一定最佳</li></ul> <p>最差适应算法：空闲分区按容量大小递减排序，每次分配时将最大的满足作业的分区进行分隔，降低剩余空间</p> <ul><li>分配后的空闲区较大，便于下次使用</li> <li>后期不利于大作业装入</li></ul> <p>快速适应算法：又称分类搜索算法，将内存空间大小相同的空闲分区分为一类，并将同类分区通过双向链表相连，同时建立一张分类表索引，记录各类分区的表头指针；当查找分区时，找到最适合的类（最小的大于）的第一快空闲分区进行分配</p> <ul><li>回收空间的算法复杂；一个分区一个进程，同样会造成区内空间浪费（连续性分配管理的通病）</li></ul> <p>伙伴系统：将内存分为一个个<code>2^k</code>大小的块，并将<code>2^n</code>块分配个各个作业</p> <ul><li>设初始状态为 1024 MB，首次接收到一个需要 100 MB 的作业，分出 128 MB 的内存块给这个作业，剩下内存从大到小进行分割</li> <li>从大到小指剩下的 896 MB 依次分为 512 MB、256 MB、128 MB</li> <li>每次接收到之后都会进行这样的分割，伙伴系统将相同大小的块进行分类管理（以快速适应算法的形式管理）</li></ul> <p>在为作业寻找内存块时，假设所需 n MB，且<code>2^(k-1) &lt;= n &lt;= 2^k</code></p> <ul><li>需要明确的是，肯定要找比 n 大的内存块，即从 2^k MB 开始找</li> <li>若存在，直接分配<code>2^k</code>的内存块</li> <li>若不存在，继续往大了找，找到后，从大的内存块中分<code>2^k</code>给该进程，剩下的空间分成一个或多个<code>2^k</code>大的内存块，插入链表</li> <li>若一直找到最大内存的记录，链表均为空，则分配失败</li></ul> <p>Hash 散列算法：以<code>HashMap&lt;内存大小,内存块链表指针&gt;</code>的形式记录内存块，查找时从 map 中直接查找即可</p> <p>分区分配动态管理</p> <ul><li>为了解决连续分配产生的很多无法分配的细碎小空间，通过<strong>拼接 / 紧凑</strong>，移动内存中的作业，使之邻接，再将内存中分散的小空闲合并成大空闲分区实现</li> <li>这一过程需要进行进程的<strong>动态重定位</strong>，通过重定位寄存器实现，存储进程在内存的起始地址，在实际寻址时，通过相对地址和寄存器中的起始地址求和得到</li></ul> <h3 id="非连续分配管理"><a href="#非连续分配管理" class="header-anchor">#</a> 非连续分配管理</h3> <h4 id="地址映射"><a href="#地址映射" class="header-anchor">#</a> 地址映射</h4> <p>非连续分配又称为离散分配管理，将进程的逻辑地址分为若干等大区域，称为逻辑页、页面或页，从 0 开始编号，通过<strong>页表</strong>进行管理</p> <ul><li>页空间过大会造成最后一个页空间浪费较大（只有进程的最后一个页才会出现区内空间浪费）</li> <li>页空间过小会造成页表过长</li></ul> <p>物理空间中，也将物理地址分为一个个大小与页面相等的内存块，与页一一对应，用于存储进程的各个页面</p> <p>在这种管理方式下，逻辑地址格式为：页号位 + 页内偏移量位（参考计组知识）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="82.281ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 36368.3 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">页</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">号</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">位</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">数</text></g><g data-mml-node="mo" transform="translate(4277.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(5333.6,0)"><path data-c="1D459" d="M117 59Q117 26 142 26Q179 26 205 131Q211 151 215 152Q217 153 225 153H229Q238 153 241 153T246 151T248 144Q247 138 245 128T234 90T214 43T183 6T137 -11Q101 -11 70 11T38 85Q38 97 39 102L104 360Q167 615 167 623Q167 626 166 628T162 632T157 634T149 635T141 636T132 637T122 6 mi><mi mathvariant="normal">号</mi><mi mathvariant="normal">位</mi><mi mathvariant="normal">数</mi><mo>=</mo><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</mn></msub><mi mathvariant="normal">页</mi><mi mathvariant="normal">面</mi><mi mathvariant="normal">数</mi><mi mathvariant="normal">量</mi><mo>=</mo><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi mathvariant="normal">内</mi><mi mathvariant="normal">存</mi><mi mathvariant="normal">总</mi><mi mathvariant="normal">大</mi><mi mathvariant="normal">小</mi><mrow data-mjx-texclass="ORD"><mo>/</mo></mrow><mi mathvariant="normal">页</mi><mi mathvariant="normal">内</mi><mi mathvariant="normal">大</mi><mi mathvariant="normal">小</mi><mo stretchy="false">)</mo><mspace linebreak="newline"></mspace><mi mathvariant="normal">偏</mi><mi mathvariant="normal">移</mi><mi mathvariant="normal">量</mi><mi mathvariant="normal">位</mi><mi mathvariant="normal">数</mi><mo>=</mo><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</mn></msub><mi mathvariant="normal">页</mi><mi mathvariant="normal">内</mi><mi mathvariant="normal">大</mi><mi mathvariant="normal">小</mi></math></mjx-assistive-mml></mjx-container><h4 id="页式管理"><a href="#页式管理" class="header-anchor">#</a> 页式管理</h4> <p>非连续存储管理：页式管理；段式管理；段页式管理</p> <h4 id="单级页表"><a href="#单级页表" class="header-anchor">#</a> 单级页表</h4> <p>页表：索引结构，从上往下依次是逻辑页 0, 1, ... , n-1 对应的物理块号和存取控制权限，访问时，根据逻辑页号读取对应的物理块号</p> <table><thead><tr><th>块号</th> <th>存取控制</th></tr></thead> <tbody><tr><td>1000</td> <td>RWE</td></tr> <tr><td>50</td> <td>RWE</td></tr> <tr><td>...</td> <td>...</td></tr> <tr><td>2000</td> <td>RWE</td></tr> <tr><td>...</td> <td>...</td></tr> <tr><td>600</td> <td>RWE</td></tr></tbody></table> <p>地址变换借助页表实现，将逻辑地址的页号转换为内存的物理块号。同时设置有页表寄存器（PTR），记录页表的起始位置和长度帮助<strong>基本地址变换机构</strong>查询</p> <p>查询流程</p> <ul><li>CPU 访问 PTR，找到进程对应页表</li> <li>根据逻辑页号找到对应的物理块号</li> <li>块号和页内地址的二进制拼凑成实际物理地址
<ul><li>块号通过逻辑地址第一段查询页表得到</li> <li>页内地址由逻辑地址第二段提供</li></ul></li> <li>访问实际物理地址存取数据</li></ul> <p>常见的两种基本地址变换机构</p> <p>查询页表</p> <img src="/assets/img/20221031212703.d00ddb13.png"> <p>增加快表，先查询快表 TLB，若无再查询页表</p> <img src="/assets/img/20221031213145.b29c5f33.png"> <p>这里涉及到一个访问时间的问题，由于页表常驻内存，访问页表算一次访问内存时间，同时访问物理地址数据也算一次访问内存</p> <p>设访问内存时间为 T，访问快表（缓存）时间为 t，则存/取一次数据，所需时间</p> <ul><li>基本地址变换机构：2T</li> <li>增加快表的地址变换机构：[λt + (1-λ)(T+t)] + T = (2-λ)T + t</li></ul> <h4 id="分级页表"><a href="#分级页表" class="header-anchor">#</a> 分级页表</h4> <p>现代计算机系统地址位数大多为 32/64 位，这意味着逻辑地址空间在<code>2^32~2^64</code>，页表极大，且要占连续内存空间，于是采用分级页表解决页表过大问题，常见的有：二级页表、三级页表、反置页表</p> <ul><li>对于 32 位计算机，逻辑地址空间<code>2^32B</code>，设一个内存块大小为<code>4KB(2^10)</code>，若采用单级页表，将会有<code>2^22</code>个页面，即页表有<code>2^22</code>行（4MB）</li></ul> <p>二级页表：将整个单级页表分为若干个独立页表进行储存，适用于 32 位计算机 —— 设页内空间<code>2^12</code>，二级页表将整个 20 位的页表分为两部分，外层页号 P1 和外层页内地址 P2，各占 10 位</p> <ul><li>外层页表 10 位，存储 1024 个页表项，每一项指向一个外层页内地址</li> <li>外层页内地址 10 位，存储 1024 个页表项，每一项指向一个进程块号</li></ul> <p>外层页内地址即指针数组，指向一个个进程块号，外层页表同样是指针数组，指向的对象是一个个指针数组的起始位置</p> <ul><li>外层页表 —— 页表的页表</li> <li>指针所占的总空间其实增加了，但拆分的更细，占用连续空间更小（将数组拆分为链表）</li> <li>CPU 首先通过外部页表寄存器查找外部页表</li></ul> <p>二级页表最终通过外层页内地址找到块号 b 后，和逻辑页内地址 d 拼接成内存物理地址，共需<strong>三次</strong>访问内存（多一次页表访问）</p> <ul><li>第一次：访问外层页表</li> <li>第二次：访问外层页内地址</li> <li>第三次：访问内容</li></ul> <p>如何减少二级页表下的内存开销？</p> <ul><li>不将外层页内地址全部存放在内存中，即部分存放在外存</li> <li>将外层页表每项增设状态位，记录其对应外层页内地址是否在内存中</li> <li>实际访问时，若状态位位 1，直接访问内存中的外层页内地址，若不在，产生中断调入内存</li></ul> <p>多级页表：开始套娃，适用于 64 位计算机，分为 20 位 P1，15 位 P2，15 位 P3，最终通过 P3 得到物理块号 b，和 14 位的页内地址 d 拼接成物理地址</p> <p>反置页表：不同于记录逻辑地址指针，对应物理块号；反置页表记录的是物理块所存放的逻辑页页号和所属进程标识</p> <ul><li>逻辑页号 ——&gt; 物理块号：在每个进程的表中：primary key = 逻辑页号</li> <li>物理块号 ——&gt; 进程号 + 逻辑页号：primary key = 物理块号</li></ul> <p>检索时，搜索的时进程号和逻辑页号，找到了，其序号就是物理块号；若没找到，说明逻辑页未装入内存，需要请求调用（虚拟存储器）</p> <h4 id="段式管理"><a href="#段式管理" class="header-anchor">#</a> 段式管理</h4> <p>页是按容量管理，克服页外碎片，最后一个页可能存在业内碎片，而段式管理以程序的功能逻辑为单位进行内存分配，将作业地址空间分为若干段</p> <ul><li>每个段具有标识</li> <li>每个段的段内一定连续，段间可不连续</li> <li>作业装入时整个装入</li></ul> <p>优点</p> <ul><li>便于编程，如按函数和过程划分</li> <li>便于共享，如共享<code>printf</code>函数</li> <li>便于分段</li> <li>动态链接</li> <li>动态增长</li></ul> <p>进程的段式管理的逻辑地址格式：段号 + 段内地址</p> <ul><li>表示该进程最多分为段号位个段，每个段大小最多为段内地址位</li></ul> <p>段式管理通过段表（常驻内存或放在寄存器）对段进行管理，每个进程有一个映射段表，每个段在段表中占一行，<strong>下标为段号</strong>，每行包含<strong>段长和段起始位置</strong></p> <ul><li>段号一定要小于段长（段表长度）</li></ul> <p>和单级页表类似，每访问一次数据需要两次访问内存，可以通过增设快表 TLB 加快访问</p> <h4 id="段页式管理"><a href="#段页式管理" class="header-anchor">#</a> 段页式管理</h4> <p>若段内功能过于复杂，可能导致段过大，于是采用段页式管理，先进行分段，再在段内进行分页</p> <p>地址格式</p> <ul><li>逻辑地址分为：段号 + 页号 + 页内地址</li> <li>段表每行记录：页表长度，页表起始位置</li> <li>页表每行记录：下标为页号，内容为物理块号</li></ul> <p>查询过程：共三次读内存</p> <ul><li>查段表，根据段号读取页表，得到页表长度及起始位置</li> <li>查页表，根据页号获取物理块号</li> <li>根据块号拼接页内地址获取物理地址，访问数据</li></ul> <p>实存管理，要求作业一次性装入内存</p> <ul><li>一次性：大作业、多道性受限</li> <li>驻留性：直到运行结束才释放内存</li> <li>低效性</li></ul> <p>解决办法</p> <ul><li>从物理上增加内存容量</li> <li>从逻辑上扩充内存容量，通过算法解决问题</li></ul> <p>因为不是所有程序段都要执行，我们选择性的将程序调入内存，即先部分装入肯定会执行的部分，其余部分需要时再装入</p> <p>这种方式即通过虚拟存储管理实现，由操作系统提供</p> <h3 id="虚拟内存"><a href="#虚拟内存" class="header-anchor">#</a> 虚拟内存</h3> <blockquote><p>基于实存管理，出应用</p></blockquote> <p>虚拟内存基于程序访问的局部性原理（cache 同样基于局部性原理）</p> <ul><li>时间局部性：刚被访问的数据可能不久后再次被访问</li> <li>空间局部性：刚被访问的数据内存附近的数据很可能也要被访问</li></ul> <p>在实际执行时，先调入部分页（段）执行</p> <ul><li>请求调入：当发生缺页 / 段，利用操作系统的请求调页 / 段，将其调入内存</li> <li>置换：当内存已满，利用 OS 置换功能，将暂时不用的页调入外存</li></ul> <p>于是，内存实际操作空间变得很大（从逻辑上假象扩充，粗略总和为内存和外存之和），但注意，这种技术一定是建立在非连续的内存管理方式之上，即页、段、页段式管理</p> <p>特点</p> <ul><li>多次性：对应一次</li> <li>对换性：对应驻留</li> <li>虚拟性：扩充仅在用户的感受上</li></ul> <h2 id="请求页式管理"><a href="#请求页式管理" class="header-anchor">#</a> 请求页式管理</h2> <p>在页式存储管理的基础上增加<strong>请求调页和置换功能</strong>后形成的虚拟存储管理方法</p> <p>硬件支持：内存和外存；页表机制；缺页中断机构；地址变换机构</p> <p>优点</p> <ul><li>离散性</li> <li>高利用率</li> <li>高多道性</li></ul> <p>缺点：需要更多硬件支持；可能发生抖动（置换算法有问题），降低系统效率；仍存在碎片问题</p> <h3 id="请求页表"><a href="#请求页表" class="header-anchor">#</a> 请求页表</h3> <table><thead><tr><th>页号</th> <th>块号</th> <th>状态位</th> <th>访问次数</th> <th>修改位</th> <th>外存地址</th></tr></thead> <tbody><tr><td>进程页号</td> <td>页对应内存块号</td> <td>表示是否在内存</td> <td>该页的访问次数</td> <td>也叫脏位，表示该页内容是否被写过，表示内外存内容是否一致</td> <td>该页内容对应的外存地址</td></tr></tbody></table> <p>查询时根据状态位判断是否在内存，若缺页，从对应外存地址进行调入，同时根据访问次数和修改位执行请求调入或置换算法</p> <h3 id="缺页中断机构"><a href="#缺页中断机构" class="header-anchor">#</a> 缺页中断机构</h3> <p>缺页中断机构：当发生缺页且请求页状态位为 0 时，触发缺页中断处理程序</p> <ul><li>保存现场：保存 PC 等寄存器内容</li> <li>获取缺页：启动外存</li> <li>置换页框：当内存已满，才会发生置换</li> <li>读入内存：启动 I/O，将外存页调入内存</li> <li>更新请求页表：有效位置 1</li> <li>返回引起缺页中断的指令</li> <li>恢复现场</li></ul> <p>缺页中断是一种特殊中断，设计用户态和内核态的切换，虚拟地址和物理地址的转换；最重要的，缺页中断产生在指令执行期间，并且可能产生多次缺页中断</p> <h3 id="地址变换机构"><a href="#地址变换机构" class="header-anchor">#</a> 地址变换机构</h3> <p>地址格式：虚页号 + 页内地址</p> <img src="/assets/img/20221103211005.133ef43b.png"> <img src="/assets/img/20221103211138.f56dfe88.png"> <p>当快表或页表查询成功，该页的访问次数将加 1</p> <h3 id="页框分配"><a href="#页框分配" class="header-anchor">#</a> 页框分配</h3> <p>进程是资源分配单位，OS 为进程分配内存块 / 页框时，通常需要满足<strong>最少物理块数原则</strong>，</p> <h4 id="物理块分配"><a href="#物理块分配" class="header-anchor">#</a> 物理块分配</h4> <p>常见的内存物理块分配方法有以下三种</p> <ul><li>平均分配：容量 / 进程数量，不可取</li> <li>比例分配：按照进程大小按比例分配</li> <li>优先权分配：按照优先级为重要、紧迫的作业分配较多内存块</li></ul> <h4 id="页面分配策略"><a href="#页面分配策略" class="header-anchor">#</a> 页面分配策略</h4> <p>请求页式存储管理具有<strong>固定和可变</strong>两种内存<strong>页面分配策略</strong>，具有<strong>全局和局部</strong>两种<strong>页面置换策略</strong></p> <p>常见有三种分配和置换的策略</p> <ul><li>固定分配局部置换：进程内存块一经分配，整个运行期间不变，缺页时调用自身被分配的空闲内存块</li> <li>可变分配全局置换：预分配物理块，若缺页，从全局的空闲物理块队列中取出一个为其分配</li> <li>可变分配局部置换：预分配物理块，缺页时，从进程拥有的内存块中选出一个换出；若频繁缺页中断，将多分配内存块，反之将取回部分内存块</li></ul> <h4 id="调页策略"><a href="#调页策略" class="header-anchor">#</a> 调页策略</h4> <p>操作系统常采用以下两种策略调入所缺页</p> <ul><li>预调页：在顺序结构下，一次性调入多个相邻页，当遇到分支结构可能造成浪费</li> <li>请求调页：缺页时，发出缺页中断，调入缺页，一次仅调入一页，系统开销较大</li></ul> <h4 id="外存管理"><a href="#外存管理" class="header-anchor">#</a> 外存管理</h4> <p>文件区：用于存放普通文件，离散存储，相对较慢</p> <p>对换区：SWAP 分区（linux），存放从内存中换出的进程，连续存储</p> <p>操作系统调入页的来源</p> <ul><li>全部从对换区调入：linux 建议为内存容量两倍，将内存执行完的进程复制到对换区</li> <li>被修改部分从对换区调入</li> <li>UNIX 方式：访问过且换出的页存放在对换区，其余均放在文件区（UNIX 支持页面共享）</li></ul> <h3 id="页面置换算法"><a href="#页面置换算法" class="header-anchor">#</a> 页面置换算法</h3> <p>当发生缺页，进程所属内存空间又放满了，需要进行置换，从内存中选择一页将其置换的对换区</p> <p>不恰当的置换算法可能导致<strong>抖动 / 颠簸</strong>，常见的算法有</p> <h4 id="opt"><a href="#opt" class="header-anchor">#</a> OPT</h4> <p>最佳置换算法（OPT）</p> <ul><li>淘汰以后永不再用或最长时间内不再被访问的页面</li> <li>过于理想化，难于实现，常用作对比</li></ul> <p>简单来说，就是之后用的越多的页，被保留的优先级越高，这需要预知，很难</p> <p>已知页面访问序列，每次访问后需要实时更新内存中页面之后的访问次数，并以此排序</p> <img src="/assets/img/20221104211054.043785a9.png"> <h4 id="fifo"><a href="#fifo" class="header-anchor">#</a> FIFO</h4> <p>先进先出置换算法（First In First Out, FIFO）</p> <ul><li>淘汰最先进入内存的页面，直观，性能可能最差</li></ul> <p>最后进入内存的页面被保留的优先级最高</p> <img src="/assets/img/20221104211013.eaacd920.png"> <h4 id="lru"><a href="#lru" class="header-anchor">#</a> LRU</h4> <p>最近最久未使用算法（Least Recently Used, LRU）</p> <ul><li>使用相对较多</li></ul> <p>最近使用过的页面被保留的优先级最高，编程实现，只需要改指针</p> <p>已知访问顺序，模拟访问/置换过程</p> <img src="/assets/img/20221104205851.f8ee61da.png"> <h4 id="clock"><a href="#clock" class="header-anchor">#</a> CLOCK</h4> <p>CLOCK 置换算法：最近未使用算法（Not Recently Used, NRU）：<strong>LRU 和 FIFO 的折中</strong></p> <ul><li>维护内存中进程页面的循环队列</li> <li>每个页设置访问位，初始为 1</li> <li>当需要置换时，按队列从前往后寻找页面
<ul><li>当遇到访问位 0 的页面，将其换出，停止查找</li> <li>遇到访问位为 1 的页面，将访问位置为 0，继续向后查找</li></ul></li></ul> <p>已知访问顺序，模拟 CLOCK 工作过程，共四个内存块，运行七个页面</p> <img src="/assets/img/20221104210321.cc7c1a17.png"> <p>灰色部分表示循环链表的指针所指位置</p> <ul><li>命中后，访问位置 1</li> <li>指针始终保存在上一操作的结果位置</li></ul> <p>改进 CLOCK 置换算法</p> <ul><li>增加修改位，表示页是否被修改过</li> <li>在置换时，优先考虑未使用过、又未被修改过的页面，将同时满足两项的页面作为首选淘汰对象</li></ul> <p>页面类型根据修改位和访问位分为四类</p> <ul><li>00B：1 类页面，既未被访问，也没被修改</li> <li>01B：2 类页面，未被访问，但被修改</li> <li>10B：3 类页面，被访问，但未被修改</li> <li>11B：4 类页面，被访问，也被修改</li></ul> <p>在置换时</p> <ul><li>首先扫描 1 类页面，扫到即换出</li> <li>未扫到，再扫一次，寻找 2 类页面，扫到即换出</li> <li>未扫到，将所有页面访问位置位 0，重复进行第 1/2 步扫描，直到换出一个 1 类或 2 类页面</li></ul> <h4 id="lfu"><a href="#lfu" class="header-anchor">#</a> LFU</h4> <p>最少使用置换算法（LFU）：淘汰访问次数最少的页面</p> <h4 id="pba"><a href="#pba" class="header-anchor">#</a> PBA</h4> <p>页面缓冲算法（PBA）：基于 FIFO 的改进，常被 VAX/VMS 操作系统采用</p> <ul><li>页面管理策略采用可变分配局部置换方式</li> <li>未每个进程预分配一定数量的内存物理块</li> <li>两个链表
<ul><li>空闲页面链表：存放空闲的页面和被换出的未被修改的页面</li> <li>修改页面链表：存放被换出的被修改过页面</li></ul></li> <li>特点：减少磁盘 I/O 操作次数；降低页面换入换出频率和开销；采用简单的 FIFO 算法，实现简单</li></ul> <p>以上算法中，除页面缓冲算法，其余均采用固定分配局部置换策略</p> <h2 id="内存映射文件"><a href="#内存映射文件" class="header-anchor">#</a> 内存映射文件</h2> <blockquote><p>Memory-Mapped File</p></blockquote> <h3 id="大文件管理"><a href="#大文件管理" class="header-anchor">#</a> 大文件管理</h3> <p>磁盘文件到内存的映射，使得应用程序可以通过内存地址访问外存磁盘文件，适合管理大文件</p> <p>内存映射由操作系统调用 mmap() 实现，效率较高</p> <p>特点：文件没有进入内存，没有实际的数据复制</p> <p>原理及执行流程：像访问内存一样地访问磁盘文件</p> <ul><li>调用 mmap() 返回进程逻辑地址空间中映射区的首地址 sAddr</li> <li>地址转换：通过存储管理模块 MMU 将逻辑首地址 sAddr 转换为物理地址</li> <li>产生缺页中断，将 sAddr 映射的文件复制到内存
<ul><li>先找 swap 分区，若有则从 swap 分区读入文件至内存（说明曾被读入内存）</li> <li>若不在交换分区，通过 mmap() 建立的映射关系，从硬盘上将文件读入内存（用户进程空间）</li></ul></li></ul> <p>只复制一次数据，效率高</p> <ul><li>若采用读写 read() / write(）的方法，将复制两次，第一次从外存复制到 OS 的缓冲区，第二次从缓冲区复制到用户空间</li></ul> <p>内存映射文件和虚拟存储器的共性：部分内容加载内存；支持应用程序的动态性</p> <table><thead><tr><th></th> <th>内存映射文件</th> <th>虚拟存储器</th></tr></thead> <tbody><tr><td>文件类型</td> <td>任何磁盘文件</td> <td>页面文件</td></tr> <tr><td>目的</td> <td>处理大文件；进程通信</td> <td>运行大的应用程序</td></tr> <tr><td>架构</td> <td>用户程序地址空间</td> <td>物理内存空间</td></tr></tbody></table> <h3 id="页式管理性能"><a href="#页式管理性能" class="header-anchor">#</a> 页式管理性能</h3> <p>命中 / 缺页率：即判断 CPU 请求的页是否在内存中，在即命中，不在即缺页</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="47.261ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 20889.6 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">缺</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">页</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">率</text></g><g data-mml-node="mo" transform="translate(3277.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(4333.6,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">未</text></g><g data- ></mjx-assistive-mml></mjx-container><p>访问有效时间：请求分页管理方式的内存访问有效时间组成</p> <ul><li>访问页表时间</li> <li>访问物理单元时间</li> <li>处理时间</li></ul> <p>设内存访问有效时间为 EAT，查快表时间为 t，访问物理单元时间为 T，缺页中断处理时间 u，缺页率 f，分为以下几种情况</p> <ol><li>当访问页在内存，EAT = t +T：访问快表 - 读取内存</li> <li>访问页在内存，但快表没记录，EAT = 2(t+T)：访问快表 - 访问页表 - 读取内存 - 写入快表</li> <li>访问页不在内存，EAT = 2(t+T) + u：访问快表 - 访问页表 - 中断处理 - 读取内存 - 写入快表</li> <li>当快表命中率为 h，缺页率为 f</li></ol> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="92.024ex" height="2.417ex" role="img" focusable="false" viewBox="0 -750 40674.6 1068.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.72ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D438" d="M492 213Q472 213 472 226Q472 230 477 250T482 285Q482 316 461 323T364 330H312Q311 328 277 192T243 52Q243 48 254 48T334 46Q428 46 458 48T518 61Q567 77 599 117T670 248Q680 270 683 272Q690 274 698 274Q718 274 718 261Q613 7 608 2Q605 0 322 0H133Q31 0 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 659Q197 676 203 680H757Q764 676 764 669Q764 664 751 557T737 447Q735 440 717 440H705Q698 445 698 453L701 476Q704 500 704 528Q704 558 697 578T678 609T643 625T596 632T532 634H485Q397 633 392 631Q388 629 386 622Q385 619 355 499T324 377Q347 376 372 376H398Q464 376 489 391T534 472Q538 488 540 490T557 493Q562 493 565 493T570 492T572 491T574 487T577 483L544 351Q511 218 508 216Q505 213 492 213Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(764,0)"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 "29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>E</mi><mi>A</mi><mi>T</mi><mo>=</mo><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mi>h</mi><mi>T</mi><msub><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">命</mi><mi mathvariant="normal">中</mi><mi mathvariant="normal">快</mi><mi mathvariant="normal">表</mi></mrow></msub><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>h</mi><msub><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">未</mi><mi mathvariant="normal">命</mi><mi mathvariant="normal">中</mi><mi mathvariant="normal">快</mi><mi mathvariant="normal">表</mi></mrow></msub><mo stretchy="false">(</mo><msub><mi>T</mi><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">访</mi><mi mathvariant="normal">问</mi><mi mathvariant="normal">页</mi><mi mathvariant="normal">表</mi></mrow></msub><mo>+</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>f</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mi>T</mi><msub><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">页</mi><mi mathvariant="normal">表</mi><mi mathvariant="normal">命</mi><mi mathvariant="normal">中</mi></mrow></msub><mo>+</mo><mi>f</mi><mo stretchy="false">(</mo><mi>u</mi><mo>+</mo><mi>t</mi><mo>+</mo><mi>T</mi><msub><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi mathvariant="normal">缺</mi><mi mathvariant="normal">页</mi></mrow></msub><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>Belady 现象：进程分配到的页面数增多，缺页率反而增加的奇怪现象，其中，FIFO 可能出现 Belady 现象，LRU 和 OPT 不会出现 Belady</p> <p>抖动现象：刚调出又调入</p> <ul><li>原因：系统资源不够用；置换算法有问题；用户程序有问题</li> <li>抖动必然启动 I/O，需要系统调用、切换内核状态等操作，忙而低效</li> <li>局部抖动和全局抖动：局部抖动指进程内部页面抖动；全局抖动指整个系统抖动</li></ul> <p>工作集：正常情况下，进程拥有物理块数量和缺页率成反比（无 belady 现象），在分配内存块数量合理的情况下，缺页率会比较稳定，据此，再加上进程之前的工作状态，可以推测进程将来的行为，调整进程所需内存块的数量，在这引入<strong>工作集</strong>的概念</p> <ul><li>工作集：页面的集合，在一段时间内进程访问的页面集合</li> <li>窗口尺寸：即工作集的大小（单位时间内访问页面的数量）</li> <li>表示：<code>w(t, ▲t)</code>，表示从 t 时刻开始经过 ▲t 时间中所访问页面的集合</li> <li>规律：<code>w(t, ▲t)</code>是关于 ▲t 的非降序函数，即 ▲t 增加，w 一定不减</li></ul> <h3 id="性能改进策略"><a href="#性能改进策略" class="header-anchor">#</a> 性能改进策略</h3> <blockquote><p>虚拟存储器性能的影响因素和改进方法</p></blockquote> <p>导致系统颠簸 / 抖动，或者频繁 I/O 操作，降低虚拟存储器系统性能的因素</p> <ul><li>页面置换算法：LRU；FIFO；CLOCK</li> <li>页面分配策略：固定分配局部置换；可变分配全局置换；可变分配局部置换</li> <li>物理块分配算法：平均分配；按比例分配；按优先权分配</li> <li>页面调入时机：用户提供预调页策略；操作系统提供请求调页策略</li> <li>写回磁盘频率：增大 I/O 时间</li> <li>读入内存频率：增大 I/O 时间</li></ul> <p>采用局部置换策略：进程发生缺页时，只能置换分配给它的内存块，限制抖动的范围，不影响其他进程，简单易行但效果较差</p> <p>工作集概念融入处理机调度：监测处理机利用率，当利用率降低时，尝试调入新作业，调入新作业前，检查进程在内存的驻留页面是否够多，够多则调入；否则为缺页率较高的进程增加物理块且不调入新作业</p> <p>L=S 准则调节缺页率：L 为发生缺页之间的平均时间，S 为平均缺页服务时间</p> <ul><li>L &lt; S：缺页频繁，上一个缺页还没服务完，下一个缺页就发生了</li> <li>L &gt; S：很少发生缺页</li> <li>L ≈ S ：磁盘和处理机均达到最大利用率</li></ul> <p>暂停进程：当多道程序度大，且已经影响到处理机的利用率时，强行减少进程数</p> <p>降低读写磁盘频率：将换出的页面加入一个链表中（在内存里）</p> <ul><li>降低读频率：当 CPU 需要再次读取页面时，从该链表中取出</li> <li>降低写频率：当链表容量过大时，一次性写回磁盘</li></ul> <p>尽量从 SWAP 调入/出页面：换出的页面尽量进入 SWAP 分区，能够有效减少文件区的调入 / 出</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="52.894ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 23379.2 1000" aria-hidden="true" style="overflow:visible;
