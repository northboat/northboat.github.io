aNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">K8s 基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>“编排”永远都是容器云项目的灵魂所在，Linux 的进程模型对于容器本身的重要意义</p> <ul><li>为什么容器里只能跑“一个进程”？</li> <li>为什么我原先一直在用的某个 JVM 参数，在容器里就不好使了？</li> <li>为什么 Kubernetes 就不能固定 IP 地址？容器网络连不通又该如何去 Debug？</li> <li>Kubernetes 中 StatefulSet 和 Operator 到底什么区别？</li> <li>PV 和 PVC 这些概念又该怎么用？</li></ul> <h2 id="kubernetes-基础"><a href="#kubernetes-基础" class="header-anchor">#</a> Kubernetes 基础</h2> <ul><li><a href="https://github.com/kubernetes/kubernetes" target="_blank" rel="nofollow noopener noreferrer">GitHub - kubernetes/kubernetes: Production-Grade Container Scheduling and Management · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://k8s.sunnysfamily.hk/" target="_blank" rel="nofollow noopener noreferrer">K8S 教学实训平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="pod-相关概念"><a href="#pod-相关概念" class="header-anchor">#</a> Pod 相关概念</h3> <p>pod 的几个核心概念</p> <ul><li>pod 本身是真正跑服务，执行业务逻辑的单元</li> <li>deployment 是 pod 的配置（一份 yaml 文件），定义 pod 副本数量、使用什么镜像、更新策略等</li> <li>service 是 pod 的网络配置，描述 pod 怎么访问，通过 iptable 和 label 对接其网络入口</li></ul> <p>查看 codev-web-server 节点的 deploy</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get deploy codev-web-server <span class="token parameter variable">-o</span> yaml <span class="token operator">|</span> <span class="token function">head</span> <span class="token parameter variable">-60</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查看 service（svc）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get svc codev-web-server <span class="token parameter variable">-o</span> yaml <span class="token operator">|</span> <span class="token function">head</span> <span class="token parameter variable">-40</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>deployment 和 service 都是存在 etcd 里可复用的远端 yaml 配置，etcd 充当 k8s 的配置中心（七彩石）；当配置文件更新后，通过 Master API Server 向相关的 Node 进行广播，Node 上的 kubelet 代理接收到通知后，在 Node 本地实施配置变更</p> <div class="language-mermaid line-numbers-mode"><pre class="language-mermaid"><code><span class="token keyword">graph</span> TD
    H<span class="token text string">[&quot;👤 运维更新配置&lt;br/&gt;kubectl apply -f xx.yaml&quot;]</span>

    <span class="token keyword">subgraph</span> MASTER<span class="token text string">[&quot;Master 控制面&quot;]</span>
        ETCD<span class="token text string">[&quot;📦 etcd 配置中心&lt;br/&gt;Deployment + Service&quot;]</span>
    <span class="token keyword">end</span>

    ETCD <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;通知 Node 变更&quot;|</span> AGENT

    <span class="token keyword">subgraph</span> NODE<span class="token text string">[&quot;Node 工作节点&quot;]</span>
        AGENT<span class="token text string">[&quot;kubelet + kube-proxy&quot;]</span>
        POD<span class="token text string">[&quot;Pod 代码容器&quot;]</span>
        AGENT <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;管理/转发&quot;|</span> POD
    <span class="token keyword">end</span>

    H <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;API 提交配置&quot;|</span> ETCD
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>一个 Service 示例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>k get svc codev-app-open <span class="token parameter variable">-o</span> yaml <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> v1
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Service
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">annotations</span><span class="token punctuation">:</span>
    <span class="token key atrule">service.cloud.tencent.com/status.conditions</span><span class="token punctuation">:</span> <span class="token string">&quot;&quot;</span>
  <span class="token key atrule">creationTimestamp</span><span class="token punctuation">:</span> <span class="token string">&quot;2024-03-08T03:49:52Z&quot;</span>
  <span class="token key atrule">labels</span><span class="token punctuation">:</span>
    <span class="token key atrule">app.kubernetes.io/instance</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">name</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> devcloud<span class="token punctuation">-</span>ci
  <span class="token key atrule">resourceVersion</span><span class="token punctuation">:</span> <span class="token string">&quot;10466126729&quot;</span>
  <span class="token key atrule">selfLink</span><span class="token punctuation">:</span> /api/v1/namespaces/devcloud<span class="token punctuation">-</span>ci/services/codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">uid</span><span class="token punctuation">:</span> f7e77e2d<span class="token punctuation">-</span>18fa<span class="token punctuation">-</span>416c<span class="token punctuation">-</span>b562<span class="token punctuation">-</span>82d4d9e8b1bf
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">clusterIP</span><span class="token punctuation">:</span> 11.166.119.84
  <span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">name</span><span class="token punctuation">:</span> web80
    <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
    <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
    <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">8080</span>
  <span class="token key atrule">selector</span><span class="token punctuation">:</span>
    <span class="token key atrule">app</span><span class="token punctuation">:</span> codev<span class="token punctuation">-</span>app<span class="token punctuation">-</span>open
  <span class="token key atrule">sessionAffinity</span><span class="token punctuation">:</span> None
  <span class="token key atrule">type</span><span class="token punctuation">:</span> ClusterIP
<span class="token key atrule">status</span><span class="token punctuation">:</span>
  <span class="token key atrule">loadBalancer</span><span class="token punctuation">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>pod 和我们开发的项目，通过远端的镜像仓库和 Deployment 配置进行关联，CI 负责将我们提交的代码跟进项目的 Dockerfile 构建镜像并推送至镜像仓库，pod 根据 Deployment 拉取镜像并执行由 kubelet 调 containerd 跑</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>┌── Dockerfile ───────────────────────────────────────┐
│                                   ← 多阶段构建        │
│  阶段1: golang:1.20.2                                │
│          go build → 编译出 main 二进制                │
│                                                     │
│  阶段2: alpine:3.17                                  │
│          COPY main <span class="token builtin class-name">.</span>                                │
│          CMD <span class="token punctuation">[</span><span class="token string">&quot;./main&quot;</span><span class="token punctuation">]</span>                             │
└────────────────┬────────────────────────────────────┘
                 │ <span class="token function">docker</span> build <span class="token operator">&amp;</span> push
                 ▼
┌── 镜像仓库 ────────────────────────────────────────────┐
│  mirrors.tencent.com/codevpro/codev-web-server:3.4.2  │
└────────────────┬──────────────────────────────────────┘
                 │ Deployment YAML 引用镜像
                 ▼
┌── Deployment YAML ─────────────────────────────────────┐
│  spec:                                                 │
│    containers:                                         │
│    - name: codev-web-server                            │
│      image: mirrors<span class="token punctuation">..</span>.com/<span class="token punctuation">..</span>./codev-web-server:3.4.2   │
└────────────────┬───────────────────────────────────────┘
                 │ Master 分配 → kubelet 执行
                 ▼
┌── Pod（在 Node 上）─────────────────────────────────────┐
│  containerd 拉镜像 → 启动容器 → 运行 ./main              │
│  你的 Go 代码就在这个容器里跑                             │
└────────────────────────────────────────────────────────┘
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br></div></div><h3 id="node-和-master"><a href="#node-和-master" class="header-anchor">#</a> Node 和 Master</h3> <p>pod 是 k8s 最小的工作单元，拥有独立的运行环境，是真正跑业务、处理请求逻辑的单元，其本质上是一个个 Docker 容器的组合，类似于一个 Docker Compose，这意味着，一个 pod 里可以跑多个 container 服务</p> <ul><li>例如，在一个 pod 中，额外跑一个 zhiyan-agent 容器监听当前 pod 里的 web-server 容器，用于日志采集和监控上报</li></ul> <p>同一个 pod 里的 container 共享 pod 的网络和存储，可以把 pod 理解为 os 中的进程，而 container 为同一进程中的不同线程</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>┌──── Pod: codev-web-app ──────────────┐
│                                      │
│  ┌─ codev-web-app <span class="token punctuation">(</span>main container<span class="token punctuation">)</span>─┐ │
│  │  Go 业务代码                     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  ┌─ zhiyan-agent <span class="token punctuation">(</span>Sidecar<span class="token punctuation">)</span>─────────┐ │
│  │  Log Collection / Reporting     │ │
│  └─────────────────────────────────┘ │
│                                      │
│  共享：网络（同 IP）、存储卷            │
└──────────────────────────────────────┘
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>每个 pod 都是一个纯粹的“服务”，他是我们业务逻辑实现的程序，pod 的管理分为两部分</p> <ul><li>Master（Scheduler）→ 决定 Pod 分到哪台 Node  ← 决策</li> <li>Master（Controller Mgr）→ 保证 Pod 数量对 ← 决策</li> <li>Node（kubelet）→ 在本机启动/停止容器 ← 执行</li></ul> <p>k8s 中只有两种节点，一种 Master 一种 Node，Master 是管理者，Node 是执行者</p> <p>Node 本质上是一台安装了 Kubernetes 代理（kubelet）+ Kubernates 网络代理（kube-proxy） + 容器运行时（Docker/containerd）的服务器</p> <ol><li>Kubelet 代理，用于管理本机 pod</li> <li>Kube Proxy 网络代理，负责服务访问</li> <li>Container Runtime 容器运行时（Docker/containerd），负责起 pod</li></ol> <p>kubelet 是 Kubernetes（K8s）集群中运行在每个工作节点（Node）上的核心“节点代理”，是 k8s 的下层管理者</p> <ul><li>向外与 Master 通信实施 k8s 管理：通过 API Server 注册当前节点，并持续通报节点的主机名、CPU/内存等可用资源及健康状态；监听 Master 通知，接收并执行分配给该节点的任务，确保节点上的 Pod 和容器完全按照集群期望的状态正常运行</li> <li>向内管理容器生命周期：通过容器运行时（如 Docker、containerd）创建、启动、停止和删除 Pod 及容器；定期执行容器的探针（Probe，如 liveness 和 readiness），一旦发现容器异常，会自动重启或将其剔除出流量转发列表；管理节点本地的硬件资源分配，在 Pod 启动前挂载所需的存储卷（Volume）以及拉取镜像</li></ul> <p>一个 Node 可以跑上千个 Pod，二者相当于服务器与进程的关系（Pod 和 container 是进程和线程的关系）</p> <p>而 Master 节点相当于 k8s 的自动化运维，去统筹所有的 Node 服务器资源，他包括</p> <ol><li>API Server：所有请求入口，写入 etcd 对外暴露 REST API</li> <li>Etcd NoSQL 存储：存集群所有 YAML 数据（Deployment、Service、ConfigMap）以及集群状态（Pod 与 Node 的映射表、IP 多少）</li> <li>Scheduler 调度器：决定 Pod 分配到哪台 Node，看哪台机器 CPU/内存够用</li> <li>Controller Manager 控制器：控制 pod 状态，监听 etcd 变化，维持期望状态 Pod 挂了自动补、副本数不对自动扩缩</li></ol> <p>一个 k8s 集群可以运行多个 Master，但针对不同组件，尤其对于“写”的场景，同时只能有一个 Master 工作</p> <table><thead><tr><th style="text-align:center;">Master 组件</th> <th style="text-align:center;">工作模式</th></tr></thead> <tbody><tr><td style="text-align:center;"><strong>API Server</strong></td> <td style="text-align:center;">多实例<strong>同时工作</strong>，无状态</td></tr> <tr><td style="text-align:center;"><strong>etcd</strong></td> <td style="text-align:center;">Raft 协议，1 个 Leader 写，所有节点可读</td></tr> <tr><td style="text-align:center;"><strong>Scheduler</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr> <tr><td style="text-align:center;"><strong>Controller Manager</strong></td> <td style="text-align:center;"><strong>选主</strong>，只有 1 个活跃</td></tr></tbody></table> <p>针对 etcd 的 Raft 共识要求，节点数必须是奇数个，并且同时只有一个“写”节点，否则会发生“脑裂”</p> <p>在运维过程中，人实际上只和 Master 打交道，准确的说是 API Server，剩余的工作均由 Master 和 kubelet 通信和实施，大致的请求分两种</p> <ul><li>配置的读写：例如查写 pod 的 Service、Deployment、ConfigMap，这一类操作基本上就是在读写 etcd，而后由 k8s 来<strong>实施</strong>这些改动</li> <li>pod 的交互：例如进入 pod，停止 pod，回滚 pod</li></ul> <p>例如执行一句 <code>kubectl exec -it pod --bash</code> 后，会经过以下过程</p> <div class="language-mermaid line-numbers-mode"><pre class="language-mermaid"><code><span class="token keyword">flowchart</span> LR
    <span class="token keyword">subgraph</span> LOCAL<span class="token text string">[&quot;你的终端&quot;]</span>
        KUBECTL[<span class="token string">&quot;kubectl exec -it pod -- bash&quot;</span>]
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> MASTER<span class="token text string">[&quot;Master&quot;]</span>
        API<span class="token text string">[&quot;API Server&lt;br/&gt;鉴权 + 找到 Pod 所在 Node&quot;]</span>
        ETCD<span class="token text string">[&quot;etcd&lt;br/&gt;查 Pod 跑在哪个 Node&quot;]</span>
    <span class="token keyword">end</span>

    <span class="token keyword">subgraph</span> NODE<span class="token text string">[&quot;Node: 9.135.144.31&quot;]</span>
        KL<span class="token text string">[&quot;kubelet&lt;br/&gt;收到请求，调 CRI&quot;]</span>
        CR<span class="token text string">[&quot;Container Runtime&lt;br/&gt;containerd&quot;]</span>
        CONT<span class="token text string">[&quot;Container&lt;br/&gt;bash 进程&quot;]</span>
    <span class="token keyword">end</span>

    KUBECTL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;1. HTTPS POST /exec&quot;|</span> API
    API <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;2. 查 Pod 位置&quot;|</span> ETCD
    API <span class="token arrow operator">-.-&gt;</span><span class="token label property">|&quot;3. SPDY/WebSocket&lt;br/&gt;协议升级，双向流&quot;|</span> KL
    KL <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;4. CRI exec 调用&quot;|</span> CR
    CR <span class="token arrow operator">--&gt;</span><span class="token label property">|&quot;5. nsenter 进入&lt;br/&gt;容器 namespace&quot;|</span> CONT
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><table><thead><tr><th style="text-align:center;">步骤</th> <th style="text-align:center;">组件</th> <th style="text-align:center;">步骤详解</th></tr></thead> <tbody><tr><td style="text-align:center;">1</td> <td style="text-align:center;"><strong>kubectl</strong></td> <td style="text-align:center;">发 HTTPS 请求到 API Server：<code>POST /api/v1/namespaces/devcloud-ci/pods/codev-app-open-xxx/exec?command=bash&amp;stdin=true&amp;stdout=true&amp;tty=true</code></td></tr> <tr><td style="text-align:center;">2</td> <td style="text-align:center;"><strong>API Server → etcd</strong></td> <td style="text-align:center;">查 <code>codev-app-open-xxx</code> 跑在 <code>Node 9.135.144.31</code> 上</td></tr> <tr><td style="text-align:center;">3</td> <td style="text-align:center;"><strong>API Server → kubelet</strong></td> <td style="text-align:center;">把请求<strong>代理转发</strong>到 Node 上的 kubelet，协议从 HTTPS 升级为 <strong>SPDY/WebSocket</strong>（支持双向流）</td></tr> <tr><td style="text-align:center;">4</td> <td style="text-align:center;"><strong>kubelet → containerd</strong></td> <td style="text-align:center;">通过 CRI（容器运行时接口）调用 <code>ExecSync</code>，在容器里启动 bash</td></tr> <tr><td style="text-align:center;">5</td> <td style="text-align:center;"><strong>containerd → 容器</strong></td> <td style="text-align:center;">用 <code>nsenter</code> 进入容器的 namespace，启动 bash 进程，stdin/stdout/stderr 通过 SPDY/WebSocket 双向流转回你的终端</td></tr></tbody></table> <p>简单来说，就是建立一条 SPDY/WebSocket 双工通道，用户通过通道的 标准输入输出与 pod 中的 bash 进行交互，当然，这里由 API Server 作为通道的转发跳板，连通集群内外的我和你</p> <ul><li>SPDY 是老版本 k8s 的 <code>exec / log/ port-forward</code> 通信协议，这是 Google 09 年提出的实验协议，HTTP/2 的前身，在 k8s 1.30+ 中默认使用 WebSocket</li></ul> <h3 id="hpa-自动伸缩"><a href="#hpa-自动伸缩" class="header-anchor">#</a> HPA 自动伸缩</h3> <blockquote><p><a href="https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/" target="_blank" rel="nofollow noopener noreferrer">Horizontal Pod Autoscaling<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>Scale 伸缩是 K8s 一个很重要的概念，K8s 控制器将根据 deployment yaml 动态的保证 pod 数量始终为 replicas 副本字段的值，这里用到 HPA 机制，当然也可以通过 kubectl 命令手动 scale，在 k8s 运行时中，防止 scale 抖动是一个值得讨论的命题</p> <p>可以使用 kubectl scale 更改 Kubernetes 的 <code>deployment, replica set, replication controller, statefulset</code> 等对象的副本数量（扩容缩容）</p> <ul><li>当我们增加副本数时，Kubernetes 将启动新的 Pod 来扩我们的服务</li> <li>降低副本数将导致 Kubernetes 优雅地终止一些 pod，从而释放集群资源</li></ul> <p>kubectl scale 命令，执行该命令将调整名为demo-deployment 的部署，使其拥有三个正在运行的副本</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl scale <span class="token parameter variable">--replicas</span><span class="token operator">=</span><span class="token number">3</span> deployment/demo-deployment
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>等价的方式是修改 Deployment yaml 文件，将 spec.replicas 字段修改为 3，然后重新应用 yaml 文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl apply <span class="token parameter variable">-f</span> demo-deployment.yaml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>利用 K8S 自动伸缩的特性，可以通过杀死一个容器去重启这个容器</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 通过 k8s 删除后自动拉起</span>
kubectl delete <span class="token parameter variable">-n</span> devnet-admin pod cc-daemon-xxx

<span class="token comment"># 通过 docker 删除后自动拉起</span>
<span class="token function">docker</span> <span class="token function">ps</span> <span class="token operator">|</span> <span class="token function">grep</span> cc-daemon
<span class="token function">docker</span> stop cc-daemon-container-id
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="k8s-controller"><a href="#k8s-controller" class="header-anchor">#</a> K8s Controller</h3> <p>“控制器”模式对整个 Kubernetes 项目提纲挈领的作用</p> <ul><li><a href="https://zhuanlan.zhihu.com/p/663605675" target="_blank" rel="nofollow noopener noreferrer">一文读懂K8s controller-runtime - 知乎<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/1989055" target="_blank" rel="nofollow noopener noreferrer">Controller Runtime 的四种使用姿势-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.xiexianbin.cn/kubernetes/dev/controller-runtime/" target="_blank" rel="nofollow noopener noreferrer">k8s controller-runtime 介绍 | 谢先斌的博客<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在所有的 K8s yaml 文件里，都有一个 Kind 的字段，用于定义资源类型，除了真正的干活的 Pod 容器，K8s 里有很多很多种资源，例如我们说过的 service、deployment，还例如 CronJob，这里的每一种资源，都对应了一个下层 Controller 来实现该种资源的业务逻辑控制</p> <ul><li>Service：定义网络访问控制</li> <li>Deployment：定义 Pod 伸缩规则</li> <li>CronJob：定义定时任务</li></ul> <p>我将其理解为 Spring 中的自定义 Bean（MyBatis），通过打包底层逻辑，让 K8s 可以直接通过 yaml 识别这种 Bean，而后通过用户提供的 Controller 对这 Bean 进行业务逻辑处理</p> <h3 id="隔离与虚拟技术"><a href="#隔离与虚拟技术" class="header-anchor">#</a> 隔离与虚拟技术</h3> <p>KMM</p> <p>Kata Container</p> <h2 id="k8s-运维"><a href="#k8s-运维" class="header-anchor">#</a> K8s 运维</h2> <p>kubectl 是 Kubernetes 集群的官方命令行工具 —— 与 Kubernetes API 交互的客户端</p> <h3 id="pod-接口测试"><a href="#pod-接口测试" class="header-anchor">#</a> Pod 接口测试</h3> <p>Mac Brew 安装 kubectl</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 下载并验证版本</span>
brew <span class="token function">install</span> kubectl
kubectl version

Client Version: v1.29.3
Kustomize Version: v5.0.4-0.20230601165947-6ce0bf390ce3
Server Version: v1.18.4-tke.25
WARNING: version difference between client <span class="token punctuation">(</span><span class="token number">1.29</span><span class="token punctuation">)</span> and server <span class="token punctuation">(</span><span class="token number">1.18</span><span class="token punctuation">)</span> exceeds the supported minor version skew of +/-1
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>将集群的 kubeconfig 写入 ~/.kube/config，包含</p> <ul><li>集群地址</li> <li>命名空间</li> <li>账号（受限于命名空间）</li> <li>token 凭证</li></ul> <p>测试连通性</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 设置别名，省事</span>
<span class="token builtin class-name">alias</span> <span class="token assign-left variable">k</span><span class="token operator">=</span><span class="token string">'/codev/bin/kubectl'</span>
<span class="token comment"># mac 本地</span>
<span class="token builtin class-name">echo</span> <span class="token string">'alias k=&quot;kubectl&quot;'</span> <span class="token operator">&gt;&gt;</span> ~/.zshrc
<span class="token builtin class-name">source</span> ~/.zshrc

<span class="token comment"># 查看当前上下文</span>
k config get-contexts

CURRENT   NAME          CLUSTER   AUTHINFO   NAMESPACE
*         cur-context   cluster   sa         devcloud-ci
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>直接命令连接操作集群，常用的 kubectl 命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看命名空间下的 Pod</span>
k get pods

<span class="token comment"># 查看所有资源</span>
k get all

<span class="token comment"># 查看 Service</span>
k get svc

<span class="token comment"># 查看 Deployment</span>
k get deploy

<span class="token comment"># 查看 Pod 日志</span>
k logs <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 实时查看日志</span>
k logs <span class="token parameter variable">-f</span> <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 进入容器交互</span>
k <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span> -- /bin/bash

<span class="token comment"># 查看 Pod 详细信息</span>
k describe pod <span class="token operator">&lt;</span>pod-name<span class="token operator">&gt;</span>

<span class="token comment"># 查看资源使用</span>
k <span class="token function">top</span> pods
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>如何通过运维通道进到用户 pod 排查问题？</p> <ul><li>如何去 k8s 底层看 pod 的运行情况？</li> <li>怎么判断 pod 是否运行正常？</li> <li>如何追 pod 异常原因？</li></ul> <p>接口测试，我现在想在测试集群里测试 app-open 的某个接口，首先先把 app-open 的 pod 和配置查出来，这一堆 grep 得熟悉</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查 pod</span>
k get pods <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 svc</span>
k get svc <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 Deployment</span>
k get deploy <span class="token operator">|</span> <span class="token function">grep</span> app-open

<span class="token comment"># 查 pod 的 Node 信息</span>
k get pods <span class="token parameter variable">-o</span> wide <span class="token operator">|</span> <span class="token function">grep</span> app-open
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>找到了 pod 名</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>codev-app-open-7fd76f7885-xm5px 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查询 pod 上服务端口，通过 svc 配置文件得知</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>k get svc codev-app-open <span class="token parameter variable">-o</span> yaml <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A5</span> <span class="token string">&quot;ports:&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">ports</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">name</span><span class="token punctuation">:</span> web80
    <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">80</span>
    <span class="token key atrule">protocol</span><span class="token punctuation">:</span> TCP
    <span class="token key atrule">targetPort</span><span class="token punctuation">:</span> <span class="token number">8080</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>port forward 把 pod 映射到我本地的 8081，本质上是建立了一条 tcp 通道，这样不会影响到 pod</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 把 Pod 的 8080 映射到本地 8081</span>
kubectl port-forward pod/codev-app-open-7fd76f7885-xm5px <span class="token number">8081</span>:8080
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>也可以进 pod 之后在 pod 内部进行 curl</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> codev-app-open-7fd76f7885-xm5px -- /bin/sh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后直接 curl，如果是 port-forward 就是 8081，如果是 exec 后就是 8080</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-X</span> POST <span class="token string">'http://127.0.0.1:8081/env/extra/info'</span> <span class="token parameter variable">-H</span> <span class="token string">'Content-Type: application/json'</span> <span class="token parameter variable">-H</span> <span class="token string">'APPID: anydev_all'</span> <span class="token parameter variable">-d</span> <span class="token string">'{&quot;username&quot;:&quot;saulxiong&quot;,&quot;envId&quot;:&quot;evnIns-72zylw7h9bcq&quot;,&quot;columns&quot;:&quot;passEnvId&quot;}'</span>

<span class="token function">curl</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-X</span> POST <span class="token string">'http://127.0.0.1:8081/env/info/update'</span> <span class="token parameter variable">-H</span> <span class="token string">'Content-Type: application/json'</span> <span class="token parameter variable">-H</span> <span class="token string">'APPID: anydev_all'</span> <span class="token parameter variable">-d</span> <span class="token string">'{&quot;username&quot;:&quot;saulxiong&quot;,&quot;envId&quot;:&quot;evnIns-72zylw7h9bcq&quot;,&quot;teamEnv&quot;:true,&quot;envName&quot;:&quot;https://git.woa.com/wenchain/genflow&quot;,&quot;idePath&quot;:&quot;/data/workspace&quot;,&quot;ideName&quot;:&quot;Comate&quot;,&quot;ideVersion&quot;:&quot;2.0&quot;}'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="pod-日志查询"><a href="#pod-日志查询" class="header-anchor">#</a> Pod 日志查询</h3> <p>进 web-server 服务 pod 查日志</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">mkdir</span> <span class="token parameter variable">-p</span> ~/.kube
<span class="token function">cp</span> kubeconfig.yaml ~/.kube/config
<span class="token function">chmod</span> <span class="token number">600</span> ~/.kube/config

<span class="token comment"># 测试配置连接</span>
kubectl config view <span class="token parameter variable">--minify</span>
kubectl get pods <span class="token parameter variable">-n</span>

<span class="token comment"># 显式指定 namespace 查询，等价于 --namespace devcloud-ci</span>
kubectl get pods <span class="token parameter variable">-n</span> devcloud-ci
<span class="token comment"># grep 想要的 pod name</span>
kubectl get pods <span class="token operator">|</span> <span class="token function">grep</span> web-server

codev-web-server-69df6bd4b5-tzqp2                                 <span class="token number">1</span>/1     Running              <span class="token number">0</span>          21h
codev-web-server-portal-5dd5d89c7-l69qx                           <span class="token number">1</span>/1     Running              <span class="token number">0</span>          26h
codev-web-server-portal-v2-7fc4db6887-g8jjv                       <span class="token number">1</span>/1     Running              <span class="token number">0</span>          14d
codev-web-server-v2-6b8fd87bd9-bzdqf                              <span class="token number">1</span>/1     Running              <span class="token number">0</span>          14d
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>拿到主服务 pod 名 <code>codev-web-server-69df6bd4b5-tzqp2</code></p> <ul><li><code>codev-web-server-*</code>：当前主服务</li> <li><code>codev-web-server-portal-*</code>：门户服务</li> <li><code>codev-web-server-v2-*</code>：V2 服务</li></ul> <p>交互登陆 pod</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> codev-web-server-69df6bd4b5-tzqp2 -- <span class="token function">sh</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>此时已经进入 pod 了，查看日志目录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看日志目录</span>
<span class="token function">ls</span> <span class="token parameter variable">-lh</span> /data/solution/logs/environment/

<span class="token comment"># 查看日志最近内容</span>
<span class="token function">tail</span> <span class="token parameter variable">-20</span> /data/solution/logs/environment/trpc.log

<span class="token comment"># 根据环境 uid 查日志</span>
<span class="token function">grep</span> <span class="token string">'evnIns-7bzd7xuuorqo'</span> /data/solution/logs/environment/trpc.log
<span class="token comment"># 看最近 100 条</span>
<span class="token function">grep</span> <span class="token string">'evnIns-7bzd7xuuorqo'</span> /data/solution/logs/environment/trpc.log <span class="token operator">|</span> <span class="token function">tail</span> <span class="token parameter variable">-100</span>

<span class="token comment"># 实时追踪该环境的日志</span>
<span class="token function">tail</span> <span class="token parameter variable">-f</span> /data/solution/logs/environment/trpc.log <span class="token operator">|</span> <span class="token function">grep</span> --line-buffered <span class="token string">'evnIns-7bzd7xuuorqo'</span>

<span class="token comment"># 追踪仅打标归档的日志</span>
<span class="token function">tail</span> <span class="token parameter variable">-f</span> /data/solution/logs/environment/trpc.log <span class="token operator">|</span> <span class="token function">grep</span> --line-buffered <span class="token parameter variable">-E</span> <span class="token string">'evnIns-7bzd7xuuorqo | archive mark-only|archiveMarkOnly'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>退出 pod</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">exit</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>不进入 pod 的等价命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl <span class="token builtin class-name">exec</span> codev-web-server-69df6bd4b5-tzqp2 -- <span class="token function">grep</span> <span class="token string">'evnIns-7bzd7xuuorqo'</span> /data/solution/logs/environment/trpc.log

kubectl logs <span class="token parameter variable">-f</span> codev-web-server-69df6bd4b5-tzqp2 <span class="token operator">|</span> <span class="token function">grep</span> --line-buffered <span class="token string">'evnIns-7bzd7xuuorqo'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="cronjob-部署"><a href="#cronjob-部署" class="header-anchor">#</a> CronJob 部署</h3> <blockquote><p>如何在集群内部署一个定时任务服务</p></blockquote> <p>偷师剑哥根据 ip 查 pod</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get pod <span class="token parameter variable">-n</span> devnet-admin <span class="token parameter variable">-o</span> wide <span class="token operator">|</span> <span class="token function">grep</span> <span class="token number">127.0</span>.0.1
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>更新已有集群内的一个 cronjob，查 cronjob（<code>-o wide = --output wide</code>）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get cronjob <span class="token parameter variable">-o</span> wide <span class="token operator">|</span> <span class="token function">grep</span> operate-archive-env-collector
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查 yaml 配置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>get cronjob operate-archive-env-collector <span class="token parameter variable">-o</span> yaml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>直接打 patch，执行 replace 操作修改已有 cronjob 的镜像</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl patch cronjob operate-archive-env-collector <span class="token parameter variable">-n</span> devcloud-ci <span class="token punctuation">\</span>
  <span class="token parameter variable">--type</span><span class="token operator">=</span><span class="token string">'json'</span> <span class="token punctuation">\</span>
  <span class="token parameter variable">-p</span><span class="token operator">=</span><span class="token string">'[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/jobTemplate/spec/template/spec/containers/0/image&quot;,&quot;value&quot;:&quot;mirrors.tencent.com/codevpro/codev-collector:3.6.2_413b99e9&quot;}]'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>其实查 pod 也能查到对应的 cronjob pod，因为每次 cronjob 执行都会拉起一个 pod 来执行任务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>kubectl get pods <span class="token operator">|</span> <span class="token function">grep</span> operate-archive-env-collector
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>如果要新注册一个 cronjob，实际上就是 apply 一份 kind 为 CronJob 的 yaml 文件，这里 k8s 判断是否新建的唯一凭据是 metadata.name 是否已有，若有则覆盖若无则新建</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>kubectl apply <span class="token punctuation">-</span>f operate<span class="token punctuation">-</span>archive<span class="token punctuation">-</span>env<span class="token punctuation">-</span>collector.yaml
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这里的 collector 实际上是一个命令行程序，通过命令行参数执行 handle 相应的任务，例如执行一个环境归档任务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token assign-left variable">config</span><span class="token operator">=</span>cfg <span class="token assign-left variable">local_config</span><span class="token operator">=</span>true ./main operate-archive-env-collector
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在 CronJob 的 spec 配置中写好 args 和 command 就好</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">concurrencyPolicy</span><span class="token punctuation">:</span> Forbid
  <span class="token key atrule">failedJobsHistoryLimit</span><span class="token punctuation">:</span> <span class="token number">1</span>
  <span class="token key atrule">jobTemplate</span><span class="token punctuation">:</span>
    <span class="token key atrule">metadata</span><span class="token punctuation">:</span>
      <span class="token key atrule">creationTimestamp</span><span class="token punctuation">:</span> <span class="token null important">null</span>
    <span class="token key atrule">spec</span><span class="token punctuation">:</span>
      <span class="token key atrule">completions</span><span class="token punctuation">:</span> <span class="token number">1</span>
      <span class="token key atrule">parallelism</span><span class="token punctuation">:</span> <span class="token number">1</span>
      <span class="token key atrule">template</span><span class="token punctuation">:</span>
        <span class="token key atrule">metadata</span><span class="token punctuation">:</span>
          <span class="token key atrule">creationTimestamp</span><span class="token punctuation">:</span> <span class="token null important">null</span>
          <span class="token key atrule">labels</span><span class="token punctuation">:</span>
            <span class="token key atrule">k8s-app</span><span class="token punctuation">:</span> operate<span class="token punctuation">-</span>archive<span class="token punctuation">-</span>env<span class="token punctuation">-</span>collector
            <span class="token key atrule">qcloud-app</span><span class="token punctuation">:</span> operate<span class="token punctuation">-</span>archive<span class="token punctuation">-</span>env<span class="token punctuation">-</span>collector
        <span class="token key atrule">spec</span><span class="token punctuation">:</span>
          <span class="token key atrule">containers</span><span class="token punctuation">:</span>
          <span class="token punctuation">-</span> <span class="token key atrule">args</span><span class="token punctuation">:</span>
            <span class="token punctuation">-</span> operate_archive_env
            <span class="token punctuation">-</span> collector
            <span class="token key atrule">command</span><span class="token punctuation">:</span>
            <span class="token punctuation">-</span> ./main
            <span class="token comment"># ...</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><h3 id="prometheus-基础"><a href="#prometheus-基础" class="header-anchor">#</a> Prometheus 基础</h3> <p>Prometheus（普罗米修斯）是一款开源系统监控与警报工具包，是 Kubernetes 的标准运维方案</p> <p>PromQL（Prometheus Query Language），Prometheus 监控系统的查询语言（类似于 SQL 之于 MySQL）</p> <table><thead><tr><th>概念</th> <th>说明</th> <th>示例</th></tr></thead> <tbody><tr><td>即时向量</td> <td>同一时刻的一组时间序列</td> <td><code>http_requests_total</code></td></tr> <tr><td>范围向量</td> <td>时间范围内的数据</td> <td><code>http_requests_total[5m]</code></td></tr> <tr><td>聚合运算</td> <td>sum、avg、max 等</td> <td><code>sum(rate(x[1m]))</code></td></tr> <tr><td>函数</td> <td>内置函数处理数据</td> <td><code>rate(), increase(), histogram_quantile()</code></td></tr></tbody></table> <p>查询示例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># CPU 使用率</span>
rate<span class="token punctuation">(</span>node_cpu_seconds_total<span class="token punctuation">{</span>mode<span class="token operator">!=</span><span class="token string">&quot;idle&quot;</span><span class="token punctuation">}</span><span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">)</span>

<span class="token comment"># HTTP 错误率</span>
sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_requests_total<span class="token punctuation">{</span>status<span class="token operator">=~</span><span class="token string">&quot;5..&quot;</span><span class="token punctuation">}</span><span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span> / sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_requests_total<span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span>

<span class="token comment"># P99 延迟</span>
histogram_quantile<span class="token punctuation">(</span><span class="token number">0.99</span>, sum<span class="token punctuation">(</span>rate<span class="token punctuation">(</span>http_request_duration_seconds_bucket<span class="token punctuation">[</span>5m<span class="token punctuation">]</span><span class="token punctuation">))</span> by <span class="token punctuation">(</span>le<span class="token punctuation">))</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h3 id="dind-方案"><a href="#dind-方案" class="header-anchor">#</a> DinD 方案</h3> <blockquote><p>Docker-in-Docker</p></blockquote> <p>在 Docker 容器中启用 Docker，套如娃</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> run <span class="token parameter variable">--privileged</span> <span class="token parameter variable">--name</span> dind-container <span class="token parameter variable">-d</span> docker:dind
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>--privileged</code>：授予容器额外权限，允许其运行 Docker 守护进程</li> <li><code>docker:dind</code>：官方 DinD 镜像，包含 Docker 守护进程和客户端</li> <li><code>-d</code>：以后台模式运行容器</li></ul> <p>进入容器并运行 Docker 命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> dind-container <span class="token function">sh</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>进入容器后，可以像在主机上一样运行 Docker 命令，例如</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> info
<span class="token function">docker</span> run <span class="token parameter variable">-it</span> <span class="token parameter variable">--rm</span> alpine
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>注意事项</p> <ol><li>安全性：<code>--privileged</code> 模式可能带来安全风险，不建议在生产环境中使用</li> <li>性能开销：DinD 会增加资源消耗，尤其是在嵌套运行多个容器时</li> <li>替代方案：如果不需要完全隔离的 Docker 环境，可以通过挂载宿主机的 Docker 套接字实现类似功能</li></ol> <h2 id="agent-in-k8s"><a href="#agent-in-k8s" class="header-anchor">#</a> Agent in K8s</h2> <h3 id="kagent"><a href="#kagent" class="header-anchor">#</a> KAgent</h3> <blockquote><p>将 Agent 融入 K8s 的生命周期，以期解决 Agent 的工程化问题，包括但不限于网络通信、工作区管理、生命周期管理</p> <ul><li>赌 Agent 最后的生命形态会是 K8s 的一个个 Pod，这符合云原生的直觉</li></ul></blockquote> <p>kagent 是一个 k8s 原生 Agent 框架，将 agent 作为 k8s 的一种自定义资源 CRD 融入 k8s pod 的生命周期，使其成为一种原生的 K8s 配置（与普通的 Pod 同级），解决 agent 的编排、调度、通信、存储等生产级问题</p> <p>通常而言，我们要实现一种自定义资源，首先是定义其 CRD，而后是实现其控制器 controller</p> <ul><li><a href="https://mp.weixin.qq.com/s/94MvsVHEUY9zEOKwA7a3DA" target="_blank" rel="nofollow noopener noreferrer">kagent：CNCF 首个 Kubernetes 原生 AI Agent 框架，Go Operator 如何管理 Agent 生命周期<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/kagent-dev/kagent" target="_blank" rel="nofollow noopener noreferrer">GitHub - kagent-dev/kagent: Cloud Native Agentic AI | Discord: https://bit.ly/kagentdiscord · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://mp.weixin.qq.com/s/CeEqFEAbGW9yZC_sbUPFlw" target="_blank" rel="nofollow noopener noreferrer">从 Harness 到 Environment：Agent 工程范式的六阶跃迁<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>正常来说，我们做 Harness Agent，就是创建一个 Pod，然后拉仓库启动项目，Agent 作为代码库的形式耦合到 K8s Pod 里</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> clone my-agent
pip <span class="token function">install</span> <span class="token parameter variable">-r</span> requirements.txt
python agent.py  <span class="token comment"># 手动管理生命周期</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>但 kagent 的思路是，把 Agent 是做 K8s 的资源，通过 yaml 文件启动</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>kubectl apply <span class="token punctuation">-</span>f agent.yaml
kubectl get agents
<span class="token comment"># NAME               STATUS   AGE</span>
<span class="token comment"># gateway-debugger   Ready    2m</span>
<span class="token comment"># log-analyzer       Ready    1m</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>显然前者不如后者“原生”，kagent 将 Infrastructure as Repo 演进为 Infrastructure as Agents</p> <table><thead><tr><th style="text-align:left;">传统资源</th> <th style="text-align:left;">kagent Agent</th></tr></thead> <tbody><tr><td style="text-align:left;"><code>kubectl apply -f deployment.yaml</code></td> <td style="text-align:left;"><code>kubectl apply -f agent.yaml</code></td></tr> <tr><td style="text-align:left;"><code>kubectl get pods</code></td> <td style="text-align:left;"><code>kubectl get agents</code></td></tr> <tr><td style="text-align:left;">HPA 自动伸缩</td> <td style="text-align:left;">K8s 原生弹性伸缩</td></tr> <tr><td style="text-align:left;">RBAC 权限控制</td> <td style="text-align:left;">K8s RBAC 控制 Agent 工具权限</td></tr> <tr><td style="text-align:left;"><code>kubectl delete</code> 触发垃圾回收</td> <td style="text-align:left;">Agent 删除自动清理所有关联资源</td></tr></tbody></table> <p>简单来说，就是自定义化一整套的 Agent CRD，使之成为与 Pod 同级别的容器环境</p> <ul><li>CRD = Custom Resource Definition，它允许用户向 Kubernetes API 添加自定义资源，而无需修改 K8s 源码（类似于 Spring 中自定义 Bean 的注入）</li></ul> <p>Agent CRD 是 Agent 环境的核心定义</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">apiVersion</span><span class="token punctuation">:</span> kagent.dev/v1alpha2
<span class="token key atrule">kind</span><span class="token punctuation">:</span> Agent
<span class="token key atrule">metadata</span><span class="token punctuation">:</span>
  <span class="token key atrule">name</span><span class="token punctuation">:</span> gateway<span class="token punctuation">-</span>debugger
  <span class="token key atrule">namespace</span><span class="token punctuation">:</span> kagent
<span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">description</span><span class="token punctuation">:</span> <span class="token string">&quot;Debug Istio Gateway and HTTPRoute configuration issues&quot;</span>
  <span class="token key atrule">modelConfig</span><span class="token punctuation">:</span> claude<span class="token punctuation">-</span>sonnet<span class="token punctuation">-</span>4<span class="token punctuation">-</span>model    <span class="token comment"># 引用 ModelConfig</span>
  <span class="token key atrule">systemMessage</span><span class="token punctuation">:</span> <span class="token punctuation">|</span><span class="token scalar string">
    You are an expert Istio Gateway troubleshooting agent.
    Analyze Gateway and HTTPRoute configurations to find issues.</span>
  <span class="token key atrule">tools</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token key atrule">type</span><span class="token punctuation">:</span> McpServer
      <span class="token key atrule">mcpServer</span><span class="token punctuation">:</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> prometheus<span class="token punctuation">-</span>tools           <span class="token comment"># 引用 MCP 服务器</span>
        <span class="token key atrule">toolNames</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;query_metrics&quot;</span><span class="token punctuation">]</span>
    <span class="token punctuation">-</span> <span class="token key atrule">type</span><span class="token punctuation">:</span> Agent                        <span class="token comment"># 引用另一个 Agent 作为工具</span>
      <span class="token key atrule">agent</span><span class="token punctuation">:</span>
        <span class="token key atrule">name</span><span class="token punctuation">:</span> diagnostics<span class="token punctuation">-</span>agent
  <span class="token key atrule">memory</span><span class="token punctuation">:</span>
    <span class="token key atrule">modelConfig</span><span class="token punctuation">:</span> embedding<span class="token punctuation">-</span>model
    <span class="token key atrule">ttlDays</span><span class="token punctuation">:</span> <span class="token number">15</span>                          <span class="token comment"># 记忆保留 15 天</span>
  <span class="token key atrule">deployment</span><span class="token punctuation">:</span>
    <span class="token key atrule">replicas</span><span class="token punctuation">:</span> <span class="token number">2</span>
    <span class="token key atrule">resources</span><span class="token punctuation">:</span>
      <span class="token key atrule">requests</span><span class="token punctuation">:</span> <span class="token punctuation">{</span> <span class="token key atrule">cpu</span><span class="token punctuation">:</span> <span class="token string">&quot;100m&quot;</span><span class="token punctuation">,</span> <span class="token key atrule">memory</span><span class="token punctuation">:</span> <span class="token string">&quot;256Mi&quot;</span> <span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>其核心特性包括</p> <ol><li><p><strong>CEL 验证规则</strong> —— Kubernetes 原生的准入控制</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>// api/v1alpha2/agent_types.go
<span class="token key atrule">// +kubebuilder:validation:XValidation:rule=&quot;has(self.type) &amp;&amp; self.type == 'Declarative' ? has(self.declarative)</span> <span class="token punctuation">:</span> true&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div></li> <li><p><strong>Owner Reference 链</strong> —— Agent → Deployment + ConfigMap + Service，删除 Agent 自动清理</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>// 控制器创建资源时设置 OwnerReference
deployment.OwnerReferences = <span class="token punctuation">[</span><span class="token punctuation">]</span>metav1.OwnerReference<span class="token punctuation">{</span>
    <span class="token punctuation">{</span>
        <span class="token key atrule">APIVersion</span><span class="token punctuation">:</span> <span class="token string">&quot;kagent.dev/v1alpha2&quot;</span><span class="token punctuation">,</span>
        <span class="token key atrule">Kind</span><span class="token punctuation">:</span>       <span class="token string">&quot;Agent&quot;</span><span class="token punctuation">,</span>
        <span class="token key atrule">Name</span><span class="token punctuation">:</span>       agent.Name<span class="token punctuation">,</span>
        <span class="token key atrule">UID</span><span class="token punctuation">:</span>        agent.UID<span class="token punctuation">,</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div></li> <li><p><strong>跨命名空间访问控制</strong>——类似 Gateway API 模式</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">spec</span><span class="token punctuation">:</span>
  <span class="token key atrule">allowedNamespaces</span><span class="token punctuation">:</span>
    <span class="token punctuation">-</span> <span class="token string">&quot;production&quot;</span>
    <span class="token punctuation">-</span> <span class="token string">&quot;staging&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div></li></ol> <p>另外两个 CRD 是 <strong>ModelConfig</strong> 和 <strong>RemoteMCPServer</strong>，和普通 Pod 的 Deployment 和 Service 类似，分别定义了 Agent 的部署方式和通信方式</p> <ul><li>前者支持 8 个 Provider：OpenAI、Anthropic、Azure OpenAI、Google Gemini、Gemini Vertex AI、Anthropic Vertex AI、AWS Bedrock、Ollama</li> <li>后者通过控制器自动连接 MCP 服务器发现工具，并填充到 <code>status.tools</code></li></ul> <p>其 Controller 基于 controller-runtime 实现</p> <blockquote><p>Peter 哥关于 EaaS（Environment-as-a-Service）的判断</p> <ul><li>大模型最终如果要自我进化，需要一个可以给出确定结果的环境，比如修复一个 bug，需要有一个环境可以自动真实反馈给 agent，是不是真的修复了（现在还靠程序员来给他反馈），然后 agent 就可以积累经验了。类似把代码发布到某个环境，然后环境可以真实运行系统并反馈给 agent 结果 ，这里最好不需要人参与</li> <li>这里的环境有点像更真实更自动的测试用例，我也没有想通可以怎么样构建出一个这样的环境，如果能通过真实的生产环境构造人工智能的可信世界，实现 AI 自进化的最后一块拼图，或许能达到 agent 的某种终极形态</li></ul></blockquote> <p>但我始终认为 LLM 的记忆（具体而言是上下文长度），仍是这种“终极形态”的不可逾越的阻碍，如果过了这一关，或许 LLM 只缺生存和繁衍的本能......</p> <h3 id="cube-sandbox"><a href="#cube-sandbox" class="header-anchor">#</a> Cube Sandbox</h3> <p>腾讯云开源的 Agent 沙箱解决方案，支持 E2B 协议</p> <ul><li><a href="https://github.com/TencentCloud/CubeSandbox" target="_blank" rel="nofollow noopener noreferrer">TencentCloud/CubeSandbox: Instant, Concurrent, Secure &amp; Lightweight Sandbox for AI Agents.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2560294" target="_blank" rel="nofollow noopener noreferrer">E2B (The Enterprise AI Agent Cloud) 全面解析与实战：专为 AI Agent 设计的安全代码执行平台<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://mp.weixin.qq.com/s/ea6tBzDlLnVTzhk-C0WqCw?version=5.0.9.99905&amp;platform=mac&amp;mpshare=1&amp;scene=1&amp;srcid=&amp;sharer_shareinfo=58ac5d89edd446e8500f3fc870959c75&amp;sharer_shareinfo_first=58ac5d89edd446e8500f3fc870959c75" target="_blank" rel="nofollow noopener noreferrer">从亚百毫秒级启动到生产级部署，腾讯云为何重构 Agent 沙箱<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Agetn 的调用似乎在往轻量化发展 <code>Environment → Sandbox → Function</code></p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/aee6d6/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Redis 基础</div></a> <a href="/pages/48385f/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Golang 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
        ←
        <a href="/pages/aee6d6/" class="prev">Redis 基础</a></span> <span class="next"><a href="/pages/48385f/">Golang 基础</a>→
