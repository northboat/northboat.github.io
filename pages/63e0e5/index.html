共享的一个密钥</p> <h3 id="公钥密钥管理"><a href="#公钥密钥管理" class="header-anchor">#</a> 公钥密钥管理</h3> <p>密钥管理方式</p> <ul><li>公开发布：可能存在假冒发布</li> <li>公用目录表：一个管理员管理用户和其公钥的对照表</li> <li>公钥管理机构：机构代办公用目录表</li> <li>公钥证书 CA</li></ul> <h4 id="第三方管理"><a href="#第三方管理" class="header-anchor">#</a> 第三方管理</h4> <p>公钥管理机构</p> <img src="/assets/img/image-20230822010845123.a6fbf066.png"> <img src="/assets/img/image-20230822010916112.f2f1ed20.png"> <p>公钥证书</p> <img src="/assets/img/image-20230822013035582.4618c457.png"> <img src="/assets/img/image-20230822013051731.ee17a393.png"> <h4 id="公钥加密分配单钥密码"><a href="#公钥加密分配单钥密码" class="header-anchor">#</a> 公钥加密分配单钥密码</h4> <p>用公钥加密分配单钥密码体制的密钥：即用公钥传输单钥，用单钥传输数据</p> <p>简单的使用公钥加密算法建立会话密钥（单钥）</p> <img src="/assets/img/image-20230822011028211.2c6e5b8c.png"> <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzoAAAAjCAYAAABcgH96AAAXTUlEQVR4nO3df2xV9f3H8ee55/5qb3t7+7ullNICbZGCQJFa2HSoMIHgmAYTl0yzJeiyZdlMzDIjMDcUE/lrCls2XAzaxEzHjwRQfg0GygYtlCo/REqRQinc/ri3P+69vb/OOd8/lnO8bUGn5ZtNfD+Sm5b743POPeWP88r783l/FMMwDIQQQgghhBDiNmL7b5+AEEIIIYQQQtxqEnSEEEIIIYQQtx0JOkIIIYQQQojbjgQdIYQQQgghxG3HfisHM/saGIaBoigA1s+Rr5uvpb5+s/FGUhQFTdOw2Wyf+/kvGtMwDGw226jXdV3/SmOnjq8oinUdvuz3/k/O3ZQ6fur7vuoxhBBCCCGEuB3c0qADw0POzXzVG3BzbDOI/CfHutEYuq4DjAo5uq5bY2qaBoDd/uUvkWEY1iM1cKSGEvNYqqp+6fG/6Nipx5GwI4QQQgghvolu6dQ18wZb13UrTIyUGgK+LMMw6OvrIxaL3XT8L/q8oijYbLYbBgyzimMGkJFB6D9hBqTUapF5riMrXrcihKSOpWkaiqIQj8eHnYsQQgghhBDfNLc06Jg38qFQiFgsNirMJJNJ+vv7SSaTX+lG//r166xZs4bf//73hEKhrxSWLl++zLFjxwiHw6PCUjweZ8uWLfzpT3+ir6/vS49vhptEIoHf7yccDgP/DlBdXV28++67NDY2kkgkgFtbbUkmk0QiEfbs2cPatWs5ePAgyWTylo0vhBBCCCHE14n6/PPPP/9VP5xMJvnoo484ffo0ubm5OJ1OQqEQW7duJRgMUl5ebk01A4hEIrz99tt8+OGH5Ofn4/V6b3izb77f/GlWWWKxGO+88w5//etfKS4upqamBk3TGBwcxOVyoWmaVdVIrWakBpZz587x+uuvo+s6U6ZMGVbZaWtr44UXXuDw4cPU1tZSUlIy7PXUaWfmOZmP9vZ2EokEiqLw4Ycf8uyzzwIwffp0DMPg2LFjrF69mt7eXubNm0d6ejqJRGLYWiBzOpuu6wSDQZqamsjNzcXlcnHt2jWOHj1KRkYGHo+H1tZWGhsbURSFlpYWGhsb2bFjB+vXr+cf//gHHR0dVFVVMX78+K/65xVCCCGEEOJra0xrdEKhEK+++ipNTU0888wzLF++HFVVGRwc5O2336 6X093dzdatW2ltbeW5556zQomu61y4cIFTp07x4IMPkp6ejq7r9Pf3k56eblVAOjs7OXToEJ2dndbYQ0NDhMNhsrOzycnJoaioiLvvvpucnBxrrcupU6fo6emhp6cHXddxOp309fXR29uLYRgUFBSQkZFBV1cXhmFQXFxMIBAgGAwSiUSIRqPk5OTwyCOPUFtba10383rpuk4ymcQwjFGNEMzGC4ZhEAqFeOONNygpKWHRokW43e4b7qOjaZo1FfDSpUvk5+czbtw4PB7PqL+HEEIIIYQQX1e3NOiYN+apN8sjb9xHnUDKe3VdZ3BwkP7+ftLS0vB6vda6FbNz2sguYqkdxpLJpLXWJvUzyWQSXddxOBzDzi+1y1jqeqCR55taYTGDhdmiOrWJQOo45sPci8ccb+SmqOZzqqqi6/rnXq+RXdHM72+2lzZDnxlwRo5nXuPU383xzN9l+poQQgghhLgd3PKgMzIojLwxH3UCI4JO6tqU1DHNf6feuI8MLeZ45u+apllB6UZB5vPO5Yu+d+qYNwoTZqBIDTmpxzC/q6qqowJX6jip1+BGISQ1uKSGHnPML7r+qc+NDJJCCCGEEEJ8Xd3SoGMNmhI2blQhGfneG70+MriMrJzc6P0jg1bq+82QM3K8kef7ed/nRuOnGhkabvT8yNdSn0utsKR+LvX4N3rdPK9EIjFq09AbHetGofDz3i+EEEIIIcTXzZiCjhBCCCGEEEL8L5IFGUIIIYQQQojbjgQdIYQQQgghxG1Hgo4QQgghhBDitiNBRwghhBBCCHHb+T8S2ZMWdoBDxQAAAABJRU5ErkJggg=="> <p>具有保密性和认证性的公钥密钥分配：有点像四次挥手</p> <img src="/assets/img/image-20230822011239793.70ed6275.png"> <h3 id="dh-密钥交换"><a href="#dh-密钥交换" class="header-anchor">#</a> DH 密钥交换</h3> <blockquote><p>小重点</p></blockquote> <p>DH 密钥交换：椭圆曲线密码体制，基于离散对数问题，只能用于密钥交换，不能用于加密（计算量太大）</p> <img src="/assets/img/image-20230822011332969.5e69fce5.png"> <p>这里涉及随机数的产生 —— 都是伪随机数</p> <h3 id="秘密分割"><a href="#秘密分割" class="header-anchor">#</a> 秘密分割</h3> <blockquote><p>秘密共享，重点，出计算</p></blockquote> <p>秘密分割门限方案，例如一个包含 k 个变量的方程组，存在 n 个线性无关的单个方程，每个人掌握一个，只有 k 个方程同时在场才能解出这个包含 k 个变量的方程组，而秘密 s 为解向量的其中一个常量值</p> <p>Shamir 门限方案：多项式方程组</p> <p>基于中国剩余定理的门限方案：一次同余方程组，孙子定理求解</p> <h2 id="mac-消息认证码"><a href="#mac-消息认证码" class="header-anchor">#</a> MAC 消息认证码</h2> <blockquote><p>Message Auth Code</p></blockquote> <p>根据明文产生一个属于当前明文的特定码，用于认证内容未被修改，根据明文产生认证码，其过程就相当于将明文视作密钥，对某一初始自定义内容进行加密，这里的加密常使用 CBC 模式的 DES 算法和某些公钥算法</p> <ul><li>这和分组加密的思路是一模一样的（区块链）</li></ul> <p>哈希函数实际上就是对加密算法的封装，可以同时包含多种算法（包含分组加密和公钥加密），使一个较长的输入（明文）输出一个定长的较短码</p> <h3 id="cbc-模式-des-的数据认证算法"><a href="#cbc-模式-des-的数据认证算法" class="header-anchor">#</a> CBC 模式 DES 的数据认证算法</h3> <blockquote><p>基于 CBC 模式 DES 算法</p></blockquote> <p>消息认证码的实现和作用可以参考用于差错检测的海明码和循环冗余码，都是通过在原数据后冗余一段码用于验证，这段码和数据在传输过程中保持一个整体，若在未知密钥的情况下篡改，将破坏整段数据的完整性，从而验证失败，接收方据此得知数据出了问题</p> <p>区别在于，循环冗余码采用二进制整除的形式验证其完整性，而消息认证码采用加密算法验证其完整性（当然，码的生成也基于加密算法，不然怎么验证）</p> <p>消息认证算法：基于 CBC 运行模式的 DES 算法</p> <ul><li>CBC，Cipher Block Chain，密码分组链</li> <li>DES，Data Encryption Standard，标准加密算法</li></ul> <p>一毛吊样</p> <img src="/assets/img/image-20230823014330133.64a366d4.png"> <p>这里的 O 在 DES 加密中就是一个个密文分组，经过密钥 K 加密，CBC 模式的每轮密钥不变，采用将上一轮密文和当前轮明文异或再 DES 加密的形式实现扩散性，这样同一明文分组将对应不同密文组</p> <p>CFB 模式 DES 的数据认证算法：用 CFB 模式的 DES 算法模拟以 0 为初始向量的 CBC 模式 DES 数据认证算法</p> <h3 id="消息认证的缺陷"><a href="#消息认证的缺陷" class="header-anchor">#</a> 消息认证的缺陷</h3> <p>对于消息认证机制，其加密方式是发方、收方共有的，不管是用的分组密码还是公钥密码对明文进行加密产生认证码，生成方式都是共有的，也就是说，<strong>任意一个收方 B，都可以伪装成 A 向外发送消息</strong>，其他的收方 C 也根据同一个加密方式处理收到的明文并认证，认为这条消息为 A 所发</p> <p>显然，此时 C 不知道收方 B 假冒了发方 A 发送了消息</p> <p>相互的，当 A 发出了负面消息，可以以加密方式泄露的借口将锅丢给某个收方 B 的身上或是某个不存在的收方 D 身上</p> <img src="/assets/img/image-20230829205423668.cc7d0145.png"> <p>究其原因，就是这里的<strong>认证机制仅仅只依赖于加密这一过程</strong>，将收到的明文<strong>单方向的加密</strong>，再和与明文一起收到的认证码进行比对，完成认证</p> <p>实际上，消息认证执行的是：发方加密，收方加密的认证方式</p> <p>这也是为什么哈希函数被设计为单向性的原因（只涉及到加密，而不涉及解密）</p> <h2 id="哈希函数和生日攻击"><a href="#哈希函数和生日攻击" class="header-anchor">#</a> 哈希函数和生日攻击</h2> <h3 id="哈希函数性质"><a href="#哈希函数性质" class="header-anchor">#</a> 哈希函数性质</h3> <p>哈希函数满足：单向性；无碰撞性</p> <img src="/assets/img/image-20230823020439142.98e062a7.png"> <p>其中性质 6 用于抵御生日攻击</p> <h3 id="生日攻击"><a href="#生日攻击" class="header-anchor">#</a> 生日攻击</h3> <p>第一类生日攻击：找到一个 y 令 h(y) 等于已知的一个哈希值 h(x)，其穷举的长度 k 至少为 n/2（n 为哈希函数所有可能的输入长度）</p> <p>第二类生日攻击：找到一对输入 x 和 y，满足其哈希值相等，即 h(x) = h(y)，其穷举的长度 k 至少为 √n（n 为哈希函数所有可能的输入长度）</p> <h3 id="常见哈希函数"><a href="#常见哈希函数" class="header-anchor">#</a> 常见哈希函数</h3> <p>MD5 杂凑算法：缓冲器中，数据小端存储，产生认证码 128 位（4 个 32 位寄存器构成缓冲）</p> <p>安全杂凑算法 SHA：缓冲器中，数据大端存储，产生认证码 160 位（5 个 32 位寄存器构成缓冲）</p> <p>HMAC：使用哈希函数产生 MAC（Message Authentication Code，消息认证码）</p> <h3 id="一致性哈希"><a href="#一致性哈希" class="header-anchor">#</a> 一致性哈希</h3> <blockquote><p>分布式哈希算法</p></blockquote> <p>对于普通哈希 43 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mn" transform="translate(13747.1,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>k</mi><mi>e</mi><mi>y</mi><mi>P</mi><mi>o</mi><mi>s</mi><mo>=</mo><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><mi>k</mi><mi>e</mi><mi>y</mi><mi>S</mi><mi>t</mi><mi>r</mi><mo stretchy="false">)</mo><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mi>m</mi><mi>o</mi><mi>d</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><msup><mi>w</mi><mn>3</mn></msup><mn>2</mn></math></mjx-assistive-mml></mjx-container></li> <li><p>数据顺时针找第一个节点就是它的归属节点</p></li></ol> <p>一个真实场景：客户端要存数据</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>key = user:1000
value = { name:&quot;张三&quot;, age:20 }
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>计算 key 在环上的位置</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">long</span> keyPos <span class="token operator">=</span> <span class="token function">hash</span><span class="token punctuation">(</span><span class="token string">&quot;user:1000&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>顺时针找第一个节点</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">String</span> targetNode <span class="token operator">=</span> <span class="token function">findFirstNodeClockwise</span><span class="token punctuation">(</span>keyPos<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 例如得到：192.168.1.101</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>把数据真正存在 targetNode 这个节点的本地：把<code>key=user:1000</code>存入<code>192.168.1.101</code>这台机器的<code>Redis/Map/DB</code></p> <p>典型应用场景</p> <ol><li>Redis 集群分片</li> <li>Dubbo 负载均衡</li> <li>Nginx 负载均衡（ip_hash 升级版）</li> <li>分布式缓存、分布式存储</li></ol> <p>数据倾斜问题：真实场景中，节点可能集中在环的一段，导致负载不均 → 虚拟节点</p> <h2 id="数字签名"><a href="#数字签名" class="header-anchor">#</a> 数字签名</h2> <h3 id="什么是数字签名"><a href="#什么是数字签名" class="header-anchor">#</a> 什么是数字签名</h3> <p>不同于消息认证，数字签名将整个明文加密，将这个加密的完整密文 E(M) 发送给收方，收方解密获取明文，你会发现这就是第二、三章的具体应用过程（包含加密和解密）</p> <p>过程对比</p> <ul><li>数字签名：加密明文、传输密文、解密密文、比对明文</li> <li>消息认证：加密明文、传输明文和密文、二次加密明文、比对密文</li></ul> <p>注意下图中的阴影框框并不是代表整个明文信息，而是表示签名，在真正传输的时候，和消息认证码类似，也是将 E(M) 链在 M 后进行发送</p> <img src="/assets/img/image-20230829205138085.1c11bcdc.png"> <p>显然，数字签名执行的是：发方加密，收方解密的认证方式</p> <p>只要解密成功，就能确认该消息由 A 所发（因为用的他的密钥），而收方 B 并不可以根据他所已知的信息假冒 A 对外发送消息，于是避免了收方假冒发方的情况</p> <p>同时可以以<strong>仲裁方式</strong>确认消息被 A 发送过，即 A 要发送给 B，私钥加密后，先发给第三方 D，D 对这条消息进行确认，加入某些信息，再传给 B，这样 A 就无法否认他发过这条消息，也无法以私钥泄露进行甩锅</p> <p>与之对应的直接方式存在 A 甩锅的风险</p> <h3 id="dss-签名方式"><a href="#dss-签名方式" class="header-anchor">#</a> DSS 签名方式</h3> <p>不同于 RSA 的签名，其包括密钥生成、签名、认证三个完整阶段</p> <img src="/assets/img/image-20230829210735230.e0c4f8a9.png"> <img src="/assets/img/image-20230829210804597.bb4c2edc.png"> <p>上述 DSS 过程中</p> <ul><li>H 为哈希函数，进行加密的对象其实是明文 M 的哈希值，这么做的原因很简单，为了缩小规模和规范化加密输入</li> <li>PK(G) 是发方和收方共有一个单钥，SK(A) 是发方的私钥，PK(A) 是发方的公钥，k 为加密的随机数，共同加密 H(M)，即 Sig 过程</li> <li>s 和 r 分别为单钥 PK(G) 的密文和公钥 SK(A)/PK(A) 的密文，共同参与解密</li> <li>最后，收方根据收到的明文产生哈希值 H(M)，和对签名（密文）的解密内容进行比对，确认签名的正确性</li></ul> <h3 id="数字签名算法-dsa"><a href="#数字签名算法-dsa" class="header-anchor">#</a> 数字签名算法 DSA</h3> <p>在 DSS 中，使用的公钥算法是 DSA 算法，基于 ElGamal 和 Schnorr 两个签名方案设计，其安全性基于求离散对数的困难性</p> <img src="/assets/img/image-20230829211922505.ef8ca5a8.png"> <img src="/assets/img/image-20230829211948118.1424d0a7.png"> <p>为了更好理解，贴一个程序框图</p> <img src="/assets/img/image-20230829212034948.4b1fc28d.png"> <h3 id="公钥签名算法"><a href="#公钥签名算法" class="header-anchor">#</a> 公钥签名算法</h3> <h4 id="rsa-签名体制"><a href="#rsa-签名体制" class="header-anchor">#</a> RSA 签名体制</h4> <img src="/assets/img/image-20230829204216994.828e1493.png"> <img src="/assets/img/image-20230829210447046.7f54c57d.png"> <img src="/assets/img/image-20230829210513661.0eab0e23.png"> <h4 id="elgamal-签名体制"><a href="#elgamal-签名体制" class="header-anchor">#</a> ElGamal 签名体制</h4> <p>小重点，基于离散对数</p> <img src="/assets/img/image-20230829212142577.44f3f1e2.png"> <img src="/assets/img/image-20230829212220945.cb313246.png"> <p>手算了一下，还真是</p> <h4 id="schnorr-签名体制"><a href="#schnorr-签名体制" class="header-anchor">#</a> Schnorr 签名体制</h4> <p>看一看就行，算法描述如下</p> <img src="/assets/img/image-20230829212409958.6ceb2fbe.png"></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/14, 21:33:42</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/de2e17/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">对称加密</div></a> <a href="/pages/7bc025/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">可搜索加密</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
