<code>ld-linux-aarch64.so.1</code></td> <td>ELF 的 <code>PT_INTERP</code> 指向不同，二进制不通用</td></tr> <tr><td>基础命令</td> <td>toybox（单二进制多命令）</td> <td>coreutils + util-linux</td> <td>只含常用子集，<code>--help</code> 极简</td></tr> <tr><td>shell</td> <td>mksh</td> <td>bash</td> <td>系统默认 <code>sh</code> 是 mksh</td></tr> <tr><td>init</td> <td><code>init</code> + <code>*.rc</code> 脚本 + 属性服务</td> <td>systemd / SysV init</td> <td>无依赖管理、无 cgroup 编排那套</td></tr> <tr><td>运行时</td> <td>ART（执行 dex）</td> <td>无（直接跑 ELF）</td> <td>应用层 Java/Kotlin → dex → ART</td></tr> <tr><td>IPC</td> <td>Binder</td> <td>unix socket、dbus</td> <td>跨进程调用主要走 Binder</td></tr> <tr><td>权限模型</td> <td>每 App 一个 uid + SELinux 域</td> <td>root/普通用户 + 文件权限</td> <td><code>untrusted_app</code> 域，默认无 root，setuid 无效</td></tr> <tr><td>目录布局</td> <td><code>/system</code> <code>/vendor</code> <code>/apex</code> <code>/data</code></td> <td><code>/bin</code> <code>/lib</code> <code>/etc</code> <code>/usr</code></td> <td>无 <code>/usr</code>、无 <code>/etc/passwd</code> 传统体系</td></tr> <tr><td>软件分发</td> <td>APK（<code>pm</code> / <code>installd</code>）</td> <td>apt / dnf / pacman</td> <td>装的是应用，不是系统软件包</td></tr></tbody></table> <p>所以 Termux 的工作实际上是，在自己的私有目录里另建一套工具链（把 GNU 工具按 aarch64-linux-android ABI 重编译），再让它们优先</p> <ol><li>拿到一块可写可执行的目录：/data/data/com.termux/files/usr</li> <li>把“发行版的 /usr”铺进去：usr/bin、usr/lib、usr/include、usr/etc，结构照抄 Linux</li> <li>用 Android 的 ABI 编译工具：aarch64-linux-android 交叉编译，链接系统自带的 bionic 和 linker64，rpath 指向 <code>$PREFIX/lib</code>。glibc 那套依赖全部改写成 bionic 能提供的等价实现，缺的部分由 termux-packages 的补丁解决（例如没有 /etc/passwd、没有 NSS）</li> <li>让 shell 优先用这套：启动时设 <code>PATH=$PREFIX/bin:$PATH</code>、<code>HOME=$PREFIX/home</code>、<code>LD_LIBRARY_PATH=$PREFIX/lib</code></li></ol> <p>具体到输入的 <code>ls</code></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>输入 ls
 → shell 按 PATH 顺序找，命中 /data/data/com.termux/files/usr/bin/ls
 → 该 ELF 的 PT_INTERP 是 /system/bin/linker64（系统自带，没换）
 → 依赖的库在 $PREFIX/lib 里（libc 仍是系统的 bionic）
 → 系统 toybox 的 ls 还在 /system/bin/ls，全程没被动过
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>常用的 termux 命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>termux-setup-storage                     <span class="token comment"># 获取存储权限</span>
termux-change-repo                       <span class="token comment"># 更换 pkg 下载源</span>
pkg <span class="token function">install</span> <span class="token function">vim</span> openjdk-17 clang         <span class="token comment"># 编辑器、Java、C 环境</span>

<span class="token comment"># 软连接与 C 文件编译：termux 不允许在 shared 目录执行 C 二进制文件，编译前先把源文件拷到 ~/c</span>
<span class="token function">ln</span> <span class="token parameter variable">-s</span> ~/storage/shared/northboat ~/northboat
<span class="token builtin class-name">read</span> <span class="token parameter variable">-p</span> <span class="token string">&quot;Enter the file name: &quot;</span> <span class="token function">file</span> <span class="token operator">&amp;&amp;</span> <span class="token function">cp</span> ~/storage/shared/northboat/c/<span class="token variable">$file</span> ~/c/<span class="token variable">$file</span>

<span class="token comment"># Git：openssl、openssh 用于生成密匙和连接</span>
pkg <span class="token function">install</span> <span class="token function">git</span> openssl openssh
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;Northboat&quot;</span> <span class="token operator">&amp;&amp;</span> <span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span>
ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> <span class="token parameter variable">--add</span> safe.directory /storage/emulated/0/northboat/repo/Docs   <span class="token comment"># 设置安全目录</span>

<span class="token comment"># MySQL（mariadb）：初始密码为空直接回车，登录后 set password for 'root'@'localhost' = password('新密码');</span>
pkg <span class="token function">install</span> mariadb <span class="token operator">&amp;&amp;</span> <span class="token function">nohup</span> mysqld <span class="token operator">&amp;</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
<span class="token comment"># 启动脚本 start_mysql.sh：nohup mysqld &gt; mysql.log &amp;；报 Unknown storage engine: InnoDB 时删掉</span>
<span class="token comment"># usr/var/lib/mysql 下的 aria_log*、ib_logfile*、ibdata1 再重启</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>一条命令从下往上会经过四层</p> <ol><li><strong>芯片 / ISA</strong>：芯片只会执行指令，“能执行哪些指令”由 ISA（Instruction Set Architecture，指令集架构）规定。ARM64（AArch64）与 x86_64 是两套 ISA，指令编码不通用；同一套 ISA 下不同厂商的芯片（ARM 授权的高通、联发科，Intel、AMD 的 x86-64）二进制通用</li> <li><strong>内核 / syscall</strong>：内核管内存、进程、文件、驱动，对外只开系统调用一个口。程序读目录必须按编号去调，<code>openat</code> 在 ARM64 上固定是 56。Android 与发行版共用同一个 Linux 内核，二者的 syscall 完全一致，差别只是 Android 用 seccomp + SELinux 收窄了可用的子集</li> <li><strong>用户空间</strong>：内核之外的一切 —— C 库、命令、编译器、init。程序不直接发 syscall，都经 libc 转一手；Android 用 bionic + toybox，Ubuntu 用 glibc + coreutils</li> <li><strong>ABI</strong>：严格说它不是一层，而是前三层之间的交接格式 —— ELF（linux 可执行文件）头里的解释器路径（<code>PT_INTERP</code>）、依赖的符号名、参数放 <code>x0~x7</code> 还是 <code>rdi/rsi</code>、结构体怎么对齐。<code>ABI</code>（Application Binary Interface）对不上，加载器会直接拒绝</li></ol> <p>编译器和链接器都是用户空间的工具，按照 ABI 的约定产出二进制。回到 termux 的工作，实际上就是把 GNU 工具重新编译为符合 Android ABI（aarch64-linux-android）的应用，使之可以在 arm64 android 上运行</p> <p>相对应的，arm64 android 有这几种“跑不了”</p> <table><thead><tr><th>现象</th> <th>问题在哪</th> <th>为什么</th> <th>怎么办</th></tr></thead> <tbody><tr><td>Ubuntu ARM64 程序跑不了</td> <td>ABI</td> <td><code>PT_INTERP</code> 写死 <code>ld-linux-aarch64.so.1</code>，Android 只有 <code>linker64</code>；硬改路径也不行，还要 glibc 的符号，bionic 里没有</td> <td>rootfs 提供 glibc 与 <code>ld.so</code>，proot 改写路径让它找得到</td></tr> <tr><td>x86 程序跑不了</td> <td>ISA</td> <td><code>e_machine</code> 对不上，内核直接 <code>ENOEXEC</code>；两套指令编码没有重叠</td> <td>box64 逐条翻译指令</td></tr> <tr><td>exe 跑不了</td> <td>内核</td> <td>内核不认 PE 格式；Windows 的 syscall（<code>ntdll</code> 调 <code>sysenter</code> 那套）在这里没有实现</td> <td>Wine 加载 PE 并翻译 syscall 语义 / FEX 翻译 syscall</td></tr></tbody></table> <h3 id="proot-伪装根目录"><a href="#proot-伪装根目录" class="header-anchor">#</a> proot 伪装根目录</h3> <p>在 Termux 上安装 Manjaro</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># Manjaro（Andronix + proot）与 python 环境</span>
pkg update <span class="token operator">&amp;&amp;</span> pkg <span class="token function">install</span> <span class="token function">wget</span> <span class="token function">curl</span> proot <span class="token function">tar</span>
<span class="token function">wget</span> https://raw.githubusercontent.com/AndronixApp/AndronixOrigin/master/Installer/Manjaro/manjaro.sh <span class="token parameter variable">-O</span> manjaro.sh <span class="token operator">&amp;&amp;</span> <span class="token function">bash</span> manjaro.sh
<span class="token comment"># 赋予存储权限并修改 start-manjaro.sh 挂载 sdcard 后启动</span>
./start-manjaro.sh <span class="token operator">&amp;&amp;</span> pacman <span class="token parameter variable">-Syy</span> <span class="token operator">&amp;&amp;</span> pacman <span class="token parameter variable">-S</span> python-pip
pip <span class="token function">install</span> numpy pandas scipy matplotlib
pip <span class="token function">install</span> torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>因为 Android 机器上没有 root 权限，所以这份 Linux 使用了 proot 去 change root，它不动内核、不做虚拟化，只用 ptrace 拦住系统调用（prehook），把路径参数和身份参数改掉，伪装成一个独立的 Linux</p> <img src="/assets/img/proot-principle.89470cff.svg"> <p>对照几个容易混淆的说法</p> <ul><li><strong>不是模拟器</strong>：不解释指令、不虚拟硬件，CPU 和内核都是手机自己的，跑的是 ARM 原生二进制</li> <li><strong>不是容器</strong>：没有 namespace、cgroup 隔离，在系统眼里它就是一个普通的 Termux 进程，<code>ps</code> 里能看到</li> <li><strong>不是真 root</strong>：<code>proot -0</code> 只是把 <code>getuid()/geteuid()</code> 的返回值改成 0，内核仍按 Termux 用户（uid=10xxx）校验权限</li> <li><strong>实现的两件事</strong>：伪造路径视图（相当于 chroot + bind mount）、伪造身份（相当于 fakeroot）；Android 无 root 时 <code>chroot</code> 系统调用直接 EPERM，这才轮到 proot</li></ul> <p>真正的 <code>chroot()</code> 发生在内核态，需要 root 权限，是在修改根目录指针 <code>fs_struct-&gt;root</code></p> <ul><li>chroot 不是安全边界。它只改路径起点，进程仍共享内核、网络、PID、/proc。经典逃逸手法就是 chroot 后 chdir 出去再 <code>chroot(&quot;.&quot;)</code>；而且它不改变“进程已经有权限”的事实，所以 chroot 里弄到 root 往往更容易打主机。容器（namespace + cgroup + capability 裁剪）才有隔离语义，chroot 没有</li> <li>只 chroot() 而不 <code>chdir(&quot;/&quot;)</code> 也没用。当前工作目录还在旧根之外，ls 一敲就回去了，所以标准写法是 <code>chroot(newroot); chdir(&quot;/&quot;)</code></li></ul> <h2 id="droid-deck"><a href="#droid-deck" class="header-anchor">#</a> Droid Deck</h2> <h3 id="isa-和-abi"><a href="#isa-和-abi" class="header-anchor">#</a> ISA 和 ABI</h3> <p>在 arm64 Android 上原生运行 steam 及 steam 游戏</p> <img src="/assets/img/droiddeck-glossary.9411e82d.svg"> <p>本质上做了两件事</p> <ol><li>通过 proot 伪装 linux 环境装了一个 aarch64 版本的 steam，用现有的生态（steam deck + game sopce）管理和交互</li> <li>通过 FEX 翻译 x86_64 exe 游戏系统调用，让它跑在 arm64 芯片上</li></ol> <img src="/assets/img/droiddeck-architecture.0d5ab01c.svg"> <h3 id="mesa-驱动"><a href="#mesa-驱动" class="header-anchor">#</a> Mesa 驱动</h3> <p>在 OPPO PLE110（SM8735 / Adreno 825）上启动 Steam，会话 2 秒退出</p> <p>拷出 <code>session.log</code> ，找到具体的报错信息</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>TU: error: ../mesa-26.2.2/src/freedreno/vulkan/tu_device.cc:1683:
    device (chip_id = 44030000, gpu_id = 6830) is unsupported (VK_ERROR_INCOMPATIBLE_DRIVER)
[gamescope] [Error] vulkan: failed to find physical device
SDL_Vulkan_CreateSurface failed: ... Failed to create backend.
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><ol><li>tu_device.cc 是 Mesa 里 Turnip（freedreno 的 Vulkan 驱动） 的源码文件，因此报错的是驱动，并非系统或硬件</li> <li><code>is unsupported + VK_ERROR_INCOMPATIBLE_DRIVER</code> 表示驱动查自己的设备表，发现没有这个 chip_id，于是主动拒绝注册。这三层意思分别对应：驱动已加载、驱动能运行、驱动认不出这块 GPU</li></ol> <p>跟因：Turnip 是 Mesa 的用户态 Vulkan 驱动，靠一张静态设备表把内核上报的 chip_id 映射成 GPU 属性集，当前版本的驱动静态设备表里没有这个 id，驱动会直接拒绝 <code>VK_ERROR_INCOMPATIBLE_DRIVER</code>，因为
拿不一致的参数跑（CCU 分片、tile 对齐、magic 寄存器），错一个就会算错地址，导致花屏、卡死或静默写坏显存</p> <p>于是完整的报错链为</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>Turnip 不认 chip_id
 → Vulkan 枚举不到 physical device
 → gamescope 建不出 SDL backend（Vulkan 是硬依赖）
 → exit 1 → 会话结束
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>同一份报告里的 <code>device.txt</code> 暴露了现有的显卡和驱动，驱动分两份，一份是显示驱动，一份是 Linux 驱动</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>KGSL gpu_model          Adreno825
GPU                     Adreno 825 · Adreno 8xx · Supported
Driver mode             auto (recommended pair: wn-b)
Display driver (chosen) Auto -&gt; turnip-sdk36
  imported available    none
Linux driver            runtime default (the Turnip built into the runtime)
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>拿报错里的 <code>chip_id</code>（44030000）和 <code>gpu_id</code>（6830）去仓库搜 issues</p> <ul><li><a href="https://github.com/Droid-Deck/DroidDeck/issues/66" target="_blank" rel="nofollow noopener noreferrer">#66（closed）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：同 chip_id、同 SM8735，维护者给了确定的修法，即换驱动</li> <li><a href="https://github.com/Droid-Deck/DroidDeck/issues/334" target="_blank" rel="nofollow noopener noreferrer">#334（open）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：同 chip_id，同类问题仍在跟</li></ul> <p>新 SoC 上市到 Mesa 收录之间必然有一段时间不可用（驱动静态表查不到），解法只有“换一份设备表里有这块 SoC 的驱动”，于是问题变成找包含 <code>chip_id = 0x44030000</code> 的 Vulkan 驱动</p> <ol><li><strong>先看版本</strong>：上游 Mesa 主线从哪个版本起加入该 chip_id</li> <li><strong>再查补丁</strong>：驱动仓库的 patch 脚本里 grep chip_id，能查到这一行才算真支持</li></ol> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token comment"># Droid-Deck/Drivers patches/scripts/apply_a8xx_gpus.py</span>
add_gpus<span class="token punctuation">(</span><span class="token punctuation">[</span>GPUId<span class="token punctuation">(</span>chip_id<span class="token operator">=</span><span class="token number">0x44030000</span><span class="token punctuation">,</span> name<span class="token operator">=</span><span class="token string">&quot;Adreno (TM) 825&quot;</span><span class="token punctuation">)</span><span class="token punctuation">]</span><span class="token punctuation">,</span> A6xxGPUInfo<span class="token punctuation">(</span>CHIP<span class="token punctuation">.</span>A8XX<span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ol start="3"><li><strong>确认作用于会话那一半</strong>：一个驱动包通常分“显示驱动（Android）”和“Linux 半（runtime 运行时驱动）”，Steam 会话用的是 Linux 半。release 说明里要能确认补丁对两半都生效（WinNative 的 Linux 0.1.2 就是 issue 里说的那个版本）</li> <li>找到目标驱动：<strong>DD-Turnip</strong> 与 <strong>WinNative · Balanced</strong>，两边的 <code>apply_a8xx_gpus</code> 都显式插入了同一个 chip_id</li></ol> <p>更换驱动</p> <ol><li><strong>Setup → Components → GPU drivers</strong>（第一个 tab），模式从 Auto 改 <strong>Matched pair</strong></li> <li>选一对（DD-Turnip / WinNative · Balanced），浏览器下 release zip，同页 <strong>Advanced → Import</strong> 导入驱动对（显示驱动 + Linux 驱动）</li> <li>重启 App（显示驱动重启生效），再按 Play</li></ol> <p>Linux 的 Driver 问题很常见，例如每次都会掉的网卡驱动和永远不适配的显卡驱动</p></div></div> <!----> <div class="page-edit"><!----> <!----> <!----></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/ef6e91/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">网关与代理</div></a> <a href="/pages/1f9098/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">ESP32-S3</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
