1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">文本样式<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="markdown"><a href="#markdown" class="header-anchor">#</a> Markdown</h2> <p>Markdown 是一种轻量级标记语言，排版语法简洁，让人们更多地关注内容本身而非排版</p> <p>它使用易读易写的纯文本格式编写文档，可与 HTML 混编，可导出 HTML、PDF 以及本身的 .md 格式的文件，因简洁、高效、易读、易写被大量使用，如 Github、Wikipedia、简书等</p> <h3 id="标题"><a href="#标题" class="header-anchor">#</a> 标题</h3> <div class="language- line-numbers-mode"><pre class="language-text"><code># 一级标题
## 二级标题
### 三级标题
#### 四级标题
##### 五级标题
###### 六级标题
####### 七级标题
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h3 id="代码块"><a href="#代码块" class="header-anchor">#</a> 代码块</h3> <p>使用三个波浪号开辟代码块，在波浪号后接语言名可以定义代码块语言种类</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>~~~java
content
~~~
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="加粗"><a href="#加粗" class="header-anchor">#</a> 加粗</h3> <div class="language- line-numbers-mode"><pre class="language-text"><code>**content**
ctrl+b
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="斜体"><a href="#斜体" class="header-anchor">#</a> 斜体</h3> <div class="language- line-numbers-mode"><pre class="language-text"><code>*content*
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="斜粗体"><a href="#斜粗体" class="header-anchor">#</a> 斜粗体</h3> <div class="language- line-numbers-mode"><pre class="language-text"><code>***content***
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="引用"><a href="#引用" class="header-anchor">#</a> 引用</h3> <p><code>&gt;</code>接一个空格</p> <blockquote><p>这是一个引用</p></blockquote> <div class="language- line-numbers-mode"><pre class="language-text"><code>&gt; 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="列表"><a href="#列表" class="header-anchor">#</a> 列表</h3> <p>要创建有序列表，请在每个列表项前添加数字并紧跟一个英文句点。数字不必按数学顺序排列，但是列表应当以数字 1 起始</p> <ol><li>有序列表，<code>数字</code>加<code>.</code>接一个空格</li></ol> <ul><li>无需列表，减号<code>-</code>接一个空格</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>1. 
- 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="分割线"><a href="#分割线" class="header-anchor">#</a> 分割线</h3> <p>使用三个或多个星号 (<code>***</code>)、破折号 (<code>---</code>) 或下划线 (<code>___</code>) ，并且不能包含其他内容。三种方法效果一样</p> <hr> <div class="language- line-numbers-mode"><pre class="language-text"><code>***
---
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="链接"><a href="#链接" class="header-anchor">#</a> 链接</h3> <p>链接文本放在中括号内，链接地址放在后面的括号中，链接title可选</p> <p><a href="%E9%AA%97%E4%BD%A0%E7%9A%84">这是一个链接</a></p> <p>链接title是当鼠标悬停在链接上时会出现的文字，这个title是可选的，它放在圆括号中链接地址后面，跟链接地址之间以空格分隔</p> <p><a href="%E9%AA%97%E4%BD%A0%E7%9A%84" title="hahaha">带标题的链接</a></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>[链接名](链接url &quot;链接标题&quot;)
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="图片"><a href="#图片" class="header-anchor">#</a> 图片</h3> <p>要添加图像，请使用感叹号 (<code>!</code>), 然后在方括号增加替代文本，图片链接放在圆括号里，括号里的链接后可以增加一个可选的图片标题文本。</p> <p>插入图片Markdown语法代码：<code>![图片alt](图片链接 &quot;图片title&quot;)</code></p> <p>对应的HTML代码：<code>&lt;img src=&quot;图片链接&quot; alt=&quot;图片alt&quot; title=&quot;图片title&quot;&gt;</code></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>![这是图片](图片路径)
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>给图片增加链接，请将图像的Markdown 括在方括号中，然后将链接添加在圆括号中</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>[![沙漠中的岩石图片](/assets/img/shiprock.jpg &quot;Shiprock&quot;)](https://markdown.com.cn)
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="html"><a href="#html" class="header-anchor">#</a> HTML</h3> <p>HTML 的行级內联标签如 <code>&lt;span&gt;</code>、<code>&lt;cite&gt;</code>、<code>&lt;del&gt;</code> 不受限制，可以在 Markdown 的段落、列表或是标题里任意使用。依照个人习惯，甚至可以不用 Markdown 格式，而采用 HTML 标签来格式化。例如：如果比较喜欢 HTML 的 <code>&lt;a&gt;</code> 或 <code>&lt;img&gt;</code> 标签，可以直接使用这些标签，而不用 Markdown 提供的链接或是图片语法。当你需要更改元素的属性时（例如为文本指定颜色或更改图像的宽度），使用 HTML 标签更方便些。</p> <h3 id="表格"><a href="#表格" class="header-anchor">#</a> 表格</h3> <p>在<code>typora</code>中使用<code>ctrl+t</code>插入表格</p> <h3 id="公式"><a href="#公式" class="header-anchor">#</a> 公式</h3> <p>平时不经常用到数学公式，直到我在写最优化笔记的时候要表达泰勒公式 ，却发现不会用Markdown表示。通常使用<code>$$</code>作为公式块，在里边书写公式</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="41.216ex" height="5.699ex" role="img" focusable="false" viewBox="0 -1559 18217.4 2519" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.172ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msubsup"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z" style="stroke-width:3;"></path></g><g data-mml-node="TeXAtom" transform="translate(845.3,413) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c= </code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>声明：有助于浏览器正确显示网页，即声明 HTML 的版本，如</p> <p>HTML5</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token doctype"><span class="token punctuation">&lt;!</span><span class="token doctype-tag">DOCTYPE</span> <span class="token name">html</span><span class="token punctuation">&gt;</span></span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div></li> <li><p>外部样式标：link</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token doctype"><span class="token punctuation">&lt;!</span><span class="token doctype-tag">DOCTYPE</span> <span class="token name">html</span><span class="token punctuation">&gt;</span></span>

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>meta</span> <span class="token attr-name">name</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>viewport<span class="token punctuation">&quot;</span></span> <span class="token attr-name">content</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>width=device-width, initial-scale=1.0<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>title</span><span class="token punctuation">&gt;</span></span>导入方式<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>title</span><span class="token punctuation">&gt;</span></span>
    
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>link</span> <span class="token attr-name">rel</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>stylesheet<span class="token punctuation">&quot;</span></span> <span class="token attr-name">href</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>css/style1.css<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span>

<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>body</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>html</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div></li></ul> <p>导入和渲染遵循就近原则，谁靠的近用谁，但有个问题是外部导入会导致先展现 HTML 骨架再进行渲染 → 渲染过程难看</p> <h3 id="css-选择器"><a href="#css-选择器" class="header-anchor">#</a> CSS 选择器</h3> <blockquote><p>作用：选择页面上的某一个或某一类元素</p></blockquote> <p>基本选择器：优先级 id 选择器 &gt; 类选择器 &gt; 标签选择器，不遵循就近原则</p> <ul><li>标签选择器：对所有同类标签同时作用</li> <li>类选择器：设置 class 属性，在 style 中用 <code>.class</code> 的形式定向选择该类标签，可以为标签归类，跨标签自定义分类，可复用</li> <li>id 选择器：定义标签属性 id，在 style 中用 <code>#id</code> 定位指定标签，全局唯一</li></ul> <p>层次选择器：这里的 body 可以是任何可以定位到的元素，通用兄弟选择器与相邻兄弟选择器优先级遵循就近原则</p> <ul><li>后代选择器：<code>body p {}</code> 作用于 body 标签后的所有 p 标签</li> <li>子选择器：<code>body &gt; p {}</code> 作用于 body 后的第一代 p 标签，第一代指同一层（树形结构）的标签</li> <li>相邻兄弟选择器：<code>body + a {}</code> 作用于同层的相邻下一个指定标签 a</li> <li>通用兄弟选择器：<code>body ~ a {}</code>，作用于当前选中元素同级的向下的所有 a 标签</li></ul> <p>结构伪类选择器：伪类，是指通过条件判断形成的类，特征为冒号</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>style</span><span class="token punctuation">&gt;</span></span><span class="token style"><span class="token language-css">
        <span class="token comment">/* 选择ul子类的第一个元素 */</span>
        <span class="token selector">ul li:first-child</span><span class="token punctuation">{</span>
            <span class="token property">background-color</span><span class="token punctuation">:</span> blue<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">/* 选择ul子类的最后一个元素 */</span>
        <span class="token selector">ul li:last-child</span><span class="token punctuation">{</span>
            <span class="token property">background-color</span><span class="token punctuation">:</span> red<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">/* p标签的父标签的第n个子类，若第n个为p标签，则生效 */</span>
        <span class="token selector">p:nth-child(2)</span><span class="token punctuation">{</span>
            <span class="token property">background-color</span><span class="token punctuation">:</span> rosybrown<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">/* 选中p的父元素，并在父元素的子类中找到第二个类型为p的元素作用于该p标签上 */</span>
        <span class="token selector">p:nth-of-type(2)</span><span class="token punctuation">{</span>
            <span class="token property">background</span><span class="token punctuation">:</span>yellow<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">/* 选中所有a标签，设置其被选中时的状态 */</span>
        <span class="token selector">a:hover</span><span class="token punctuation">{</span>
            <span class="token property">background-color</span><span class="token punctuation">:</span> hotpink<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>style</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>属性选择器：选择具有特定属性的标签，<code>标签 [ 属性值满足的条件 ] { 操作 }</code></p> <ul><li><code>=</code> 绝对等于</li> <li><code>*=</code> 包含</li> <li><code>^=</code> 以开头</li> <li><code>$=</code> 以结尾</li></ul> <h3 id="网页元素美化"><a href="#网页元素美化" class="header-anchor">#</a> 网页元素美化</h3> <blockquote><p>为什么要美化？有效传递信息；凸显页面主题；提升用户体验</p></blockquote> <p>常用美化样式</p> <ul><li>span 标签：重点要突出的字段用 span 标签套起来（约定俗成），便于操作</li> <li>字体样式：font，可在一行内设置font属性，各属性间用空格隔开</li> <li>文本样式
<ul><li>颜色：单词；RGB；RGBA（透明度）</li> <li>文本对齐：ext-align（排版，居中）；text-indent（段落首行缩进）；height（段落高度）；line-height（文本高度）</li></ul></li> <li>划线：text-decoration
<ul><li>上划线：overline</li> <li>中划线：line-though</li> <li>下划线：underline</li> <li>无装饰：none</li></ul></li> <li>水平对齐 <code>vertical-align: middle</code></li></ul> <p>超链接美化</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>a</span> <span class="token attr-name">href</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>#<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span>名字：沙梨胖<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>a</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>style</span><span class="token punctuation">&gt;</span></span><span class="token style"><span class="token language-css">
    <span class="token selector">a</span><span class="token punctuation">{</span>
        <span class="token property">text-decoration</span><span class="token punctuation">:</span> none<span class="token punctuation">;</span>
        <span class="token property">color</span><span class="token punctuation">:</span> black<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/* hover：鼠标悬浮时的状态 */</span>
    <span class="token selector">a:hover</span><span class="token punctuation">{</span>
        <span class="token property">color</span><span class="token punctuation">:</span> blue<span class="token punctuation">;</span>
        <span class="token property">font-size</span><span class="token punctuation">:</span> 24px<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">/* 已访问的颜色 */</span>
    <span class="token selector">a:visited</span><span class="token punctuation">{</span>
        <span class="token property">color</span><span class="token punctuation">:</span> gray<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">/* 鼠标已点击但未松开时的状态 */</span>
    <span class="token selector">a:active</span><span class="token punctuation">{</span>

    <span class="token punctuation">}</span>

    <span class="token comment">/* 阴影：颜色 水平偏移距离 垂直偏移距离 阴影半径 */</span>

    <span class="token punctuation">}</span>
</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>style</span><span class="token punctuation">&gt;</span></span>

    <span class="token property">text-decoration</span><span class="token punctuation">:</span> underline<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br></div></div><p>渐变色（<a href="https://www.grabient.com/" target="_blank" rel="nofollow noopener noreferrer">Grabient<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>），在网页上选择并 copy 贴在自己的 css 中</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token property">background-color</span><span class="token punctuation">:</span> #4158D0<span class="token punctuation">;</span>
<span class="token property">background-image</span><span class="token punctuation">:</span> <span class="token function">linear-gradient</span><span class="token punctuation">(</span>43deg<span class="token punctuation">,</span> #4158D0 0%<span class="token punctuation">,</span> #C850C0 46%<span class="token punctuation">,</span> #FFCC70 100%<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h3 id="盒子标签"><a href="#盒子标签" class="header-anchor">#</a> 盒子标签</h3> <p>div 标签与常用样式</p> <ul><li>div：盒子标签</li> <li>margin：外边距</li> <li>border：边框</li> <li>padding：内边距</li></ul> <p>边框：大部分标签都有默认边距，需手动设置为 0 去边距</p> <ul><li>粗细</li> <li>样式</li> <li>颜色</li></ul> <p>内外边距：调整 margin 外边距可使内容居中</p> <ul><li><code>margin: x</code>：四边均为 x</li> <li><code>margin: x y</code>：上下为 x，左右为 y</li> <li><code>margin: x y z k</code>：上右下左，顺时针顺序</li></ul> <p>使用 <code>text-align</code> 可使内容居中</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token property">text-align</span><span class="token punctuation">:</span> center<span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>内边距：参数顺序与 margin 一样</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token property">padding</span><span class="token punctuation">:</span> 7px<span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>一个元素的大小 = 内容大小 + 内边距 + 边框大小 + 外边距</p> <p>盒子阴影</p> <ul><li>颜色</li> <li>宽度</li> <li>高度</li> <li>透明度</li></ul> <p>例如</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token property">box-shadow</span><span class="token punctuation">:</span> rebeccapurple 40px 40px 50px<span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="元素浮动"><a href="#元素浮动" class="header-anchor">#</a> 元素浮动</h3> <p>行内元素可以包含在块级元素中，反之不行</p> <table><thead><tr><th>元素</th> <th>常见标签</th></tr></thead> <tbody><tr><td>块级元素</td> <td><code>h1~h6</code><br><code>p</code><br><code>div</code><br><br><code>ul-li</code></td></tr> <tr><td>行内元素</td> <td><code>span</code><br><code>a</code><br><code>img</code><br><code>strong</code></td></tr> <tr><td></td> <td></td></tr></tbody></table> <p>display 是实现行内排布的一种方式，改变元素的块状属性 display</p> <ul><li>inline</li> <li>block</li> <li>inline-block</li></ul> <p>更多情况下我们用 float 实现，因为浮动更方便控制元素位置，但也会造成一些超出边框、塌陷、分层的问题，例如让 img 标签左右浮动</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token selector">.img1</span><span class="token punctuation">{</span>
    <span class="token property">float</span><span class="token punctuation">:</span> right<span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token selector">.img2</span><span class="token punctuation">{</span>
    <span class="token property">float</span><span class="token punctuation">:</span> left<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>父级边框塌陷问题</p> <ul><li>对于块级元素，使用 clear 消除塌陷</li> <li>对浮动元素 <code>clear: both</code>，然后增加父级元素高度，增加一个空的 div 清除浮动</li></ul> <p>对于超限：在父级元素中设置 <code>overflow</code></p> <h3 id="元素定位"><a href="#元素定位" class="header-anchor">#</a> 元素定位</h3> <p>默认定位：使用标签 ID，标签 Class 或标签元素本身进行定位</p> <p>相对定位：相对于原来的位置进行指定的偏移（相对定位后仍然在标准文档流中，不会造成父级边框塌陷），例如 <code>position: relative;</code></p> <ol><li>若具有同样的 css，可以用逗号隔开一次定义多个元素</li> <li>上下居中：line-height 与 height 定义相同高度</li> <li>左右居中：<code>text-align: center;</code></li> <li>对于盒子中内容左右居中：<code>margin: 0 auto;</code></li></ol> <p>绝对定位：基于某某定位，上下左右，当父级元素没有设置定位（相对定位或绝对定位）时，基于浏览器定位，当父级元素设置了，则基于父级元素定位，只需有position属性，即使什么也不做，也依据父级元素定位，被定位元素在父级元素范围内移动，不会超出，不会造成父级边框塌陷</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token selector">#second</span><span class="token punctuation">{</span>
        <span class="token property">background-color</span><span class="token punctuation">:</span> orange<span class="token punctuation">;</span>
        <span class="token property">border</span><span class="token punctuation">:</span> 5px deshed <span class="token function">rgb</span><span class="token punctuation">(</span>46<span class="token punctuation">,</span> 7<span class="token punctuation">,</span> 7<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token property">position</span><span class="token punctuation">:</span> absolute<span class="token punctuation">;</span>
        <span class="token property">right</span><span class="token punctuation">:</span> 30px<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>固定定位 fixed</p> <p>z-index</p> <ul><li>层级概念：图层</li> <li>透明度：opacity</li> <li>浮动元素分层：z-index</li></ul> <p>百度 canvas 动画</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/15, 20:57:31</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/e85ae0/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">JVM 基础（二）</div></a> <a href="/pages/56ec14/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">博客和胶片</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
