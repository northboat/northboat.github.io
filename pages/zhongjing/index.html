2084 进厂指南</a></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>笔记</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>杂项</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper "><div class="placeholder"></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABH1JREFUSA3tVl1oHFUUPmdmd2ltklqbpJDiNnXFmgbFktho7YMPNiJSSZM0+CAYSkUELVhM6YuwIPpgoOKDqOBDC0XE2CQoNtQXBUFTTcCi+Wlh1V2TQExsUzcltd3M9Tt3ZjZzZ2fT+OJTL8yeM+eee757fmeJbq//KQL8X3DUSFOcfr7cRsRtxNQMWueeVzOkaITIGqQHNg5y8+jNW9ldM7A6nTpAjuolUikAwq7CE3WcM2RRDz+XGVgN3FptU/aUSlvq9Pa3iZ1+sgAqJyyAFqkipd9dqiwHF3P65YycLWc/6sqGrvoEoIp6DOFaX5h6+dnfjkWprwqsPk0dUGq5vySwDImC10KxFHgGL1SWoc92O3eVht09qdXNH11I2SsTsJYqMWzihqGMi+A+Garf3BAuuLI5oGlULyNfyB/HYNujwktOfRrMr5t77NmevqaUopx0grnKAyvVpmwUDB4x6FPXuGvYLTDwWsejwgtgkYKPqRJg8SV6xaiZ3ZTppGneS4yfH5/66fZSDHv+QZci/+h5c5UHtpy67JUqGppM0sh0Nc1dW6/N1W5Yoqat8/TU/VnadmdeW2PLLSyh0cvxBs3KbqTmwYPpxN4do/mzE8nEpvX/UMu2Wbp74zUAK5q6WkHns7V0eWkdPbPzd3rxkTGybadYySumVzhcaJFbs5UrEkQ/+CK8gF5dnh/6ciIZ73gwQ927L1IitoxKLXYP3SjYdOrHHfTZhRRlFyrorafPk20B3HPD1y2G3qKZME5Jcf3t/HUC13/8tSd++vqFveMUTwAUxSUFI1QekR1+bIze3D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">仲景方证精要<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="提要"><a href="#提要" class="header-anchor">#</a> 提要</h2> <p>《伤寒论》以<strong>六经辨证</strong>论外感，《金匮要略》以<strong>脏腑经络辨证</strong>论杂病，二者同出《伤寒杂病论》，一脉相承</p> <ul><li><strong>伤寒</strong> — 邪由表入里，按太阳 → 阳明 → 少阳 → 太阴 → 少阴 → 厥阴传变，重在祛邪与救误</li> <li><strong>金匮</strong> — 病自内而生，按脏腑经络归类，重在调虚实、治未病</li> <li><strong>共同法度</strong> — 观其脉证，知犯何逆，随证治之；保胃气、存津液、扶正祛邪</li></ul> <blockquote><p>外感急症参&quot;感冒辨治图&quot;，内伤杂病参&quot;杂病证治&quot;，二者皆以脉症合参为断</p></blockquote> <h2 id="一、脉诊纲领"><a href="#一、脉诊纲领" class="header-anchor">#</a> 一、脉诊纲领</h2> <p><strong>阴阳脉（总纲）</strong></p> <ul><li>阳脉 — 大、浮、数、动、滑，主有余、热实，预后较好</li> <li>阴脉 — 沉、涩、弱、弦、微，主不足、虚寒，预后较差</li> <li>逆顺 — 阴病见阳脉（正胜邪退）为顺；阳病见阴脉（邪盛正衰）为逆</li></ul> <p><strong>常脉与变脉</strong></p> <ul><li>四时 — 春弦、夏洪、秋浮、冬沉，皆须<strong>有胃气</strong>（柔和从容）方为平脉</li> <li>五脏平脉 — 肝微弦濡弱而长、心洪大而长、肺浮涩而短、肾沉滑如石；无胃气之真脏脉（纯弦、毛、石）主死</li> <li>部位 — 浮为在表、沉为在里、数为在腑、迟为在脏；尺脉为根，尺绝者危</li> <li>体质 — 肥人脉沉、瘦人脉浮，反此者为病</li></ul> <p><strong>特殊脉</strong></p> <table><thead><tr><th>脉</th> <th>特征</th> <th>主病</th></tr></thead> <tbody><tr><td>结</td> <td>缓而时止</td> <td>阴盛寒凝，治宜温通</td></tr> <tr><td>促</td> <td>数而时止</td> <td>阳盛热郁，治宜清泄</td></tr> <tr><td>革 / 芤</td> <td>弦大中空</td> <td>亡血失精（半产、崩漏、失血）</td></tr> <tr><td>弦</td> <td>如弓弦不移</td> <td>肝胆病、痰饮、痛证</td></tr> <tr><td>紧</td> <td>如转索无常</td> <td>寒、痛、表实</td></tr> <tr><td>散 / 损</td> <td>散乱无根、一息二至</td> <td>元气脱失，危候</td></tr> <tr><td>结代</td> <td>心动悸、脉结代</td> <td>心阴阳两虚，炙甘草汤</td></tr></tbody></table> <p><strong>诊脉三要素</strong> — 胃气（柔和则生）、根（尺脉不绝可治）、神（脉律有序）</p> <h2 id="二、六经辨证纲要"><a href="#二、六经辨证纲要" class="header-anchor">#</a> 二、六经辨证纲要</h2> <table><thead><tr><th>六经</th> <th>病位病性</th> <th>主症</th> <th>治法</th> <th>代表方</th></tr></thead> <tbody><tr><td>太阳</td> <td>表</td> <td>脉浮、头项强痛、恶寒发热</td> <td>汗法</td> <td>表虚自汗脉缓 → 桂枝汤；表实无汗脉紧 → 麻黄汤；表郁轻证 → 桂麻各半汤；项背强几几 → 葛根汤（无汗）/ 桂枝加葛根汤（有汗）；外寒里热烦躁 → 大青龙汤；心下有水气 → 小青龙汤</td></tr> <tr><td>阳明</td> <td>里热实</td> <td>身热汗出不恶寒、口渴、脉洪大；或腑实便秘</td> <td>清、下</td> <td>经证 → 白虎汤；腑实 → 承气汤类；湿热发黄 → 茵陈蒿汤；寒呕 → 吴茱萸汤</td></tr> <tr><td>少阳</td> <td>半表半里</td> <td>寒热往来、胸胁苦满、口苦咽干、脉弦</td> <td>和法</td> <td>小柴胡汤；兼里实 → 大柴胡汤；兼水饮 → 柴胡桂枝干姜汤</td></tr> <tr><td>太阴</td> <td>脾虚寒湿</td> <td>腹满而吐、下利、食不下</td> <td>温中</td> <td>理中汤（丸）；兼表 → 桂枝人参汤</td></tr> <tr><td>少阴</td> <td>心肾虚衰</td> <td>脉微细、但欲寐、四肢厥逆</td> <td>回阳 / 滋阴</td> <td>寒化 → 四逆汤、真武汤、附子汤；热化 → 黄连阿胶汤</td></tr> <tr><td>厥阴</td> <td>寒热错杂</td> <td>消渴、气上撞心、厥热胜复、蛔厥</td> <td>寒热并用</td> <td>乌梅丸；血虚寒厥 → 当归四逆汤</td></tr></tbody></table> <p><strong>传变与合病</strong></p> <ul><li>传经 — 脉静为不传，脉数急为传；不可拘于日数，观其脉证为准</li> <li>合病并病 — 太阳阳明合病 → 葛根汤 / 葛根芩连汤；太阳少阳合病 → 黄芩汤；三阳合病 → 白虎汤</li> <li>变证救误 — 误下成结胸 → 大陷胸汤（热实）/ 三物白散（寒实）；成痞 → 泻心汤类；阳虚烦躁 → 干姜附子汤；余热未清 → 栀子豉汤、竹叶石膏汤</li></ul> <h2 id="三、治则与禁忌"><a href="#三、治则与禁忌" class="header-anchor">#</a> 三、治则与禁忌</h2> <p><strong>大法</strong> — 汗（表）、吐（胸膈痰食，瓜蒂散）、下（里实）、和（少阳）、温（寒）、清（热）、补（虚）、消（瘀、饮、癥）</p> <p><strong>表里先后</strong></p> <ul><li>表未解不可攻里；里虚寒甚（下利清谷）则急当救里，后治其表</li> <li>卒病（新病）先治，痼疾（旧病）缓图</li></ul> <p><strong>扶正祛邪</strong> — 保胃气（桂枝汤之姜枣、白虎汤之粳米甘草）、存津液（忌过汗过下）、顾阳气（湿病、三阴病）</p> <p><strong>禁忌</strong></p> <ul><li>忌汗 — 亡血家、疮家、酒客、阴虚津亏、少阴里虚（脉沉者急温之）</li> <li>忌下 — 表未解、呕多、阳明脉迟面赤者；湿病早下致哕、胸满、小便不利</li> <li>忌温针火劫 — 助热劫阴，可致惊狂、坏病</li> <li>辨寒热真假 — 身大热反欲近衣被者为真寒假热，宜四逆汤；脉症不符须审因而治</li></ul> <p><strong>治未病</strong> — 见肝之病，知肝传脾，当先实脾；四季脾旺不受邪</p> <h2 id="四、杂病证治-金匮"><a href="#四、杂病证治-金匮" class="header-anchor">#</a> 四、杂病证治（金匮）</h2> <p><strong>痉湿暍</strong></p> <ul><li>痉 — 刚痉（无汗恶寒）→ 葛根汤；柔痉（汗出不恶寒）→ 栝蒌桂枝汤；热极伤阴、腹硬口噤 → 大承气汤急下存阴</li> <li>湿 — 外湿 → 麻黄加术汤；风湿化热 → 麻杏薏甘汤；风湿表虚 → 防己黄芪汤；阳虚风湿 → 桂枝附子汤 / 白术附子汤 / 甘草附子汤。总则：微汗祛湿，不可大汗；内湿当利小便（五苓散、苓桂术甘汤）</li> <li>暍（中暑）— 白虎加人参汤清暑益气；湿热水结 → 一物瓜蒂汤；禁汗、禁下、禁温针</li></ul> <p><strong>肺系</strong> — 肺痿虚热 → 麦门冬汤，虚寒 → 甘草干姜汤；肺痈 → 葶苈大枣泻肺汤、桔梗汤；咳嗽上气 → 射干麻黄汤（寒）/ 越婢加半夏汤（热）</p> <p><strong>痰饮水气黄疸</strong> — 病痰饮者当以温药和之 → 苓桂术甘汤；悬饮 → 十枣汤；水气 → 越婢汤、防己茯苓汤；阳黄 → 茵陈蒿汤，阴黄 → 茵陈五苓散</p> <p><strong>胸痹腹满</strong> — 胸痹 → 栝蒌薤白类方，重症 → 乌头赤石脂丸；腹满寒疝 → 附子粳米汤、大建中汤（虚寒）/ 大承气汤（实热）</p> <p><strong>血痹虚劳</strong> — 血痹 → 黄芪桂枝五物汤；虚劳阴阳两虚 → 小建中汤、黄芪建中汤；肾虚 → 肾气丸；干血劳 → 大黄䗪虫丸</p> <p><strong>百合狐惑阴阳毒</strong> — 百合病（心肺阴虚）→ 百合地黄汤；狐惑（湿热虫毒）→ 甘草泻心汤，外用苦参汤、雄黄熏；阴阳毒 → 升麻鳖甲汤加减</p> <p><strong>疟病</strong> — 疟母 → 鳖甲煎丸；瘅疟 → 白虎加桂枝汤；牡疟 → 蜀漆散</p> <p><strong>中风历节</strong> — 中风分中络、中经、中腑、中脏 → 侯氏黑散、风引汤；历节 → 桂枝芍药知母汤、乌头汤</p> <p><strong>妇人三篇</strong></p> <ul><li>妊娠 — 恶阻 → 干姜人参半夏丸；漏下胞阻 → 胶艾汤；腹痛 → 当归芍药散；水肿 → 葵子茯苓散；养胎 → 当归散、白术散；癥病下血 → 桂枝茯苓丸</li> <li>产后 — 三证（痉、郁冒、大便难）；腹痛 → 当归生姜羊肉汤、枳实芍药散、下瘀血汤；中风 → 竹叶汤；烦呕 → 竹皮大丸；下利虚极 → 白头翁加甘草阿胶汤</li> <li>杂病 — 热入血室 → 小柴胡汤或刺期门；梅核气 → 半夏厚朴汤；脏躁 → 甘麦大枣汤；月经不调崩漏 → 温经汤；转胞 → 肾气丸</li></ul> <p><strong>急救与禁忌</strong> — 卒死 → 薤汁灌鼻、人工呼吸；寒积卒痛 → 三物备急丸；金疮 → 王不留行散；中毒 → 甘草、大豆汁、地浆水解之。饮食忌自死禽兽、腐败果实、蜜反生葱等</p> <h2 id="五、感冒辨治简易图表"><a href="#五、感冒辨治简易图表" class="header-anchor">#</a> 五、感冒辨治简易图表</h2> <p><strong>用法</strong> — 由最上方之有汗 / 无汗读起，依症状分支往下走至对应方剂为止（判断重要性依序由上而下）</p> <img src="/assets/img/image-20250314112723096.237ede2d.png"> <img src="/assets/img/image-20250314112757307.68f2dd69.png"> <img src="/assets/img/image-20250314112821440.6623b2ac.png"> <img src="/assets/img/image-20250314112841683.35d7dd4b.png"> <p><strong>附註</strong></p> <ol><li>發燒 + 有汗 + 口渴欲飲冷 + 怕熱 → 白虎湯（陽明熱證）</li> <li>腸胃型感冒
<ul><li>a. 發燒、頭痛、口渴欲飲水、但一喝就吐、或有（拉肚子）水瀉 → 五苓散</li> <li>b. 發燒 + 瀉肚子（肛門有灼熱感 + 惡臭）→ 葛根芩連湯（陽明濕熱證）</li> <li>c. 腸病毒 / 手足口病（施合一醫師經驗效方）→ 葛根芩連湯加五苓散</li> <li>d. 施合一醫師腸胃型感冒常用藥方 → 附子理中湯、黃連湯、胃苓湯</li></ul></li> <li>發燒 / 咳嗽 / 喉嚨痛 / 鼻塞 / 頭身痛 + 無汗 + 口不渴 + 怕冷 + 四肢冰冷 + 疲累 → 麻黃附子細辛湯（少陰證）</li> <li>女子月經期間感冒宜小柴胡湯加減，或合方使用，若咳嗽加厚朴、杏仁，若喉嚨痛加葛根</li> <li>嚴重之喉嚨痛（伴有灼熱感），例如扁桃腺化膿，可再另加玄參、馬勃、重樓</li> <li>若為小青龍湯證，但表證（惡寒、發熱、頭身痛）不明顯 → 射干麻黃湯</li> <li>鼻塞嚴重可加辛夷、蒼朮、石菖蒲</li> <li>若咳嗽不癒，表示此人平時即多有痰飲體質；如（津虧）聲啞或乾咳無痰，表示此人平時多晚睡、貪食炸烤食物，或服抗生素而傷到津液</li> <li>感冒後容易有後遺症者，請多運動，並維持良好生活作息及飲食習慣</li></ol> <p><strong>服法与剂量（科學中藥）</strong></p> <ul><li>每日三次，早中晚餐飯前以溫開水送服；病情較重者睡前加服一次</li> <li>對證下藥，病情多半 24 小時內明顯改善；連服 1 ~ 2 日無效應轉方或就醫</li></ul> <table><thead><tr><th>參考年齡</th> <th>每次劑量（公克）</th></tr></thead> <tbody><tr><td>1 歲以下</td> <td>0.3 ~ 0.5</td></tr> <tr><td>1 ~ 3 歲</td> <td>0.5 ~ 1.5</td></tr> <tr><td>3 ~ 6 歲</td> <td>1.5 ~ 2.0</td></tr> <tr><td>6 ~ 10 歲</td> <td>3.0</td></tr> <tr><td>10 ~ 14 歲</td> <td>4.0</td></tr> <tr><td>14 ~ 18 歲</td> <td>5.0</td></tr> <tr><td>18 歲以上</td> <td>6.0</td></tr></tbody></table> <p><strong>複方與單方配比</strong>（以成人每次 6 克為例，餘按年齡換算）</p> <ul><li>單用複方 → 6 克</li> <li>複方 + 單方 → 複方 5 ~ 4 克、單方 1 ~ 2 克
<ul><li>小柴胡湯 + 葛根 = 5 : 1（喉痛或口渴重時 4 : 2）</li> <li>桂枝湯 + 杏仁 + 厚朴 = 5 : 0.5 : 0.5 或 4 : 1 : 1（依咳嗽輕重）</li> <li>葛根湯 + 玄參 + 馬勃 + 重樓 = 4 : 0.7 : 0.7 : 0.7</li></ul></li></ul> <p><strong>患者須知</strong> — 飲食清淡，少食肉則復原更速；癒後在家多休息一日</p> <p><strong>藥材警示</strong> — 浸泡膽巴或硫磺薰製（二氧化硫）的藥材會損傷肝腎，務必慎選</p> <blockquote><p>水藥藥效較科學中藥為強，劑量依醫師處方；小兒用量按體重比例折算（60 公斤成人一碗，30 公斤小兒半碗）</p></blockquote> <h2 id="六、常用经方速查"><a href="#六、常用经方速查" class="header-anchor">#</a> 六、常用经方速查</h2> <table><thead><tr><th>方</th> <th>组成要点</th> <th>方证</th></tr></thead> <tbody><tr><td>桂枝汤</td> <td>桂枝、芍药、生姜、甘草、大枣</td> <td>太阳中风表虚，发热汗出恶风脉缓；调和营卫</td></tr> <tr><td>麻黄汤</td> <td>麻黄、桂枝、杏仁、甘草</td> <td>太阳伤寒表实，无汗恶寒身痛脉紧</td></tr> <tr><td>葛根汤</td> <td>葛根、麻黄、桂枝汤</td> <td>无汗项背强几几；刚痉</td></tr> <tr><td>大青龙汤</td> <td>麻黄汤 + 石膏、姜枣</td> <td>表寒里热，无汗烦躁（脉微弱者忌）</td></tr> <tr><td>小青龙汤</td> <td>麻黄、桂枝、细辛、干姜、五味子、半夏、芍药、甘草</td> <td>外寒内饮，咳喘痰稀</td></tr> <tr><td>白虎汤</td> <td>石膏、知母、粳米、甘草</td> <td>阳明经热四大证；加人参治气阴两伤</td></tr> <tr><td>承气汤类</td> <td>大黄（芒硝、枳实、厚朴）</td> <td>阳明腑实，痞满燥实坚</td></tr> <tr><td>小柴胡汤</td> <td>柴胡、黄芩、半夏、人参、姜枣草</td> <td>少阳枢机不利，寒热往来胸胁苦满</td></tr> <tr><td>理中汤</td> <td>人参、白术、干姜、甘草</td> <td>太阴虚寒，腹痛吐利</td></tr> <tr><td>四逆汤</td> <td>附子（生）、干姜、甘草</td> <td>少阴寒化，厥逆下利清谷脉微</td></tr> <tr><td>真武汤</td> <td>附子、茯苓、白术、生姜、芍药</td> <td>阳虚水泛，悸眩瞤振</td></tr> <tr><td>黄连阿胶汤</td> <td>黄连、黄芩、阿胶、芍药、鸡子黄</td> <td>少阴热化，心烦不寐</td></tr> <tr><td>炙甘草汤</td> <td>炙甘草、人参、地黄、阿胶、麦冬、麻仁、姜枣、酒</td> <td>脉结代、心动悸</td></tr> <tr><td>乌梅丸</td> <td>乌梅、细辛、干姜、黄连、附子、当归、蜀椒、桂枝、人参、黄柏</td> <td>厥阴寒热错杂，蛔厥久利</td></tr> <tr><td>五苓散</td> <td>猪苓、泽泻、茯苓、桂枝、白术</td> <td>气化不利，水入即吐、小便不利</td></tr> <tr><td>苓桂术甘汤</td> <td>茯苓、桂枝、白术、甘草</td> <td>痰饮心下，胸胁支满目眩</td></tr> <tr><td>半夏泻心汤</td> <td>半夏、黄芩、黄连、人参、干姜、甘草、大枣</td> <td>寒热错杂痞满呕利</td></tr> <tr><td>栝蒌薤白白酒汤</td> <td>栝蒌、薤白、白酒</td> <td>胸痹喘息短气</td></tr> <tr><td>肾气丸</td> <td>地黄、山药、山萸、泽泻、茯苓、丹皮、桂、附</td> <td>肾气不足，转胞、虚劳腰痛</td></tr> <tr><td>温经汤</td> <td>吴茱萸、当归、芎藭、芍药、人参、桂枝、阿胶、丹皮、生姜、甘草、半夏、麦冬</td> <td>冲任虚寒，崩漏月经不调</td></tr> <tr><td>桂枝茯苓丸</td> <td>桂枝、茯苓、丹皮、桃仁、芍药</td> <td>癥瘕，妊娠下血不止</td></tr></tbody></table> <p><strong>剂量与煎服法</strong> — 详见下节，经方疗效半在剂量比例、半在煎服法度</p> <h2 id="七、经方剂量与煎服法"><a href="#七、经方剂量与煎服法" class="header-anchor">#</a> 七、经方剂量与煎服法</h2> <p><strong>计量换算（通行参考值）</strong></p> <table><thead><tr><th>汉制</th> <th>今制约量</th></tr></thead> <tbody><tr><td>一两</td> <td>15 克（学界有 13.8 ~ 15.6 克之争）</td></tr> <tr><td>一斤</td> <td>十六两 ≈ 240 克</td></tr> <tr><td>一升</td> <td>200 毫升</td></tr> <tr><td>一合</td> <td>20 毫升</td></tr> <tr><td>杏仁七十枚</td> <td>20 ~ 25 克</td></tr> <tr><td>附子一枚</td> <td>15 ~ 20 克（生者毒性大，须先煎久煎）</td></tr></tbody></table> <blockquote><p>临证重在<strong>方内比例</strong>而非绝对剂量，多按原方比例折算后随证加减</p></blockquote> <p><strong>通用煎服规则</strong></p> <ul><li><strong>先煎</strong> — 麻黄、葛根先煎去上沫（减其悍烈）；石膏、附子先煎久煎；乌头蜜煎减毒</li> <li><strong>后下</strong> — 大黄攻下时后下，久煎则力缓；芒硝去滓后溶入，得下即止</li> <li><strong>去滓再煎</strong> — 小柴胡汤、泻心汤类，取其和解中和之意</li> <li><strong>汗法调护</strong> — 温服、啜热粥、温覆取微汗，以遍身漐漐微似有汗为佳，不可令如水流漓</li> <li><strong>峻下攻逐</strong> — 十枣汤平旦空腹服，快利后糜粥自养；大承气汤得下余勿服</li> <li><strong>丸散缓图</strong> — 鳖甲煎丸空心服，自小量渐加，以知为度</li></ul> <p><strong>伤寒代表方剂量与煎服要点</strong></p> <table><thead><tr><th>方</th> <th>原方剂量</th> <th>煎服要点</th></tr></thead> <tbody><tr><td>桂枝汤</td> <td>桂枝、芍药、生姜各三两，甘草二两，大枣十二枚</td> <td>水煎温服，啜热粥温覆取微汗；表实无汗、酒客、亡血家禁用</td></tr> <tr><td>麻黄汤</td> <td>麻黄三两、桂枝二两、杏仁七十个、甘草一两</td> <td>先煮麻黄去沫；取微汗，不必尽剂</td></tr> <tr><td>白虎汤</td> <td>石膏一斤、知母六两、甘草二两、粳米六合</td> <td>石膏先煎，粳米甘草护中；热退即止，不可久服</td></tr> <tr><td>小柴胡汤</td> <td>柴胡半斤，黄芩、人参、甘草、生姜各三两，半夏半升，大枣十二枚</td> <td>去滓再煎，温服，日三服</td></tr> <tr><td>理中汤</td> <td>人参、白术、干姜、甘草各三两</td> <td>丸剂缓图、汤剂急用；服后腹中转热为效</td></tr> <tr><td>四逆汤</td> <td>附子一枚（生）、干姜一两半、甘草二两</td> <td>附子先煎久煎；脉出厥回为效</td></tr> <tr><td>乌梅丸</td> <td>乌梅三百枚、黄连十六两、干姜十两，细辛、附子、桂枝、人参、黄柏各六两，当归、蜀椒各四两</td> <td>炼蜜为丸，米饮下；酸苦辛甘并投、寒热并用</td></tr></tbody></table> <p><strong>金匮代表方剂量与煎服要点</strong></p> <table><thead><tr><th>方</th> <th>原方剂量</th> <th>煎服要点</th></tr></thead> <tbody><tr><td>栝蒌桂枝汤</td> <td>栝蒌根二两、桂枝三两、芍药三两、甘草二两、生姜三两、大枣十二枚</td> <td>水九升煮三升，分温三服，啜热粥取微汗（柔痉，身体强几几、脉沉迟）</td></tr> <tr><td>葛根汤</td> <td>葛根四两、麻黄三两、桂枝二两、芍药二两、甘草二两、生姜三两、大枣十二枚</td> <td>先煮麻黄、葛根去沫，煮取三升温服一升（刚痉，无汗恶寒、口噤不得语）</td></tr> <tr><td>大承气汤</td> <td>大黄四两、厚朴半斤、枳实五枚、芒硝三合</td> <td>先煮枳朴，后下大黄，去滓溶芒硝（痉病胸满口噤、卧不着席者急下存阴）</td></tr> <tr><td>麻黄加术汤</td> <td>麻黄二两、桂枝二两、甘草一两、杏仁七十枚、白术四两</td> <td>先煮麻黄去沫，煮取二升半温服取微汗，忌火攻（寒湿在表身烦疼）</td></tr> <tr><td>麻杏薏甘汤</td> <td>麻黄半两、甘草一两、薏苡仁半两、杏仁十个</td> <td>水煎温服，取微汗避风（风湿在表化热，一身尽痛、日晡发热）</td></tr> <tr><td>防己黄芪汤</td> <td>防己一两、黄芪一两一分、白术三分（七钱半）、甘草半两，加生姜四片、大枣一枚</td> <td>以&quot;虫行皮中&quot;为药效反应；腹痛加芍药（风湿表虚，脉浮身重汗出恶风）</td></tr> <tr><td>桂枝附子汤</td> <td>桂枝四两、附子三枚、生姜三两、甘草二两、大枣十二枚</td> <td>温经助阳祛湿；身体疼烦、不能自转侧（表阳虚风湿）</td></tr> <tr><td>白术附子汤</td> <td>白术二两、附子一枚半、甘草一两、生姜一两半、大枣六枚</td> <td>侧重温脾阳以祛湿；大便坚、小便自利者</td></tr> <tr><td>甘草附子汤</td> <td>甘草、白术各二两，附子二枚，桂枝四两</td> <td>骨节疼烦、汗出短气、恶风、小便不利</td></tr> <tr><td>黄芪桂枝五物汤</td> <td>黄芪、桂枝、芍药各三两，生姜六两，大枣十二枚</td> <td>水六升煮二升，分温三服（血痹，身体不仁、脉微涩）</td></tr> <tr><td>乌头汤</td> <td>麻黄、芍药、黄芪各三两，炙甘草二两，川乌五枚</td> <td>川乌蜜煎减毒，煮取一升纳蜜再煎；以知为度，不可过量（历节痛不可屈伸）</td></tr> <tr><td>苓桂术甘汤</td> <td>茯苓四两、桂枝三两、白术三两、甘草二两</td> <td>水六升煮三升，分温三服，小便利则愈（痰饮心下支满目眩）</td></tr> <tr><td>十枣汤</td> <td>芫花、甘遂、大戟等分，大枣十枚煎汤送服</td> <td>平旦温服，快利后糜粥自养；体虚者慎用（悬饮咳唾引痛）</td></tr> <tr><td>百合地黄汤</td> <td>百合七枚、生地黄汁一升</td> <td>煎百合取汁合地黄汁分服，大便当如漆（百合病，意欲食复不能食、口苦尿赤）</td></tr> <tr><td>甘草泻心汤</td> <td>甘草四两、黄芩三两、人参三两、干姜二两、黄连一两、半夏半斤、大枣十二枚</td> <td>煮取六升去滓再煎，温服一升，日三服（狐惑，蚀于喉、默默欲眠）</td></tr> <tr><td>鳖甲煎丸</td> <td>鳖甲、乌扇、黄芩、柴胡等二十三味</td> <td>炼蜜为丸，空心服七丸，日三服，渐加至效（疟母，胁下痞硬）</td></tr></tbody></table> <p><strong>杂病常用方组成补遗</strong>（原笔记未载剂量，据通行本补，供对照）</p> <table><thead><tr><th>方</th> <th>组成</th> <th>方证</th></tr></thead> <tbody><tr><td>麦门冬汤</td> <td>麦冬七升、半夏一升、人参三两、甘草二两、粳米三合、大枣十二枚</td> <td>肺痿虚热，咳唾涎沫、咽喉不利</td></tr> <tr><td>葶苈大枣泻肺汤</td> <td>葶苈子（熬）、大枣十二枚</td> <td>肺痈喘不得卧、支饮不得息</td></tr> <tr><td>射干麻黄汤</td> <td>射干十三枚、麻黄四两、生姜四两、细辛、紫菀、款冬花各三两，五味子、半夏各半升，大枣七枚</td> <td>寒饮咳喘，喉中水鸡声</td></tr> <tr><td>栝蒌薤白白酒汤</td> <td>栝蒌实一枚、薤白半升、白酒七升</td> <td>胸痹喘息咳唾、短气</td></tr> <tr><td>半夏厚朴汤</td> <td>半夏一升、厚朴三两、茯苓四两、生姜五两、苏叶二两</td> <td>梅核气，咽中如有炙脔</td></tr> <tr><td>甘麦大枣汤</td> <td>甘草三两、小麦一升、大枣十枚</td> <td>脏躁，喜悲伤欲哭</td></tr> <tr><td>当归芍药散</td> <td>当归三两、芍药一斤、茯苓、白术各四两，泽泻、川芎各半斤</td> <td>肝脾不和，腹中拘急疼痛</td></tr> <tr><td>当归生姜羊肉汤</td> <td>当归三两、生姜五两、羊肉一斤</td> <td>产后血虚寒凝腹痛</td></tr> <tr><td>肾气丸</td> <td>干地黄八两，山药、山茱萸各四两，泽泻、茯苓、丹皮各三两，桂枝、附子各一两</td> <td>肾气不足，虚劳腰痛、转胞</td></tr> <tr><td>大黄䗪虫丸</td> <td>大黄、黄芩、甘草、桃仁、杏仁、芍药、干地黄、干漆、虻虫、水蛭、蛴螬、䗪虫</td> <td>干血劳，肌肤甲错、两目黯黑</td></tr></tbody></table> <h2 id="八、现代应用举隅"><a href="#八、现代应用举隅" class="header-anchor">#</a> 八、现代应用举隅</h2> <ul><li><strong>呼吸</strong> — 麻黄汤 / 桂枝汤（感冒流感）、麻杏石甘汤（肺炎）、小青龙汤（寒饮喘咳）、射干麻黄汤（哮喘）</li> <li><strong>消化</strong> — 半夏泻心汤（胃炎）、理中汤（虚寒腹痛）、大承气汤（肠梗阻）、茵陈蒿汤（黄疸）</li> <li><strong>心脑</strong> — 真武汤 / 四逆汤（心衰）、炙甘草汤（心律失常）、柴胡加龙骨牡蛎汤（焦虑失眠）</li> <li><strong>免疫代谢</strong> — 白虎加人参汤（糖尿病燥热）、桂枝芍药知母汤、乌头汤（风湿痹痛）</li> <li><strong>妇科</strong> — 温经汤（月经不调）、甘麦大枣汤（更年期脏躁）、桂枝茯苓丸（子宫肌瘤、卵巢囊肿）</li></ul> <p><strong>运用原则</strong> — 有是证用是方，不拘病名；剂量灵活化裁；中西结合取长补短</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/29, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><!----> <a href="/pages/star/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">网址收藏</div></a></div> <div class="page-nav"><p class="inner"><!----> <span class="next"><a href="/pages/star/">网址收藏</a>→
