kr3chNfC3DMzGJlNBElW8w9nsGQvhNGIzDkXzCg8cLK951xHsFBlTJspJNi3ZFIMF2AeDV3q8DNOB+YHi6QTrChDIWDBRi5U5f+ZMfJLu3ccrqxtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">微机原理与接口技术<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>本文记录微机原理与接口技术课程中的四个实验，均在 <code>Tpc-zk-II</code> 集成开发环境与微机原理与接口技术实验箱上完成，汇编程序在 <code>IDE</code> 中编译并下载运行，涵盖 8259 中断、8253 定时/计数、8255 并行接口与 ADC0809 模数转换四部分。实验前需检查各种插线是否稳固（<code>USB</code> 接口、电路板插稳后会亮灯指示），并在 <code>IDE</code> 中完成硬件检测这一步，<code>IDE</code> 对汇编代码的报错详细到行，逐行核对即可</p> <table><thead><tr><th>实验</th> <th>实验目的</th></tr></thead> <tbody><tr><td>系统中断实验</td> <td>掌握 PC 机中断处理系统的基本原理，学会编写中断服务程序</td></tr> <tr><td>8253 定时器计数器实验</td> <td>掌握 8253 的计数特点和编程方法，掌握工作方式 3 的原理与编程方法</td></tr> <tr><td>8255 并行 I/O 实验</td> <td>了解 8255 芯片结构及编程方法，了解 8255 输入/输出实验方法</td></tr> <tr><td>模/数转换器 0809 实验</td> <td>了解模/数转换的基本原理，掌握 ADC0809 的使用方法</td></tr></tbody></table> <p>实验环境</p> <ul><li><code>Tpc-zk-II</code> 集成开发环境</li> <li>微机原理与接口技术实验箱</li></ul> <h2 id="系统中断"><a href="#系统中断" class="header-anchor">#</a> 系统中断</h2> <h3 id="中断处理原理"><a href="#中断处理原理" class="header-anchor">#</a> 中断处理原理</h3> <p>系统上电时，ROM BIOS 对 8259A 的主片和从片要执行初始化命令</p> <img src="/assets/img/image-20230329131355139.da00633d.png"> <p>中断向量和中断向量表：</p> <img src="/assets/img/image-20230329131424464.5781d568.png"> <p>CPU 获取中断类型码的方法有三种</p> <ul><li>CPU 内部中断时，由硬件电路自动提供</li> <li>软中断 <code>INT n</code> 在指令的代码中提供</li> <li>可屏蔽的外中断 INTR 通过硬件（8259A）提供</li></ul> <p>对于 PC/AT 及 286 以上微机，内部又扩展了一片 8259 中断控制器，IRQ2 用于两片 8259 之间级连，对外可以提供 16 个中断源</p> <table><thead><tr><th>中断源</th> <th>中断类型号</th> <th>中断功能</th></tr></thead> <tbody><tr><td>IRQ0</td> <td>08H</td> <td>时钟</td></tr> <tr><td>IRQ1</td> <td>09H</td> <td>键盘</td></tr> <tr><td>IRQ2</td> <td>0AH</td> <td>保留</td></tr> <tr><td>IRQ3</td> <td>0BH</td> <td>串行口2</td></tr> <tr><td>IRQ4</td> <td>0CH</td> <td>串行口1</td></tr> <tr><td>IRQ5</td> <td>0DH</td> <td>硬盘</td></tr> <tr><td>IRQ6</td> <td>0EH</td> <td>软盘</td></tr> <tr><td>IRQ7</td> <td>0FH</td> <td>并行打印机</td></tr> <tr><td>IRQ8</td> <td>70H</td> <td>实时时钟</td></tr> <tr><td>IRQ9</td> <td>71H</td> <td>用户中断</td></tr> <tr><td>IRQ10</td> <td>72H</td> <td>保留</td></tr> <tr><td>IRQ11</td> <td>73H</td> <td>保留</td></tr> <tr><td>IRQ12</td> <td>74H</td> <td>保留</td></tr> <tr><td>IRQ13</td> <td>75H</td> <td>协处理器</td></tr> <tr><td>IRQ14</td> <td>76H</td> <td>硬盘</td></tr> <tr><td>IRQ15</td> <td>77H</td> <td>保留</td></tr></tbody></table> <p>本实验使用 <code>IRQ3</code>，中断类型号为 <code>0BH</code>，需要把服务程序的入口地址写入 <code>0BH</code> 号向量（位于 <code>0000:002CH</code>，低字为偏移、高字为段址）；硬件中断的服务程序结束前还要向 <code>20H</code> 端口发出 <code>EOI</code> 命令</p> <h3 id="中断服务程序"><a href="#中断服务程序" class="header-anchor">#</a> 中断服务程序</h3> <p>实验电路直接用手动单脉冲作为中断请求信号（只需连接一根导线），要求每按一次开关产生一次中断，在屏幕上显示 <code>NEUQ 2023!if Winter comes,can Spring be far behind?</code></p> <img src="/assets/img/image-20230329131817840.99ad9a5d.png"> <p>插上实验箱电源，<code>USB</code> 接口连接主机，连接实验箱<code>总线/MIRQx</code>和<code>单脉冲1/正脉冲</code>，开启实验箱电源，在 <code>Tpc-zk-II</code> 集成开发环境中进行硬件检测后，编写汇编代码</p> <p>interrupt.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment
    info db <span class="token string">'NEUQ 2023!if Winter comes,can Spring be far behind?'</span>, <span class="token number">0ah</span>, <span class="token number">0ah</span>, <span class="token string">'$'</span>
data ends
code segment
assume <span class="token register variable">cs</span>:code, <span class="token register variable">ds</span>:data
<span class="token label function">start:</span>
    mov <span class="token register variable">ax</span>,<span class="token register variable">cs</span>
    mov <span class="token register variable">ds</span>,<span class="token register variable">ax</span>
    mov <span class="token register variable">dx</span>,offset int3
    mov <span class="token register variable">ah</span>,<span class="token number">25h</span>
    mov <span class="token register variable">al</span>,<span class="token number">0bh</span>
    int <span class="token number">21h</span>
    in <span class="token register variable">al</span>,<span class="token number">21h</span>
    and <span class="token register variable">al</span>,<span class="token number">0f7h</span>
    out <span class="token number">21h</span>,<span class="token register variable">al</span>
<span class="token label function">here:</span>jmp here
int3 proc
    push <span class="token register variable">ax</span>
    push <span class="token register variable">ds</span>
    push <span class="token register variable">dx</span>
    sti
    mov <span class="token register variable">ax</span>,data
    mov <span class="token register variable">ds</span>,<span class="token register variable">ax</span>
    mov <span class="token register variable">dx</span>,offset info
    mov <span class="token register variable">ah</span>,<span class="token number">9</span>
    int <span class="token number">21h</span>
    mov <span class="token register variable">al</span>,<span class="token number">20h</span>
    out <span class="token number">20h</span>,<span class="token register variable">al</span>
    cli
    pop <span class="token register variable">dx</span>
    pop <span class="token register variable">ds</span>
    pop <span class="token register variable">ax</span>
    iret
int3 endp
code ends
end start

，最适合做分频</li></ul> <h3 id="计数实验"><a href="#计数实验" class="header-anchor">#</a> 计数实验</h3> <p>实验流程：</p> <img src="/assets/img/image-20230409100630614.8fcf8350.png"> <p>count.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment
io0 equ <span class="token number">280h</span>
io1 equ <span class="token number">281h</span>
io2 equ <span class="token number">282h</span>
iok equ <span class="token number">283h</span>
data ends
code segment
assume <span class="token register variable">cs</span>:code,<span class="token register variable">ds</span>:data
<span class="token label function">start:</span>
    mov <span class="token register variable">ax</span>,data
    mov <span class="token register variable">ds</span>,<span class="token register variable">ax</span>
    mov <span class="token register variable">dx</span>,iok
    mov <span class="token register variable">al</span>,<span class="token number">14h</span>
    out <span class="token register variable">dx</span>,<span class="token register variable">al</span>
    mov <span class="token register variable">dx</span>,io0
    mov <span class="token register variable">al</span>,<span class="token number">9</span>
    out <span class="token register variable">dx</span>,<span class="token register variable">al</span>

 <table><thead><tr><th>接线</th> <th></th></tr></thead> <tbody><tr><td>8254/CLK0</td> <td>单脉冲/正脉冲</td></tr> <tr><td>8254/CS</td> <td>I/O译码/Y0（280H---287H）</td></tr> <tr><td>8254/OUT0</td> <td>LED显示/L7 或 逻辑笔</td></tr> <tr><td>8254/GATE0</td> <td>+5V</td></tr></tbody></table> <p>点击运行，记录计数过程</p> <img src="/assets/img/count.2c5c3056.png"> <h3 id="定时实验"><a href="#定时实验" class="header-anchor">#</a> 定时实验</h3> <p>timer.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment

end start
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br></div></div><p>控制字 <code>36H</code> = <code>0011 0110B</code>：<code>D7D6=00</code> 选中 <code>CNT0</code>，<code>D5D4=11</code> 表示先读写低 8 位再读写高 8 位，<code>D3D2D1=011</code> 为方式 3，<code>D0=0</code> 为二进制计数；初值 <code>1000</code> 分两次写入，先送低字节再送高字节，均写到 <code>280H</code>。随后向控制口写入 <code>76H</code> = <code>0111 0110B</code>，即选中 <code>CNT1</code>、先低后高、方式 3、二进制计数，初值同样为 <code>1000</code>，写到 <code>281H</code></p> <p>按下图连接电路，将计数器 0、计数器 1 分别设置工作方式，CLK0 连接时钟 1MHZ，由 T0 进行 1000 分频后变为 1000HZ，再由 T1 进行 1000 分频后得 1HZ</p> <img src="/assets/img/image-20230409101423583.872fd97c.png"> <table><thead><tr><th>接线</th> <th></th></tr></thead> <tbody><tr><td>8254/CLK0</td> <td>时钟/1MHz</td></tr> <tr><td>8254/CS</td> <td>I/O译码/Y0（280H---287H）</td></tr> <tr><td>8254/OUT0</td> <td>LED显示/L7 或 逻辑笔</td></tr> <tr><td>8254/GATE0,GATE1</td> <td>+5V</td></tr> <tr><td>8254/OUT1</td> <td>逻辑笔</td></tr></tbody></table> <p>运行程序，可以看到指示灯如下描述闪烁：高低电平每变化一次，计数加一，计数由两位二进制组成，如</p> <ul><li>在<code>0</code>时刻，计数为<code>00</code>，两个指示灯均暗</li> <li>在<code>1</code>时刻，高低电平变化，计数变为<code>01</code>，第一个指示灯暗，第二个指示灯亮</li> <li>在<code>2</code>时刻，高低电平变化，计数为<code>10</code>，第一个指示灯亮，第二个指示灯暗</li> <li>在<code>3</code>时刻，计数为<code>11</code>，两个指示灯均亮</li> <li>在<code>4</code>时刻，计数为<code>00</code>，两个指示灯均暗</li></ul> <h2 id="_8255-并行输入输出"><a href="#_8255-并行输入输出" class="header-anchor">#</a> 8255 并行输入输出</h2> <p>8255 有 A、B、C 三个 8 位端口和一个控制寄存器。实验箱用 <code>I/O</code> 译码的 <code>Y1</code> 选中该芯片，基址为 <code>288H</code>，即 <code>288H</code> 为 A 口、<code>289H</code> 为 B 口、<code>28AH</code> 为 C 口、<code>28BH</code> 为控制口。方式控制字写往控制口：<code>D7=1</code> 为特征位，<code>D6D5</code>、<code>D2</code> 选 A 组、B 组方式，<code>D4</code>、<code>D1</code> 决定 A 口、B 口输入/输出，<code>D3</code>、<code>D0</code> 决定 C 口高 4 位与低 4 位的输入/输出；<code>D7=0</code> 时写入的是 C 口位操作命令，<code>D3D2D1</code> 选位、<code>D0</code> 决定置位还是复位</p> <h3 id="方式-0-输入输出"><a href="#方式-0-输入输出" class="header-anchor">#</a> 方式 0 输入输出</h3> <p>8255 方式 0 为基本输入输出方式，将 C 口作为输入，输入信号由 8 个逻辑电平开关提供；A 口作为输出，其内容由发光二极管显示。将实验线路连接好后编程，从 8255 的 C 口输入数据，再从 A 口输出：</p> <img src="/assets/img/image-20230420233958972.b1ab5570.png"> <table><thead><tr><th>接线</th> <th></th></tr></thead> <tbody><tr><td>8255/JP8(PC7---PC0)</td> <td>逻辑开关/JP1(K7---K0)</td></tr> <tr><td>8255/JP6(PA7---PA0)</td> <td>LED显示/JP2(L7---L0)</td></tr> <tr><td>8255/CS</td> <td>I/O译码/Y1(288H---28FH)</td></tr></tbody></table> <p>io3-1.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment

assume <span class="token register variable">cs</span>:code,<span class="token register variable">ds</span>:data

tr><td>8255/JP6(PA7---PA0)</td> <td>LED显示/JP2(L7---L0)</td></tr> <tr><td>8255/PC2</td> <td>单脉冲/负脉冲</td></tr> <tr><td>8255/CS</td> <td>I/O译码/Y1(288H---28FH)</td></tr></tbody></table> <p>io3-2.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment

> 中 <code>D3D2D1=100</code> 选中 <code>PC4</code>、<code>D0=1</code> 表示置位，即把该联络线置为高电平</p> <p>连接实验箱执行代码，逻辑开关代表三位二进制数，发送脉冲信号后其对应的十进制编号的 LED 灯点亮，显示输入的二进制数字</p> <h3 id="方式-1-中断输入"><a href="#方式-1-中断输入" class="header-anchor">#</a> 方式 1 中断输入</h3> <p>按方式 1 输入电路连线。编程每按一次单脉冲按钮产生一个正脉冲，使 8255 产生一次中断请求，CPU 进行一次中断服务：读取逻辑电平开关预置的 ASCII 码，在屏幕上显示其对应的字符，输出 <code>NEUQ2022</code>：</p> <img src="/assets/img/image-20230420234514891.86256597.png"> <table><thead><tr><th>接线</th> <th></th></tr></thead> <tbody><tr><td>8255/JP6(PA7---PA0)</td> <td>逻辑开关/JP1(K7---K0)</td></tr> <tr><td>8255/PC4</td> <td>单脉冲/正脉冲</td></tr> <tr><td>8255/PC3</td> <td>总线区/SIRQx</td></tr> <tr><td>8255/CS</td> <td>I/O译码/Y1(288H---28FH)</td></tr></tbody></table> <p>io3-3.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment

data ends
code segment
assume <span class="token register variable">cs</span>:code,<span class="token register variable">ds</span>:data

end start
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br></div></div><p>控制字 <code>0AFH</code> = <code>1010 1111B</code>：<code>D7=1</code> 为方式控制字，<code>D6D5=01</code> 表示 A 组方式 1、<code>D4=0</code> 表示 A 口输出、<code>D3=1</code> 表示 <code>PC7</code> 与 <code>PC6</code> 输出；<code>D2=0</code> 表示 B 组方式 0、<code>D1=1</code> 表示 B 口输入、<code>D0=1</code> 表示 <code>PC3～PC0</code> 输入。随后写入的位操作命令字 <code>04H</code> = <code>0000 0100B</code> 中 <code>D3D2D1=010</code> 选中 <code>PC2</code>、<code>D0=0</code> 表示复位</p> <p>连接实验箱执行代码，现象如下：</p> <img src="/assets/img/io2.b1956d3f.jpg"> <h2 id="adc0809-模数转换"><a href="#adc0809-模数转换" class="header-anchor">#</a> ADC0809 模数转换</h2> <p>ADC0809 是 8 通道 8 位逐次逼近型模数转换器，启动一次转换约需 100μs，<code>EOC</code> 为转换结束信号；实验中只用 <code>IN0</code> 一路，端口地址为 <code>298H</code></p> <p>按转换结果的读取方式，本实验分为三种方法：延时法在启动转换后先执行一段延时程序，等转换结束后再读结果；查询法在启动转换后不断检测 <code>EOC</code> 的状态，转换一结束立即读结果；中断法则把 <code>EOC</code> 经中断控制器接到 CPU，转换结束时以中断方式通知 CPU 来取结果。前两种方法都要由 CPU 反复等待，第三种由硬件通知，效率最高</p> <p>延时法：</p> <img src="/assets/img/image-20230429234120661.99398030.png"> <p>查询法：按照下图进行连线，使用查询法检测 EOC 状态，编程采集 IN0 输入的电压，在屏幕上以 16 进制显示出转换后的数据</p> <img src="/assets/img/image-20230429234208060.9dc3179b.png"> <p>中断法：</p> <img src="/assets/img/image-20230429234321602.4121438b.png"> <h3 id="延时法实验"><a href="#延时法实验" class="header-anchor">#</a> 延时法实验</h3> <p>io4-1.asm</p> <div class="language-nasm line-numbers-mode"><pre class="language-nasm"><code>data segment
in0 equ <span class="token number">298h</span>
data ends
code segment
assume <span class="token register variable">cs</span>:code,<span class="token register variable">ds</span>:data
<span class="token label function">start:</span>
