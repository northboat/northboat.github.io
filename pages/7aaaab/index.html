> <li>表示层：编码解码、压缩</li> <li>应用层：界面面向用户，最复杂</li></ul> <p>层层向下步步封装</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="23.635ex" height="1.952ex" role="img" focusable="false" viewBox="0 -705 10446.8 862.8" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.357ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(751,0)"><path data-c="1D437" d="M287 628Q287 635 230 637Q207 637 200 638T193 647Q193 655 197 667T204 682Q206 683 403 683Q570 682 590 682T630 676Q702 659 752 597T803 431Q803 275 696 151T444 3L430 1L236 0H125H72Q48 0 41 2T33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM703 469Q703 507 692 537T666 584T629 613T590 629T555 636Q553 636 541 636T512 636T479 637H436Q392 637 386 627Q384 623 313 339T242 52Q242 48 253 48T330 47Q335 47 349 47T373 46Q499 46 581 128Q617 164 640 212T683 339T703 469Z" style="stroke-width:3;"></path></g><g data-mml-node="msub" transform="translate(1579,0)"><g data-mml-node="mi"><path data-c="1D448" d="M107 637Q73 637 71 641Q70 643 70 649Q70 673 机就像两栋独立的楼，无论你住在哪一层，要给另一栋楼递东西，都要经过下楼再上楼的过程，并且在计算机网络的楼中，只有同层次的住户才可以识别并接受各自的信息</p> <h3 id="奈奎斯特与香农定理"><a href="#奈奎斯特与香农定理" class="header-anchor">#</a> 奈奎斯特与香农定理</h3> <p>信源、信道和信宿</p> <p>波特（Baud）：指<strong>单位时间内信号变化次数</strong>（单位 Hz），在某些具体题目中，波特常常等同于<strong>采样频率</strong>和<strong>带宽</strong></p> <p>一个信号可能需要用多个比特来表示，如有三个信号 a、b、c，则需要用 0/1 串进行编码，如 01 表示 a，10 表示 b，11 表示 c</p> <p>很容易可以发现，n 个长度 0/1 串可以表示 2^n 种信号，设信号种类为 V，于是所需比特长度 n 为</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="9.953ex" height="2.034ex" role="img" focusable="false" viewBox="0 -694 4399.1 899" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.464ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(877.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1933.6,0)"><path data-c="1D459" d="M117 59Q117 26 142 26Q179 26 205 131Q211 151 215 152Q217 153 225 153H229Q238 153 241 153T246 151T248 144Q24 4Q287 635 234 637Z" style="stroke-width:3;"></path></g><rect width="1088" height="60" x="120" y="220"></rect></g><g data-mml-node="mo" transform="translate(9758.9,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msub><mi>R</mi><mrow data-mjx-texclass="ORD"><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mi>W</mi><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mfrac><mi>S</mi><mi>N</mi></mfrac><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><h3 id="编码与调制"><a href="#编码与调制" class="header-anchor">#</a> 编码与调制</h3> <p>数字信号和模拟信号：也叫数字数据和模拟数据，数字信号为离散的数据，入方波，模拟信号为连续的信息，如 sin 函数</p> <p>在物理信道上，分为数字信道和模拟信道，字面意思，数字信道传输数字信号，模拟信道传输模拟信号，将初始信号，<strong>转化为模拟信号</strong>的过程称作<strong>调制</strong>，<strong>转化为数字信号</strong>的过程称为<strong>编码</strong></p> <table><thead><tr><th>编码方法</th> <th></th></tr></thead> <tbody><tr><td>归零法</td> <td>高电平表示 1，低电平表示 0，在时钟转换之前归零</td></tr> <tr><td>非归零法</td> <td>高电平表示 1，低电平表示 0，不归零，额外用一根时钟线来同步时钟</td></tr> <tr><td>反向归零法</td> <td>根据前后时钟的电平变化表示 0/1，前后电平不变，当前为 1，前后电平改变，当前为 0</td></tr> <tr><td>曼彻斯特法</td> <td>将每个时钟分为前后两段，从高电平变为低电平为 1，从低电平变为高电平为 0</td></tr> <tr><td>差分曼彻斯特法</td> <td>在将时钟分为两段的同时，根据前后电平变化表示 0/1，若上一个时钟的后半段和当前时钟的前半段相同，则表示为 1，否则表示 0</td></tr></tbody></table> <img src="/assets/img/image-20230612003138467.b54d0bd7.png"> <p>注意在反向归零法和差分曼彻斯特法中，对于第一个时钟信号，由于没有前驱，所以仅通过第一个时钟信号（曼彻斯特为第一个时钟的前半段）的电平判断 0/1，若为高电平则为 1，否则为 0</p> <p>另外，以太网（网络层）的信号就是用的曼彻斯特编码，在这种编码下，两个电平变化才能表示一个 0/1 信息，即</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="8.241ex" height="4.588ex" role="img" focusable="false" viewBox="0 -1342 3642.6 2028" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-1.552ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(877.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mfrac" transform="translate(1933.6,0)"><g data-mml-node="mn" transform="translate(220,676)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transfo 示 0</td></tr> <tr><td>PSK</td> <td>用不同相位来表示 0/1</td></tr> <tr><td>QAM</td> <td>正交振幅调制</td></tr></tbody></table> <p>对于正交振幅调制，设振幅 m 种，相位 n 种，其比特率 R 和波特率 B 满足</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="15.394ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 6804.1 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D445" d="M230 637Q203 637 198 638T193 649Q193 676 204 682Q206 683 378 683Q550 682 564 680Q620 672 658 652T712 606T733 563T739 529Q739 484 710 445T643 385T576 351T538 338L545 333Q612 295 612 223Q612 212 607 162T602 80V71Q602 53 603 43T614 25T640 16Q668 16 686 38T712 85Q717 99 720 102T735 105Q755 105 755 93Q755 75 731 36Q693 -21 641 -21H632Q571 -21 531 4T487 82Q487 109 502 166T517 239Q517 290 474 313Q459 320 449 321T378 323H309L277 193Q244 61 244 59Q244 55 245 54T252 50T269 48T302 46H333Q339 38 339 37T336 19Q332 6 326 0H311Q275 2 180 2Q146 2 117 2T71 2T50 1Q33 1 33 10Q33 12 36 24Q41 43 46 45Q50 46 61 46H67Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628Q287 635 230 637ZM630 554Q630 586 609 608T523 636Q521 636 500 636T462 637H440Q393 637 386 627Q385 624 352 494T319 361Q319 360 388 360Q466 361 492 367Q556 377 592 426Q608 449 619 486T630 554Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(1036.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(2092.6,0)"><path data-c="1D435" d="M231 637Q204 637 199 638T194 649Q194 676 205 682Q206 683 335 683Q594 683 608 681Q671 4H91Q101 -167 151 -167Q189 -167 211 -155Q234 -144 254 -122T282 -75Q288 -56 298 -13Q311 35 311 43ZM384 328L380 339Q377 350 375 354T369 368T359 382T346 393T328 402T306 405Q262 405 221 352Q191 313 171 233T151 117Q151 38 213 38Q269 38 323 108L331 118L384 328Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(510,-150) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(4548.1,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(4937.1,0)"><path data-c="1D45A" d="M21 287Q22 293 24 303T36 341T56 388T88 425T132 442T175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q303 442 384 442Q401 442 415 440T441 433T460 423T475 411T485 398T493 385T497 373T500 364T502 357L510 367Q573 442 659 442Q713 442 746 415T780 336Q780 285 742 178T704 50Q705 36 709 31T724 26Q752 26 776 56T815 138Q818 149 821 151T837 153Q857 153 857 145Q857 144 853 130Q845 101 831 73T785 17T716 -10Q669 -10 648 17T627 73Q627 92 663 193T700 345Q700 404 656 404H651Q565 404 506 303L499 291L466 157Q433 26 428 16Q415 -11 385 -11Q372 -11 364 -4T353 8T350 18Q350 29 384 161L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 181Q151 335 151 342Q154 357 154 369Q154 405 129 405Q107 405 92 377T69 316T57 280Q55 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(5815.1,0)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(6415.1,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>R</mi><mo>=</mo><mi>B</mi><mi>l</mi><mi>o</mi><msub><mi>g</mi><mn>2</mn></msub><mo stretchy="false">(</mo><mi>m</mi><mi>n</mi><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>编码脉冲调制（PCM）：采样 - 量化 - 编码，将模拟数据编码为数字信号（方波），其中采样频率必须大于带宽的两倍才能采集完整（奈奎斯特定理）</p> <p>频分服用调制（FDM）：将模拟数据调制为模拟信号</p> <p>基带传输、频带传输和宽带传输</p> <table><thead><tr><th>基带传输</th> <th>频带传输</th> <th>宽带传输</th></tr></thead> <tbody><tr><td>传输数字信号，一般用于局域网</td> <td>传输模拟信号，一般用于长距离传输</td> <td>多路频带传输</td></tr></tbody></table> <h3 id="交换技术"><a href="#交换技术" class="header-anchor">#</a> 交换技术</h3> <table><thead><tr><th>交换技术</th> <th></th></tr></thead> <tbody><tr><td>电路交换</td> <td>电路直连，参考通电话</td></tr> <tr><td>报文交换</td> <td>一大段一大段发，再一大段一大段接收</td></tr> <tr><td>分组交换（网络层）</td> <td>分为数据报交换和虚电路交换，采用流水线工作方式，直接提升了报文交换的的传输速率</td></tr></tbody></table> <p>复习一下：网络层的数据单位为分组，链路层为帧，物理层为比特，传输层为报文</p> <p>数据报分组交换（UDP）：邮件发送，不同分组通过不同结点任一通路传输，不保证有序性（不可靠）</p> <p>虚电路分组交换（TCP）：语音通话、语音信息，通过虚电路标识符（VCID）在网络中同一路径传输，可靠的（保证分组有序到达），面向连接的</p> <p>都说了虚电路其实就是一个 TCP 连接，自然需要经过建立连接（三次握手）、数据传输和连接释放（四次挥手）三步骤</p> <h3 id="传输介质"><a href="#传输介质" class="header-anchor">#</a> 传输介质</h3> <table><thead><tr><th>传输介质</th> <th></th></tr></thead> <tbody><tr><td>双绞线</td> <td>两根独立的绞合铜线，外加包皮，传递电信号</td></tr> <tr><td>同轴电缆</td> <td>内导体（铜制）加多层包皮，传递电信号</td></tr> <tr><td>光纤</td> <td>分为单模光纤和多模光纤，传递光波信号</td></tr> <tr><td>无线介质</td> <td>有无线电波（移动热点）、 微波、红外线和激光</td></tr></tbody></table> <p>传输速率：光纤 &gt; 同轴电缆 &gt; 双绞线</p> <p>这和传播物理介质息息相关，显然光的传播速度大于电，而对于同样用电传播的双绞线和同轴电缆，后者的铜芯更大，于是速度更快</p> <p>传输距离：光纤 &gt; 同轴电缆 ≈ 双绞线</p> <p>光更适合远距离传播（主要原因是传播过程中抗干扰能力远大于电，不需要额外维护），用光纤做远距离传播介质更加实惠经济，用电传播的双绞线和同轴电缆在进行远距离传播时，需要借用物理层设备如放大器或中继器用以恢复信号特征</p> <p>传输介质，又被称作计算机网络的第 0 层，他和物理层的主要区别就是，物理层能够通过规定电气特性的功能识别信号中的有效信息，即 0 和 1，从单纯的波信号升级为所谓的比特流</p> <h3 id="物理层设备"><a href="#物理层设备" class="header-anchor">#</a> 物理层设备</h3> <table><thead><tr><th>物理层设备</th> <th></th></tr></thead> <tbody><tr><td>放大器、转发器</td> <td>用以放大模拟信号</td></tr> <tr><td>中继器</td> <td>用以重整数字信号并转发，不能无限中继，必须满足 5-4-3 原则）</td></tr> <tr><td>集线器（Hub）</td> <td>具有多个端口的中继器集合</td></tr></tbody></table> <p>注意所有物理层设备都只认物理端口，即插拔的那个现实端口，通过不同端口进行转发，同时无法进行任何形式上的路由选择，只死认端口</p> <p>物理层接口的特性：电气特性；机械特性；功能特性；过程特性</p> <p>电气：特指电压、电流大小范围</p> <p>机械：指摸得着的特征，如有几个引脚，几个插口</p> <p>功能：指电压对应的逻辑信息，如 10-15V 对应信号 1</p> <p>过程：指传输过程中的时序，各种事件的出现顺序</p> <h2 id="数据链路层"><a href="#数据链路层" class="header-anchor">#</a> 数据链路层</h2> <p>链路是一条<strong>逻辑信道</strong>，建立在物理信道之上，并不是物理存在的通路，网络层和更上层的连接也一样，所谓主机到主机的连接或者是端口到端口的连接，都是一种逻辑连接，在物理层之上通过各种协议封装而成，最终数据都是以比特流的形式通过物理信道传输，这是要明确的</p> <h3 id="链路层概述"><a href="#链路层概述" class="header-anchor">#</a> 链路层概述</h3> <p>为网络层提供服务：其基本功能就是把网络层的数据（分组）从源机器传输到目的机器的网络层</p> <p>链路管理：链路层可以提供面向连接的可靠的服务，在这样的服务中链路管理是必须的</p> <p>界定帧、帧同步和透明传输：通过封装比特流的头部和尾部将一个个帧分隔；接收方要给予某种反馈来实现帧传输的同步</p> <p>流量控制：针对发送方的控制，防止发的太多导致接收方带宽不够接收出错</p> <p>差错控制：出错了怎么办，ARQ 法，采用 CRC 冗余校验和 ARQ 自动重传请求，确认帧是否被正确接收，并保证每个帧最终都能有且只能有一次正确的接收</p> <h3 id="组帧及帧的界定"><a href="#组帧及帧的界定" class="header-anchor">#</a> 组帧及帧的界定</h3> <blockquote><p>帧需要实现帧界定、透明传输、可靠传输等功能</p></blockquote> <p>帧的界定：帧需要首尾来界定，因为这是封装的第一层，封装的对象是比特流，需要首尾共同截取一段比特流来组成帧</p> <table><thead><tr><th>界定帧的方法</th> <th></th></tr></thead> <tbody><tr><td>字符计数法</td> <td>在首部用一个计数段来表示当前帧的长度，如 21354322 则表示三个帧 21、354、322，显然若计数段出错数据将发生毁灭性的错误</td></tr> <tr><td>首尾字符串定界法</td> <td>采用固定的字符 SOH / ETO 表示帧的开始和结束，同时用转义字符 ESC 来表示数据段中的 SOH 和 ETO 串</td></tr> <tr><td>首尾比特串定界法</td> <td>用 01111110 表示首尾，数据段每碰到五个连续的 1，追加一个 0，接收方再去掉数据段每五个连续的 1 之后的 0 得到源数据</td></tr> <tr><td>违规编码法</td> <td>适用于曼彻斯特编码，因为在这种编码中，每一个码元，高电平到低电平表 1，低电平到高电平表 0，高到高和低到低不存在（违规），于是很巧妙地用这种违规的码元来界定帧地开始和结束</td></tr></tbody></table> <p>举个栗子</p> <img src="/assets/img/image-20230614011548265.521fa416.png"> <img src="/assets/img/image-20230614011609030.b1fc7a6b.png"> <p>信息段对界定方法的处理方式即为透明传输（信息段除了是一串二进制数之外没有任何含义，需要向上拆封识别）</p> <h3 id="差错控制"><a href="#差错控制" class="header-anchor">#</a> 差错控制</h3> <blockquote><p>比特差错控制：奇偶校验码、循环冗余码、海明码</p></blockquote> <p>差错（比特差错）：在比特流传输过程中，1 变为 0，0 变为 1，这样的错误叫做比特差错</p> <p>利用<strong>编码技术</strong>进行差错控制，编码分为两类</p> <ul><li>检错编码，自动重传请求 ARQ</li> <li>纠错编码，前向纠错 FEC</li></ul> <h4 id="奇偶校验码"><a href="#奇偶校验码" class="header-anchor">#</a> 奇偶校验码</h4> <p>校验的是帧中 1 的个数，只能检验出奇数个比特差错，当差错个数为偶数个时，无法检测</p> <p>奇校验指通过补一位比特使得帧中 1 个数为奇数，若接收帧中 1 个数为偶，说明出错；偶校验即补一位使帧中 1 个数为偶，若接收帧 1 个数为奇，则出错</p> <h4 id="循环冗余码"><a href="#循环冗余码" class="header-anchor">#</a> 循环冗余码</h4> <p>模 2 除法：最高位对齐（均为 1），余下位若相同，则余 0，若不同则余 1</p> <p>除数：即为发送方和接收方所商定的多项式，多项式和数的转化如下（就是系数是否存在的 0/1 串）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="20.402ex" height="2.203ex" role="img" focusable="false" viewBox="0 -891.7 9017.6 973.7" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.186ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(605,413) scale(0.707)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mo" transform="translate(1230.8,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z" style="stroke-width:3;"></path></g><g data-mml-node="msup" transform="translate(2231,0)"><g data-mml-node="mi"><path data 2" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(6517.6,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)" style="stroke-width:3;"></path><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" transform="translate(1000,0)" style="stroke-width:3;"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(1500,0)" style="stroke-width:3;"></path><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 x, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>n</mi><mo>+</mo><mi>k</mi><mo>≤</mo><msup><mn>2</mn><mi>k</mi></msup><mo>−</mo><mn>1</mn></math></mjx-assistive-mml></mjx-container><p>举一个 1010 的海明码编码过程原理示例</p> <img src="/assets/img/image-20230616210709439.1ad2803a.png"> <img src="/assets/img/image-20230616210803047.9836090c.png"> <img src="/assets/img/image-20230616210818942.8de99012.png"> <h2 id="流量控制与可靠传输"><a href="#流量控制与可靠传输" class="header-anchor">#</a> 流量控制与可靠传输</h2> <h3 id="流量控制-滑动窗口"><a href="#流量控制-滑动窗口" class="header-anchor">#</a> 流量控制 - 滑动窗口</h3> <p>在链路层，流量控制和可靠传输是交叉实现的，流量控制使用滑动窗口实现，可靠传输通过自动重传请求实现</p> <p>其中，滑动窗口根据发送/接收方窗口大小分为</p> <ul><li>停止 - 等待协议</li> <li>GBN 协议</li> <li>选择重传协议</li></ul> <p>自动重传请求中，常常分别有 GBN 自动重传请求和选择重选，这建立在连续 ARQ 滑动窗口流量控制的基础上（所以说是交叉实现的）</p> <table><thead><tr><th>流量控制</th> <th></th></tr></thead> <tbody><tr><td>停止 - 等待协议</td> <td>发送窗口 1，接收窗口 1</td></tr> <tr><td>Go Back N 协议</td> <td>发送窗口 n，接收窗口 1</td></tr> <tr><td>选择重传协议（SR）</td> <td>发送窗口 n，接收窗口 n</td></tr></tbody></table> <p>这里的窗口中的帧（窗口大小的单位为帧的个数）都是需要编号的，以保证发送帧的有序性和排错，所以需要 n 位比特位来对窗口进行编号</p> <p>n 位比特位，对于 GBN，可以对发送窗口中最多 k1 个帧进行编号，还剩一个需要对接收窗口（1 个）进行编号，其中</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="11.359ex" height="1.981ex" role="img" focusable="false" viewBox="0 -725.5 5020.8 875.5" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.339ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D458" d="M121 647Q121 657 125 670T 444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mi" transform="translate(1181,0)"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z" style="stroke-width:3;"></path></g></g><g data-mml-node="mi" transform="translate(838.5,-686)"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z" style="stroke-width:3;"></path></g><rect width="2141" height="60" x="120" y="220"></rect></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mrow><mi>L</mi><mrow data-mjx-texclass="ORD"><mo>/</mo></mrow><mi>C</mi></mrow><mi>T</mi></mfrac></math></mjx-assistive-mml></mjx-container><p>T 由这几个部分组成：发送时间 - 传输时间 - 确认帧发送时间 - 传输时间</p> <ul><li>其中发送时间和带宽有关</li> <li>传输时间和信道的传输速率有关</li></ul> <p>有时确认帧的发送时间可省略（确认帧很短，如停止等待协议只有一个比特），但两个传输时间是必须的</p> <p>几个栗子：请重复做，答案为 C、B、D</p> <img src="/assets/img/image-20230618203708828.98b7e017.png"> <h3 id="可靠传输-自动重传"><a href="#可靠传输-自动重传" class="header-anchor">#</a> 可靠传输 - 自动重传</h3> <p>建立在 GBN 和 SR 的基础上</p> <p>对于 GBN 协议，当接收方收到错误的帧时，将不会给发送方发送确认帧，发送方在该帧超时后，自动从该帧开始重发包括该帧之后的所有帧，以保证帧传输的有序性</p> <p>很多时候，GBN 并不会一个一个返回确认帧（浪费），可能传输了 0，1，2，3，4 四个帧之后，接收方返回一个确认帧，假设确认的是 3，则说明 3（包括 3）之前的帧都已经被正确接收</p> <p>对于 SR 协议，由于接收窗口大小为 n，其并不保证帧的有序到达，所有在返回处理发送错误的帧时，只会对没有确认的帧进行重发，而不会管已经确认过的帧</p> <h2 id="介质访问控制"><a href="#介质访问控制" class="header-anchor">#</a> 介质访问控制</h2> <p>就是如何在一条物理信道上划分不同独立的逻辑信道的方式方法</p> <h3 id="信道划分介质"><a href="#信道划分介质" class="header-anchor">#</a> 信道划分介质</h3> <p>逻辑划分物理信道</p> <table><thead><tr><th>信道划分</th> <th></th></tr></thead> <tbody><tr><td>FDM 频分多路复用</td> <td>不同频率上传输不同信号，如收音机</td></tr> <tr><td>TDM 时分多路复用</td> <td>时间片轮转算法</td></tr> <tr><td>WDM 波分多路复用</td> <td>将光波通过合波器整合传输再通过分波器分开读取，每中频率的光波代表一条信道</td></tr> <tr><td>CDM 码分多路复用</td> <td>通过正交编码向量区分不同信道的信号，CDMA 码分多址</td></tr></tbody></table> <p>时分复用 TDM 又分为</p> <ul><li>同步时分多路复用</li> <li>异步时分多路复用（又叫统计时分多路复用 STDM），<strong>其时间片分配是动态的</strong></li></ul> <p>频分复用 FDM 不能传输数字信号，所以在实际应用中 TDM 更广泛</p> <p>波分多路复用用于光纤信道</p> <img src="/assets/img/image-20230618203952677.ff9df4aa.png"> <p>CDMA（码分多址，码分复用）</p> <p>每个站点占据一个唯一的码片，假设站点 A 码片为 1101，则 C 接收的 A 信号中，1101 表示 1，码片反码 0010 表示 0</p> <ul><li>为了方便计算，码片中用 -1 等价于 0</li></ul> <p>多个站点传输信号时，各位置直接相加，如有</p> <table><thead><tr><th>站点</th> <th>码片</th></tr></thead> <tbody><tr><td>A</td> <td>1 1 -1 1</td></tr> <tr><td>B</td> <td>1 1 1 -1</td></tr></tbody></table> <p>码分多址中要求各站点码片正交</p> <p>当 C 受到 A、B 的复合信号 T = 0 0 -2 2，如何区分各站点的信号？做规格化内积（向量内积除以向量维度）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em  width="1478" height="60" x="120" y="220"></rect></g><g data-mml-node="mo" transform="translate(14766.4,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(15822.2,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(16600.2,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mrow><msub><mi>P</mi><mi>A</mi></msub><mo>⋅</mo><mi>T</mi></mrow><mrow><mi>d</mi><mi>i</mi><mi>m</mi><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mspace linebreak="newline"></mspace><mfrac><mrow><msub><mi>P</mi><mi>B</mi></msub><mo>⋅</mo><mi>T</mi></mrow><mrow><mi>d</mi><mi>i</mi><mi>m</mi><mo stretchy="false">(</mo><mi>T</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>−</mo><mn>4</mn></mrow><mn>4</mn></mfrac><mo>=</mo><mo>−</mo><mn>1</mn></math></mjx-assistive-mml></mjx-container><p>所以识别出 A 传输的信号为 1，B 传输的为 0</p> <h3 id="随机访问介质-争用式"><a href="#随机访问介质-争用式" class="header-anchor">#</a> 随机访问介质 - 争用式</h3> <p>不划分信道，所有信号通通传输，但需要避让和优先级判断，传输失败的信号自动重传，<strong>争用式的使用信道</strong></p> <p>涉及的协议：ALOHA ——&gt; 时隙 ALOHA ——&gt; CSMA ——&gt; CSMA-CD / CSMA-CA</p> <ul><li>从 ALOHA 到 CSMA 协议，加入了侦听</li> <li>从 CSMA 到 CSMA-CD 加入了碰撞检测，即在传输的同时检测碰撞是否发生</li> <li>从 CSMA 到 CSMA-CA 加入了碰撞避免，要求一个帧在传输过程中就要受到确认帧，否则认为发生碰撞，终止传输（最小帧）</li></ul> <p>注意，争用式的使用都无法完全避免冲突，即均有可能发生冲突</p> <p>在 ALOHA 协议中，一旦传输错误，则立即重发帧，无需等待，加入时隙后，只在每个时隙的开始进行重发，能够避免一些冲突</p> <p>CSMA 的三种类型</p> <ul><li>1-坚持：很执着，忙则一直侦听，空闲则立即发</li> <li>非坚持：很随意，忙则随机停一段时间，再侦听</li> <li>p-坚持：比较随意，忙则持续侦听（根据时隙），空闲则有 p 的概率发送帧</li></ul> <p>CSMA-CD：先听后发，边听边发，冲突停发，随机重发</p> <p>CSMA-CA：冲突避免，信道预约</p> <p>二进制指数退避算法，设重发次数为 k，基本退避时间为<strong>争用期 2τ</strong>，则选取</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="14.163ex" height="2.61ex" role="img" focusable="false" viewBox="0 -903.7 6260.1 1153.7" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(806.8,0)"><path data-c="2208" d="M84 250Q84 372 166 450T360 539Q361 539 377 539T419 540T469 540H568Q583 532 583 520Q583 511 570 501L466 500Q355 499 329 494Q one;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>t</mi><mo>=</mo><mi>a</mi><mo>×</mo><mn>2</mn><mi>τ</mi></math></mjx-assistive-mml></mjx-container><p>需要注意的是，我们认为，距离重传的时间越长，越不容易再次发生冲突</p> <p>CSMA-CA / CSMA-CD 的最小帧长度 L 为</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="11.364ex" height="1.731ex" role="img" focusable="false" viewBox="0 -683 5023 765" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.186ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88L243 52Q243 48 252 48T311 46H328Q360 46 379 47T428 54T478 72T522 106T564 161Q580 191 594 228T611 270Q616 273 628 273H641Q647 264 647 262T627 203T583 83T557 9Q555 4 553 3T537 0T494 -1Q483 -1 418 -1T294 0H116Q32 0 32 10Q32 17 34 24Q39 43 44 45Q48 46 59 46H65Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Q285 635 228 637Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(958.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(2014.6,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(2514.6,0)"><path data-c="1D70F" d="M39 284Q18 284 18 294Q18 301 45 338T99 398Q134 425 164 429Q170 431 332 431Q492 431 497 429Q517 424 517 402Q517 388 508 376T485 360Q479 358 389 358T299 356Q298 355 283 274T251 109T233 20Q228 5 215 -4T186 -13Q153 -13 153 20V30L203 192Q214 228 227 272T248 336L254 357Q254 358 208 358Q206 358 197 358T183 359Q105 359 61 295Q56 287 53 286T39 284Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(3253.8,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(4254,0)"><path data-c="1D449" d="M52 648Q52 670 65 683H76Q118 680 181 680Q299 680 320 683H330Q336 677 336 674T334 656Q329 641 325 637H304Q282 635 274 635Q245 630 242 620Q242 618 271 369T301 118L374 235Q447 352 520 471T595 594Q599 601 599 609Q599 633 555 637Q537 637 537 648Q537 649 539 661Q542 675 545 679T558 683Q560 683 570 683T604 682T668 681Q737 681 755 683H762Q769 676 769 672Q769 655 760 640Q757 637 743 637Q730 636 719 635T698 630T682 623T670 615T660 608T652 599T645 592L452 282Q272 -9 266 -16Q263 -18 259 -21L241 -22H234Q216 -22 216 -15Q213 -9 177 305Q139 623 138 626Q133 637 76 637H59Q52 642 52 648Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>L</mi><mo>=</mo><mn>2</mn><mi>τ</mi><mo>×</mo><mi>V</mi></math></mjx-assistive-mml></mjx-container><p>其中 V 为信道的传输速率，其实就是两个 t2，一来一回两个传输时延，也叫往返时延，但需要严重注意，二者要求最小帧的原因是不同的</p> <ul><li>CSMA-CD 为了保证能够在数据发送完毕之前检测到冲突，即在数据发送完前冲突信号要回传到发送点，当帧发送时间大于等于争用期时，无论发送的什么时间点发生冲突，都可以在发送完毕前收到冲突信号</li> <li>CSMA-CA 为了保证确认帧及时收到，即在数据发送完毕之前收到确认帧</li></ul> <p>CAMS-CA 的帧间间隔时间 IFS（InterFrame Space）</p> <ul><li>DIFS（最长），数据帧发送前需等待一个 DIFS</li> <li>PIFS</li> <li>SIFS，确认帧，控制帧发送后需等待一个 SIFS</li></ul> <p>CSMA-CA 和 CSMA-CD 的异同</p> <ul><li>CD 适用有连接局域网，CA 适用无线局域网</li> <li>二者均有确认帧和最小帧长限制</li></ul> <h3 id="轮询访问-令牌传输协议"><a href="#轮询访问-令牌传输协议" class="header-anchor">#</a> 轮询访问 - 令牌传输协议</h3> <p>常用于环形局域网，每个站点先拥有令牌，才可以进行帧的传输（此时单站<strong>独占</strong>所有带宽），且令牌的分配是<strong>动态</strong>的（这里可以参考动态时间片轮转算法）</p> <p>也就是说，每个站点获取令牌后并不一定能发送完自己的帧</p> <p>令牌传输（Token）非常适用于<strong>网络负载大</strong>的网络，因为令牌传输不存在冲突，而网络负载大造成的冲突可能会令争用式的代价非常之大</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/30, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/026c1d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">微机原理与接口技术</div></a> <a href="/pages/68132e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">局域网与网络路由</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
