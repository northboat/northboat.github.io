</h3> <p>就像打电话。客户程序发起通信，服务器程序被动等待，然后相应它的客户，二者共同构成应用程序</p> <p>使用 Sockets API 与其对应方建立通信的的一般形式决定该程序是充当客户还是服务器</p> <p>二者的区别还是很明显的，如打电话的一方（客户）需要知道被打电话一方（服务器）的手机号（地址），而被打电话的一方不需要，但在通信建立后，如果需要，也可以获取打电话一方的手机号。需要注意的是，一旦连接建立，服务器和客户之间的区别的就消失了</p> <ul><li>总结来说，客户与服务器的区别只在于谁建立初始连接和谁等待连接</li></ul> <p>服务器的端口分配遵循 IANA 的分配方式（Internet Assigned Number Authority，Internet编号授权委员会），如 80 分给 HTTP，443 分给 HTTPS，应答协议端口 7</p> <h3 id="sockets-套接字"><a href="#sockets-套接字" class="header-anchor">#</a> Sockets 套接字</h3> <p>套接字（Sockets），应用程序发送和接收数据的 API，它允许应用程序插入到网络中并与插入到同一个网络的其他应用程序进行通信</p> <p>套接字是一个抽象层，是一组 API，应用程序通过这组 API 在计算机端口上进行一系列数据交换</p> <ul><li>需要注意的是，一个应用程序可以连接多个套接字，多个应用程序也可以连接同一个套接字（很少但存在），即同时有一对一、一对多、多对一的连接模式存在</li></ul> <p>其过程基本为，机 A 通过套接字程序将信息写入套接字服务器 W，机 B 从套接字服务器 W 获取机 A 写入的数据</p> <p>套接字类型：流套接字（stream socket）和数据报套接字（datagram socket），分别对应 TCP 和 UDP 协议</p> <h2 id="tcp-套接字"><a href="#tcp-套接字" class="header-anchor">#</a> TCP 套接字</h2> <h3 id="ipv4-tcp-c-s"><a href="#ipv4-tcp-c-s" class="header-anchor">#</a> IPv4 TCP C/S</h3> <p>IPv4 TCP 客户端</p> <p><strong>Practical.h</strong></p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&quot;DieWithMessage.c&quot;</span></span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p><strong>DieWithMessage.c</strong></p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;stdio.h&gt;</span></span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="tcp-客户端"><a href="#tcp-客户端" class="header-anchor">#</a> TCP 客户端</h3> <p>通用指地址通用，什么是地址通用？如以上的 PrintSocketAddress() 函数就是一个 IPv4 和 IPv6 通用的代码，他会根据进入 socketaddr 的协议族判断其地址类型并作出相应反应</p> <p>接下来，我们将重写 TCP 协议下的 Socket 客户和服务器，使之地址通用，拥有自选共能</p> <p>TCPClientUtility.c</p> <ul><li>实现 SetupTCPClientSocket 方法，传入主机名（IP/域名）和服务（服务名/端口号），与之建立连接，返回建立好的 socket 套接字编号</li> <li>这里会持续搜索服务器端口直到建立连接或全部搜索完，失败将返回 -1</li></ul> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token keyword">int</span> <span class="token function">SetupTCPClientSocket</span><span class="token punctuation">(</span><span class="token keyword">const</span> <span class="token keyword">char</span> <span class="token operator">*</span>host<span class="token punctuation">,</span> <span class="token keyword">const</span> <span class="token keyword">char</span> <span class="token operator">*</span>service<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">struct</span> <span class="token class-name">addrinfo</span> addrCriteria<span class="token punctuation">;</span>
    <span class="token function">memset</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>addrCriteria<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token keyword">sizeof</span><span class="token punctuation">(</span>addrCriteria<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    addrCriteria<span class="token punctuation">.</span>ai_family <span class="token operator">=</span> AF_UNSPEC<span class="token punctuation">;</span>
    addrCriteria<span class="token punctuation">.</span>ai_socktype <span class="token operator">=</span> SOCK_STREAM<span class="token punctuation">;</span>
    addrCriteria<span class="token punctuation">.</span>ai_protocol <span class="token operator">=</span> IPPROTO_TCP<span class="token punctuation">;</span>

    <span class="token keyword">struct</span> <span class="token class-name">addrinfo</span> <span class="token operator">*</span>servAddr<span class="token punctuation">;</span>
    <span class="token keyword">int</span> rtnVal <span class="token operator">=</span> <span class="token function">getaddrinfo</span><span class="token punctuation">(</span>host<span class="token punctuation">,</span> service<span class="token punctuation">,</span> <span class="token operator">&amp;</span>addrCriteria<span class="token punctuation">,</span> <span class="token operator">&amp;</span>servAddr<span class="token punctuation">)</span><span class="token punctuation">;</span>

<ul><li>直到接收端收到数据为止，发送端的设备一直要参与传输。如果整个传输的延迟很长，那么对发送端的设备造成很大的浪费</li> <li>如果接收设备关机或故障，那么端到端传输不可能实现</li></ul></li></ul> <p>point to point：指的是发送端把数据传给与它直接相连的设备，这台设备在合适的时候又把数据传给与之直接相连的下一台设备，通过一台一台直接相连的设备，把数据传到接收端</p> <ul><li>优点
<ul><li>发送端设备送出数据后，它的任务已经完成，不需要参与整个传输过程，这样不会浪费发送端设备的资源</li> <li>即使接收端设备关机或故障，点到点传输也可以采用存储转发技术进行缓冲</li></ul></li> <li>缺点：发送端发出数据后，不知道接收端能否收到或何时能收到数据，比如 UDP</li></ul> <h3 id="udp-客户"><a href="#udp-客户" class="header-anchor">#</a> UDP 客户</h3> <p>UDPEchoClient.c</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;stdio.h&gt;</span></span>

    <span class="token comment">&lt;!--WebSocket--&gt;</span>

        <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-websocket<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>

<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependencies</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>配置单例，注入 bean</p> <p><strong>WebsocketConfig.java</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>

    <span class="token comment">/**

     * @return
     */</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">ServerEndpointExporter</span> <span class="token function">serverEndpointExporter</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">ServerEndpointExporter</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>服务器实现</p> <p>WebSocketServer.java</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token annotation punctuation">@Service</span>
<span class="token annotation punctuation">@ServerEndpoint</span><span class="token punctuation">(</span><span class="token string">&quot;/chat/{sid}&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">WebSocketServer</span> <span class="token punctuation">{</span>
    <span class="token comment">//静态变量，用来记录当前在线连接数。应该把它设计成线程安全的。</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">int</span> onlineCount <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
    <span class="token comment">//concurrent包的线程安全Set，用来存放每个客户端对应的MyWebSocket对象。</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">CopyOnWriteArraySet</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">WebSocketServer</span><span class="token punctuation">&gt;</span></span> webSocketSet <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CopyOnWriteArraySet</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">WebSocketServer</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">//与某个客户端的连接会话，需要通过它来给客户端发送数据</span>
    <span class="token keyword">private</span> <span class="token class-name">Session</span> session<span class="token punctuation">;</span>

    <span class="token comment">//接收sid</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> sid <span class="token operator">=</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/**
     * 连接建立成功调用的方法
     */</span>
    <span class="token annotation punctuation">@OnOpen</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">onOpen</span><span class="token punctuation">(</span><span class="token class-name">Session</span> session<span class="token punctuation">,</span> <span class="token annotation punctuation">@PathParam</span><span class="token punctuation">(</span><span class="token string">&quot;sid&quot;</span><span class="token punctuation">)</span> <span class="token class-name">String</span> sid<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>session <span class="token operator">=</span> session<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>sid <span class="token operator">=</span> sid<span class="token punctuation">;</span>
        webSocketSet<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>     <span class="token comment">//加入set中</span>
        <span class="token function">addOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>           <span class="token comment">//在线数加1</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token function">sendMessage</span><span class="token punctuation">(</span><span class="token string">&quot;Connection Test Message&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;有新窗口开始监听:&quot;</span> <span class="token operator">+</span> sid <span class="token operator">+</span> <span class="token string">&quot;, 当前总共在线人数为:&quot;</span> <span class="token operator">+</span> <span class="token function">getOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">IOException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;websocket IO Exception&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * 连接关闭调用的方法
     */</span>
    <span class="token annotation punctuation">@OnClose</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">onClose</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        webSocketSet<span class="token punctuation">.</span><span class="token function">remove</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">//从set中删除</span>
        <span class="token function">subOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>           <span class="token comment">//在线数减1</span>
        <span class="token comment">//断开连接情况下，更新主板占用情况为释放</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;释放的sid为：&quot;</span> <span class="token operator">+</span> sid<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//这里写你 释放的时候，要处理的业务</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;有一连接关闭！当前在线人数为&quot;</span> <span class="token operator">+</span> <span class="token function">getOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**

    <span class="token comment">// 全双工通信，服务器接收到客户端的消息后进行处理，可以是分发，可以是其他</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="ws-js-客户端"><a href="#ws-js-客户端" class="header-anchor">#</a> WS JS 客户端</h3> <p>全双工通信</p> <ul><li>客户端可以主动向服务器发送信息，即前端调用 <code>WebSocket.send()</code> 函数</li> <li>后端编写的 WebSocketServer 将处理接收到的客户端信息，通过 set 中存储的一个个 session，将收到的消息根据 sid 群发出去，客户端由于 session 和 websocket 的工作机制，将时刻监听这个消息，同时在前端作出相应反应</li></ul> <p>前端代码示例</p> <div class="language-javascript line-numbers-mode"><pre class="language-javascript"><code><span class="token operator">&lt;</span>h2 <span class="token keyword">class</span><span class="token operator">=</span><span class="token string">&quot;major&quot;</span><span class="token operator">&gt;</span>共有<span class="token operator">&lt;</span>strong th<span class="token operator">:</span>text<span class="token operator">=</span><span class="token string">&quot;${count}&quot;</span><span class="token operator">&gt;</span><span class="token operator">&lt;</span><span class="token operator">/</span>strong<span class="token operator">&gt;</span>人在公共聊天室<span class="token operator">&lt;</span><span class="token operator">/</span>h2<span class="token operator">&gt;</span>

<span class="token operator">&lt;</span>p id<span class="token operator">=</span><span class="token string">&quot;user&quot;</span> <span class="token literal-property property">th</span><span class="token operator">:</span>text<span class="token operator">=</span><span class="token string">&quot;${name}&quot;</span> style<span class="token operator">=</span><span class="token string">&quot;display: none&quot;</span><span class="token operator">&gt;</span><span class="token operator">&lt;</span><span class="token operator">/</span>p<span class="token operator">&gt;</span>
<span class="token operator">&lt;</span>p id<span class="token operator">=</span><span class="token string">&quot;login&quot;</span> <span class="token literal-property property">th</span><span class="token operator">:</span>text<span class="token operator">=</span><span class="token string">&quot;${login}&quot;</span> style<span class="token operator">=</span><span class="token string">&quot;display: none&quot;</span><span class="token operator">&gt;</span><span class="token operator">&lt;</span><span class="token operator">/</span>p<span class="token operator">&gt;</span>
<span class="token operator">&lt;</span>p id<span class="token operator">=</span><span class="token string">&quot;room&quot;</span> <span class="token literal-property property">th</span><span class="token operator">:</span>text<span class="token operator">=</span><span class="token string">&quot;${room}&quot;</span> style<span class="token operator">=</span><span class="token string">&quot;display: none&quot;</span><span class="token operator">&gt;</span><span class="token operator">&lt;</span><span class="token operator">/</span>p<span class="token operator">&gt;</span>
<span class="token operator">&lt;</span>script<span class="token operator">&gt;</span>
    <span class="token keyword">let</span> user <span class="token operator">=</span> document<span class="token punctuation">.</span><span class="token function">getElementById</span><span class="token punctuation">(</span><span class="token string">&quot;user&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>innerText<span class="token punctuation">;</span>

    <span class="token comment">//连接发生错误的回调方法</span>

    <span class="token comment">//连接关闭的回调方法</span>
