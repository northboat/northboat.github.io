</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>在配置文件<code>_config.yml</code>中如果仓库写错了，在部署时将报错10054</p> <p>配合 netlify 搭建博客，将源文件传在 github 上，在 netlify 中导入仓库建站</p> <h3 id="主题美化"><a href="#主题美化" class="header-anchor">#</a> 主题美化</h3> <p>查看各主题官方文档教程</p> <ul><li><a href="https://butterfly.js.org/" target="_blank" rel="nofollow noopener noreferrer">hexo butterfly<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://fluid-dev.github.io/hexo-fluid-docs/start/" target="_blank" rel="nofollow noopener noreferrer">hexo fluid<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>_config.yml：自动更新所有依赖</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> <span class="token function">install</span> <span class="token parameter variable">-g</span> npm-check-updates

0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h5 id="配色"><a href="#配色" class="header-anchor">#</a> 配色</h5> <p>修改主题颜色：默认主题为绿色</p> <p>在<code>.vurepess</code>目录下新建<code>styles</code>目录，新建文件<code>palette.styl</code>，reco 将自动识别并渲染进网页</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token selector">// 默认值

$backgroundColor = #ffffff                  // 悬浮块背景色



//示例修改相关样式f12找到需要修改的地方找到对应class类拿过来直接用就行了
.sidebar-group.is-sub-group &gt; .sidebar-heading:not(.clickable)</span><span class="token punctuation">{</span>
  <span class="token property">opacity</span><span class="token punctuation">:</span> 1
<span class="token punctuation">}</span>

<span class="token selector">.navbar &gt; .links</span><span class="token punctuation">{</span>
  <span class="token property">background</span><span class="token punctuation">:</span> #FFC8B4
<span class="token punctuation">}</span>

<span class="token selector">.navbar</span><span class="token punctuation">{</span>
  <span class="token property">background</span><span class="token punctuation">:</span> #FFC8B4
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>在这个文件夹下所有的<code>.styl</code>都将被识别，在里面可以编写自己的<code>css</code>代码对博客进行个性化定制，所需标签的名字可以在网页中选择并查看</p> <p>我这里是将主题颜色设置为蓝紫色，将导航栏设置为粉橙色</p> <h5 id="侧边栏"><a href="#侧边栏" class="header-anchor">#</a> 侧边栏</h5> <p>在<code>config.js</code>中配置这一行，博客右侧将根据markdown的标题自动生成子侧边栏</p> <div class="language-js line-numbers-mode"><pre class="language-js"><code><span class="token string-property property">&quot;themeConfig&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h4 id="vdoing"><a href="#vdoing" class="header-anchor">#</a> Vdoing</h4> <h5 id="数学公式"><a href="#数学公式" class="header-anchor">#</a> 数学公式</h5> <p>安装依赖</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> i markdown-it-mathjax3 <span class="token parameter variable">-D</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>修改 config.js</p> <div class="language-js line-numbers-mode"><pre class="language-js"><code>module<span class="token punctuation">.</span>exports <span class="token operator">=</span> <span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><h5 id="音乐播放器"><a href="#音乐播放器" class="header-anchor">#</a> 音乐播放器</h5> <blockquote><p>@vuepress-reco/vuepress-plugin-bgm-player</p></blockquote> <p>沿用之前 reco 的播放器，简单，适配性好</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> <span class="token function">install</span> @vuepress-reco/vuepress-plugin-bgm-player <span class="token parameter variable">-D</span>

<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br></div></div><h5 id="首页大图"><a href="#首页大图" class="header-anchor">#</a> 首页大图</h5> <p><a href="https://notes.youngkbt.cn/about/website/index-big-img/" target="_blank" rel="nofollow noopener noreferrer">参考文献<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>在<code>.vuepress/compoents</code>目录下创建首页 Vue 文件<code>IndexBigImg.vue</code>，然后在表示首页的 md 文件<code>index.md</code>中注入</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>ClientOnly</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>IndexBigImg</span> <span class="token punctuation">/&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>ClientOnly</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>另外要注释掉<code>index.md</code>中首页图片<code>bannerBg</code>的配置</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code>pageClass: vdoing-index-class
<span class="token title important"><span class="token punctuation">#</span> bannerBg: /img/bg.jpg</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>首页图片在<code>config.ts</code>中配置</p> <div class="language-ts line-numbers-mode"><pre class="language-ts"><code>themeConfig<span class="token operator">:</span> <span class="token punctuation">{</span>	
    bodyBgImg<span class="token operator">:</span> <span class="token comment">// 你的图片路径(必须位于 public 下)，可以是 URL</span>
    <span class="token punctuation">[</span>	
        <span class="token string">&quot;/img/bg.png&quot;</span><span class="token punctuation">,</span>
        <span class="token comment">// &quot;/img/timebomb.png&quot;,</span>
        <span class="token comment">// &quot;/img/titan.jpg&quot;,</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>另外还有<code>indexImg</code>的配置，也在<code>themeConfig</code>中</p> <div class="language-ts line-numbers-mode"><pre class="language-ts"><code>themeConfig<span class="token operator">:</span> <span class="token punctuation">{</span>	
    indexImg<span class="token operator">:</span> <span class="token punctuation">{</span>
        navColor<span class="token operator">:</span> <span class="token number">2</span><span class="token punctuation">,</span>    <span class="token comment">// 导航栏左侧名字、中间搜索框、右侧字体的颜色，1 是黑色，2 是白色。默认是 1</span>
            switchNavColor<span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>    <span class="token comment">// 页面移出大图片的位置后，navColor 是否变换，如由白色变黑色，黑色变白色。默认是 false</span>
                <span class="token comment">// 因为本主题的默认背景色偏向白色，如果 navColor 是 2，建议需要开启(true)，否则白背景 + 白字体 = 看不见</span>
                bgTimeColor<span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>     <span class="token comment">// 是否开启图片的背景色随一天的不同时间而变化，并且开启时间窗口提示，默认是 false。时间分为四种：白天（原图）、黄昏（偏黄）、晚上（偏黑）、深夜（偏深黑）</span>
                    bgTimeColorArray<span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">'transparent'</span><span class="token punctuation">,</span> <span class="token string">'rgba(255, 148, 48, .2)'</span><span class="token punctuation">,</span> <span class="token string">'rgba(0, 0, 0, .3)'</span><span class="token punctuation">,</span> <span class="token string">'rgba(0, 0, 0, .5)'</span><span class="token punctuation">]</span><span class="token punctuation">,</span>   <span class="token comment">// 第一个是白天的颜色（默认原图），第二个是黄昏的颜色，第三个是晚上的颜色，第四个是深夜的颜色。bgTimeColor 为 true 生效。提示：如果不想要这个效果，但是又想要时间窗口提示效果，则改为 ['transparent', 'transparent', 'transparent', 'transparent']</span>
                        descFade<span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>   <span class="token comment">// 是否开启图片中间描述的淡入效果，默认为 false</span>
                            desc<span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">&quot;Web前端技术博客，积跬步以至千里，致敬每个爱学习的你 —— 来自 Evan Xu&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;故事由我书写，旅程由你见证，传奇由她聆听 —— 来自 Young Kbt&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;这一生波澜壮阔或是不惊都没问题 —— 来自 Weibw&quot;</span><span class="token punctuation">]</span><span class="token punctuation">,</span>  <span class="token comment">// 多个描述，如果填写则覆盖 config.js 的 description，不填写默认读取 config.js 的 description，descFade 为 true 生效</span>
                                descFontSize<span class="token operator">:</span> <span class="token string">'1.4rem'</span><span class="token punctuation">,</span>   <span class="token comment">// desc 的字体大小，默认 1.4rem。提示：原主题是 1.1rem</span>
                                    descFadeInTime<span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>  <span class="token comment">// 描述的淡入效果持续时间，descFade 为 true 生效，默认 200 毫秒</span>
                                        descFadeOutTime<span class="token operator">:</span> <span class="token number">100</span><span class="token punctuation">,</span>  <span class="token comment">// 描述的淡出效果持续时间，descFade 为 true 生效，默认 100 毫秒</span>
                                            descNextTime<span class="token operator">:</span> <span class="token number">800</span><span class="token punctuation">,</span>  <span class="token comment">// 当存在多个 desc 时，一个 desc 展示完后或准备开始时，多少秒后出现下一个 desc，默认 800 毫秒</span>
                                                bubble<span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>    <span class="token comment">// 是否开启图片的气泡效果，默认为 false</span>
                                                    bubblePosition<span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>  <span class="token comment">// 气泡效果的位置，范围：0-100，不同数值代表不同的起始位置，0是整个图片，50是半张图（一半的下方）。bubble 为 true 生效。默认是 0</span>
                                                        bubbleNum<span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>   <span class="token comment">// 气泡的个数，bubble 为 true 生效，默认 200 个</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><h5 id="代码块标号对齐"><a href="#代码块标号对齐" class="header-anchor">#</a> 代码块标号对齐</h5> <p>我发现代码块会出现行号和实际行数对不上的问题，大约每 30 行行号会多出一行，甚至于当多出的行过多，行号（数字）将超出代码块，极其不美观</p> <p>我试图在 palette.styl 中修改行高，固定代码高度和行号高度</p> <div class="language-stylus line-numbers-mode"><pre class="language-stylus"><code><span class="token selector"><span class="token comment">// 代码块行号和实际行数对不齐（即使固定成一样），只好用 bug 修复 bug</span>
<span class="token comment">/* 保证代码行高固定 */</span>
div[class*=&quot;language-&quot;] pre[class*=&quot;language-&quot;] <span class="token punctuation">{</span></span>
  <span class="token property-declaration"><span class="token property">line-height</span><span class="token punctuation">:</span> <span class="token number">24</span><span class="token unit">px</span> <span class="token important">!important</span><span class="token punctuation">;</span></span>
  <span class="token property-declaration"><span class="token property">white-space</span><span class="token punctuation">:</span> pre <span class="token important">!important</span><span class="token punctuation">;</span></span>
  <span class="token property-declaration"><span class="token property">overflow-x</span><span class="token punctuation">:</span> auto<span class="token punctuation">;</span></span>
<span class="token punctuation">}</span>

<span class="token selector"><span class="token comment">/* 保证行号行高一致 */</span>
div[class*=&quot;language-&quot;].line-numbers .line-numbers-rows &gt; span <span class="token punctuation">{</span></span>
  <span class="token property-declaration"><span class="token property">font-size</span><span class="token punctuation">:</span> <span class="token number">14</span><span class="token unit">px</span><span class="token punctuation">;</span>        <span class="token comment">/* 举例：14px 等宽字体 */</span></span>
  <span class="token property-declaration"><span class="token property">line-height</span><span class="token punctuation">:</span> <span class="token number">24</span><span class="token unit">px</span><span class="token punctuation">;</span>      <span class="token comment">/* 用整数像素，不用 1.5/1.6 这种带小数的 em */</span></span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>我听从了 ChatGPT 的建议，采用整数 px 而不用 1.5em，防止四舍五入的问题，但是还是不行，还是对不上，但是多出来的变了，即代码比行的标号要多</p> <p>然后我采取用 bug 解决 bug 的办法：不是高度高了吗，那我减少一点不就完事了，于是我手动把代码的高度调低一点</p> <div class="language-stylus line-numbers-mode"><pre class="language-stylus"><code><span class="token selector">div[class*=&quot;language-&quot;] pre[class*=&quot;language-&quot;] <span class="token punctuation">{</span></span>
  <span class="token property-declaration"><span class="token property">line-height</span><span class="token punctuation">:</span> <span class="token number">23.043</span><span class="token unit">px</span> <span class="token important">!important</span><span class="token punctuation">;</span></span>
  <span class="token property-declaration"><span class="token property">white-space</span><span class="token punctuation">:</span> pre <span class="token important">!important</span><span class="token punctuation">;</span></span>
  <span class="token property-declaration"><span class="token property">overflow-x</span><span class="token punctuation">:</span> auto<span class="token punctuation">;</span></span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>让他“刚好”对齐，基本上 500 行不会出现肉眼误差，唉，能跑就行</p> <h2 id="slidev-ppt"><a href="#slidev-ppt" class="header-anchor">#</a> Slidev PPT</h2> <p>Slidev 是可以让我们用 Markdown 写 PPT 的一个工具库，基于 Node.js、Vue.js</p> <ul><li><a href="https://sli.dev/" target="_blank" rel="nofollow noopener noreferrer">官方主页<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/slidevjs/slidev" target="_blank" rel="nofollow noopener noreferrer">GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="slidev-基础"><a href="#slidev-基础" class="header-anchor">#</a> Slidev 基础</h3> <h4 id="安装启动"><a href="#安装启动" class="header-anchor">#</a> 安装启动</h4> <p>要求<code>nodejs</code>环境，初始化仓库</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> init slidev
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动与构建</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">npm</span> run dev
<span class="token function">npm</span> run build
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>slidev 将渲染 slides.md 为一个 PPT 并展示在本地端口 3000</p> <h4 id="快捷键"><a href="#快捷键" class="header-anchor">#</a> 快捷键</h4> <p><a href="https://sli.dev/guide/navigation.html" target="_blank" rel="nofollow noopener noreferrer">操作文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>f：切换全屏</li> <li>right / space：下一动画或幻灯片</li> <li>left：上一动画或幻灯片</li> <li>up：上一张幻灯片</li> <li>down：下一张幻灯片</li> <li>o：切换幻灯片总览</li> <li>d：切换暗黑模式</li> <li>g：显示“前往...”</li></ul> <h4 id="页面设置"><a href="#页面设置" class="header-anchor">#</a> 页面设置</h4> <p>每一页以前可以通过内置的一些关键字，设置这一页的样式</p> <ul><li>比如第一页设置了 theme 为 default，background 是 unsplash 提供的随机的一张图，文本居中等等</li></ul> <p>可以直接在 markdown 中插入 web 组件以达到更高的自定义程度</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code><span class="token front-matter-block"><span class="token punctuation">---</span>
<span class="token front-matter yaml language-yaml"><span class="token comment"># try also 'default' to start simple</span>
<span class="token key atrule">theme</span><span class="token punctuation">:</span> default
<span class="token comment"># random image from a curated Unsplash collection by Anthony</span>
<span class="token comment"># like them? see https://unsplash.com/collections/94734566/slidev</span>
<span class="token key atrule">background</span><span class="token punctuation">:</span> https<span class="token punctuation">:</span>//source.unsplash.com/collection/94734566/1920x1080
<span class="token comment"># apply any windi css classes to the current slide</span>
<span class="token key atrule">class</span><span class="token punctuation">:</span> <span class="token string">'text-center'</span>
<span class="token comment"># https://sli.dev/custom/highlighters.html</span>
<span class="token key atrule">highlighter</span><span class="token punctuation">:</span> shiki</span>

<span class="token punctuation">---</span></span>

<span class="token title important"><span class="token punctuation">#</span> Welcome to Slidev</span>

Presentation slides for developers

<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>div</span> <span class="token attr-name">class</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>pt-12<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span>
  <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>span</span> <span class="token attr-name">@click</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>$slidev.nav.next<span class="token punctuation">&quot;</span></span> <span class="token attr-name">class</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>px-2 p-1 rounded cursor-pointer<span class="token punctuation">&quot;</span></span> <span class="token attr-name">hover</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>bg-white bg-opacity-10<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span>
    Press Space for next page <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span><span class="token namespace">carbon:</span>arrow-right</span> <span class="token attr-name">class</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>inline<span class="token punctuation">&quot;</span></span><span class="token punctuation">/&gt;</span></span>
  <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>span</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>div</span><span class="token punctuation">&gt;</span></span>

<span class="token hr punctuation">---</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><h4 id="自定义-css"><a href="#自定义-css" class="header-anchor">#</a> 自定义 CSS</h4> <p>可以用 css 自定义当前页的样式，但有点费劲</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code><span class="token front-matter-block"><span class="token punctuation">---</span>

<span class="token front-matter yaml language-yaml"><span class="token comment"># What is Slidev?</span>

Slidev is a slides maker and presenter designed for developers<span class="token punctuation">,</span> consist of the following features


&lt;style<span class="token punctuation">&gt;</span>
h1 <span class="token punctuation">{</span>
  <span class="token key atrule">background-color</span><span class="token punctuation">:</span> <span class="token comment">#2B90B6;</span>
  <span class="token key atrule">background-image</span><span class="token punctuation">:</span> linear<span class="token punctuation">-</span>gradient(45deg<span class="token punctuation">,</span> <span class="token comment">#4EC5D4 10%, #146b8c 20%);</span>
  <span class="token key atrule">background-size</span><span class="token punctuation">:</span> 100%;
  <span class="token key atrule">-webkit-background-clip</span><span class="token punctuation">:</span> text;
  <span class="token key atrule">-moz-background-clip</span><span class="token punctuation">:</span> text;
  <span class="token key atrule">-webkit-text-fill-color</span><span class="token punctuation">:</span> transparent;
  <span class="token key atrule">-moz-text-fill-color</span><span class="token punctuation">:</span> transparent;
<span class="token punctuation">}</span>
&lt;/style<span class="token punctuation">&gt;</span></span>

<span class="token punctuation">---</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p><a href="https://sli.dev/themes/gallery.html" target="_blank" rel="nofollow noopener noreferrer">Slidev 主题<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h4 id="代码和图像"><a href="#代码和图像" class="header-anchor">#</a> 代码和图像</h4> <p>插入代码和图像：代码就是 markdown 语法，图像使用 arrow 标签插入</p> <div class="language-markdown line-numbers-mode"><pre class="language-markdown"><code><span class="token front-matter-block"><span class="token punctuation">---</span>
<span class="token front-matter yaml language-yaml"><span class="token key atrule">layout</span><span class="token punctuation">:</span> image<span class="token punctuation">-</span>right
<span class="token key atrule">image</span><span class="token punctuation">:</span> https<span class="token punctuation">:</span>//source.unsplash.com/collection/94734566/1920x1080</span>
<span class="token punctuation">---</span></span>

<span class="token title important"><span class="token punctuation">#</span> Code</span>

Use code snippets and get the highlighting directly!

<span class="token code"><span class="token punctuation">```</span><span class="token code-language">ts {all|2|1-6|9|all}</span>
<span class="token code-block language-ts"><span class="token keyword">interface</span> <span class="token class-name">User</span> <span class="token punctuation">{</span>
  id<span class="token operator">:</span> <span class="token builtin">number</span>
  firstName<span class="token operator">:</span> <span class="token builtin">string</span>
  lastName<span class="token operator">:</span> <span class="token builtin">string</span>
  role<span class="token operator">:</span> <span class="token builtin">string</span>
<span class="token punctuation">}</span>

<span class="token keyword">function</span> <span class="token function">updateUser</span><span class="token punctuation">(</span>id<span class="token operator">:</span> <span class="token builtin">number</span><span class="token punctuation">,</span> update<span class="token operator">:</span> User<span class="token punctuation">)</span> <span class="token punctuation">{</span>
  <span class="token keyword">const</span> user <span class="token operator">=</span> <span class="token function">getUser</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>
  <span class="token keyword">const</span> newUser <span class="token operator">=</span> <span class="token punctuation">{</span><span class="token operator">...</span>user<span class="token punctuation">,</span> <span class="token operator">...</span>update<span class="token punctuation">}</span>
  <span class="token function">saveUser</span><span class="token punctuation">(</span>id<span class="token punctuation">,</span> newUser<span class="token punctuation">)</span>
