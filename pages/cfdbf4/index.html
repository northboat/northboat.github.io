yNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">前沿密码研讨<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="区块链与比特币"><a href="#区块链与比特币" class="header-anchor">#</a> 区块链与比特币</h2> <blockquote><p>Blockchain</p></blockquote> <p>区块链（Blockchain）是一种<strong>去中心化的分布式账本技术</strong>，最初被用于比特币，现在被广泛应用于金融、供应链、身份认证、医疗等领域</p> <ul><li>Block（区块）：指的是交易数据被打包后形成的单元</li> <li>Chain（链）：指的是这些区块按时间顺序通过加密链接在一起，形成一条链式结构</li></ul> <p>区块链本质上是一个由多个“区块”<strong>按时间顺序</strong>串联组成的数据结构，每个区块中记录了<strong>一组</strong>交易数据，并通过密码学方法保证不可篡改</p> <ul><li>就是一个链表，只不过节点数据很特别</li></ul> <p>每个区块中不仅包含交易数据，还包含前一个区块的哈希值（加密摘要），从而形成一个前后相连、不可逆的链式结构，一旦前面的区块内容被修改，其后的所有区块的哈希也会发生变化，因此可以有效防止数据篡改</p> <p>它具有以下几个核心特性</p> <table><thead><tr><th>特性</th> <th>解释</th></tr></thead> <tbody><tr><td>分布式</td> <td>数据不是集中在一个服务器上，而是存储在网络中所有节点中</td></tr> <tr><td>去中心化</td> <td>不依赖任何单一机构或第三方，节点间通过共识机制达成一致</td></tr> <tr><td>不可篡改</td> <td>一旦数据被记录到区块链上就无法更改</td></tr> <tr><td>可追溯性</td> <td>每笔交易都有完整的时间戳和历史记录</td></tr> <tr><td>透明性和可验证性</td> <td>所有节点都能验证交易的真实性和完整性</td></tr></tbody></table> <p>可以将区块链比作一本多人共享的“记账本”，每一页就是一个区块，每页内容写好后都<strong>盖章封存</strong>（哈希+共识机制），然后连接到前一页之后，所有人都能看到记账内容，但没人能偷偷改动过去的记录（这样将失去有效性）</p> <h3 id="哈希与共识机制"><a href="#哈希与共识机制" class="header-anchor">#</a> 哈希与共识机制</h3> <p>我们把每个区块看作一本“账簿页面”</p> <ul><li>上面写着本轮的交易记录</li> <li>为了防止事后修改，系统要给它盖章封存</li></ul> <p>这个“封存”过程由两部分组成</p> <table><thead><tr><th>组成</th> <th>含义</th> <th>作用</th></tr></thead> <tbody><tr><td>哈希（Hash）</td> <td>用加密算法把区块“压缩”为一个唯一摘要值</td> <td>一旦数据改动，哈希值就会改变，能立刻察觉</td></tr> <tr><td>共识机制（如 PoW）</td> <td>网络中大多数节点<strong>共同同意</strong>这个区块有效</td> <td>防止恶意节点随意造假</td></tr></tbody></table> <p>哈希 = 在每页账簿上盖防伪印章</p> <p>在区块链中</p> <ul><li>每个区块都记录前一个区块的哈希值</li> <li>区块内容一改，哈希就变，链就断了</li> <li>这使得任何人想修改历史记录都变得几乎不可能</li></ul> <p>哈希保证了“区块内部”和“区块之间”都不能被偷偷篡改，我们可以保证任意一个链的合法性，并且链上的区块可以通过摘要值保证其无法篡改</p> <p>区块的合法性如何保证？用到共识机制</p> <table><thead><tr><th>机制</th> <th>说明</th></tr></thead> <tbody><tr><td>工作量证明（Proof of Work）</td> <td>比特币使用，必须算出一个符合条件的哈希（很难）</td></tr> <tr><td>权益证明（PoS）</td> <td>以太坊等使用，凭“持币量”投票决策</td></tr> <tr><td>拜占庭容错、DPoS、PBFT 等</td> <td>其他公链/联盟链使用</td></tr></tbody></table> <p>共识 = 众人见证并盖公章，谁造假就会被识破</p> <p>在比特币中</p> <ul><li>谁想添加新区块，必须算出一个合格哈希（挖矿）</li> <li>这非常耗费计算力，意味着这个“封章”具有“成本”</li> <li>网络只接受<strong>最长合法链</strong>作为真正的“账本”</li></ul> <p>共识机制保证了大家都接受同一个历史，不会有“分叉账本”乱象</p> <p>区块链的安全与可信，来源于哈希算法提供的防篡改能力和共识机制提供的集体认可，这套机制就是区块链最本质的盖章封存</p> <h3 id="最长合法链"><a href="#最长合法链" class="header-anchor">#</a> 最长合法链</h3> <p>什么叫“最长合法链”？在比特币系统中</p> <ul><li>每一个新区块都是接在上一个合法区块后面</li> <li>这样连接形成了一个链条，称为“区块链”</li> <li>不同的矿工可能同时挖出不同的新块，就可能出现分叉</li> <li>比特币规定： “ 以工作量为准，链上块最多的那条链为主链”</li></ul> <p>所以，“最长合法链”意思是：<strong>目前全网算力共同认定的、累计工作量最大的那条区块链</strong>，即所有节点都认为是“正统”的链，即唯一的<strong>账本</strong></p> <p>为什么叫“最长”？这指的是什么长度？不是指字节数或块个数，而是指“累积的工作量（难度）</p> <ul><li>在比特币中，每个区块都必须经过挖矿计算（工作量证明，PoW）</li> <li>你挖得越多、链越长，就代表你为这条链投入了更多计算资源</li> <li>网络规定：谁的链累积的工作量最多，谁的链就被视为“主链”</li> <li>这通常表现为块数最多的一条链，因为每个块的难度是固定的</li></ul> <p>举个例子，假设区块链已经走到第 100 个区块，某一时刻，两个矿工同时挖出了第 101 块，分别叫<code>101A</code>和<code>101B</code>，网络产生了“短暂分叉”</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>... → 100 → 101A  
          ↘︎ 101B
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>此时，有的节点收到<code>101A</code>，有的收到<code>101B</code>，网络短暂不一致，假如接下来矿工 C 在<code>101A</code>的基础上成功挖出<code>102A</code>，链就变成</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>... → 100 → 101A → 102A  
          ↘︎ 101B
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>这时，“A链”更长了，大多数节点就会选择它，那么最长合法链 = ... → 100 → 101A → 102A</p> <p>而<code>101B</code>和其交易就会被丢弃，称为“孤块（orphan block）”</p> <ul><li>需要注意的是，<code>101B</code>本身是一个合法的区块（他正确引用了上一个区块 100 的哈希并且工作量证明 PoW 达标），但是不是一个合法的比特币，因为这笔帐被主链抛弃了</li></ul> <p>最长合法链解决了什么问题？它是去中心化世界中解决冲突、达成共识的方式</p> <ul><li>没有中央服务器说了算</li> <li>所有节点都用相同规则判断哪条链是主链</li> <li>就算发生了分叉，大家也知道： “我们跟着最长合法链走”，这就避免了混乱</li></ul> <h3 id="比特币概述"><a href="#比特币概述" class="header-anchor">#</a> 比特币概述</h3> <p>比特币（Bitcoin）是<strong>第一个</strong>真正实现的区块链应用，它是一种去中心化的<strong>数字加密货币</strong>，由中本聪（Satoshi Nakamoto）在 2008 年提出，2009 年正式发布。其工作流程如下</p> <p>1️⃣ 交易打包成区块</p> <ul><li>用户发起交易（例如 A 给 B 转 1 个比特币）</li> <li>网络节点广播这笔交易</li> <li>“矿工”收集一批交易并打包成一个区块（block）</li></ul> <p>2️⃣ 工作量证明（PoW）机制：挖矿</p> <ul><li>为了添加这个新区块，矿工必须完成一个复杂的数学难题（找一个满足条件的哈希值）</li> <li>这个过程称为“挖矿”，谁先解出问题，谁就能把区块加到区块链上，并获得<strong>比特币奖励</strong></li></ul> <p>3️⃣ 区块链接成链</p> <ul><li>每个新区块中记录上一个区块的哈希值</li> <li>形成一个<strong>不可篡改的链式结构</strong> —— 区块链</li> <li>一旦区块被添加，其内部数据几乎无法更改，因为更改一个区块将破坏整个后续链条的哈希</li></ul> <p>4️⃣ 全网共识</p> <ul><li>所有节点都验证新区块是否合法（是否遵循规则、是否有双重支付等）</li> <li>一致接受后，这个区块就被<strong>永久记录</strong></li></ul> <p>所以比特币到底是什么，是一串哈希吗？实际上是一个私钥，具备“控制账本上某个地址”的能力 —— 拥有比特币</p> <p>哈希算法在整个系统里大量使用</p> <table><thead><tr><th>用途</th> <th>内容</th> <th>哈希算法</th></tr></thead> <tbody><tr><td>区块链结构</td> <td>每个区块有一个哈希值，指向上一个区块</td> <td>SHA-256</td></tr> <tr><td>挖矿过程</td> <td>通过不断尝试不同 nonce，找出符合难度的哈希</td> <td>SHA-256 x2</td></tr> <tr><td>地址生成</td> <td>比特币地址是从公钥哈希计算出来的</td> <td>RIPEMD-160（SHA-256 pk）</td></tr> <tr><td>交易 ID</td> <td>每笔交易也有一个唯一的哈希值（txid）</td> <td>SHA-256 x2</td></tr></tbody></table> <p>当拥有 1 个比特币，其实</p> <ul><li>你有一个私钥，对应一个地址</li> <li>区块链账本里记录了一个或多个“未花费的输出”，指向这个地址，总金额为 1 BTC</li> <li>当你转账时，系统检查这些 UTXO，再生成新的交易，把这些比特币“花掉”</li></ul> <h3 id="双花问题"><a href="#双花问题" class="header-anchor">#</a> 双花问题</h3> <p>“双花”（Double Spending）是区块链和加密货币中最关键、也最需要防范的问题之一，它指的是：同一个 BTC 被恶意的花费两次，例如</p> <ul><li>把 1 BTC 支付给商家 A</li> <li>同时将另一笔交易广播出去，把同样的 1 BTC 支付给你的另一个地址 B</li> <li>如果你能让“支付给 B 的交易”被矿工先打包进区块链中，那么你就“收回”了那笔钱，A 就被骗了</li></ul> <p>比特币用以下机制来防御双花</p> <table><thead><tr><th>防御机制</th> <th>说明</th></tr></thead> <tbody><tr><td>区块链结构</td> <td>所有交易都要被打包进单一主链（最长合法链）且不可更改</td></tr> <tr><td>工作量证明（PoW）</td> <td>想“抢跑”插入伪造交易，需要极高算力才能制造“更长链”</td></tr> <tr><td>等待多个确认</td> <td>商家会等<strong>6个区块确认</strong>才认为交易不可逆</td></tr> <tr><td>去中心化</td> <td>网络中成千上万节点共同验证、同步，攻击难度非常高</td></tr></tbody></table> <p>为什么双重支付难以实现？</p> <ul><li>要双花成功，你得<strong>控制超过全网一半的算力</strong>（所谓 51% 攻击）</li> <li>即使你广播了两笔冲突交易，矿工只会打包其中<strong>一笔</strong></li> <li>其他那一笔会被网络判定为“双花交易”，直接丢弃</li></ul> <h3 id="减半机制"><a href="#减半机制" class="header-anchor">#</a> 减半机制</h3> <p>比特币的“减半机制”是其最重要的货币发行机制之一，它是比特币<strong>通缩模型</strong>的核心</p> <ul><li>比特币减半机制是指：每当网络挖出 210000 个区块（大约每 4 年），挖矿所得的比特币奖励就会减少一半，直到总发行量接近 2100 万个比特币为止</li></ul> <p>为什么要减半？控制总量以模拟黄金的稀缺性</p> <ul><li>比特币的最大供应量为 2100万枚</li> <li>如果不减半，发行会无限制增发</li> <li>减半机制让发行量逐渐趋近于 2100 万</li></ul> <p>抑制通货膨胀</p> <ul><li>减少供应速度，保证稀缺</li> <li>吸引长期投资者，形成稳定预期</li></ul> <p>减半的经济效应</p> <table><thead><tr><th>影响因素</th> <th>说明</th></tr></thead> <tbody><tr><td>矿工收入减少</td> <td>如果币价不涨，矿工收益会缩水一半</td></tr> <tr><td>币价有上涨预期</td> <td>因为供应减少，而需求可能稳定甚至上升</td></tr> <tr><td>市场投机波动</td> <td>减半前后往往伴随价格剧烈波动</td></tr> <tr><td>挖矿难度调整</td> <td>有些矿工退出后，全网难度会自动调整以维持出块速度</td></tr></tbody></table> <p>这其实是一个经济学问题，而并非密码学范畴，<strong>减半事件是写死在比特币代码里的（Bitcoin Core），无法人为更改</strong></p> <p>比特币减半机制是比特币每 4 年减产一半的系统规则，用以模拟稀缺性、控制总量、增强长期价值，它是比特币“通缩”特性和“数字黄金”地位的根本来源（人为稀缺）</p> <h3 id="简单的矿工"><a href="#简单的矿工" class="header-anchor">#</a> 简单的矿工</h3> <p>本质上其实就是一个 SHA-256 哈希，目的是找到哈希值为 <code>hash(input)</code> 并满足特定要求的 <code>nonce</code></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SimpleMiner</span> <span class="token punctuation">{</span>

    <span class="token comment">// 将任意字符串进行 SHA-256 哈希</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">sha256</span><span class="token punctuation">(</span><span class="token class-name">String</span> input<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token class-name">MessageDigest</span> digest <span class="token operator">=</span> <span class="token class-name">MessageDigest</span><span class="token punctuation">.</span><span class="token function">getInstance</span><span class="token punctuation">(</span><span class="token string">&quot;SHA-256&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> hashBytes <span class="token operator">=</span> digest<span class="token punctuation">.</span><span class="token function">digest</span><span class="token punctuation">(</span>input<span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token class-name">StandardCharsets</span><span class="token punctuation">.</span><span class="token constant">UTF_8</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token comment">// 将字节数组转换为十六进制字符串</span>
        <span class="token class-name">StringBuilder</span> hexString <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">StringBuilder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">byte</span> b <span class="token operator">:</span> hashBytes<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token class-name">String</span> hex <span class="token operator">=</span> <span class="token class-name">Integer</span><span class="token punctuation">.</span><span class="token function">toHexString</span><span class="token punctuation">(</span><span class="token number">0xff</span> <span class="token operator">&amp;</span> b<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>hex<span class="token punctuation">.</span><span class="token function">length</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">1</span><span class="token punctuation">)</span> hexString<span class="token punctuation">.</span><span class="token function">append</span><span class="token punctuation">(</span><span class="token char">'0'</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            hexString<span class="token punctuation">.</span><span class="token function">append</span><span class="token punctuation">(</span>hex<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> hexString<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> <span class="token function">mine</span><span class="token punctuation">(</span><span class="token class-name">String</span> blockData<span class="token punctuation">,</span> <span class="token keyword">int</span> difficulty<span class="token punctuation">)</span><span class="token punctuation">{</span>

        <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> data <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">int</span> nonce <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
        <span class="token class-name">String</span> hash<span class="token punctuation">;</span>

        <span class="token keyword">long</span> startTime <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 要求哈希值的前缀有 difficulty 个 0，才满足要求</span>
        <span class="token class-name">String</span> targetPrefix <span class="token operator">=</span> <span class="token string">&quot;0&quot;</span><span class="token punctuation">.</span><span class="token function">repeat</span><span class="token punctuation">(</span>difficulty<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">while</span> <span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token comment">// blockData 是假设的区块内容</span>
            <span class="token class-name">String</span> input <span class="token operator">=</span> blockData <span class="token operator">+</span> nonce<span class="token punctuation">;</span>
            <span class="token keyword">try</span> <span class="token punctuation">{</span>
                hash <span class="token operator">=</span> <span class="token function">sha256</span><span class="token punctuation">(</span>input<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                data<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;Error&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">return</span> data<span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>hash<span class="token punctuation">.</span><span class="token function">startsWith</span><span class="token punctuation">(</span>targetPrefix<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;找到符合条件的 nonce: &quot;</span> <span class="token operator">+</span> nonce<span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;对应哈希值: &quot;</span> <span class="token operator">+</span> hash<span class="token punctuation">)</span><span class="token punctuation">;</span>
                data<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;nonce&quot;</span><span class="token punctuation">,</span> nonce<span class="token punctuation">)</span><span class="token punctuation">;</span>
                data<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;hash&quot;</span><span class="token punctuation">,</span> hash<span class="token punctuation">)</span><span class="token punctuation">;</span>
                <span class="token keyword">break</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            nonce<span class="token operator">++</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token keyword">long</span> endTime <span class="token operator">=</span> <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">currentTimeMillis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;耗时: &quot;</span> <span class="token operator">+</span> <span class="token punctuation">(</span>endTime <span class="token operator">-</span> startTime<span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot; ms&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        data<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;time_cost&quot;</span><span class="token punctuation">,</span> endTime<span class="token operator">-</span>startTime<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">return</span> data<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
        <span class="token class-name">SimpleMiner</span> miner <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">SimpleMiner</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> data <span class="token operator">=</span> miner<span class="token punctuation">.</span><span class="token function">mine</span><span class="token punctuation">(</span><span class="token string">&quot;Alice trade 10 btc to Bob&quot;</span><span class="token punctuation">,</span> <span class="token number">5</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>data<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br></div></div><p>输入<code>{&quot;Alice trade 10 btc to Bob&quot;, 5}</code>，输出</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>找到符合条件的 nonce: 1155772

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h2 id="抗量子加密"><a href="#抗量子加密" class="header-anchor">#</a> 抗量子加密</h2> <h3 id="shor-算法"><a href="#shor-算法" class="header-anchor">#</a> Shor 算法</h3> <blockquote><p><a href="https://zh.wikipedia.org/zh-cn/%E7%A7%80%E7%88%BE%E6%BC%94%E7%AE%97%E6%B3%95" target="_blank" rel="nofollow noopener noreferrer">Shor 算法 - 维基百科<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>Shor 算法（1994）是量子计算的一个突破性发现，它能在多项式时间内解决一些传统计算难以处理的数学问题，如 RSA 和 ECC</p> <ul><li>量子计算机的出现将使得 Shor 算法成为现实，并使得目前广泛使用的 RSA、ECC、DSA 等基于大数分解和离散对数的加密算法变得不再安全</li></ul> <p>量子计算的广泛应用可能尚需几十年，但为了避免未来量子计算突破传统加密算法后带来的安全危机，提前准备抗量子签名算法是非常必要的。通过标准化新型抗量子签名算法，能够在量子计算技术逐步成熟的过程中平滑过渡，避免数据泄露和信息丧失</p> <p>另外，抗量子算法可能在计算复杂度和资源消耗方面存在折衷，即在设计抗量子签名算法时需要考虑算法的效率与安全性，确保其在实际应用中能够平衡计算和存储成本</p> <table><thead><tr><th>场景</th> <th>用途</th></tr></thead> <tbody><tr><td>网络通信</td> <td>1. TLS/SSL 协议：用于服务器认证和客户端认证，Dilithium 作为后量子签名候选方案，替代传统的 RSA 或 ECC 签名，抵抗量子计算可能带来的攻击风险<br>2. VPN 和安全隧道：在构建加密隧道的身份验证阶段，Dilithium 提供快速、轻量化的签名验证</td></tr> <tr><td>物联网设备</td> <td>1. 资源受限设备：Dilithium 的签名生成和验证操作均适合嵌入式设备，尤其是在低功耗和有限存储场景下（如智能家居、工业传感器）<br>2. 边缘计算与5G场景：在设备边缘节点进行安全认证时，Dilithium 以其存储和计算效率成为抗量子密码的优选</td></tr> <tr><td>区块链与电子货币</td> <td>1. 交易认证：在区块链网络中，用于交易签名和节点认证，确保抗量子攻击的安全性<br>2. 数字资产保护：支持智能合约和数字资产的安全签名机制，提供持久的抗量子攻击保障</td></tr> <tr><td>加密系统</td> <td>1. 长期数据保护：政府机密和军事信息需长期安全存储，Dilithium 提供抗量子签名，保障数据完整性<br>2. 国防通信与安全协议：用于军事通信中的身份认证和加密密钥协商</td></tr></tbody></table> <h3 id="后量子对称加密"><a href="#后量子对称加密" class="header-anchor">#</a> 后量子对称加密</h3> <p>参考对称轻量级密码算法，如 PRESENT、SPARX 等的设计思路，基于格上的 LPN 问题（LWE 问题的特殊情况）也常用于对称加密场景</p> <h3 id="后量子签名"><a href="#后量子签名" class="header-anchor">#</a> 后量子签名</h3> <blockquote><p>后量子数字签名</p></blockquote> <p>格基算法：基于格的问题，如</p> <ul><li>学习错误问题 LWE（Dilithium）</li> <li>短整数解问题 SIS（Falcon）</li> <li>最短向量问题 SVP（NTRU）</li></ul> <p>被认为对量子计算机具有抗性，因此成为抗量子密码学的热门研究方向</p> <p>Kyber</p> <ol><li>Kyber 是一个广泛使用的基于 <strong>LWE</strong> 的加密方案，也提供了一种基于 <strong>LWE</strong> 的签名方案（通常与加密协议一同使用）</li> <li>Kyber 签名方案基于基于LWE问题的密钥交换和公钥加密系统</li> <li>该签名方案适用于公钥加密系统中，并具有较好的效率和紧凑性</li></ol> <p>Falcon：一种基于 NTRU 格和 SIS 问题的高效抗量子签名方案，其核心思想是</p> <ol><li>使用格上的短向量作为签名，确保签名的长度较短</li> <li>引入拒绝采样技术，保证签名的随机性和抗攻击性</li></ol> <p><a href="https://tches.iacr.org/index.php/TCHES/article/view/839" target="_blank" rel="nofollow noopener noreferrer">CRYSTALS-Dilithium: A Lattice-Based Digital Signature Scheme | IACR Transactions on Cryptographic Hardware and Embedded Systems<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ol><li>基于 LWE 问题</li> <li>是 NIST 抗量子密码学标准化项目中的候选算法（现已入选）</li> <li>特点：签名大小较小，验证速度快，适合通用签名场景</li> <li>参考场景：抗量子环境下的区块链和身份认证</li></ol> <p>BLISS（Bimodal Lattice Signature Scheme）</p> <ol><li>基于格上的离散高斯采样，采用 LWE 的设计思想</li> <li>优点：签名小，计算速度快，密钥生成相对高效。</li> <li>缺点：在侧信道攻击下可能存在风险</li></ol> <p>基于哈希的康量子算法：哈希函数的安全性已经过几十年的广泛研究，基于哈希的签名算法在理论上简单且抗量子攻击</p> <p>SPHINCS+</p> <ul><li>是 NIST 抗量子密码学标准化项目中的另一候选算法</li> <li>特点：无状态签名，完全基于哈希函数，无需额外的数学假设</li> <li>缺点：签名长度较长，但安全性非常高</li> <li>应用场景：适合需要强安全性保证的系统，如军事和政府通信</li></ul> <p>Merkle 签名方案</p> <ul><li>使用 Merkle 树作为核心数据结构，支持大批量签名</li> <li>优点：简单、直接</li> <li>缺点：签名效率不高，需要维护状态（改进版如 SPHINCS+ 解决了这一问题）</li></ul> <p>其他抗量子签名算法</p> <table><thead><tr><th>算法</th> <th>数学理论</th> <th>特点</th></tr></thead> <tbody><tr><td>Rainbow</td> <td>基于多变量多项式</td> <td>使用多层多变量多项式系统设计；优点：签名小，验证速度快；缺点：密钥较大，在某些应用中存储成本高；应用：轻量级设备或需要快速签名的场景</td></tr> <tr><td>Wave</td> <td>基于纠错码</td> <td>基于纠错码和稀疏多项式；优点：签名小，验证速度快；缺点：目前仍处于研究阶段，实际应用较少</td></tr> <tr><td>SeaSign</td> <td>基于等距映射</td> <td>基于超奇异椭圆曲线的等距映射问题；特点：密钥和签名大小非常小，特别适合低带宽环境；缺点：签名生成速度较慢，仍在优化中</td></tr> <tr><td>Picnic</td> <td>基于组合理论</td> <td>利用组合数学问题的难度构造，基于零知识证明和哈希函数；特点：无需复杂的数学假设，签名大小中等；缺点：验证速度可能较慢；应用：嵌入式设备或资源受限的环境</td></tr></tbody></table> <h2 id="dilithium-算法"><a href="#dilithium-算法" class="header-anchor">#</a> Dilithium 算法</h2> <blockquote><p><a href="https://tches.iacr.org/index.php/TCHES/article/view/839" target="_blank" rel="nofollow noopener noreferrer">CRYSTALS-Dilithium: A Lattice-Based Digital Signature Scheme<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <h3 id="lwe-和-sis-问题"><a href="#lwe-和-sis-问题" class="header-anchor">#</a> LWE 和 SIS 问题</h3> <blockquote><p>LWE（Learning With Errors）和 SIS（Short Integer Solution）问题是两种在基于格的密码学（lattice-based cryptography）中常见的困难问题，它们是许多现代抗量子密码学协议的安全基础</p></blockquote> <p>LWE 是基于格理论的一种问题，它描述了如何从某些错误的线性关系中学习信息。具体而言，LWE 问题要求从一组添加噪声的线性方程中恢复出未知的密钥或向量，其定义如下</p> <p>加密方已知 n 长的密钥向量 s，通过 m 长的噪声向量 e 将一个 mxn 的矩阵 A 加密为 b</p> <mjx-container j -moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>A</mi><mi>x</mi><mo>=</mo><mi>b</mi><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mo stretchy="false">(</mo><mi>m</mi><mi>o</mi><mi>d</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mi>q</mi><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>并且 x 是“短”的，即 x 的元素值非常小，也就是说，SIS 问题要求我们找到一个小整数解，使得上述方程成立</p> <p>SIS 问题的困难性在于</p> <ol><li>寻找短整数解：我们必须在可能的解空间中寻找一个具有小值的解，这使得问题非常难以解决。</li> <li>矩阵的规模：类似于 LWE，SIS 问题通常涉及到高维度的矩阵，因此解决这个问题需要耗费大量计算资源</li></ol> <h3 id="lwe-问题的一般签名形式"><a href="#lwe-问题的一般签名形式" class="header-anchor">#</a> LWE 问题的一般签名形式</h3> <blockquote><p><a href="https://link.springer.com/chapter/10.1007/978-3-319-04852-9_2" target="_blank" rel="nofollow noopener noreferrer">An Improved Compression Technique for Signatures Based on Learning with Errors<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>公钥生成：得到私钥<code>SK = S</code>和公钥<code>PK = (A, T)</code></p> <img src="/assets/img/image-20241216184101947.01b6b1ec.png"> <p>其中 E 必须是一个足够“小”的噪声，满足短向量性质，否则将拒绝采样</p> <p>签名</p> <img src="/assets/img/image-20241216184142468.c7e919d7.png"> <ol><li>要加密的数据为随机生成的向量 y</li> <li>y 先通过公钥矩阵 A 内积为向量 v</li> <li>而后和随机数 μ 一起经过哈希得到 c，再二次哈希得到 c（注意两个 c 通过加粗区分）</li> <li>再计算密文 z = y + Sc</li> <li>签名值为 (z, c)</li></ol> <p>需要注意的是，这里 c 和 z 必须满足 6~8 的条件，即满足短向量性质，否则将拒绝采样</p> <p>验签：收到的签名值为 (z, c)</p> <img src="/assets/img/image-20241216184212932.f4c7be3b.png"> <p>1️⃣ 先计算二重哈希 <strong>c</strong> = F(c)</p> <p>2️⃣ 由于已知公钥 (A, T)，于是根据 (z, <strong>c</strong>) 计算 w，该 w 实际上等于</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="58.28ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 25759.9 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D464" d="M580 385Q580 406 599 424T641 443Q659 443 674 425T690 368Q690 339 671 253Q656 197 644 161T609 80T554 12T482 -11Q438 -11 404 5T355 48Q354 47 352 44Q311 -11 252 -11Q226 -11 202 -5T155 14T118 53T104 116Q104 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Q21 293 29 315T52 366T96 418T161 441Q204 441 227 416T250 358Q250 340 217 250T184 111Q184 65 205 46T258 26Q301 26 334 87L339 96V119Q339 122 339 128T340 136T341 143T342 152T345 165T348 182T354 206T362 238T373 281Q402 395 406 404Q419 431 449 431Q468 431 475 421T483 402Q483 389 454 274T422 142Q420 131 420 107V100Q420 85 423 71T442 42T487 26Q558 26 600 148Q609 171 620 213T632 273Q632 306 619 325T593 357T580 385Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(993.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(2049.6,0)"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 5 ，若一致且 z 为短向量，则验签通过</p> <h3 id="dilithium-加密"><a href="#dilithium-加密" class="header-anchor">#</a> Dilithium 加密</h3> <p>Dilithium 加密细节</p> <img src="/assets/img/image-20241216201624341.c3079244.png"> <h4 id="密钥生成"><a href="#密钥生成" class="header-anchor">#</a> 密钥生成</h4> <p>随机数/向量生成</p> <ul><li>生成两个 256 位的随机数 ρ,K</li> <li>从随机分布中抽取两个秘密密钥向量 s1 和 s2，这些向量的系数属于环 Rq 且大小不超过 η</li></ul> <p>矩阵扩展：将种子 ρ 扩展成一个大小为 k×ℓ 的矩阵 A，其中每个元素在多项式环<code>Rq = Zq[X]/(Xn+1)</code>上，其中<code>q = 2^23−2^13+1, n=256</code>。但为了更快的实现考虑，矩阵 A 实际上是以系数在<code>Zq^(256)</code>中的矩阵格式输出并存储的，计算</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="12.394ex" height="1.959ex" role="img" focusable="false" viewBox="0 -716 5478.1 866" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.339ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(638.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1694.6,0)"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q26
