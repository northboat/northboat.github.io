</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><h3 id="初始化"><a href="#初始化" class="header-anchor">#</a> 初始化</h3> <p>群参数设置为了方便测试时间，选择使用较小阶的循环群，这里需要使用 JPBC 自带的参数生成函数</p> <p>160 为整数群的阶数，打印参数并保存为<code>a160.properties</code>放在项目根目录使用</p> <p>由于各算法尽量要在相同参数下进行时间开销测试，所有的系统参数应在 Main 函数中初始化，而后作为参数传入各自的构造函数进行系统初始化</p> <p>需要注意的是，群上元素的运算会改变元素本身——直接写 <code>g1 = g.add(h)</code> 会让 g 自身也变成 <code>g.add(h)</code>。解决办法是在定义时取 <code>getImmutable()</code> 令其不可变（本文统一采用这种）</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Element</span> g <span class="token operator">=</span> <span class="token constant">G1</span><span class="token punctuation">.</span><span class="token function">newRandomElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">Element</span> x <span class="token operator">=</span> <span class="token class-name">Zr</span><span class="token punctuation">.</span><span class="token function">newRandomElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Element</span> g5 <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>或在计算时取 <code>duplicate()</code> 复制一份而不影响自身</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Element</span> g <span class="token operator">=</span> <span class="token constant">G1</span><span class="token punctuation">.</span><span class="token function">newRandomElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">Element</span> g6 <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">duplicate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>x<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="双线性群的运算"><a href="#双线性群的运算" class="header-anchor">#</a> 双线性群的运算</h3> <p>乘方、乘、加法以及配对运算</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Element</span> g <span class="token operator">=</span> <span class="token constant">G1</span><span class="token punctuation">.</span><span class="token function">newRandomElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">Element</span> x <span class="token operator">=</span> <span class="token class-name">Zr</span><span class="token punctuation">.</span><span class="token function">newRandomElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">Element</span> g1 <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">add</span><span class="token punctuation">(</span>h<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Element</span> g2 <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">mul</span><span class="token punctuation">(</span>h<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">Element</span> g4 <span class="token operator">=</span> bp<span class="token punctuation">.</span><span class="token function">pairing</span><span class="token punctuation">(</span>g<span class="token punctuation">,</span> h<span class="token punctuation">)</span><span class="token punctuation">;</span>

msup><mo>,</mo><msup><mi>v</mi><mi>b</mi></msup><mo stretchy="false">)</mo><mo>=</mo><mi>e</mi><mo stretchy="false">(</mo><mi>u</mi><mo>,</mo><mi>v</mi><msup><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mi>a</mi><mi>b</mi></mrow></msup></math></mjx-assistive-mml></mjx-container><h3 id="哈希嵌入"><a href="#哈希嵌入" class="header-anchor">#</a> 哈希嵌入</h3> <p>第一种方式：先 md5 哈希为 byte 数组（调用 spring 的 DigestUtils），再直接 setFromHash 映射到 G1——但这样会让哈希值与生成元 g 失去联系，故本文采用第二种</p> <p>第二种：先哈希到整数群 Zp，再利用群 G 上的生成元 g 计算幂指数，从而哈希到指定群 G 上</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token class-name">Element</span> <span class="token function">hash</span><span class="token punctuation">(</span><span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> bytes<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">Element</span> hash <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> md5 <span class="token operator">=</span> <span class="token class-name">DigestUtils</span><span class="token punctuation">.</span><span class="token function">md5Digest</span><span class="token punctuation">(</span>bytes<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 映射到 Zr 整数群</span>
        <span class="token class-name">Element</span> x <span class="token operator">=</span> <span class="token class-name">Zr</span><span class="token punctuation">.</span><span class="token function">newElement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">setFromHash</span><span class="token punctuation">(</span>md5<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> md5<span class="token punctuation">.</span>length<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 通过 G1 上的生成元 g 幂运算映射到 G1 群上</span>
        hash <span class="token operator">=</span> g<span class="token punctuation">.</span><span class="token function">powZn</span><span class="token punctuation">(</span>x<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h2 id="可搜索加密算法"><a href="#可搜索加密算法" class="header-anchor">#</a> 可搜索加密算法</h2> <h3 id="接口与抽象类"><a href="#接口与抽象类" class="header-anchor">#</a> 接口与抽象类</h3> <p>SE 的仿真绕不开 setup / keygen / enc / trap / search 五个函数，具备密钥更新策略的再扩展 updateKey / updateEnc / constTrap / updateSearch 四个。接口设计就围绕这 8 个函数：enc/trap 各提供单关键词与字符串数组两种重载以适应不同算法的传参形式，不支持的操作维持默认抛异常、由调用方降级处理；另有一个 default 的 <code>test</code> 用于测定三种操作的耗时，各算法按需重载</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">SearchableEncryption</span> <span class="token punctuation">{</span>

    <span class="token keyword">default</span> <span class="token keyword">void</span> <span class="token function">trap</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> <span class="token class-name">Q</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token punctuation">}</span>

    <span class="token keyword">default</span> <span class="token keyword">void</span> <span class="token function">updateEnc</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token punctuation">}</span>
    <span class="token keyword">default</span> <span class="token keyword">void</span> <span class="token function">constTrap</span><span class="token punctuation">(</span><span class="token class-name">String</span> q<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">UnsupportedOperationException</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token punctuation">}</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p><code>CipherSystem</code> 实现该接口，持有几项基本的系统参数：<code>Field G, GT, Zr</code> 为所用到的循环群，<code>Pairing bp</code> 为双线性配对函数，<code>int n</code> 为字符串哈希长度，<code>boolean updatable</code> 标识是否存在密钥更新策略。此外它还封装了哈希、取随机数、配对等语法糖，供各子算法直接调用</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">CipherSystem</span> <span class="token keyword">implements</span> <span class="token class-name">SearchableEncryption</span><span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><h3 id="pecks-算法实现"><a href="#pecks-算法实现" class="header-anchor">#</a> PECKS 算法实现</h3> <p>以 PECKS 实现为例</p> <h4 id="初始化-setup"><a href="#初始化-setup" class="header-anchor">#</a> 初始化 setup</h4> <p>继承父类并重载构造函数</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>public class PECKS extends CipherSystem {

    left<span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token class-name">T</span><span class="token punctuation">.</span><span class="token function">charAt</span><span class="token punctuation">(</span>i<span class="token punctuation">)</span> <span class="token operator">!=</span> <span class="token char">'*'</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token class-name">Element</span> part3 <span class="token operator">=</span> <span class="token function">pairing</span><span class="token punctuation">(</span><span class="token constant">C2</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token constant">K1</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">Element</span> part4 <span class="token operator">=</span> <span class="token function">pairing</span><span class="token punctuation">(</span><span class="token constant">C3</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token constant">K2</span><span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

            part2<span class="token punctuation">.</span><span class="token function">mul</span><span class="token punctuation">(</span>part3<span class="token punctuation">.</span><span class="token function">mul</span><span class="token punctuation">(</span>part4<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    part2<span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">Element</span> <span class="token constant">M1</span> <span class="token operator">=</span> <span class="token constant">C0</span><span class="token punctuation">.</span><span class="token function">div</span><span class="token punctuation">(</span>part1<span class="token punctuation">.</span><span class="token function">div</span><span class="token punctuation">(</span>part2<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">getImmutable</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;HVE M: &quot;</span> <span class="token operator">+</span> <span class="token class-name">M</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;HVE M': &quot;</span> <span class="token operator">+</span> <span class="token constant">M1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token class-name">M</span><span class="token punctuation">.</span><span class="token function">isEqual</span><span class="token punctuation">(</span><span class="token constant">M1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p><strong>测试</strong></p> <p>Gray 编码，输入权重</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Double</span><span class="token punctuation">&gt;</span></span> cells <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cells<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;A&quot;</span><span class="token punctuation">,</span> <span class="token number">0.85</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cells<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;B&quot;</span><span class="token punctuation">,</span> <span class="token number">0.15</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cells<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;C&quot;</span><span class="token punctuation">,</span> <span class="token number">0.60</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cells<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;D&quot;</span><span class="token punctuation">,</span> <span class="token number">0.35</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
cells<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span><span class="token string">&quot;E&quot;</span><span class="token punctuation">,</span> <span class="token number">0.95</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>不同编码深度 <code>l = 3、4、5、6、7</code> 下的分配结果不再逐一列出，其共同点是：权重最高的 cell 始终占据 Gray 路径的起点，编码位宽随 l 增长而扩展，且相邻权重之间的 Hamming 距离恒为 1</p> <p>HVE 加密测试</p> <p>输入<code>I = {1, 0, 1}, T = {1, *, 1}</code> → 匹配成功</p> <p>输入<code>I = {1, 0, 1}, T = {1, *, 0}</code> → 匹配失败</p> <h4 id="gray-编码与图嵌入优化"><a href="#gray-编码与图嵌入优化" class="header-anchor">#</a> Gray 编码与图嵌入优化</h4> <p>Gray 编码（Gray Code，又称反射二进制码 RGC）是一种重新排列的二进制序列，使得相邻两个编码的 Hamming 距离恒为 1。普通二进制做不到这一点——7 → 8 就是<code>0111 → 1000</code>，四个比特全部翻转。电路设计、模拟转数字以及本文的密文匹配都希望相邻编号的变动尽量小，以避免跳变误差（glitch）、编码抖动和配对计算冗余</p> <p>3 位 Gray 编码与普通二进制的对比如下</p> <table><thead><tr><th>十进制</th> <th>二进制</th> <th>Gray 编码</th></tr></thead> <tbody><tr><td>0</td> <td>000</td> <td>000</td></tr> <tr><td>1</td> <td>001</td> <td>001</td></tr> <tr><td>2</td> <td>010</td> <td>011</td></tr> <tr><td>3</td> <td>011</td> <td>010</td></tr> <tr><td>4</td> <td>100</td> <td>110</td></tr> <tr><td>5</td> <td>101</td> <td>111</td></tr> <tr><td>6</td> <td>110</td> <td>101</td></tr> <tr><td>7</td> <td>111</td> <td>100</td></tr></tbody></table> <p>本文用它把空间网格（cell）编号映射成 HVE 支持的属性向量（如 6 位二进制），使物理上邻近的单元在 Hamming 空间中也彼此接近，从而为下面的图嵌入优化留出空间，最终让 Token 的非星号位更少、配对开销更低</p> <p>k-bit 的 Gray 编码空间共有 2^k 个编码点，可视为 k 维超立方体上的顶点（如<code>0000</code>、<code>0001</code>、<code>0011</code>…），每个顶点分配给一个 cell</p> <p><strong>图嵌入优化技术</strong></p> <blockquote><p>Graph Embedding</p></blockquote> <p>图嵌入要做的，就是把落入同一告警区域的 cell 在 k-cube 中重排到编码相近的位置，用 Binary-Reflected Gray（BRG）路径规则建立 Token 与空间位置的对应，从而压缩 Token 的非星号位、降低配对开销</p> <p>以一个 3×3 的城市网格为例，告警区域为 <code>{1, 2, 4, 5}</code>，网格编号如下</p> <div class="language-less line-numbers-mode"><pre class="language-less"><code>Grid <span class="token punctuation">(</span>cell layout<span class="token punctuation">)</span><span class="token punctuation">:</span>

[0] [1] [2]
[3] [4] [5]
[6] [7] [8]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>假设有一个告警区域，包含 cell 编号为</p> <div class="language-css line-numbers-mode"><pre class="language-css"><code><span class="token selector">Alert Zone:</span> <span class="token punctuation">{</span>1<span class="token punctuation">,</span> 2<span class="token punctuation">,</span> 4<span class="token punctuation">,</span> 5<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>原始做法：对 9 个 cell 直接编号并做 4 位二进制编码（2^4 = 16 &gt; 9），对应关系如下</p> <table><thead><tr><th>Cell</th> <th>Binary</th> <th>Gray Code</th></tr></thead> <tbody><tr><td>0</td> <td>0000</td> <td>0000</td></tr> <tr><td>1</td> <td>0001</td> <td>0001</td></tr> <tr><td>2</td> <td>0010</td> <td>0011</td></tr> <tr><td>3</td> <td>0011</td> <td>0010</td></tr> <tr><td>4</td> <td>0100</td> <td>0110</td></tr> <tr><td>5</td> <td>0101</td> <td>0111</td></tr> <tr><td>6</td> <td>0110</td> <td>0101</td></tr> <tr><td>7</td> <td>0111</td> <td>0100</td></tr> <tr><td>8</td> <td>1000</td> <td>1100</td></tr></tbody></table> <p>此时 <code>cell 1</code> 为 <code>0001</code>、<code>cell 5</code> 为 <code>0111</code>，二者 Hamming 距离为 2，意味着 Token 至少要两个非星号位。重排后的编码如下</p> <table><thead><tr><th>Cell</th> <th>Optimized Gray Code</th></tr></thead> <tbody><tr><td>1</td> <td>0000</td></tr> <tr><td>2</td> <td>0001</td></tr> <tr><td>4</td> <td>0011</td></tr> <tr><td>5</td> <td>0010</td></tr> <tr><td>0</td> <td>0110</td></tr> <tr><td>3</td> <td>0111</td></tr> <tr><td>6</td> <td>0101</td></tr> <tr><td>7</td> <td>0100</td></tr> <tr><td>8</td> <td>1100</td></tr></tbody></table> <p>这样，告警区域中所有点<code>{1,2,3,5}</code>之间的 Hamming 距离最多为 2，用于搜索的 Token 只需要最多 2 个非星号位</p> <h4 id="三种启发式优化算法"><a href="#三种启发式优化算法" class="header-anchor">#</a> 三种启发式优化算法</h4> <p>三个算法做的是同一件事——把高概率 cell 压进 Gray 编码空间中彼此靠近的位置，区别只在规模适应策略</p> <table><thead><tr><th>算法</th> <th>策略</th> <th>适用规模</th> <th>特性</th></tr></thead> <tbody><tr><td><strong>GO</strong></td> <td>单种子沿 Gray 路径贪心分配</td> <td>小规模，精确嵌入</td> <td>O(n)，不可并行</td></tr> <tr><td><strong>MSGO</strong></td> <td>按 <code>depth</code> 分簇，每簇独立跑 GO 后合并</td> <td>中等规模</td> <td>O(n)，可并行</td></tr> <tr><td><strong>SGO</strong></td> <td>每个 cell 各自挑最近的未用编码，不维护路径</td> <td>大规模（1000+）</td> <td>O(n)，可并行</td></tr></tbody></table> <p><strong>Gray Optimizer</strong>：以概率最高的 cell 为种子置于路径起点，此后沿 Gray 路径逐点展开，每填入一个位置就取剩余 cell 中概率最大者，编码点只使用一次。4 个 cell 概率为 0.4/0.3/0.2/0.1 时，2-bit 编码按序分配为 <code>00,01,11,10</code>，恰好构成一条 Gray 路径，Token 只需 1~2 个非星号位即可同时命中它们。缺点是线性遍历无法处理大量 cell</p> <p><strong>Multiple Seed GO</strong>：cell 变多（100+）后 Gray 路径过长、冲突概率上升，单路径的局部最优也不再有效。MSGO 按概率排序后每 <code>depth</code> 个切为一簇，各簇独立执行 GO 再合并，用 <code>depth</code> 控制簇大小</p> <p><strong>Scaled GO</strong>：面对 1000+ cell，SGO 让每个 cell 都作为种子，各自挑“最接近”的未用编码，不再维护 Gray 路径结构——GO 中相邻两次分配的编码必定相邻且严格按概率降序，SGO 则可能给出 <code>0011, 0000, 0001</code> 这种不连续序列，本质是“稀疏散列式”分配。以 3 位空间 8 个点为例：概率最高的取 <code>000</code>，第二个挑与 <code>000</code> Hamming 距离最近的空位（<code>001</code>/<code>010</code>/<code>100</code> 任取其一），第三个取与已分配编码平均距离最小的点，依此类推</p> <p><strong>GO VS. SGO</strong>：GO 每步都要查邻接点、用优先队列挑概率最大的 cell，并保证路径不重复不跳跃，本质是图遍历 + 优先队列 + 贪心搜索；SGO 只需排序加标记数组，还能用预计算的 Hamming 距离矩阵并行分配。两者名义复杂度同为 O(n)，SGO 更轻量、更易实现、更缓存友好</p> <p><strong>复现：Gray 路径构建</strong></p> <blockquote><p>对 GO（Gray Optimizer）算法的复现，基于 Gray 编码路径的贪心式映射策略，能将高概率告警区域压缩进 Hamming 空间中的紧凑区域，减少 HVE Token 指定位数，从而降低查询成本</p></blockquote> <p>流程是：先算出完整的 Gray 路径，再按权重从高到低的顺序把 cell 依次分配上去。输入输出分别是区域权重集合<code>Map&lt;String, Double&gt;</code>与分配好的 Gray 编码<code>Map&lt;String, String&gt;</code></p> <p>Gray 路径就是一条相邻两码 Hamming 距离恒为 1 的序列，本质上是 k 维超立方体上的 <strong>Hamiltonian Path</strong>，3 位空间下的完整路径为</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>000 → 001 → 011 → 010 → 110 → 111 → 101 → 100
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>我们使用 <strong>Binary Reflected Gray Code（BRGC）</strong> 构造规则，它的思路是：递归生成 n 位 Gray 编码序列</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="31.736ex" height="7.692ex" role="img" focusable="false" viewBox="0 -1950 14027.4 3400" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.281ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43A" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q492 659 471 656T418 643T357 615T294 567T236 496T189 394T158 260Q156 242 156 221Q156 173 170 136T206 79T256 45T308 28T353 24Q407 24 452 47T514 106Q517 114 529 161T541 214Q541 222 528 224T468 227H431Q425 233 425 235T427 254Q431 267 437 273H454Q494 271 594 271Q634 271 659 271T695 272T707 272Q721 272 721 263Q721 261 719 249Q714 230 709 228Q706 227 694 227Q674 227 653 224Q646 221 643 215T629 164Q620 131 614 108Q589 6 586 3Q584 1 581 1Q571 1 553 21T530 52Q530 53 528 52T522 47Q448 -22 322 -22Q201 -22 126 55T50 252Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(786,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1175,0)"><path data-c="1D45B" d="M21 28 48Q112 589 98 597T83 616ZM84 -118Q84 -108 99 -98H678Q694 -104 694 -118Q694 -130 679 -138H98Q84 -131 84 -118Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(13078.8,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>f</mi><mo stretchy="false">(</mo><msub><mi>q</mi><mi>i</mi></msub><mo>,</mo><mi>d</mi><mo stretchy="false">)</mo><mo stretchy="false">⇒</mo><mo stretchy="false">(</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>q</mi><mi>i</mi></msub><mo>,</mo><mi>d</mi><mo stretchy="false">)</mo><mo>+</mo><mi>a</mi><mo stretchy="false">)</mo><mstyle scriptlevel="0"><mspace width="1em"></mspace></mstyle><mi>a</mi><mo>≥</mo><mn>0</mn></math></mjx-assistive-mml></mjx-container><h3 id="索引构建"><a href="#索引构建" class="header-anchor">#</a> 索引构建</h3> <h4 id="文档读入"><a href="#文档读入" class="header-anchor">#</a> 文档读入</h4> <p>通过维护的文档名序列从本地读入文件：<code>List&lt;String&gt; names</code> 存名字、<code>Map&lt;String,String&gt; docs</code> 存内容、<code>Map&lt;String,Integer&gt; id</code> 记录各文档在索引矩阵 matrix 中的列下标。读入过程如下</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">int</span> count <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token operator">:</span> names<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">// 从文件中读入文档</span>
    docs<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>name<span class="token punctuation">,</span> <span class="token class-name">IOUtil</span><span class="token punctuation">.</span><span class="token function">readDocs</span><span class="token punctuation">(</span>name<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 记录文档并且规定其在矩阵 matrix 中对应的下标</span>
    id<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>name<span class="token punctuation">,</span> count<span class="token operator">++</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>同时记录文档个数 N，并用向量 d 记录各文档的词总数（按空格分割），据此计算文档集的平均词数</p> <h4 id="关键词提取"><a href="#关键词提取" class="header-anchor">#</a> 关键词提取</h4> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.hankcs<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>hanlp<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>portable-1.7.6<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>分词依赖 hanlp（见 DocsUtil.java 的 getKeyword()），提取的关键词存入 Map：既用于去重，也用其值记录在 matrix 中的行下标</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>count <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token comment">// 从 docs 表中取出文档内容</span>
<span class="token comment">// 通过分词算法提取关键词并存入 keyword 表，值为其在二维数组 matrix 中的下标</span>
<span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> content<span class="token operator">:</span> docs<span class="token punctuation">.</span><span class="token function">values</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">&gt;</span></span> l <span class="token operator">=</span> <span class="token class-name">DocsUtil</span><span class="token punctuation">.</span><span class="token function">getKeyword</span><span class="token punctuation">(</span><span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> content<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> s<span class="token operator">:</span> l<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token operator">!</span>keyword<span class="token punctuation">.</span><span class="token function">containsKey</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token comment">// 放入关键词，同时规定关键词在矩阵 matrix 中的下标</span>
            keyword<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> count<span class="token operator">++</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 统计关键词在文档中出现次数</span>
            n<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
            <span class="token comment">// 更新关键词在各文档中的出现次数</span>
            n<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> n<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
matrix <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">String</span><span class="token punctuation">[</span>keyword<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">]</span><span class="token punctuation">[</span>id<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
<span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> q<span class="token operator">:</span> keyword<span class="token punctuation">.</span><span class="token function">keySet</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">// matrix 行</span>
    <span class="token keyword">int</span> i <span class="token operator">=</span> keyword<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>q<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">String</span> s<span class="token operator">:</span> id<span class="token punctuation">.</span><span class="token function">keySet</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token comment">// matrix 列</span>
        <span class="token keyword">int</span> j <span class="token operator">=</span> id<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 计算 R</span>
        <span class="token keyword">double</span> idf <span class="token operator">=</span> <span class="token class-name">Math</span><span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token class-name">N</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">/</span> <span class="token punctuation">(</span>n<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>q<span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">0.5</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 计算第 i 个关键词在第 j 个文档中的出现频率</span>
        <span class="token keyword">int</span> f <span class="token operator">=</span> <span class="token class-name">DocsUtil</span><span class="token punctuation">.</span><span class="token function">getMatch</span><span class="token punctuation">(</span>q<span class="token punctuation">,</span> docs<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>s<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 若为长文档，需要额外处理 f，加一个常数 a=1</span>
        <span class="token keyword">if</span><span class="token punctuation">(</span>d<span class="token punctuation">[</span>j<span class="token punctuation">]</span> <span class="token operator">&gt;</span> <span class="token number">400</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            f <span class="token operator">+=</span> a<span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">double</span> <span class="token class-name">R</span> <span class="token operator">=</span> <span class="token punctuation">(</span>idf <span class="token operator">*</span> <span class="token punctuation">(</span>f <span class="token operator">*</span> <span class="token punctuation">(</span>k1<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">/</span> <span class="token punctuation">(</span>f <span class="token operator">+</span> k1 <span class="token operator">*</span> <span class="token punctuation">(</span><span class="token number">1</span> <span class="token operator">-</span> b <span class="token operator">+</span> b <span class="token operator">*</span> d<span class="token punctuation">[</span>j<span class="token punctuation">]</span> <span class="token operator">/</span> avg<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token operator">*</span> <span class="token punctuation">(</span>f <span class="token operator">*</span> <span class="token punctuation">(</span>k3 <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">/</span> <span class="token punctuation">(</span>k3 <span class="token operator">+</span> f<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 加密存储</span>
        <span class="token class-name">String</span> encode <span class="token operator">=</span> <span class="token class-name">VFEPlusUtil</span><span class="token punctuation">.</span><span class="token function">encode</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token keyword">int</span><span class="token punctuation">)</span><span class="token class-name">R</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        matrix<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">[</span>j<span class="token punctuation">]</span> <span class="token operator">=</span> encode<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
