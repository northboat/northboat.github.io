,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://bugstack.cn/md/spring/develop-spring/2021-05-16-%E7%AC%AC1%E7%AB%A0%EF%BC%9A%E5%BC%80%E7%AF%87%E4%BB%8B%E7%BB%8D%EF%BC%8C%E6%89%8B%E5%86%99Spring%E8%83%BD%E7%BB%99%E4%BD%A0%E5%B8%A6%E6%9D%A5%E4%BB%80%E4%B9%88%EF%BC%9F.html" target="_blank" rel="nofollow noopener noreferrer">第01章：开篇介绍，我要带你撸 Spring 啦！ | 小傅哥 bugstack 虫洞栈<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="简单的-bean-管理"><a href="#简单的-bean-管理" class="header-anchor">#</a> 简单的 Bean 管理</h2> <p>IoC 容器：由 BeanDefinitionMap、BeanFactoryPostProcessor、BeanPostProcessor、BeanMap 等等容器共同组成、共同完成、提供依赖注入和控制反转功能的一组集合</p> <h3 id="反射和动态代理"><a href="#反射和动态代理" class="header-anchor">#</a> 反射和动态代理</h3> <blockquote><p>反射和动态代理是实现 IoC 控制反转和 Bean 管理的核心技术和思路</p></blockquote> <p>反射：从字节码获取类信息，从而反向构造对象的过程</p> <ul><li>通过类名（字符串）去拿取字节码信息，再通过解析字节码中包含的类信息（如类名、方法、字段等元数据）来实现对类的动态操作，如创建、方法调用等</li> <li>这是一个反向构造的过程，在 Spring 中，多用注解的形式，对所有的对象进行一个反向构造和统一管理，即 IoC 的实现</li></ul> <p>一个正向构造的例子</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Apple</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">//直接初始化，「正射」</span>
apple<span class="token punctuation">.</span><span class="token function">setPrice</span><span class="token punctuation">(</span><span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>两个反射创建对象的例子</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 通过 Class 对象的 newInstance 方法</span>
<span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>clz<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 通过 Constructor 对象 newInstance 方法</span>
<span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Constructor</span> constructor <span class="token operator">=</span> clz<span class="token punctuation">.</span><span class="token function">getConstructor</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>constructor<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>通过 Constructor 对象创建类对象可以选择特定构造方法，而通过 Class 对象则只能使用默认的无参数构造方法</p> <p>下面的代码调用了一个有参数的构造方法进行了类对象的初始化</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Class</span> clz <span class="token operator">=</span> <span class="token class-name">Apple</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">;</span>
<span class="token class-name">Constructor</span> constructor <span class="token operator">=</span> clz<span class="token punctuation">.</span><span class="token function">getConstructor</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> <span class="token keyword">int</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token class-name">Apple</span> apple <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">Apple</span><span class="token punctuation">)</span>constructor<span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token string">&quot;红富士&quot;</span><span class="token punctuation">,</span> <span class="token number">15</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这两种方法其本质上都是 Method.invoke 的交互，但是其具体实现方式在内部有两种</p> <ul><li>C++ native 原生实现：Native 版本一开始启动快，但是随着运行时间边长，速度变慢</li> <li>Java 实现：Java 版本一开始加载慢，但是随着运行时间边长，速度变快</li> <li>JDK 源码使用了代理的设计模式（一个接口，两种代理实现）去进行优化：第一次类加载使用<code>NativeMethodAccessorImpl</code>，当反射调用超 15 次后，使用<code>MethodAccessorGenerator</code>生成的<code>MethodAccessorImpl</code>对象实现反射</li></ul> <p>动态代理</p> <ul><li>动态：类的创建是动态进行的，在需要时才进行创建，而不是一开始全部 new 好</li> <li>代理：有代理，就有原主，这里的代理和代理模式中的代理有相似之处，例如一个父类接口，有两个子类实现，这两个子类就是父类的代理（在实例化时，创建的是父类，实例化的是子类代理）</li></ul> <p>动态代理的实现和反射机制、字节码增加技术息息相关，常常被应用于 IoC / AOP 场景</p> <h3 id="java-record"><a href="#java-record" class="header-anchor">#</a> Java record</h3> <p><strong>com.northboat.winterframework.beans.factory.config.BeanDefinition</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>record 是 Java 14 引入的语法糖，用于简化数据类，包括自动的构造方法、字段访问、<code>equals()</code>、<code>hashCode()</code>、<code>toString</code>，本质是隐式的 final 类</p> <blockquote><p><a href="https://juejin.cn/post/7515379500152635418" target="_blank" rel="nofollow noopener noreferrer">一文搞懂 Java Record：从入门到避坑，解锁高效编程新姿势！ - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>以上 record 等价于</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">class</span> <span class="token class-name">BeanDefinition</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Object</span> bean<span class="token punctuation">;</span>
    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">this</span><span class="token punctuation">.</span>bean <span class="token operator">=</span> bean<span class="token punctuation">;</span> <span class="token punctuation">}</span>
    <span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token keyword">return</span> bean<span class="token punctuation">;</span> <span class="token punctuation">}</span>
    <span class="token comment">// ... equals(), toString()</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="beanfactory-单例"><a href="#beanfactory-单例" class="header-anchor">#</a> BeanFactory 单例</h3> <p>BeanFactory：维护一个<code>Map&lt;String, BeanDefinition&gt; beanDefinitionMap</code>，通过类名返回对应的<code>BeanDefinition.bean()</code></p> <p>通过 Class 类进行对象的自动创建，复杂的继承设计（司马了），BeanDefinition 中的 Bean 改为 Class 类型，在 Bean Factory 中维护两个核心的 Map</p> <ul><li><code>Map&lt;String, Object&gt; singletonObjects</code>存放已实例化的单例对象</li> <li><code>Map&lt;String, BeanDefinition&gt; beanDefinitionMap</code>存放 Bean 的类 Class 信息，用于 Bean 对象的自动实例化</li></ul> <p>核心思路是：在 getBean 时，先从单例表<code>singletonObjects</code>中 get，若没有，则根据 Bean 信息表<code>beanDefinitionMap</code>中的类信息进行 createBean 并放入单例表</p> <img src="/assets/img/spring-3-02.9ecce121.png"> <p>这里存在一个单例的并发管理问题，即用于存放单例对象或者 Bean 信息的哈希表是否要采用 ConcurrentHashMap，Spring 源码中</p> <ul><li><code>DefaultSingletonBeanRegistry</code>的<code>singletonObjects</code>是<code>ConcurrentHashMap</code></li> <li><code>DefaultListableBeanFactory</code>的<code>beanDefinitionMap</code>是普通<code>HashMap</code>，但通过<code>beanDefinitionLock</code>锁保证线程安全</li> <li>获取 Bean 时通过<code>getSingleton()</code>方法结合双重检查锁 + 同步块确保单例</li></ul> <p>这是由于</p> <ol><li><code>beanDefinitionMap</code>在起 Bean 时，scan Class 类就完成了写，在之后均为读操作，不涉及频繁的读写交替</li> <li>而单例表<code>singletonObjects</code>除了频繁的读任务，当找不到对象时，还要被<code>beanDefinitionMap</code>写，所以采用安全但效率低的 ConcurrentHashMap</li></ol> <p>另外还有一个问题，上面也说了，BeanDefinition 存放<code>Class bean</code>，在通过 BeanDefinition 创建对象时，采用 newInstance 的方式，这个方法在 Java 9 就已废弃，并且无法接受含入参的对象创建</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token keyword">try</span> <span class="token punctuation">{</span>
    bean <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getBeanClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">newInstance</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InstantiationException</span> <span class="token operator">|</span> <span class="token class-name">IllegalAccessException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h2 id="含参构造和属性注入"><a href="#含参构造和属性注入" class="header-anchor">#</a> 含参构造和属性注入</h2> <h3 id="通过反射实例化实现含参构造"><a href="#通过反射实例化实现含参构造" class="header-anchor">#</a> 通过反射实例化实现含参构造</h3> <p>接入实例化策略 InstantiationStrategy</p> <img src="/assets/img/spring-4-02.931527f1.png"> <p>实例化策略接口</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">InstantiationStrategy</span> <span class="token punctuation">{</span>
    <span class="token comment">// 初始化 Bean</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>在下层 AbstractBeanFactory 中对 getBean 进行改写</p> <p><strong>com.northboat.winterframework.beans.factory.support.BeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractBeanFactory</span> <span class="token keyword">extends</span> <span class="token class-name">DefaultSingletonBeanRegistry</span> <span class="token keyword">implements</span> <span class="token class-name">BeanFactory</span> <span class="token punctuation">{</span>

<span class="token punctuation">}</span>

<span class="token keyword">protected</span> <span class="token keyword">abstract</span> <span class="token class-name">BeanDefinition</span> <span class="token function">getBeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span><span class="token punctuation">;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>createBean 逻辑在更下层的 AbstractAutowireCapableBeanFactory 的<code>createBeanInstance()</code>中实现，以此实现自动装配</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractAutowireCapableBeanFactory</span> <span class="token keyword">extends</span> <span class="token class-name">AbstractBeanFactory</span><span class="token punctuation">{</span>

        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">Constructor</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> ctor<span class="token operator">:</span> declaredConstructors<span class="token punctuation">)</span><span class="token punctuation">{</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这里需要略过一个 JDK 的安全策略，在 JDK 9 及以后，引入了更加严格的安全策略，不允许 CGLib 如此简单的创建代理类</p> <p>需要在编译命令处（<code>run</code>→<code>edit configurations</code>或者运行小箭头处点击三个浮点而后<code>edit</code>）的<code>Build and run</code>后缀添加</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>--add-opens java.base/java.lang<span class="token operator">=</span>ALL-UNNAMED
--add-opens java.base/java.lang.reflect<span class="token operator">=</span>ALL-UNNAMED
--add-opens java.base/java.security<span class="token operator">=</span>ALL-UNNAMED
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>当然用 JDK 8 不会遇到这个问题</p> <h3 id="属性注入和-bean-依赖"><a href="#属性注入和-bean-依赖" class="header-anchor">#</a> 属性注入和 Bean 依赖</h3> <p>对 BeanDefinition 进行进一步的改造</p> <ul><li>这是创建 Bean 对象的核心，包含对象的 Class 定义</li> <li>在这一阶段将引入对象的属性列表 PropertyValues，以便进行更深层次的初始化</li></ul> <p>这里暂不考虑 Bean 的循环依赖问题（让我想起 JVM 的类加载，双亲委派模型，“向上委派，向下查找”），只进行简单的对象属性注入和 Bean 对象依赖，即，在创建 Bean 时，同时填充该类的内置属性和内置的 Bean 对象</p> <img src="/assets/img/spring-5-01.c11361cb.png"> <h4 id="propertyvalues"><a href="#propertyvalues" class="header-anchor">#</a> PropertyValues</h4> <p>首先我们要让 BeanDefinition “拥有属性”，这一步很重要，通过一个<code>List&lt;PropertyValue&gt;</code>和<code>record PropertyValue(String name, Object value)</code>来实现</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">,</span> <span class="token class-name">Object</span> value<span class="token punctuation">)</span><span class="token punctuation">{</span> <span class="token comment">/* 省略一些 setter/getter */</span> <span class="token punctuation">}</span>
<span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">PropertyValue</span><span class="token punctuation">&gt;</span></span> propertyValueList<span class="token punctuation">)</span> <span class="token punctuation">{</span> <span class="token comment">/* 省略一些 setter/getter */</span> <span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>改写 BeanDefinition，自此一个 BeanDefinition 除了包含对应 Bean 的 Class 类，还包含其所有内置属性的信息（Bean 对象将被标注为 BeanReference）</p> <p><strong>com.northboat.winterframework.beans.factory.config.BeanDefinition</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BeanDefinition</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">PropertyValues</span> propertyValues<span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>beanClass <span class="token operator">=</span> beanClass<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">public</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> beanClass<span class="token punctuation">,</span> <span class="token class-name">PropertyValues</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>beanClass <span class="token operator">=</span> beanClass<span class="token punctuation">;</span>
        <span class="token comment">// 若传入的 propertyValues 为空，则创建一个空的 propertyValues</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>propertyValues <span class="token operator">=</span> propertyValues <span class="token operator">!=</span> <span class="token keyword">null</span> <span class="token operator">?</span> propertyValues <span class="token operator">:</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// setter and getter...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>改写后的 BeanDefinition 将维护</p> <ul><li>当前 Bean 对应的 Class 类，用于 Bean 的创建</li> <li>一个<code>List&lt;Pair&lt;String, Object&gt;&gt;</code>的数据结构（<code>PropertyValues</code>），是当前 Bean 的属性列表，相当于属性填充的模板</li></ul> <h4 id="bean-依赖关系"><a href="#bean-依赖关系" class="header-anchor">#</a> Bean 依赖关系</h4> <p>即在一个 Bean 中，存在某个内置属性，同样是一个 Bean</p> <p>在 PropertyValues 中，对于 Bean 对象的表示（即当前 Bean 的内置属性包含另一个 Bean），用 BeanReference 来实现</p> <p>com.northboat.winterframework.beans.factory.config.BeanReference</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">record</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>它只需要包含 Bean 引用的名字就行，譬如 UserService 含有 UserDao 这样一个 Bean</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserService</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> uId<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">UserDao</span> userDao<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>那么在其对应的 BeanDefinition 中的 PropertyValues，就会有一项</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 将 Bean 属性写入 propertyValues</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>而后，显然，填充属性是在 Bean 对象创建之后的一个操作，于是我们改动 createBean 的实现即可（在<code>AbstractAutowireCapableBeanFactory</code>中），在<code>createBeanInstance</code>后对创建的 Bean 对象进行属性填充</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>
<span class="token keyword">protected</span> <span class="token class-name">Object</span> <span class="token function">createBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">try</span> <span class="token punctuation">{</span>
        bean <span class="token operator">=</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 填充属性</span>
        <span class="token function">applyPropertyValues</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token function">addSingleton</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> bean<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>通过 hutool 的 BeanUtil 进行属性的填充</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">BeanUtil</span><span class="token punctuation">.</span><span class="token function">setFieldValue</span><span class="token punctuation">(</span><span class="token class-name">Object</span> bean<span class="token punctuation">,</span> <span class="token class-name">String</span> name<span class="token punctuation">,</span> <span class="token class-name">Object</span> value<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>以上函数将属性<code>name: value</code>填充至对象<code>bean</code>中</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">protected</span> <span class="token keyword">void</span> <span class="token function">applyPropertyValues</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span> bean<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        <span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> beanDefinition<span class="token punctuation">.</span><span class="token function">getPropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token class-name">PropertyValue</span> propertyValue<span class="token operator">:</span> propertyValues<span class="token punctuation">.</span><span class="token function">getPropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token class-name">String</span> name <span class="token operator">=</span> propertyValue<span class="token punctuation">.</span><span class="token function">name</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">Object</span> value <span class="token operator">=</span> propertyValue<span class="token punctuation">.</span><span class="token function">value</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

            <span class="token comment">// 这里只是一个简单的模拟</span>
            <span class="token comment">// 就是说，如果当前的属性是 beanReference 的一个引用，说明这个属性也是一个 Bean</span>
            <span class="token comment">// 那么就直接从 Map 中 getBean 以获取这个 Bean 的实例化对象</span>
            <span class="token keyword">if</span><span class="token punctuation">(</span>value <span class="token keyword">instanceof</span> <span class="token class-name">BeanReference</span> beanReference<span class="token punctuation">)</span><span class="token punctuation">{</span>
                <span class="token comment">// 如果 A 依赖于 B，获取 B 的实例化</span>
                value <span class="token operator">=</span> <span class="token function">getBean</span><span class="token punctuation">(</span>beanReference<span class="token punctuation">.</span><span class="token function">beanName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token class-name">BeanUtil</span><span class="token punctuation">.</span><span class="token function">setFieldValue</span><span class="token punctuation">(</span>bean<span class="token punctuation">,</span> name<span class="token punctuation">,</span> value<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Error setting property values: &quot;</span> <span class="token operator">+</span> beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>测试代码</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Test</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">testBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

    <span class="token class-name">DefaultListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultListableBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 注册 UserDao</span>
    beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserDao</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 设置内置属性 uId 和 userDao</span>
    <span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;uId&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;10001&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 注册 UserService 并将内置属性注入</span>
    <span class="token class-name">BeanDefinition</span> userServiceBean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">;</span>
    beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> userServiceBean<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// 获取 UserService Bean</span>
    <span class="token class-name">UserService</span> userService <span class="token operator">=</span> <span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">)</span> beanFactory<span class="token punctuation">.</span><span class="token function">getBean</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    userService<span class="token punctuation">.</span><span class="token function">queryUserInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>在构造 UserService 这个 Bean 时，根据他的 BeanDefinition，就会通过他内置的 PropertyValues 进行属性填充，例如</p> <ul><li>把<code>10001</code>填充进 UserService 的<code>uId</code>字段</li> <li>把<code>getBean(&quot;userDao&quot;)</code>填充进<code>userDao</code>字段（这里是一个对 Bean 的特殊处理，具体可以看<code>applyPropertyValues()</code>的代码）</li></ul> <p>输出</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>Querying user info of 10001: northboat
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>说明 UserDao 被正常注入（<code>queryUserInfo()</code>正常调用返回<code>northboat</code>），uId 也被正常注入（查询的是用户<code>10001</code>）</p> <img src="/assets/img/image-20251124195822799.c6de24e1.png"> <p>打断点发现 UserDao 明显是 CGLib 生成的对象，说明在注入 UserDao 时进行了<code>getBean(&quot;userDao&quot;)</code>并触发了 UserDao 的 createBean</p> <p>这个 Bean 套 Bean 的自动注入有点优雅了，<code>getBean</code>的自动套娃实现</p> <h2 id="资源加载器和-xml-解析器"><a href="#资源加载器和-xml-解析器" class="header-anchor">#</a> 资源加载器和 XML 解析器</h2> <p>设计目标：将 Bean 的注册通过 xml 配置文件自动化实现，把以下的三个步骤，通过 Spring 配置文件的方式将 Bean 对象实例化</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 注册 UserDao</span>
beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserDao</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 设置内置属性 uId 和 userDao</span>
<span class="token class-name">PropertyValues</span> propertyValues <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">PropertyValues</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;uId&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;10001&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
propertyValues<span class="token punctuation">.</span><span class="token function">addPropertyValue</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">PropertyValue</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">,</span> <span class="token keyword">new</span> <span class="token class-name">BeanReference</span><span class="token punctuation">(</span><span class="token string">&quot;userDao&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// 注册 UserService 并将内置属性注入</span>
<span class="token class-name">BeanDefinition</span> userServiceBean <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">BeanDefinition</span><span class="token punctuation">(</span><span class="token class-name">UserService</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> propertyValues<span class="token punctuation">)</span><span class="token punctuation">;</span>
beanFactory<span class="token punctuation">.</span><span class="token function">registerBeanDefinition</span><span class="token punctuation">(</span><span class="token string">&quot;userService&quot;</span><span class="token punctuation">,</span> userServiceBean<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>问题的重点是：添加能解决 Spring 配置的读取、解析、注册 Bean 的操作</p> <h3 id="资源加载模块"><a href="#资源加载模块" class="header-anchor">#</a> 资源加载模块</h3> <img src="/assets/img/spring-6-02.2d4ae51e.png"> <p>上图描述了一个资源加载器的架构模块和功能</p> <p>那么在实际操作中，如何将这个“资源加载系统”接入现有的 Bean Factory？</p> <p>答案是：通过<code>BeanDefinitionRegistry</code>接口进行接入</p> <ul><li>在之前的代码中，<code>BeanDefinitionRegistry</code>早已提供了<code>registerBeanDefinition</code>方法，并在下层中实现（将 BeanDefinition 存入相应的 Map 中）。那么理论上，我只需要在资源加载器中传入这个 Map，就可以将解析出来的 Bean 信息进行 put</li> <li>或者更方便的方法是，直接传入一个<code>BeanDefinitionRegistry</code>，在解析时直接调用<code>registerBeanDefinition</code>将 Bean 注册到这个<code>BeanDefinitionRegistry</code>的 Map 中</li></ul> <p>这样处理不会影响下层其他功能的实现，即仅修改注册和与获取无关，无需修改<code>getBean/createBean</code> 的任何代码</p> <img src="/assets/img/spring-6-03.ab9a33ad.png"> <p>现在我们尝试做一个 Bean 的注入器 Reader，将<code>BeanDefinitionRegistry</code>和<code>ResourceLoader</code>注入，并实现 Bean 的加载</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractBeanDefinitionReader</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractBeanDefinitionReader</span> <span class="token keyword">implements</span> <span class="token class-name">BeanDefinitionReader</span> <span class="token punctuation">{</span>    
    <span class="token keyword">public</span> <span class="token class-name">AbstractBeanDefinitionReader</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinitionRegistry</span> registry<span class="token punctuation">,</span> <span class="token class-name">ResourceLoader</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>registry <span class="token operator">=</span> registry<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>resourceLoader <span class="token operator">=</span> resourceLoader<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
   
    <span class="token comment">// getRegistry() / getResourceLoader() 略</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>这一层仅进行注册器和加载器的构造，不进行具体的实现，我发现一个规律，Java 的一个接口设计</p> <ul><li>最上层是一个或多个 interface，将所有需要的方法罗列</li> <li>中间是多层 abstract class，会将上层接口的方法<strong>逻辑实现</strong>，像是一层伪码，会声明真正干事的代码方法，但逻辑仍留给下层实现</li> <li>下层是一个或多个 class，这一层会把所有的方法逻辑都实现</li></ul> <p>在下层进行<code>doLoadBeanDefinitions</code>逻辑的实现</p> <p><strong>com.northboat.winterframework.beans.factory.xml.XmlBeanDefinitionReader</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">XmlBeanDefinitionReader</span> <span class="token keyword">extends</span> <span class="token class-name">AbstractBeanDefinitionReader</span> <span class="token punctuation">{</span>
     <span class="token keyword">public</span> <span class="token class-name">XmlBeanDefinitionReader</span><span class="token punctuation">(</span><span class="token class-name">BeanDefinitionRegistry</span> registry<span class="token punctuation">,</span> <span class="token class-name">ResourceLoader</span> resourceLoader<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">super</span><span class="token punctuation">(</span>registry<span class="token punctuation">,</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token comment">// loadBeanDefinitions(Resource resource)</span>
    <span class="token comment">// loadBeanDefinitions(Resource... resources)</span>
    <span class="token comment">// loadBeanDefinitions(String location)</span>
    <span class="token comment">// doLoadBeanDefinitions(InputStream inputStream)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>在具体的使用中，我们先创建一个<code>DefaultListableBeanFactory</code>（这个类同时继承了 BeanFactory 和 BeanDefinitionRegistry）和一个 ResourceLoader</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 1.初始化 BeanFactory</span>
<span class="token class-name">DefaultListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultListableBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token class-name">DefaultResourceLoader</span> resourceLoader <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">DefaultResourceLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>而后将这俩一起丢到加载器中进行 Bean 加载</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 2. 读取配置文件&amp;注册Bean</span>
<span class="token class-name">XmlBeanDefinitionReader</span> reader <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">XmlBeanDefinitionReader</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">,</span> resourceLoader<span class="token punctuation">)</span><span class="token punctuation">;</span>
reader<span class="token punctuation">.</span><span class="token function">loadBeanDefinitions</span><span class="token punctuation">(</span><span class="token string">&quot;classpath:winter.xml&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>实际上就是：<code>XmlBeanDefinitionReader</code>通过<code>ResourceLoader</code>解析配置为一个个 BeanDefinition，然后将其 put 到<code>BeanDefinitionRegistry</code>对应的<code>Map&lt;String, BeanDefinition&gt;</code>里</p> <h3 id="泛型-getbean"><a href="#泛型-getbean" class="header-anchor">#</a> 泛型 getBean</h3> <p>晕了，别急，到这里已经可以实现类的自动加载，但现在引入一个新的需求，我想要的 getBean 的时候，自动返回对应的对象，而不是 Object 对象，即实现一个泛型<code>&lt;T&gt; T</code>的 getBean 方法，这里需要修改最上层位于 BeanFactory 接口的 getBean，而后在 AbstractBeanFactory 中进行具体的实现</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>interface BeanFactory
+ &lt;T&gt; T getBean(String name, Class&lt;T&gt; requiredType)
↓
abstract class AbstractBeanFactory
+ &lt;T&gt; T getBean(String name, Class&lt;T&gt; requiredType)
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>其实实现很简单，就是将传入的<code>Class&lt;T&gt; requiredType</code>对原先返回 Object 的 getBean 进行一个强转</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> <span class="token class-name">T</span> <span class="token function">getBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">T</span><span class="token punctuation">&gt;</span></span> type<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token punctuation">(</span><span class="token class-name">T</span><span class="token punctuation">)</span> <span class="token function">getBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>这个泛型传递形式第一次见，传入一个<code>Class&lt;T&gt; type</code>，编译器会自动解析 T 为 type 的对象类型</p> <p>再然后，为了在后续扩展功能，仿照 Spring 的设计结构，引入更多的接口和继承，这里和 Bean 的配置加载以及泛型的返回都没啥关系，只是为了后续的扩展</p> <img src="/assets/img/spring-6-04.3ea64457.png"> <p>好，以上就是本次迭代的需求，在这一步我已经不能自己管理包结构了，有点复杂了，我需要照着教程来才能看懂</p> <p>现在的系统已经相当“冗余”了，至此的类继承关系如下图所示</p> <img src="/assets/img/xml-file-define-bean.5982e1a7.png"> <h2 id="应用上下文生命周期管理"><a href="#应用上下文生命周期管理" class="header-anchor">#</a> 应用上下文生命周期管理</h2> <p>Bean 的生命周期管理</p> <h3 id="applicationcontext"><a href="#applicationcontext" class="header-anchor">#</a> ApplicationContext</h3> <p>应用上下文是比 BeanFactory 更高级的 IoC 容器</p> <ul><li>BeanFactory 是 spring 的基础设施，面向 spring 本身</li> <li>而 ApplicationContext 面向 spring 的使用者，应用场合使用 ApplicationContext</li></ul> <p>“上下文”即指 Bean 的生命周期，即 bean 的加载，到注册、修改、实例化和扩展，当前 Bean 的生命周期如下图所示</p> <img src="/assets/img/application-context-life-cycle.acfabe82.png"> <p>在整个之前的代码中，实际上已经完成了 Bean 的加载、注册和实例化</p> <ol><li>这一节首先是在实现 Bean 实例化的前置和后置处理，给用户以扩展/修改 Bean 的接口</li> <li>而后将上述的五个步骤封装为一个完整的上下文 Context 供用户调用</li></ol> <p>在 Spring 中，提供了<code>BeanFactoryPostProcessor</code> 和 <code>BeanPostProcessor</code>（几乎是在使用 Spring 框架额外新增开发自己组建需求的两个必备接口）</p> <ul><li><code>BeanFactoryPostProcessor</code>：Bean 前置处理，允许 Bean 对象注册后、实例化前，对 Bean 的定义信息（<code>BeanDefinition</code>）进行修改</li> <li><code>BeanPostProcessor</code>：Bean 后置处理，在 Bean 对象实例化之后修改 Bean 对象，也可以替换 Bean 对象，这一操作与后面要实现的 AOP 有着密切的关系</li></ul> <img src="/assets/img/spring-7-02.aba9b503.png"> <p>Spring 应用上下文和对 Bean 对象扩展机制的类关系</p> <img src="/assets/img/spring-7-03.ffd6025a.png"> <p>这个继承我已经有点懵逼了说实话，照猫画虎了有点，我发现前面有写错的继承关系，居然没影响下层实现，绷不住了，这就是我们 Java</p> <h3 id="beanfactorypostprocessors"><a href="#beanfactorypostprocessors" class="header-anchor">#</a> BeanFactoryPostProcessors</h3> <p>代码的核心思路是：先提供两个函数接口，在 Context 中维护一个 Factory，通过 refresh 函数将 invokeBeanFactoryPostProcessors 和 registerBeanPostProcessors 过程注入到 Factory 中</p> <ul><li>前者会获取所有的 BeanFactoryPostProcessor，并调用其 postProcessBeanFactory 方法修改 Factory 中对应 BeanDefinition 的 PropertyValues（通过 addPropertyValue 方法）</li> <li>后者会获取所有的 BeanPostProcessor，并将其注册进 Factory 中的<code>List&lt;BeanPostProcessor&gt; beanPostProcessors</code>（通过 List 的 add 操作）</li></ul> <p><strong>com.northboat.winterframework.context.support.AbstractApplicationContext</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractApplicationContext</span> <span class="token keyword">extends</span> <span class="token class-name">DefaultResourceLoader</span> <span class="token keyword">implements</span> <span class="token class-name">ConfigurableApplicationContext</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">refresh</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
        <span class="token comment">// 重新创建 BeanFactory，并加载 BeanDefinition</span>
        <span class="token function">refreshBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">ConfigurableListableBeanFactory</span> beanFactory <span class="token operator">=</span> <span class="token function">getBeanFactory</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 注入 BeanFactoryPostProcessors</span>
        <span class="token function">invokeBeanFactoryPostProcessors</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 注入 BeanPostProcessors</span>
        <span class="token function">registerBeanPostProcessors</span><span class="token punctuation">(</span>beanFactory<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 初始化单例对象</span>
        beanFactory<span class="token punctuation">.</span><span class="token function">preInstantiateSingletons</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>可以发现，在这里 BeanFactoryPostProcessors 就已经起作用了，在实际上修改了<code>Map&lt;String, BeanDefinition&gt; beanDefinitionMap</code>中 BeanDefinition 的内容</p> <h3 id="beanpostprocessor"><a href="#beanpostprocessor" class="header-anchor">#</a> BeanPostProcessor</h3> <p>BeanPostProcessor 在这一步，只是注册到 List 中，真正起作用是在 creatBean 时</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 创建实例</span>
bean <span class="token operator">=</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 填充属性</span>
<span class="token function">applyPropertyValues</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">// 执行初始化方法和 BeanPostProcessor 的前置和后置处理方法</span>
bean <span class="token operator">=</span> <span class="token function">initializeBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>通过 initializeBean 方法执行对象创建的前置和后置操作</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">private</span> <span class="token class-name">Object</span> <span class="token function">initializeBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">Object</span> bean<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">// BeanPostProcessor Before 处理</span>
    <span class="token class-name">Object</span> wrappedBean <span class="token operator">=</span> <span class="token function">applyBeanPostProcessorsBeforeInitialization</span><span class="token punctuation">(</span>bean<span class="token punctuation">,</span> beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 待完成内容，调用初始化函数</span>
    <span class="token function">invokeInitMethods</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> wrappedBean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// After 处理</span>
    wrappedBean <span class="token operator">=</span> <span class="token function">applyBeanPostProcessorsAfterInitialization</span><span class="token punctuation">(</span>wrappedBean<span class="token punctuation">,</span> beanName<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> wrappedBean<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>至此封装了 Factory 到 Context 中，并通过 Context 维护了 Bean 的生命周期</p> <h3 id="初始化和销毁方法"><a href="#初始化和销毁方法" class="header-anchor">#</a> 初始化和销毁方法</h3> <p>在加载 Bean 的时候，在 xml 文件指定该 Bean 的初始化方法和销毁方法，并注入 Bean 的生命周期，显然，这一过程应该和 BeanPostProcessor 一样，作用于 createBean 时期</p> <img src="/assets/img/init-and-destroy-method.1a0cb3d0.png"> <h4 id="初始化方法注入"><a href="#初始化方法注入" class="header-anchor">#</a> 初始化方法注入</h4> <p>正如 initializeBean 方法，在初始化的前置和后置之间，预留了一个<code>invokeInitMethods(beanName, wrappedBean, beanDefinition)</code>方法用于注入初始化过程</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 待完成内容，调用初始化函数</span>
<span class="token function">invokeInitMethods</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> wrappedBean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>流程应该和加载属性类似，通过 XmlBeanDefinitionReader 从 xml 读入初始化和销毁方法，存放在 BeanDefinition 中，然后在初始化时，从 Class.getMethods 中 invoke 执行同名的初始化函数</p> <p><strong>com.northboat.winterframework.beans.factory.config.BeanDefinition</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BeanDefinition</span> <span class="token punctuation">{</span>
    <span class="token comment">// 用于创建的 Class 类</span>
    <span class="token keyword">private</span> <span class="token class-name">Class</span> beanClass<span class="token punctuation">;</span>
    <span class="token comment">// 对象的内置属性</span>
    <span class="token keyword">private</span> <span class="token class-name">PropertyValues</span> propertyValues<span class="token punctuation">;</span>
    <span class="token comment">// 初始化和销毁方法</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> initMethodName<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> destroyMethodName<span class="token punctuation">;</span>
    <span class="token comment">// ...get/set</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h4 id="销毁方法注入和执行"><a href="#销毁方法注入和执行" class="header-anchor">#</a> 销毁方法注入和执行</h4> <p>而销毁方法通过同样的 xml 方式进行注册、反射方式进行执行，在最上层提供一个<code>destroy</code>接口，这个接口的实现逻辑和 init 一样，通过方法名 invoke 反射执行</p> <p><strong>com.northboat.winterframework.beans.factory.DesposableBean</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">DisposableBean</span> <span class="token punctuation">{</span>
    <span class="token keyword">void</span> <span class="token function">destroy</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>那么如何触发这个 destroy 方法呢？答案是扩展单例 Bean 工厂</p> <p>因为最后在销毁的时候，实际上销毁的是<code>private Map&lt;String, Object&gt; singletonObjects</code>中的实例对象，我们重新引入一个数据结构<code>DisposableBeanAdapter</code></p> <p><strong>com.northboat.winterframework.beans.factory.support.DisposableBeanAdapter</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">DisposableBeanAdapter</span> <span class="token keyword">implements</span> <span class="token class-name">DisposableBean</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Object</span> bean<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">String</span> beanName<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> destroyMethodName<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>在这个结构中维护了单例 bean 对象和其对应的销毁方法，同时实现了<code>DispoableBean</code>的 destroy 方法，在单例注册工厂中，多维护一个 Map</p> <p><strong>com.northboat.winterframework.beans.factory.support.DefaultSingletonBeanRegistry</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">DefaultSingletonBeanRegistry</span> <span class="token keyword">implements</span> <span class="token class-name">SingletonBeanRegistry</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> singletonObjects <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">DisposableBean</span><span class="token punctuation">&gt;</span></span> disposableBeans <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><ul><li>注册时，每加入一个单例，同时往<code>desposableBeans</code>里加入其对应的<code>DisposableBeanAdapter</code></li> <li>在调用 destroy 方法时，通过 beanName 去这个 Map 中去找出对应 Bean 的<code>DesposableBeanAdapter</code>并执行 destroy</li></ul> <p>在 createBean 时去进行 put 操作</p> <p><strong>com.northboat.winterframework.beans.factory.support.AbstractAutowireCapableBeanFactory</strong></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">abstract</span> <span class="token keyword">class</span> <span class="token class-name">AbstractAutowireCapableBeanFactory</span> <span class="token keyword">extends</span> <span class="token class-name">AbstractBeanFactory</span> <span class="token keyword">implements</span> <span class="token class-name">AutowireCapableBeanFactory</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">protected</span> <span class="token class-name">Object</span> <span class="token function">createBean</span><span class="token punctuation">(</span><span class="token class-name">String</span> beanName<span class="token punctuation">,</span> <span class="token class-name">BeanDefinition</span> beanDefinition<span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">BeansException</span> <span class="token punctuation">{</span>
        <span class="token class-name">Object</span> bean <span class="token operator">=</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token comment">// 创建实例</span>
            bean <span class="token operator">=</span> <span class="token function">createBeanInstance</span><span class="token punctuation">(</span>beanDefinition<span class="token punctuation">,</span> beanName<span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 填充属性</span>
            <span class="token function">applyPropertyValues</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token comment">// 执行初始化方法和 BeanPostProcessor 的前置和后置处理方法</span>
            bean <span class="token operator">=</span> <span class="token function">initializeBean</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">BeansException</span><span class="token punctuation">(</span><span class="token string">&quot;Instantiation of bean failed&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token comment">// 注册实现了 DisposableBean 接口或者 destroyMethodName 字段不为空的 Bean 对象</span>
        <span class="token function">registerDisposableBeanIfNecessary</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">,</span> beanDefinition<span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token function">addSingleton</span><span class="token punctuation">(</span>beanName<span class="token punctuation">,</span> bean<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> bean<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
