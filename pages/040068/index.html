="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br><span class="line-number">73</span><br><span class="line-number">74</span><br><span class="line-number">75</span><br><span class="line-number">76</span><br><span class="line-number">77</span><br><span class="line-number">78</span><br><span class="line-number">79</span><br><span class="line-number">80</span><br><span class="line-number">81</span><br><span class="line-number">82</span><br><span class="line-number">83</span><br><span class="line-number">84</span><br><span class="line-number">85</span><br><span class="line-number">86</span><br><span class="line-number">87</span><br><span class="line-number">88</span><br><span class="line-number">89</span><br><span class="line-number">90</span><br><span class="line-number">91</span><br><span class="line-number">92</span><br><span class="line-number">93</span><br><span class="line-number">94</span><br><span class="line-number">95</span><br><span class="line-number">96</span><br><span class="line-number">97</span><br><span class="line-number">98</span><br><span class="line-number">99</span><br><span class="line-number">100</span><br><span class="line-number">101</span><br><span class="line-number">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br><span class="line-number">108</span><br><span class="line-number">109</span><br><span class="line-number">110</span><br><span class="line-number">111</span><br><span class="line-number">112</span><br><span class="line-number">113</span><br><span class="line-number">114</span><br><span class="line-number">115</span><br><span class="line-number">116</span><br><span class="line-number">117</span><br><span class="line-number">118</span><br><span class="line-number">119</span><br><span class="line-number">120</span><br><span class="line-number">121</span><br><span class="line-number">122</span><br><span class="line-number">123</span><br><span class="line-number">124</span><br><span class="line-number">125</span><br><span class="line-number">126</span><br><span class="line-number">127</span><br><span class="line-number">128</span><br><span class="line-number">129</span><br><span class="line-number">130</span><br><span class="line-number">131</span><br><span class="line-number">132</span><br><span class="line-number">133</span><br><span class="line-number">134</span><br><span class="line-number">135</span><br><span class="line-number">136</span><br><span class="line-number">137</span><br><span class="line-number">138</span><br><span class="line-number">139</span><br><span class="line-number">140</span><br><span class="line-number">141</span><br><span class="line-number">142</span><br><span class="line-number">143</span><br><span class="line-number">144</span><br><span class="line-number">145</span><br><span class="line-number">146</span><br><span class="line-number">147</span><br><span class="line-number">148</span><br><span class="line-number">149</span><br><span class="line-number">150</span><br><span class="line-number">151</span><br><span class="line-number">152</span><br><span class="line-number">153</span><br><span class="line-number">154</span><br><span class="line-number">155</span><br><span class="line-number">156</span><br><span class="line-number">157</span><br><span class="line-number">158</span><br><span class="line-number">159</span><br><span class="line-number">160</span><br><span class="line-number">161</span><br><span class="line-number">162</span><br><span class="line-number">163</span><br><span class="line-number">164</span><br><span class="line-number">165</span><br><span class="line-number">166</span><br><span class="line-number">167</span><br><span class="line-number">168</span><br><span class="line-number">169</span><br><span class="line-number">170</span><br><span class="line-number">171</span><br><span class="line-number">172</span><br><span class="line-number">173</span><br><span class="line-number">174</span><br><span class="line-number">175</span><br><span class="line-number">176</span><br><span class="line-number">177</span><br><span class="line-number">178</span><br><span class="line-number">179</span><br><span class="line-number">180</span><br><span class="line-number">181</span><br></div></div><h2 id="自测与联调"><a href="#自测与联调" class="header-anchor">#</a> 自测与联调</h2> <p>快速熟悉一个项目流程和审计的思路是一致的</p> <ol><li>配置环境把项目跑起来</li> <li>浏览器直接打开控制台点击按钮监控网络请求，看打的什么接口</li> <li>在对应项目的 route 中找到接口，一层层向下看接口实现逻辑</li></ol> <h3 id="curl-测试"><a href="#curl-测试" class="header-anchor">#</a> Curl 测试</h3> <p>改完 proto 先重新生成 pb 文件（在 <code>proto/web-server</code> 目录下执行）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>trpc create <span class="token parameter variable">--protofile</span><span class="token operator">=</span>web_server.proto <span class="token parameter variable">--rpconly</span> <span class="token parameter variable">--alias</span> <span class="token parameter variable">--goversion</span><span class="token operator">=</span><span class="token number">1.18</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>本地部署项目</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>go build <span class="token parameter variable">-o</span> main ./cmd/main.go
<span class="token assign-left variable">DEBUG</span><span class="token operator">=</span>true ./main <span class="token parameter variable">--local_config</span><span class="token operator">=</span>true <span class="token parameter variable">--config</span><span class="token operator">=</span>cfg
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>启动后先探活，确认服务起来了再打业务接口</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-i</span> http://localhost:8080/health
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>没有前端页面时，直接构造 curl 把整条链路走通：先备好环境数据，再按接口约定的 header 与 body 发请求。</p> <p>查看本机 ip</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">hostname</span> <span class="token parameter variable">-I</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查询 CMS dnat 状态，确认转发规则是否下发成功</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>nft list ruleset <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A20</span> port2backend
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>清理 CVM 中的脏规则</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>nft delete element inet nat port2backend <span class="token punctuation">{</span> <span class="token number">40008</span> <span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>从数据库挑一条 env 实例数据：状态 running，且 serverType 不是 vm 和 cvmContainer（这类才走 default 分支，触发目标逻辑）</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> 
    uid<span class="token punctuation">,</span>
    paasEnvironmentId<span class="token punctuation">,</span>
    environmentIp<span class="token punctuation">,</span>
    disableEniIp<span class="token punctuation">,</span>
    serverType<span class="token punctuation">,</span>
    <span class="token keyword">status</span><span class="token punctuation">,</span>
    username
<span class="token keyword">FROM</span> devEnvironmentInstance
<span class="token keyword">WHERE</span> disableEniIp <span class="token operator">=</span> <span class="token number">1</span>
  <span class="token operator">AND</span> <span class="token keyword">status</span> <span class="token operator">=</span> <span class="token string">'running'</span>
  <span class="token operator">AND</span> environmentIp <span class="token operator">IS</span> <span class="token operator">NOT</span> <span class="token boolean">NULL</span>
  <span class="token operator">AND</span> environmentIp <span class="token operator">&lt;&gt;</span> <span class="token string">''</span>
  <span class="token operator">AND</span> serverType <span class="token operator">NOT</span> <span class="token operator">IN</span> <span class="token punctuation">(</span><span class="token string">'vm'</span><span class="token punctuation">,</span> <span class="token string">'cvmContainer'</span><span class="token punctuation">)</span>   <span class="token comment">-- 走 default 分支才会触发 ssh proxy 逻辑</span>
<span class="token keyword">LIMIT</span> <span class="token number">10</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>把 header 里的 <code>staffname</code> 换成 <code>paasEnvironmentId</code> 的前缀，body 按接口字段构造</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">curl</span> <span class="token parameter variable">-X</span> POST http://21.214.96.51:8080/env/enableSsh <span class="token punctuation">\</span>
  <span class="token parameter variable">-H</span> <span class="token string">&quot;Content-Type: application/json&quot;</span> <span class="token punctuation">\</span>
  <span class="token parameter variable">-H</span> <span class="token string">&quot;staffname: weskerwang&quot;</span> <span class="token punctuation">\</span>
  <span class="token parameter variable">-d</span> <span class="token string">'{
    &quot;envId&quot;: &quot;evnIns-6kd8zjd4q2fm&quot;,
    &quot;keyName&quot;: &quot;test-key-123&quot;,
    &quot;ideName&quot;: &quot;VSCode&quot;,
    &quot;ideVersion&quot;: &quot;1.0&quot;
  }'</span>

<span class="token function">curl</span> <span class="token parameter variable">-X</span> POST http://localhost:8080/env/enableSsh <span class="token punctuation">\</span>
  <span class="token parameter variable">-H</span> <span class="token string">&quot;Content-Type: application/json&quot;</span> <span class="token punctuation">\</span>
  <span class="token parameter variable">-H</span> <span class="token string">&quot;staffname: whenleoshi&quot;</span> <span class="token punctuation">\</span>
  <span class="token parameter variable">-d</span> <span class="token string">'{
    &quot;envId&quot;: &quot;evnIns-603ic5kwth3o&quot;,
    &quot;keyName&quot;: &quot;test-key-123&quot;,
    &quot;ideName&quot;: &quot;VSCode&quot;,
    &quot;ideVersion&quot;: &quot;1.0&quot;
  }'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>要点</p> <ul><li>先 <code>curl -i</code> 探活再打业务接口，能快速区分&quot;服务没起来&quot;和&quot;逻辑不对&quot;</li> <li>curl 不带 cookie/session，靠 <code>staffname</code> 这类自定义头模拟登录态</li> <li>返回不符合预期时，先查转发规则（nft）再看业务日志，最后才怀疑代码</li></ul> <h3 id="postman-测试"><a href="#postman-测试" class="header-anchor">#</a> Postman 测试</h3> <p>下载安装</p> <ul><li><a href="https://www.postman.com/downloads/" target="_blank" rel="nofollow noopener noreferrer">Download Postman | Get Started for Free<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.cnblogs.com/-lhl/articles/18663600" target="_blank" rel="nofollow noopener noreferrer">Postman 使用教程：从基础到高级 - 测试小萌新一枚 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>对常规的 HTTP 接口进行测试，基本流程</p> <ol><li>浏览器控制台，右键复制 cURL，通过 postman 导入请求</li> <li>控制台复制请求 cookie，header 里添加 cookie 字段，打请求测试</li></ol> <p>我突然意识到，BurpSuite 可以完全取代这一功能，把包直接抓住，然后重放就可以了</p> <p>一次抓包请求实战，现有功能支持上传 docx 文档而后生成 PPT，这一过程涉及文档的上传解析，存储到 Bos，而后 chat 流式接口请求生成 PPT 的 mcp 工具，mcp 工具根据 queryID 查出涉及的文档 fileID，从 Bos 中读出数据，调用下层策略接口实现 PPT 生成</p> <ol><li>文件上传并存储</li> <li>文件解析并存储</li> <li>生成 PPT</li></ol> <p>而我现在需要测试一个新的格式文档 .mm 的生成 PPT 的效果，这里请前端提供了一个半成品的接口，仅支持文件上传的功能，于是我们在页面上传本地的 .mm 文件，在控制台中监控网络搜索 file，发现有一个 pccompletefile 请求，返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;status&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token property">&quot;msg&quot;</span><span class="token operator">:</span> <span class="token null keyword">null</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
		<span class="token property">&quot;doc_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;xxx&quot;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>这个 doc_id 正是我们所需的文件源格式，接口实现了文件的上传存储，并返回 bos 中对应的 doc_id</p> <p>而后是文件的解析和存储，这里需要用到一个 filecreate 接口，是从正常的 docx 生成 PPT 的流程中抓到的包</p> <p>将其 copy cURL 到 Postman，替换掉其中的 docID 字段为刚刚上传的 .mm 文件，并且复制浏览器的 cookie 到 header 里，发送请求，成功返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;status&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
        <span class="token property">&quot;msg&quot;</span><span class="token operator">:</span> <span class="token string">&quot;success&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;sLogin&quot;</span><span class="token operator">:</span> <span class="token string">&quot;1505377885&quot;</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
		<span class="token property">&quot;files&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
         	<span class="token property">&quot;url&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;downloadUrl&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;imgUrl&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;fileId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;file-18023115633&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;fileName&quot;</span><span class="token operator">:</span> <span class="token string">&quot;安全技能树.mm&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>好，我们发现了一个关键的返回 fileId，这似乎是 chat 接口的关键入参，但变数来了，我抓了 chat 接口的请求，看他的入参，发现并没有这个字段</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;channel&quot;</span><span class="token operator">:</span> <span class="token string">&quot;wenku_pc_genflow_v2&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;messages&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
        <span class="token punctuation">{</span>
            <span class="token property">&quot;role&quot;</span><span class="token operator">:</span> <span class="token string">&quot;user&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;content&quot;</span><span class="token operator">:</span> <span class="token string">&quot;生成PPT&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token property">&quot;query_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;b1754a33292942323968011ca300a6c30c22f1b3&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;extra&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
        <span class="token property">&quot;disable_h5&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span>
        <span class="token property">&quot;wanpanAuthStatus&quot;</span><span class="token operator">:</span> <span class="token number">1</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;chat_id&quot;</span><span class="token operator">:</span> <span class="token string">&quot;75cb06ead52fd15abe23482fb4daa58da2111c7a&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>思路有点问题，于是我回头去看 filecreate 的入参</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;chatId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;75cb06ead52fd15abe23482fb4daa58da2111c7a&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;queryId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;b1754a33292942323968011ca300a6c30c22f1b3&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;files&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
        <span class="token punctuation">{</span>
            <span class="token property">&quot;docId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;522f9e4205f69e3143323968011ca300a6c3f60d&quot;</span><span class="token punctuation">,</span>
            <span class="token property">&quot;source&quot;</span><span class="token operator">:</span> <span class="token number">2</span><span class="token punctuation">,</span>
            <span class="token property">&quot;title&quot;</span><span class="token operator">:</span> <span class="token string">&quot;安全技能树&quot;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">]</span><span class="token punctuation">,</span>
    <span class="token property">&quot;channel&quot;</span><span class="token operator">:</span> <span class="token string">&quot;wenku_pc_genflow_v2&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>发现二者的共同之处只有 chatId 和 queryId，于是我意识到，后端一定是根据相同的 chatId 或者 queryId（最后证实是 queryId）来找同一个对话里涉及到的文档，那么问题就简单了</p> <p>我直接令 filecreate 和 chat 入参中的两个 id 一致，然后顺序打 filecreate 和 chat 接口，果然得到了想要的结果，后端正确解析了文档库里的 doc，并将其转化为 bdjson 存在 bos 里</p> <p>而后，生成 ppt 的 mcp 工具从 bos 里拿到了这份 bdjson 并根据内容生成了 PPT，完美</p> <h3 id="swagger-接口文档"><a href="#swagger-接口文档" class="header-anchor">#</a> Swagger 接口文档</h3> <p>Swagger 是一款由 <em>SmartBear Software</em> 提供的致力于解决接口规范化、标准化、文档化的开源库，可以根据 resutful 风格生成接口开发文档，并且支持做测试的一款中间软件</p> <p>Swagger 采用全注解方式侵入代码，后端定义好接口后，能够自动生成文档、接口功能和参数，并且提供接口测试的网页 UI</p> <p>Maven 依赖</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token comment">&lt;!--引入swagger--&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger2<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>io.springfox<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>springfox-swagger-ui<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2.7.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>在 Spring 中，注入 Swaager 的配置依赖</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token annotation punctuation">@EnableSwagger2</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SwaggerConfig</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">Docket</span> <span class="token function">productApi</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">Docket</span><span class="token punctuation">(</span><span class="token class-name">DocumentationType</span><span class="token punctuation">.</span><span class="token constant">SWAGGER_2</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">select</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">apis</span><span class="token punctuation">(</span><span class="token class-name">RequestHandlerSelectors</span><span class="token punctuation">.</span><span class="token function">withMethodAnnotation</span><span class="token punctuation">(</span><span class="token class-name">ApiOperation</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">)</span>  <span class="token comment">//添加ApiOperiation注解的被扫描</span>
                <span class="token punctuation">.</span><span class="token function">paths</span><span class="token punctuation">(</span><span class="token class-name">PathSelectors</span><span class="token punctuation">.</span><span class="token function">any</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span>

    <span class="token keyword">private</span> <span class="token class-name">ApiInfo</span> <span class="token function">apiInfo</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">ApiInfoBuilder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">title</span><span class="token punctuation">(</span>”swagger和springBoot整合“<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">description</span><span class="token punctuation">(</span>”swagger 的 <span class="token constant">API</span> 文档&quot;<span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">version</span><span class="token punctuation">(</span><span class="token string">&quot;1.0&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>在 Controller 层代码中使用 Swagger 注解</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@Api</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token string">&quot;电影Controller&quot;</span><span class="token punctuation">,</span> tags <span class="token operator">=</span> <span class="token punctuation">{</span> <span class="token string">&quot;电影访问接口&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/film&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">FilmController</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Autowired</span>
    <span class="token keyword">private</span> <span class="token class-name">FilmService</span> filmService<span class="token punctuation">;</span>

    <span class="token comment">/**
     * 根据电影名字获取电影
     *
     * @param fileName
     * @return
     */</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/getFilms&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@ApiOperation</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token string">&quot;根据名字获取电影&quot;</span><span class="token punctuation">)</span>
    <span class="token annotation punctuation">@ApiResponses</span><span class="token punctuation">(</span>value <span class="token operator">=</span> <span class="token punctuation">{</span> <span class="token annotation punctuation">@ApiResponse</span><span class="token punctuation">(</span>code <span class="token operator">=</span> <span class="token number">1000</span><span class="token punctuation">,</span> message <span class="token operator">=</span> <span class="token string">&quot;成功&quot;</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token annotation punctuation">@ApiResponse</span><span class="token punctuation">(</span>code <span class="token operator">=</span> <span class="token number">1001</span><span class="token punctuation">,</span> message <span class="token operator">=</span> <span class="token string">&quot;失败&quot;</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                           <span class="token annotation punctuation">@ApiResponse</span><span class="token punctuation">(</span>code <span class="token operator">=</span> <span class="token number">1002</span><span class="token punctuation">,</span> message <span class="token operator">=</span> <span class="token string">&quot;缺少参数&quot;</span><span class="token punctuation">)</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">ResultModel</span> <span class="token function">getFilmsByName</span><span class="token punctuation">(</span><span class="token annotation punctuation">@ApiParam</span><span class="token punctuation">(</span><span class="token string">&quot;电影名称&quot;</span><span class="token punctuation">)</span> <span class="token annotation punctuation">@RequestParam</span><span class="token punctuation">(</span><span class="token string">&quot;fileName&quot;</span><span class="token punctuation">)</span> <span class="token class-name">String</span> fileName<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token class-name">StringUtils</span><span class="token punctuation">.</span><span class="token function">isEmpty</span><span class="token punctuation">(</span>fileName<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getErrorResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>

        <span class="token class-name">List</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Film</span><span class="token punctuation">&gt;</span></span> films <span class="token operator">=</span> filmService<span class="token punctuation">.</span><span class="token function">getFilmByName</span><span class="token punctuation">(</span>fileName<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span><span class="token class-name">CollectionUtils</span><span class="token punctuation">.</span><span class="token function">isEmpty</span><span class="token punctuation">(</span>films<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token keyword">new</span> <span class="token class-name">ResultModel</span><span class="token punctuation">(</span>films<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">CommonConstants</span><span class="token punctuation">.</span><span class="token function">getErrorResultModel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br></div></div><p>启动后，直接访问<code>localhost:8080/swagger-ui.html</code>就可以看到清晰的 API 测试界面</p> <p>一些需要注意的点</p> <ul><li>对于只有一个<code>HttpServletRequest</code>参数的方法，如果参数小于 5 个，推荐使用<code>@ApiImplicitParams</code>的方式单独封装每一个参数；如果参数大于 5 个，采用定义一个对象去封装所有参数的属性，然后使用<code>@APiParam</code>的方式</li> <li>默认的访问地址：<code>ip:port/swagger-ui.html#/</code>，但在 shiro 中会拦截所有的请求，必须加上默认访问路径（比如项目中，就是<code>ip:port/context/swagger-ui.html#/</code>），然后登陆后才可以看到</li> <li>在 GET 请求中，参数在 Body 体里面,不能使用<code>@RequestBody</code>；在 POST 请求，可以使用<code>@RequestBody</code>和<code>@RequestParam</code>，如果使用<code>@RequestBody</code>，对于参数转化的配置必须统一</li> <li>controller 必须指定请求类型 GET/POST，否则 swagger 会把所有的类型（6 种）都生成出来</li> <li>swagger 在生产环境不能对外暴露，可以使用<code>@Profile({&quot;dev&quot;, &quot;prod&quot;, &quot;pre&quot;})</code>指定可用的环境</li></ul> <h3 id="bug-日志排查"><a href="#bug-日志排查" class="header-anchor">#</a> Bug 日志排查</h3> <p>度子的古法日志查询</p> <h4 id="追代码链路"><a href="#追代码链路" class="header-anchor">#</a> 追代码链路</h4> <p>查询流程：首先找到对应代码位置</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;pptegent_outline_req_strategyparams&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;req&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">)</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>通过 queryid 和日志信息 grep 查看日志信息</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">cat</span> service.log.* <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'313126566710330'</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'pptegent_outline_req_strategyparams'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在 192 行发现构造后的策略请求 req 信息如上，发现 bos_urls 为空，继续往上找（排查为什么为空），首先定位到 84 行的</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Notice</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;outline params&quot;</span><span class="token punctuation">,</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>发现 file_ids 不为空，因为这一步逻辑是根据 file_ids 解析出 bos_urls，所以问题出在 84-192 之间的解析，定位到 170 行</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>referContentURL <span class="token operator">:=</span> p<span class="token punctuation">.</span><span class="token function">PPTPrepareReferContent</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> extraReq<span class="token punctuation">,</span> params<span class="token punctuation">)</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>发现 userInfo 的内容为空，为什么为空？在 OnInit 里 userInfo 已经初始化了，在哪拿丢了？还需要继续追</p> <p>线上日志查询：需要先申请中控机权限，通过中控机查预览机日志</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ssh</span> bjhw-sys-rpm1298.bjhw.baidu.com <span class="token comment"># 连接中控机</span>

<span class="token comment"># 调用中控机 pdo 程序查日志</span>
./pdo2 <span class="token parameter variable">-bns</span> group.gdp-pcapiai-debug.pandora.all <span class="token parameter variable">-y</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> <span class="token number">5</span> <span class="token parameter variable">-show</span> row <span class="token string">&quot;grep -i '2761865352' /home/work/odp/log/service/service.log &quot;</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;need jump&quot;</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;sshMatrix&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h2 id="git-开发与发布"><a href="#git-开发与发布" class="header-anchor">#</a> Git 开发与发布</h2> <h3 id="git-新手教程"><a href="#git-新手教程" class="header-anchor">#</a> Git 新手教程</h3> <blockquote><p><a href="https://www.liaoxuefeng.com/wiki/896043488029600" target="_blank" rel="nofollow noopener noreferrer">廖雪峰的文档<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <h4 id="绑定-ssh-密钥"><a href="#绑定-ssh-密钥" class="header-anchor">#</a> 绑定 ssh 密钥</h4> <p>命令行配置 git</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> user.name <span class="token string">&quot;northboat&quot;</span>
<span class="token function">git</span> config <span class="token parameter variable">--global</span> user.email <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>生成 ssh 密匙</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>ssh-keygen <span class="token parameter variable">-t</span> rsa <span class="token parameter variable">-C</span> <span class="token string">&quot;northboat@163.com&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>找到对应路径下的 id_rsa.pub，将公钥和对应的 Git 仓库绑定即可</p> <h4 id="常见报错码"><a href="#常见报错码" class="header-anchor">#</a> 常见报错码</h4> <p>报错码 10056：一般是这是因为服务器的 SSL 证书没有经过第三方机构的签署，所以才报错，使用以下命令接触 ssl 验证后再次 git 即可解决</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> http.sslVerify <span class="token string">&quot;false&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>port 443 timed out：卡了</p> <p>broken pipe：文件过大导致，git 默认文件大小小于等于 100MB，可修改缓存大小为 500MB 强行上传（不建议把 git 仓库当网盘）</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">git</span> config http.postBuffer <span class="token number">52428800</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="提交描述规范"><a href="#提交描述规范" class="header-anchor">#</a> 提交描述规范</h4> <p>在提交代码时输入清晰的说明有利于版本管理，建议搭配如下关键字编写提交描述</p> <div class="language- line-numbers-mode"><pre class="language-text"><code># 新建(add)
# 删除(rm)
# 更新(update)
# 改动(change)
# 实现(feat)
# 发布(publish)
# 修复(fix)
...
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>当然，企业开发会有自己的一套规范，例如 icafe 卡片 id 加本次需求改动</p> <h4 id="分支冲突与合并"><a href="#分支冲突与合并" class="header-anchor">#</a> 分支冲突与合并</h4> <p>开发分支拉取主分支更新，这里需要解决拉取的主分支和本地分支冲突（如果有的话）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> checkout main
<span class="token function">git</span> pull
<span class="token function">git</span> checkout NorthBoat
<span class="token function">git</span> merge main <span class="token comment"># 把 main 合并到当前 NorthBoat 分支，main 可省略，默认为主分支</span>
<span class="token function">git</span> push <span class="token comment"># 更新当前分支</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>主分支合并开发分支</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> checkout main
<span class="token function">git</span> merge NorthBoat <span class="token comment"># 主分支合并 NorthBoat 分支</span>
<span class="token function">git</span> push <span class="token comment"># 更新主分支</span>
<span class="token function">git</span> checkout NorthBoat <span class="token comment"># 返回原分支</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h4 id="版本回退"><a href="#版本回退" class="header-anchor">#</a> 版本回退</h4> <p>撤销<code>git add .</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> reset <span class="token builtin class-name">.</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>回退到上一个版本并保存当前版本</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> stash

<span class="token comment"># 查看保存的版本</span>
<span class="token function">git</span> stash list
<span class="token comment"># 恢复到上个版本并删除上个版本保存</span>
<span class="token function">git</span> stash pop
<span class="token comment"># 恢复到某个保存的某个版本</span>
<span class="token function">git</span> stash apply stash@<span class="token punctuation">{</span>版本id<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>撤销本地提交：HEAD 一定要大写</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 撤销上次commit，但不撤销add</span>
<span class="token function">git</span> reset <span class="token parameter variable">--soft</span> HEAD~1
<span class="token function">git</span> reset <span class="token parameter variable">--soft</span> HEAD~ <span class="token comment"># 二者等价</span>

<span class="token comment"># 撤销上次commit和add</span>
<span class="token function">git</span> reset HEAD~
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>本地版本回退</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看 commit_id</span>
<span class="token function">git</span> log

<span class="token comment"># 回到到前两个版本</span>
<span class="token function">git</span> reset <span class="token parameter variable">--hard</span> head~2
<span class="token comment"># 回到到指定版本</span>
<span class="token function">git</span> reset <span class="token parameter variable">--hard</span> commit_id
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>两个人推一个仓库，同时拉取 A 版本，第一个人修改后提交 B 版本并推送到远程仓库，此时第二个人并不知晓这次推送，在修改 A 版本为 C 版本后进行推送时，就会发生冲突，那么此时就需要进行上述的版本回退</p> <ol><li>将本地仓库回退到 A 版本</li> <li>git pull 拉取最新的 B 版本</li> <li>在 B 版本的基础上进行修改得到 C 版本</li> <li>提交推送，则远程仓库将完成 A → B → C 的更新</li></ol> <h4 id="添加-patch"><a href="#添加-patch" class="header-anchor">#</a> 添加 patch</h4> <p>一次推送有误，不想新建一次 commit 再次提交，可以使用<code>git commit --amend</code>将本次更新与上一次 commit 合并，即</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> <span class="token builtin class-name">.</span>
<span class="token function">git</span> commit <span class="token parameter variable">--amend</span>
<span class="token function">git</span> push
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这样远程仓库只会出现一次 commit，相当于给上一次 commit 打补丁</p> <h4 id="重置仓库"><a href="#重置仓库" class="header-anchor">#</a> 重置仓库</h4> <p>由于一个仅供展示、不需要追踪历史提交的 page 仓库每次 commit 需要大量的删除原有文件，导致 .git 文件膨胀很快，当 &gt;200MB 时需要这样的重置操作</p> <p>进入仓库目录</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>cd northboat.github.io
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>删除 <code>.git</code></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>rm -rf .git
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>重新初始化仓库</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>git init
git branch -M main
git add .
git commit -m &quot;reset pages repository&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>重新关联远程仓库（覆盖式）</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>git remote add origin https://github.com/northboat/northboat.github.io.git
git push -f origin main
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>这里用 <code>-f</code> 是完全合理的，因为就是要“历史清零”，这是 Pages 仓库的标准重置姿势</p> <ul><li>结果就是：<code>.git</code>体积变小几十 KB，其次所有历史提交全部清空，只剩下 1 次提交</li></ul> <h4 id="锁定-git-分支"><a href="#锁定-git-分支" class="header-anchor">#</a> 锁定 git 分支</h4> <p>进入 .git 目录，找到 hooks 子目录</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token builtin class-name">cd</span> .git/hooks
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>创建一个名为 ”pre-commit” 的文件，这是一个Git钩子脚本，用于在每次提交之前执行</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">touch</span> pre-commit
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>打开 &quot;pre-commit&quot; 文件，添加以下内容</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token shebang important">#!/bin/sh</span>

<span class="token comment"># 正确获取当前分支名称（原脚本缺少 $ 符号和反引号/括号包裹命令）</span>
<span class="token assign-left variable">current_branch</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token function">git</span> symbolic-ref HEAD <span class="token operator">|</span> <span class="token function">sed</span> <span class="token parameter variable">-e</span> <span class="token string">'s,.*/\(.*\),\1,'</span><span class="token variable">)</span></span>

<span class="token comment"># 锁定的分支名称（比如 master/main）</span>
<span class="token assign-left variable">LOCKED_BRANCH</span><span class="token operator">=</span><span class="token string">&quot;main&quot;</span>

<span class="token keyword">if</span> <span class="token punctuation">[</span> <span class="token string">&quot;<span class="token variable">$current_branch</span>&quot;</span> <span class="token operator">=</span> <span class="token string">&quot;<span class="token variable">$LOCKED_BRANCH</span>&quot;</span> <span class="token punctuation">]</span><span class="token punctuation">;</span> <span class="token keyword">then</span>
   <span class="token builtin class-name">echo</span> <span class="token string">&quot;错误：禁止直接向 <span class="token variable">$LOCKED_BRANCH</span> 分支提交代码！&quot;</span>
   <span class="token builtin class-name">echo</span> <span class="token string">&quot;请切换到功能分支开发，通过 PR/MR 合并。&quot;</span>
   <span class="token builtin class-name">exit</span> <span class="token number">1</span>  <span class="token comment"># 非 0 退出码会阻止 commit 执行</span>
<span class="token keyword">fi</span>

<span class="token builtin class-name">exit</span> <span class="token number">0</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>以上脚本将锁定 Main 分支，在每次 add/commit 之前进行检查</p> <p>为 &quot;pre-commit&quot; 文件添加可执行权限</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">chmod</span> +x pre-commit
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>每当有人试图在被锁定的分支上进行提交时，&quot;pre-commit&quot; 钩子脚本将会检查当前分支名称：如果分支名称与你预先定义的名称不匹配，则会显示一条错误消息，并阻止提交</p> <p>此时 Main 分支只能通过 PR/MR 合并进行更新，无法直接 git commit 更新</p> <h3 id="git-分支开发"><a href="#git-分支开发" class="header-anchor">#</a> Git 分支开发</h3> <p>一般而言，一次完成的变更流程如下</p> <ul><li>主仓库维护 master 分支和各类<code>release/版本号</code>分支</li> <li>每个 developer 自己 fork 仓库 checkout 自己的 feature 或 dev 分支，开发完需求后，再 merge 到主仓库的 release 分支</li> <li>merge 时，提 MR 请求，由 +1 或 +2 CR，给出评审意见，修改完后，上级 approve，再次解决冲突合入 release</li> <li>真正的发布是 release 合入 master，这一步通常不由我来</li></ul> <h4 id="baidu-分支开发"><a href="#baidu-分支开发" class="header-anchor">#</a> Baidu 分支开发</h4> <p>以百度的一次分支开发推送为例：我现有仓库 function 的分支创建权限，我以需求 ID 为分支名，以 master 为源分支创建我的开发分支 wk-web-61949</p> <p>以开发分支创建开发环境，并在改分支上进行修改，修改完成后，把改动推送到分支</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> <span class="token builtin class-name">.</span>
<span class="token function">git</span> commit <span class="token parameter variable">-m</span> <span class="token string">&quot;wk-web-61949 支持思维导图生成 PPT&quot;</span>
<span class="token function">git</span> push origin HEAD:refs/for/wk-web-61949 <span class="token comment"># 推送评审</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>而后会自动触发评审 CR，需要一个上级进行 +2，我才能彻底将改动推到我的开发分支。而后所有的提测都会在这个开发分支上进行，当联调通过后，则合入 master 分支，完成一次上线，也就是说，真正的需求迭代通过 master 合并开发分支实现，这就是所谓的分支发布</p> <p>当 commit 了一次，还想要修改，但不改变 commit，可以使用 <code>git commit --amend</code>再<code>git push -force</code>强制推上去</p> <ul><li>这样两次修改只显示一次 commit 记录</li> <li>但注意，如果是合了一次别人的代码，不应该隐去这段 commit，必须是全部是自己的提交，才适用这种提交</li></ul> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> commit <span class="token parameter variable">--amend</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>自己的库，如果让 master 合并开发分支，可以使用以下命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> checkout master
<span class="token function">git</span> merge feature_print_my_name_on_demo_app
<span class="token comment"># ... 解决冲突</span>
<span class="token comment"># 更新主分支</span>
<span class="token function">git</span> push origin HEAD:refs/for/master
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h4 id="tencent-分支开发"><a href="#tencent-分支开发" class="header-anchor">#</a> Tencent 分支开发</h4> <p>腾子的分支开发更加清爽</p> <ol><li>每次上线统一合到 release 分支，由 release 分支合入 master 完成一次变更</li> <li>开发从 release 拉 feature 分支进行开发</li> <li>开发完毕从 release 拉 personal 分支专门解决冲突（merge feature 分支）</li> <li>最后提 personal 到 release 的 MR 完成功能合并</li></ol> <p>提代码 commit 规范</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>--sotry=tapd 需求单号 说明
--bug=tapd bug单号 说明
--other=其他说明
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>例如</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>--other=cvm enableSsh 超时时间增加到 8s
--story=134495465 无 ip 环境前端展示 ssh 连接入口
--story=134409094 支持通过 ssh 方式直连到无 IP Agent 容器
--other=写 redis sleep 100ms
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>打补丁</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">git</span> <span class="token function">add</span> proto/web-server/apidocs.swagger.json proto/web-server/web_server.pb.go proto/web-server/web_server.trpc.go proto/web-server/web_server.pb.validate.go

<span class="token function">git</span> commit <span class="token parameter variable">--amend</span> --no-edit

<span class="token function">git</span> push --force-with-lease
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>冲突解决</p> <ol><li>朴素方法：直接 fetch 目标分支如 release/3.3.2，在本地开发分支 dev/saulxiong-ssh-proxy 解决冲突，然后提交到 dev/saulxiong-ssh-proxy 分支，然后合并到 release/3.3.2 分支</li> <li>mt 教的办法：不污染开发分支，新建 personal 分支 dev/saulxiong-3.3.2，源分支为 release/3.3.2，拉到本地后，去 merge 开发分支 dev/saulxiong-ssh-proxy，然后提交这个 persion 分支，再去请求合并到 release/3.3.2，这样开发分支是纯净的，所有的 merge 和 mr 都在这个新的 personal 分支上进行</li></ol> <p>常见评论</p> <ul><li><strong>LGTM:</strong> Looks Good To Me</li> <li><strong>SGTM:</strong> Sounds Good To Me</li> <li><strong>AFAIK:</strong> As Far As I Know</li> <li><strong>WIP:</strong> Work In Progress</li></ul> <p>stash 和 stash pop 技巧</p> <ul><li>隐去 AI 注释：用 AI 生成所有函数的注释，看懂了之后直接<code>git stash</code>，就可以隐去所有的 AI 注释，然后开始开发</li> <li>保存开发状态：当发现问题了，可以先 stash 保存一版修改，从前一版本重新开始 coding</li></ul> <h4 id="蓝绿发布"><a href="#蓝绿发布" class="header-anchor">#</a> 蓝绿发布</h4> <p>需求开发、测试、上线流程</p> <ol><li>需求分析与规划阶段（PM 主导）：需求评审 → 需求冻结 → 技术评审 → 排期发布</li> <li>开发阶段（RD 主导）：开发 → 自测 → 联调</li> <li>测试阶段：提测（RD 主导） → 测试 + Bug 解决（QA 主导）</li> <li>上线阶段：上线（RD 主导） → 测试及回归（QA 主导）</li></ol> <p>度子的蓝绿机发布</p> <ol><li>预览机</li> <li>华北单台</li> <li>华北全流量</li> <li>华东华南单台</li> <li>华东全流量</li> <li>华南全流量</li> <li>后置任务</li></ol> <p>推全</p> <ul><li>推全之后，一定要狠狠观察流量监控 10-15 分钟，重点看是否存在激增的 panic 50X 报错，确认没问题后才能往后推，如果出现问题，第一时间撤销或回滚</li> <li>上线完成之后由产品验收回归效果，度子的回归表现有的是用 xleaarn 模型去预测的，很有意思</li></ul> <p>腾子的发布不太一样，服务跑在四个集群上，逐步发布</p> <ul><li>服务 A 集群</li> <li>服务 B 集群</li> <li>灰度集群</li> <li>熔灾集群</li></ul> <h3 id="git-agent-仓库"><a href="#git-agent-仓库" class="header-anchor">#</a> Git Agent 仓库</h3> <p>是这样，我想做一个由 Agent 维护和使用的 Git 仓库，用于加速我的开发（替代我的简单需求开发），内容如下</p> <ul><li>一份开发 Skill
<ol><li>评审开发联调上线的方法论</li> <li>CodeGraph 的使用方法</li></ol></li> <li>一份仓库的 CodeGraph</li></ul> <p>这里涉及到 codegraph.db 的存储，这是一个大文件，使用 git lfs 大文件推送</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 1. 装 LFS（Mac，一次性）</span>
brew <span class="token function">install</span> git-lfs
<span class="token function">git</span> lfs <span class="token function">install</span>

<span class="token comment"># 2. 跟踪根目录的 db</span>
<span class="token function">git</span> lfs track <span class="token string">&quot;.codegraph/codegraph.db&quot;</span>
<span class="token function">git</span> <span class="token function">add</span> .gitattributes

<span class="token comment"># 3. 提交 + 推送</span>
<span class="token function">git</span> <span class="token function">add</span> .codegraph/codegraph.db
<span class="token function">git</span> commit <span class="token parameter variable">-m</span> <span class="token string">&quot;feat: add codegraph index for AI agent&quot;</span>
<span class="token function">git</span> push origin maste
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>这里 codegraph 的默认查找位置就是 <code>.codegraph/codegraph.db</code>，所以放在这里面方便直接使用，这是节省 Token 的手段，用于代替全文 Grep</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/2054d0/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">自动化集成部署</div></a> <a href="/pages/ede82a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">套接字编程</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">

      </span></p></div></div></div> <div class="article-list"><div class="article-title"><a href="/archives" class="iconfont icon-bi">最近更新</a></div> <div class="article-wrapper"><dl><dd>01</dd> <dt><a href="/pages/1f9098/"><div>
            ESP32-S3
