Nryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">酒吧舞<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="酒类通识"><a href="#酒类通识" class="header-anchor">#</a> 酒类通识</h2> <h3 id="基酒-spirits"><a href="#基酒-spirits" class="header-anchor">#</a> 基酒（Spirits）</h3> <p>烈酒通常被习惯分为六大类，同时是调鸡尾酒的六大基酒</p> <ul><li>金酒（Gin）</li> <li>威士忌（Whisky）：爱尔兰、安室透（波本）、赤井（黑麦）</li> <li>白兰地（Brandy）：皮斯科、卡尔瓦多斯（苹果白兰地）</li> <li>伏特加（Vodka）</li> <li>朗姆（Rum）：胁田兼則</li> <li>龙舌兰酒（Tequila）</li></ul> <p>在柯南里，烈酒都是男性成员，而女性都是低度的葡萄酒，比如</p> <ul><li>雪莉</li> <li>贝尔摩德（味美思）</li> <li>库拉索</li> <li>基安蒂</li></ul> <h3 id="辅助酒与其他材料"><a href="#辅助酒与其他材料" class="header-anchor">#</a> 辅助酒与其他材料</h3> <p>利口酒（Liqueur）：添味（甜）、上色、平衡</p> <ul><li>百利甜、君度橙酒、蓝橙酒等</li></ul> <p>辅助酒：调味</p> <ul><li>香槟、葡萄酒、雪莉酒</li></ul> <p>其他材料</p> <ul><li>苦精（如Angostura）</li> <li>苏打水、汤力水、果汁、糖浆等</li></ul> <h3 id="学习资源"><a href="#学习资源" class="header-anchor">#</a> 学习资源</h3> <ul><li>《调酒师手册》</li> <li>《鸡尾酒圣经》</li></ul> <h3 id="调酒原料与配料"><a href="#调酒原料与配料" class="header-anchor">#</a> 调酒原料与配料</h3> <p>常见配料</p> <ul><li>果汁：柠檬、酸橙、橙汁、蔓越莓等</li> <li>糖浆：单糖浆、蜂蜜水、香草糖浆等</li> <li>装饰物：柠檬片、橙皮、樱桃、薄荷等</li> <li>冰块种类：块冰、碎冰、球冰</li></ul> <p>一般调味及配比</p> <ul><li>酸：柠檬汁、酸橙汁</li> <li>甜：糖浆、利口酒</li> <li>苦：苦精、某些草本酒</li> <li>酒体与口感平衡：酒精浓度与口感轻重调整</li> <li>黄金比例：2（基酒） : 1（酸） : 1（甜）</li></ul> <h3 id="基础调酒技法"><a href="#基础调酒技法" class="header-anchor">#</a> 基础调酒技法</h3> <ul><li>摇和（Shake）：适用于含果汁、乳制品的酒</li> <li>搅拌（Stir）：适用于清澈型鸡尾酒，如马提尼</li> <li>直调（Build）：如自由古巴、金汤力</li> <li>层叠（Layer）：利用密度制作分层效果</li> <li>滤冰（Strain）：使用滤网滤掉冰块</li> <li>捣碎（Muddle）：适用于莫吉托等需要释放香气的饮品</li></ul> <h3 id="调酒工具与设备"><a href="#调酒工具与设备" class="header-anchor">#</a> 调酒工具与设备</h3> <ul><li>雪克壶（Shaker）</li> <li>量酒器（Jigger）</li> <li>搅拌棒（Bar Spoon）</li> <li>滤网（Strainer）</li> <li>捣棒（Muddler）</li> <li>削皮刀、榨汁器、碎冰机等</li></ul> <h2 id="不同基酒的区别"><a href="#不同基酒的区别" class="header-anchor">#</a> 不同基酒的区别</h2> <h3 id="各自特点"><a href="#各自特点" class="header-anchor">#</a> 各自特点</h3> <p>威士忌（Whisky）</p> <ul><li>以大麦、玉米、黑麦等谷物为主要原料，经发酵、蒸馏后在橡木桶中陈酿而成</li> <li>风味多样，受原料、蒸馏工艺和陈酿桶影响极大，可纯饮也可调制鸡尾酒（如<strong>老式鸡尾酒 Old Fashioned</strong>）</li></ul> <p>白兰地（Brandy）</p> <ul><li>以葡萄为主要原料（其他水果酿造的通常称为 “水果白兰地”，如苹果白兰地 Calvados），经发酵、蒸馏后在橡木桶中陈酿</li> <li>典型的 “餐后酒”，以葡萄风味为基底，陈酿时间越长越醇厚，适合纯饮或加冰（如<strong>白兰地加冰 Brandy on the Rocks</strong>），也可调制经典鸡尾酒（如<strong>边车 Sidecar</strong>）</li></ul> <p>金酒（Gin）</p> <ul><li>以谷物（如大麦、小麦）发酵蒸馏得到中性酒精，再通过 “浸煮” 或 “重蒸馏” 加入 juniper（杜松子）等 botanicals（植物香料）调味</li> <li>杜松子是灵魂香气，整体风格清爽、芳香，是鸡尾酒的 “骨架”，经典鸡尾酒<strong>金汤力（Gin Tonic）</strong>、<strong>马天尼（Martini）</strong> 的核心基酒</li></ul> <p>朗姆（Rum）</p> <ul><li>以甘蔗汁或甘蔗副产品（糖蜜）为原料，经发酵、蒸馏后在橡木桶中陈酿（部分白朗姆不陈酿或短暂陈酿）</li> <li>自带甘蔗的天然甜味，风格从清爽到浓郁跨度大，是热带鸡尾酒的核心（如<strong>莫吉托 Mojito</strong>、<strong>代基里 Daiquiri</strong>、<strong>自由古巴 Cuba Libre</strong>）</li></ul> <p>伏特加（Vodka）</p> <ul><li>传统以马铃薯或谷物（小麦、玉米）为原料，经多次蒸馏和过滤，得到高纯度、低风味的中性酒精</li> <li>因 “无风味” 而成为万能基酒，能与各种果汁、利口酒搭配，调制出清爽或浓郁的鸡尾酒（如<strong>莫斯科骡子 Moscow Mule</strong>、<strong>血腥玛丽 Bloody Mary</strong>、<strong>伏特加红牛</strong>），也可纯饮或加冰</li></ul> <p>龙舌兰（Tequila）</p> <ul><li>仅产于墨西哥特基拉（Tequila）地区及周边，以蓝色龙舌兰（Blue Agave）为原料，经发酵、蒸馏后陈酿（部分不陈酿）</li> <li>带有独特的龙舌兰草本香气，从清爽到醇厚风格多样，经典鸡尾酒<strong>玛格丽特（Margarita）</strong>、<strong>龙舌兰日出（Tequila Sunrise）</strong> 的核心基酒，也是墨西哥传统 “shots” 文化的代表（常配盐和柠檬）</li></ul> <table><thead><tr><th>基酒</th> <th>核心原料</th> <th>标志性风味</th> <th>典型应用场景</th></tr></thead> <tbody><tr><td>威士忌</td> <td>谷物</td> <td>烟熏、花果、香草、坚果</td> <td>纯饮、老式鸡尾酒</td></tr> <tr><td>白兰地</td> <td>葡萄</td> <td>葡萄果香、橡木、焦糖</td> <td>纯饮、边车</td></tr> <tr><td>金酒</td> <td>谷物 + 杜松子</td> <td>杜松子香、草本、柑橘</td> <td>金汤力、马天尼</td></tr> <tr><td>朗姆酒</td> <td>甘蔗 / 糖蜜</td> <td>甘蔗甜、焦糖、香料</td> <td>莫吉托、代基里</td></tr> <tr><td>伏特加</td> <td>谷物 / 马铃薯</td> <td>纯净、顺滑（几乎无风味）</td> <td>莫斯科骡子、血腥玛丽</td></tr> <tr><td>龙舌兰</td> <td>蓝色龙舌兰</td> <td>草本、胡椒、橡木（陈酿）</td> <td>玛格丽特、纯饮 shots</td></tr></tbody></table> <h3 id="基酒的选择"><a href="#基酒的选择" class="header-anchor">#</a> 基酒的选择</h3> <p>核心是根据饮酒场景、口味偏好、饮用方式（纯饮 / 调酒）以及想要的 “饮酒体验” 来匹配基酒的特性</p> <blockquote><p>喜欢清爽、干净的口感</p></blockquote> <p><strong>首选伏特加</strong></p> <p>特点：几乎无风味、纯净顺滑，酒精感直接但不刺激</p> <p>适合：喜欢 “纯粹酒精体验” 或追求 “百搭调和” 的人。纯饮时适合加冰（On the Rocks），调酒时能完美融合果汁、糖浆等配料（如莫斯科骡子、血腥玛丽）</p> <p><strong>次选金酒</strong></p> <p>特点：以 juniper（杜松子）为核心风味，带有草本、柑橘的清爽香气，口感偏干</p> <p>适合：喜欢 “植物清香” 但不浓郁的人，纯饮加冰可突出杜松子的清新，调酒时是经典鸡尾酒的灵魂（如金汤力、马天尼）</p> <blockquote><p>偏爱浓郁、复杂的风味</p></blockquote> <p><strong>威士忌</strong></p> <p>特点：按产地分风味差异大 —— 苏格兰威士忌（泥煤、烟熏、果香）、波本威士忌（香草、焦糖、甜感）、爱尔兰威士忌（柔和、花香、清爽）、日本威士忌（平衡、果香、烟熏）</p> <p>适合：喜欢 “层次丰富”“温暖醇厚” 的人，纯饮或加少量水更能凸显风味，也适合调经典鸡尾酒（如老式鸡尾酒、威士忌酸）</p> <p><strong>朗姆酒</strong></p> <p>特点：按类型分 —— 白朗姆（清爽、甘蔗甜、适合调酒）、金朗姆（香草、焦糖、中等复杂度）、黑朗姆（浓郁、焦香、巧克力 / 咖啡味，适合纯饮或调厚重鸡尾酒）</p> <p>适合：喜欢 “甜感基底”“热带风情” 的人，黑朗姆纯饮有温暖甜润感，白朗姆是莫吉托、 Daiquiri 的核心</p> <blockquote><p>钟情甜香、果香或花香？</p></blockquote> <p><strong>白兰地</strong></p> <p>特点：以葡萄为原料（干邑、雅文邑最知名），风味偏向果香（杏、桃、葡萄）、花香、香草、橡木桶的木质香，口感圆润顺滑，余味长</p> <p>适合：喜欢 “优雅甜香”“餐后暖身” 的人，纯饮（常温或微温）更显细腻，也可调 Sidecar 等经典鸡尾酒</p> <p><strong>龙舌兰</strong></p> <p>特点：以龙舌兰植物为原料， blanco（白）龙舌兰清爽、带草本和胡椒辛辣； reposado 经橡木桶短熟成，增加香草、焦糖甜感； añejo（陈年）更浓郁，有木质、坚果味</p> <p>适合：喜欢 “鲜明个性”“微辛辣甜香” 的人，优质 blanco 可纯饮（配盐和柠檬解辣），也是玛格丽特、 Paloma 的灵魂</p> <h3 id="short-drink"><a href="#short-drink" class="header-anchor">#</a> Short Drink</h3> <p>Short Drink 指容量较小（通常 60-120 毫升）、酒精度相对较高、风味浓郁集中，适合快速饮用的饮品。它更注重基酒和辅料的精准平衡，强调 “一口或几口内体验完整风味”</p> <ul><li>Martini（马提尼）</li> <li>Manhattan（曼哈顿）</li> <li>Margarita（玛格丽塔）</li> <li>Daiquiri（代基里）</li></ul> <h3 id="long-drink"><a href="#long-drink" class="header-anchor">#</a> Long Drink</h3> <p>Long Drink 指容量较大（通常 <strong>150-300 毫升以上</strong>）、酒精度较低、口感清爽，通过大量软饮（苏打水、果汁、汤力水等）稀释，适合长时间慢慢饮用的饮品。它更注重 “解渴感” 和 “轻松的饮用体验”</p> <ul><li>Mojito（莫吉托）</li> <li>Cuba Libre（自由古巴）</li> <li>Tequila Sunrise（日出）</li> <li>Bloody Mary（血腥玛丽）</li></ul> <h2 id="实践出真知"><a href="#实践出真知" class="header-anchor">#</a> 实践出真知</h2> <p>奥美加银标（龙舌兰）</p> <ul><li><code>龙舌兰 : 水溶 C = 1 : 3</code></li> <li><code>龙舌兰 : 雪碧 : 水溶 C = 1 : 2 : 2</code></li></ul> <p>哥顿金</p> <ul><li>金汤力：金酒 45ml，柠檬汁 15ml，整罐屈臣氏汤力水，柠檬片 x1（没有柠檬汁用青柠汁饮料代替，没有汤力水用苏打水代替，very good 啊）</li> <li>金菲士：需要用马克杯，把汤力水换成气泡水</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/29, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/db03d7/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">摘抄</div></a> <a href="/pages/3d5362/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">实习</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
