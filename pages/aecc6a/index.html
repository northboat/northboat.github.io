6nCgwEl0tn7wUiZYJnNRh6DK4UH/k0lfyrsBKdPVv/AriGIQcEDQZ65LBAGe2Rzui9Ybjz7XUppz1/uKBbyVPGkN3ZAeC6hr0x7Nr38N5+EqkoOm17xpoqR9ohQF55ERSvr4Dkr3chNfC3DMzGJlNBElW8w9nsGQvhNGIzDkXzCg8cLK951xHsFBlTJspJNi3ZFIMF2AeDV3q8DNOB+YHi6QTrChDIWDBRi5U5f+ZMfJLu3ccrqxtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">LSP MCP 工具<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>业务是皮，安全是毛，毛在皮身上</p> <h2 id="sca-基础"><a href="#sca-基础" class="header-anchor">#</a> SCA 基础</h2> <h3 id="sca-概述"><a href="#sca-概述" class="header-anchor">#</a> SCA 概述</h3> <p>SCA，Static Code Analysis，是指在不运行程序的前提下，对源代码或字节码进行分析，以发现潜在的问题、缺陷、漏洞</p> <p>通常分析的范围如下</p> <table><thead><tr><th>检查范围</th> <th>例子</th></tr></thead> <tbody><tr><td>语法错误</td> <td>拼写错误、漏掉分号、类型不匹配</td></tr> <tr><td>代码规范</td> <td>命名不规范、缩进不统一、行过长</td></tr> <tr><td>潜在 bug</td> <td>空指针、数组越界、死代码、未关闭资源</td></tr> <tr><td>安全漏洞</td> <td>SQL 注入、XSS、路径遍历、硬编码密码</td></tr> <tr><td>性能问题</td> <td>重复计算、不必要对象创建</td></tr> <tr><td>可维护性问题</td> <td>高复杂度、过深嵌套、长方法、循环依赖</td></tr> <tr><td>设计层面</td> <td>依赖反转、违反 SRP/OCP、代码坏味道（code smell）</td></tr></tbody></table> <p>常见的静态分析工具</p> <table><thead><tr><th>语言</th> <th>工具</th> <th>简介</th></tr></thead> <tbody><tr><td>Java</td> <td><a href="https://www.sonarqube.org/" target="_blank" rel="nofollow noopener noreferrer">SonarQube<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>全面代码质量平台（支持 Web 展示）</td></tr> <tr><td>Java</td> <td><a href="https://spotbugs.github.io/" target="_blank" rel="nofollow noopener noreferrer">SpotBugs（FindBugs）<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>检查字节码，发现 bug 模式</td></tr> <tr><td>Java</td> <td>PMD</td> <td>检查代码规范、冗余代码</td></tr> <tr><td>Java</td> <td>Checkstyle</td> <td>检查命名、格式、注释规范等</td></tr> <tr><td>Python</td> <td>pylint / flake8 / mypy</td> <td>语法检查 + 类型检查</td></tr> <tr><td>JavaScript</td> <td>ESLint</td> <td>最广泛使用的前端代码静态分析</td></tr> <tr><td>C/C++</td> <td>cppcheck / clang-tidy / Coverity</td> <td>安全漏洞、内存错误分析</td></tr> <tr><td>多语言</td> <td><a href="https://semgrep.dev/" target="_blank" rel="nofollow noopener noreferrer">Semgrep<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></td> <td>支持模式匹配式安全规则，可自定义</td></tr> <tr><td>多语言</td> <td>CodeQL（GitHub）</td> <td>类似 SQL 的代码查询语言，GitHub Actions 可集成</td></tr></tbody></table> <p>常见应用场景：在 CI/CD 流程中进行代码审查，例如使用 GitHub、GitLab、Jenkins，将分析工具集成进你的代码提交或 PR 流程中，每次 push 将自动化检查代码质量</p> <p>安全扫描类库</p> <ul><li>SonarQube 安全规则集</li> <li>Semgrep 安全规则库</li> <li>CodeQL：GitHub 官方推荐，用于查找逻辑型安全问题（如访问控制缺失、注入漏洞）</li></ul> <p>集成 SonarQube</p> <ul><li>在本地或 CI/CD 中部署 SonarQube Server</li> <li>使用<code>sonar-scanner</code>或 Maven 插件上传代码分析结果</li> <li>可通过浏览器查看：bugs、code smells、安全漏洞、重复代码等</li></ul> <p>或者在开发过程中使用插件进行代码检查</p> <table><thead><tr><th>工具</th> <th>集成方式</th></tr></thead> <tbody><tr><td>Checkstyle</td> <td>IDE 插件或 Maven 插件（自动 fail 构建）</td></tr> <tr><td>SpotBugs</td> <td>Maven 插件 / Gradle 插件</td></tr> <tr><td>PMD</td> <td>IDE 插件或<code>mvn pmd:check</code></td></tr></tbody></table> <h3 id="sca-原理"><a href="#sca-原理" class="header-anchor">#</a> SCA 原理</h3> <p>静态分析的底层逻辑，像是编译器的前端：语法分析 → 抽象语法树 → 语义检查 → 流程分析</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>源代码
  ↓
词法分析（Lexer）
  ↓
语法分析（Parser）→ 抽象语法树 AST
  ↓
语义分析（类型推断、符号绑定）
  ↓
控制流分析（CFA）&amp; 数据流分析（DFA）
  ↓
规则匹配（Lint）或模式匹配（如 Semgrep、CodeQL）
  ↓
输出警告 / 错误 / 报告
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>通过词法语法分析实现控制流分析（Control Flow Analysis, CFA）</p> <ul><li>构建控制流程图（CFG），分析条件/循环/分支/跳转</li> <li>用来判断代码是否可达、分支覆盖是否完整等</li></ul> <div class="language-css line-numbers-mode"><pre class="language-css"><code>[Start]
   ↓
[x &gt; 0] ─ Yes → [<span class="token function">doSomething</span><span class="token punctuation">(</span><span class="token punctuation">)</span>]
   └─ No → [return]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>数据流分析（Data Flow Analysis, DFA）</p> <ul><li>分析变量的定义-使用链、是否初始化、是否为空等</li> <li>举例：空指针分析、资源未关闭、变量未赋值就使用等，SpotBugs 等工具广泛应用</li></ul> <p>规则匹配 / 模式识别（Pattern Matching）</p> <ul><li>使用预定义或用户自定义的规则集来匹配代码结构</li> <li>如 Checkstyle 会检查 <code>class 命名必须大写开头</code>，PMD 会匹配 <code>== null</code> 的代码块</li> <li>Semgrep/CodeQL 可以匹配结构 + 上下文</li></ul> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">rules</span><span class="token punctuation">:</span>
  <span class="token punctuation">-</span> <span class="token key atrule">id</span><span class="token punctuation">:</span> detect<span class="token punctuation">-</span>hardcoded<span class="token punctuation">-</span>password
    <span class="token key atrule">pattern</span><span class="token punctuation">:</span> <span class="token punctuation">|</span><span class="token scalar string">
      password = &quot;...&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>模式匹配 + AST 导航是现代分析工具（如 Semgrep、CodeQL）的重要特性</p> <p>其他方法</p> <table><thead><tr><th>方法</th> <th>说明</th></tr></thead> <tbody><tr><td>符号执行（Symbolic Execution）</td> <td>把变量当成符号而不是具体值进行逻辑推演，用于路径覆盖</td></tr> <tr><td>抽象解释（Abstract Interpretation）</td> <td>对程序执行进行近似建模，保守地发现问题</td></tr> <tr><td>模型检测（Model Checking）</td> <td>建模程序状态机，验证其是否满足规范（如死锁）</td></tr> <tr><td>人工智能辅助分析</td> <td>结合语言模型，自动修复警告或生成规则（GitHub Copilot + CodeQL）</td></tr></tbody></table> <h2 id="lsp-与-jdt-ls"><a href="#lsp-与-jdt-ls" class="header-anchor">#</a> LSP 与 JDT-LS</h2> <p>LSP（Language Server Protocol）</p> <h3 id="jdt-ls"><a href="#jdt-ls" class="header-anchor">#</a> JDT-LS</h3> <p>LSP 即 Language Server Protocol，语言服务器协议，用于 IDE 与语言服务器通信的协议，它定义了诸如“获取调用链”、“转到定义”等请求和响应，前端 IDE 通过 LSP 与 LS 通信获取上述服务</p> <p>常见的 Java 语言服务器：Eclipse JDT Language Server</p> <ul><li><a href="https://github.com/eclipse-jdtls/eclipse.jdt.ls" target="_blank" rel="nofollow noopener noreferrer">eclipse-jdtls/eclipse.jdt.ls: Java language server<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github-wiki-see.page/m/manateelazycat/lsp-bridge/wiki/Eclipse-JDT-Language-Server" target="_blank" rel="nofollow noopener noreferrer">Eclipse JDT Language Server - manateelazycat/lsp-bridge GitHub Wiki<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>JDT-LS 通过 Jar 包启动，JDK 版本要求 &gt;= 21，以 JDK-LS 1.48 为例，其目录结构如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>jdt-language-server-1.48.0-202505152338
|-bin
|-config_linux
|-config_linux_arm
|-config_mac
|-config_mac_arm
|-config_ss_linux
|-config_ss_linux_arm
|-config_Ss_mac
|-config_ss_mac_arm
|-config_ss_win
|-config_win
|-features
|_plugins
    |_org.eclipse.equinox.launcher_1.7.0v20250424-1814.jar
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>启动命令</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">java</span> <span class="token parameter variable">-Declipse.application</span><span class="token operator">=</span>org.eclipse.jdt.ls.core.id1 <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dosgi.bundles.defaultStartLevel</span><span class="token operator">=</span><span class="token number">4</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-Declipse.product</span><span class="token operator">=</span>org.eclipse.jdt.ls.core.product <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dlog.protocol</span><span class="token operator">=</span>true <span class="token punctuation">\</span>
	<span class="token parameter variable">-Dlog.level</span><span class="token operator">=</span>ALL <span class="token punctuation">\</span>
	<span class="token parameter variable">-noverify</span> <span class="token punctuation">\</span>
	<span class="token parameter variable">-Xmx1G</span> <span class="token punctuation">\</span>

    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token class-name">Boolean</span> <span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>

        <span class="token punctuation">}</span> <span class="token keyword">catch</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;Starting LS Process Failed: {}&quot;</span><span class="token punctuation">,</span> e<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token annotation punctuation">@Getter</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerConnection</span><span class="token punctuation">{</span>
    <span class="token class-name">InputStream</span> in<span class="token punctuation">;</span>
    <span class="token class-name">OutputStream</span> out<span class="token punctuation">;</span>
    <span class="token class-name">LanguageServerClient</span> client<span class="token punctuation">;</span>
    <span class="token class-name">Launcher</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">LanguageServer</span><span class="token punctuation">&gt;</span></span> launcher<span class="token punctuation">;</span>
    
    <span class="token keyword">public</span> <span class="token class-name">LanguageServerConnection</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerProcess</span> process<span class="token punctuation">,</span> <span class="token class-name">LanguageServerClient</span> client<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>in <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getIn</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>out <span class="token operator">=</span> process<span class="token punctuation">.</span><span class="token function">getOut</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>client <span class="token operator">=</span> client<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">connect</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token class-name">ExecutorService</span> executorService <span class="token operator">=</span> <span class="token class-name">Executors</span><span class="token punctuation">.</span><span class="token function">newCachedThreadPool</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        laucher <span class="token operator">=</span> <span class="token class-name">LSPLauncher</span><span class="token punctuation">.</span><span class="token function">createClientLauncher</span><span class="token punctuation">(</span>client<span class="token punctuation">,</span> in<span class="token punctuation">,</span> out<span class="token punctuation">,</span> executorService<span class="token punctuation">,</span> <span class="token punctuation">(</span>trace<span class="token punctuation">)</span> <span class="token operator">-&gt;</span> trace<span class="token punctuation">)</span><span class="token punctuation">;</span>
        launcher<span class="token punctuation">.</span><span class="token function">startListening</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;LS Client Started&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>这里的 LanguageClient 是 lsp4j 提供的 LSP 客户端接口，需要我手动继承实现，关键如下</p> <h3 id="language-client"><a href="#language-client" class="header-anchor">#</a> Language Client</h3> <blockquote><p>lsp4j</p></blockquote> <p>Maven 依赖</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token comment">&lt;!-- https://mvnrepository.com/artifact/org.eclipse.lsp4j/org.eclipse.lsp4j --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.eclipse.lsp4j<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>org.eclipse.lsp4j<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>0.24.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>基本思路就是继承 LanguageClient 接口，同时接收一个<code>LanguageServerService</code>用于解锁文件</p> <p>在<code>publishDiagnostics</code>方法中，当收到 didOpen 的回送，调用<code>this.languageServerService.completeFuture(diagnostics.getUri())</code>进行解锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">/**
 * 接收 Language Server 的返回并做出反应
 * 职责:此类是语言服务器(Language Server)所有主动推送消息的接收终点
 * LSP(Language Server Protocol)是一个双向协议，当服务器有信息要通知客户端时，client将收到Diagnostics
 * 回调机制: 此类持有其父级{@link LanguageServerService}的引用，用于解锁，在收到诊断信息时，能够回调上层服务，完成异步工作流
 */</span>
<span class="token annotation punctuation">@Setter</span>
<span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">LanguageServerClient</span> <span class="token keyword">implements</span> <span class="token class-name">LanguageClient</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">Logger</span> logger <span class="token operator">=</span> <span class="token class-name">LogManager</span><span class="token punctuation">.</span><span class="token function">getLogger</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerClient</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">LanguageServerService</span> languageServerService<span class="token punctuation">;</span>


    <span class="token keyword">public</span> <span class="token class-name">LanguageServerClient</span><span class="token punctuation">(</span><span class="token class-name">LanguageServerService</span> languageServerService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>languageServerService <span class="token operator">=</span> languageServerService<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>


    <span class="token comment">// =====================================================================================</span>
    <span class="token comment">// Section 1: 核心通信与诊断 (Core Communication &amp; Diagnostics)</span>
    <span class="token comment">// 这些是任何LSP客户端实现中最基本和最重要的方法。</span>
    <span class="token comment">// =====================================================================================</span>


    <span class="token comment">/**
     * LSP Method: {@code telemetry/event}
     * 作用: 服务器向客户端发送遥测数据或事件，通常用于收集使用情况统计或性能指标
     * 实现: 在我们的场景中，我们只记录接收到的遥测事件以供调试
     * 在生产环境中，可以根据需要将这些数据转发到专门的监控系统
     *
     * @param object 遥测数据，通常是一个JSON对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">telemetryEvent</span><span class="token punctuation">(</span><span class="token class-name">Object</span> object<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;收到遥测事件: {}&quot;</span><span class="token punctuation">,</span> object<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code textDocument/publishDiagnostics}
     * 作用: 服务器使用此通知向客户端推送指定文档的诊断信息（如编译错误、警告、语法提示）
     * 这是LSP提供“红色波浪线”功能的核心
     * 实现: 这是我们架构中最重要的回调方法。当收到诊断信息时，我们不直接处理它
     * 而是立即调用{@link LanguageServerService#completeFuture(String uri)}
     * 这将完成之前在LspService中为该文档创建的{@code CompletableFuture}，从而让等待诊断结果的API调用可以继续执行
     *
     * 参数 Diagnostics 包含文档URI和诊断信息列表的参数对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">publishDiagnostics</span><span class="token punctuation">(</span><span class="token class-name">PublishDiagnosticsParams</span> diagnostics<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;收到诊断信息 for URI: {}&quot;</span><span class="token punctuation">,</span> diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 打印一下诊断信息</span>
<span class="token comment">//        for(Diagnostic diagnostic : diagnostics.getDiagnostics()) {</span>
<span class="token comment">//            logger.info(diagnostic.toString());</span>
<span class="token comment">//        }</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;File {} Opened&quot;</span><span class="token punctuation">,</span> diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 通知 Language Service 诊断已完成</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>languageServerService<span class="token punctuation">.</span><span class="token function">completeFuture</span><span class="token punctuation">(</span>diagnostics<span class="token punctuation">.</span><span class="token function">getUri</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code window/logMessage}
     * 作用: 服务器请求客户端记录一条日志消息。这是一种让服务器日志显示在客户端日志系统中的标准方式
     * 对于调试服务器行为非常有用
     * 实现: 将服务器的消息类型(Error, Warning, Info)映射到自己的Log4j日志级别并记录下来，这使得服务器日志和客户端日志可以统一查看
     *
     * @param message 包含消息类型和内容的参数对象
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">logMessage</span><span class="token punctuation">(</span><span class="token class-name">MessageParams</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">switch</span> <span class="token punctuation">(</span>message<span class="token punctuation">.</span><span class="token function">getType</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

                <span class="token keyword">break</span><span class="token punctuation">;</span>

            <span class="token keyword">case</span> <span class="token class-name">Log</span><span class="token operator">:</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">showMessage</span><span class="token punctuation">(</span><span class="token class-name">MessageParams</span> params<span class="token punctuation">)</span> <span class="token punctuation">{</span>

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">MessageActionItem</span><span class="token punctuation">&gt;</span></span> <span class="token function">showMessageRequest</span><span class="token punctuation">(</span><span class="token class-name">ShowMessageRequestParams</span> requestParams<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">warn</span><span class="token punctuation">(</span><span class="token string">&quot;[Server ShowMessageRequest]: {}. 由于是无头客户端，将不采取行动并立即返回 null&quot;</span><span class="token punctuation">,</span> requestParams<span class="token punctuation">.</span><span class="token function">getMessage</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">// =====================================================================================</span>
    <span class="token comment">// Section 3: 工作区管理 (Workspace Management)</span>
    <span class="token comment">// 这些方法涉及对客户端工作区的修改或查询</span>
    <span class="token comment">// =====================================================================================</span>

    <span class="token comment">/**
     * LSP Method: {@code workspace/applyEdit}
     * 作用: 服务器请求客户端对工作区中的一个或多个文件应用一组文本编辑
     * 这是实现“代码重构”、“快速修复”等功能的关键
     * 实现: 这是一个非常重要的方法。一个全功能的客户端会在这里修改其管理的文档内容
     * 在我们的无头API服务器场景中，我们可以选择
     * 1. 尝试将这些更改应用到我们内存中的虚拟文件系统
     * 2. (当前选择) 简单地接受编辑请求，并假设它已成功
     * 我们记录请求的详细信息，并返回一个表示“编辑已成功应用”的响应
     * 这让服务器可以继续执行后续操作
     *
     * @param params 包含要应用的编辑内容的请求
     * @return 一个包含布尔值{@code applied}的Future，表示编辑是否被应用
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">ApplyWorkspaceEditResponse</span><span class="token punctuation">&gt;</span></span> <span class="token function">applyEdit</span><span class="token punctuation">(</span><span class="token class-name">ApplyWorkspaceEditParams</span> params<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求应用工作区编辑: {}&quot;</span><span class="token punctuation">,</span> params<span class="token punctuation">.</span><span class="token function">getLabel</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 在此可以添加逻辑来实际修改内存中的文件</span>
        <span class="token comment">// ...</span>
        <span class="token comment">// 无论如何，我们都向服务器报告编辑已成功应用。</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token keyword">new</span> <span class="token class-name">ApplyWorkspaceEditResponse</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code workspace/configuration}
     * 作用: 服务器在运行时向客户端请求特定的配置项。例如，JDT-LS可能会询问Java的运行时路径或格式化设置
     * 实现: 客户端负责提供这些配置。在我们的实现中，我们可以返回一个预设的、空的或从外部配置文件加载的配置列表
     * 返回一个空的列表是安全默认选项，表示所有配置都使用服务器的默认值
     *
     * @param configurationParams 包含服务器请求的配置项
     * @return 一个包含配置值列表的Future
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">List</span><span class="token punctuation">&lt;</span><span class="token class-name">Object</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> <span class="token function">configuration</span><span class="token punctuation">(</span><span class="token class-name">ConfigurationParams</span> configurationParams<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">debug</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求配置项: {}&quot;</span><span class="token punctuation">,</span> configurationParams<span class="token punctuation">.</span><span class="token function">getItems</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 返回一个空列表作为默认值，表示没有客户端特定的配置。</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token class-name">Collections</span><span class="token punctuation">.</span><span class="token function">emptyList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code workspace/workspaceFolders}
     * 作用: 服务器查询客户端当前打开的工作区文件夹列表。这在多根(multi-root)工作区中非常重要
     * 实现: 我们的服务在启动时通常会定义一个虚拟的根目录。我们可以返回这个根目录
     * 或者如果没有明确的工作区概念，则返回一个空列表
     *
     * @return 一个包含工作区文件夹列表的Future

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">List</span><span class="token punctuation">&lt;</span><span class="token class-name">WorkspaceFolder</span><span class="token punctuation">&gt;</span><span class="token punctuation">&gt;</span></span> <span class="token function">workspaceFolders</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">debug</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求工作区文件夹列表&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">// 在我们的简单模型中，可以返回null或空列表。</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token class-name">Collections</span><span class="token punctuation">.</span><span class="token function">emptyList</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>


    <span class="token comment">// =====================================================================================</span>
    <span class="token comment">// Section 4: 动态能力注册 (Dynamic Capability Registration)</span>
    <span class="token comment">// 这些方法允许服务器在运行时动态地启用或禁用客户端的某些功能。</span>

    <span class="token comment">/**

     * 作用: 服务器通知客户端，它希望为某个LSP功能动态注册提供者。例如，服务器可能在检测到某个项目文件后才决定要提供代码诊断功能

     *

     * @return 一个表示操作完成的Future
     */</span>
    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Void</span><span class="token punctuation">&gt;</span></span> <span class="token function">registerCapability</span><span class="token punctuation">(</span><span class="token class-name">RegistrationParams</span> params<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求动态注册能力: {}&quot;</span><span class="token punctuation">,</span> params<span class="token punctuation">.</span><span class="token function">getRegistrations</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * LSP Method: {@code client/unregisterCapability}
     * 作用: 服务器通知客户端，它希望撤销之前动态注册的某个功能
     * 实现: 记录请求并返回成功

    <span class="token annotation punctuation">@Override</span>
    <span class="token keyword">public</span> <span class="token class-name">CompletableFuture</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Void</span><span class="token punctuation">&gt;</span></span> <span class="token function">unregisterCapability</span><span class="token punctuation">(</span><span class="token class-name">UnregistrationParams</span> params<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        logger<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;服务器请求动态撤销注册能力: {}&quot;</span><span class="token punctuation">,</span> params<span class="token punctuation">.</span><span class="token function">getUnregisterations</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token class-name">CompletableFuture</span><span class="token punctuation">.</span><span class="token function">completedFuture</span><span class="token punctuation">(</span><span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

mber">552</span><br></div></div><h2 id="javaparser-分析"><a href="#javaparser-分析" class="header-anchor">#</a> JavaParser 分析</h2> <blockquote><p>LSP + JP 方案获取调用链</p></blockquote> <p>Java Parser 能够对实例化过程进行语义分析，从而分析出真正的实例化对象是谁，和 LSP 搭配能够产出真正准确的调用链</p> <ul><li><a href="https://javaparser.org/" target="_blank" rel="nofollow noopener noreferrer">JavaParser - Home<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/javaparser/javaparser" target="_blank" rel="nofollow noopener noreferrer">javaparser/javaparser: Java 1-21 Parser and Abstract Syntax Tree for Java with advanced analysis functionalities.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>核心类</p> <table><thead><tr><th>名称</th> <th>功能</th></tr></thead> <tbody><tr><td><code>JavaParser</code></td> <td>语法分析器，构建 Java 源码的 AST</td></tr> <tr><td><code>JavaSymbolSolver</code></td> <td>做静态符号解析（变量、方法、类之间的引用关系），基于类型信息解析方法调用、变量引用等</td></tr> <tr><td><code>CombinedTypeSolver</code></td> <td>提供类路径上的类型信息（包括 JRE、项目源码、依赖 jar）</td></tr></tbody></table> <p>Maven 依赖</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>分析示例：<code>ProjectAnalyzer</code>分析一个目录下的所有 Java 代码，记录各自的语法树</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ProjectAnalyzer</span> <span class="token punctuation">{</span>

        <span class="token class-name">File</span><span class="token punctuation">[</span><span class="token punctuation">]</span> files <span class="token operator">=</span> root<span class="token punctuation">.</span><span class="token function">listFiles</span><span class="token punctuation">(</span>f <span class="token operator">-&gt;</span> f<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">endsWith</span><span class="token punctuation">(</span><span class="token string">&quot;.java&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>在遍历 AST 的同时获取信息</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">JsonGenerator</span> <span class="token punctuation">{</span>

            <span class="token class-name">String</span> filePath <span class="token operator">=</span> entry<span class="token punctuation">.</span><span class="token function">getKey</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

                            <span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span>p <span class="token operator">-&gt;</span> p<span class="token punctuation">.</span><span class="token function">getTypeAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot; &quot;</span> <span class="token operator">+</span> p<span class="token punctuation">.</span><span class="token function">getNameAsString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

                        <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

                    <span class="token punctuation">}</span>

                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span>

            output<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>filePath<span class="token punctuation">,</span> classInfos<span class="token punctuation">)</span><span class="token punctuation">;</span>

="line-number">51</span><br></div></div><p>将得到的 AST 分析信息，直接在本地 H2DB 建表，存储调用链记录</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    id<span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
    uri<span class="token operator">:</span> <span class="token string">&quot;/Ark-Auth/ark-crypto/src/main/java/cia/arkrypto/auth/crypto/Auth.java&quot;</span><span class="token punctuation">,</span>
    reference_uri<span class="token operator">:</span> <span class="token string">&quot;/Ark-Auth/ark-crypto/src/main/java/cia/arkrypto/auth/controller/AuthController.java&quot;</span><span class="token punctuation">,</span>
    reference_name<span class="token operator">:</span> <span class="token string">&quot;verify(Map&lt;String, Object&gt;)&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>LLM 用的时候直接 Select 查表拿取代码信息</p> <h2 id="mcp-服务"><a href="#mcp-服务" class="header-anchor">#</a> MCP 服务</h2> <p>MCP（Model Context Protocol），模型上下文协议，在原有业务逻辑上套一层网络协议的壳</p> <h3 id="tool-calling-方法"><a href="#tool-calling-方法" class="header-anchor">#</a> Tool Calling 方法</h3> <p>MCP 的前奏，通过 @Tool 注解注入 Spring</p> <ul><li>Kryo：文档生成</li> <li>Knife4j</li> <li>Hutool</li> <li>Jsoup：网页抓取</li> <li>SearchAPI：搜索引擎</li></ul> <p>现在应该更多的选择工具调用，而非 MCP，只有公共服务，例如 LSP 服务，需要提供给多个 AI 应用，才会考虑 MCP 部署，这符合最小设计原则</p> <p>因为从 Tool 提取到 MCP Server 很简单，但从 MCP 耦合到单个项目将是一个麻烦的问题</p> <p>一个简单的天气调用的 Tool</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Service</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">WeatherService</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@Tool</span><span class="token punctuation">(</span>description <span class="token operator">=</span> <span class="token string">&quot;获取指定城市的天气信息&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">getWeather</span><span class="token punctuation">(</span>
            <span class="token annotation punctuation">@ToolParameter</span><span class="token punctuation">(</span>description <span class="token operator">=</span> <span class="token string">&quot;城市名称，如北京、上海&quot;</span><span class="token punctuation">)</span> <span class="token class-name">String</span> cityName<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">// 实现天气查询逻辑</span>
        <span class="token keyword">return</span> <span class="token string">&quot;城市&quot;</span> <span class="token operator">+</span> cityName <span class="token operator">+</span> <span class="token string">&quot;的天气是晴天，温度22°C&quot;</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>有多种方式进行调用：一是手动注入工具</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">AIController</span> <span class="token punctuation">{</span>

    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">ChatClient</span> chatClient<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token keyword">final</span> <span class="token class-name">WeatherService</span> weatherService<span class="token punctuation">;</span>

    <span class="token comment">// 注入你的 Tool Service</span>
    <span class="token keyword">public</span> <span class="token class-name">AIController</span><span class="token punctuation">(</span><span class="token class-name">ChatClient<span class="token punctuation">.</span>Builder</span> builder<span class="token punctuation">,</span> <span class="token class-name">WeatherService</span> weatherService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>chatClient <span class="token operator">=</span> builder<span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>weatherService <span class="token operator">=</span> weatherService<span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/chat&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">chat</span><span class="token punctuation">(</span><span class="token annotation punctuation">@RequestParam</span> <span class="token class-name">String</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> chatClient<span class="token punctuation">.</span><span class="token function">prompt</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">user</span><span class="token punctuation">(</span>message<span class="token punctuation">)</span>
                <span class="token comment">// 手动指定只加载天气工具</span>
                <span class="token punctuation">.</span><span class="token function">tools</span><span class="token punctuation">(</span>weatherService<span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">call</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
                <span class="token punctuation">.</span><span class="token function">content</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>二是在全局注入工具</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Configuration</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">SpringAIConfig</span> <span class="token punctuation">{</span>

    <span class="token comment">/**
     * 自动扫描所有带有 @Tool 注解的 Bean，注册为全局工具
     */</span>
    <span class="token annotation punctuation">@Bean</span>
    <span class="token keyword">public</span> <span class="token class-name">ToolCallbackProvider</span> <span class="token function">weatherTools</span><span class="token punctuation">(</span><span class="token class-name">WeatherService</span> weatherService<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token class-name">MethodToolCallbackProvider</span><span class="token punctuation">.</span><span class="token function">builder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">toolObjects</span><span class="token punctuation">(</span>weatherService<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">build</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>配置后，所有<code>ChatClient</code>调用 chat 都会自动携带这个天气工具</p> <h3 id="mcp-协议流程"><a href="#mcp-协议流程" class="header-anchor">#</a> MCP 协议流程</h3> <p>基于 JSON-RPC 2.0，整个流程严格分为 3 个生命周期阶段，可以理解为一次微服务的调用，完整的协议流程如下</p> <ol><li>初始化：类似于三次握手，只不过以 json 格式通信</li> <li>发现 / 调用：通过 json 发送<code>/tool/list</code>和<code>tool/call</code>等请求</li> <li>关闭：同样通过 json 发送<code>cancel</code>请求断开连接</li></ol> <p>客户端发起初始化请求：Client → Server</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;id&quot;</span><span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
  <span class="token property">&quot;method&quot;</span><span class="token operator">:</span> <span class="token string">&quot;initialize&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;params&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;protocolVersion&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2024-11-05&quot;</span><span class="token punctuation">,</span>   <span class="token comment">// 客户端支持的版本</span>
    <span class="token property">&quot;capabilities&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>                  <span class="token comment">// 客户端能力</span>
      <span class="token property">&quot;roots&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span> <span class="token property">&quot;listChanged&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span> <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;sampling&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;clientInfo&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;name&quot;</span><span class="token operator">:</span> <span class="token string">&quot;Claude&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;version&quot;</span><span class="token operator">:</span> <span class="token string">&quot;1.0&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>服务端初始化响应：Server → Client</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;id&quot;</span><span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">,</span>
  <span class="token property">&quot;result&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;protocolVersion&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2024-11-05&quot;</span><span class="token punctuation">,</span>   <span class="token comment">// 协商后版本</span>
    <span class="token property">&quot;capabilities&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>                  <span class="token comment">// 服务端能力</span>
      <span class="token property">&quot;tools&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span> <span class="token property">&quot;listChanged&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span> <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;resources&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span> <span class="token property">&quot;listChanged&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span> <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;prompts&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;logging&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">,</span>
    <span class="token property">&quot;serverInfo&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;name&quot;</span><span class="token operator">:</span> <span class="token string">&quot;FileServer&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;version&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2.1&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p>初始化通知：Client → Server，无<code>id</code>、无返回表示初始化完成</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;method&quot;</span><span class="token operator">:</span> <span class="token string">&quot;notifications/initialized&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;params&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>建立连接后，客户端发起查询工具请求<code>tools/list</code></p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// → 请求</span>
<span class="token punctuation">{</span><span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span><span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;id&quot;</span><span class="token operator">:</span><span class="token number">2</span><span class="token punctuation">,</span><span class="token property">&quot;method&quot;</span><span class="token operator">:</span><span class="token string">&quot;tools/list&quot;</span><span class="token punctuation">}</span>

<span class="token comment">// ← 响应</span>
<span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span><span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;id&quot;</span><span class="token operator">:</span><span class="token number">2</span><span class="token punctuation">,</span>
  <span class="token property">&quot;result&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;tools&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
      <span class="token punctuation">{</span>
        <span class="token property">&quot;name&quot;</span><span class="token operator">:</span> <span class="token string">&quot;read_file&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;description&quot;</span><span class="token operator">:</span> <span class="token string">&quot;读取文本文件&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;inputSchema&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
          <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;object&quot;</span><span class="token punctuation">,</span>
          <span class="token property">&quot;properties&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token property">&quot;path&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span><span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;string&quot;</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">,</span>
          <span class="token property">&quot;required&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span><span class="token string">&quot;path&quot;</span><span class="token punctuation">]</span>
        <span class="token punctuation">}</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">]</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>服务器响应：Server → Client</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// → 请求</span>
<span class="token punctuation">{</span><span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span><span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;id&quot;</span><span class="token operator">:</span><span class="token number">3</span><span class="token punctuation">,</span><span class="token property">&quot;method&quot;</span><span class="token operator">:</span><span class="token string">&quot;resources/list&quot;</span><span class="token punctuation">}</span>

<span class="token comment">// ← 响应</span>
<span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span><span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;id&quot;</span><span class="token operator">:</span><span class="token number">3</span><span class="token punctuation">,</span>
  <span class="token property">&quot;result&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;resources&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
      <span class="token punctuation">{</span><span class="token property">&quot;uri&quot;</span><span class="token operator">:</span><span class="token string">&quot;file:///docs/&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;name&quot;</span><span class="token operator">:</span><span class="token string">&quot;文档目录&quot;</span><span class="token punctuation">,</span><span class="token property">&quot;type&quot;</span><span class="token operator">:</span><span class="token string">&quot;directory&quot;</span><span class="token punctuation">}</span>
    <span class="token punctuation">]</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>真正执行工具，客户端发起<code>tool/call</code>请求，以 read_file 工具为例</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;jsonrpc&quot;</span><span class="token operator">:</span> <span class="token string">&quot;2.0&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;id&quot;</span><span class="token operator">:</span> <span class="token number">4</span><span class="token punctuation">,</span>
  <span class="token property">&quot;method&quot;</span><span class="token operator">:</span> <span class="token string">&quot;tools/call&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;params&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;name&quot;</span><span class="token operator">:</span> <span class="token string">&quot;read_file&quot;</span><span class="token punctuation">,</span>
    <span class="token property">&quot;arguments&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
