#大模型概述" class="header-anchor">#</a> 大模型概述</h2> <h3 id="transformer"><a href="#transformer" class="header-anchor">#</a> Transformer</h3> <blockquote><p>英伟达慈父</p></blockquote> <p>深度学习历程</p> <ul><li>2012：AlexNet 依据 CUDA GPU 算力 + CNN 卷积神经网络 + 大数据标注图片实现多层的神经网络训练</li> <li>2013~2014：疯狂堆深度，GoogleNet 在几十层曲线非常美妙，但深度达到三位数，力大飞砖没效果了，回归曲线开始下滑
<ul><li>一开始认为是发生了梯度消失 / 爆炸，但 Batch Normalization（2015） 基本缓解了这个问题，仍会出现退化</li> <li>根本原因是深层训练优化极其困难，难以建立起有效的恒等映射</li></ul></li> <li>2015：何凯明提出 ResNet，通过<strong>残差连接</strong>解决退化问题，通过 shortcut 跳跃连接使用恒等映射保底，使得模型层数进入 3、4 位数</li> <li>2016~2017：一直在玩残差网络，将 CNN（Convolutional Neural Networks）逐步完善</li> <li>2017：提出 Transformer，完全不用卷积 / 循环，只用自注意力机制训练神经网络，最开始用在 NLP（解决长距离依赖），后来才用在 CV 做图像处理，再后来用在语言模型</li></ul> <p>CNN 和 Transformer 都是在做提取图像特征、建模像素 / 区域之间的关联，其区别在于</p> <ul><li>CNN：用卷积核 + 局部滑动做特征</li> <li>Transformer：用自注意力 Self-Attention 做特征</li></ul> <p>Transformer 架构</p> <img src="/assets/img/transformer.38ac8e7c.png"> <p>代码复现：Transformer 模型编码器</p> <ul><li>输入嵌入层</li> <li>位置编码</li> <li>多头自注意力层</li> <li>层归一化</li> <li>前馈神经网络</li></ul> <p>参考</p> <ol><li><a href="https://www.youtube.com/watch?v=ISNdQcPhsts" target="_blank" rel="nofollow noopener noreferrer">Coding a Transformer from scratch on PyTorch, with full explanation, training and inference-YouTube<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/jadore801120/attention-is-all-you-need-pytorch" target="_blank" rel="nofollow noopener noreferrer">A PyTorch implementation of the Transformer model in &quot;Attention is All You Need&quot;<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ol> <p>输入嵌入层：获取句子输入处理为 512 维的向量，即 d_model</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token triple-quoted-string string">'''输入器'''</span>
<span class="token keyword">class</span> <span class="token class-name">InputEmbeddings</span><span class="token punctuation">(</span>nn<span class="token punctuation">.</span>Module<span class="token punctuation">)</span><span class="token punctuation">:</span>

    <span class="token keyword">def</span> <span class="token function">__init__</span><span class="token punctuation">(</span>self<span class="token punctuation">,</span> d_model<span class="token punctuation">:</span> <span class="token builtin">int</span><span class="token punctuation">,</span> vocab_size<span class="token punctuation">:</span> <span class="token builtin">int</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token builtin">super</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>__init__<span class="token punctuation">(</span><span class="token punctuation">)</span>
        self<span class="token punctuation">.</span>d_model <span class="token operator">=</span> d_model
        self<span class="token punctuation">.</span>vocab_size <span class="token operator">=</span> vocab_size
        self<span class="token punctuation">.</span>embedding <span class="token operator">=</span> nn<span class="token punctuation">.</span>embedding<span class="token punctuation">(</span>vocab_size<span class="token punctuation">,</span> d_model<span class="token punctuation">)</span>


    <span class="token keyword">def</span> <span class="token function">forward</span><span class="token punctuation">(</span>self<span class="token punctuation">,</span> x<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">return</span> self<span class="token punctuation">.</span>embedding<span class="token punctuation">(</span>x<span class="token punctuation">)</span> <span class="token operator">*</span> math<span class="token punctuation">.</span>sqrt<span class="token punctuation">(</span>self<span class="token punctuation">.</span>d_model<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>通过 torch.nn 直接构建从句子长度（vocab_size）到所需向量（d_model）的嵌入层，同时，论文中把 √d_model 作为该层的权重与之相乘</p> <p>位置编码：对输入嵌入生成的向量进行位置编码</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="37.836ex" height="11.736ex" role="img" focusable="false" viewBox="0 -2843.6 16723.3 5187.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-5.302ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(751,0)"><path data-c="1D438" d="M492 213Q472 213 472 226Q472 230 477 250T482 285Q482 316 461 323T364 330H312Q311 328 277 192T243 52Q24 <span class="token triple-quoted-string string">'''如何构建向量'''</span>

                    key <span class="token operator">=</span> key<span class="token punctuation">.</span>view<span class="token punctuation">(</span>key<span class="token punctuation">.</span>shape<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">,</span> key<span class="token punctuation">.</span>shape<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">,</span> self<span class="token punctuation">.</span>h<span class="token punctuation">,</span> self<span class="token punctuation">.</span>d_k<span class="token punctuation">)</span><span class="token punctuation">.</span>transpose<span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">)</span>

 概率分布差异很大。采集几百条 prompt 的 top-5 logprob 统计对比，可以缩小范围</p></li> <li><p>特殊 Token：不同模型的控制 Token，例如思考过程中的 <code>&lt;think&gt;, &lt;|im_start|&gt;, &lt;|endoftext|&gt;</code> 不相同</p></li> <li><p>知识截止：问模型最近发生的事件，结合公开的训练节点推断</p></li> <li><p>风格：比较玄学了，例如 GPT 喜欢列任务，Deepseek 废话少</p></li></ol> <p>设计一个有效的 Tokenizer 探针，文本集覆盖容易产生差异的输入：多语言混合、生僻 Unicode、代码片段、长数字串、特定中文组合</p> <ul><li>最常见的方式：冷知识探针</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>构造文本集：构造探针文本
	↓
采集指纹：调用 Tokenizer 切分文本
	↓
建指纹库：将文本递给已知模型切分
	↓
比对：将未知模型的切分和指纹库比对
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>在训练大模型时使用 activation checkpointing（激活检查点）主要是为了？激活检查点牺牲计算速度，只保存部分激活值，反向时重算其余激活，以此降低显存占用峰值</p> <ul><li>A、减少模型参数数量</li> <li>B、自动提高数值精度</li> <li>C、降低显存峰值</li> <li>D、尽可能保存中间激活以加速反向传播</li></ul> <p>为什么在深度学习优化中常用 L2 正则化来提升稳定性？L2 正则惩罚大权重，抑制过拟合，让模型不会因输入微小变化产生剧烈输出波动</p> <ul><li>A、它能限制权重大小，降低模型对输入微小扰动的敏感度</li> <li>B、它能保证全局最优解</li> <li>C、它可以消除所有零特征值</li> <li>D、它可以缩短训练时间</li></ul> <p>当使用交叉损失函数时，若真实标签为 one-hot 编码 <code>[0,1,0]</code>，模型输出概率为 <code>[0.1,0.8,0.1]</code>，其损失值为多少？交叉熵仅计算真实类别对应的预测概率损失，这里真实类别对应概率 0.8，损失为 <code>-log(0.8)</code></p> <ul><li>A、<code>log(0.8)</code></li> <li>B、<code>-log(0.8)</code></li> <li>C、<code>-(log(0.1)+log(0.8)+log(0.1))</code></li> <li>D、<code>0.8</code></li></ul> <p>在进行 PCA 之前，为什么通常建议先对特征做标准化处理？PCA 依靠方差筛选主成分，不同单位、量级的特征会干扰方差权重，标准化消除量纲影响</p> <ul><li>A、因为标准化可以直接得到主成分</li> <li>B、因为PCA只能处理服从正态分布的数据</li> <li>C、因为标准化可以让不同量纲的特征在方差计算中更公平</li> <li>D、因为标准化后特征一定会线性无关</li></ul> <p>在复杂多模态预测任务（如 VQA）中，后融合（Late Fusion）是指？后融合先分开编码图像、文本等不同模态，到模型后端/输出决策阶段再融合信息</p> <ul><li>A、仅使用图像特征</li> <li>B、使用独立的编码器后，仅在决策层融合特征</li> <li>C、在输入层将图文拼接</li> <li>D、使用单一 Transformer 处理所有模态</li></ul> <p>在深度神经网络的典型结构中，隐藏层的主要作用是？隐藏层依靠权重、激活函数做多层非线性转换，提取原始数据里复杂高阶特征</p> <ul><li>A、负责显示模型的最终预测结果（如分类标签或回归数值）</li> <li>B、接收外部输入的原始数据，并将其直接传递给输出层</li> <li>C、通过多层次的非线性变换，从原始特征中自动提取和构造更高阶的特征表示</li> <li>D、存储训练过程中的损失函数值，以便计算梯度的方向</li></ul> <p>某电商的智能客服平台为了挖掘用户痛点，以便进行产品改进，通过分析大量未标注的用户问题，对用户常见问题进行自动分类，针对该任务下面说法正确的是？数据无人工标签，模型依靠样本相似度自动聚类分组，属于无监督学习</p> <ul><li>A、为了提升产品质量进行问题分析，属于强化学习</li> <li>B、对用户问题生成了分类，属于生成式学习</li> <li>C、对未标注的用户问题进行分类，属于无监督学习</li> <li>D、对已有的用户问题进行分类，属于监督学习</li></ul> <p>当用户评分数据存在明显的评分尺度差异时（如用户 A 评分范围为 1~5，用户 B 评分范围为 3~5），更适合使用？皮尔逊只关注评分变化趋势，能抵消不同用户打分区间、尺度带来的偏差</p> <ul><li>A、汉明距离</li> <li>B、欧几里得距离</li> <li>C、皮尔逊相关系数</li> <li>D、曼哈顿距离</li></ul> <p>在 VLLM 中，PagedAttention 使用固定大小的 Block 来管理 KV Cache，如果将 Block Size 设为 1，会产生什么主要问题？每个 token 单独占用一个块，映射表规模暴增，内存访问碎片化，推理性能大幅下降</p> <ul><li>A、模型无法加载</li> <li>B、显存利用率达到 100%</li> <li>C、计算吞吐量大幅提升</li> <li>D、Mapping Table 元数据开销过大且访问不连续</li></ul> <p>在评估预训练数据质量时，困惑度（Perplexity）常被用作指标，对一份高质量、符合目标分布的文本，模型对其计算的困惑度通常表现为？困惑度越低，模型对文本样本的预测概率越高，代表文本分布贴合模型训练目标</p> <ul><li>A、困惑度越高，表示数据越符合模型分布</li> <li>B、困惑度仅用于评估生成多样性</li> <li>C、困惑度越低，表示模型对数据的预测越准确</li> <li>D、困惑度与数据质量无关</li></ul> <p>某模型推理时，KV Cache 采用&quot;滑动窗口&quot;机制（窗口大小为 20），Prefill 阶段处理 30 个 token 的 prompt，Decode 阶段已生成 15 个 token，此时 KV Cache 中保留的 token 数量及自注意力计算的上下文长度分别为？滑动窗口机制仅留存最近 20 个 token，注意力计算仅使用窗口内 20 个 token</p> <ul><li>A、20个，20个</li> <li>B、15个，20个</li> <li>C、30+15=45个，45个</li> <li>D、20个，15个</li></ul> <p>关于奇异值分解（SVD，Singular Value Decomposition），下列哪项说法正确？标准 SVD 分解式 A=UΣV 转置，U、V 均为正交矩阵，任意矩阵都可做 SVD，奇异值恒非负</p> <ul><li>A、U 和 V 可以取为正交矩阵</li> <li>B、做 SVD 必须要求矩阵可逆</li> <li>C、只有方阵才能做 SVD</li> <li>D、奇异值可以为任意负数</li></ul> <p>关于余弦相似度（Cosine Similarity）与欧几里得距离（Euclidean Distance）的特性，以下说法最准确的是？余弦相似度只对比向量夹角，和向量模长无关；欧氏距离同时受向量方向、长度共同影响</p> <ul><li>A、余弦相似度仅反映向量的方向相对关系；欧几里得距离同时反映方向差异和绝对长度差异</li> <li>B、将两个向量单位化（归一化到单位长度）后，余弦相似度与欧几里得距离可以相互转换，结果等价</li> <li>C、两者都只反映向量的方向差异，与向量长度无关</li> <li>D、余弦相似度考虑向量的绝对长度，欧几里得距离不考虑</li></ul> <h3 id="模型训练过程"><a href="#模型训练过程" class="header-anchor">#</a> 模型训练过程</h3> <p>现在的大模型训练已经不是一个非常技术化的活，愈加偏向于工程化；微调、蒸馏及量化，都属于后训练，GLM5.3 和 DeepSeek 4 Flash 都是在前代基础上后训练的成果</p> <ol><li>预训练（在海量语料上自监督学习） → Base Model，该阶段的模型只会“续写”文本，但不会“回答问题”，不知道正确与否</li> <li>持续预训练（喂垂直领域语料） → 领域基座</li> <li>监督微调 / 指令微调（SFT） → SFT Model</li> <li>RLHF 对齐（训练 RM → PPO/DPO 优化） → 对齐模型</li> <li>下游任务微调 / PEFT（接入具体业务数据/使用 LoRA） → 业务模型</li> <li>蒸馏 + 量化（追求推理速度和体积） → 部署模型</li></ol> <p>模型微调：SFT（ Supervised Fine-Tuning）监督微调，SFT 用海量的“问题-答案”对（Prompt-Response）喂给主模型，告知其怎么回答是对的，通常所说的微调（Fine-Tuning）指的就是这一阶段工作</p> <p>RLHF（Reinforcement Learning from Human Feedback）通过人类反馈的强化学习，RLHF 的三个阶段即 SFT - RM - PPO</p> <ul><li>RM（Reward Model）奖励模型，专门训练一个小模型，专门对主模型的回答进行量化评分</li> <li>PPO（Proximal Policy Optimization）近端策略优化，主模型每生成一句话，RM 就打个分，而 PPO 负责把主模型的参数往“高分方向”微调</li></ul> <p>当前工业界正在向 DPO / RFT 等简化方案迁移：大致思路是把 RM 和 PPO 合并，把“打分”的逻辑写进损失函数里，在后训练时一步对齐</p> <h2 id="后训练"><a href="#后训练" class="header-anchor">#</a> 后训练</h2> <h3 id="微调"><a href="#微调" class="header-anchor">#</a> 微调</h3> <h3 id="蒸馏"><a href="#蒸馏" class="header-anchor">#</a> 蒸馏</h3> <h3 id="量化"><a href="#量化" class="header-anchor">#</a> 量化</h3> <h2 id="联邦学习算法"><a href="#联邦学习算法" class="header-anchor">#</a> 联邦学习算法</h2> <p>联邦学习 = 归并式的机器学习，子模型在各自机器上训练开发，主模型通过提交的 PR 进行增量更新</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/97d23c/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">神经网络与深度学习</div></a> <a href="/pages/305aba/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">函数、极限和连续</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
