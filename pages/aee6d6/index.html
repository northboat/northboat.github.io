</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>进入 redis 目录编译下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> redis-6.2.6.tar.gz

yay <span class="token parameter variable">-S</span> <span class="token function">make</span>
yay <span class="token parameter variable">-S</span> pkg-config

<span class="token function">make</span> <span class="token operator">&amp;&amp;</span> <span class="token function">make</span> <span class="token function">install</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>默认安装路径</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>/usr/local/bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>进入该目录，将redis.conf拷贝至当前目录，使用这个拷贝的文件进行配置启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">mkdir</span> config
<span class="token function">cp</span> /home/northboat/redis-6.2.6/redis.conf config
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>修改默认启动方式</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> config
<span class="token function">vim</span> redis.conf
<span class="token comment">#设置 daemonize 为 yes 保存并退出</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>在 /usr/local/bin 目录下启动服务，通过指定的配置文件启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>redis-server config/redis.conf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>数据库操作与命名：连接 redis</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token comment"># -h 默认为本机</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>查看 redis 进程是否开启</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">ps</span> -ef<span class="token operator">|</span><span class="token function">grep</span> redis

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>设置密码，在 redis.conf 中搜索 requirepass，插入新行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># vim搜索：&quot;:/requirepass&quot;，按寻找下一个</span>
requirepass <span class="token number">123456</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>在登录 redis 后验证密码即可操作数据</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>auth <span class="token string">&quot;123456&quot;</span>

<span class="token comment">#或在启动时验证，这样并不安全，因为密码可见</span>
redis-cli <span class="token parameter variable">-p</span> <span class="token number">6379</span> <span class="token parameter variable">-a</span> <span class="token number">123456</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>可视化工具：<a href="https://gitee.com/qishibo/AnotherRedisDesktopManager" target="_blank" rel="nofollow noopener noreferrer">Another Redis Desktop Manager<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="数据类型"><a href="#数据类型" class="header-anchor">#</a> 数据类型</h3> <p>键规范：业界规范即采用冒号作为分隔符表示数据的层级关系，一套常用的结构模板</p> <table><thead><tr><th>类型</th> <th>命名规则</th> <th>示例</th></tr></thead> <tbody><tr><td>用户 Token 存储</td> <td><code>login:token:{token}</code></td> <td><code>login:token:abc123</code></td></tr> <tr><td>用户 ID 映射 Token</td> <td><code>login:user:{userId}</code></td> <td><code>login:user:u001</code></td></tr> <tr><td>缓存（对象）</td> <td><code>cache:{业务}:{标识}</code></td> <td><code>cache:user:u001</code></td></tr> <tr><td>限流</td> <td><code>rate_limit:{类型}:{标识}</code></td> <td><code>rate_limit:ip:127.0.0.1</code></td></tr> <tr><td>队列</td> <td><code>queue:{业务}</code></td> <td><code>queue:email</code></td></tr> <tr><td>计数器</td> <td><code>counter:{业务}:{标识}</code></td> <td><code>counter:login_fail:u001</code></td></tr> <tr><td>分布式锁</td> <td><code>lock:{资源}</code></td> <td><code>lock:order:123456</code></td></tr> <tr><td>会话管理</td> <td><code>session:{sessionId}</code></td> <td><code>session:sess_abc123</code></td></tr></tbody></table> <p>String：从<code>Redis</code>中取出的字符串在<code>Java</code>程序中会显示为<code>&quot;NorthBoat&quot;</code>的形式，要加转义字符<code>\&quot;</code>表示双引号</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> <span class="token keyword">set</span> name NorthBoat
OK
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> get name
<span class="token string">&quot;NorthBoat&quot;</span>

<span class="token comment"># 批量设置</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mset id <span class="token number">4</span> grade <span class="token number">11</span>
OK
<span class="token comment"># 批量获取</span>
<span class="token number">127.0</span><span class="token number">.0</span><span class="token number">.1</span>:<span class="token number">6379</span><span class="token operator">&gt;</span> mget id grade
<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;4&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;11&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>List</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 向左插入队列</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lpush <span class="token builtin class-name">test</span> redis
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>

<span class="token number">1</span><span class="token punctuation">)</span> <span class="token string">&quot;redis&quot;</span>
<span class="token number">2</span><span class="token punctuation">)</span> <span class="token string">&quot;mysql&quot;</span>

<span class="token comment"># 查看队列长度</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> llen <span class="token builtin class-name">test</span>

<span class="token comment"># 删除元素</span>
<span class="token comment"># 1 表示从左向右找第一个元素删</span>
<span class="token comment"># -1 表示从右向左找第一个元素删</span>
<span class="token comment"># 0 表示把该元素删完</span>
<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> lrem <span class="token builtin class-name">test</span> <span class="token number">1</span> mysql

<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> ltrim <span class="token builtin class-name">test</span> <span class="token number">1</span> <span class="token number">0</span> 
<span class="token punctuation">(</span>integer<span class="token punctuation">)</span> <span class="token number">1</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>Hash：一个嵌套的哈希表<code>Map&lt;String, Map&lt;String, Object&gt;&gt;</code></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 获取key表中itme对应的值</span>
<span class="token keyword">public</span> <span class="token class-name">Object</span> <span class="token function">hget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">String</span> item<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> item<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 获取整个Hash表</span>
<span class="token keyword">public</span> <span class="token class-name">Map</span> <span class="token function">hmget</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">return</span> myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">entries</span><span class="token punctuation">(</span>key<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 简单设置一个Hash</span>
<span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">hmset</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> map<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>
        myRedisTemplate<span class="token punctuation">.</span><span class="token function">opsForHash</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">putAll</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> map<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token comment">// 设置一个Hash，并设置生效时间，调用上面的设置key生效时间的方法</span>
<span class="token keyword">public</span> <span class="token keyword">boolean</span> <span class="token function">hmset</span><span class="token punctuation">(</span><span class="token class-name">String</span> key<span class="token punctuation">,</span> <span class="token class-name">Map</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> map<span class="token punctuation">,</span> <span class="token keyword">long</span> time<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">try</span><span class="token punctuation">{</span>

        <span class="token keyword">if</span><span class="token punctuation">(</span>time <span class="token operator">&gt;</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">expire</span><span class="token punctuation">(</span>key<span class="token punctuation">,</span> time<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span><span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>

e class="language-bash"><code><span class="token comment"># 添加 sadd</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>Zset / SortedSet：有序集合，每个元素有一个 double 类型的权重，Zset 将根据权重对元素进行排序<code>Map&lt;String, Map&lt;String, Double&gt;&gt;</code></p> <ul><li>zadd key weight val：添加成员，weight 为权重</li> <li>zrange start end：查询下标 start 到 end 的元素</li> <li>zrem key member：删除成员</li> <li>zcard key：查询数量</li></ul> <p>特殊数据类型支持</p> <ul><li>Geospatial（地理空间）：用于存储地理位置信息，支持距离计算、范围查询等功能</li> <li>HyperLogLog：用于基数统计（估算集合中不重复元素的数量），内存效率极高，适用于大数据量的去重计数</li> <li>Bitmap（位图）：基于字符串类型的二进制位操作，适合处理大量状态标记场景</li> <li>Json：存储 json string 以承载关系数据的缓存，键用前缀 + MySQL 主键</li> <li>向量存储：可以通过 Redis Vectorset 实现向量存储</li></ul> <h3 id="持久化方法"><a href="#持久化方法" class="header-anchor">#</a> 持久化方法</h3> <blockquote><p>日志和快照</p></blockquote> <p>Redis 有两种持久化方法，RDB（Redis Database）和 AOF（Append Only File）</p> <ol><li>RDB：在指定间隔（小时为单位）新 fork 一个子线程来保存数据集的时间点<strong>快照</strong></li> <li>AOF：使用后台进程记录服务器接收到的每一个写操作，类似于<strong>写日志</strong>，这些操作可以在服务器启动时重新执行，以重建原始数据集</li></ol> <p>从保存的频率、资源的消耗、恢复的速度上来看</p> <ul><li>AOF 的持久化更密集（以秒为单位进行记录），但记录的是写命令日志，在恢复时重新进行写，恢复较慢</li> <li>而 RBD 的备份更松散（以小时为单位），且保存更耗费资源，但快照保存的更为完整，允许大数据集快速重启</li></ul> <p>其中</p> <ul><li>保存的频率决定了数据安全等级，频率越高，数据一致性保障越高，AOF fsync 1s 能够应对突然断电的情况</li> <li>存储的消耗上，AOF 比 RBD 消耗更高，因为快照文件更为紧凑</li> <li>性能上，一般而言 RBD 比 AOF 更好，但即使 fsync 每秒一次，AOF 性能表现仍然不错</li></ul> <p>值得注意的是：AOF 方式中，即使日志由于某种原因（磁盘满或其他原因）以一个写了一半的命令结束，redis-check-aof 工具能轻松修复</p> <p><a href="https://redis.io/docs/latest/operate/rs/databases/configure/database-persistence/" target="_blank" rel="nofollow noopener noreferrer">配置数据库持久化 | 文档 - Configure database persistence | Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>数据库持久化选项</p> <table><thead><tr><th>Options 选项</th> <th>Description 描述</th></tr></thead> <tbody><tr><td>None</td> <td>完全不持久化到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every write</td> <td>数据每次写入命令都 fsync 到磁盘</td></tr> <tr><td>Append-only file (AOF) - fsync every 1 sec</td> <td>数据每次写入命令每秒同步到磁盘</td></tr> <tr><td>Snapshot, every 1 hour</td> <td>数据库每小时创建一次快照</td></tr> <tr><td>Snapshot, every 6 hours</td> <td>数据库每 6 小时创建一次快照</td></tr> <tr><td>Snapshot, every 12 hours</td> <td>数据库每 12 小时创建一次快照</td></tr></tbody></table> <h3 id="leveldb"><a href="#leveldb" class="header-anchor">#</a> LevelDB</h3> <p>一个基于 Go 编写的内存 KV 数据库，类似于 SQLite 之于关系数据库：<a href="https://github.com/google/leveldb" target="_blank" rel="nofollow noopener noreferrer">GitHub - google/leveldb: LevelDB is a fast key-value storage library written at Google that provides an ordered mapping from string keys to string values<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>对于 daemon 程序，做 DB 的解耦，选择本地的 KV 数据库是很好的选择，只要一些简单的 Query，通过存一个 Json KV 对就可以满足业务需求</p> <h2 id="redis-缓存"><a href="#redis-缓存" class="header-anchor">#</a> Redis 缓存</h2> <h3 id="穿透击穿和雪崩"><a href="#穿透击穿和雪崩" class="header-anchor">#</a> 穿透击穿和雪崩</h3> <p>缓存穿透：用户始终请求 Redis 缓存和 MySQL 数据库中都不存在的数据，这样会穿透缓存，每次都打在数据库，拖慢应用</p> <ul><li>给这个“不存在的热点数据”存一个值为 null 的缓存</li></ul> <p>缓存击穿：单点热 Key 过期，对这个 Key 的请求在同时全打在了 MySQL</p> <ul><li>有条件的情况下，缓存不设置有效期；给读 MySQL 加锁，而对读 Redis 不做限制</li></ul> <p>缓存雪崩：大量缓存同时过期，导致请求全打在 MySQL</p> <ul><li>防止热 Key 统一过期，设置随机的过期时延；设置限流和熔断降级机制，如当数据库压力超过阈值，返回兜底的空数据</li></ul> <p>三者本质上都是缓存失效，导致数据库的压力，只不过穿透和击穿是“点”的问题，即单个热 Key 的问题，而雪崩是“面”的问题，是大量 Key 同时失效的雪崩，显然后者事故级别远大于前者</p> <p>如何处理大 Key 和热 Key？</p> <ul><li>大 Key 做字段拆分</li> <li>热 Key 做多级缓存，例如本地缓存</li></ul> <h3 id="mysql-存取与锁"><a href="#mysql-存取与锁" class="header-anchor">#</a> MySQL 存取与锁</h3> <p>Doc 表设计：<strong>canvas-global/model/dao/ddbs/table_doc.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Doc 表Doc的结构</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>并发从数据库 DB 中获取数据：<strong>canvas-global/library/doc_cache.go: goGetFieldFromDB</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// goGetFieldFromDB go func并发的方式从数据库中获取指定field的数据</span>

    itemInfoMap <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span>Field<span class="token punctuation">]</span><span class="token keyword">interface</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
    <span class="token keyword">var</span> daoErr <span class="token builtin">error</span>

        submitParams <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">DeserializeSubmitParams</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> value<span class="token punctuation">)</span>

        <span class="token boolean">_</span> <span class="token operator">=</span> pool<span class="token punctuation">.</span><span class="token function">Submit</span><span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

                    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;worker task panic&quot;</span><span class="token punctuation">,</span> logit<span class="token punctuation">.</span><span class="token function">AutoField</span><span class="token punctuation">(</span><span class="token string">&quot;recover&quot;</span><span class="token punctuation">,</span> r<span class="token punctuation">)</span><span class="token punctuation">)</span>
                    <span class="token comment">// 可重新添加任务到队列</span>
                <span class="token punctuation">}</span>
            <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

            err <span class="token operator">:=</span> basis<span class="token punctuation">.</span><span class="token function">ConvertSubmit</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> submitParams<span class="token punctuation">)</span>

a href="#redis-事物" class="header-anchor">#</a> Redis 事物</h3> <blockquote><p>Redis + Lua 脚本是实现事务的常见搭配</p></blockquote> <p>事物：一组命令的集合，如多条 SQL，入队出队依次执行，事物中的所有命令都会被序列化并按顺序执行，事务中的多条 SQL 作为一个整体，要么都成功，要么都失败</p> <p>ACID 原则：原子性、一致性、隔离性、持久性</p> <ul><li>redis 单条命令保证原子性，但 redis 事物不保证原子性</li> <li>redis 事务没有隔离级别的概念，所有命令在事务中并没有直接被执行，只有发起执行命令的时候才会执行（exec）</li></ul> <p>redis 事务的一次正常执行</p> <ol><li>开启事务：multi</li> <li>命令入队：依次写命令</li> <li>执行事务：exec</li></ol> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span> multi

<span class="token number">127.0</span>.0.1:637<span class="token operator"><span class="token file-descriptor important">9</span>&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><h3 id="redis-主从同步"><a href="#redis-主从同步" class="header-anchor">#</a> Redis 主从同步</h3> <p>Redis 主从架构如何避免脏读</p> <ul><li><a href="https://juejin.cn/post/7383957603016048655" target="_blank" rel="nofollow noopener noreferrer">考考你Redis主从，就知道有没深入Redis大家好，我是南哥。 一个对Java程序员进阶成长颇有研究的人，今天继续给大 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://cloud.tencent.com/developer/article/2448914" target="_blank" rel="nofollow noopener noreferrer">Redis部署方案的演进-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在 Redis 主从架构中</p> <ul><li><strong>主节点</strong>：负责处理写操作（如 SET、DEL），并将写操作同步到从节点</li> <li><strong>从节点</strong>：负责处理读操作（如 GET），并提供数据的副本</li></ul> <p>这也是 CQRS 的一种具体实现，即读写分离架构</p> <p>在 Redis 集群中，这样的复制和 Eureka 一样，属于异步复制，均属于 AP 系统（可用性大于一致性）</p> <ul><li>由于主从同步是异步的，写操作在主节点完成后，并不会立即同步到从节点，因此在同步完成之前，从节点可能会返回旧数据，导致<strong>脏读</strong></li></ul> <p>一个很经典的避免脏读的方法：<strong>读写锁</strong>（写时禁读）</p> <p>但经典的解决方案导致经典的问题</p> <ol><li>性能瓶颈：写操作期间禁止读操作，会导致读请求被阻塞，降低系统的并发性能</li> <li>系统卡死：若主节点的写 I/O 阻塞，整个系统可能会卡住，影响可用性</li> <li>复杂性：实现分布式读写锁会增加系统的复杂性</li></ol> <p>主从结构下，避免脏读除了读写锁还有什么方法呢？（天美 /(ㄒoㄒ)/~~）</p> <p>1️⃣ 写后同步等待：刚刚提到，用读写锁，实际上是分布式锁的一种应用，这与“写后同步等待”不同，“写后同步等待”实际上就类似于 Eureka 的同步复制机制，主节点写完后对所有副节点进行阻塞的同步更新，更新完成后，才可以执行读操作</p> <p>这可以使用 Redis 的 Wait 命令实现</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>SET key value
WAIT <span class="token number">1</span> <span class="token number">1000</span>  <span class="token comment"># 等待至少 1 个从节点同步完成，超时时间为 1000 毫秒</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>2️⃣ 版本号或时间戳机制：为每个键（Key）添加版本号或时间戳，客户端在读取数据时检查版本号或时间戳，确保读取的是最新数据</p> <ul><li>优点：不需要阻塞读操作，性能较高；可以灵活控制数据的一致性级别</li> <li>缺点：需要在客户端实现额外的逻辑；增加了数据存储的开销（多一个存储字段）</li></ul> <p>实现方式：在写操作时，更新键的版本号或时间戳</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>SET key:version <span class="token number">1</span>
SET key:value <span class="token string">&quot;data&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>在读操作时，检查版本号或时间戳</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>GET key:version
GET key:value
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>这里的读是指一次事务中的前后两次读（脏读的本质），在后一次做一个版本的检查，比如刚进入时读一次数据（这个数据上带一个版本号，或时间戳），然后在退出函数时再读一次，若版本号不同，则按后一次读出的数据为准</p> <p>3️⃣ 最终一致性容忍：接受一定时间内的脏读，通过业务逻辑容忍最终一致性</p> <ul><li>优点：性能高，没有额外的同步开销；适合对一致性要求不高的场景</li> <li>缺点：不适用于对一致性要求严格的场景（如金融交易）</li></ul> <p>实现方式：在业务逻辑中处理脏读问题，例如</p> <ul><li>对脏读不敏感的数据（如用户昵称、文章内容）直接使用从节点读取</li> <li>对脏读敏感的数据（如余额、库存）可以从主节点读取</li></ul> <p><strong>注意，我们可以强制用户在主节点上读取数据，这样可以保证不会出现脏读，代价是主节点负担较大</strong>，所以这里的实现采取了折中的方案，敏感数据限定读主节点，非敏感数据读副节点</p> <p>“最终一致性容忍”就是指允许了短时间的脏读，但换回了相当一部分的性能</p> <p>4️⃣ 强制读主节点：对于敏感数据，强制性的让用户只能读取主节点内容，由于 Redis 是单线程的原子操作，单独读写一个节点，就不会发生脏读</p> <p>随之而来的是主节点负担增加，从而拖慢读写性能</p> <h2 id="redis-限流与过滤"><a href="#redis-限流与过滤" class="header-anchor">#</a> Redis 限流与过滤</h2> <h3 id="api-令牌桶限流"><a href="#api-令牌桶限流" class="header-anchor">#</a> API 令牌桶限流</h3> <p>对于 API 请求，Redis 单线程记录 IP 对 API 每分钟的请求次数，超出则在 Controller 中拒绝访问，例如</p> <ol><li>用户提交成功后，在收到返回前，不能重复提交</li> <li>用户在 5s 以内只能成功提交一次</li></ol> <p>这样需要对这个接口上两道锁</p> <ul><li>执行锁，限定单个用户对同一道题在同一时刻只能判一次</li> <li>频控锁，限定单个用户对同一道题在 5s 内只能判题一次</li></ul> <p>执行锁使用 Redis 的原子锁，SET NX + EX 实现，控制字段</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>SET docker:lock:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> requestId NX EX <span class="token number">300</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这个字段的键由用户 ID 和题目 ID 构成，值为本次提交的请求 ID</p> <ul><li><code>NX</code>：不存在才设置</li> <li><code>EX 300</code>：兜底超时，防止执行锁卡死</li></ul> <p>只需要在判题前加入一个 Redis 的判断即可</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">boolean</span> locked <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span>
    requestId<span class="token punctuation">,</span>
    <span class="token number">300</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>locked<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;请勿重复提交任务&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>在判题结束后，需要释放执行锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">finally</span> <span class="token punctuation">{</span>
    <span class="token function">releaseLock</span><span class="token punctuation">(</span><span class="token string">&quot;docker:lock:&quot;</span> <span class="token operator">+</span> uid <span class="token operator">+</span> <span class="token string">&quot;:&quot;</span> <span class="token operator">+</span> qid<span class="token punctuation">,</span> requestId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>频控锁：使用 Redis 的冷却锁实现</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>SET docker:freq:<span class="token punctuation">{</span>uid<span class="token punctuation">}</span>:<span class="token punctuation">{</span>qid<span class="token punctuation">}</span> <span class="token number">1</span> NX EX <span class="token number">5</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>即设置一个 5s 超时时间的键值对，键同样由用户 ID 和题目 ID 构成，在判题前进行拦截</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">boolean</span> allowed <span class="token operator">=</span> redis<span class="token punctuation">.</span><span class="token function">setIfAbsent</span><span class="token punctuation">(</span>
    <span class="token string">&quot;docker:freq:&quot;</span> <span class="token operator">+</span> uid<span class="token punctuation">,</span>
    <span class="token string">&quot;1&quot;</span><span class="token punctuation">,</span>
    <span class="token number">5</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span>allowed<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;操作频繁&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>执行流程如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>请求进来
 ↓
校验身份 / IP
 ↓
【1】尝试获取执行锁（docker:lock）
    失败 → 直接拒绝
 ↓
【2】尝试获取 5s 频控锁（docker:freq）
    失败 → 释放执行锁 → 拒绝
 ↓
【3】真正执行 docker
 ↓
【4】finally 中释放执行锁
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>为什么频控在执行锁之后？更直觉的处理，先判断有没有锁进门，再判断能进多少人，这个优先级要搞清</p> <ul><li>如果频控先于执行，在第一秒和第六秒都有人来打请求，那么两个请求都能通过频控锁，而第一秒的请求没结束，所以第六秒的请求会消耗执行锁的判断（一共是四次判断）</li> <li>如果执行先于频控，上述事件就会少一次判断（三次判断），那另一种情况下，第一秒和第四秒都有请求打进来，并且已经执行完，那么也会有四次判断，但这里由于频率过高会被第四次判断拦截，这正是我想要的结果</li></ul> <p>就是说，我一定要先判断有没有进入的权限，再判断是否达标，否则我没有必要判断是否达标，懂我意思吗</p> <h3 id="redis-限流器"><a href="#redis-限流器" class="header-anchor">#</a> Redis 限流器</h3> <p>Redis 限流算法</p> <ul><li>令牌桶算法：每秒限定令牌数量，平滑限流并支持突发流量</li> <li>漏桶算法：每秒处理多少请求，严格控制请求速率</li> <li>固定窗口算法：固定时间窗口中的请求数量，对限流精度要求不高</li> <li>滑动窗口算法：较于固定窗口更为细腻，时间窗口可变，对限流精度要求较高</li> <li>动态限流算法：根据系统负载动态调节漏桶的流速</li></ul> <p><a href="https://github.com/throttled/throttled" target="_blank" rel="nofollow noopener noreferrer">GitHub - throttled/throttled: Package throttled implements rate limiting access to resources such as HTTP endpoints<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：一个基于 GCRA 算法（Generic cell rate algorithm）的 go 限流器，存储基于 Redis</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">type</span> RedisClientProvider <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> trpcredis<span class="token punctuation">.</span>Client

<span class="token keyword">type</span> RedisGCRALimiter <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	provider RedisClientProvider
	mu       sync<span class="token punctuation">.</span>Mutex
	limit    <span class="token builtin">int</span>
	limiter  throttled<span class="token punctuation">.</span>RateLimiterCtx
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">NewRedisGCRALimiter</span><span class="token punctuation">(</span>provider RedisClientProvider<span class="token punctuation">)</span> <span class="token operator">*</span>RedisGCRALimiter <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token operator">&amp;</span>RedisGCRALimiter<span class="token punctuation">{</span>provider<span class="token punctuation">:</span> provider<span class="token punctuation">}</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>l <span class="token operator">*</span>RedisGCRALimiter<span class="token punctuation">)</span> <span class="token function">Allow</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">,</span> limit <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> limit <span class="token operator">&lt;=</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>
	limiter<span class="token punctuation">,</span> err <span class="token operator">:=</span> l<span class="token punctuation">.</span><span class="token function">rateLimiter</span><span class="token punctuation">(</span>limit<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	limited<span class="token punctuation">,</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> limiter<span class="token punctuation">.</span><span class="token function">RateLimitCtx</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token operator">!</span>limited<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token punctuation">(</span>l <span class="token operator">*</span>RedisGCRALimiter<span class="token punctuation">)</span> <span class="token function">rateLimiter</span><span class="token punctuation">(</span>limit <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>throttled<span class="token punctuation">.</span>RateLimiterCtx<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	l<span class="token punctuation">.</span>mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">defer</span> l<span class="token punctuation">.</span>mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> l<span class="token punctuation">.</span>limiter <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> l<span class="token punctuation">.</span>limit <span class="token operator">==</span> limit <span class="token punctuation">{</span>
