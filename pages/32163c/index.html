eoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">接口与表设计<!----></h1> <!----> <div class="theme-vdoing-content content__default"><blockquote><ol><li>不要把需求想的太复杂，anydev 大部分业务也就是对数据库进行crud操作而已，我入职一两年，也还是一个 sql boy，很多时候，只需要很基础的设计就可以了</li> <li>不要钻牛角尖，也不要害羞，有问题我们及时沟通，快速迭代修改，很多方案肯定不是一开始就是没有任何问题的</li></ol></blockquote> <h2 id="api-接口设计"><a href="#api-接口设计" class="header-anchor">#</a> API 接口设计</h2> <h3 id="接口的修改"><a href="#接口的修改" class="header-anchor">#</a> 接口的修改</h3> <p>修改一个已有接口，遵循最小改动原则，尽量不动原有逻辑，不影响已有 API 调用</p> <ul><li>按照重量级：新增数据库表 ＞ 新插入数据表列 ＞ 在已有 json 字段里新增键值对 ＞ 复用字段</li> <li>新增接口 ＞ 修改 DTO ＞ 新增处理分支</li></ul> <p>模块化编程，注意泛化函数的命名</p> <ol><li>驼峰命名保持一致性，如 Id、Uid、Ppt、Pdf，逻辑尽量保持一致</li> <li>将冗余的 if-else 在内部封装，不要在外面堆屎</li> <li>参数往外放，保持业务功能在函数的完整性和模块化，这意味着，每个大写的导出函数，应该具备独立的处理逻辑，不依赖于内部配置，而只依赖外部传参</li></ol> <h3 id="空与空值"><a href="#空与空值" class="header-anchor">#</a> 空与空值</h3> <p>可以通过控制入参字段的“空”与“空值”来控制业务层逻辑，通过 protobuf 的包装类 <code>google.protobuf.StringValue</code> 来实现 nil 和空值的区分</p> <p>例如：以下非必须参数，如果不传（为空）将默认不进行修改，若传了但为空值并且在系统中合法，会修改为空值（<code>&quot;&quot; / false</code>）</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 id</td></tr> <tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（英文），例如<code>saulxiong</code>，只有环境拥有者才能通过校验</td></tr> <tr><td style="text-align:center;">envName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">环境名</td></tr> <tr><td style="text-align:center;">teamEnv</td> <td style="text-align:center;">bool</td> <td style="text-align:center;">否</td> <td style="text-align:center;">标记是否为团队环境，只有 AI 环境能够被设置为 teamEnv，非 AI 容器设置团队环境将报错</td></tr> <tr><td style="text-align:center;">idePath</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 默认打开路径（工作目录）</td></tr> <tr><td style="text-align:center;">ideName</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">默认 ide</td></tr> <tr><td style="text-align:center;">ideVersion</td> <td style="text-align:center;">string</td> <td style="text-align:center;">否</td> <td style="text-align:center;">ide 版本，可为空值<code>&quot;&quot;</code></td></tr></tbody></table> <p>200 Response，无 err 说明修改结果正常</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">200</span><span class="token punctuation">,</span>
    <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="枚举控制分支"><a href="#枚举控制分支" class="header-anchor">#</a> 枚举控制分支</h3> <p>除了常见的 Action 字段控制本次执行分支，还可以通过 Columns 入参决定返回字段，例如</p> <ul><li>POST /env/extra/info</li> <li>columns 必填，若传入字段不支持查询，将自动忽略并返回空</li></ul> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">必填</th> <th style="text-align:center;">说明</th></tr></thead> <tbody><tr><td style="text-align:center;">username</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">用户名（透传，本期不参与鉴权）</td></tr> <tr><td style="text-align:center;">envId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">环境 ID</td></tr> <tr><td style="text-align:center;">columns</td> <td style="text-align:center;">string</td> <td style="text-align:center;">是</td> <td style="text-align:center;">查询的字段，查询多个字段以 <code>,</code> 或 <code>;</code> 分隔；驼峰小写，如 <code>passEnvId</code></td></tr></tbody></table> <p>当前已支持查询的字段</p> <table><thead><tr><th style="text-align:center;">字段</th> <th style="text-align:center;">类型</th> <th style="text-align:center;">中文含义</th></tr></thead> <tbody><tr><td style="text-align:center;">passEnvId</td> <td style="text-align:center;">string</td> <td style="text-align:center;">环境的 pass 层 id</td></tr></tbody></table> <p>返回结果上，想让返回具备无限的扩展能力，放弃使用类型绑定（每次新增字段都要在 proto 结构里新增字段），直接将 <code>map&lt;string, string&gt;</code> 的 kv 存储作为 body 的 data 字段返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;code&quot;</span><span class="token operator">:</span> <span class="token number">0</span><span class="token punctuation">,</span>
  <span class="token property">&quot;message&quot;</span><span class="token operator">:</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span>
  <span class="token property">&quot;data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;passEnvId&quot;</span><span class="token operator">:</span> <span class="token string">&quot;saulxiong-xxxxxxxxxxx&quot;</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h3 id="nil-与-err"><a href="#nil-与-err" class="header-anchor">#</a> nil 与 err</h3> <p>SQL 的编码习惯问题，祺哥习惯使用 Find 查询，并且在查不到时返回 <code>nil, nil</code>，与之对应的是 <code>First / Last / Take</code> 查询</p> <ul><li>前者本质上就是一条 <code>select</code></li> <li>而后者是带上了 <code>limit 1</code> 和 <code>order by primary_key</code> 的 <code>select</code></li></ul> <p>在 GORM 的设计里，Take 这类查询在查不到时会抛一个 <code>gorm.ErrRecordNotFound</code> 错误给上层，因为这类 SQL 的语义里自带必须“查出一个”，在某些必须“空 / 非空”的场景很适用</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryActiveBackupByUid 查询某备份记录</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SnapshotController<span class="token punctuation">)</span> <span class="token function">QueryOpTaskByUid</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	uid <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>opTask<span class="token punctuation">.</span>EnvironmentOpTask<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	task <span class="token operator">:=</span> <span class="token operator">&amp;</span>opTask<span class="token punctuation">.</span>EnvironmentOpTask<span class="token punctuation">{</span><span class="token punctuation">}</span>
	err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;uid = ?&quot;</span><span class="token punctuation">,</span> uid<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">First</span><span class="token punctuation">(</span>task<span class="token punctuation">)</span><span class="token punctuation">.</span>Error
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;QueryOpTaskByUid fail.envId:%s,err:%v&quot;</span><span class="token punctuation">,</span> uid<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> task<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>外层只要 <code>err != nil</code> 就可以直接 return，因为不处理空的场景，相当于把非空的逻辑写进了 SQL 里</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code>task<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">QueryOpTaskByUid</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> err
<span class="token punctuation">}</span>
<span class="token comment">// 否则操作 task，他一定是从 DB 里取出来的数据，task != nil &amp;&amp; task.Uid != &quot;&quot; 恒成立</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>或者判断一些判重的场景，存在就推出</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">if</span> existing<span class="token punctuation">,</span> <span class="token boolean">_</span> <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">QueryActiveBackupByEnvId</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envIns<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span><span class="token punctuation">;</span> existing <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
<span class="token comment">// 否则就说明 DB 里没有这条数据，可以执行 create</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>但在一些复杂的业务并不适用，例如：查不到并不结束，并且要根据 task 是否为空来处理后续逻辑，应用 Find 查询</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// QueryLastestBackupTaskByEnvId ...</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>SnapshotController<span class="token punctuation">)</span> <span class="token function">QueryLastestBackupTaskByEnvId</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>opTask<span class="token punctuation">.</span>EnvironmentOpTask<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	task <span class="token operator">:=</span> <span class="token operator">&amp;</span>opTask<span class="token punctuation">.</span>EnvironmentOpTask<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId = ? and action = ?&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">,</span> opTask<span class="token punctuation">.</span>ActionBackup<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Order</span><span class="token punctuation">(</span><span class="token string">&quot;createdAt desc&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span>task<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> task<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

 ├─ success(:219) → successCommitTask(:256)：建模板，不退款
 │    （镜像存在期间配额一直占着，是业务设计，不是 bug）
 ├─ cancel(:190)  → 退款 used-1 → 退给 taskInfo.Creator(:202) ✗
 ├─ fail(:207)    → 退款 used-1 → 退给 taskInfo.Creator(:214) ✗
 └─ delete(:181)  → 退款 used-1 → 退给 taskInfo.Creator(:185) ✗

被动退款（用户不直接操作，也走 OperateCommitTask）
 ├─ 环境销毁 DestroyEnv(:3731)、环境崩溃回调(callback_env_status.go:133)、
 │   换模板 BindEnvTemplate(:5174)、StopEnv(:8340)
 │   → CancelEnvCommitTaskByEnvId(:561) → cancel → 退给 taskInfo.Creator
 └─ 模板删除 DeleteTemplate(template.go:2070) → delete → 退给 taskInfo.Creator
     （这是 success 后长期占用配额的唯一释放口）

重试 RetryCommitTask(:326)
 ├─ 前提：任务处于 cancel/failed（即：已退款完毕）
 ├─ :350  CheckResource(ctx.UserName())        ← 校验操作者 ✗
 └─ :371  AdjustResourceUsed(create)           ← 重新扣款给操作者 ✗

    description<span class="token operator">:</span> <span class="token string">&quot;xxxxx&quot;</span><span class="token punctuation">,</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>同时暴露接口 <code>/app/example</code>，后端直接 <code>where configKey = &quot;appExample&quot;</code> 取完整数据行返回，前端拿到 rsp 填充</p> <p>这种方式较于硬编码和配置中心配置更为自由，前者改一次还要发版，后者也得经过配置的发布，这种 DB 存 config 的方式直接简单粗暴改库就行</p> <h2 id="sql-工程问题"><a href="#sql-工程问题" class="header-anchor">#</a> SQL 工程问题</h2> <h3 id="业务与运维"><a href="#业务与运维" class="header-anchor">#</a> 业务与运维</h3> <blockquote><p>一般在工程实践中，有两种 SQL 场景</p> <ul><li>一种是写在业务逻辑里的 SQL，例如用户提交表单</li> <li>一种是运维 SQL，例如批量刷表</li></ul></blockquote> <p>刷法务环境的 subServerType，将其同一打标为 AIEnv 环境</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">update</span> devEnvironmentInstance <span class="token keyword">set</span> remark <span class="token operator">=</span> json_set<span class="token punctuation">(</span>remark<span class="token punctuation">,</span> <span class="token string">'$.subServerType'</span><span class="token punctuation">,</span> <span class="token string">'AIEnv'</span><span class="token punctuation">)</span> <span class="token keyword">where</span> appId <span class="token operator">=</span> <span class="token string">'lawtech'</span> <span class="token operator">and</span> <span class="token keyword">status</span> <span class="token operator">!=</span> <span class="token string">'deleted'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>高工：不要这么执行！<strong>大范围的使用 where 变更是大忌</strong>，应该一条条查出来 envId，再逐条执行变更，这样的话</p> <ol><li>一定会命中索引，不会造成慢 SQL</li> <li>将风险分为 300 条，而不是浓缩在一次执行中（难排查）</li></ol> <p>这和写业务代码 SQL 是反着来的（差点真写进测试环境了），一个典型的 N+1 SQL 反例，我实现了一个 SQL 查询函数，判断是否环境是否被协作（是否有有效的协作记录）</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// IsCollaborated 判断环境是否存在有效的协作关系</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CollaboratorController<span class="token punctuation">)</span> <span class="token function">IsCollaborated</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">bool</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> envId <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境ID不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">var</span> count <span class="token builtin">int64</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Model</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId = ? AND valid = 1&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Count</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>count<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询环境协作关系失败, envId=%s, err=%v&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> count <span class="token operator">&gt;</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>然后在外层的 <code>Env/List</code> 接口，对当前用户的所有环境进行是否被协作的标记</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> instance <span class="token operator">:=</span> <span class="token keyword">range</span> devEnvironmentInstance <span class="token punctuation">{</span>
	collaborated<span class="token punctuation">,</span> err <span class="token operator">:=</span> collaboratorController<span class="token punctuation">.</span><span class="token function">IsCollaborated</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> instance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;collaboratorController.IsCollaborated err: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
		<span class="token keyword">continue</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> collaborated <span class="token punctuation">{</span>
		collaboratorRoleMap<span class="token punctuation">[</span>instance<span class="token punctuation">.</span>Uid<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token string">&quot;creator&quot;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>这直接干了 N+1 条 SQL 查询，这不是索不索引的问题了，这是 N+1 次 TTL 往返，怎么可能这么查呢，用 <code>for</code> 嵌套 SQL 查询，是一年级的本科生才干得出来的事，正确的做法是整理好所有待查询的 envIds，做一次范围查询</p> <ul><li><strong>这和 SQL 变更完全是反着来的，后台 SQL 变更求稳，系统 SQL 查询求快</strong></li></ul> <p>批量查询 SQL</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetCollaboratedEnvIds 批量查询存在有效协作关系的环境 ID 集合</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CollaboratorController<span class="token punctuation">)</span> <span class="token function">GetCollaboratedEnvIds</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span>
	envIds <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	result <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>envIds<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> result<span class="token punctuation">,</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">var</span> collaboratedEnvIds <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Model</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvCollaborator<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId IN ? AND valid = 1&quot;</span><span class="token punctuation">,</span> envIds<span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Distinct</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
		<span class="token function">Pluck</span><span class="token punctuation">(</span><span class="token string">&quot;envId&quot;</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>collaboratedEnvIds<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;批量查询环境协作关系失败, envIds=%v, err=%v&quot;</span><span class="token punctuation">,</span> envIds<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> envId <span class="token operator">:=</span> <span class="token keyword">range</span> collaboratedEnvIds <span class="token punctuation">{</span>
		result<span class="token punctuation">[</span>envId<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token keyword">struct</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> result<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>业务调用</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 批量检查我创建的环境是否存在有效协作记录，区分我创建的协作环境和非协作环境</span>
ownedEnvIds <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">,</span> <span class="token function">len</span><span class="token punctuation">(</span>devEnvironmentInstance<span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> instance <span class="token operator">:=</span> <span class="token keyword">range</span> devEnvironmentInstance <span class="token punctuation">{</span>
    ownedEnvIds <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>ownedEnvIds<span class="token punctuation">,</span> instance<span class="token punctuation">.</span>Uid<span class="token punctuation">)</span>
<span class="token punctuation">}</span>
collaboratedEnvIds<span class="token punctuation">,</span> err <span class="token operator">:=</span> collaboratorController<span class="token punctuation">.</span><span class="token function">GetCollaboratedEnvIds</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> ownedEnvIds<span class="token punctuation">)</span>
<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;GetCollaboratedEnvIds err: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
    <span class="token keyword">for</span> envId <span class="token operator">:=</span> <span class="token keyword">range</span> collaboratedEnvIds <span class="token punctuation">{</span>
        collaboratorRoleMap<span class="token punctuation">[</span>envId<span class="token punctuation">]</span> <span class="token operator">=</span> Creator
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>还有一个刷 DB 的例子，因为要支持 DinD 版本选择，对于存量的模板默认要设置为高版本，这里要么 DB 全部把 DindVersion 刷为 26.1，要么在业务代码里面兼容为空的语义（nil = 高版本）</p> <ul><li>同样的，要根据 SQL 条件把所有的 Uid 查出来，然后执行 2000 次变更语句</li></ul> <p>在 json string 字段里面查有效信息，用到 <code>JSON_EXTRACT</code> 函数和对 <code>.</code> 外面套引号转义</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> uid <span class="token keyword">FROM</span> environmentTemplate <span class="token keyword">WHERE</span> JSON_EXTRACT<span class="token punctuation">(</span>metadata<span class="token punctuation">,</span> <span class="token string">'$.annotations.dind'</span><span class="token punctuation">)</span> <span class="token operator">=</span> <span class="token string">'1'</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="深度分页"><a href="#深度分页" class="header-anchor">#</a> 深度分页</h3> <p>分页查询：从上一页 offset 到末尾开始计数，往后推 n 个，就是第 n 页的内容（这样的 offset + limit 会扫全表吗？？好像不会吧）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="62.681ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 27705.2 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45C" d="M201 -11Q126 -11 80 38T34 156Q34 221 64 279T146 380Q222 441 301 441Q333 441 341 440Q354 437 367 433T402 417T438 387T464 338T476 268Q476 161 390 75T201 -11ZM121 120Q121 70 147 48T206 26Q250 26 289 58T351 142Q360 163 374 216T388 308Q388 352 370 375Q346 405 306 405Q243 405 195 347Q158 303 140 230T121 120Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(485,0)"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1035,0)"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -     <span class="token comment">// 分页页数和页面大小</span>
    page <span class="token operator">:=</span> <span class="token function">int</span><span class="token punctuation">(</span>req<span class="token punctuation">.</span>Page<span class="token punctuation">)</span>

    <span class="token keyword">if</span> size <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>

    query <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span>DB<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Model</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>table<span class="token punctuation">.</span>EnvRecoveryRecord<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">)</span>
    query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;nodeIp = ?&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>NodeIp<span class="token punctuation">)</span>
    <span class="token comment">// 根据filter构造查询条件</span>

        query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;environmentStatus IN (?)&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>EnvStatusFilter<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>req<span class="token punctuation">.</span>EnvironmentIpFilter<span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;environmentIp IN (?)&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>EnvironmentIpFilter<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>req<span class="token punctuation">.</span>UsernameFilter<span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token punctuation">{</span>
        query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;username IN (?)&quot;</span><span class="token punctuation">,</span> req<span class="token punctuation">.</span>UsernameFilter<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//查询前更新库中数据状态（【恢复中】数据）</span>
    err <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">refreshERR</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">.</span>NodeIp<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;更新环境恢复记录状态失败: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> rsp<span class="token punctuation">,</span> common<span class="token punctuation">.</span>InternalErrCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;更新环境恢复记录状态失败&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    query <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;isActive = ?&quot;</span><span class="token punctuation">,</span> recorveryActive<span class="token punctuation">)</span>
    <span class="token comment">// 分页查表</span>
    envRecoveryRecords <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span>table<span class="token punctuation">.</span>EnvRecoveryRecord<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span>
    total <span class="token operator">:=</span> <span class="token function">int64</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span>
    <span class="token comment">// SQL 查询</span>
    err <span class="token operator">=</span> query<span class="token punctuation">.</span><span class="token function">Count</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>total<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Offset</span><span class="token punctuation">(</span><span class="token punctuation">(</span>page <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">)</span> <span class="token operator">*</span> size<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Limit</span><span class="token punctuation">(</span>size<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Order</span><span class="token punctuation">(</span><span class="token string">&quot;updatedAt desc&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>envRecoveryRecords<span class="token punctuation">)</span><span class="token punctuation">.</span>Error
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询环境恢复记录列表失败: %v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> rsp<span class="token punctuation">,</span> common<span class="token punctuation">.</span>InternalErrCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;查询环境恢复记录列表失败&quot;</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    rsp<span class="token punctuation">.</span>Code <span class="token operator">=</span> <span class="token number">200</span>
    rsp<span class="token punctuation">.</span>Message <span class="token operator">=</span> <span class="token string">&quot;success&quot;</span>
    rsp<span class="token punctuation">.</span>Data <span class="token operator">=</span> <span class="token operator">&amp;</span>admin<span class="token punctuation">.</span>EnvRecoveryListRsp_EnvRecoveryListData<span class="token punctuation">{</span><span class="token punctuation">}</span>
    rsp<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>Total <span class="token operator">=</span> <span class="token function">int32</span><span class="token punctuation">(</span>total<span class="token punctuation">)</span>
    <span class="token comment">// 仅对当前页 running 环境计算“是否快照启动”，批量查询容器信息，避免逐条查库</span>
    snapshotBootMap <span class="token operator">:=</span> its<span class="token punctuation">.</span><span class="token function">buildSnapshotBootMap</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envRecoveryRecords<span class="token punctuation">)</span>
    <span class="token comment">//6. 构造返回数据</span>
    rsp<span class="token punctuation">.</span>Data<span class="token punctuation">.</span>Items <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">buildEnvRecoveryRecordItems</span><span class="token punctuation">(</span>envRecoveryRecords<span class="token punctuation">,</span> snapshotBootMap<span class="token punctuation">)</span>
    <span class="token keyword">return</span> rsp<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br></div></div><p>文库的方案不是这样，使用 updatedAt 作为游标（建立索引），通过字段比较 + limit 死死卡住一页内容，每次查询走 <code>updatedAt</code> 索引且只扫描 100 条</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">-- 第一页</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> updatedAt <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 23:59:59'</span>  <span class="token comment">-- 初始为当前时间</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> updatedAt <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>

<span class="token comment">-- 第二页（使用上一页最后一条的 update_time 作为游标），第三页以此类推</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> updatedAt <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 18:30:15'</span>  <span class="token comment">-- 上一页最后一条的 update_time</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> updatedAt <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>单游标会有这样的问题，如果两条数据 a 和 b 在同一秒 updatetAt，同时分页刚好把 b 卡在第 11 条，那么 b 就会在本次分页被 limit 掉，而在下一页查询中，因为游标定位是一个严格的小于，b 和 a 的 updatetAt 一样，会被 a 的 <code>&lt; updatedAt</code> 卡出去，导致下一页也查不出来</p> <p>解决方案：双游标，用 <code>(update_time, id)</code> 进行定位和排序，保证游标的唯一性</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">-- 第一页</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> <span class="token punctuation">(</span>update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 23:59:59'</span><span class="token punctuation">)</span>
   <span class="token operator">OR</span> <span class="token punctuation">(</span>update_time <span class="token operator">=</span> <span class="token string">'2026-07-02 23:59:59'</span> <span class="token operator">AND</span> id <span class="token operator">&lt;</span> <span class="token number">999999999</span><span class="token punctuation">)</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>

<span class="token comment">-- 第二页：使用上一页最后一条的 (update_time, id) 作为游标</span>
<span class="token comment">-- 假设上一页最后一条：update_time = '2026-07-02 18:30:15', id = 100</span>
<span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> devEnvironmentInstance 
<span class="token keyword">WHERE</span> <span class="token punctuation">(</span>update_time <span class="token operator">&lt;</span> <span class="token string">'2026-07-02 18:30:15'</span><span class="token punctuation">)</span>
   <span class="token operator">OR</span> <span class="token punctuation">(</span>update_time <span class="token operator">=</span> <span class="token string">'2026-07-02 18:30:15'</span> <span class="token operator">AND</span> id <span class="token operator">&lt;</span> <span class="token number">100</span><span class="token punctuation">)</span>
<span class="token keyword">ORDER</span> <span class="token keyword">BY</span> update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span> 
<span class="token keyword">LIMIT</span> <span class="token number">100</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>这里是有小巧思的，一般而言主键 id 有索引且有序，是易查询且易排序的（时间 updatedAt 同理），只要建立 <code>(update_time, id)</code> 的联合索引，就不会引发回表扫描</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">ALTER</span> <span class="token keyword">TABLE</span> devEnvironmentInstance 
<span class="token keyword">ADD</span> <span class="token keyword">INDEX</span> idx_update_id <span class="token punctuation">(</span>update_time <span class="token keyword">DESC</span><span class="token punctuation">,</span> id <span class="token keyword">DESC</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>前端请求</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token comment">// 第一次请求取当前时间（最大）和无穷大的 example-int_max，从表中最大的数据行开始向后遍历</span>
<span class="token comment">// 分页请求参数</span>
<span class="token punctuation">{</span>
  pageSize<span class="token operator">:</span> <span class="token number">100</span><span class="token punctuation">,</span>
  cursor<span class="token operator">:</span> <span class="token punctuation">{</span> updateTime<span class="token operator">:</span> '<span class="token number">2026</span><span class="token number">-07</span><span class="token number">-02</span> <span class="token number">18</span><span class="token operator">:</span><span class="token number">30</span><span class="token operator">:</span><span class="token number">15</span>'<span class="token punctuation">,</span> id<span class="token operator">:</span> <span class="token string">&quot;example-10086&quot;</span> <span class="token punctuation">}</span>  <span class="token comment">// 上一页最后一条</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>后端返回</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  list<span class="token operator">:</span> <span class="token punctuation">[</span>...<span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token comment">// 本页数据</span>
  nextCursor<span class="token operator">:</span> <span class="token punctuation">{</span> updateTime<span class="token operator">:</span> '...'<span class="token punctuation">,</span> id<span class="token operator">:</span> <span class="token string">&quot;...&quot;</span> <span class="token punctuation">}</span><span class="token punctuation">,</span>  <span class="token comment">// 本页最后一条</span>
  hasNext<span class="token operator">:</span> <span class="token boolean">true</span><span class="token punctuation">,</span> <span class="token comment">// 是否有下一页</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="避免-join-查询"><a href="#避免-join-查询" class="header-anchor">#</a> 避免 join 查询</h3> <p>在原则上，如果要联表查询，顺序查两张表是最稳的，即根据主键查第一张表，再根据第一张表查出的字段查第二张表索引</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// 第一步：查询符合条件的 envId 列表</span>
<span class="token keyword">var</span> envIds <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span>
<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Table</span><span class="token punctuation">(</span><span class="token string">&quot;devEnvironmentInstance&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;environmentHost = ? AND serverType = ? AND status != ?&quot;</span><span class="token punctuation">,</span> node<span class="token punctuation">,</span> gpuServerType<span class="token punctuation">,</span> EnvStatusDeleted<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Pluck</span><span class="token punctuation">(</span><span class="token string">&quot;uid&quot;</span><span class="token punctuation">,</span> <span class="token operator">&amp;</span>envIds<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;query devEnvironmentInstance fail. node:%s, err:%v&quot;</span><span class="token punctuation">,</span> node<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
<span class="token punctuation">}</span>

<span class="token comment">// 如果没有符合条件的环境，直接返回空</span>
<span class="token keyword">if</span> <span class="token function">len</span><span class="token punctuation">(</span>envIds<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>web_server<span class="token punctuation">.</span>EnvUpperBackupQueryRsp_Data<span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>

<span class="token comment">// 第二步：根据 envId 列表查询活跃备份记录</span>
<span class="token keyword">var</span> backups <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>EnvironmentUpperBackup
<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Table</span><span class="token punctuation">(</span><span class="token string">&quot;environmentUpperBackup&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;envId IN ? AND status = ?&quot;</span><span class="token punctuation">,</span> envIds<span class="token punctuation">,</span> table<span class="token punctuation">.</span>EnvironmentUpperBackupStatusActive<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>backups<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;query environmentUpperBackup fail. node:%s, err:%v&quot;</span><span class="token punctuation">,</span> node<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>上述的顺序查询等价于如下 SQL，这里考虑的情况其实很复杂，比如是否命中索引，是否会命中一些 MySQL 底层匹配的坑，并且肉眼可见的可读性很差</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">var</span> backups <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>table<span class="token punctuation">.</span>EnvironmentUpperBackup
<span class="token keyword">if</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Table</span><span class="token punctuation">(</span><span class="token string">&quot;environmentUpperBackup AS ub&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Joins</span><span class="token punctuation">(</span><span class="token string">&quot;INNER JOIN devEnvironmentInstance AS ei ON ub.envId = ei.uid&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;ei.environmentHost = ? AND ei.serverType = ? AND ei.status != ? AND ub.status = ?&quot;</span><span class="token punctuation">,</span>
      node<span class="token punctuation">,</span> gpuServerType<span class="token punctuation">,</span> EnvStatusDeleted<span class="token punctuation">,</span> table<span class="token punctuation">.</span>EnvironmentUpperBackupStatusActive<span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Select</span><span class="token punctuation">(</span><span class="token string">&quot;ub.*&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
<span class="token function">Find</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>backups<span class="token punctuation">)</span><span class="token punctuation">.</span>Error<span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
    ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;upperBackupQuery fail.node:%s,err:%v&quot;</span><span class="token punctuation">,</span> node<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>联表和顺序查询，更多是一种思维方式，我们比较少用 join 表，不过也看实际情况，如果用到了索引，性能也能接受，用了也就用了。在阿里的开发手册里其实也提到过，严禁三张表及以上的 join 联表查询，这里简单解释一下 join 表的原理，例如有用户表和环境表（多余字段略）</p> <p><strong>userInfo</strong></p> <table><thead><tr><th>userId</th> <th>username</th></tr></thead> <tbody><tr><td>user-1jdk2j</td> <td>张三</td></tr> <tr><td>user-4lew02</td> <td>李四</td></tr></tbody></table> <p><strong>envInstance</strong></p> <table><thead><tr><th>envId</th> <th>userId</th> <th>username</th></tr></thead> <tbody><tr><td>envIns-k19skl</td> <td>user-1jdk2j</td> <td>张三</td></tr> <tr><td>envIns-uqx871</td> <td>user-4lew02</td> <td>李四</td></tr></tbody></table> <p>如果我要查询 <code>username in (&quot;张三&quot;, &quot;李四&quot;)</code> 的环境信息，如果用 join 查询，实际上是在做两层 for 循环比较，先在 userInfo 表里匹配 username，再根据 username 去找 envInstance 里匹配的数据</p> <ul><li>这里的两层 for 循环，外层是驱动表（小表，数据行较少的表）数据，内层是被驱动表数据，MySQL 会每次从驱动表拿一个匹配的数据，然后跑到被驱动表里去找一圈进行对比，匹配上了，就进行 join 并返回连接的数据行</li></ul> <p>这里最大的问题在于，内外层循环的两张表的匹配都是根据 username 在进行比对的，如果 username 没加索引，这种情况有可能在被驱动表中出现（例如 envInstance 表没对 username 加索引），那这里每一次内层循环都是在对 envInstance 表进行扫全表，轧钢了就</p> <p>所以最稳的方式就是：先根据 username 在 userInfo 找出对应的 userId，再根据 userId 去 envInstance 表找 envId，在业务层做拼接，这样能够保证 SQL 的每一步都在我的控制下去命中索引，这是关键点</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/699675/" class="page-nav-centre page-nav-centre-prev"><div class="
