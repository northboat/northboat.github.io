ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">微服务和 Monorepo<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>软件业的人乐于做这样的事 —— 找一些词汇，并把它们引申到大量微妙而又互相矛盾的意义，例如“架构” —— 《Patterns of Enterprise Application Architecture》</p> <h2 id="微服务系统概述"><a href="#微服务系统概述" class="header-anchor">#</a> 微服务系统概述</h2> <blockquote><p>现阶段的代码优化，一个就是单体项目的微服务改造，再一个就是设计模式的优化</p></blockquote> <p>微服务并不是什么高级货，软件实施的重点在于如何合理的切割、划分模块，微服务只是一种手段，其核心的思想应当收敛于 DDD</p> <ul><li>按层次划分，例如文库的控制面 - 策略层 - 基础层，以此来实现一个统一但解耦的系统，每层又通过不同的微服务进行实现（分层架构）</li> <li>按功能划分，例如 AnyDev 将控制面、定时服务、Daemon 功能等拆为小仓开发，再按 mono 大仓组合，每个小仓是一个微服务（组合架构）</li></ul> <h3 id="云原生系统概述"><a href="#云原生系统概述" class="header-anchor">#</a> 云原生系统概述</h3> <p>SOA、分布式和微服务系统</p> <ul><li>SOA（Service Oriented Architecture）：面向服务架构，相比于微服务的设计粒度更大，通常指系统之间的耦合，参与方通常在个位数或十几个</li> <li>分布式系统：多服务通过网络协同工作，微服务的个数通常能达到上百个，整个系统对外表现为整体，核心特点为去中心化、并发性、容错能力、扩展性</li> <li>微服务系统：分布式系统的一种实现形式，一种模块化思想的实践，本质上通过 HTTP 或其他网络协议进行通讯来实现，核心在于服务拆分、服务之间调用和服务管理</li></ul> <p>一般通过成熟的微服务框架或组件解决现成的分布式问题，实现快速开发</p> <ul><li>Spring Cloud</li> <li>Spring Cloud Alibaba</li> <li>Dubbo</li> <li>RPC（GRPC、TRPC）</li></ul> <p>云计算背景下，软件、平台和基础设施都被视作服务 Service</p> <ul><li>SaaS：Software as a Service 软件即服务</li> <li>Paas：Platform as a Service 平台即服务</li> <li>IaaS：Infrastructure as a Service 基础设施即服务</li></ul> <p>云原生是一种很抽象的概念，与传统单体服务相比，存在思想上的设计差异，我暂时理解为一种<strong>主体但协作</strong>的设计理念，虽然定义不仅相同，但云原生系统总是包含以下关键词</p> <ol><li>微服务：模块化开发</li> <li>容器化：跨平台、弹性部署、高可用容灾</li> <li>DevOps：开发运维一体</li> <li>持续交付：用模块化 + “小步快跑”代替瀑布开发</li></ol> <h3 id="单体项目改造"><a href="#单体项目改造" class="header-anchor">#</a> 单体项目改造</h3> <p>原有 OJ 系统，各模块相互独立，通过 API 接口和分包的方式实现协作</p> <ul><li>负责核心业务的后端模块</li> <li>负责校验结果的判题模块</li> <li>负责编译执行代码的可复用代码沙箱</li></ul> <p>基于 Spring Cloud Alibaba + Nacos + Dubbo + Higress 对单体项目进行重构。如何进行改造？从业务需求出发</p> <ul><li>用户登录功能：需要改造为分布式登录，使用 Redis 分布式 Session 存储登录用户信息</li> <li>有没有用到单机锁？如有需要改造为分布式锁</li> <li>有没有用到本地缓存？改造为分布式缓存（Redis）</li> <li>需不需要用到分布式事务？比如操作多个库</li></ul> <p>于是将项目划分为，各服务共用同一套 DB 数据源</p> <ul><li>用户服务</li> <li>题目服务</li> <li>判题服务</li> <li>公共模块</li></ul> <p>各个服务的业务能力保持不变，接口保持不变，只是调用关系发生改变，从内部调用变成 RPC 调用，前端的请求地址从 1 个变成 4 个</p> <img src="/assets/img/spring-cloud-alibaba-img.3f7ac48d.png"> <ol><li>Nacos 注册中心</li> <li>Dubbo 通信框架</li> <li>Sentinel 熔断降级</li> <li>Seata 分布式事务</li> <li>RocketMQ 消息队列</li></ol> <p>注意 Spring Cloud Alibaba、Spring Cloud 和 Spring Boot 的对应版本：<a href="https://sca.aliyun.com/docs/2023/overview/version-explain/?spm=7145af80.4cc2c60e.0.0.133270216znaVp" target="_blank" rel="nofollow noopener noreferrer">版本发布说明-阿里云Spring Cloud Alibaba官网<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>SCA 最佳实践</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>1. Spring Cloud Gateway：网关
2. Nacos：服务注册和配置中心
3. Sentinel：熔断限流
4. Seata：分布式事务
5. RocketMQ：消息队列，削峰填谷
6. Docker：使用 Docker 进行容器化部署
7. Kubernetes：容器化部署
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><img src="/assets/img/20260111-springcloud-sca.291b4d2c.png"> <p>很多时候，像点赞这种高频操作（是 / 否），实际上并没有直接进行写 DB，而是丢给消息队列或 Redis 去处理，前端查缓存处理</p> <h3 id="微服务开发实践"><a href="#微服务开发实践" class="header-anchor">#</a> 微服务开发实践</h3> <h4 id="微服务中间件"><a href="#微服务中间件" class="header-anchor">#</a> 微服务中间件</h4> <p>度子的微服务组件（因为很多时候会对文档进行索引，所以会用到 ES）</p> <ul><li>GDP 微服务框架：包含 RPC 调用和 Streaming 流式调用，后者被用作 AI 流式对话（包括 Planner 框架和 MCP 的流式返回）</li> <li>Sula 配置中心：等同于 Nacos</li> <li>DB：MySQL 持久化和 Redis 缓存</li> <li>ES 索引和 BOS 对象存储</li> <li>NMQ 消息队列</li></ul> <p>腾子的微服务组件，其实都大差不差，有需求才会驱动轮子制造</p> <ol><li>TRPC：远程调用框架</li> <li>Taihu 太湖：网关</li> <li>Rainbow 七彩：配置的统一管理与灰度</li> <li>PolarisMesh 北极星：服务治理中心，类 Nacos</li> <li>DB：MySQL（GORM）和 Redis</li> <li>UDNS 域名分配</li> <li>TAT 命令下发</li> <li>TDMQ 分布式消息队列</li></ol> <h4 id="微服务注册流程"><a href="#微服务注册流程" class="header-anchor">#</a> 微服务注册流程</h4> <blockquote><p>一个微服务接口的实现、注册和调用流程，从前端到 admin 接口到下游的 web-server 服务</p></blockquote> <p>proto 层：admin_server.proto：新增 admin 接口</p> <p>web-server 后端</p> <ul><li>services/devops.go 新增 DevopsService.DevopsEnvStop</li> <li>business/devops.go 新增 DevopsController.StopEnv</li></ul> <p>admin 后端</p> <ul><li>services/env_devops_service.go 新增 AdminDevopsService.StopEnv</li> <li>business/devops.go 新增 DevopsController.StopEnv</li></ul> <p>admin-app 前端</p> <ul><li>codev-service/src/adminApi/api.ts 新增 stopEnv 后端 url，以及接口 batchStopEnv 定义并导出</li> <li>修改 codev-admin-app/src/views/devops/nodeManager.vue 前端样式，新增批量休眠按钮以及每个数据行后新增休眠环境按钮，二者均调用 batchStopEnv 接口</li></ul> <h4 id="protobuf"><a href="#protobuf" class="header-anchor">#</a> Protobuf</h4> <blockquote><p>Protobuf（Protocol Buffers）是 Google 开发的一种语言中立、平台无关、可扩展的结构化数据序列化格式，用于自动化生成模板代码，例如 DTO 数据结构和 RPC 接口</p></blockquote> <p>通过 proto 定义 po 数据结构和接口，并通过 protobuf 命令一键生成 pb.go 文件，例如</p> <ol><li><strong>admin-server.proto</strong>：新增批量休眠接口，复用了批量操作的入参 BatchEnvIdsReq 和规范出参 AdminEmptyRsp</li></ol> <div class="language-protobuf line-numbers-mode"><pre class="language-protobuf"><code><span class="token comment">// @alias=/admin/devops/env/stopEnv 批量关闭环境</span>
<span class="token keyword">rpc</span> <span class="token function">StopEnv</span><span class="token punctuation">(</span><span class="token class-name">BatchEnvIdsReq</span><span class="token punctuation">)</span> <span class="token keyword">returns</span><span class="token punctuation">(</span><span class="token class-name">AdminEmptyRsp</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ol start="2"><li><strong>web-server.proto</strong>：新增接口和入参出参</li></ol> <div class="language-protobuf line-numbers-mode"><pre class="language-protobuf"><code><span class="token comment">// @alias=/devops/env/stop 运维操作休眠环境</span>
<span class="token keyword">rpc</span> <span class="token function">DevopsEnvStop</span><span class="token punctuation">(</span><span class="token class-name">DevopsEnvStopReq</span><span class="token punctuation">)</span> <span class="token keyword">returns</span> <span class="token punctuation">(</span><span class="token class-name">DevopsEnvStopRsp</span><span class="token punctuation">)</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>

<span class="token keyword">message</span> <span class="token class-name">DevopsEnvStopReq</span> <span class="token punctuation">{</span>
    <span class="token keyword">repeated</span> <span class="token builtin">string</span> envIds <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token keyword">message</span> <span class="token class-name">DevopsEnvStopRsp</span> <span class="token punctuation">{</span>
    <span class="token builtin">int32</span> code <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token builtin">string</span> message <span class="token operator">=</span> <span class="token number">2</span><span class="token punctuation">;</span>
    <span class="token positional-class-name class-name">Data</span> data <span class="token operator">=</span> <span class="token number">3</span><span class="token punctuation">;</span>
    <span class="token keyword">message</span> <span class="token class-name">Data</span> <span class="token punctuation">{</span>
        <span class="token keyword">repeated</span> <span class="token builtin">string</span> errorEnvIds <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>通过 trpc 命令指定 proto 文件构建成套的 pb 文件，包括</p> <ul><li><code>*.proto</code></li> <li><code>*.pb.go</code></li> <li><code>*.trpc.go</code></li> <li><code>*.pb.validate.go</code></li> <li><code>*_mock.go</code></li></ul> <h2 id="微服务组件"><a href="#微服务组件" class="header-anchor">#</a> 微服务组件</h2> <p>每个微服务组件都是在解决一个分布式问题</p> <h3 id="nacos-配置中心"><a href="#nacos-配置中心" class="header-anchor">#</a> Nacos 配置中心</h3> <blockquote><p>管理微服务的通信资源 → 注册并暴露云函数</p></blockquote> <p>Nacos 是一个中心化的配置中心，用于微服务的接口注册和配置统计管理</p> <ul><li>对于业务方而言，配置中心的使用是透明的，使用 Nacos 和使用 Eureka 都是打微服务名称</li></ul> <p>引入 Nacos 客户端依赖并配置</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>com.alibaba.cloud<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-cloud-starter-alibaba-nacos-discovery<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>version</span><span class="token punctuation">&gt;</span></span>2022.0.0.0<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>version</span><span class="token punctuation">&gt;</span></span> <span class="token comment">&lt;!-- 根据 Spring Cloud 版本选择 --&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">server</span><span class="token punctuation">:</span>
  <span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">8081</span>

<span class="token key atrule">spring</span><span class="token punctuation">:</span>
  <span class="token key atrule">application</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> user<span class="token punctuation">-</span>service
  <span class="token key atrule">cloud</span><span class="token punctuation">:</span>
    <span class="token key atrule">nacos</span><span class="token punctuation">:</span>
      <span class="token key atrule">discovery</span><span class="token punctuation">:</span>
        <span class="token key atrule">server-addr</span><span class="token punctuation">:</span> localhost<span class="token punctuation">:</span><span class="token number">8848</span>  <span class="token comment"># Nacos 服务器地址</span>
        <span class="token key atrule">namespace</span><span class="token punctuation">:</span> public           <span class="token comment"># 命名空间（默认 public）</span>
        <span class="token key atrule">group</span><span class="token punctuation">:</span> DEFAULT_GROUP        <span class="token comment"># 分组（默认 DEFAULT_GROUP）</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>在主类中启动 Nacos 注册服务</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@EnableDiscoveryClient</span> <span class="token comment">// 启用服务注册与发现（兼容 Nacos）</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">UserServiceApplication</span> <span class="token punctuation">{</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">UserServiceApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>一个正常的<code>Controller</code>层代码</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@RestController</span>
<span class="token annotation punctuation">@RequestMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/users&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">class</span> <span class="token class-name">UserController</span> <span class="token punctuation">{</span>
    <span class="token comment">// 查询用户</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}&quot;</span><span class="token punctuation">)</span>
    <span class="token keyword">public</span> <span class="token class-name">User</span> <span class="token function">getUser</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> id<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> userService<span class="token punctuation">.</span><span class="token function">get</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>进行微服务注册</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@FeignClient</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;user-service&quot;</span><span class="token punctuation">)</span> <span class="token comment">// 服务名需与目标服务在 Nacos 中的名称一致</span>
<span class="token keyword">public</span> <span class="token keyword">interface</span> <span class="token class-name">UserServiceClient</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@GetMapping</span><span class="token punctuation">(</span><span class="token string">&quot;/{id}}&quot;</span><span class="token punctuation">)</span>
    <span class="token class-name">User</span> <span class="token function">getUserById</span><span class="token punctuation">(</span><span class="token annotation punctuation">@PathVariable</span> <span class="token class-name">Long</span> userId<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>当前项目<code>user-service</code>的接口就被注册在地址为<code>localhost:8848</code>的 Nacos 中</p> <h4 id="cap-原则"><a href="#cap-原则" class="header-anchor">#</a> CAP 原则</h4> <p>CAP 原则：一致性（Consistency）、可用性（Availability）和分区容忍性（Partition Tolerance）不可兼得</p> <p>什么是一致性、可用性和分区容忍性</p> <ul><li>一致性：所有节点在同一时间看到的数据相同</li> <li>可用性：每个请求都能得到响应（即使部分节点故障），但不保证是最新数据</li> <li>分区容忍性：指系统能够处理网络分区（节点间通信中断）的情况，即使部分节点无法通信，系统仍能正常运行</li></ul> <p>CAP 理论的核心是：一个分布式系统不可能同时很好的满足一致性，可用性和分区容错性这三个需求，要么 CA 要么 CP 要么 AP</p> <ul><li>CA：单点集群，满足一致性，可用性的系统，通常缺失可扩展性</li> <li>CP：满足一致性，分区容忍性的系统，通常性能略低</li> <li>AP：满足可用性，分区容忍性的系统，通常一致性要求略低</li></ul> <p>在分布式环境中，网络分区是不可避免的（必须要 P），故分布式系统的设计中，变成了 AP 和 CP 系统的选择</p> <ul><li>CA 是单点集群，不支持分区</li></ul> <p>通常而言，要满足一致性就要牺牲一定的性能，CP 的性能会逊于 AP，但具体使用什么架构一定是从业务出发，例如</p> <ul><li>网飞（Netflex）开源的注册中心 Eureka 是一个典型的 CP 系统，因为他更注重实时性（视频流）</li> <li>而在支付场景，一定是一致性大于实时性，故而阿里开源的 Nacos 必然要能够满足 AP 原则（Nacos 可以在 CP 和 AP 之间切换）</li></ul> <h3 id="dubbo-rpc-框架"><a href="#dubbo-rpc-框架" class="header-anchor">#</a> Dubbo RPC 框架</h3> <p>RPC（Remote Procedure Call），远程过程调用，RPC 框架封装了底层的网络通信、序列化和反序列化，使远程接口本地调用化</p> <ul><li>MCP 的调用本质上也是一种 RPC，只不过用的是 Json 2 协议，通常微服务的 RPC 基于 TCP 或 HTTP</li></ul> <p>Dubbo 是阿里开源的 RPC 框架，基于 TCP 的 Hessian 2 协议，性能明显优于 HTTP</p> <ol><li>基于 Netty 实现</li> <li>支持负载均衡、服务降级、熔断、限流等功能</li> <li>支持多种注册中心（如 Zookeeper、Nacos）</li> <li>支持 Dubbo 协议、HTTP、REST 等协议</li> <li>支持分布式事务解决方案（如 Seata）</li></ol> <p>注册中心挂了之后，Dubbo 还能访问到服务吗？分情况，如果之前调用过，Dubbo 会把服务地址缓存在本地，再次调用时不会访问注册中心，这里会存在一致性的问题</p> <p>RPC 框架选择</p> <ul><li>简单的 HTTP 请求，选择 WebClient（异步或流式场景），Spring Boot 4 新引入了 HTTP Service Clients</li> <li>负载均衡和声明式 HTTP 调用，选择 OpenFeign，内置了 Ribbon 做负载均衡</li> <li>如果需要高性能的 RPC 调用和更强的服务管理能力，选择 Dubbo / gRPC</li></ul> <p>总的来说，基于 TCP 的协议（Dubbo 和 gRPC HTTP2），效率会明显高于使用 HTTP 的 Feign</p> <h4 id="nio-和-netty"><a href="#nio-和-netty" class="header-anchor">#</a> NIO 和 Netty</h4> <blockquote><p>NIO 和 Netty 是很多 RPC 的底层组件</p></blockquote> <p>NIO（New Input/Output） 是 Java 1.4 引入的一组用于提供非阻塞输入输出的 API，核心是事件驱动</p> <ul><li>监听器监听特定事件，事件发生时，控制器将其广播到每一个监听器</li> <li>例如消息队列的一对多模型，实际上也是一种事件驱动，消费者监听并处理特定队列的生产</li></ul> <p>Netty 是一个封装了 Java NIO 的底层网络通信组件，Netty 高性能的关键在于</p> <ul><li>线程池 + 事件驱动</li> <li>零拷贝技术 Zero Copy</li> <li>池化内存</li> <li>TCP 粘包 / 拆包处理</li></ul> <h3 id="higress-网关"><a href="#higress-网关" class="header-anchor">#</a> Higress 网关</h3> <blockquote><p>网关的常见用途：权限控制、路由、负载均衡、限流</p></blockquote> <p>一个请求的基本路径：<code>LB → Gateway → Server</code></p> <img src="/assets/img/2729274-20230205163347683-397320818.b336006b.png"> <p>我更倾向于用后端去做权限校验，而不是网关层，故而网关的作用更多是路由、负载均衡和限流，类似于一个更高级更全面的 Nginx 管理</p> <ul><li>实际中也确实如此，真正的用户权限在后端鉴权（因为用户权限落在后端 DB 中），但网关也负责一部分的鉴权，例如是否携带必要的请求头，请求来源是否合法等等过滤</li></ul> <h3 id="sentinel-限流熔断组件"><a href="#sentinel-限流熔断组件" class="header-anchor">#</a> Sentinel 限流熔断组件</h3> <blockquote><p>阿里开源的熔断降级解决方案</p></blockquote> <p>限流、熔断和服务降级是三种常用的系统稳定性策略，通常我们说为了保证系统的可用性会把限流、降级、熔断一把梭</p> <ul><li>降级：服务端出现问题，客户端降级使用 FallbackMethod 方法，返回一个友好的提示，而不至于忙等</li> <li>熔断：达到一定条件后（比如请求故障率达到 60%），直接拒绝服务</li> <li>限流：比如点对点消息队列缓慢消费请求，大家排队，一秒钟 N 个，有序进行，秒杀高并发等操作，严禁一窝蜂的过来拥挤</li></ul> <p>熔断（Circuit Breaker）：电路保险丝，在分布式系统中，熔断机制包括两部分，一是检测服务是否故障，二是在超过阈值时自动阻止请求，以防止系统崩溃</p> <p>熔断器的三种状态</p> <ol><li>关闭（Closed）：服务正常运行，请求可以自由通过</li> <li>打开（Open）：当错误率达到阈值，熔断器打开，所有请求都会被拒绝，防止系统继续崩溃</li> <li>半开（Half-Open）：经过一段时间后，系统尝试放行部分请求进行测试，如果恢复正常，熔断器关闭，否则保持打开状态</li></ol> <p>例如</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@CircuitBreaker</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;paymentService&quot;</span><span class="token punctuation">,</span> fallbackMethod <span class="token operator">=</span> <span class="token string">&quot;fallbackPayment&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">callPaymentService</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 调用远程支付服务</span>
    <span class="token keyword">return</span> restTemplate<span class="token punctuation">.</span><span class="token function">getForObject</span><span class="token punctuation">(</span><span class="token string">&quot;http://payment-service/pay&quot;</span><span class="token punctuation">,</span> <span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// 熔断后的降级方法</span>
<span class="token keyword">public</span> <span class="token class-name">String</span> <span class="token function">fallbackPayment</span><span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> <span class="token string">&quot;支付服务不可用，请稍后重试&quot;</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">resilience4j.circuitbreaker</span><span class="token punctuation">:</span>
  <span class="token key atrule">instances</span><span class="token punctuation">:</span>
    <span class="token key atrule">paymentService</span><span class="token punctuation">:</span>
      <span class="token key atrule">failureRateThreshold</span><span class="token punctuation">:</span> <span class="token number">50</span>  <span class="token comment"># 失败率达到 50% 时触发熔断</span>
      <span class="token key atrule">waitDurationInOpenState</span><span class="token punctuation">:</span> 5000ms  <span class="token comment"># 熔断后 5 秒再尝试恢复</span>
      <span class="token key atrule">permittedNumberOfCallsInHalfOpenState</span><span class="token punctuation">:</span> <span class="token number">3</span>  <span class="token comment"># 半开状态时允许 3 个请求进行尝试</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>限流（Rate Limiting）：限制请求速率，防止单个服务 QPS 过高被拖垮，例如</p> <ul><li>防止流量暴增导致系统崩溃（如双十一购物、秒杀活动）</li> <li>防止恶意攻击（如爬虫、DDoS 攻击）</li> <li>合理分配系统资源，保障 VIP 用户的优先级</li></ul> <p>Spring Cloud Gateway 内置了基于 Redis 令牌桶算法的限流功能，需要同时引入 Redis 和 Gateway 依赖并进行限流规则配置</p> <p>什么时候使用熔断？什么时候使用限流？</p> <ul><li>熔断：服务出现错误返回是不被允许的，例如微信支付，如果支付接口故障，启用熔断，显示“支付系统繁忙”，而不能让请求挂着造成未知错误</li> <li>限流：当你的服务流量暴增时，防止服务器资源被耗尽，例如淘宝双十一，高并发限流，防止流量冲垮系统，运行请求在后台“挂着”</li></ul> <p>简单来说：熔断用于保护服务防止雪崩，是兜底机制；限流用于平稳流量，提供稳定性</p> <h3 id="seata-事务与隔离组件"><a href="#seata-事务与隔离组件" class="header-anchor">#</a> Seata 事务与隔离组件</h3> <blockquote><p>阿里开源的分布式事务解决方案</p></blockquote> <p>什么是事务？事务是指一组操作的逻辑单元，这些操作要么全部成功，要么全部失败，事务具有四个基本特性（ACID）</p> <ul><li>原子性：事务中的所有操作要么全部完成，要么全部不做</li> <li>一致性：事务执行前后，数据库必须保持一致性状态</li> <li>隔离性：并发执行的事务之间互不干扰</li> <li>持久性：一旦事务提交，其结果是永久性的，即使系统崩溃也不会丢失</li></ul> <p>在 Spring 中，可用<code>@Transactional</code> 声明事务，直接在 Service 层对应的方法上进行注解，即可完成一次事务的编写</p> <ul><li><code>@Transactional</code> 只能修饰 public 方法</li> <li><code>@Transactional</code> 不能自身调用，比如方法 A 和 B 都在 UserService 类中，如果在 A 中调用 B 方法，即使 B 方法有<code>@Transactional</code> 修饰，这个事务也不会生效，这和 Java 的动态代理机制有关</li></ul> <p>例如网银系统的一次 SQL 数据库事务写入</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Deprecated</span>
<span class="token annotation punctuation">@Transactional</span>
<span class="token annotation punctuation">@Override</span>
<span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">doWithdrawal</span><span class="token punctuation">(</span><span class="token class-name">TransactionDTO</span> transactionDTO<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> r <span class="token operator">=</span> accountMapper<span class="token punctuation">.</span><span class="token function">updateBalanceById</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">negate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">toString</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Transaction</span> transaction <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Transaction</span><span class="token punctuation">(</span>transactionDTO<span class="token punctuation">.</span><span class="token function">getMyAccount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token number">0L</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;外部账户&quot;</span><span class="token punctuation">,</span>
                                              transactionDTO<span class="token punctuation">.</span><span class="token function">getAmount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
                                              <span class="token string">&quot;用户取款&quot;</span><span class="token punctuation">,</span>
                                              r <span class="token operator">==</span> <span class="token number">1</span> <span class="token operator">?</span> <span class="token number">0</span> <span class="token operator">:</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> transactionMapper<span class="token punctuation">.</span><span class="token function">insertTransaction</span><span class="token punctuation">(</span>transaction<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>其中</p> <ul><li><code>@Transactional(timeout = 5)</code>：设置超时，单位秒，超过时间未完成则回滚</li> <li><code>@Transactional(readOnly = true)</code>：只读事务中不能执行写操作，否则会抛出异常</li> <li>事务回滚规则：默认情况下，<code>@Transactional</code> 回滚的是 RunTimeException，如果需要特殊要求，需要指定
<ul><li><code>@Transactional(rollbackFor = {IOException.class, SQLException.class})</code>：回滚 I/O 和 SQL 异常</li> <li><code>@Transactional(noRollbackFor = {NullPointerException.class})</code>：不回滚空指针异常</li></ul></li></ul> <p>常见的事务隔离级别，以<code>@Transactional</code>为例，其 <code>isolation</code> 属性用于定义事务的隔离级别</p> <table><thead><tr><th>隔离级别</th> <th>防止脏读</th> <th>防止不可重复读</th> <th>防止幻读</th></tr></thead> <tbody><tr><td>read uncommitted</td> <td>✗</td> <td>✗</td> <td>✗</td></tr> <tr><td>read committed</td> <td>✓</td> <td>✗</td> <td>✗</td></tr> <tr><td>repeatable read (MySQL 默认)</td> <td>✓</td> <td>✓</td> <td>部分 ✓（间隙锁）</td></tr> <tr><td>serializable</td> <td>✓</td> <td>✓</td> <td>✓</td></tr></tbody></table> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Transactional</span><span class="token punctuation">(</span>isolation <span class="token operator">=</span> <span class="token class-name">Isolation</span><span class="token punctuation">.</span><span class="token constant">REPEATABLE_READ</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">methodB</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 在可重复读隔离级别下执行</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h4 id="事务读写事故"><a href="#事务读写事故" class="header-anchor">#</a> 事务读写事故</h4> <p>脏读</p> <ul><li>读到了写过程中的临时数据</li> <li>给写加锁，写时不能读</li></ul> <p>不可重复读</p> <ul><li>例如，在一个事务中，前后重复读同一数据，数据存在改变，说明读的时候有人在写</li> <li>给读加锁，读时不能写</li></ul> <p>幻读：针对”数据表“层面的事故</p> <ul><li>假设我们给数据加了上述的读写锁（读时不写，写时不读），但这里的粒度只针对于这条数据，也就是说，在范围查表的时候，有可能出现同一事务的两次<code>count(*)</code>返回不一样的结果（第一次读之后有人在往表里豪数据）</li> <li>对整个数据表加读写锁，彻底串行执行，效率极低</li></ul> <p>修改丢失</p> <ul><li>ABA 问题，前后两次写，都根据同一源状态进行变更，后一次写覆盖了前一次写的提交，并且第一次写在 DB 中完全没有记录</li> <li>对同一条数据写互斥</li></ul> <h4 id="多阶段提交"><a href="#多阶段提交" class="header-anchor">#</a> 多阶段提交</h4> <blockquote><p>一般而言，解决分布式事务会用到以下几种机制</p></blockquote> <p>2PC：两阶段提交，将事务的提交过程分为资源准备和资源提交两个阶段，并且由事务协调者来协调所有事务参与者，如果准备阶段所有事务参与者都预留资源成功，则进行第二阶段的资源提交，否则事务协调者回滚资源</p> <p>3PC：三阶段提交协议，是二阶段提交协议的改进版本，三阶段提交有两个改动点</p> <ol><li>在协调者和参与者中都引入超时机制</li> <li>在第一阶段和第二阶段中插入一个准备阶段，保证了在最后提交阶段之前各参与节点的状态是一致的</li></ol> <p>TCC：另一种分布式事务处理方法，它的名称来自于其三个阶段<code>Try, Confirm, Cancel</code>，这种方法主要用于处理在分布式系统中，多个服务需要协同完成一项操作时的一致性问题</p> <h3 id="es-搜索引擎"><a href="#es-搜索引擎" class="header-anchor">#</a> ES 搜索引擎</h3> <blockquote><p>模糊查询、全文搜索、语义搜索及关键词搜索的区别？</p></blockquote> <p>ES 是什么？一个基于 Lucene 的分布式搜索和分析引擎，主要用于全文检索和日志分析，例如百度文库的文档需要支持全文搜索和语义搜索，就是用的 ES 索引，返回文档 id，控制面再从 BOS 里取内容</p> <ul><li>ES 的快速索引核心在于倒排索引和 <a href="https://northboat.github.io/pages/7bc025" target="_blank" rel="nofollow noopener noreferrer">BM25 算法<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li>ES 的数据一致性基于 Raft 算法，这个算法在很多地方看到过，例如 K8s 里 etcd 的选主</li></ul> <p>本质上 ES 就是在做存储，要么是索引，要么是内容</p> <ul><li>一种就是像文库做文档的索引，当一个搜索引擎在用</li> <li>另一种就是做 DB，比如日志系统，直接用 ES 作为日志的落盘点，典型的就是 ELK 栈，包括华子的 SkyWalking 用的也是 ES</li></ul> <p>ELK（Elastic Stack），是以 ElasticSearch 为核心的技术栈，广泛应用在日志数据分析、实时监控等领域</p> <ol><li>数据可视化：Kibana</li> <li>数据索引和存储：Elasticsearch</li> <li>数据清晰：Logstash、Beats</li></ol> <p>日志数据流向</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>日志数据 ➡️ FileBeat ➡️ Kafka ➡️ Logstash ➡️ Elasticsearch ➡️ Kibana
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>DSL 是 elasticsearch 提供的JSON风格的请求语句，用来操作 elasticsearch，实现 CRUD，类似于 SQL</p> <p>ES 的索引库和文档</p> <ul><li>索引库就是数据表定义</li> <li>文档就是数据行</li></ul> <p>例如一个 /hotel 的索引库，以 json 的格式通过 <code>PUT /hotel</code> 命令入库（create table）</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>

      <span class="token punctuation">}</span><span class="token punctuation">,</span>

        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;integer&quot;</span>

        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;city&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;copy_to&quot;</span><span class="token operator">:</span> <span class="token string">&quot;all&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;starName&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>

      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;location&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;geo_point&quot;</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;pic&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;keyword&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;index&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span>
      <span class="token punctuation">}</span><span class="token punctuation">,</span>
      <span class="token property">&quot;all&quot;</span><span class="token operator">:</span><span class="token punctuation">{</span>
        <span class="token property">&quot;type&quot;</span><span class="token operator">:</span> <span class="token string">&quot;text&quot;</span><span class="token punctuation">,</span>
        <span class="token property">&quot;analyzer&quot;</span><span class="token operator">:</span> <span class="token string">&quot;ik_max_word&quot;</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br></div></div><p>而 /hotel/1 这样的文档就对应一个个具体的酒店，他以 /hotel 规定的 Json 格式（Scheme）存储数据</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>

  <span class="token property">&quot;address&quot;</span><span class="token operator">:</span> <span class="token string">&quot;北京市东城区王府井大街88号&quot;</span><span class="token punctuation">,</span>

    <span class="token property">&quot;lat&quot;</span><span class="token operator">:</span> <span class="token number">39.915</span><span class="token punctuation">,</span>
    <span class="token property">&quot;lon&quot;</span><span class="token operator">:</span> <span class="token number">116.397</span>
  <span class="token punctuation">}</span><span class="token punctuation">,</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><p><a href="https://www.elastic.co/guide/en/elasticsearch/client/index.html" target="_blank" rel="nofollow noopener noreferrer">Elasticsearch Clients | Elastic<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>：在 Spring 中引入 ES Client 依赖，通过远程 DSL 操作 ES 库</p> <h2 id="monorepo-架构"><a href="#monorepo-架构" class="header-anchor">#</a> Monorepo 架构</h2> <blockquote><p><a href="https://juejin.cn/post/7215886869199896637" target="_blank" rel="nofollow noopener noreferrer">带你了解更全面的 Monorepo - 优劣、踩坑、选型带你了解更全面的 Monorepo，本文涵盖了 Monoreo - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>简单来说，就是单仓库多模块，与之对应的是 Multirepo，多仓库多模块。这样做的明显优势就是代码更为集中，可以避免代码分散导致的重复劳动</p> <ul><li>可看到相关项目全貌，编码非常方便</li> <li>依赖调试方便，依赖包迭代场景下，借助工具自动联合编译</li> <li>依赖包管理共用，不需要重复占用磁盘空间</li> <li>CI / CD 也可以集中配置</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/ea2fa2/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">AOP 解耦</div></a> <a href="/pages/46b8df/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">领域驱动设计</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
