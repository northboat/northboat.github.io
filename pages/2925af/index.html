uv <span class="token operator">--</span>version
uv python install 3<span class="token punctuation">.</span>12          <span class="token comment"># 装官方 standalone 3.12 到 ~/.local/share/uv/python/</span>

uv python insatll 3<span class="token punctuation">.</span>12 <span class="token operator">--</span>default <span class="token comment"># 建立软链，让全局 python 为 uv 的版本</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>在项目里使用特定版本 python，这是目录层次的管理</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>uv python <span class="token function">install</span> <span class="token number">3.15</span>
uv python pin <span class="token number">3.15</span>
uv venv                       <span class="token comment"># 按 pin 的版本建 .venv</span>
uv <span class="token function">add</span> requests               <span class="token comment"># 装依赖，自动写进 pyproject + uv.lock</span>
uv <span class="token function">add</span> <span class="token parameter variable">--dev</span> pytest           <span class="token comment"># dev 依赖</span>
uv remove requests
uv <span class="token function">sync</span>                       <span class="token comment"># 按 lock 文件还原环境（换机/拉代码后跑这个）</span>
uv lock <span class="token parameter variable">--upgrade</span>             <span class="token comment"># 更新依赖版本</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>用 uv pip 代替 pip，直接 pip3 会指向 MAC CLT 的 python3.9 的 pip</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>uv pip <span class="token function">install</span> requests       <span class="token comment"># 需在激活的 venv 里</span>
uv pip <span class="token function">install</span> <span class="token parameter variable">-r</span> requirements.txt
uv pip list
uv pip uninstall requests
uv pip freeze <span class="token operator">&gt;</span> requirements.txt
uv pip <span class="token function">install</span> requests <span class="token parameter variable">--python</span> .venv/bin/python   <span class="token comment"># 不激活也能指定目标环境</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>运行 python</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>uv run python main.py         <span class="token comment"># 自动用项目 .venv 或按 .python-version 建临时环境</span>
uv run pytest
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>其实最常用的姿势就四条</p> <ol><li><code>uv venv</code> 按 pin 住的版本新建项目</li> <li><code>uv add</code> 安装依赖包</li> <li><code>uv run</code> 运行 python</li> <li><code>uv sync</code> 同步依赖</li></ol> <p>为什么不用 conda？重死了，我只是个臭开发</p> <h3 id="基础语法"><a href="#基础语法" class="header-anchor">#</a> 基础语法</h3> <p>运算符</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token comment"># ---------- 身份运算 ----------</span>
a <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">]</span>
b <span class="token operator">=</span> a
c <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a <span class="token keyword">is</span> b<span class="token punctuation">)</span>      <span class="token comment"># True，同一对象</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a <span class="token keyword">is</span> c<span class="token punctuation">)</span>      <span class="token comment"># False，不同对象</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>a <span class="token keyword">is</span> <span class="token keyword">not</span> c<span class="token punctuation">)</span>  <span class="token comment"># True</span>

<span class="token comment"># ---------- 成员运算 ----------</span>
lst <span class="token operator">=</span> <span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">3</span><span class="token punctuation">]</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token number">2</span> <span class="token keyword">in</span> lst<span class="token punctuation">)</span>     <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token number">4</span> <span class="token keyword">not</span> <span class="token keyword">in</span> lst<span class="token punctuation">)</span> <span class="token comment"># True</span>
<span class="token comment"># 注意：in 相当于容器内的包含，不是 instanceof（那是 isinstance）</span>

<span class="token comment"># ---------- 算术运算 ----------</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token number">10</span> <span class="token operator">//</span> <span class="token number">3</span><span class="token punctuation">)</span>   <span class="token comment"># 3，向下取整（地板除）</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token number">10</span> <span class="token operator">%</span> <span class="token number">3</span><span class="token punctuation">)</span>    <span class="token comment"># 1，取余数（常用）</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token number">2</span> <span class="token operator">**</span> <span class="token number">4</span><span class="token punctuation">)</span>    <span class="token comment"># 16，幂运算</span>

<span class="token comment"># ---------- 逻辑运算 ----------</span>
x<span class="token punctuation">,</span> y <span class="token operator">=</span> <span class="token number">5</span><span class="token punctuation">,</span> <span class="token number">10</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>x <span class="token operator">&gt;</span> <span class="token number">0</span> <span class="token keyword">and</span> y <span class="token operator">&lt;</span> <span class="token number">20</span><span class="token punctuation">)</span>  <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>x <span class="token operator">&gt;</span> <span class="token number">10</span> <span class="token keyword">or</span> y <span class="token operator">&lt;</span> <span class="token number">20</span><span class="token punctuation">)</span>  <span class="token comment"># True</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token keyword">not</span> x <span class="token operator">&gt;</span> <span class="token number">10</span><span class="token punctuation">)</span>        <span class="token comment"># True</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br></div></div><p>字符串获取长度</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code>length <span class="token operator">=</span> <span class="token builtin">len</span><span class="token punctuation">(</span>cur<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>分割字符串</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token comment">#通过空格分割字符串str为字符串数组</span>
<span class="token builtin">str</span><span class="token punctuation">.</span>split<span class="token punctuation">(</span><span class="token string">&quot; &quot;</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>数字转字符串</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token builtin">str</span><span class="token punctuation">(</span>number<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>用 <code>[ : ]</code> 截取字符串，含头不含尾</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code>sentence <span class="token operator">=</span> <span class="token string">&quot;我打你妈的&quot;</span>
<span class="token keyword">print</span><span class="token punctuation">(</span>sentence<span class="token punctuation">[</span><span class="token number">2</span><span class="token punctuation">:</span><span class="token number">5</span><span class="token punctuation">]</span><span class="token punctuation">)</span>
<span class="token comment">#将会输出 “你妈的”</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>return 和 yield</p> <ul><li>return 是阻塞的，单线程的，和 Java 中 return 保持一致</li> <li>而 yield 是非阻塞的，如下列函数通过 yield 返回</li></ul> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">def</span> <span class="token function">user_input</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">while</span> <span class="token boolean">True</span><span class="token punctuation">:</span>
        s <span class="token operator">=</span> <span class="token builtin">input</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> <span class="token keyword">not</span> s<span class="token punctuation">:</span>
            <span class="token keyword">return</span>
        <span class="token keyword">yield</span> s

<span class="token keyword">for</span> line <span class="token keyword">in</span> <span class="token builtin">map</span><span class="token punctuation">(</span><span class="token builtin">str</span><span class="token punctuation">.</span>upper<span class="token punctuation">,</span> user_input<span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>line<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>yield 非阻塞，这意味着获得值后，将新开辟一条线程立即返回，继续执行之后的代码，同时这个函数继续运行，如上述代码的执行顺序为</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>hello
HELLO
world
WORLD
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>类、函数和继承</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token comment"># ---------- self ----------</span>
<span class="token comment"># self 代表实例本身，类方法第一个参数必须是 self（约定）</span>
<span class="token keyword">class</span> <span class="token class-name">Test</span><span class="token punctuation">:</span>
    <span class="token keyword">def</span> <span class="token function">prt</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span>          <span class="token comment"># 实例对象</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span>self<span class="token punctuation">.</span>__class__<span class="token punctuation">)</span>  <span class="token comment"># 类名</span>

t <span class="token operator">=</span> Test<span class="token punctuation">(</span><span class="token punctuation">)</span>
t<span class="token punctuation">.</span>prt<span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment"># 调用时 self 自动传入</span>


<span class="token comment"># ---------- 命名规范 ----------</span>
<span class="token keyword">class</span> <span class="token class-name">NamingDemo</span><span class="token punctuation">:</span>
    _protected <span class="token operator">=</span> <span class="token string">&quot;保护类型&quot;</span>      <span class="token comment"># 单下划线：protected，子类可访问</span>
    __private <span class="token operator">=</span> <span class="token string">&quot;私有类型&quot;</span>       <span class="token comment"># 双下划线：private，仅本类内部可访问</span>

    <span class="token keyword">def</span> <span class="token function">__init__</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        self<span class="token punctuation">.</span>__private <span class="token operator">=</span> <span class="token string">&quot;只能类内访问&quot;</span>

    <span class="token keyword">def</span> <span class="token function">__special__</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>      <span class="token comment"># 首尾双下划线：特殊方法（系统定义）</span>
        <span class="token keyword">return</span> <span class="token string">&quot;特殊方法，如 __init__&quot;</span>


<span class="token comment"># ---------- 类的继承 ----------</span>
<span class="token keyword">class</span> <span class="token class-name">Parent</span><span class="token punctuation">:</span>
    parent_attr <span class="token operator">=</span> <span class="token number">100</span>

    <span class="token keyword">def</span> <span class="token function">__init__</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;调用父类构造函数&quot;</span><span class="token punctuation">)</span>

    <span class="token keyword">def</span> <span class="token function">parent_method</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;调用父类方法&quot;</span><span class="token punctuation">)</span>

    <span class="token keyword">def</span> <span class="token function">set_attr</span><span class="token punctuation">(</span>self<span class="token punctuation">,</span> val<span class="token punctuation">)</span><span class="token punctuation">:</span>
        Parent<span class="token punctuation">.</span>parent_attr <span class="token operator">=</span> val

    <span class="token keyword">def</span> <span class="token function">get_attr</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;父类属性:&quot;</span><span class="token punctuation">,</span> Parent<span class="token punctuation">.</span>parent_attr<span class="token punctuation">)</span>


<span class="token keyword">class</span> <span class="token class-name">Child</span><span class="token punctuation">(</span>Parent<span class="token punctuation">)</span><span class="token punctuation">:</span>           <span class="token comment"># 子类继承父类</span>
    <span class="token keyword">def</span> <span class="token function">__init__</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token builtin">super</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>__init__<span class="token punctuation">(</span><span class="token punctuation">)</span>     <span class="token comment"># 调用父类构造（Python3 写法）</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;调用子类构造方法&quot;</span><span class="token punctuation">)</span>

    <span class="token keyword">def</span> <span class="token function">child_method</span><span class="token punctuation">(</span>self<span class="token punctuation">)</span><span class="token punctuation">:</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">&quot;调用子类方法&quot;</span><span class="token punctuation">)</span>


c <span class="token operator">=</span> Child<span class="token punctuation">(</span><span class="token punctuation">)</span>
c<span class="token punctuation">.</span>child_method<span class="token punctuation">(</span><span class="token punctuation">)</span>   <span class="token comment"># 调用子类方法</span>
c<span class="token punctuation">.</span>parent_method<span class="token punctuation">(</span><span class="token punctuation">)</span>  <span class="token comment"># 调用父类方法</span>
c<span class="token punctuation">.</span>set_attr<span class="token punctuation">(</span><span class="token number">200</span><span class="token punctuation">)</span>    <span class="token comment"># 修改父类属性</span>
c<span class="token punctuation">.</span>get_attr<span class="token punctuation">(</span><span class="token punctuation">)</span>       <span class="token comment"># 获取父类属性</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br></div></div><p>不定长参数：带星号的参数即为不定长参数</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">def</span> <span class="token function">printinfo</span><span class="token punctuation">(</span> arg1<span class="token punctuation">,</span> <span class="token operator">*</span>vartuple <span class="token punctuation">)</span><span class="token punctuation">:</span>   
    <span class="token string">&quot;打印任何传入的参数&quot;</span>   
    <span class="token keyword">print</span> <span class="token string">&quot;输出: &quot;</span>   
    <span class="token keyword">print</span> arg1   
    <span class="token keyword">for</span> var <span class="token keyword">in</span> vartuple<span class="token punctuation">:</span>      
        <span class="token keyword">print</span> var   
        <span class="token keyword">return</span>  
<span class="token comment"># 调用printinfo 函数 </span>
printinfo<span class="token punctuation">(</span> <span class="token number">10</span> <span class="token punctuation">)</span> printinfo<span class="token punctuation">(</span> <span class="token number">70</span><span class="token punctuation">,</span> <span class="token number">60</span><span class="token punctuation">,</span> <span class="token number">50</span> <span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><h3 id="常用函数"><a href="#常用函数" class="header-anchor">#</a> 常用函数</h3> <p>计算</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token comment"># ---------- 内置数学函数 ----------</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">abs</span><span class="token punctuation">(</span><span class="token operator">-</span><span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">)</span>        <span class="token comment"># 10，绝对值</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">max</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">5</span><span class="token punctuation">)</span><span class="token punctuation">)</span>    <span class="token comment"># 5，最大值（可传序列）</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">min</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">5</span><span class="token punctuation">)</span><span class="token punctuation">)</span>    <span class="token comment"># 1，最小值（可传序列）</span>
<span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">pow</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">,</span> <span class="token number">4</span><span class="token punctuation">)</span><span class="token punctuation">)</span>       <span class="token comment"># 16，等价于 2**4</span>

<span class="token comment"># sqrt 需导入 math 模块</span>

                line <span class="token operator">=</span> re<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">.</span>decode<span class="token punctuation">(</span><span class="token string">'utf-8'</span><span class="token punctuation">)</span><span class="token punctuation">.</span>strip<span class="token punctuation">(</span><span class="token string">' '</span><span class="token punctuation">)</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>阻塞的连续执行：这里的 stdout 和 stderr 都是阻塞的，开启两条线程去专门读这个阻塞内容，在主线程中写入命令</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code><span class="token keyword">import</span> subprocess
