96T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(15662.9,0)"><path data-c="1D451" d="M366 683Q367 683 438 688T511 694Q523 694 523 686Q523 679 450 384T375 83T374 68Q374 26 402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487H491Q506 153 506 145Q506 140 503 129Q490 79 473 48T445 8T417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157Q33 205 53 255T101 341Q148 398 195 420T280 442Q336 442 364 400Q369 394 369 396Q370 400 396 505T424 616Q424 629 417 632T378 637H357Q351 643 351 645T353 664Q358 683 366 683ZM352 326Q329 405 277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q233 26 290 98L298 109L352 326Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(16460.7,0)"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mo>&lt;</mo><mi>t</mi><mi>a</mi><mi>b</mi><mi>l</mi><mi>e</mi><mi>N</mi><mi>a</mi><mi>m</mi><mi>e</mi><mo>&gt;</mo><mo>−</mo><mo>&lt;</mo><mi>s</mi><mi>n</mi><mi>o</mi><mi>w</mi><mi>f</mi><mi>l</mi><mi>a</mi><mi>k</mi><mi>e</mi><mi>U</mi><mi>u</mi><mi>i</mi><mi>d</mi><mo>&gt;</mo></math></mjx-assistive-mml></mjx-container><p>这里雪花 id 做简化或者截断即可，没必要 64 位</p> <h3 id="联合主键"><a href="#联合主键" class="header-anchor">#</a> 联合主键</h3> <p>以判题记录为例，设置一个用户 ID + 题目 ID 的联合主键</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    userId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">INT</span><span class="token punctuation">,</span>
    state <span class="token keyword">INT</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>联合主键遵循“最左前缀原则”，例如这里的主键是</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">PRIMARY</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>studentID<span class="token punctuation">,</span> courseID<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>那么主键索引可用情况为</p> <table><thead><tr><th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>studentID = 1</td> <td>是</td></tr> <tr><td>studentID = 1 AND courseID = 2</td> <td>是</td></tr> <tr><td>courseID = 2</td> <td>否</td></tr></tbody></table> <p>这点在设计阶段必须想清楚，否则索引等于白建</p> <p>并且，如果以 userId 和 questionId 为主键，那么对于每个用户而言，每个题目的判题记录将会是唯一的，这实际上严重不符合业务逻辑</p> <p>所以，正确的判题记录表应该是</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>用一个判题记录 id 作为主键（仅作为记录的行数记录），然后为 userId 和 questionId 建立索引以满足根据用户查记录和根据题目查记录的业务需求，这样的普通索引会导致回表问题</p> <h3 id="索引最左匹配原则"><a href="#索引最左匹配原则" class="header-anchor">#</a> 索引最左匹配原则</h3> <blockquote><p>什么是最左匹配原则，底层数据结构原理是什么？</p></blockquote> <p>索引最左匹配原则</p> <ul><li>在使用联合索引查询时，数据库会优先匹配索引的<strong>最左侧字段</strong>，并依次向右匹配</li> <li>如果左侧字段不参与查询条件（或无法被索引匹配），那么右侧字段将无法使用该联合索引，会退化为全表扫描或部分索引扫描</li></ul> <p>例如联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code>idx<span class="token punctuation">(</span>a<span class="token punctuation">,</span> b<span class="token punctuation">,</span> c<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>B+ 树的排序优先级为：<strong>先按<code>a</code>字段排序 → 再按<code>b</code>字段排序 → 最后按<code>c</code>字段排序</strong></p> <p>这是导致最左匹配原则的底层原理，这意味着</p> <ul><li>若查询条件包含<code>a</code>，可以快速定位到<code>a</code>对应的子树，再在子树中匹配<code>b</code>，以此类推</li> <li>若查询条件不包含<code>a</code>，B+ 树无法确定起始遍历位置，只能全表扫描，无法利用<code>b, c</code>字段的索引</li></ul> <p>也就是说，如果是多个联合索引，一定要满足“左侧”的搜索条件，“右侧”的索引才会生效</p> <p>具体而言，其联合索引<code>idx(a,b,c)</code>索引的可用情况为</p> <table><thead><tr><th>情况</th> <th>查询条件</th> <th>是否走索引</th></tr></thead> <tbody><tr><td>1</td> <td>a = 1</td> <td>是</td></tr> <tr><td>2</td> <td>a = 1 and b = 2</td> <td>是</td></tr> <tr><td>3</td> <td>a = 1 and b = 2 and c = 3</td> <td>是</td></tr> <tr><td>4</td> <td>b = 2 and c = 3</td> <td>否</td></tr> <tr><td>5</td> <td>a = 1 and c = 3</td> <td>否</td></tr></tbody></table> <p>注意</p> <ul><li>在情况 4 中：因为最左条件没有，所以从一开始就不会走索引，会直接全表扫描<code>b = 2 and c = 3</code>的数据行</li> <li>而在情况 5 中：最左条件<code>a = 1</code>存在，所以会先走一遍索引，筛选出<code>a = 1</code>的记录，而后因为此时的最左索引<code>b</code>条件不存在，所以不会继续索引匹配，而是直接回表逐行过滤<code>c = 3</code>的情况（暴力过滤）</li></ul> <h3 id="回表查询"><a href="#回表查询" class="header-anchor">#</a> 回表查询</h3> <p>在现实场景中，基本上不用外键约束，数据库设计的复杂度和耦合度会激增，一般情况会设置一个逻辑外键，即不写<code>Foreign key</code>，只作为外键“逻辑”使用</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>这里虽然没有令 userId 为外键，但为其建立了一个普通索引，我可以直接根据 userId 去查询记录</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> state <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token string">&quot;202012143&quot;</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这样会先根据 idx_user 索引找到 userId 为 202012143 的 B+ 树叶子节点，获取这条数据的聚集索引 recordId，然后根据 recordId 查主键索引，找到对应记录的 state，这就是所谓的回表查询</p> <p>在普通索引（非主键索引）中：B+ 树叶子节点存的是「索引列值 + 主键值」</p> <p>假设我在 record 表中插入这样一条数据</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">INSERT</span> <span class="token keyword">INTO</span> record<span class="token punctuation">(</span>recordId<span class="token punctuation">,</span> userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">,</span> <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span><span class="token punctuation">)</span> <span class="token keyword">VALUES</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">202012143</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;通过&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后我要查询 userId 字段为 202012143 的数据行</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> record <span class="token keyword">where</span> userId <span class="token operator">=</span> <span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这段查询</p> <ol><li>会先走普通索引，找到记录了 userId 为 202012143 的叶子节点后，拿到其对应的 recordId 主键索引值，例如这里为 1</li> <li>然后再根据聚集索引 1 去找到这条完整的数据</li></ol> <p>在整个流程中，存在先找普通索引，再找聚集索引的过程，实际上查了两次表，这第二次查表，就是所谓的回表查询</p> <ul><li>这样的查询会大幅拖慢查询速度，所以在在大表 + 高频查询场景中要谨慎设计普通索引</li></ul> <p>也就是说，用户想找自己做了哪些题，仅仅为 userId 做一个普通索引，是一定会导致回表的</p> <h3 id="联合索引、覆盖索引和索引下推"><a href="#联合索引、覆盖索引和索引下推" class="header-anchor">#</a> 联合索引、覆盖索引和索引下推</h3> <p>解决回表问题</p> <ol><li>覆盖索引</li> <li>索引下推</li> <li>索引跳跃式扫描</li></ol> <h4 id="联合索引避免回表"><a href="#联合索引避免回表" class="header-anchor">#</a> 联合索引避免回表</h4> <blockquote><p>通过联合覆盖索引避免高频查询的回表问题</p></blockquote> <p>对于判题记录表，我现在有这样几个需求，如何实现快速查找？</p> <ol><li>用户要能够根据 userId 快速找到自己做过哪些题目</li> <li>管理者要能够根据 questionId 快速找到某个题目被做了多少遍</li> <li>用户要能够根据 userId 和 questionId 快速找到指定题目的所有判题记录</li></ol> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>联合索引：为了快速根据用户 id 和题目 id 查找数据，一个很朴素的方法就是，为这两个字段建立联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user_question<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>那么我们需要明确的是，这个索引的叶子节点中，包含<code>userId, questionId, recordId</code>三个字段，这意味着</p> <ol><li>在仅依靠 userId 这一个字段进行查询时，<strong>在效率上和 userId 的单个普通索引是一样的</strong>，但返回的结果将多一个 questionId 字段</li> <li>当根据<code>userId</code>和<code>questionId</code>进行联合查询时，这样能“快速”定位到对应数据的 recordId，但如果要其他信息，<strong>仍需要回表查询</strong></li></ol> <p>覆盖索引：前面也说了，普通索引中存的是「索引列值 + 主键值」，这意味着，只要我查的是主键值，就不会回表，例如</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> recordId <span class="token keyword">from</span> record <span class="token keyword">where</span> userId<span class="token operator">=</span><span class="token number">202012143</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>由于 recordId 作为主键已经存在了 userId 的叶子索引结构中，所以他会直接返回结果，不需要回表查询</p> <p>那么我可不可以将一个关键信息都存在普通索引中呢？这样虽然增大了普通索引的存储开销，但不需要回表，节省的时间将是砍半的</p> <ul><li>显然可以，我们可以利用联合索引，对一些高频数据全部丢到这个索引 B+ 树中，这样对于相当一部分的查询，都不需要回表操作</li></ul> <p>例如，在上面的 record 表，一般而言，我只需要知道判题的状态，那么我们将 state 字段加入联合索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_union<span class="token punctuation">(</span>userId<span class="token punctuation">,</span> questionId<span class="token punctuation">,</span> state<span class="token punctuation">)</span> <span class="token comment"># 建立联合索引</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>那么在执行以下查询时</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> recordId<span class="token punctuation">,</span> state <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>就不需要回表了，只查找一次联合索引，就可以得到所有想要的数据字段</p> <p>特别的，一次查询后，由于得到了关键的主键信息，判题记录们在前端作为一个列表呈现，所有的判题记录主键在前端是已经获得的信息，所以在进一步查询详细判题信息时，将直接走主键索引去查找，这样将始终不会回表</p> <h4 id="索引下推和跳跃检索"><a href="#索引下推和跳跃检索" class="header-anchor">#</a> 索引下推和跳跃检索</h4> <blockquote><p>索引下推（Index Condition Pushdown，ICP），“遍历时过滤”</p></blockquote> <p>什么是索引下推，以上面的 record 表为例，我们此时只对 userId 建立了普通索引</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token identifier"><span class="token punctuation">`</span>desc<span class="token punctuation">`</span></span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">INDEX</span> idx_user<span class="token punctuation">(</span>userId<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>对于一条查询</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SELECT</span> <span class="token operator">*</span> <span class="token keyword">FROM</span> record <span class="token keyword">WHERE</span> userId <span class="token operator">=</span> <span class="token number">100</span> <span class="token operator">AND</span> questionId <span class="token operator">=</span> <span class="token number">200</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>若没有 ICP，数据库会先通过索引找到所有匹配<code>userId</code>的主键<code>recordId</code>，把这些主键“拉回”服务器层，再在服务器层过滤<code>questionId</code>等条件</p> <p>当有 ICP 时，数据库在遍历索引的过程中，就先过滤掉不满足<code>questionId</code>等条件的记录，只把符合所有条件的主键“拉回”服务器层</p> <ul><li>边遍历边过滤，而不是遍历完批处理</li></ul> <p>当然，ICP 在联合索引的场景下作用并不明显，因为联合索引本身已经能在索引树中直接定位<code>userId + questionId</code>，无需 ICP 额外过滤，也是为什么联合索引效率更高的原因之一</p> <blockquote><p>Skip Scan 跳跃检索</p></blockquote> <p>在高版本的 MySQL 中引入 Skip Scan 跳跃检索机制，可以“逃避”最左匹配索引，其核心思路是遍历不确定的索引项，同样实现边遍历边过滤，避免回表</p> <h2 id="db-数据一致性"><a href="#db-数据一致性" class="header-anchor">#</a> DB 数据一致性</h2> <h3 id="mysql-事务"><a href="#mysql-事务" class="header-anchor">#</a> MySQL 事务</h3> <p>GORM 层面的事务控制，返回一个 DB 连接</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// Begin 开启事务</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>GormDb<span class="token punctuation">)</span> <span class="token function">Begin</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>GormDb<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        db <span class="token operator">:=</span> its<span class="token punctuation">.</span>DB<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Begin</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> db<span class="token punctuation">.</span>Error <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> its<span class="token punctuation">.</span><span class="token function">HandleError</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> db<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token operator">&amp;</span>GormDb<span class="token punctuation">{</span>
                DB<span class="token punctuation">:</span> db<span class="token punctuation">,</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>在函数中，所有的数据库操作使用同一个数据库连接</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GpuQueueCreate 进行排队预约创建/重启</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>QueueController<span class="token punctuation">)</span> <span class="token function">GpuQueueCreate</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> action<span class="token punctuation">,</span> params <span class="token builtin">string</span><span class="token punctuation">,</span> open<span class="token punctuation">,</span>
                                           anyOpen <span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token operator">*</span>queue<span class="token punctuation">.</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">//...</span>

    <span class="token comment">// 获取事务连接</span>
    tx<span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>DbGlobal<span class="token punctuation">.</span><span class="token function">Begin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;预约gpu资源失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>

    <span class="token comment">// 定义数据库回滚</span>
    <span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token comment">// 回滚所有数据库提交</span>
            <span class="token boolean">_</span> <span class="token operator">=</span> tx<span class="token punctuation">.</span><span class="token function">Rollback</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">if</span> open <span class="token punctuation">{</span>
        envId<span class="token punctuation">,</span> action<span class="token punctuation">,</span> err <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">GpuQueueOpen</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> tx<span class="token punctuation">,</span> queueUid<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> anyOpen <span class="token punctuation">{</span>
        envId<span class="token punctuation">,</span> action<span class="token punctuation">,</span> err <span class="token operator">=</span> its<span class="token punctuation">.</span><span class="token function">GpuQueueAnyOpen</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> tx<span class="token punctuation">,</span> queueUid<span class="token punctuation">,</span> params<span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token comment">//...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br></div></div><p>当执行任何数据库操作时，至今赋值给 err，只要当任意一个过程使得 err 不为 nil，那么触发 defer 的时候，就会执行数据库回滚，实现当前函数的事务性（这和 Spring 的 @Transaction 是一样的效果，但实现的优雅的多，有感觉吗）</p> <h3 id="多版本并发控制"><a href="#多版本并发控制" class="header-anchor">#</a> 多版本并发控制</h3> <p>MVCC（Multi-Version Concurrency Control），多版本并发控制，是MySQL中被广泛采用的并发控制机制，它通过版本管理（维护多个版本快照）让读写互不阻塞，并实现事务的隔离</p> <p>核心机制：用<strong>版本快照</strong>替代锁阻塞，依赖 3 个关键组件，事务版本号、数据版本链和 Read View（读视图）</p> <p>事务版本号</p> <ul><li>数据库会为每个事务分配一个唯一递增的事务 ID（<code>transaction_id</code>），事务开始时生成</li> <li>数据的每次修改（INSERT/UPDATE/DELETE） 都会生成一个新的数据版本，并更新当前事务 ID 为新版本号</li></ul> <p>数据版本链：以 InnoDB 为例，每行数据的物理存储包含 3 个隐藏字段</p> <table><thead><tr><th style="text-align:center;">隐藏字段</th> <th style="text-align:center;">作用</th></tr></thead> <tbody><tr><td style="text-align:center;"><code>DB_TRX_ID</code></td> <td style="text-align:center;">最后一次修改该数据的事务 ID</td></tr> <tr><td style="text-align:center;"><code>DB_ROLL_PTR</code></td> <td style="text-align:center;">回滚指针，指向该数据的<strong>上一个历史版本</strong></td></tr> <tr><td style="text-align:center;"><code>DB_ROW_ID</code></td> <td style="text-align:center;">行唯一标识（无主键时自动生成）</td></tr></tbody></table> <p>通过当前事务 ID 和回滚指针能够轻松定位当前行数据的操作链（链表结构）</p> <p>Read View：当事务执行快照读（普通 <code>SELECT</code>，不加锁）时，数据库会生成一个 Read View，包含 4 个核心参数</p> <ul><li><code>m_ids</code>：当前活跃事务 ID 列表（未提交的事务）</li> <li><code>min_trx_id</code>：<code>m_ids</code>中的最小事务 ID</li> <li><code>max_trx_id</code>：下一个即将分配的事务 ID</li> <li><code>creator_trx_id</code>：生成该 Read View 的事务 ID</li></ul> <p>Read View 的可见性规则（判断数据版本是否对当前事务可见）</p> <ol><li>若数据版本的 <code>DB_TRX_ID == creator_trx_id</code> → 自己修改的，可见</li> <li>若 <code>DB_TRX_ID &lt; min_trx_id</code> → 事务已提交，可见</li> <li>若 <code>DB_TRX_ID &gt;= max_trx_id</code> → 事务在 Read View 生成后开启，不可见</li> <li>若 <code>min_trx_id ≤ DB_TRX_ID &lt; max_trx_id</code> → 若 <code>DB_TRX_ID</code> 在 <code>m_ids</code> 中（事务活跃），不可见，否则可见</li></ol> <p>如果当前版本不可见，就通过<code>DB_ROLL_PTR</code>回溯版本链，直到找到第一个可见版本</p> <p>也就是说，MVCC 通过管理事务状态，如果当前数据“正在被写”不允许读（读写锁的功能），那么就会通过事务回滚找到之前的版本返回，这样就能实现“写时可读”的需求</p> <p>Postgre 的 MVCC 和 MySQL 区别在哪？</p> <h3 id="缓存一致性"><a href="#缓存一致性" class="header-anchor">#</a> 缓存一致性</h3> <h4 id="读时更新缓存"><a href="#读时更新缓存" class="header-anchor">#</a> 读时更新缓存</h4> <p>假设我现在有一个高频数据表，用户的每次“读”都会先查询 Redis 数据库</p> <ol><li>看看有没有缓存，如果有就直接拿</li> <li>如果无就去打 MySQL 数据库取数据</li> <li>每次从 DB 拿到数据后，存入 Redis 缓存</li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">write</span><span class="token punctuation">(</span>user User<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> userService<span class="token punctuation">.</span><span class="token function">StoreUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span>
<span class="token punctuation">}</span>

<span class="token keyword">func</span> <span class="token function">read</span><span class="token punctuation">(</span>id <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span>User<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 读缓存</span>
    cache<span class="token punctuation">,</span> err <span class="token operator">:=</span> redisService<span class="token punctuation">.</span><span class="token function">GetCache</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> cache <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> cache<span class="token punctuation">,</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token comment">// 读 DB</span>
    user<span class="token punctuation">,</span> err <span class="token operator">:=</span> userService<span class="token punctuation">.</span><span class="token function">GetUserById</span><span class="token punctuation">(</span>id<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    <span class="token comment">// 存缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">SetCache</span><span class="token punctuation">(</span>id<span class="token punctuation">,</span> user<span class="token punctuation">)</span>
    <span class="token keyword">return</span> user<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>看起来还行，但实际上有个很大的漏洞，就是，这里的缓存只在命中 DB 后才会更新，也就是说，当这条数据在 DB 中改变后，已有的缓存将作为脏数据一直被读取</p> <p>因为每次写 DB 没有缓存更新策略</p> <h4 id="写时删除缓存"><a href="#写时删除缓存" class="header-anchor">#</a> 写时删除缓存</h4> <p>那么显然，在用户“写” MySQL 数据时，我一定要把这条数据对应的缓存从 Redis 里面删掉，于是现在的 write 函数变为</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code>func <span class="token function">write</span><span class="token punctuation">(</span>user <span class="token class-name">User</span><span class="token punctuation">)</span> error <span class="token punctuation">{</span>
    <span class="token class-name"><span class="token namespace">redisService<span class="token punctuation">.</span></span>DeleteCache</span><span class="token punctuation">(</span><span class="token class-name"><span class="token namespace">user<span class="token punctuation">.</span></span>GetId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">:</span><span class="token operator">=</span> <span class="token class-name"><span class="token namespace">userService<span class="token punctuation">.</span></span>StoreUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> nil <span class="token punctuation">{</span>
        <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> nil
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>这样，再读的时候，缓存将命中不了，用户 2 会从 MySQL 中拿到最新的数据</p> <h4 id="延时双删"><a href="#延时双删" class="header-anchor">#</a> 延时双删</h4> <p>OK，看起来非常完美，但马上又会出现问题，众所周知，写是需要时间的，假设</p> <ol><li>用户 A 在写这条数据（刚删完缓存，还没写入），此时用户 B 来读这条数据（因为没有缓存，会直接命中 DB），按照 read 流程，会把上个版本的数据写入缓存</li> <li>由于写时的删除已经执行过了，而且现在缓存里有数据，以后的每次读，都会读到上个版本的脏数据</li></ol> <p>于是又发生了第一个场景中的问题，读操作将始终命中缓存，返回脏数据。所以很自然的，提出了一个“双删”的办法，简单来说，就是在写之前删一次缓存，写之后再删一次缓存，这样无论其他并发怎么写缓存，脏数据的缓存都会被删掉</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token function">write</span><span class="token punctuation">(</span>user User<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    redisService<span class="token punctuation">.</span><span class="token function">DeleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">GetId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">:=</span> userService<span class="token punctuation">.</span><span class="token function">StoreUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>
    <span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">1</span><span class="token punctuation">)</span>
    redisService<span class="token punctuation">.</span><span class="token function">DeleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">GetId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token keyword">return</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>可以注意到这里 sleep 了 1 秒，这是因为在后端，我无法判断 MySQL “到底写完没”，所以只能采取简单的线程等待，再去执行删除</p> <ul><li>sleep 的时间实际上取决于“完成写事务”的时间，因为第二次删除是防止从“开始写”到“写完”这段时间的读取，将 MVCC 上一版本的脏数据缓存到 Redis</li></ul> <p>有个问题，我都延时删缓存了，为什么不直接去更新缓存，这样能保证下次命中还不用等？</p> <ul><li>很简单，这和缓存的逻辑严重不符，这样做的结果就是，每次写都会同步写缓存，读写对于 Redis 都变成了增量操作，相当于把 MySQL 整个搬到 Redis 里，那我为什么不直接用 Redis 存，脑瘫了</li></ul> <p>但这样的同步等待，对于高并发场景显然是极大的负担</p> <h4 id="binlog-异步双删"><a href="#binlog-异步双删" class="header-anchor">#</a> Binlog 异步双删</h4> <blockquote><p>Binlog 是 MySQL 的操作日志</p></blockquote> <p>既然同步阻塞不行，我们可以考虑异步删除</p> <ul><li>MySQL 的 Binlog（二进制日志）记录了数据库的所有数据变更操作（如 INSERT、UPDATE 和 DELETE），对数据恢复、主从复制和审计非常重要</li></ul> <p>查看 Binlog 文件</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SHOW</span> MASTER <span class="token keyword">STATUS</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>每当写操作之后，通过查看解析 Binlog 内容，将删除缓存的事件通过 MQ 发布，消费者 Comsumer 对相应的缓存进行删除，也就是说，双删的第二次删，通过 Binlog 事件驱动 MQ 消费者异步处理</p> <p>这样，在我的后端，每次写之后，进行一条消息推送，然后正常返回即可</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">try</span><span class="token punctuation">{</span>
    <span class="token comment">// 删缓存</span>
    redisService<span class="token punctuation">.</span><span class="token function">deleteCache</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 写数据库</span>
    userService<span class="token punctuation">.</span><span class="token function">writeUser</span><span class="token punctuation">(</span>user<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 推送第二次删除</span>
    rabbitMqService<span class="token punctuation">.</span><span class="token function">pushDeleteCacheEvent</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token boolean">true</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">Exception</span> e<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">throw</span> <span class="token keyword">new</span> <span class="token class-name">WriteSqlException</span><span class="token punctuation">(</span>e<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>一个题外话，try - catch - finally 的执行顺序</p> <ul><li>try 中无异常，则 try → finally</li> <li>try 中有异常，则 try → catch → finally</li> <li>try 中无异常但有 return 语句，则 try → finally → return</li> <li>try 中有异常且有 return 语句，则 try → catch → finally → return</li> <li>try 中有异常且有 return 语句，catch 中有 throw 语句，则 try → catch → finally → throw</li></ul> <p>所以不会在 finally 中 return，只是做资源关闭等操作</p> <h3 id="读写分离和水平分表"><a href="#读写分离和水平分表" class="header-anchor">#</a> 读写分离和水平分表</h3> <ul><li>文库服务端的数据库读写分离架构：主库写，从库读，写操作统一走 mq 解耦进行削峰</li> <li>水平分表：对 uid 哈希取模，决定其落在哪张表，在读表前同样进行取模确定表再进行读取</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4feb0e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Linux 基础</div></a> <a href="/pages/d7c3d3/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Docker 基础</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
