<span class="token function">service</span> mysqld restart
<span class="token function">service</span> mysql restart <span class="token comment"># 某些版本</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>启动命令行客户端：<code>mysql -u root -p</code></p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token comment">#本地机</span>
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#远端机</span>
mysql <span class="token parameter variable">-h</span> <span class="token function">ip</span> <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>

<span class="token comment">#再输入密码即可登录命令行客户端</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>Manjaro 中安装并配置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql

<span class="token comment"># 设置开机启动MySQL服务</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>可视化工具</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> mysql-workbench
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="库操作与表引擎"><a href="#库操作与表引擎" class="header-anchor">#</a> 库操作与表引擎</h3> <p>创建数据库：<code>create database database_name;</code></p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code>mysql<span class="token operator">&gt;</span> <span class="token keyword">create</span> <span class="token keyword">database</span> Book<span class="token punctuation">;</span>

Query OK<span class="token punctuation">,</span> <span class="token number">1</span> <span class="token keyword">row</span> affected <span class="token punctuation">(</span><span class="token number">0.01</span> sec<span class="token punctuation">)</span>xxxxxxxxxx creat <span class="token keyword">database</span> Book<span class="token punctuation">;</span>mysql<span class="token operator">&gt;</span> <span class="token keyword">create</span> <span class="token keyword">database</span> Book<span class="token punctuation">;</span>Query OK<span class="token punctuation">,</span> <span class="token number">1</span> <span class="token keyword">row</span> affected <span class="token punctuation">(</span><span class="token number">0.01</span> sec<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>删库</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token operator">is</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

<span class="token keyword">show</span> <span class="token keyword">create</span> <span class="token keyword">database</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span> <span class="token comment">#显示创建school的sql语句</span>

<span class="token keyword">use</span> school<span class="token punctuation">;</span>

<span class="token keyword">drop</span> <span class="token keyword">database</span> <span class="token keyword">if</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>school<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>数据表引擎</p> <table><thead><tr><th>区别</th> <th>MyISAM</th> <th>InnoDB</th></tr></thead> <tbody><tr><td>事务支持</td> <td>不支持</td> <td>支持</td></tr> <tr><td>外键约束</td> <td>不支持</td> <td>支持</td></tr> <tr><td>全文索引</td> <td>支持</td> <td>不支持</td></tr> <tr><td>数据行锁定</td> <td>不支持</td> <td>支持</td></tr> <tr><td>表空间大小</td> <td>较小</td> <td>较大，约为前者两倍</td></tr></tbody></table> <p>简单来说</p> <ul><li>MyISAM 更轻便（节约空间）、更快</li> <li>InnoDB 安全性高，支持事务处理，支持多表多用户操作（外键、多行同时操作），功能更丰富</li></ul> <p>数据库的本质仍是文件存储，储存在 data 文件夹下，一个文件夹对应一个数据库</p> <p>MySQL 引擎在物理文件上的区别</p> <ul><li>InnoDB 中数据库表中只有一个<code>*.frm</code>以及上级目录下的<code>ibdata1</code>文件</li> <li>MyISAM 对应的文件
<ul><li>*.frm 表结构的定义文件</li> <li>*.MYD 数据文件（data）</li> <li>*.MYI 索引文件</li></ul></li></ul> <p>表默认的字符集编码并不支持中文，要手动设置</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">default</span> <span class="token keyword">charset</span><span class="token operator">=</span>utf8
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="数据表操作"><a href="#数据表操作" class="header-anchor">#</a> 数据表操作</h3> <p>建表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment"># 进入数据库</span>
mysql<span class="token operator">&gt;</span> <span class="token keyword">use</span> Book
<span class="token keyword">Database</span> changed

<span class="token comment"># 建表</span>
mysql<span class="token operator">&gt;</span> <span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> bookList<span class="token punctuation">(</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> ISBN <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token operator">not</span> <span class="token boolean">null</span> <span class="token punctuation">,</span>
    <span class="token operator">-</span><span class="token operator">&gt;</span> name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">100</span><span class="token punctuation">)</span> <span class="token keyword">CHARACTER</span> <span class="token keyword">SET</span> gb2312<span class="token punctuation">,</span>

    <span class="token operator">-</span><span class="token operator">&gt;</span> <span class="token punctuation">)</span><span class="token punctuation">;</span>
Query OK<span class="token punctuation">,</span> <span class="token number">0</span> <span class="token keyword">rows</span> affected <span class="token punctuation">(</span><span class="token number">0.02</span> sec<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>列属性</p> <ol><li><code>unsigned</code>：无符号整数，该数据必不为负</li> <li><code>zerofill</code>：0 填充，十位数将从前往后填充<code>0</code>，如<code>312 ——&gt; 0000000312</code></li> <li><code>auto_increment</code>：自增，可自定义设置起始值和步长</li> <li><code>not null</code>：非空，默认为可空</li> <li><code>default</code>：设置默认值</li> <li><code>comment</code>：解释</li></ol> <p>查看数据表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token keyword">if</span> <span class="token operator">not</span> <span class="token keyword">exists</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">(</span>

<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">innodb</span> <span class="token keyword">default</span> <span class="token keyword">charset</span> <span class="token operator">=</span> utf8<span class="token punctuation">;</span>

<span class="token keyword">desc</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>修改表属性</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">#修改表名</span>
<span class="token keyword">alter</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>student<span class="token punctuation">`</span></span> <span class="token keyword">rename</span> <span class="token identifier"><span class="token punctuation">`</span>teacher<span class="token punctuation">`</span></span><span class="token punctuation">;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>导入 .sql 文件中的 SQL 语句：<code>sourse + 文件路径</code></p> <p>删除数据库或表</p> <ol><li><code>drop database + 库名;</code></li> <li><code>drop table + 表名;</code></li></ol> <p>图形界面管理</p> <ul><li>SQLyog</li> <li>IDEA 自带的数据库管理</li> <li>DataGrip</li></ul> <h3 id="orm-框架"><a href="#orm-框架" class="header-anchor">#</a> ORM 框架</h3> <p>ORM（Object-Relational Mapping），对象关系映射框架，用对象映射关系代替 SQL 语句编写</p> <ul><li>Spring Data 内置了 Java 的 ORM，例如 JPA，可见 <a href="https://northboat.github.io/pages/2d1368/#spring-date" target="_blank" rel="nofollow noopener noreferrer">Spring Boot 基础 - Spring Data | Northboat<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，或者熟知 MyBatis（使用 xml 作为 SQL 的载体）</li> <li>Golang 而言，基本上就是 GORM，采用的是和 JPA 类似的“参数化查询”，可以在一定程度上避免拼接 SQL 带来的注入风险</li></ul> <p>一个超绝 SQL 示例，狠狠的 left join</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// GetQueueList ...</span>
<span class="token keyword">func</span> <span class="token function">GetQueueList</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> db <span class="token operator">*</span>database<span class="token punctuation">.</span>GormDb<span class="token punctuation">,</span> queueType <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        rows<span class="token punctuation">,</span> err <span class="token operator">:=</span> db<span class="token punctuation">.</span><span class="token function">Table</span><span class="token punctuation">(</span><span class="token string">&quot;environmentQueue&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Joins</span><span class="token punctuation">(</span><span class="token string">&quot;left join userInfo on environmentQueue.username = userInfo.username&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Joins</span><span class="token punctuation">(</span><span class="token string">&quot;inner join devEnvironmentInstance on environmentQueue.envId = devEnvironmentInstance.uid&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Where</span><span class="token punctuation">(</span><span class="token string">&quot;queueType = ? and environmentQueue.status = ? and devEnvironmentInstance.status in (?)&quot;</span><span class="token punctuation">,</span>
                        queueType<span class="token punctuation">,</span> <span class="token string">&quot;active&quot;</span><span class="token punctuation">,</span> <span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token builtin">string</span><span class="token punctuation">{</span><span class="token string">&quot;queuing&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;queue_start&quot;</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Order</span><span class="token punctuation">(</span><span class="token string">&quot;environmentQueue.priority desc, environmentQueue.createdAt asc&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>
                <span class="token function">Select</span><span class="token punctuation">(</span><span class="token string">`environmentQueue.uid, environmentQueue.username, environmentQueue.EnvId, 
                                           environmentQueue.QueueType, environmentQueue.CreatedAt, environmentQueue.UpdatedAt, 
                                        environmentQueue.status, environmentQueue.action, environmentQueue.params, userInfo.groupId,
                                        userInfo.groupName, devEnvironmentInstance.envConfigTypeId, environmentQueue.priority, 
                                        devEnvironmentInstance.status, devEnvironmentInstance.region`</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Rows</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询gpu队列失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
                <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
        <span class="token punctuation">}</span>

        queueList <span class="token operator">:=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token punctuation">[</span><span class="token punctuation">]</span><span class="token operator">*</span>EnvironmentQueue<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span>
        <span class="token keyword">for</span> rows<span class="token punctuation">.</span><span class="token function">Next</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                <span class="token keyword">var</span> groupId sql<span class="token punctuation">.</span>NullInt32
                <span class="token keyword">var</span> groupName sql<span class="token punctuation">.</span>NullString
                item <span class="token operator">:=</span> <span class="token operator">&amp;</span>EnvironmentQueue<span class="token punctuation">{</span><span class="token punctuation">}</span>
                <span class="token keyword">if</span> err <span class="token operator">=</span> rows<span class="token punctuation">.</span><span class="token function">Scan</span><span class="token punctuation">(</span><span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Uid<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Username<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvId<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>QueueType<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>CreatedAt<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>UpdatedAt<span class="token punctuation">,</span>
                        <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Status<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Action<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Params<span class="token punctuation">,</span> <span class="token operator">&amp;</span>groupId<span class="token punctuation">,</span> <span class="token operator">&amp;</span>groupName<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvConfigTypeId<span class="token punctuation">,</span>
                        <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Priority<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>EnvStatus<span class="token punctuation">,</span> <span class="token operator">&amp;</span>item<span class="token punctuation">.</span>Region<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
                        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;查询gpu队列失败, err: %+v&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
                        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
                <span class="token punctuation">}</span>
                item<span class="token punctuation">.</span>GroupId <span class="token operator">=</span> groupId<span class="token punctuation">.</span>Int32
                item<span class="token punctuation">.</span>GroupName <span class="token operator">=</span> groupName<span class="token punctuation">.</span>String
                queueList <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>queueList<span class="token punctuation">,</span> item<span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> queueList<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br></div></div><h3 id="轻量关系数据库"><a href="#轻量关系数据库" class="header-anchor">#</a> 轻量关系数据库</h3> <blockquote><p>H2DB 和 SQLite</p></blockquote> <p>H2DB：h2db 是纯 Java 编写的开源内存数据库，其源码都打包在 jar 文件中，目前稳定的最新版本 h2-1.4.196.jar 只有 1.8M 左右，提供一个运行在内存中的关系型数据库，可用于本地工具数据源和做本地缓存（客户端或插件开发）</p> <ul><li><a href="http://www.h2database.com/html/download.html" target="_blank" rel="nofollow noopener noreferrer">官网下载 | Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://juejin.cn/post/6844903625039282183" target="_blank" rel="nofollow noopener noreferrer">h2db 新手入门篇 - 概念及初步使用 - 掘金<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>h2db 有三种工作方式，无论在哪种模式，h2db 都支持都支持持久（persistence）和内存临时数据库（in-memory）</p> <ul><li>嵌入式模式：H2DB 作为应用的一部分，DB Server 和应用运行在一个进程，应用关闭，H2DB 也同时关闭</li> <li>服务器模式：传统的 Server 模式，用户通过客户端连接 H2DB Server，需使用网络协议（web server 模式、TCP server 模式，PostgreSQL Client 模式）</li> <li>混合模式（Mix Mode）：允许嵌入式模式下的 H2DB 被其他应用的 Client 连接，同时作为本地 Server 和远程 Server（磨盘拉飞了）</li></ul> <p>在服务器模式下，数据要通过 TCP/IP 相关协议完成传输，效率可能低于嵌入模式</p> <img src="/assets/img/h2db-mixed-mode.e973d97b.png"> <p>SQLite 更加为人熟知，这是一个由 C 编写的轻量关系数据库，微信的本地消息存储好像就用的这玩意儿，沟槽的 30GB 聊天记录</p> <ul><li><a href="https://sqlite.org/index.html" target="_blank" rel="nofollow noopener noreferrer">SQLite Home Page<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/sqlite/sqlite" target="_blank" rel="nofollow noopener noreferrer">GitHub - sqlite/sqlite: Official Git mirror of the SQLite source tree · GitHub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.runoob.com/sqlite/sqlite-tutorial.html" target="_blank" rel="nofollow noopener noreferrer">SQLite 教程 | 菜鸟教程<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="mysql-索引"><a href="#mysql-索引" class="header-anchor">#</a> MySQL 索引</h2> <h3 id="b-树索引结构"><a href="#b-树索引结构" class="header-anchor">#</a> B+ 树索引结构</h3> <blockquote><p>为什么数据库索引选择 B+ 树，而不是相似的 B 树，或者是 CRUD 效率均为 O(n) 的红黑树，又或者 LSM-Tree</p></blockquote> <p>为什么选择 B+ 树而不选择 B 树？</p> <p>首先要明确的是，B 树和 B+ 树一样，都是一个多路平衡查找树</p> <ul><li>多路即多叉树；平衡意味着叶子节点都在同一层，保证查询的平衡性</li></ul> <p>B+ 树和 B 树的不同点在于，B 树的每个节点既存储用于分路的索引，又存储当前索引对应的数据记录，即，每个索引对应的位置，同时存储了其对应的数据记录</p> <img src="/assets/img/image-20260303112420296.c00d44b3.png"> <p>这会造成数据过于分散，例如我要查询索引区间在 20-70 的数据，B 树必须遍历这个树，才能得到结果</p> <p>B+ 树做了极为聪明的处理</p> <ul><li>他不在中间节点存储数据，而只存储索引，所有的数据都堆积在叶子节点，由于多路平衡，实际上数据都堆积在底层</li> <li>令叶子节点在物理上尽量连续存储，契合磁盘按页读取特性</li> <li>在叶子节点那一层，每个节点之间增加双向指针</li></ul> <img src="/assets/img/image-20260303171448627.339d68c0.png"> <p>于是同样范围查询 3-20 的数据，B+ 树只需要找到起始点 3，然后一路向后遍历即可，并且由于磁盘上的连续，这样的遍历几近于一个数组遍历</p> <p>红黑树为什么不适用于数据库？很简单，因为是二叉树，不适合大量数据存储</p> <p>那 LSM-Tree 呢？这是一种面向写密集型场景的存储结构，其思路是，先写内存，在异步刷进磁盘并合并</p> <ul><li>写入时，先写入内存中的 MemTable（基于红黑树实现的有序结构），达到阈值后刷盘为 SSTable（有序的磁盘文件）</li> <li>多个 SSTable 后台异步合并，仍然保持有序性</li> <li>查询时需要遍历 MemTable 和 SSTable，统一合并结果返回</li></ul> <p>读性能太弱了</p> <h3 id="主键和外键"><a href="#主键和外键" class="header-anchor">#</a> 主键和外键</h3> <blockquote><p>主键即：聚集索引</p></blockquote> <p>在 InnoDB 里，每个数据表必须要有且只有一个聚集索引（主键索引），其规则如下</p> <ol><li>如果定义了主键 PK，则 PK 是聚集索引</li> <li>若未定义主键，则第一个非空唯一索引将默认作为聚集索引</li> <li>若既无主键，也无非空唯一字段，则 InnoDB 会创建一个隐藏的 row-id 作为聚集索引</li></ol> <p>例如下面这张表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>id 这一字段作为聚集索引，而 name 字段作为一个普通索引</p> <p>外键：通过某一字段关联两张数据表，提供结构化的约束</p> <ul><li>优点：由数据库自身保证数据的一致性和完整性，比程序更可靠，增加 ER 图的可读性，帮助理解数据库设计</li> <li>缺点：增加开发难度，使数据管理变得复杂，影响性能，特别是在处理大量数据时</li></ul> <p>例如，将用户表 user 与判题记录表通过 userId 这一外键关联</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>
    id <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span> 
    name <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">16</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    role <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">8</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">index</span> <span class="token punctuation">(</span>name<span class="token punctuation">)</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>

<span class="token keyword">CREATE</span> <span class="token keyword">TABLE</span> record<span class="token punctuation">(</span>
    recordId <span class="token keyword">int</span> <span class="token keyword">primary</span> <span class="token keyword">key</span><span class="token punctuation">,</span>
    userId <span class="token keyword">int</span><span class="token punctuation">,</span>
    questionId <span class="token keyword">int</span><span class="token punctuation">,</span>
    state <span class="token keyword">int</span><span class="token punctuation">,</span>
    <span class="token keyword">describe</span> <span class="token keyword">varchar</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span><span class="token punctuation">,</span>
    <span class="token keyword">FOREIGN</span> <span class="token keyword">KEY</span> <span class="token punctuation">(</span>userId<span class="token punctuation">)</span> <span class="token keyword">REFERENCES</span> <span class="token identifier"><span class="token punctuation">`</span>user<span class="token punctuation">`</span></span><span class="token punctuation">(</span>id<span class="token punctuation">)</span><span class="token punctuation">,</span>
<span class="token punctuation">)</span><span class="token keyword">engine</span> <span class="token operator">=</span> <span class="token keyword">InnoDB</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>这样，record 这张表的 userId 将依赖于 user 表的 id 字段，也就是说，每一个在 record 中出现的记录，其 userId 必然是 user 中的某一个已存在的值，那么</p> <ul><li>在删除 user 表中某一个用户时，数据库会先把 record 中所有外键依赖了这个用户的所有记录先删除，再会从主表中删除用户</li> <li>从表 record 不会出现“永陵数据”，每个 userId 都一定是 user 中存在的</li></ul> <p>外键的本质是：是数据一致性约束，而不是查询机制</p> <h3 id="uuid-设计"><a href="#uuid-设计" class="header-anchor">#</a> UUID 设计</h3> <p>如何实现分布式场景下 UUID？分布式的 UUID 要保证唯一性有两层含义</p> <ul><li>单点的 DB 主键一定要保证唯一且有序（方便建索引）</li> <li>多点的 DB，每个 DB 的主键在全局中要保证唯一，在分布式系统中，由于存在地域之间的 DTS（Data Transport Service），数据会在多个地域之间进行相互同步，若不同地域的数据库表的主键不是全局唯一的，DTS 合并会报错</li></ul> <p>答案是雪花算法，共 64 位，首位是固定值，中间 41 位是时间戳，10 位机器码，12 位 ID 分配</p> <ul><li><a href="https://cloud.tencent.com/developer/article/2364487" target="_blank" rel="nofollow noopener noreferrer">一文读懂“Snowflake（雪花）”算法-腾讯云开发者社区-腾讯云<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在一个毫秒戳，可以分配 12 位的 ID 数量，当分配满了，就等一个毫秒再分配</p> <ul><li>ID 按时间戳呈递增分布，B+ 树好建索引</li> <li>唯一性取决于时间戳，这和服务器时钟有关</li> <li>可以通过 10 位的机器码区分不同集群不同机器</li></ul> <p>雪花依赖于时间的一致性，如果发生时间回拨，可能会导致一致性问题，但其实概率很低，如果非要避免这种情况，百度有现成的增强型雪花算法：<a href="https://github.com/baidu/uid-generator" target="_blank" rel="nofollow noopener noreferrer">baidu/uid-generator: UniqueID generator<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>当然，没有到亿级流量的真实工程化实践是：用 <code>varchar(45)</code> 存放 UUID，用表名 + 雪花算法 ID 构成</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="39.002ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 17238.7 910" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.464ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1055.8,0)"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 3
