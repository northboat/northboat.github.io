LBAGe2Rzui9Ybjz7XUppz1/uKBbyVPGkN3ZAeC6hr0x7Nr38N5+EqkoOm17xpoqR9ohQF55ERSvr4Dkr3chNfC3DMzGJlNBElW8w9nsGQvhNGIzDkXzCg8cLK951xHsFBlTJspJNi3ZFIMF2AeDV3q8DNOB+YHi6QTrChDIWDBRi5U5f+ZMfJLu3ccrqxtdxk4SKH336LFxSmkqefwU5T8fhdSdQf9IVKD6aNiwI/hnmcAZ91isYMJIaCUCx9W098+LgruikeTqzqqxKPUwqJyCPJiyemVVZBOijDGjD38Os0jOiSPL1z3SPjXNANbiNPXAdzTfukjjuknNBbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">总线与 CPU 系统<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="计算机系统组成"><a href="#计算机系统组成" class="header-anchor">#</a> 计算机系统组成</h2> <h3 id="硬件、软件系统"><a href="#硬件、软件系统" class="header-anchor">#</a> 硬件、软件系统</h3> <p>硬件系统和软件系统共同构成计算机系统，硬件是基础，软件是发挥硬件的条件</p> <p>硬件系统主要包括：CPU、存储器、输入/输出控制系统</p> <p>软件系统</p> <ul><li>系统软件：提供无差别服务，如操作系统、实用程序、编译程序等</li> <li>应用软件：不关心，赚钱捏</li></ul> <p>硬件和软件具有逻辑等价性，即软件能完成的工作硬件也能完成，反之亦然。硬件实现更快，软件的迭代、修改更方便</p> <h3 id="语言级别"><a href="#语言级别" class="header-anchor">#</a> 语言级别</h3> <p>机器语言：代码效率高，执行速度快，硬件可直接执行，可读性差，不易变成，不易维护</p> <p>汇编语言：可读性较好（助记符），出错便于检查和修改。可移植性差，对程序员要求高，必须十分熟悉计算机硬件结构的配置、指令系统和寻址方式低级语言</p> <ul><li>也叫低级语言</li></ul> <p>高级语言：接近于自然语言，容易理解和掌握，与硬件无关。效率低，执行速度慢</p> <ul><li>解释型语言：python、js，一行行处理（line by line），一步到位</li> <li>编译型语言：java、c、c++，需要编译器，编译得到目标代码，经过链接器形成链接模块，最后转化成机器语言</li></ul> <h3 id="计算机系统层次结构"><a href="#计算机系统层次结构" class="header-anchor">#</a> 计算机系统层次结构</h3> <h4 id="划分层次结构"><a href="#划分层次结构" class="header-anchor">#</a> 划分层次结构</h4> <ul><li>第 0 级机器：完全由硬件组成，是机器的硬件核心</li> <li>第 1 级机器：根据指令操作所需的控制时序，利用微指令编出的微程序控制数据在寄存器之间传送</li> <li>第 2 级机器：能运行机器语言的机器，程序员可以在其上编写机器语言程序利用第 1 级的微程序进行解释并运行</li> <li>第 3 级机器：操作系统机器</li> <li>第 4 级机器：汇编语言机器</li> <li>第 5 级机器：高级语言机器</li> <li>第 6 级机器：应用语言机器</li></ul> <h4 id="划分层次的意义"><a href="#划分层次的意义" class="header-anchor">#</a> 划分层次的意义</h4> <p>解耦计算机功能，硬件做下级，软件做上级</p> <h3 id="冯诺依曼计算机"><a href="#冯诺依曼计算机" class="header-anchor">#</a> 冯诺依曼计算机</h3> <h4 id="存储程序思想"><a href="#存储程序思想" class="header-anchor">#</a> 存储程序思想</h4> <p>第一台通用计算机 ENIAC 出现于1946年情人节，每秒 5000 次运算，占地 150 平米</p> <p>冯诺依曼提出存储程序的思想，把程序和数据不加区别的对待，从内存中读数据，都存放在存储器中</p> <p>并将计算机分成5部分：运算器、控制器、存储器、输入设备、输出设备</p> <h4 id="冯诺依曼计算机-2"><a href="#冯诺依曼计算机-2" class="header-anchor">#</a> 冯诺依曼计算机</h4> <p>根据存储程序的概念和二进制原理设计的电子计算机统称为“冯诺依曼型结构”计算机，特点如下</p> <ul><li>由五部分构成</li> <li>程序、数据都在存储器中</li> <li>数据以二进制表示</li> <li>指令由操作码和地址码组成</li> <li>指令在存储器中按执行顺序存放，并能自动执行</li></ul> <p>二进制简单、二进制稳态器好做，逻辑门电路实现逻辑运算简单</p> <p>冯诺依曼计算机属于指令流驱动控制，并且属于串行结构，单指令流单数据流</p> <p>早期，冯计算机以运算器为中心；现代计算机以寄存器为中心</p> <h4 id="计算机的硬件组成"><a href="#计算机的硬件组成" class="header-anchor">#</a> 计算机的硬件组成</h4> <p>输入设备</p> <p>存储器：用以存放程序和数据，分为内存和外存，CPU只直接读取内存</p> <ul><li>按地址进行存取，参考汇编</li> <li>每个存储单元的大小取决于编址方式</li></ul> <p>编址方式</p> <ul><li>比特，存 1/0</li> <li>字节，存 8 个 bit</li> <li>字，也叫 word，往往等于 n 倍的 B，即包含多个字节</li></ul> <p>这里的字节和字我们称作编址单元，为什么编制单元是字或者字节？</p> <p>买鸡蛋</p> <ul><li>买200个，按个数</li> <li>买2000个，按盘数</li> <li>买20000个，按箱数</li></ul> <p>计数单位越大，计数次数越少</p> <p>寻址时，回去地址寄存器 MAR 去找地址，若存储单位大，地址数量少，MAR 负担就小，反之 MAR 就要大</p> <p>输出设备</p> <p>运算器：执行部件，算数逻辑单元</p> <p>控制器</p> <h4 id="指令执行过程"><a href="#指令执行过程" class="header-anchor">#</a> 指令执行过程</h4> <p>取指令：从内存中寻址取出</p> <p>分析指令：译码阶段</p> <p>访存取数阶段：根据指令取出相应数据</p> <p>执行指令：对数据进行相应操作并得到结果</p> <p>结果写回阶段</p> <h3 id="计算机性能指标"><a href="#计算机性能指标" class="header-anchor">#</a> 计算机性能指标</h3> <h4 id="吞吐率"><a href="#吞吐率" class="header-anchor">#</a> 吞吐率</h4> <p>单位时间内处理请求的数量</p> <h4 id="响应时间"><a href="#响应时间" class="header-anchor">#</a> 响应时间</h4> <p>给了一个请求以后，多久后能响应</p> <h4 id="cpu-时钟周期"><a href="#cpu-时钟周期" class="header-anchor">#</a> CPU 时钟周期</h4> <p>主频的倒数，就是主频振动一个来回经历的时间，CPU最小的时间单位，每个动作至少需要一个时钟周期</p> <h4 id="主频"><a href="#主频" class="header-anchor">#</a> 主频</h4> <p>由硬件决定，时间实际是一种约定（跨年的时候会停一秒左右校正），计算机只能通过石英单晶体的振动来计时，而主频实际上就是振动的频率。也可以理解为每秒中时间周期的个数</p> <p>主频变高，时钟周期一定会变小，但时钟周期数CPI一定会变多，完成一件事的时间为：事的数量 x 时钟周期数 x 时钟周期</p> <p>他们是矛盾的，需要结合场景计算</p> <h4 id="cpi"><a href="#cpi" class="header-anchor">#</a> CPI</h4> <p>执行一条指令所需的时钟周期数</p> <h4 id="cpu-执行时间"><a href="#cpu-执行时间" class="header-anchor">#</a> CPU 执行时间</h4> <p>CPU 执行一个程序所花时间</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="31.237ex" height="4.724ex" role="img" focusable="false" viewBox="0 -1381 13806.9 2088" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-1.6ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z" style="stroke-width:3;"></path></g><g data-mml-node="TeXAtom" transform="translate(617,-150) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z" style="st 510T379 495Q356 495 341 509T326 548Q326 592 373 601Q351 623 311 626Q240 626 194 566Q147 500 147 364L148 360Q153 366 156 373Q197 433 263 433H267Q313 433 348 414Q372 400 396 374T435 317Q456 268 456 210V192Q456 169 451 149Q440 90 387 34T253 -22Q225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" style="stroke-width:3;"></path></g></g></g><rect width="6069.6" height="60" x="120" y="220"></rect></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>M</mi><mi>I</mi><mi>P</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mi>l</mi><mi>n</mi></mrow><mrow><msub><mi>T</mi><mrow data-mjx-texclass="ORD"><mi>c</mi><mi>p</mi><mi>u</mi></mrow></msub><mo>⋅</mo><msup><mn>10</mn><mn>6</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mi>C</mi><mi>P</mi><mi>I</mi><mo>⋅</mo><msub><mi>T</mi><mi>c</mi></msub><mo>⋅</mo><msup><mn>10</mn><mn>6</mn></msup></mrow></mfrac></math></mjx-assistive-mml></mjx-container><ul><li>带入 Tcpu 的公式</li> <li>MIPS 用于评价标量机</li> <li>MFLOPS = 浮点操作次数 / (执行时间 x 10^6)</li></ul> <p>适用于衡量向量机</p> <h3 id="计算机体系和并行系统"><a href="#计算机体系和并行系统" class="header-anchor">#</a> 计算机体系和并行系统</h3> <h4 id="计算机的体系结构"><a href="#计算机的体系结构" class="header-anchor">#</a> 计算机的体系结构</h4> <p>Flynn 分类法，将计算机划分成四种基本类型，M(multi)指多，S指单(single)</p> <ul><li>SISD：单指令流单数据流，完全的串行，冯诺依曼机</li> <li>MIMD：多指令流多数据流，同时执行多个指令流，指令流可以在单个时钟周期处理多个数据，一定是多核心</li> <li>SIMD：单指令流多数据流，现在的单核计算机基本属于该类，能够在单时钟周期内处理多个数据</li> <li>MISD：多指令流单数据流，鬼畜</li></ul> <h4 id="多核处理器"><a href="#多核处理器" class="header-anchor">#</a> 多核处理器</h4> <p>每个CPU是一个独立的处理器，可以有自己独立的cache，也可以共享cache</p> <h4 id="smp-系统结构"><a href="#smp-系统结构" class="header-anchor">#</a> SMP 系统结构</h4> <p>对称多处理器技术，单处理器同时只能处理一个线程，若多线程，CPU数量必须达到多个，SMP技术使得多个CPU可以同时工作</p> <p>各处理器之间的关系完全对等，共享相同的物理内存</p> <p>但要注意并不是核越多越好，一味增加内存冲突加剧且CPU浪费增加，SMP利用率最好的情况是2-4个CPU</p> <ul><li>松耦合的多处理技术：早期分布式的雏形</li> <li>紧耦合的多处理技术</li> <li>对称多处理技术</li></ul> <h2 id="总线系统"><a href="#总线系统" class="header-anchor">#</a> 总线系统</h2> <h3 id="总线概念与分类"><a href="#总线概念与分类" class="header-anchor">#</a> 总线概念与分类</h3> <p>冯的计算机各个部件并没有设计在同一区域，于是就涉及到了各部件的通信问题</p> <ul><li>总线：为计算机各模块之间和模块内部传输信息的公共通道，半双工通道，同一时间只能单向通行</li> <li>总线主模块：工作于主控方式，主动发起的一方，控制和管理数据传送</li> <li>总线从模块：工作于受控方式，只能在主模块的控制下完成操作</li> <li>总线仲裁：当多个部件同时想在同一条总线上传输数据时，需要通过仲裁结构控制各部件传输的先后顺序</li> <li>总线宽度：一次总线操作中总线传输的数据位数</li> <li>总线周期：一次总线操作所需时间</li> <li>总线频率：总线的工作频率，每秒钟可以传输数据的次数，单位是 MHz</li> <li>总线带宽：单位时间内总线上可以传输的数据量，单位为 MB/s</li></ul> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="51.515ex" height="5.285ex" role="img" focusable="false" viewBox="0 -1426 22769.6 2336" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.059ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">总</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">带</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">宽</text></g><g data-mml-node="mo" transform="translate( ode="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">宽</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">度</text></g><g data-mml-node="mo" transform="translate(4222.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(5222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">总</text></g><g data-mml-node="mi" transform="translate(6222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(7222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">工</text></g><g data-mml-node="mi" transform="translate(8222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">作</text></g><g data-mml-node="mi" transform="translate(9222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">频</text></g><g data-mml-node="mi" transform="translate(10222.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">率</text></g></g><g data-mml-node="mn" transform="translate(5581.2,-686)"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z" style="stroke-width:3;"></path></g><rect width="11422.4" height="60" x="120" y="220"></rect></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">带</mi><mi mathvariant="normal">宽</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">数</mi><mi mathvariant="normal">据</mi><mi mathvariant="normal">量</mi></mrow><mrow><mi mathvariant="normal">传</mi><mi mathvariant="normal">输</mi><mi mathvariant="normal">时</mi><mi mathvariant="normal">间</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">宽</mi><mi mathvariant="normal">度</mi><mo>×</mo><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">工</mi><mi mathvariant="normal">作</mi><mi mathvariant="normal">频</mi><mi mathvariant="normal">率</mi></mrow><mn>8</mn></mfrac></math></mjx-assistive-mml></mjx-container><p>其中总线工作频率即为：1 / 总线工作周期</p> <ul><li>总线定时：指事件出现在总线上的时序关系</li> <li>总线标准：大纲已无，就是总线在传输时必须遵守的一些规范</li> <li>波特率：每秒钟传输的二进制数据的位数</li> <li>比特率：单位时间内传输的二进制有效数据的位数（只包含数据，不包括控制信息）</li></ul> <img src="/assets/img/20221012175238.7c1ffb15.png"> <p>总线分类：按传输内容的不同，可分为</p> <ul><li>地址总线：CPU 发往 IO 或内存</li> <li>数据总线：CPU 和内存、IO 双向通信，传输数据、指令</li> <li>控制总线：分时双向通信，CPU 发往内存叫做控制信号，其他部件发给 CPU 的叫做反馈信号</li></ul> <p>栗子一</p> <img src="/assets/img/2022-10-12_13-50-16.a7588e6d.png"> <p>栗子二</p> <img src="/assets/img/2022-10-12_13-54-15.c3fff613.png"> <p>根据数据传输方式，可分为</p> <ul><li>并行总线：可以同时传递多位</li> <li>串行总线：相当于总线宽度为 1，只有一条线路，适合长距离通信（计算机网络构成常用串行）</li></ul> <p>根据总线位置，可分为</p> <ul><li>CPU 内部总线：位于 CPU 内部，在 CPU 内各寄存器、ALU 之间传递数据，又叫片内总线</li> <li>系统总线：计算机熊内部各功能部件之间相互连接的总线，也叫内总线</li> <li>通信总线：计算机系统之间的通信总线，比如计算机网络，比如握手应答信号</li></ul> <h3 id="总线组成与性能指标"><a href="#总线组成与性能指标" class="header-anchor">#</a> 总线组成与性能指标</h3> <p>总线由以下三部分组成，传输线路是物理部分，后两者常常是软件部分</p> <ul><li>传输线路：物理实体</li> <li>接口逻辑：和各部件相连的电路，如三态门和缓冲寄存器</li> <li>总线控制器：对总线的使用进行合理的分配管理</li></ul> <p>性能指标</p> <ul><li><p>总线宽度：就是数据总线的根数，直接影响地址线（MAR）和数据线（MDR）的宽度，数据线的宽度指明了访问一次内存或外设能够交换的数据量</p></li> <li><p>总线带宽：总线带宽 = 总线传输的数据量 / 传送时间</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="30.534ex" height="5.285ex" role="img" focusable="false" viewBox="0 -1426 13496 2336" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.059ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">总</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">带</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">宽</text></g><g data-mml-node="mo" transform="translate(4277.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mfrac" transform="translate(5333.6,0)"><g data-mml-node="mrow" transform="translate(2081.2,676)"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">总</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">宽</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">度</text></g></g><g data-mml-node="mrow" transform="translate(220,-710)"><g data-mml-node="mn"><path data-c="38" d="M70 417T70 494T124 618T248 666Q319 666 374 624T429 515Q429 485 418 459T392 417T361 389T335 371T324 363L338 354Q352 344 366 334T382 323Q457 264 457 174Q457 95 399 37T249 -22Q159 -22 101 29T43 155Q43 263 172 335L154 348Q133 361 127 368Q70 417 70 494ZM286 386L292 390Q298 394 301 396T311 403T323 413T334 425T345 438T355 454T364 471T369 491T371 513Q371 556 342 586T275 624Q268 625 242 625Q201 625 165 599T128 534Q128 511 141 492T167 463T217 431Q224 426 228 424L286 386ZM250 21Q308 21 350 55T392 137Q392 154 387 169T375 194T353 216T330 234T301 253T274 270Q260 279 244 289T218 306L210 311Q204 311 181 294T133 239T107 157Q107 98 150 60T250 21Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(722.2,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(1722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">总</text></g><g data-mml-node="mi" transform="translate(2722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">线</text></g><g data-mml-node="mi" transform="translate(3722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">工</text></g><g data-mml-node="mi" transform="translate(4722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">作</text></g><g data-mml-node="mi" transform="translate(5722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">频</text></g><g data-mml-node="mi" transform="translate(6722.4,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">率</text></g></g><rect width="7922.4" height="60" x="120" y="220"></rect></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">带</mi><mi mathvariant="normal">宽</mi><mo>=</mo><mfrac><mrow><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">宽</mi><mi mathvariant="normal">度</mi></mrow><mrow><mn>8</mn><mo>×</mo><mi mathvariant="normal">总</mi><mi mathvariant="normal">线</mi><mi mathvariant="normal">工</mi><mi mathvariant="normal">作</mi><mi mathvariant="normal">频</mi><mi mathvariant="normal">率</mi></mrow></mfrac></math></mjx-assistive-mml></mjx-container><p>每次过”总线宽度“辆车，每秒过”总线工作频率“次，二者一乘就得通过的总车数，再转化单位从 b 到 B。注意这里的总线工作频率并非 CPU 时钟频率，随着 CPU 的发展，后者远大于前者。另外，总线工作频率不同于总线时钟频率，往往总线工作周期等于若干个总线时钟周期，二者成倍数关系，以上公式中必须除以<strong>总线的工作频率</strong></p></li> <li><p>猝发 / 突发通信：给一个地址的情况下，连续读出多个数据，假设传输地址、数据时间为 t，若按顺序正常通信传输 n 个数据，需要时间 2nt，读 n 次地址，读 n 次数据；若突发通信，则需要时间 (n+1)t，即读一次地址，读 n 次数据</p></li></ul> <img src="/assets/img/20221012175625.be57d57d.png"> <p>其他指标</p> <ul><li>总线复用：地址线与数据线复用，分时传输数据</li> <li>总线负载：连接到总线上的最大的设备数</li> <li>总线数量：地址总线、数据总线和控制总线的数量总和</li></ul> <p>注意：总线复用可以降低成本，但会降低数据传输速率</p> <h3 id="总线结构与特性"><a href="#总线结构与特性" class="header-anchor">#</a> 总线结构与特性</h3> <p>总线连接结构</p> <ul><li>单总线结构：只有一根总线，所有的设备接在同一根总线上，实现简单，管理控制复杂</li> <li>双总线结构：在 CPU 和内存之间多了一根专用总线，CPU 访问内存时走专用通道即可；其余和单总线结构一样，所有设备均连在但总线上</li> <li>多总线结构：低速总线和高速总线分开连接传输速度不同的设备</li></ul> <p>总线的特性：和计算机网络物理层的四个特性一模吊样</p> <ul><li>机械特性（物理特性）：总线在连接时，外形是怎样的，如 type-c 和 micro-c</li> <li>电气特性：每根线上的电压、电平范围</li> <li>功能特性：每根线是干嘛的</li> <li>过程特性（时间特性）：数据传输的发生顺序</li></ul> <h3 id="总线通信控制与定时方式"><a href="#总线通信控制与定时方式" class="header-anchor">#</a> 总线通信控制与定时方式</h3> <p>总线如何进行数据传送？在总线仲裁之后，各部件按照<strong>优先等级</strong>获取总线的使用权并分时按照先后顺序使用总线</p> <p>完成一次总线操作的时间称为<strong>总线周期</strong>，包括以下四个阶段</p> <ul><li>申请分配阶段：主模块申请，总线仲裁</li> <li>寻址阶段：主模块向从模块给出地址和命令</li> <li>传数阶段：主模块和从模块交换数据</li> <li>结束阶段：主模块撤销有关信息</li></ul> <p>总线的定时方式：总线通信控制主要解决的是通信双方如何获知传输开始和传输结束，以及通信双方如何协调配合</p> <ul><li>同步定时方式：总线上有一根设备公用的时钟信号线，每个信号出现在总线上的时刻由总线时钟信号来确定。传输频率较高，适用于总线较短且各功能模块进度相近的情况，否则会大大损失总线效率</li> <li>异步定时方式：通过应答信号，即“请求”和“响应”方式来实现同步，不需要统一的公共时钟信号，这一方式又叫做握手方式，分为
<ul><li>全互锁：请求需要从模块确认，结束需要主模块确认</li> <li>半互锁：请求需要从模块确认，结束无需确认</li> <li>不互锁：请求和结束均无需确认</li></ul></li></ul> <p>就像医生拿刀，护士递刀，医生还刀：全互锁，拿刀护士确认医生拿稳了再松手，还刀医生确认护士拿稳了再松手；半互锁，护士确认医生拿稳，医生还刀直接丢；不互锁，拿刀还刀都是直接丢</p> <ul><li>半同步方式：结合了同步通信和异步通信的优点，地址、命令、数据信号的发出时间都严格按照系统时钟；同时增设一条“等待”响应信号线，在数据传输过程插入等待时钟信号告知模块等待，允许不同速度的模块和谐的工作
<ul><li>优点：可靠性较高，同步结构简单</li> <li>缺点：对系统时钟频率不能要求太高，系统工作的速度不是很高</li></ul></li></ul> <p>例如你啥时候开始复习我不管，但到时候你必须参加考试</p> <ul><li>分离式通信：从模块读取数据的过程并不使用总线，但在这段时间已经统一分配给了该主从模块，总线实际上被浪费，整个阶段分为两个部分
<ul><li>主从模块获取总线使用权，主模块发送取数据命令，从模块准备数据，之后从模块准备数，主从模块放弃总线使用权，总线可以被别人使用</li> <li>从模块数据准备完毕后，充当“主模块“，获取总线使用权，主动向主模块（现在是从模块）发送数据</li></ul></li></ul> <p>控制器和运算器，五星重点，408最难的一部分，出过三种大题</p> <ul><li>CPU 功能和指令执行</li> <li>控制器的设计和工作原理</li> <li>指令流水线</li></ul> <h2 id="cpu-系统"><a href="#cpu-系统" class="header-anchor">#</a> CPU 系统</h2> <h3 id="cpu-组成和结构"><a href="#cpu-组成和结构" class="header-anchor">#</a> CPU 组成和结构</h3> <p>冯诺依曼结构中，数据和指令均用二进制表示并按序依次存放在存储器中，计算机分为运算器、控制器、存储器、输入设备和输出设备五大部件，其中运算器和控制器合为中央控制其，即 CPU</p> <p>CPU 包括算术逻辑单元 ALU、控制单元 CU、寄存器以及中断系统，与控制总线、数据总线、地址总线相连</p> <ul><li>ALU 实现算术运算、逻辑运算</li> <li>CU 作为控制器，协调取数据、分析、读内存等工作，由程序计数器 PC、指令寄存器 IR、指令译码器 ID、时序产生器和操作控制器等组成</li></ul> <h3 id="cpu-寄存器"><a href="#cpu-寄存器" class="header-anchor">#</a> CPU 寄存器</h3> <p>分为专用寄存器和通用寄存器</p> <ul><li>专用寄存器：程序计数器、指令寄存器、指令译码器、存储器数据寄存器、存储器地址寄存器</li> <li>通用寄存器：数据寄存器、地址寄存器、通用寄存器</li></ul> <h4 id="专用寄存器"><a href="#专用寄存器" class="header-anchor">#</a> 专用寄存器</h4> <p>程序计数器 PC，也叫指令计数器，对指令条数进行计数</p> <p>存放下一条将要执行的指令地址。执行指令时，CPU 会自动递增 PC 的内容，使其始终指向下一条指令；执行指令前，内存必须把第一条指令的首地址发送给 PC</p> <p>有两种递增 PC 内容的途径：顺序执行和通过转移指令</p> <ul><li>顺序执行：即令 PC 地址加 1，PC = (PC) + 1，这里的 1 指的是一个指令的长度，单位为字，如一条指令 32 位，以字节（8bit）编码，那么每次就要<strong>加一个指令的字数</strong>，即 4 个字（指令字长 / 编址单位）</li> <li>转移指令：即通过转移指令形成新地址再送往程序计数器，作为下一指令地址，PC = (PC) +1 + A，加的是 (1+A) 个指令的字数</li></ul> <p>如以下栗子，指令字长为 16 位，由于按字节编址，即长为 2 个字，所以 PC 要加 2</p> <img src="/assets/img/20221010192643.51bc2a4f.png"> <p>两个特点：任何程序要执行，必须把地址发给 PC；汇编语言可以直接对 PC 进行操作</p> <p>指令寄存器：保存当前正在执行的指令。为了防止指令执行一半时指令发生变化，用指令寄存器 IR 保存当前正在执行的指令，执行指令的过程中，其内容不允许发生变化</p> <p>指令译码器：分析指令的操作码字段</p> <p>存储器数据寄存器：MDR，memory data register，用于暂存内存中读出的数据，存储字长</p> <p>存储器地址寄存器：MAR，memory address register，用于保存当前 CPU 所访问的主存单元的地址</p> <table><thead><tr><th>寄存器</th> <th>存放内容</th></tr></thead> <tbody><tr><td>PC</td> <td>下一条指令地址</td></tr> <tr><td>IR</td> <td>当前指令本身</td></tr> <tr><td>MDR</td> <td>进出内存的数据</td></tr> <tr><td>MAR</td> <td>进出内存的地址</td></tr></tbody></table> <p>PC 位数等于 MAR，指令最终是要从内存中读出，也就是说 PC 中的地址在下一步是要取出的，取出则会放到 MAR 中，这就要求 MAR 的位数要大于等于 PC，否则放不下</p> <p>IR 位数等于 MDR，与上同理，从内存中读出的指令（冯说，指令就是数据）始终要放在 IR 中的，所以 IR 大小必须大于等于 MDR</p> <table><thead><tr><th>寄存器</th> <th>大小</th></tr></thead> <tbody><tr><td>PC</td> <td>log2 (指令条数) = log2 (内存大小/指令字长)</td></tr> <tr><td>IR</td> <td>指令字长，指令长度位数</td></tr> <tr><td>MDR</td> <td>存储字长，就是字长位数</td></tr> <tr><td>MAR</td> <td>log2 (内存块数) = log2 (内存大小/编码方式)</td></tr></tbody></table> <p>假设内存 4GB，按字节编码，指令字长 4B，则</p> <ul><li>IR = 32 位</li> <li>MDR = 8 位</li> <li>MAR = log2 (4GB/1B) = log2 (4G) = 32 位</li> <li>PC = log2 (4GB/4B) = 30 位</li></ul> <p>这里的指令条数都是考虑的最大情况，即内存中只装指令只能装这么多条，最多就这么多条，PC 不可能超出，MAR 同理，内存中只装数据块，最多这么多块</p> <p>状态标志寄存器</p> <ul><li>溢出和进/借位就是两种典型的状态标志；还有一种叫做控制标记：如中断标志、陷阱标志</li> <li>条件转移指令执行时依据的条件来自于<strong>标志寄存器</strong></li></ul> <p>常用的几种标志</p> <table><thead><tr><th>标志</th> <th>1</th> <th>0</th></tr></thead> <tbody><tr><td>Z（zero）</td> <td>为零</td> <td>非零</td></tr> <tr><td>C（进位）</td> <td>有进/借位</td> <td>无进位</td></tr> <tr><td>V（overflow位）</td> <td>有溢出</td> <td>无溢出</td></tr> <tr><td>N（符号位）</td> <td>正</td> <td>负</td></tr></tbody></table> <p>各专用寄存器对程序员的可见性</p> <table><thead><tr><th>寄存器\程序员</th> <th>系统程序员</th> <th>应用程序员</th></tr></thead> <tbody><tr><td>PC</td> <td>1</td> <td>0</td></tr> <tr><td>MDR</td> <td>0</td> <td>0</td></tr> <tr><td>MAR</td> <td>0</td> <td>0</td></tr> <tr><td>IR</td> <td>0</td> <td>0</td></tr> <tr><td>PSWR（状态）</td> <td>1</td> <td>0</td></tr> <tr><td>PSWR（控制）</td> <td>0</td> <td>0</td></tr> <tr><td>通用寄存器</td> <td>1</td> <td>1</td></tr></tbody></table> <p>只有 PC 和 PSWR 的状态标记对系统程序员可见，其余均透明</p> <p>数据缓冲寄存器 DR：缓冲从内存中读出的数据，提高系统性能</p> <p>地址缓冲寄存器 AR：存放地址缓冲</p> <h4 id="通用寄存器"><a href="#通用寄存器" class="header-anchor">#</a> 通用寄存器</h4> <p>传送和暂存数据，也可以参与算术逻辑运算，通用寄存器均可见，即所有程序员均可以直接操纵通用寄存器</p> <h3 id="cpu-功能和数据通路"><a href="#cpu-功能和数据通路" class="header-anchor">#</a> CPU 功能和数据通路</h3> <p>控制和运算功能</p> <ul><li>取指令</li> <li>指令移码</li> <li>控制指令执行</li> <li>控制输入输出</li> <li>异常处理</li> <li>完成算术运算和逻辑运算</li></ul> <p>CPU 功能概括为指令控制、操作控制、时间控制、数据加工和中断处理</p> <p>CPU 数据通路：数据如何在 CPU、内存之间流通的？</p> <img src="/assets/img/20221010183941.67c356cd.png"> <p>其中 IR（存放当前指令）、PC、ALU、CU、MAR、M 均为默认叫法，需要背住</p> <p>指令与周期</p> <ul><li>指令周期：指令从取出到执行完成所需时间</li> <li>机器周期：指令周期分为很多个阶段，每个阶段都叫一个机器周期，一个指令周期包含若干机器周期，一个机器周期包含若干时钟周期</li> <li>取指周期：取指令过程，前三步即<strong>读内存</strong></li> <li>间址周期：间址寻址过程</li> <li>加法周期 ADD X：但地址码默认另一数据在 ACC 中</li> <li>存数周期 STA X：存放数据</li> <li>取数指令 LDA X：取出数据</li> <li>转移指令 ：无条件转移指令 JMX X 和有条件转移 BAN X</li> <li>中断指令：实际上就是保存 PC，程序断电存入 “0” 地址，程序断电进栈</li></ul> <p>以上周期和指令</p> <ol><li>第一步一定是取值</li> <li>第二步确定指令功能，确认如何取数（运算方式）和如何运算</li> <li>第三步根据题目开始默写上述过程</li></ol> <img src="/assets/img/20221010192103.218b3d56.png"> <p>实现 (R0) + ((R1))，并将结果写入 (R1)</p> <img src="/assets/img/20221010192039.1ab5ec33.png"> <p>并行执行：要求线路和部件没有任何的交际，注意取指令操作是控制器自动进行的，是控制器固有的 功能，无需在操作码控制下完成，这是一定的，如果取指令这一指令依赖于指令，那如何去取“取指令”的指令，就像操作系统的第一条指令（boot）是由硬件触发的</p> <p>关于时钟信号</p> <ul><li>节拍 == 脉冲 == 时钟周期</li> <li>每个指令的节拍固定，即 CPI（执行一个指令所化时钟周期数），计算机严格按照 CPI 掐断指令，进行分割</li></ul> <img src="/assets/img/20221010193827.921793f3.png"> <p>他写的有点问题，R1 为寄存器寻址，R2 为寄存器间接寻址，最后将运算结果送入 R1</p> <h3 id="cpu-设计原理"><a href="#cpu-设计原理" class="header-anchor">#</a> CPU 设计原理</h3> <h4 id="cpu-控制器"><a href="#cpu-控制器" class="header-anchor">#</a> CPU 控制器</h4> <p>CPU 控制方式</p> <ul><li>同步控制方式：选取部件中最长的操作时间作为统一的时间间隔标准，即所有控制信号按这一间隔发出，实现同步控制，这样会产生空闲时间，降低效率</li> <li>异步控制方式：每个指令、每个微操作需要多少时间就占用多少时间，没有统一的信号控制，通过应答信号实现，即每次完成操作后发回“结束”信号告知完成</li> <li>联合控制方式：也叫混合控制方式，大多数计算机采用该种方式。同步异步相结合，很多操作按照异步进行，在少数关键点（CPU 内部时序）采用同步方式</li></ul> <p>控制器原理与设计：微程序设计技术，利用软件方法设计硬件的技术</p> <ul><li>每个指令对应一个微程序，每个微程序由微指令构成</li> <li>所有指令所对应的微程序放在一个只读存储器中，叫做控存（控制存储器），每个指令执行时，去执行其对应的微程序，逐条读出微指令，放入微指令寄存器，译码产生微命令，控制各步执行</li> <li>采用微程序控制方法的控制器称为微程序控制器，微命令不是由组合逻辑电路产生，而是由微指令译码产生</li></ul> <img src="/assets/img/20221011192433.52b917d3.png"> <p>关于微程序控制器的基本术语</p> <ul><li>相容性微操作：可并行执行的微操作</li> <li>相斥性微操作</li> <li>微地址：微指令在控存中的地址</li> <li>微地址寄存器 CMAR：存放微地址字段的寄存器</li> <li>微命令寄存器 CMDR：微程序控制器中的寄存器</li></ul> <p>微程序控制器基本原理：机器指令映射微程序</p> <ul><li>每条机器指令对应一个微程序</li> <li>取值指令是相同，于是将取值指令同一编制成一个取值微程序，作为公共使用，同理还有间址指令、中断指令</li> <li>因为取值指令公共，101 种操作对应存放了 102 个微程序；若没有 102，则将间址和中断也考虑进去，得 104 个微程序？</li></ul> <p>微程序控制器基本结构</p> <ul><li>控存是核心部件，属于 ROM（只读内存），按地址访问</li> <li>CMAR 控存地址寄存器，存放微指令地址</li> <li>CMDR 控存数据寄存器，存放读出的微指令</li></ul> <p>微指令序列地址的形成方式：即如何寻址</p> <ul><li>断定法：由微指令的下地址字段指出</li> <li>机器指令的操作码形成</li> <li>增量法：CMAR+1 —&gt; CMAR</li> <li>网络测试形成</li> <li>由硬件产生</li></ul> <p>微程序控制器工作过程</p> <ul><li>取机器指令：将机器指令送入指令寄存器</li> <li>转微程序入口：指令操作码部分送入微地址形成电路，形成微程序入口，将微程序入口送入微地址寄存器，将微地址送入控存，从控存中找到微程序起始地址，将首条微指令送入微指令寄存器中</li> <li>执行首条微指令：将控存地址寄存器微命令字段送入译码器，得到相应微命令并执行</li> <li>取后续微命令：微地址形成电路 —&gt; 从控存取微命令 —&gt; 执行</li></ul> <p>微程序控制器设计（编码 / 控制方式）：操作控制字段 + 下地址字段</p> <p>直接编码方式</p> <ul><li>操作控制字段中一位对应一个微命令，控制字段长度为微命令个数，1 表示打开某控制门，0 表示禁止</li> <li>每位表示一个命令，固定如此，如 000 表示连续三个命令全禁止</li></ul> <p>字段直接编码方法</p> <ul><li>对操作控制字段进行分段，每一段含互斥的微命令，同时还有一位有效位表示字段字否有效</li> <li>因为字段内微命令互斥，所以可以进行编码，即 000 表示命令 1，001 表示命令 2，这样能够大大减小内存开销</li></ul> <p>字段间接编址方式：某些段的输出依赖于某些段的输出</p> <p>控存的大小：如为 512x40 位，即表示有 512 条微指令，每条 40 位</p> <p>水平型微指令和垂直性微指令</p> <ul><li>水平性并行性较好，执行时间较短</li> <li>垂直型由微操作码规定微指令功能</li></ul> <p>例如直接编码方法设计微指令格式</p> <img src="/assets/img/2022-10-11_11-09-04.67890a3c.png"> <p>又如字段直接编码方式设计微指令格式</p> <img src="/assets/img/2022-10-11_11-17-34.76e441c5.png"> <p>组合逻辑控制器的原理和设计：由门电路和触发器构成的树型网络组成，组合逻辑也叫硬布线控制器，更快，但不易修改；微指令控制器易修改，易扩展</p> <h4 id="指令流水线"><a href="#指令流水线" class="header-anchor">#</a> 指令流水线</h4> <p>指令执行方案与流水线</p> <ul><li>一个指令周期分为很多步骤，如取值、分析、执行等，很多时候他们串行执行，但出于性能和硬件成本考虑，我们希望他们并行运行</li> <li>指令之间可以并行执行的方案称为<strong>流水线方案</strong>，每个人只做其中一步，在操作上并行</li></ul> <p>指令流水线：我们将一条指令分为取值、分析、执行三个过程，假设每个步骤消耗时间 t</p> <ul><li>顺序执行方式：n 条指令则消耗时间 3nt，控制简单，硬件代价小，执行缓慢</li> <li>一次重叠执行：即执行上一条指令的“执行过程”时，同时执行下一条指令的“取值过程”，重叠一次操作，这样 n 条指令将消耗时间 3t + (n-1)2t = (1+2n)t
<ul><li>3t 为第一条指令完成时间，之后每经过 2t，都会有一条指令完成（参考计网分组交换）</li> <li>需要多硬件，并行重叠一次，就多一个硬件，但时间缩短到 2/3</li></ul></li> <li>二次重叠执行：执行上一个“分析”过程时，开始执行下一个“取值”过程，折叠两个过程，这样耗时将缩短至 3t + (n-1)t = (2+n)t，时间缩短至原来的 1/3</li></ul> <p>推广到一般，当步骤增多，我们在第一步骤结束后立马开始第二条指令，这种模式就叫做流水线模式</p> <p>流水线的性能指标</p> <ul><li><p>吞吐率：单位时间内流水线完成的任务数量</p></li> <li><p>加速比：流水线和等功能的非流水线的速度之比</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="31.276ex" height="5.271ex" role="img" focusable="false" viewBox="0 -1370 13823.9 2330" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.172ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D446" d="M308 24Q367 24 416 76T466 197Q466 260 414 284Q308 311 278 321T236 341Q176 383 176 462Q176 523 208 573T273 648Q302 673 343 688T407 704H418H425Q521 704 564 640Q565 640 577 653T603 682T623 704Q624 704 627 704T632 705Q645 705 645 698T617 577T585 459T569 456Q549 456 549 465Q549 471 550 475Q550 478 551 494T553 520Q553 554 544 579T526 616T501 641Q465 662 419 662Q362 662 313 616T263 510Q263 480 278 458T319 427Q323 425 389 408T456 390Q490 379 522 342T554 242Q554 216 546 186Q541 164 528 137T492 78T426 18T332 -20Q320 -22 298 -22Q199 -22 144 33L134 44L106 13Q83 -14 78 -18T65 -22Q52 -22 52 -14Q52 -11 110 221Q112 227 130 227H143Q149 221 149 216Q149 214 148 207T144 186T142 153Q144 114 160 87T203 47T255 29T308 24Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(922.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mfrac" transform="translate(1978.6,0)"><g data-mml-node="mrow" transform="translate(1650.7,676 40Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z" style="stroke-width:3;"></path></g></g><rect width="5404.9" height="60" x="120" y="220"></rect></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>E</mi><mo>=</mo><mfrac><mi>n</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo>+</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>t</mi></mrow></mfrac></math></mjx-assistive-mml></mjx-container></li></ul> <p>影响流水线的因素</p> <ul><li>结构相关（资源冲突 / 资源冒险）因素：并行执行需要大量硬件资源，如果硬件不够就会出现资源冲突，解决办法</li> <li>控制相关：流水线遇到转移指令改变了 PC 信号的指令而造成断流，解决办法，前面指令阻塞，后续指令也被阻塞，属于控制相关</li> <li>数据相关（数据冲突 / 数据冒险）因素：前一条指令和后一条指令同时执行并操作同一条数据</li></ul> <p>数据相关并发冲突</p> <ul><li>写后读（Write After Read）：前一条指令还未把新数据写入内存，下一条指令已经读出了旧数据，这种现象叫做写后读错误（写后于读）。解决办法：让读阻塞若干周期，等待写操作完毕</li> <li>写后写（Write After Write）：后一个写指令执行太快，覆盖了前一个写操作，最终数据是前一个写操作的结果。为什么会出现后一个写快于前一个写？指令执行具有异步性，无法预判</li> <li>读后写（Read After Write）：前后相邻，编号相同，前读后写。后面指令写的太快，导致前一条指令读到的是新数据。解决办法：暂停周期；设置相关专用通路，数据旁路技术；编译器调整指令顺序</li></ul> <p>超流水线技术：三种超发技术，依赖于编译器的优化和多硬件支撑</p> <ul><li>超标量</li> <li>超流水线技术</li> <li>超长指令字</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/30, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/54be26/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">隐马尔科夫和机器学习</div></a> <a href="/pages/10e829/" class="page-nav-centr
