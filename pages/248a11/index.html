> <li>泥洼纯木 + V15E</li> <li>张 A + 狂飙 40° + DNA M</li></ul> <p>整体越软控制越好</p> <ul><li>五夹：OC、梅兹</li> <li>七夹：CL-CR、泥洼纯木、红黑碳</li> <li>内置：龙五、赛博 6</li> <li>外置：张 A</li></ul> <p>套胶</p> <ul><li>正手：狂飙 3/8、DNA H、亚萨卡飞龙、D09C</li> <li>反手：DNA M、木星 3、咒语 M、D09C、D05</li> <li>长胶：729 755、大维 388D-1</li></ul> <p>胶水</p> <ul><li>无机：琉蓝、典驰、15 号</li> <li>有机：海豚、蓝鲸</li></ul> <h3 id="动作框架"><a href="#动作框架" class="header-anchor">#</a> 动作框架</h3> <blockquote><p>老陕大师课</p> <ul><li>乒乒球是两个人在用身体角力，用身体在抗，而并非手臂</li> <li>发力的基础在于腰腹和手的整体性，发力的关键在于手腕的爆发力</li> <li>只有足够放松，手腕才有足够的发力空间，越放松越爆</li></ul></blockquote> <p>正手框架</p> <ol><li>重心要低：头仅比网高一点，一是利于发动，二是利于制造弧线，身子低击球全是半高</li> <li>发力集中在身体和手腕：不需要关注大臂小臂，仅仅关注手腕就行，放松后凌空鞭打，在篮球大小范围中集中发力，靠撞击透板，靠吃球深度加摩擦</li> <li>脚底踩住控制节奏：连续性很大程度上取决于步伐，击球瞬间（0.3s 不到）一定要把重心踩死在右脚，并且进行大幅度的蹬转；这是找准节奏的关键，可以适当的喊口号或调整呼吸去找踩重心 → 发力的节奏</li> <li>松紧控制：手腕一定要放松，放松有助于发力，但身子、腰、腿不能散，必须得集中</li></ol> <p>不同的身体部位负责不同的工作</p> <ol><li>发力在于手部（始终在靠近身子的篮球大小范围发力），这意味着，在发力范围外，引拍应当放松，收拍应当制动停顿</li> <li>节奏调整和重心在于腰腿，腰腿是一直绷住的，集中的，不能散，唯一能放松的是手部的非篮球区域</li></ol> <p>手臂控制的关键：越靠近身子，越容易控制，能不能透板仅仅在于靠近身子的篮球大小范围的瞬间发力</p> <ul><li>0.1s 的事，不要有附加的手臂动作，这只会让球不稳定</li> <li>旋转也是在那 0.1s 的撞击中，由手腕加上的，而并非手臂的工作</li></ul> <p>反手</p> <ul><li>首先一定是要找点，肚子是母球，只有当母球和乒乒球处于一条线上时，你的击打才是简单的，相当于直塞</li> <li>其次引拍一定要压腕，压腕是为了给转腕留空间，转腕不等于甩腕，整个反手框架中，手腕不会前后移动，而只有以手腕为支点的旋转，这样和整个身体维持一个稳定的整体同时保证手腕的灵活度</li></ul> <p>击球要有整体性：身体带动手移动，二者是一个整体，这样动作既稳定，力的传导也没有损失</p> <ul><li>甩手去鞭打远小于整体框架的发力加上转腕的发力</li> <li>强调手不发力，靠身体吃住球，挂起来，通过瞬间制动手腕来鞭打</li></ul> <p>打乒乓球不需要发力，想要发力，就得放松手腕再制动</p> <h3 id="发抢技战术"><a href="#发抢技战术" class="header-anchor">#</a> 发抢技战术</h3> <blockquote><p>通过发球为第三板制造主动</p></blockquote> <p>顺旋转到正手短 + 反手长 + 中间长：<a href="https://www.bilibili.com/video/BV19BbH6oE18/?trackid=web_pegasus_0.router-web-pegasus-2479516-gfll4.1790359026645.557&amp;spm_id_from=333.1007.tianma.1-1-1.click&amp;vd_source=757c95a458d7c9501de959636f126d0a" target="_blank" rel="nofollow noopener noreferrer">为什么马龙、马琳喜欢发左侧旋球 | bilibili<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <ul><li>反手长降低回球质量，衔接反手撕 / 侧身冲</li> <li>若对手回摆就立即劈反手长，回到反手长的逻辑，准备反手撕 / 侧身冲</li></ul> <p>逆旋转到正手短限制拧拉，逼迫对手正手劈长，此时衔接反手冲 / 正手冲；逆旋转反手长少发，以牵制为主</p> <p>特殊胶皮处理：发球无脑冲颗粒长，上下旋换着来</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/29, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/3d5362/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">实习</div></a> <a href="/pages/music/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">吉他</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
