"stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(16628.8,0)"><path data-c="1D435" d="M231 637Q204 637 199 638T194 649Q194 676 205 682Q206 683 335 683Q594 683 608 681Q671 671 713 636T756 544Q756 480 698 429T565 360L555 357Q619 348 660 311T702 219Q702 146 630 78T453 1Q446 0 242 0Q42 0 39 2Q35 5 35 10Q35 17 37 24Q42 43 47 45Q51 46 62 46H68Q95 46 128 49Q142 52 147 61Q150 65 219 339T288 628Q288 635 231 637ZM649 544Q649 574 634 600T585 634Q578 636 493 637Q473 637 451 637T416 636H403Q388 635 384 626Q382 622 352 506Q352 503 351 500L320 374H401Q482 374 494 376Q554 386 601 434T649 544ZM595 229Q595 273 572 302T512 336Q506 337 429 337Q311 337 310 336Q310 334 293 263T258 122L240 52Q240 48 252 48T333 46Q422 46 429 47Q491 54 543 105T595 229Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msub><mi>L</mi><mrow data-mjx-texclass="ORD"><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><mn>51.2</mn><mo>×</mo><msup><mn>10</mn><mrow data-mjx-texclass="ORD"><mo>−</mo><mn>6</mn></mrow></msup><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup><mo>=</mo><mn>512</mn><mi>b</mi><mo>=</mo><mn>64</mn><mi>B</mi></math></mjx-assistive-mml></mjx-container><p>而最大是因为规定以太网 MAC 帧的数据段最长为 1500</p> <p>各种传输介质下的以太网特征，需要记忆</p> <img src="/assets/img/image-20230624004151086.c26edbe8.png"> <p>在上述介质中，T 表示双绞线，2/5 数字表示同轴电缆（数字越大电缆越粗，段长越长），FL 表示光纤</p> <p>其他以太网</p> <ul><li>高速以太网：减少站点之间距离，拉高传输速率，保持最短帧长度</li> <li>吉比特以太网（1Gb/s）：可半双工，可全双工，注意在半双工时实际带宽为额定带宽的一半</li> <li>10 吉比特以太网（10Gb/s）：只支持双工通信，无冲突，可以双绞线也可以光纤</li></ul> <p>注意，所有类型的以太网均在同一广播域，这意味着所有信息都在总线上进行广播，广播的对象甚至包括发送信号的站点自身</p> <h4 id="_802-11-协议"><a href="#_802-11-协议" class="header-anchor">#</a> 802.11 协议</h4> <blockquote><p>无限局域网</p></blockquote> <p>无限局域网协议，使用 CSMA-CA 进行访问介质控制</p> <table><thead><tr><th>组成</th> <th></th></tr></thead> <tbody><tr><td>BSS</td> <td>基本服务集</td></tr> <tr><td>AP</td> <td>Access Point，接入点，需要分配 SSID</td></tr> <tr><td>DS</td> <td>分配系统，用于连接不同基本服务集</td></tr> <tr><td>base station</td> <td>基站，分为移动的和固定的</td></tr> <tr><td>ESS</td> <td>拓展服务集</td></tr></tbody></table> <p>移动基站的漫游：在一个 ESS 中，基站从一个 BSS 漫游到另一个 BSS，其仍属于同一个 ESS，但接入点 AP 发生改变</p> <img src="/assets/img/image-20230624003738858.ff4a5395.png"> <p>802.11 首部（共 30 B）的三地址</p> <img src="/assets/img/image-20230624004010500.3d0a61f6.png"> <p>分为<code>to AP</code>和<code>from AP</code>两种，通过两个标志位区分，三地址中，第一个地址始终是发送帧的直接站点地址，第二个始终是接收帧的直接站点地址，第三个</p> <ul><li>若为<code>to AP</code>，则为最终的目的 MAC 地址</li> <li>若为<code>from AP</code>，则为发送帧的源物理地址</li></ul> <p>802.3 帧和 802.11 帧是可以相互转化的，只需要改变首部的一些字段即可，在封装网络层 IP 数据报时，先通过 ARP 协议将其转化为 802.3 帧，再在局域网中封装为 802.11 帧</p> <p>为什么 802.1Q 使用 CSMA-CA 而不使用以太网的 CSMA-CD 来减少冲突呢？</p> <ul><li>无限局域网的信号弱，碰撞检测（CD）的难度大</li> <li>无限局域网很多站点不能感受到局域网中的所有站点，根本无从进行碰撞检测（这是 CSMA-CD 的必要条件，即不存在隐蔽站）</li></ul> <h4 id="_802-1q-协议"><a href="#_802-1q-协议" class="header-anchor">#</a> 802.1Q 协议</h4> <blockquote><p>VLAN，虚拟局域网</p></blockquote> <p>一个以太网是一个广播域，即使用交换机将以太网分割开，其仍是一个广播域</p> <p>虚拟局域网（VLAN）协议，在 802.3 以太网 MAC 帧的基础上<strong>加入了长度为 4B 的 VLAN 标签</strong>构成 802.1Q 帧（最长为 1522），将局域网从逻辑上分割成若干小的广播域</p> <p>VLAN 既可以划分冲突域，又可以划分广播域（以太网交换机只可以划分冲突域）</p> <p>虚拟局域网的划分方法，常有三种</p> <ul><li>基于网卡地址（MAC 地址）划分</li> <li>基于网络层地址（IP 地址）划分</li> <li>基于交换机端口划分</li></ul> <h3 id="广域网"><a href="#广域网" class="header-anchor">#</a> 广域网</h3> <p>广域网是因特网（互联网）的核心部分，自然局域网是因特网的边缘部分，注意因特网可以连接不同类型的网络（如局域网、广域网），显然局域网和广域网是做不到的，这不失为因特网和广域网的一大差别</p> <img src="/assets/img/image-20230624013140827.a38d5c18.png"> <p>我的理解为，局域网和广域网的复杂网络共同构成了互联网，其中交换机、路由器等设备连接、中转各种网络</p> <p>相比于局域网，广域网的覆盖范围极大，并且涉及 ISO 网络体系结构的下三层，主要使用的协议在网络层（局域网主要在链路层），这是由网络封装数据时主要所使用的协议决定</p> <p>广域网解决的重要问题：路由选择和分组转发（同样也是网络层解决的主要问题）</p> <ul><li>都分组转发了，其数据传输一定采用的<strong>存储转发式</strong>以及<strong>分组交换技术</strong></li></ul> <p>广域网之中，数据最终还是通过比特流传输，一定会经过链路层（和局域网一样，其接收上层的报文，在相应链路层协议下封装成帧，最终通过比特流在物理介质上传输），广域网使用的链路层协议为：PPP 协议和 HDLC 协议</p> <h4 id="ppp-协议"><a href="#ppp-协议" class="header-anchor">#</a> PPP 协议</h4> <p>Point to Point 协议，是一种<strong>使用串行线路通信的、全双工的、面向字节的、有连接的</strong>链路层传输协议，<strong>应用在直接连接的两个结点的链路上</strong></p> <p>PPP 基于 SLIP 协议，后者只适用于上层使用 IP 协议的网络层数据在链路层的封装</p> <p>PPP 协议的内容包括三部分</p> <ul><li>LCP：链路控制协议，用于链路连接的建立、销毁等</li> <li>NCP：网络控制协议，PPP 协议允许同时采用多种网络层协议，NCP 用以适配不同的网络层协议，为网络层协议建立和配置逻辑连接</li> <li>一种成帧方法，即规定 PPP 帧格式</li></ul> <p>PPP 的帧格式</p> <img src="/assets/img/image-20230624014627934.b2e700d6.png"> <p>其中 F 为标志字段，标志帧的开始和结尾，A 为地址字段，C 为控制字段，协议字段标明所使用的网络层协议（前面提到了 PPP 可以兼容不同的网络层协议），FCS 为老朋友校验码，这里占 2B</p> <p>这里明确指出，PPP 帧的信息部分 SDU 就是上一层的 PDU，即 IP 数据报（报文），回顾一下（n-1 表示封装的前一层）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="25.92ex" height="2.066ex" role="img" focusable="false" viewBox="0 -705 11456.5 913" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.471ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z" style="stroke-  108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(600,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(1378,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g></g></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>P</mi><mi>D</mi><msub><mi>U</mi><mi>n</mi></msub><mo>=</mo><mi>P</mi><mi>C</mi><msub><mi>I</mi><mi>n</mi></msub><mo>+</mo><mi>P</mi><mi>D</mi><msub><mi>U</mi><mrow data-mjx-texclass="ORD"><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msub></math></mjx-assistive-mml></mjx-container><p>PPP 帧采用首尾字符定界来界定帧，其首尾标志位 7E，即 0111 1110 来表示帧的开始和结束，信息段的 7E 采用转义字符的方式来处理，PPP 帧的转义字符为 7D，则信息段的 7E 则表示为 7D7E</p> <p>由于 PPP 是点对点的（主机对主机），肯定没有冲突，根本不需要冲突检测/避免，所以没有最短帧限制，自然不需要有信息段大于等于 46B 的限制</p> <p>可以发现，PPP 帧所有字段都是按照字节来分段，也就是说 PPP 帧的长度一定为整数字节，这也是为什么说 PPP 是面向字节的链路层协议</p> <h4 id="hdlc-协议"><a href="#hdlc-协议" class="header-anchor">#</a> HDLC 协议</h4> <p>HDLC 是 PPP 协议的基础</p> <p>已经很少用了捏，是一种面向比特的协议，采用首尾比特串定界法，使用 01111110 来标志帧的开始和结束，信息段对于连续的五个 1 采用 0 比特填充法（即碰到五个连续的 1，则在其后面填充一个 0），以实现透明传输</p> <h3 id="以太网交换机"><a href="#以太网交换机" class="header-anchor">#</a> 以太网交换机</h3> <blockquote><p>Switch</p></blockquote> <p>以太网交换机、集线器和虚拟局域网的区别</p> <table><thead><tr><th>交换机（Switch）</th> <th>集线器（Hub）</th> <th>虚拟局域网技术（VLAN）</th></tr></thead> <tbody><tr><td>隔绝冲突域，不隔离广播域</td> <td>啥也隔绝不了，纯纯的广播</td> <td>既隔绝冲突域，又隔离广播域</td></tr> <tr><td>多端口网桥</td> <td>多端口中继器</td> <td>802.1Q 帧</td></tr></tbody></table> <img src="/assets/img/image-20230624020104254.5d72c28e.png"> <p>选择 B、D</p> <p>交换机的带宽：每个端口独占其端口的带宽，交换机的总带宽（总容量）为所有端口带宽之和</p> <ul><li>注意交换机可以是全双工也可以是半双工的，若是半双工的交换机，其总带宽为所有端口带宽和的<strong>一半</strong></li></ul> <p>交换机的自学习算法：维护一个交换表，每当有站点从其相应端口向交换机传入帧时，将其 MAC 地址和对应端口写入交换表，同时根据帧的目的地址先在交换表中寻找对应端口</p> <ul><li>若有，则发送至相应端口</li> <li>若无，则广播除发送端口的所有端口</li></ul> <p>注意只有传入交换机的站点才写入其端口表项，若已有则更新</p> <img src="/assets/img/image-20230624020547542.30e6c637.png"> <p>这里选 D，不难看出，这个废物 Hub 啥也不隔离，直接广播所有与其相连的设备（至少在物理上一定是传输过去了，只是会被丢掉），而 Switch 因为 H2 传入过帧，所以在发送确认帧时交换表中有其 MAC 地址对应的表项，直接发送相应端口即可，无需广播</p> <p>注意这里的交换机的前缀是以太网交换机，是不是意味着还有广域网交换机，这是肯定的，在上面的互联网的概念图中，作为核心部分的各个广域网，就是通过交换机相连接，广域网和局域网通过路由器相连接</p> <p>遗留了一个问题，为什么是 <mjx-container jax="SVG" class="MathJax" style="direction:ltr;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="4.323ex" height="1.887ex" role="img" focusable="false" viewBox="0 -833.9 1910.9 833.9" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:0;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g><g data-mml-node="TeXAtom" transform="translate(533,363) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(600,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(1378,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g></g></g></g></g></svg><mjx-assistive-mml unselectable="on" display="inline" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;width:auto;overflow:hidden;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msup><mn>2</mn><mrow data-mjx-texclass="ORD"><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup></math></mjx-assistive-mml></mjx-container>，没看懂</p> <img src="/assets/img/image-20230625005406123.7c4cc61b.png"> <h2 id="网络层功能"><a href="#网络层功能" class="header-anchor">#</a> 网络层功能</h2> <blockquote><p>我对整个网络的传输过程产生了疑问，网络层说是通过相同的 IP 协议统一了下三层的不同网络，如局域网和广域网，但分组在网络层，帧首尾部套在分组的外侧，最终数据以比特流在物理链路上传输，即使不同的网络在网络层识别到所谓统一的 IP 分组，但怎么去拆解不同的帧从而得到这个 SDU 呢</p> <p>就是说，你通过网络层协议来统一，但网络层协议在数据的内层，在接收时首先是识别不到的（先识别帧再得到 IP 分组），那是怎么通过一个首先识别不到的数据来辨识一段比特数据呢？</p></blockquote> <p>整个计算机网络就是一个无向图，涉及一些简单的图算法用于路径选择（路由）</p> <h3 id="连接异构网络"><a href="#连接异构网络" class="header-anchor">#</a> 连接异构网络</h3> <p>异构网络相连，所谓的统一下三层的不同网络，通过路由器将使用不同下三层协议的网络中继相连接，组成一个大的互联网，这不同于以太网交换机和集线器，这两个东西都只是扩大了广播域，相当于将同一个网络扩展，并没有连接其他网络</p> <h3 id="路由和转发"><a href="#路由和转发" class="header-anchor">#</a> 路由和转发</h3> <p>路由和转发：路由选择和分组转发，后者根据前者的信息进行</p> <img src="/assets/img/image-20230625010813622.e493c1c8.png"> <h3 id="sdn"><a href="#sdn" class="header-anchor">#</a> SDN</h3> <p>SDN 基本概念：Software Definition Network，软件定义网络，通过软件控制网络的两个主要功能，即路由和转发，将网络分为两层，控制层和数据层，前者负责路由，采用集中控制的方法，后者负责转发，采用分布式处理（在寻常网络中，二者均为分布式）</p> <ul><li>控制与转发功能分离</li> <li>控制层面集中化</li> <li>接口开放可编程</li></ul> <h3 id="拥塞控制"><a href="#拥塞控制" class="header-anchor">#</a> 拥塞控制</h3> <p>拥塞控制：由于出现过量的分组而引起网络性能下降的现象称为拥塞，正常来说网络负载线性增加，网络吞吐量也该线性增加，当分组逐渐增加，随着网络负载增加，网络的吞吐量增加缓慢甚至不动，考虑网络已经发生拥塞（被丢弃的分组的数量已经严重影响到了网络性能）</p> <p>流量控制和拥塞控制的区别：流量控制是点对点的，仅仅对发送端进行流量限制（通过滑动窗口机制），而拥塞控制是网络全局的问题，涉及网络中的所有主机、路由器</p> <p>拥塞控制的方法：开环控制（预防）和闭环控制（基于反馈）</p> <h2 id="路由算法及协议"><a href="#路由算法及协议" class="header-anchor">#</a> 路由算法及协议</h2> <p>每个结点都维护的有一个路由表（结点可以视作为一个路由器），记录去往另一结点的路径和代价（无向无环图）</p> <h3 id="距离向量路由"><a href="#距离向量路由" class="header-anchor">#</a> 距离向量路由</h3> <blockquote><p>RIP/OSPF</p></blockquote> <p>回顾一下图算法中求解多源最短路径的弗罗伊德（Floyd）算法，遍历所有结点的直接边，通过以下公式更新结点间最短距离</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="53.664ex" height="2.363ex" role="img" focusable="false" viewBox="0 -750 23719.5 1044.2" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.666ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path 07 640Q195 680 154 696T77 713Q68 713 67 716T65 731Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mo>&lt;</mo><msub><mi>V</mi><mi>i</mi></msub><mo>,</mo><msub><mi>V</mi><mi>j</mi></msub><mo>&gt;=</mo><mi>m</mi><mi>i</mi><mi>n</mi><mstyle scriptlevel="0"><mspace width="0.167em"></mspace></mstyle><mo fence="false" stretchy="false">{</mo><mo>&lt;</mo><msub><mi>V</mi><mi>i</mi></msub><mo>,</mo><msub><mi>V</mi><mi>j</mi></msub><mo>&gt;</mo><mo>,</mo><mo>&lt;</mo><msub><mi>V</mi><mi>i</mi></msub><mo>,</mo><msub><mi>V</mi><mi>k</mi></msub><mo>&gt;</mo><mo>+</mo><mo>&lt;</mo><msub><mi>V</mi><mi>k</mi></msub><mo>,</mo><msub><mi>V</mi><mi>j</mi></msub><mo>&gt;</mo><mo fence="false" stretchy="false">}</mo></math></mjx-assistive-mml></mjx-container><p>距离-向量路由算法：每个结点将自身的路由表直接发送给相邻的所有结点，结点收到路由表后，通过和弗罗伊德算法一样的更新公式去更新自身的路由表</p> <p>更新的时机为</p> <img src="/assets/img/image-20230625012639765.12b6087f.png"> <p>向所有相邻结点发送路由表的时机为：每次路由表有所更新后</p> <p><strong>路由环路</strong>（是个啥）的问题：当慢收敛导致路由器收到了无用的路由信息时，很可能发生路由环路</p> <p>举个栗子</p> <img src="/assets/img/image-20230625014804805.0c085480.png"> <img src="/assets/img/image-20230625014825628.cf353fca.png"> <p>维护这样一张路由表</p> <table><thead><tr><th>源结点\目的结点</th> <th>A</th> <th>B</th> <th>C</th> <th>D</th> <th>E</th> <th>F</th></tr></thead> <tbody><tr><td>B</td> <td>5</td> <td>0</td> <td>8</td> <td>12</td> <td>6</td> <td>2</td></tr> <tr><td>D</td> <td>16</td> <td>12</td> <td>6</td> <td>0</td> <td>9</td> <td>10</td></tr> <tr><td>E</td> <td>7</td> <td>6</td> <td>3</td> <td>9</td> <td>0</td> <td>4</td></tr> <tr><td>C</td> <td>min(11,19,12)</td> <td>6</td> <td>0</td> <td>3</td> <td>5</td> <td>min(8,13,9)</td></tr></tbody></table> <p>故 C 到其余结点的最短路径为 [11,6,0,3,5,8]，选 B</p> <p>再举一个栗子</p> <img src="/assets/img/image-20230625015333782.2c90a180.png"> <img src="/assets/img/image-20230625015402530.a1e6bf64.png"> <p>同样的更新策略，已知</p> <table><thead><tr><th>源节点\目的节点</th> <th>A</th> <th>B</th> <th>C</th> <th>D</th></tr></thead> <tbody><tr><td>E</td> <td>8</td> <td>10</td> <td>12</td> <td>6</td></tr></tbody></table> <p>和题给路由表，则有</p> <table><thead><tr><th>源节点\目的节点</th> <th>Net1</th> <th>Net2</th> <th>Net3</th> <th>Net4</th></tr></thead> <tbody><tr><td>E</td> <td>min(9,33,32,28)</td> <td>min(20,45,42,34)</td> <td>min(32,28,28,42)</td> <td>min(44,40,20,30)</td></tr></tbody></table> <p>故 E 到 net 的最短距离为 [9,29,28,20]，故选 D</p> <h3 id="链路状态路由"><a href="#链路状态路由" class="header-anchor">#</a> 链路状态路由</h3> <blockquote><p>BGP</p></blockquote> <p>迪杰斯特拉算法（Dijkstra）：选取当前结点，更新所有直接相连的结点距离（不相邻距离记为 ∞），选定距离最小的结点作为新当前结点，并认为前一结点距离源的最短路径已被确定（和普利姆算法其实一模一样，只不过目的不同，要求权值和最小）</p> <img src="/assets/img/image-20230625013336992.dc8792a8.png"> <p>在链路状态路由算法中，所有结点的路由表是一致的，记录了当前结点到整个网络中其他所有结点的最短路由，每个结点都维护了一个单源最短路径路由表</p> <p>当当前结点路由表发生改变后，将向网络中除直接连接的所有结点发送它完整的路由表，这一操作叫做<strong>洪泛法</strong>，就像泛洪一样把路由表狠狠的群发</p> <p>收到路由表的结点通过迪杰斯特拉算法更新自身到所有节点的最短路径表，即路由表，完成一次更新</p> <h3 id="层次路由"><a href="#层次路由" class="header-anchor">#</a> 层次路由</h3> <p>就是把每个网络的路由转发分为两种，即在自治系统内部的路由和自治系统外部的路由（即连通其他路由器的路由）</p> <img src="/assets/img/image-20230625013857144.8f13a721.png"> <p>每个路由器（自治系统）都知道自身区域如何把分组转发到目的地的细节，但对其他区域的内部结构一概不知</p> <h3 id="路由协议"><a href="#路由协议" class="header-anchor">#</a> 路由协议</h3> <h4 id="rip"><a href="#rip" class="header-anchor">#</a> RIP</h4> <p>应用层协议，RIP 信息通过 UDP 数据报在各路由器之间进行传输，将自身结点到所有结点的单源最短路径传输给相邻的路由器结点，当路由器收到来自相邻结点的包含 RIP 数据的 UDP 数据报后，将根据相邻结点的单源最短路径更新自己到任一结点的单源最短路径，更新规则如下</p> <ul><li>当当前路由表中没有到某一结点的表项，而收到的 UDP 数据报表中存在，直接写入当前路由表，并且将路径长度 +1</li> <li>当当前路由表中存在到 u 的表项，假设长度为 n，但收到的路由表到 u 的距离为 u-2，则更新当前路由表到 u 的表项为收到的那一条，并且长度重写为 n-1</li> <li>其余情况不做改变</li></ul> <p>可以发现，RIP 协议是通过相邻结点的单源最短路径去构造自身的单源最短路径的过程（跳数最少），当距离 &gt;=16 时，我们认为结点不可达</p> <p>RIP 协议在网络状况差的情况下有可能出现慢收敛问题，且开销随结点数增加（网络规模扩大）不断扩大，所以一般适用于较小的网络</p> <h4 id="ospf"><a href="#ospf" class="header-anchor">#</a> OSPF</h4> <p>网络层协议，OSPF 数据通过 IP 分组在路由器间传输，通过洪泛法，将自身结点到达相邻结点的距离发送给每一个结点，每一次发送，每一个结点都将根据 Dijkstra 算法通过每条边的距离以及该结点的可达性更新自身已知的可达结点的最短路径</p> <ul><li>OSPF 采用 Hello 分组来保持和邻居的连接</li></ul> <p>第一次迭代，每个结点将只发送和自身直接相邻的结点的距离给剩余结点；第一次更新，每个结点将获得和自身一次间接相连的所有结点的最短路径</p> <p>以此类推，在不断发送的过程中，结点将不断获取距离自身更远的结点的最短路径距离，以此构造一张统一的路由表</p> <ul><li>为了减小洪泛法的代价，OSPF 还将同一网络按照层次结构分为不同的区域，最上层的称为主干区，在区域内执行洪泛（区域种类增多，传输更复杂）</li></ul> <p>不同于 RIP，OSPF 不存在慢收敛问题，适用于较大的网络</p> <p>另外，OSPF 的路径权重并不是简单的跳数（代价最低），这可以根据相邻结点的传输速率动态调整，也给了网络最优路径判断更灵活的选择</p> <h4 id="bgp-4"><a href="#bgp-4" class="header-anchor">#</a> BGP-4</h4> <p>网络层协议，BGP 信息通过 TCP 连接在网关路由器之间传输，每次传输的数据为路由的完整过程，即整条路径（RIP 和 OSPF 都是传输基于下一跳的路由信息）</p> <p>每个自治系统（AS）维护一个 BGP 发言人，各自治系统通过 BGP 发言人通过 TCP 连接传输 BGP 协议信息构造路由</p> <h3 id="路由器"><a href="#路由器" class="header-anchor">#</a> 路由器</h3> <p>网络层设备，是一个多端口网桥，是下三层中唯一可以分割广播域的设备，为什么网桥不可以呢？他他妈就一个端口，分割个毛线，想分割起码得两个吧</p> <ul><li>想减缓广播风暴：加路由器</li></ul> <p>而中继器、交换机更加不能分割广播域，由这二者连接的设备仍然属于同一局域网，在进行 MAC 帧传输时，将广播到局域网中的每个主机</p> <p>路由表和转发表，后者基于前者</p> <p>路由表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> routing_table<span class="token punctuation">(</span>
    <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span> dist<span class="token punctuation">,</span>
    <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span> mask<span class="token punctuation">,</span>
    <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span> <span class="token identifier"><span class="token punctuation">`</span>next<span class="token punctuation">`</span></span><span class="token punctuation">,</span>
    <span class="token keyword">varchar</span> port
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>转发表</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">create</span> <span class="token keyword">table</span> routing_table<span class="token punctuation">(</span>
    <span class="token keyword">int</span><span class="token punctuation">(</span><span class="token number">32</span><span class="token punctuation">)</span> dist<span class="token punctuation">,</span>
    <span class="token keyword">varchar</span> port
<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>为什么没有距离选项？根据题意自行添加</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/30, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/7aaaab/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">物理和数据链路</div></a> <a href="/pages/96ce78/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">IP 与传输应用</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
