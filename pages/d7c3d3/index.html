MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">Docker 基础<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>编排永远是容器技术的灵魂</p> <h2 id="docker-基础"><a href="#docker-基础" class="header-anchor">#</a> Docker 基础</h2> <h3 id="docker-概述"><a href="#docker-概述" class="header-anchor">#</a> Docker 概述</h3> <p>开发即运维：发布一个项目 jar + Redis + MySQL + ES 需要项目和环境打包发布，环境配置是十分麻烦的，每一个机器都要部署环境，费时费力</p> <ul><li>传统：开发 jar，运维来做部署</li> <li>现在：开发打包部署上线，一套流程 CI/CD 自动化走完</li></ul> <p>Docker 基于环境配置复杂的问题，给出了解决方案，其思路来自于集装箱的隔离机制，将整个运行环境隔离为一个集装箱运行</p> <blockquote><p>本质上，所有的技术都是因为出现了一些问题、不方便或者说繁琐，再去解决和学习，<strong>基于需求开发</strong></p> <p>2010年，就在美国成立了一家公司 dotCloud 做一些 pass 的云计算服务，和 Linux 有关的容器技术，他们将自己的技术（容器化技术）命名就是 Docker</p> <p>Docker 刚刚诞生的时候，没有引起行业注意，后来因为要恰饭 → 开源（2013），越来越多的人发现了 Docker 的优点，几乎每个月都会更新一个版本，2014 年 4 月 9 日，Docker 1.0 发布</p></blockquote> <p>Docker 为什么这么火？十分轻巧（相较于虚拟机）</p> <ul><li>虚拟机，例如在 Win 中装一个 Vmware，通过软件虚拟出来一台或多台计算机 OS</li> <li>容器技术，同样是一种虚拟机技术，但去掉了虚拟硬件层，用 Docker Engine 替换掉 Hypeviscr 和 Guest OS</li></ul> <p>虚拟机面向硬件，而 Docker 面向软件</p> <p>Docker 采用 CS 架构：运行主机（Server）中运行着一个个容器（集装箱）以及后台守护进程（Daemon），保存着镜像，客户机（Client）通过下达命令（API），连接后台守护进程（Daemon），对容器进行操作</p> <p>容器相当于一个简易版的Linux系统（集装箱），运行在宿主机上（鲸背），巨大的仓库像是大海一般支撑着鲸鱼</p> <p>Docker 镜像</p> <ul><li>联合文件系统（UnionFS）：一层一层叠加，拢和成一个文件，即镜像</li> <li>bootfs（boot file system）&amp; rootfs（root file system）</li> <li>kernel（内核）：宿主机内核</li> <li>容器层 → 镜像</li> <li>分层 → 共享资源</li></ul> <h3 id="docker-安装"><a href="#docker-安装" class="header-anchor">#</a> Docker 安装</h3> <p>Windows 机器需要启用虚拟化，开启 Hyper-V 功能，在任务管理器 - 性能 - CPU 右下角可以查看启用情况，如果禁用，需要进 BIOS 开启</p> <p>Windows 下载：<a href="https://www.docker.com/products/docker-desktop/" target="_blank" rel="nofollow noopener noreferrer">Docker Desktop: The #1 Containerization Tool for Developers | Docker<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>安装 WSL2，管理员模式 PowerShell</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>wsl <span class="token parameter variable">--update</span>
<span class="token comment"># 关闭 wsl，当我想删 docker 镜像时提示 system 占用</span>
wsl <span class="token parameter variable">--shutdown</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>启动 DockerDesktop，命令行查看 Docker 版本</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token parameter variable">-v</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>修改镜像源，点击 Desktop 右上角设置 - Docker Engine，修改 &quot;registry-mirrors&quot; 字段</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token punctuation">{</span>
  <span class="token string">&quot;builder&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token string">&quot;gc&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token string">&quot;defaultKeepStorage&quot;</span><span class="token operator">:</span> <span class="token string">&quot;20GB&quot;</span><span class="token punctuation">,</span>
      <span class="token string">&quot;enabled&quot;</span><span class="token operator">:</span> <span class="token boolean">true</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span><span class="token punctuation">,</span>
  <span class="token string">&quot;experimental&quot;</span><span class="token operator">:</span> <span class="token boolean">false</span><span class="token punctuation">,</span>
  <span class="token string">&quot;registry-mirrors&quot;</span><span class="token operator">:</span> <span class="token punctuation">[</span>
    <span class="token string">&quot;https://hub-mirror.c.163.com&quot;</span><span class="token punctuation">,</span>
    <span class="token string">&quot;https://mirror.ccs.tencentyun.com&quot;</span><span class="token punctuation">,</span>
    <span class="token string">&quot;https://mirrors.aliyun.com&quot;</span>
  <span class="token punctuation">]</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>拉取<code>hello-world</code>镜像进行测试</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> run hello-world
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>出现 Hello from Docker 说明安装成功</p> <p>记得把镜像本地位置改到 D 盘（我 TM C 盘炸了）：打开<code>Docker Desktop → Settings → Resources → Advanced → Disk image location</code>，改成<code>D:\Docker</code>，点 Apply，Docker Desktop 会自己把数据搬过去</p> <h3 id="docker-命令"><a href="#docker-命令" class="header-anchor">#</a> Docker 命令</h3> <p>系统服务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 重启docker服务</span>
<span class="token function">service</span> <span class="token function">docker</span> restart
<span class="token comment"># 用镜像启动容器</span>
<span class="token function">docker</span> run my_image
<span class="token comment"># 交互式运行容器</span>
<span class="token function">docker</span> run <span class="token parameter variable">-it</span> my_image
<span class="token comment"># 设置对外开放端口和部署端口</span>
<span class="token function">docker</span> run <span class="token parameter variable">-p</span> <span class="token number">8000</span>:8080 my_image
<span class="token comment"># 随机分配端口</span>
<span class="token function">docker</span> run <span class="token parameter variable">-P</span> my_image
<span class="token comment"># 后台运行</span>
<span class="token function">docker</span> run <span class="token parameter variable">-d</span> my_image
<span class="token comment"># 给容器命名</span>
<span class="token function">docker</span> run <span class="token parameter variable">--name</span> my_image
<span class="token comment"># 退出容器</span>
<span class="token builtin class-name">exit</span>
<span class="token comment"># 将容器挂起</span>
ctrl+q+p
<span class="token comment"># 开启容器</span>
<span class="token function">docker</span> start my_container
<span class="token comment"># 重启容器</span>
<span class="token function">docker</span> restart my_container
<span class="token comment"># 停止容器</span>
<span class="token function">docker</span> stop my_container
<span class="token comment"># 强制停止容器</span>
<span class="token function">docker</span> <span class="token function">kill</span> my_container
<span class="token comment"># 进入容器</span>
<span class="token function">docker</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> my_container /bin/bash 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br></div></div><p>查询</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 查看docker版本</span>
<span class="token function">docker</span> version
<span class="token comment"># 查看docker信息</span>
<span class="token function">docker</span> info
<span class="token comment"># 查询命令</span>
<span class="token function">docker</span> <span class="token parameter variable">--help</span>
<span class="token comment"># 正在运行的容器</span>
<span class="token function">docker</span> <span class="token function">ps</span>
<span class="token comment"># 最近运行的容器信息</span>
<span class="token function">docker</span> <span class="token function">ps</span> <span class="token parameter variable">-l</span>
<span class="token comment"># 所有运行过的容器信息</span>
<span class="token function">docker</span> <span class="token function">ps</span> <span class="token parameter variable">-a</span>
<span class="token comment"># 正在运行的容器ID</span>
<span class="token function">docker</span> <span class="token function">ps</span> <span class="token parameter variable">-q</span>
<span class="token comment"># 看镜像（-l -a -q 与5、6、7同理）</span>
<span class="token function">docker</span> images
<span class="token comment"># 在远端查询镜像</span>
<span class="token function">docker</span> search
<span class="token comment"># 查看容器具体信息</span>
<span class="token function">docker</span> inspect
<span class="token comment"># 查看容器内运行进程</span>
<span class="token function">docker</span> <span class="token function">top</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>删除</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 删除容器</span>
<span class="token function">docker</span> <span class="token function">rm</span> my_container
<span class="token comment"># 强制删除容器</span>
<span class="token function">docker</span> <span class="token function">rm</span> <span class="token parameter variable">-f</span> my_container
<span class="token comment"># 删除所有容器</span>
<span class="token function">docker</span> <span class="token function">rm</span> <span class="token parameter variable">-f</span> $ <span class="token punctuation">(</span>docker <span class="token function">ps</span> -qa<span class="token punctuation">)</span>
<span class="token comment"># 删除镜像</span>
<span class="token function">docker</span> rmi my_image
<span class="token comment"># 强制删除镜像</span>
<span class="token function">docker</span> rmi <span class="token parameter variable">-f</span> my_image
<span class="token comment"># 删除所有镜像</span>
<span class="token function">docker</span> rmi <span class="token parameter variable">-f</span> $ <span class="token punctuation">(</span>docker images -qa<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>构建运行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 拉镜像</span>
<span class="token function">docker</span> pull my_image:latest
<span class="token comment"># 用容器生成镜像</span>
<span class="token function">docker</span> commit <span class="token parameter variable">-m</span><span class="token operator">=</span><span class="token string">&quot;my_new_image&quot;</span> <span class="token parameter variable">-a</span><span class="token operator">=</span><span class="token string">&quot;northboat&quot;</span>
<span class="token comment"># 用dockerfile生成镜像</span>
<span class="token function">docker</span> build <span class="token parameter variable">-f</span> /data/images/test/Dockerfile <span class="token parameter variable">-t</span> test_image
<span class="token comment"># 用 my_image 生成容器 my_container，用容器联通容器</span>
<span class="token function">docker</span> run i --volumes-from my_container <span class="token parameter variable">-name</span> my_container my_image
<span class="token comment"># 主机和容器之间共享数据卷</span>
<span class="token function">docker</span> run <span class="token parameter variable">-it</span> <span class="token parameter variable">-v</span>  /data/volume/container1:/data my_container
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>docker export 导出容器文件系统</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 导出容器文件系统</span>
<span class="token function">docker</span> <span class="token builtin class-name">export</span> my_container <span class="token parameter variable">-o</span> rootfs.tar

<span class="token comment"># 重新导入为镜像（需手动指定配置）</span>
<span class="token function">docker</span> <span class="token function">import</span> rootfs.tar my_new_image:latest
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>挂载数据卷</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> run <span class="token parameter variable">-v</span> /myDataVolume:/containerVolume 镜像名称
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>拷贝指定文件到指定目录</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker cp 容器名:/containerVolume/  /myDataVolume/
docker cp /myVolume/  容器名:/containerVolume/
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>监听容器状态</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> stats --no-stream <span class="token parameter variable">--format</span> <span class="token string">&quot;{}&quot;</span> 容器名
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>--no-stream：不持续输出，即打印当前状态</li> <li>--format：自定义输出格式（json）</li></ul> <p>重连容器</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> 容器名 /bin/bash
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>将 Web 项目挂在 tomcat 容器内</p> <ul><li>启动 tomcat 容器，将 war 包复制进容器 /usr/local/tomcat/webapps/ 目录即可</li> <li>容器会自动解压war包，然后通过 ip:8080/NEUQHelper 即可访问项目</li></ul> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token function">cp</span> /java/NEUQHelper.war de9dc1076633:/usr/local/tomcat/webapps/
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="image-使用"><a href="#image-使用" class="header-anchor">#</a> Image 使用</h3> <h4 id="mysql"><a href="#mysql" class="header-anchor">#</a> MySQL</h4> <p>一般不会这么做，持久化不稳定，多了一层通信</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> pull mysql:5.7

<span class="token function">docker</span> run <span class="token parameter variable">-it</span> <span class="token parameter variable">--name</span> My-mysql <span class="token parameter variable">-p</span> <span class="token number">13306</span>:3306 <span class="token parameter variable">-e</span> <span class="token assign-left variable">MYSQL_ROOT_PASSWORD</span><span class="token operator">=</span><span class="token number">123456</span> 84164b03fa2e（镜像id）
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li><p>--name 自定义设置容器名称</p></li> <li><p>-p 后为映射端口 从linux上的 13306 映射为容器中的 3306端口</p></li> <li><p>-e 后设置 mysql 登录密码</p></li></ul> <p>输入密码登录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> 064c6bea326d /bin/bash
mysql <span class="token parameter variable">-h</span> localhost <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h4 id="tomcat"><a href="#tomcat" class="header-anchor">#</a> Tomcat</h4> <blockquote><p>古法部署 war 包：将 war 包 docker cp 进 tomcat 容器的 webapp 目录下，将自动解压运行</p></blockquote> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> pull tomcat
<span class="token function">docker</span> run <span class="token parameter variable">-it</span> <span class="token parameter variable">-d</span> <span class="token parameter variable">--name</span> mycat <span class="token parameter variable">-p</span> <span class="token number">8080</span>:8080 tomcat
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ul><li><p>--name 自定义设置容器名称</p></li> <li><p>-d 后台启动</p></li> <li><p>-p 设置端口（8080）</p></li></ul> <p>本地访问</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>localhost:8080
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>会报 404，因为默认的 webapps 目录为空，需要进入 tomcat 容器，将网页部署到默认目录即可</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> mycat /bin/bash

<span class="token function">mv</span> webapps webapps1
<span class="token function">mv</span> webapps.dist webapps
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>ctrl+p+q 退出容器，重新访问 8080 端口</p> <h4 id="projector-docker"><a href="#projector-docker" class="header-anchor">#</a> Projector Docker</h4> <p>一个远程的网页 IDEA（开发机）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> pull projectorimages/projector-idea-c

<span class="token function">docker</span> run <span class="token parameter variable">--rm</span> <span class="token parameter variable">-p</span> <span class="token number">8887</span>:8887 <span class="token parameter variable">-it</span> projectorimages/projector-idea-c
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>可以通过 <code>ip:8887</code> 访问 idea，可以通过 docker 命令将容器内数据拷贝至宿主机</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> <span class="token function">cp</span> 容器名:目录 宿主机目录
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="docker-快照"><a href="#docker-快照" class="header-anchor">#</a> Docker 快照</h3> <blockquote><p>制作快照 = 制作运行时容器的镜像</p></blockquote> <p>在 Overlay 的大前提下，理论上只要拿到容器的原有镜像（lower 层），加上 upper 层的增量，就可以完整还原一个容器运行时</p> <ul><li>lower 层数据好拿，直接根据原镜像启动一个容器，其初始状态就包含了 lower 数据</li> <li>upper 层则需要从原容器中进行拷贝</li></ul> <p>基于这样的思路，可以实现“定时拷贝 + 旁路制作”的快照持久化方案</p> <ul><li>在 K8s 母机上部署一个 rsync 定时任务，按固定周期将容器的 upper 层数据增量同步到工作机，工作机根据原镜像启动容器，而后拷贝其 upper 数据，基于这个新的运行时进行打包镜像得到持久化的快照</li></ul> <p>工作流程</p> <ol><li>控制面任务触发
<ul><li>当容器启动 start 时，触发定时任务下发，每 30 分钟执行一次 rsync 同步 upper 层数据至工作机</li> <li>当容器“关闭”时，如 stop 和 destroy，触发快照制作，工作机根据原镜像和 upper 增量制作 image 并上传镜像仓库</li></ul></li> <li>定时任务服务
<ul><li>提供 cronjob 注册服务</li> <li>基于 rsync 进行 upper 层数据传输</li> <li>callback 回调控制面更新定时同步任务状态</li></ul></li> <li>工作机快照制作服务
<ul><li>提供 trigger 接口触发快照制作</li> <li>基于 dockerd 启动并制作 image</li> <li>callback 回调控制面更新快照制作任务状态</li></ul></li></ol> <p>具体而言</p> <ul><li>控制面维护 backup、task 和 queue 三张表，queue 记录容器的状态流转（通过 status 字段维护 gpu 的生命周期），backup 记录定时任务元数据（例如备份周期、备份环境信息、工作机信息等等），task 记录定时任务和快照制作任务的执行记录（包括任务 status、任务参数和结构等等信息）</li> <li>daemon 服务基于 robfig/cron 框架实现定时任务注册和管理</li> <li>snapshot-server 基于 docker client，根据原镜像，按照 <code>create → start → stop → copy → make_image</code> 的流程完整快照制作</li></ul> <p>注意，所有的操作无论成功与否，都要回调控制面的 callback 实现业务逻辑的闭环，callback 很关键</p> <h2 id="docker-java-api"><a href="#docker-java-api" class="header-anchor">#</a> Docker Java API</h2> <p>使用<code>DockerClient API</code>，用 Java 代码远程创建、使用并销毁容器，文档：<a href="https://docs.docker.com/engine/api/" target="_blank" rel="nofollow noopener noreferrer">DockerClient API Docs<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="ssl-证书配置"><a href="#ssl-证书配置" class="header-anchor">#</a> SSL 证书配置</h3> <blockquote><p>原文链接：https://blog.csdn.net/oceanyang520/article/details/101563309</p></blockquote> <p>1 新建一个目录certs，在目录执行以下命令，输入两次密码，需要记住后面会用到</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl genrsa <span class="token parameter variable">-aes256</span> <span class="token parameter variable">-out</span> ca-key.pem <span class="token number">4096</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>2 执行以下命令，输入密码，然后依次输入国家是 CN，省例如是Shanghai、市Shanghai、组织名称、组织单位、姓名或服务器名、邮件地址，都可以随意填写</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl req <span class="token parameter variable">-new</span> <span class="token parameter variable">-x509</span> <span class="token parameter variable">-days</span> <span class="token number">365</span> <span class="token parameter variable">-key</span> ca-key.pem <span class="token parameter variable">-sha256</span> <span class="token parameter variable">-out</span> ca.pem
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>3 执行生成服务器端key证书文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl genrsa <span class="token parameter variable">-out</span> server-key.pem <span class="token number">4096</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>4 ip需要换成自己服务器的外网ip地址，或者域名都可以</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl req <span class="token parameter variable">-subj</span> <span class="token string">&quot;/CN=公网ip&quot;</span> <span class="token parameter variable">-sha256</span> <span class="token parameter variable">-new</span> <span class="token parameter variable">-key</span> server-key.pem <span class="token parameter variable">-out</span> server.csr
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>5 配置白名单，多个用逗号隔开，例如： <code>IP:192.168.1.111,IP:0.0.0.0</code>，这里需要注意，虽然<code>0.0.0.0</code>可以匹配任意，但是仍然需要配置你的服务器外网ip，如果省略会造成错误，后面会讲到</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> subjectAltName <span class="token operator">=</span> IP:**公网ip**,IP:0.0.0.0 <span class="token operator">&gt;&gt;</span> extfile.cnf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>6 把 extendedKeyUsage = serverAuth 键值设置到extfile.cnf文件里，限制扩展只能用在服务器认证</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> extendedKeyUsage <span class="token operator">=</span> serverAuth <span class="token operator">&gt;&gt;</span> extfile.cnf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>7 执行以下命令，输入之前设置的密码，然后会生成签名的证书</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl x509 <span class="token parameter variable">-req</span> <span class="token parameter variable">-days</span> <span class="token number">365</span> <span class="token parameter variable">-sha256</span> <span class="token parameter variable">-in</span> server.csr <span class="token parameter variable">-CA</span> ca.pem <span class="token parameter variable">-CAkey</span> ca-key.pem <span class="token punctuation">\</span>-CAcreateserial <span class="token parameter variable">-out</span> server-cert.pem <span class="token parameter variable">-extfile</span> extfile.cnf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>8 生成例如idea等客户端需要用到的密钥文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl genrsa <span class="token parameter variable">-out</span> key.pem <span class="token number">4096</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>9 生成客户端签名请求需要用到的临时文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl req <span class="token parameter variable">-subj</span> <span class="token string">'/CN=client'</span> <span class="token parameter variable">-new</span> <span class="token parameter variable">-key</span> key.pem <span class="token parameter variable">-out</span> client.csr
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>10 继续设置证书扩展属性</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> extendedKeyUsage <span class="token operator">=</span> clientAuth <span class="token operator">&gt;&gt;</span> extfile.cnf
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>11 输入之前的密码生成认证证书，生成正式签名证书</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>openssl x509 <span class="token parameter variable">-req</span> <span class="token parameter variable">-days</span> <span class="token number">365</span> <span class="token parameter variable">-sha256</span> <span class="token parameter variable">-in</span> client.csr <span class="token parameter variable">-CA</span> ca.pem <span class="token parameter variable">-CAkey</span> ca-key.pem <span class="token punctuation">\</span>-CAcreateserial <span class="token parameter variable">-out</span> cert.pem <span class="token parameter variable">-extfile</span> extfile.cnf 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>12 删除生成的临时文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">rm</span> <span class="token parameter variable">-rf</span> client.csr server.csr
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>13 修改证书为只读权限保证证书安全</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">chmod</span> <span class="token parameter variable">-v</span> 0400 ca-key.pem key.pem server-key.pem
<span class="token function">chmod</span> <span class="token parameter variable">-v</span> 0444 ca.pem server-cert.pem cert.pem
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>14 复制服务端需要用到的证书到docker配置目录下便于识别使用：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">cp</span> server-cert.pem ca.pem server-key.pem /etc/docker/
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>15 修改docker配置</p> <p>如果是离线手动安装的docker，通常情况下是这个文件：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> /etc/systemd/system/docker.service
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后在<code>ExecStart=/usr/bin/dockerd</code>后面追加一个 \ ,然后黏贴证书的配置，大概如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>ExecStart=/usr/bin/dockerd \
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>加上以下部分</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>--tlsverify \ 
--tlscacert=/etc/docker/ca.pem \ 
--tlscert=/etc/docker/server-cert.pem \ 
--tlskey=/etc/docker/server-key.pem \ 
-H tcp://0.0.0.0:2375 \ 
-H unix:///var/run/docker.sock \  
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>但是，如果是自动使用yum安装的，服务文件地址可能是这个：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> /lib/systemd/system/docker.service
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后加上加粗的部分即可</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>ExecStart=/usr/bin/dockerd-current \

--add-runtime docker-runc=/usr/libexec/docker/docker-runc-current \
--default-runtime=docker-runc \
--exec-opt native.cgroupdriver=systemd \
--userland-proxy-path=/usr/libexec/docker/docker-proxy-current \
--init-path=/usr/libexec/docker/docker-init-current \
--seccomp-profile=/etc/docker/seccomp.json \
$OPTIONS \
$DOCKER_STORAGE_OPTIONS \
$DOCKER_NETWORK_OPTIONS \
$ADD_REGISTRY \
$BLOCK_REGISTRY \
$INSECURE_REGISTRY \
$REGISTRIES
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>在首行后加上以下部分</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>--tlsverify \ 
--tlscacert=/etc/docker/ca.pem \ 
--tlscert=/etc/docker/server-cert.pem \ 
--tlskey=/etc/docker/server-key.pem \ 
-H tcp://0.0.0.0:2375 \ 
-H unix:///var/run/docker.sock \  
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>16 开放防火墙的2375的端口，若为阿里云服务器，需在网页上防火墙自定义添加规则</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>firewall-cmd <span class="token parameter variable">--zone</span><span class="token operator">=</span>public --add-port<span class="token operator">=</span><span class="token number">2375</span>/tcp <span class="token parameter variable">--permanent</span>

firewall-cmd <span class="token parameter variable">--reload</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>20 配置idea</p> <ol><li>点击 idea 第一行菜单<code>run -&gt; edit configurations</code>，然后点击 + 号，添加 docker 配置，选择<code>Dockerfile</code></li> <li>然后选择 server 属性，弹出 docker server 配置</li> <li>engine api url：<code>https://公网IP:2375</code></li> <li>certificates folder：<code>D:\buy\ca-docker</code></li></ol> <p>连接成功将显示 seccussful</p> <p>21 shell 脚本</p> <p>上述命令脚本（cert.sh）</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token assign-left variable">SERVER</span><span class="token operator">=</span><span class="token string">&quot;172.16.75.201&quot;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><ul><li>init：初始化 docker 容器</li> <li>kill：停止并销毁容器</li> <li>test：测试镜像并执行编译运行命令</li></ul> <p>run 方法实现</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">//去除了时间的单位ms（为了累计计算总时间）</span>

    <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">Object</span><span class="token punctuation">&gt;</span></span> res <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">HashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">while</span><span class="token punctuation">(</span>state<span class="token punctuation">.</span><span class="token function">running</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;运行结束&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br></div></div><p>Good</p> <h2 id="dockerfile-构建"><a href="#dockerfile-构建" class="header-anchor">#</a> Dockerfile 构建</h2> <h3 id="dockerfile-多阶段构建"><a href="#dockerfile-多阶段构建" class="header-anchor">#</a> Dockerfile 多阶段构建</h3> <p>Docker 的核心诉求是：为应用程序提供运行环境，同时隔离运行在主机上不同进程</p> <p>Dockerfile 定义了如何构建一个这样一个环境，例如</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> golang:1.20</span>
<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> go build -o main .</span>
<span class="token instruction"><span class="token keyword">CMD</span> [<span class="token string">&quot;./main&quot;</span>]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><ol><li>使用官方<code>golang:1.20</code>镜像作为构建环境</li> <li>把所有文件复制到<code>/app</code></li> <li>在容器内构建 Go 可执行文件<code>main</code></li> <li>设置默认执行命令为<code>./main</code></li></ol> <p>在本地执行以下命令来构建和运行镜像，即：在当前目录下查找<code>Dockerfile</code>，然后构建一个镜像，并命名为<code>myapp</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> build <span class="token parameter variable">-t</span> myapp <span class="token builtin class-name">.</span> <span class="token operator">&amp;&amp;</span> <span class="token function">docker</span> run myapp
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>其中</p> <table><thead><tr><th>部分</th> <th>说明</th></tr></thead> <tbody><tr><td><code>docker build</code></td> <td>表示你要构建一个 Docker 镜像</td></tr> <tr><td><code>-t myapp</code></td> <td>给镜像起个名字（tag）叫 <code>myapp</code>，等同于 <code>--tag myapp</code></td></tr> <tr><td><code>.</code></td> <td>表示根据<strong>当前目录</strong>构建上下文（会将此目录的文件发送给 Docker 引擎使用）</td></tr></tbody></table> <p>这样的构建是有问题的：使用了 <strong>构建 + 运行</strong>混合的镜像（未分阶段）</p> <ol><li><code>golang:1.20</code> 镜像很大（约 1GB+），包含编译器、工具链，不适合运行时部署</li> <li>生成的镜像包含了源代码和构建缓存，不干净、不安全</li></ol> <p>就是说，如果像上述做法打包，将一次性将 Go 源码、编译工具链（Go Build）、编译缓存和可执行文件都打包，构建后镜像至少高达 800MB+，这对于部署、安全、传输都很不妙</p> <p>正确的做法是多阶段构建（Multi-stage build）</p> <ul><li>多阶段构建是一种在一个 Dockerfile 中使用多个<code>FROM</code>段落，用前面的镜像构建产物，最后用一个干净的基础镜像打包最终产物，从而实现构建运行分离</li></ul> <p>多阶段构建：只打包“最终产物”，其核心思想是：用一个镜像“编译”，再用另一个镜像“运行”</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token comment"># === 第一阶段：构建镜像（builder）</span>
<span class="token instruction"><span class="token keyword">FROM</span> golang:1.20 <span class="token keyword">AS</span> builder</span>
<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>
<span class="token instruction"><span class="token keyword">COPY</span> go.mod go.sum ./</span>
<span class="token instruction"><span class="token keyword">RUN</span> go mod download</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> CGO_ENABLED=0 GOOS=linux go build -o main .</span>

<span class="token comment"># === 第二阶段：运行镜像（干净、最小）</span>
<span class="token instruction"><span class="token keyword">FROM</span> alpine:latest</span>
<span class="token instruction"><span class="token keyword">WORKDIR</span> /root/</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span></span> /app/main .</span>

<span class="token instruction"><span class="token keyword">CMD</span> [<span class="token string">&quot;./main&quot;</span>]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>第一阶段：构建产物，这是 go 项目的常规构建过程</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> golang:1.20 <span class="token keyword">AS</span> builder</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>用官方带编译器的 Golang 镜像构建可执行文件</li> <li><code>AS builder</code>给这个阶段命个名字，后面可以引用</li></ul> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code>go.mod go.sum ./ &amp;&amp; RUN go mod download
<span class="token instruction"><span class="token keyword">COPY</span> . . &amp;&amp; RUN go build -o main .</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>第二阶段：最小运行时镜像</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> alpine:latest</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>超小镜像（仅 5MB 左右）</li> <li>不含 Go 编译器，不含源码，不含构建缓存 —— 非常安全干净</li></ul> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span></span> /app/main .</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>仅把前面构建出的可执行文件 <code>main</code> 复制过来，其它统统不要</li></ul> <p>这样将获得一个 20MB 左右的运行镜像，用于生产部署，而构建镜像作为临时产物将被丢弃掉，不参与最后的部署</p> <table><thead><tr><th>优点</th> <th>描述</th></tr></thead> <tbody><tr><td>更小的镜像</td> <td>只包含运行必需文件</td></tr> <tr><td>更安全</td> <td>去除了构建工具、源码等敏感内容</td></tr> <tr><td>更快部署</td> <td>镜像传输快，容器启动快</td></tr> <tr><td>适合 CI/CD</td> <td>用<code>docker build</code>一次构建，产出即部署级镜像</td></tr></tbody></table> <p>在当前目录下测试构建运行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> build <span class="token parameter variable">-t</span> myMultiApp <span class="token builtin class-name">.</span>
<span class="token function">docker</span> run <span class="token parameter variable">--rm</span> myMkultiApp
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>简单来说：多阶段构建 = 构建与运行分离，使用“胖”镜像编译代码，用“瘦”镜像跑服务</p> <h3 id="go-应用容器化"><a href="#go-应用容器化" class="header-anchor">#</a> Go 应用容器化</h3> <p>将一个 Golang 微服务打包为镜像，其 Dockerfile 分为 development 和 production 两个阶段，分别用于编译和运行</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> golang:1.20.2-alpine3.17 <span class="token keyword">AS</span> development</span>
<span class="token instruction"><span class="token keyword">ARG</span> DIR=/opt/solution/codev-transport-daemon</span>
<span class="token instruction"><span class="token keyword">ENV</span> GOINSECURE <span class="token string">&quot;*.oa.com,*.woa.com&quot;</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> GOPROXY <span class="token string">&quot;https://mirrors.tencent.com/go/,direct&quot;</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> GOSUMDB <span class="token string">&quot;off&quot;</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> TZ=Asia/Shanghai</span>
<span class="token instruction"><span class="token keyword">ADD</span> . <span class="token variable">$DIR</span></span>
<span class="token instruction"><span class="token keyword">WORKDIR</span> <span class="token variable">$DIR</span></span>
<span class="token instruction"><span class="token keyword">RUN</span> apk add build-base</span>
<span class="token instruction"><span class="token keyword">RUN</span> rm -rf .vscode &amp;&amp; <span class="token operator">\</span>
    cd backend/codev-transport-daemon/ &amp;&amp; go mod tidy &amp;&amp; go build -ldflags=<span class="token string">&quot;-s -w&quot;</span> -o ../../main cmd/main.go</span>

<span class="token instruction"><span class="token keyword">FROM</span> alpine:3.17 <span class="token keyword">AS</span> production</span>
<span class="token instruction"><span class="token keyword">ARG</span> DIR=/opt/solution/codev-transport-daemon</span>
<span class="token instruction"><span class="token keyword">WORKDIR</span> <span class="token variable">$DIR</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> TZ=Asia/Shanghai</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">development</span></span> <span class="token variable">$DIR</span>/main .</span>
<span class="token comment"># rsync：transport-daemon 通过 rsync 把容器 overlay2 UpperDir 推送到 snapshot-server。</span>
<span class="token comment"># alpine 3.17 apk 源的 rsync 为 3.2.7（&gt;=3.2.3），支持 --mkpath 自动创建多级目标目录（envId/backupUid）。</span>
<span class="token instruction"><span class="token keyword">RUN</span> apk add --no-cache tzdata curl busybox-extras rsync</span>
<span class="token instruction"><span class="token keyword">CMD</span> [<span class="token string">&quot;./main&quot;</span>]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>第一阶段，编译</p> <table><thead><tr><th style="text-align:left;">指令</th> <th style="text-align:left;">作用分析</th></tr></thead> <tbody><tr><td style="text-align:left;"><code>FROM golang:1.20.2-alpine3.17 AS development</code></td> <td style="text-align:left;">基于 Alpine 轻量版 Go 镜像，命名阶段为 <code>development</code></td></tr> <tr><td style="text-align:left;"><code>ARG DIR=/opt/solution/codev-transport-daemon</code></td> <td style="text-align:left;">定义构建参数，指定容器内的工作目录路径</td></tr> <tr><td style="text-align:left;"><code>ENV GOINSECURE &quot;*.oa.com,*.woa.com&quot;</code> <code>ENV GOPROXY &quot;https://mirrors.tencent.com/go/,direct&quot;</code> <code>ENV GOSUMDB &quot;off&quot;</code></td> <td style="text-align:left;">网络配置</td></tr> <tr><td style="text-align:left;"><code>ADD . $DIR</code></td> <td style="text-align:left;">将当前构建上下文（宿主机项目根目录）全部复制到容器内的 <code>$DIR</code> 路径</td></tr> <tr><td style="text-align:left;"><code>WORKDIR $DIR</code></td> <td style="text-align:left;">切换工作目录</td></tr> <tr><td style="text-align:left;"><code>RUN apk add build-base</code></td> <td style="text-align:left;">安装 Alpine 下的编译工具链（gcc、make、musl-dev 等）。因为 Go 代码中如果用了 CGO（比如某些系统调用或 SQLite 驱动），需要 C 编译器</td></tr> <tr><td style="text-align:left;"><code>RUN rm -rf .vscode &amp;&amp; cd backend/codev-transport-daemon/ &amp;&amp; go mod tidy &amp;&amp; go build -ldflags=&quot;-s -w&quot; -o ../../main cmd/main.go</code></td> <td style="text-align:left;">核心编译步骤：<br>- 删除 IDE 配置文件（避免拷贝进镜像）<br>- 进入实际的源码子目录 <code>backend/codev-transport-daemon/</code><br>- <code>go mod tidy</code> 拉取依赖（注意：这一步每次构建都会重新拉取，如果依赖不变可以优化缓存）<br>- <code>-ldflags=&quot;-s -w&quot;</code> 去除调试信息和 DWARF 表，减小二进制体积<br>- 编译 <code>cmd/main.go</code>，输出到上两级目录的 <code>main</code> 文件（即 <code>$DIR/main</code>）</td></tr></tbody></table> <p>第二阶段，运行环境</p> <table><thead><tr><th style="text-align:left;">指令</th> <th style="text-align:left;">作用分析</th></tr></thead> <tbody><tr><td style="text-align:left;"><code>FROM alpine:3.17 AS production</code></td> <td style="text-align:left;">使用纯净的 Alpine 3.17 作为基础镜像，体积极小（约 5MB）</td></tr> <tr><td style="text-align:left;"><code>ARG DIR=/opt/solution/codev-transport-daemon</code> <code>WORKDIR $DIR</code></td> <td style="text-align:left;">复用路径参数，创建工作目录</td></tr> <tr><td style="text-align:left;"><code>ENV TZ=Asia/Shanghai</code></td> <td style="text-align:left;">设置时区（Alpine 默认 UTC，不设置则日志时间会差 8 小时）</td></tr> <tr><td style="text-align:left;"><code>COPY --from=development $DIR/main .</code></td> <td style="text-align:left;"><strong>关键步骤</strong>：仅从上一阶段拷贝编译好的二进制文件 <code>main</code> 到当前镜像。<strong>不包含源码和 Go 编译器</strong>，最终镜像体积很小</td></tr> <tr><td style="text-align:left;"><code>RUN apk add --no-cache tzdata curl busybox-extras rsync</code></td> <td style="text-align:left;">安装运行时依赖：<br>- <code>tzdata</code> 配合上面的 TZ 生效<br>- <code>curl</code>/<code>busybox-extras</code> 用于健康检查或调试<br>- <strong><code>rsync</code> 是核心</strong>：注释提到 <code>&gt;=3.2.3</code> 支持 <code>--mkpath</code>，说明该服务需要将容器内的 <code>overlay2 UpperDir</code> 通过 rsync 推送到外部快照服务器（snapshot-server），<code>--mkpath</code> 能自动创建 <code>envId/backupUid</code> 等多级目标目录</td></tr> <tr><td style="text-align:left;"><code>CMD [&quot;./main&quot;]</code></td> <td style="text-align:left;">容器启动时直接运行编译好的二进制程序</td></tr></tbody></table> <h2 id="docker-compose"><a href="#docker-compose" class="header-anchor">#</a> Docker Compose</h2> <h3 id="docker-compose-启动"><a href="#docker-compose-启动" class="header-anchor">#</a> docker-compose 启动</h3> <p>Docker-Compose：定义多个 Docker 容器的运行方式，Docker 自带的编排工具，包含两个关键的配置文件</p> <ul><li>compose.yaml：用声明式配置描述服务间的依赖关系、网络拓扑和数据持久化</li> <li>dockerfile：定义 Image 镜像的构建流程</li></ul> <p>以部署 RXResume 为例：<a href="https://github.com/amruthpillai/reactive-resume" target="_blank" rel="nofollow noopener noreferrer">amruthpillai/reactive-resume<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，我需要下载他某一次提交的历史版本，直接拼接 commit hash 下载 zip 包</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 仓库链接 + /archive + /commit-hash.zip</span>
https://github.com/AmruthPillai/Reactive-Resume/archive/51c366310e3ffa5588e7236179ae04b25f590aca.zip
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>看看他的 compose.yaml</p> <ul><li>一个大象数据库</li> <li>一个 seaweedfs 对象存储</li> <li>初始化 Bucket 一次性任务，用于初始化 MinIO</li> <li>Reactive Resume 主应用，一个基于 NodeJS 的前端进程</li></ul> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">name</span><span class="token punctuation">:</span> reactive_resume

<span class="token key atrule">services</span><span class="token punctuation">:</span>
  <span class="token key atrule">postgres</span><span class="token punctuation">:</span>
    <span class="token key atrule">image</span><span class="token punctuation">:</span> postgres<span class="token punctuation">:</span>latest
    <span class="token key atrule">restart</span><span class="token punctuation">:</span> unless<span class="token punctuation">-</span>stopped
    <span class="token key atrule">networks</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> data_network
    <span class="token key atrule">environment</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> POSTGRES_DB=postgres
      <span class="token punctuation">-</span> POSTGRES_USER=postgres
      <span class="token punctuation">-</span> POSTGRES_PASSWORD=postgres
    <span class="token key atrule">ports</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> <span class="token string">&quot;5432:5432&quot;</span>
    <span class="token key atrule">volumes</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> postgres_data<span class="token punctuation">:</span>/var/lib/postgresql
    <span class="token key atrule">healthcheck</span><span class="token punctuation">:</span>
      <span class="token key atrule">test</span><span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token string">&quot;CMD&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;pg_isready&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-U&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;postgres&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-d&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;postgres&quot;</span><span class="token punctuation">]</span>
      <span class="token key atrule">start_period</span><span class="token punctuation">:</span> 10s

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br><span class="line-number">72</span><br><span class="line-number">73</span><br><span class="line-number">74</span><br><span class="line-number">75</span><br><span class="line-number">76</span><br><span class="line-number">77</span><br><span class="line-number">78</span><br><span class="line-number">79</span><br><span class="line-number">80</span><br><span class="line-number">81</span><br><span class="line-number">82</span><br><span class="line-number">83</span><br><span class="line-number">84</span><br><span class="line-number">85</span><br><span class="line-number">86</span><br><span class="line-number">87</span><br><span class="line-number">88</span><br><span class="line-number">89</span><br><span class="line-number">90</span><br><span class="line-number">91</span><br><span class="line-number">92</span><br><span class="line-number">93</span><br><span class="line-number">94</span><br><span class="line-number">95</span><br><span class="line-number">96</span><br><span class="line-number">97</span><br><span class="line-number">98</span><br><span class="line-number">99</span><br></div></div><p>一些字段说明</p> <table><thead><tr><th>字段</th> <th>说明</th></tr></thead> <tbody><tr><td><code>name: reactive_resume</code></td> <td>定义了整个 Compose 项目的名称，Docker 会以此作为前缀命名容器、网络、数据卷（如<code>reactive_resume-postgres-1</code>），方便统一管理</td></tr> <tr><td><code>services</code></td> <td>定义所有容器服务</td></tr> <tr><td><code>volumes</code></td> <td>声明了 3 个数据卷（named volumes）没有指定 driver_opts，使用默认的 local 驱动，容器删除后数据保留，数据与容器分离</td></tr> <tr><td><code>networks</code></td> <td>声明了 2 个 自定义桥接网络（bridge network），实现网络隔离</td></tr></tbody></table> <p>启动流程</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>docker compose up
  │
  ├→ postgres start → health check passed ─────────────┐
  |→ seaweedfs start → health check passed ────────────│
  │     |                                              │
  │     |→ seaweedfs_create_bucket → exit 1 ───────────|
  │                                                    ↓
  └─────────────────────────────────────► reactive_resume 启动
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>在含有<code>Dockerfile</code>和<code>compose.yml</code>的根目录执行</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">docker-compose</span> up <span class="token parameter variable">--build</span> <span class="token parameter variable">-d</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li><code>docker-compose</code>: 多容器编排工具</li> <li><code>up</code>: 表示启动所有服务</li> <li><code>--build</code>: 表示在启动前强制重新构建服务镜像，如果不加，默认<strong>不会</strong>重新构建镜像，会直接用上次构建好的本地镜像，这是 Docker 的“增量构建”和“缓存重用”机制</li> <li><code>-d</code>：表示后台运行，当命令没有加上<code>-d</code>时，将默认为前台运行，即按下 ctrl c 后，将发送<code>SIGINT</code>给所有容器并关闭</li></ul> <p>启动后，Docker 将依次执行</p> <ol><li>解析 compose 文件</li> <li>根据 Dockerfile 构建 APP 镜像</li> <li>拉取远程镜像</li> <li>创建网络</li> <li>创建并启动容器</li> <li>日志输出并后台运行</li></ol> <p>这里出现了网络问题，即使我配置了 docker 镜像源，但他这里构建 build 的时候走的是独立的源（其实是因为用了 BuildKit），并且我开了 tun 还是走不通，只好在根目录下新建一个 .npmrc 强制他走镜像源</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token assign-left variable">registry</span><span class="token operator">=</span>https://registry.npmmirror.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动成功后，查看当前容器组状态，health 即为正常</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">docker-compose</span> <span class="token function">ps</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>停止后台的容器组，这会停止并移除容器和网络，但不会删除卷（物理文件）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker-compose</span> down
<span class="token function">docker-compose</span> down <span class="token parameter variable">-v</span> <span class="token comment"># 删除卷 volumes</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>指定 compose.yml 配置文件启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker-compose</span> <span class="token parameter variable">-f</span> compose.dev.yml up <span class="token parameter variable">--build</span> <span class="token parameter variable">-d</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>如果想改 Dockerfile 为 Dockerfile.dev，可以在 compose.yml 中指定 Dockerfile 文件</p> <h3 id="dockerfile-buildkit-构建"><a href="#dockerfile-buildkit-构建" class="header-anchor">#</a> Dockerfile BuildKit 构建</h3> <p>Dockerfile 本质上还是一种标记语言，通过过程式的描述告知 Docker Engine 如何运行容器</p> <p>本项目的 Dockerfile 使用 BuildKit 构建，这是一个新版镜像构建引擎</p> <ul><li>旧版 Legacy Builder：2013 年左右的简单构建器，串行执行每一行 Dockerfile，缓存弱、速度慢、功能少</li> <li>BuildKit：2018 年推出，2023 年后默认开启的新构建引擎，把 Dockerfile 转成依赖图（DAG）并行执行，带智能缓存、新语法、安全挂载等</li></ul> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token comment"># syntax=docker/dockerfile:1.7</span>

<span class="token instruction"><span class="token keyword">ARG</span> NODE_VERSION=24</span>

<span class="token instruction"><span class="token keyword">FROM</span> node:<span class="token variable">${NODE_VERSION}</span>-slim <span class="token keyword">AS</span> base</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>

<span class="token instruction"><span class="token keyword">ENV</span> COREPACK_ENABLE_DOWNLOAD_PROMPT=0 <span class="token operator">\</span>
    PNPM_HOME=<span class="token string">&quot;/pnpm&quot;</span> <span class="token operator">\</span>
    PATH=<span class="token string">&quot;/pnpm:$PATH&quot;</span> <span class="token operator">\</span>
    TURBO_TELEMETRY_DISABLED=1</span>

<span class="token instruction"><span class="token keyword">RUN</span> corepack enable</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> pruner</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm dlx turbo@2.9.9 prune web --docker</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> builder</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/json/ ./</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/pnpm-lock.yaml ./pnpm-lock.yaml</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm install --frozen-lockfile</span>

<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span></span> /app/out/full/ ./</span>
<span class="token instruction"><span class="token keyword">RUN</span> pnpm turbo run build --filter=web</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> runtime-pruner</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm dlx turbo@2.9.9 prune @reactive-resume/runtime-externals --docker</span>

<span class="token instruction"><span class="token keyword">FROM</span> base <span class="token keyword">AS</span> runtime-deps</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-pruner</span></span> /app/out/json/ ./</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-pruner</span></span> /app/out/pnpm-lock.yaml ./pnpm-lock.yaml</span>
<span class="token instruction"><span class="token keyword">RUN</span> <span class="token options"><span class="token property">--mount</span><span class="token punctuation">=</span><span class="token string">type=cache,id=pnpm-store,target=/pnpm/store,sharing=locked</span></span> <span class="token operator">\</span>
    pnpm --filter=@reactive-resume/runtime-externals deploy --prod --legacy /runtime-deps</span>

<span class="token instruction"><span class="token keyword">FROM</span> node:<span class="token variable">${NODE_VERSION}</span>-slim <span class="token keyword">AS</span> runtime</span>

    PORT=3000</span>
