<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">runtime-deps</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /runtime-deps/node_modules ./node_modules</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /app/apps/web/.output ./apps/web/.output</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">pruner</span> <span class="token property">--chown</span><span class="token punctuation">=</span><span class="token string">node:node</span></span> /app/migrations ./migrations</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app/apps/web</span>

<span class="token instruction"><span class="token keyword">USER</span> node</span>

<span class="token instruction"><span class="token keyword">EXPOSE</span> 3000/tcp</span>
<span class="token instruction"><span class="token keyword">HEALTHCHECK</span> <span class="token options"><span class="token property">--interval</span><span class="token punctuation">=</span><span class="token string">30s</span> <span class="token property">--timeout</span><span class="token punctuation">=</span><span class="token string">10s</span> <span class="token property">--start-period</span><span class="token punctuation">=</span><span class="token string">60s</span> <span class="token property">--retries</span><span class="token punctuation">=</span><span class="token string">3</span></span> <span class="token operator">\</span>
    <span class="token keyword">CMD</span> [<span class="token string">&quot;node&quot;</span>, <span class="token string">&quot;-e&quot;</span>, <span class="token string">&quot;fetch('http://127.0.0.1:3000/api/health').then((r) =&gt; { if (!r.ok) process.exit(1); }).catch(() =&gt; process.exit(1));&quot;</span>]</span>

<span class="token instruction"><span class="token keyword">CMD</span> [<span class="token string">&quot;node&quot;</span>, <span class="token string">&quot;.output/server/index.mjs&quot;</span>]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br><span class="line-number">62</span><br><span class="line-number">63</span><br><span class="line-number">64</span><br><span class="line-number">65</span><br><span class="line-number">66</span><br><span class="line-number">67</span><br><span class="line-number">68</span><br><span class="line-number">69</span><br><span class="line-number">70</span><br><span class="line-number">71</span><br></div></div><p>例如其中</p> <ul><li><code># syntax=docker/dockerfile:1</code>：告诉 Docker 用 BuildKit 的新前端解析器</li> <li><code>--mount=type=cache</code>：把宿主机 / 构建缓存目录挂载到容器内，pnpm 下载的包只下一次，后续构建直接复用，速度提升巨大</li></ul> <p>因为 BuildKit 没有走 Docker Engine 代理，出现了没解决的网络问题，让 Claude Code 重构 Dockerfile，使用旧版的 Builder 构建</p> <div class="language-dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token comment"># 移除 BuildKit 头部声明</span>

<span class="token comment"># ---------- Dependencies Layer ----------</span>
<span class="token instruction"><span class="token keyword">FROM</span> node:24-slim <span class="token keyword">AS</span> dependencies</span>

<span class="token instruction"><span class="token keyword">ENV</span> PNPM_HOME=<span class="token string">&quot;/pnpm&quot;</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> PATH=<span class="token string">&quot;$PNPM_HOME:$PATH&quot;</span></span>
<span class="token instruction"><span class="token keyword">RUN</span> corepack enable</span>

<span class="token instruction"><span class="token keyword">RUN</span> mkdir -p /tmp/dev /tmp/prod</span>
<span class="token instruction"><span class="token keyword">COPY</span> package.json pnpm-lock.yaml /tmp/dev/</span>
<span class="token instruction"><span class="token keyword">COPY</span> package.json pnpm-lock.yaml /tmp/prod/</span>

<span class="token comment"># 移除 --mount=type=cache，改用普通安装（旧版兼容）</span>
<span class="token instruction"><span class="token keyword">RUN</span> cd /tmp/dev &amp;&amp; pnpm install --frozen-lockfile</span>
<span class="token instruction"><span class="token keyword">RUN</span> cd /tmp/prod &amp;&amp; pnpm install --frozen-lockfile --prod</span>

<span class="token comment"># ---------- Builder Layer ----------</span>
<span class="token instruction"><span class="token keyword">FROM</span> node:24-slim <span class="token keyword">AS</span> builder</span>

<span class="token instruction"><span class="token keyword">ENV</span> PNPM_HOME=<span class="token string">&quot;/pnpm&quot;</span></span>
<span class="token instruction"><span class="token keyword">ENV</span> PATH=<span class="token string">&quot;$PNPM_HOME:$PATH&quot;</span></span>
<span class="token instruction"><span class="token keyword">RUN</span> corepack enable</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>

<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">dependencies</span></span> /tmp/dev/node_modules ./node_modules</span>
<span class="token instruction"><span class="token keyword">COPY</span> . .</span>

<span class="token instruction"><span class="token keyword">RUN</span> pnpm run build</span>

<span class="token comment"># ---------- Runtime Layer ----------</span>
<span class="token instruction"><span class="token keyword">FROM</span> node:24-slim <span class="token keyword">AS</span> runtime</span>

<span class="token instruction"><span class="token keyword">LABEL</span> maintainer=<span class="token string">&quot;amruthpillai&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.licenses=<span class="token string">&quot;MIT&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.title=<span class="token string">&quot;Reactive Resume&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.description=<span class="token string">&quot;A free and open-source resume builder.&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.vendor=<span class="token string">&quot;Amruth Pillai&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.url=<span class="token string">&quot;https://rxresu.me&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.documentation=<span class="token string">&quot;https://docs.rxresu.me&quot;</span></span>
<span class="token instruction"><span class="token keyword">LABEL</span> org.opencontainers.image.source=<span class="token string">&quot;https://github.com/amruthpillai/reactive-resume&quot;</span></span>

<span class="token instruction"><span class="token keyword">RUN</span> apt-get update &amp;&amp; apt-get install -y --no-install-recommends curl <span class="token operator">\</span>
    &amp;&amp; rm -rf /var/lib/apt/lists/*</span>

<span class="token instruction"><span class="token keyword">WORKDIR</span> /app</span>

<span class="token instruction"><span class="token keyword">ENV</span> NODE_ENV=production</span>

<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span></span> /app/.output ./.output</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">builder</span></span> /app/migrations ./migrations</span>
<span class="token instruction"><span class="token keyword">COPY</span> <span class="token options"><span class="token property">--from</span><span class="token punctuation">=</span><span class="token string">dependencies</span></span> /tmp/prod/node_modules ./node_modules</span>

<span class="token instruction"><span class="token keyword">EXPOSE</span> 3000/tcp</span>

<span class="token instruction"><span class="token keyword">HEALTHCHECK</span> <span class="token options"><span class="token property">--interval</span><span class="token punctuation">=</span><span class="token string">30s</span> <span class="token property">--timeout</span><span class="token punctuation">=</span><span class="token string">10s</span> <span class="token property">--start-period</span><span class="token punctuation">=</span><span class="token string">60s</span> <span class="token property">--retries</span><span class="token punctuation">=</span><span class="token string">3</span></span> <span class="token operator">\</span>
    <span class="token keyword">CMD</span> curl -f http://localhost:3000/api/health || exit 1</span>

<span class="token instruction"><span class="token keyword">ENTRYPOINT</span> [<span class="token string">&quot;node&quot;</span>, <span class="token string">&quot;.output/server/index.mjs&quot;</span>]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br><span class="line-number">47</span><br><span class="line-number">48</span><br><span class="line-number">49</span><br><span class="line-number">50</span><br><span class
