>，如果一个问题的最优解包含了它的子问题的最优解，则称此问题具有最优子结构</p> <ul><li>即该问题的最优解同时是其子问题的最优解</li></ul> <p><strong>重叠子问题</strong>，递归算法中求解子问题，若重复求解同一子问题，则称该问题存在重叠子问题</p> <p><strong>备忘录方法</strong>，对子问题的求解结果进行保存，每向下求一步，保存一次，是自顶向下的；而动态规划不是，动态规划是自底向上的</p> <p>应用范例：矩阵连乘问题，最长公共子序列，背包问题，最优二叉搜索树问题</p> <h3 id="矩阵连乘"><a href="#矩阵连乘" class="header-anchor">#</a> 矩阵连乘</h3> <blockquote><p>将一个矩阵连乘不断分割，找到乘法次数最少的排列</p> <p><code>p[]</code>数组记录矩阵阶数；<code>m[i][j]</code>数组记录从矩阵<code>i</code>乘到矩阵<code>j</code>的乘法次数；<code>s[i][j]</code>数组记录<code>m[i][j]</code>的分割位置 k</p></blockquote> <p>矩阵连乘问题，对于<code>pxq</code>乘以<code>qxr</code>的矩阵乘法，将得到一个<code>pxr</code>的结果矩阵，结果矩阵的每个元素需要<code>q</code>个元素相乘并相加，即共执行<code>prq</code>次乘法</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="14.28ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 6311.6 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D447" d="M40 437Q21 437 21 445Q21 450 37 501T71 602L88 651Q93 669 101 677H569H659Q691 677 697 676T704 667Q704 661 687 553T668 444Q668 437 649 437Q640 437 637 437T631 442L629 445Q629 451 635 490T641 551Q641 586 628 604T573 629Q568 630 515 631Q469 631 457 630T439 622Q438 621 368 343T298 60Q298 48 386 46Q418 46 427 45T436 36Q436 31 433 22Q429 4 424 1L422 0Q419 0 415 0Q410 0 363 1T228 2Q99 2 64 0H49Q43 6 43 9T45 27Q49 40 55 46H83H94Q174 46 189 55Q190 56 191 56Q196 59 201 76T241 233Q258 301 269 344Q339 619 339 625Q339 630 310 630H279Q212 630 191 624Q146 614 121 583T67 467Q60 445 57 441T43 437H40Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(704,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 7 ken punctuation">[</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token keyword">int</span> i<span class="token punctuation">,</span> <span class="token keyword">int</span> j<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">// i j 分别表示左右边界</span>

    <span class="token punctuation">}</span>
    cout <span class="token operator">&lt;&lt;</span> <span class="token char">'('</span><span class="token punctuation">;</span>
    <span class="token function">print_optimal_parens</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> i<span class="token punctuation">,</span> s<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">[</span>j<span class="token punctuation">]</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">print_optimal_parens</span><span class="token punctuation">(</span>s<span class="token punctuation">,</span> s<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">[</span>j<span class="token punctuation">]</span><span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">,</span> j<span class="token punctuation">)</span><span class="token punctuation">;</span>
    cout <span class="token operator">&lt;&lt;</span> <span class="token char">')'</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h3 id="矩阵链乘-贪心与动态规划对比"><a href="#矩阵链乘-贪心与动态规划对比" class="header-anchor">#</a> 矩阵链乘：贪心与动态规划对比</h3> <blockquote><p>动态规划与贪心</p></blockquote> <p>设计一个每次吃掉矩阵链中最大中间维的贪心算法，计算这样得到的矩阵链乘法的计算量（标量乘法次数）；随机产生输入数据，将贪心算法得到的解与讲义上给出的动态算法算法得到的解进行对比，验证贪心算法得到不一定是最优解</p> <p>贪心算法</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token keyword">int</span> <span class="token function">matrixChainGreedy</span><span class="token punctuation">(</span><span class="token keyword">const</span> vector<span class="token operator">&lt;</span><span class="token keyword">int</span><span class="token operator">&gt;</span><span class="token operator">&amp;</span> dims<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    vector<span class="token operator">&lt;</span><span class="token keyword">int</span><span class="token operator">&gt;</span> matrices <span class="token operator">=</span> dims<span class="token punctuation">;</span>
    <span class="token keyword">int</span> totalCost <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>

    <span class="token keyword">while</span> <span class="token punctuation">(</span>matrices<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">&gt;</span> <span class="token number">2</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">int</span> maxIndex <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span> <span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> matrices<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">;</span> <span class="token operator">++</span>i<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            <span class="token keyword">if</span> <span class="token punctuation">(</span>matrices<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">&gt;</span> matrices<span class="token punctuation">[</span>maxIndex<span class="token punctuation">]</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
                maxIndex <span class="token operator">=</span> i<span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>

        <span class="token keyword">int</span> cost <span class="token operator">=</span> matrices<span class="token punctuation">[</span>maxIndex <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">*</span> matrices<span class="token punctuation">[</span>maxIndex<span class="token punctuation">]</span> <span class="token operator">*</span> matrices<span class="token punctuation">[</span>maxIndex <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
        totalCost <span class="token operator">+=</span> cost<span class="token punctuation">;</span>

        <span class="token comment">// 消去最大维</span>
        matrices<span class="token punctuation">[</span>maxIndex <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">=</span> matrices<span class="token punctuation">[</span>maxIndex <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
        matrices<span class="token punctuation">.</span><span class="token function">erase</span><span class="token punctuation">(</span>matrices<span class="token punctuation">.</span><span class="token function">begin</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> maxIndex<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token keyword">return</span> totalCost<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>动态规划</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token keyword">int</span> <span class="token function">matrixChainDP</span><span class="token punctuation">(</span><span class="token keyword">const</span> vector<span class="token operator">&lt;</span><span class="token keyword">int</span><span class="token operator">&gt;</span><span class="token operator">&amp;</span> dims<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> n <span class="token operator">=</span> dims<span class="token punctuation">.</span><span class="token function">size</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">-</span> <span class="token number">1</span><span class="token punctuation">;</span>

<span class="token punctuation">,</span> Y<span class="token punctuation">)</span><span class="token punctuation">{</span>

				L<span class="token punctuation">[</span>j<span class="token punctuation">]</span> ← <span class="token number">1</span> <span class="token operator">+</span> L<span class="token punctuation">[</span>i<span class="token punctuation">]</span>
	<span class="token keyword">return</span> <span class="token function">max</span><span class="token punctuation">(</span>L<span class="token punctuation">)</span> <span class="token comment">// 返回L数组中的最大值</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h3 id="_0-1-背包问题"><a href="#_0-1-背包问题" class="header-anchor">#</a> 0/1 背包问题</h3> <blockquote><p>Knapsack 问题</p></blockquote> <p>就是往背包里放东西使价值最大，限制条件是容量</p> <img src="/assets/img/image-20230202194214742.4f41025c.png"> <p>线性规划问题</p> <img src="/assets/img/image-20230202203406082.4321997a.png"> <p>递归关系（状态转移方程）</p> <img src="/assets/img/image-20230202203334857.871d61cd.png"> <p>j 就是当前背包空余，w 为物品重量，若 j &lt; w，物品装不进去，为空，向后继续判断，实际上就是一个根据 w 和 j 填表格的事</p> <p>i 是指从第几个物品开始往背包中放，若 j &lt; w 即容量不够将向后递归</p> <img src="/assets/img/image-20230203002432615.c4440c00.png"> <img src="/assets/img/image-20230203002453082.023d9e8f.png"> <p>根据上表判断每个物品的 0/1 值（取了或者没取哪些物品）</p> <img src="/assets/img/image-20230203002915996.b20d6499.png"> <ul><li>就是看最终结果和哪一列匹配（列表示当前背包容量）</li></ul> <p>时间复杂度：O(nc)</p> <p>补充背包问题：物品可以被重复取出</p> <h3 id="最优二叉搜索树"><a href="#最优二叉搜索树" class="header-anchor">#</a> 最优二叉搜索树</h3> <blockquote><p>二叉搜索树：左节点小于根，右节点大于根，没有平衡限制</p></blockquote> <p>每个键有一个被搜索概率，要让平均搜索次数最少，这样的二叉搜索树叫做最优二叉搜索树</p> <p>如</p> <img src="/assets/img/image-20230204151409440.a33dfea7.png"> <img src="/assets/img/image-20230204151429256.136dfb80.png"> <p>构造最优二叉搜索树递推公式</p> <img src="/assets/img/image-20230204152930337.ead4c2b0.png"> <p>示例</p> <ul><li>查找键值：<code>A,B,C,D</code></li> <li>查找概率：<code>0.1, 0.2, 0.4, 0.3</code></li></ul> <p>得到 c 表和 r 表</p> <ul><li><code>c[i,j]</code>表示从键值<code>i-j</code>构造的最优二叉搜索树的平均搜索次数</li> <li><code>r[i,j]</code>表示从键值<code>i-j</code>构造的最优二叉搜索树的根，并且其左子树为<code>r[i,k-1]</code>，右子树为<code>r[k+1, j]</code></li></ul> <img src="/assets/img/image-20230204161756236.34990dce.png"> <img src="/assets/img/image-20230204161815484.3568e498.png"> <p>根据 r 表构造最优二叉搜索树</p> <img src="/assets/img/image-20230204161919685.bc35a5f8.png"> <p>伪代码</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token function">OptimalBST</span><span class="token punctuation">(</span>p<span class="token punctuation">[</span><span class="token number">1.</span><span class="token punctuation">.</span>n<span class="token punctuation">]</span><span class="token punctuation">)</span>
	<span class="token keyword">for</span> i ← <span class="token number">1</span> to n
		c<span class="token punctuation">[</span>i<span class="token punctuation">,</span> i − <span class="token number">1</span><span class="token punctuation">]</span> ← <span class="token number">0</span>
		c<span class="token punctuation">[</span>i<span class="token punctuation">,</span> i<span class="token punctuation">]</span> ← p<span class="token punctuation">[</span>i<span class="token punctuation">]</span>
		r<span class="token punctuation">[</span>i<span class="token punctuation">,</span> i<span class="token punctuation">]</span> ← i
		c<span class="token punctuation">[</span>n <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">,</span> n<span class="token punctuation">]</span> ← <span class="token number">0</span>
	<span class="token keyword">for</span> l ← <span class="token number">1</span> to n
		<span class="token keyword">for</span> i ← <span class="token number">1</span> to n − l <span class="token operator">+</span> <span class="token number">1</span>
			j ← i <span class="token operator">+</span> l − <span class="token number">1</span>
			minval ← ∞
			<span class="token keyword">for</span> k ← i to j
				<span class="token keyword">if</span> c<span class="token punctuation">[</span>i<span class="token punctuation">,</span> k − <span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">+</span> c<span class="token punctuation">[</span>k <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">,</span> j<span class="token punctuation">]</span> <span class="token operator">&lt;</span> minval
					minval ← c<span class="token punctuation">[</span>i<span class="token punctuation">,</span> k − <span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">+</span> c<span class="token punctuation">[</span>k <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">,</span> j<span class="token punctuation">]</span>
  					kmin ← k
				r<span class="token punctuation">[</span>i<span class="token punctuation">,</span> j<span class="token punctuation">]</span> ← kmin
  				psum ← p<span class="token punctuation">[</span>i<span class="token punctuation">]</span>
				<span class="token keyword">for</span> s ← i <span class="token operator">+</span> <span class="token number">1</span> to j
					psum ← psum <span class="token operator">+</span> p<span class="token punctuation">[</span>s<span class="token punctuation">]</span>
				c<span class="token punctuation">[</span>i<span class="token punctuation">,</span> j<span class="token punctuation">]</span> ← minval <span class="token operator">+</span> psum
	<span class="token keyword">return</span> c<span class="token punctuation">[</span><span class="token number">1</span><span class="token punctuation">,</span> n<span class="token punctuation">]</span><span class="token punctuation">,</span> r
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>时间复杂度：O(n^3)</p> <h3 id="最大子数组"><a href="#最大子数组" class="header-anchor">#</a> 最大子数组</h3> <p>实现最大子数组的分治算法，将其实际运行效率与改进后的蛮力算法进行对比分析</p> <p>动态规划，时间复杂度 O(n)，空间复杂度 O(n)</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">class</span> <span class="token class-name">Solution</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">int</span> <span class="token function">maxSubArray</span><span class="token punctuation">(</span><span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span> nums<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">int</span> n <span class="token operator">=</span> nums<span class="token punctuation">.</span>length<span class="token punctuation">;</span>
        <span class="token keyword">int</span><span class="token punctuation">[</span><span class="token punctuation">]</span> dp <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token keyword">int</span><span class="token punctuation">[</span>n<span class="token punctuation">]</span><span class="token punctuation">;</span>
        dp<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span> <span class="token operator">=</span> nums<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">;</span>
        <span class="token keyword">for</span><span class="token punctuation">(</span><span class="token keyword">int</span> i <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> n<span class="token punctuation">;</span> i<span class="token operator">++</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
            <span class="token keyword">int</span> cur <span class="token operator">=</span> dp<span class="token punctuation">[</span>i<span class="token operator">-</span><span class="token number">1</span><span class="token punctuation">]</span> <span class="token operator">+</span> nums<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">;</span>
            dp<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">=</span> cur <span class="token operator">&gt;</span> nums<span class="token punctuation">[</span>i<span class="token punctuation">]</span> <span class="token operator">?</span> cur <span class="token operator">:</span> nums<span class="token punctuation">[</span>i<span class="token punctuation">]</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
        <span class="token keyword">return</span> <span class="token class-name">Arrays</span><span class="token punctuation">.</span><span class="token function">stream</span><span class="token punctuation">(</span>dp<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">max</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">orElseThrow</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><blockquote><p>分治解法见「递归分治与贪心」笔记</p></blockquote> <h2 id="回溯法"><a href="#回溯法" class="header-anchor">#</a> 回溯法</h2> <p>基于 DFS，带有回退功能的深度优先搜索，可以提前结束一次错误的搜索或提前返回最优解</p> <p>经典问题：装载问题，n 后问题，0-1 背包问题，旅行商问题</p> <p>智能穷举法（intelligent exhaustive search）</p> <ul><li>回溯法（backtracking）</li> <li>分支限界法（branch-and-bound）</li></ul> <p>回溯法的算法框架</p> <ul><li>按深度优先策略，从根结点出发搜索问题解空间树</li> <li>算法搜索至解空间树的任意节点时，先判断该结点是否包含问题的解
<ul><li>如果肯定不包含，则跳过对该结点为根的子树的搜索，逐层向其祖先结点回溯</li> <li>否则进入该子树，继续按深度优先策略搜索</li></ul></li> <li>回溯法求问题的所有解时，要回溯到根节点，且根节点的所有子树都已被搜索遍才结束</li></ul> <p>在最坏的情况下，还是要面对穷举查找中遇到的指数级爆炸问题</p> <p>死节点和活节点：碰到死节点回溯至祖先活结点，重新进行扩展，直到解空间没有活节点</p> <p>剪枝函数</p> <ul><li>约束函数：在扩展结点处剪去不满足约束的子树</li> <li>限界函数：剪去得不到最优解的子树</li></ul> <p>回溯实现类型</p> <ul><li>递归回溯：对解空间作深度优先搜索</li> <li>迭代回溯：采用树的<strong>非递归</strong>深度遍历算法</li></ul> <p>解空间树类型</p> <ul><li>子集树</li> <li>排列树</li></ul> <h3 id="装载问题"><a href="#装载问题" class="header-anchor">#</a> 装载问题</h3> <p>装载策略</p> <ul><li>首先将第一艘轮船<strong>尽可能</strong>装满</li> <li>将剩余的集装箱装上第二艘轮船</li></ul> <img src="/assets/img/image-20230210142730758.6aa0fd70.png"> <h3 id="n-皇后问题"><a href="#n-皇后问题" class="header-anchor">#</a> n 皇后问题</h3> <p>n 皇后问题要求把 n 个皇后放在一个 n × n 的棋盘上，使得任何两个皇后都不能相互攻击，即它们不能同行，不能同列，也不能位于同一条对角线上（相当于象棋<code>士</code>和<code>帅</code>的移动），问一共有多少 种摆放方法</p> <p>算法设计</p> <ul><li>对于<code>n</code>后问题, 用<code>n</code>元组<code>x[1..n]</code>表示它的解</li> <li><code>x[i]</code>表示皇后<code>i</code>放在棋盘的第<code>i</code>行的第<code>x[i]</code>列，即坐标为<code>(i, x[i])</code></li> <li>约束条件
<ul><li>解向量中的诸<code>x[i]</code>互不相同，即<code>x[i] != x[j]</code></li> <li>任意 2 个皇后不在同一斜线，转化为<code>|i-x[i]| != |j-x[j]|</code></li></ul></li></ul> <h3 id="_0-1-背包问题-2"><a href="#_0-1-背包问题-2" class="header-anchor">#</a> 0/1 背包问题</h3> <p>解空间：子集树</p> <p>算法过程</p> <ul><li>无脑扩展左子树，即令当前<code>x[i]</code>为 1</li> <li>设 Vr 是当前剩余物品价值总和，Vc 是当前价值，Vb 是当前最优价值，当 Vc + Vr ≤ Vb 时，可剪去右子树</li></ul> <p>计算最优值上界：按照性价比排序，优先装入性价比高的物品，装不下的时候装入部分当前性价比最高的物品，计算总价值</p> <img src="/assets/img/image-20230210144734194.f912c6be.png"> <h3 id="旅行商问题"><a href="#旅行商问题" class="header-anchor">#</a> 旅行商问题</h3> <p>给定一张带权图，<strong>周游路线</strong>指包括图每个节点的一条回路，<strong>周游费用</strong>指这条路线上的权之和，旅行商问题即找出周游费用最小的周游路线</p> <p>解空间：排列树</p> <p>算法设计</p> <img src="/assets/img/image-20230210151253244.96f43bef.png"> <img src="/assets/img/image-20230210151311754.a600367a.png"> <h2 id="分枝限界法"><a href="#分枝限界法" class="header-anchor">#</a> 分枝限界法</h2> <p>基于 BFS，在扩展结点的过程中，边搜索边减去树的某些分支，在当前节点的儿子节点中找到最优的一个向下扩展</p> <p>经典问题：单源最短路径问题，装载问题，0-1 背包问题</p> <p>剪枝策略</p> <ul><li>节点不能构成可行解</li> <li>该节点的边界值不优于目前最优解的解，有两种情况
<ul><li>第一种：其边界值小于某来自<strong>同一直系父节点</strong>的兄弟节点</li> <li>第二种：多次访问到该节点，删除边界值较大的节点分支</li></ul></li></ul> <p>两种分枝限界方式</p> <ul><li>队列式分支限界法：按照队列先进先出原则选取下一 个节点为扩展节点</li> <li>优先队列式分支限界法：按照优先队列中规定的优先级选取优先级最高的节点成为当前扩展节点</li></ul> <h3 id="单源最短路径问题"><a href="#单源最短路径问题" class="header-anchor">#</a> 单源最短路径问题</h3> <p>剪枝策略：优先级判定条件为当前节点到起点的路长</p> <ul><li>当不小于（大于等于）当前节点的最短路长，删去</li> <li>当第二次经过该节点，删去路径较长的那一颗子树</li></ul> <img src="/assets/img/image-20230204221925578.14990b1a.png"> <img src="/assets/img/image-20230204221906901.ac001615.png"> <p>其中，经过路径 p 以最小的长度到达了终点 t</p> <h3 id="装载问题-2"><a href="#装载问题-2" class="header-anchor">#</a> 装载问题</h3> <img src="/assets/img/image-20230205011351879.3b439288.png"> <img src="/assets/img/image-20230205011857556.86540626.png"> <img src="/assets/img/image-20230205011809174.2df9e7ab.png"> <h3 id="_0-1-背包问题-3"><a href="#_0-1-背包问题-3" class="header-anchor">#</a> 0/1 背包问题</h3> <p>考虑 0/1 背包问题：n = 3, w = [16, 15, 15], v = [45, 25, 25], c = 30</p> <ul><li>队列式分枝限界利用一个队列来记录活节点，节点将按照顺序从队列中取出</li> <li>优先队列分枝限界使用一个最大堆，该队列的优先级定义为活节点所获得的价值</li></ul> <p>以这样的方式，可以列出所有背包装载的情况</p> <img src="/assets/img/image-20230204214422861.c4f7044a.png"> <p>定义第 i 个物品的上界 ub（性价比）</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="29.667ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 13112.6 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D462" d="M21 287Q21 295 30 318T55 370T99 420T158 442Q204 442 227 417T250 358Q250 340 216 246T182 105Q182 62 196 45T238 27T291 44T328 78L339 95Q341 99 377 247Q407 367 413 387T427 416Q444 431 463 431Q480 431 488 421T496 402L420 84Q419 79 419 68Q419 43 426 35T447 26Q469 29 482 57T512 145Q514 153 41 278H27Q21 284 21 287Z" style="stroke-width:3;"></path></g><g data-mml-node="mo" transform="translate(345,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(1123,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z" style="stroke-width:3;"></path></g></g></g><g data-mml-node="mo" transform="translate(12723.6,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mi>u</mi><mi>b</mi><mo>=</mo><msub><mi>v</mi><mi>i</mi></msub><mo>+</mo><mo stretchy="false">(</mo><mi>C</mi><mo>−</mo><msub><mi>w</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msub><mi>v</mi><mrow data-mjx-texclass="ORD"><mi>i</mi><mo>+</mo><mn>1</mn></mrow></msub><mrow data-mjx-texclass="ORD"><mo>/</mo></mrow><msub><mi>w</mi><mrow data-mjx-texclass="ORD"><mi>i</mi><mo>+</mo><mn>1</mn></mrow></msub><mo stretchy="false">)</mo></math></mjx-assistive-mml></mjx-container><p>C 是当前还能装载的重量</p> <p>对上述空间树进行剪枝，剪枝策略为</p> <ul><li>删除当前层直系兄弟节点中<code>ub</code>大于等于当前最小<code>ub</code>的节点分支</li> <li>删除装不进的分支</li></ul> <img src="/assets/img/image-20230204222202568.a89a1871.png"> <img src="/assets/img/image-20230204223041807.d8f65956.png"> <h2 id="线性规划与网络流"><a href="#线性规划与网络流" class="header-anchor">#</a> 线性规划与网络流</h2> <h3 id="线性规划算法模型"><a href="#线性规划算法模型" class="header-anchor">#</a> 线性规划算法模型</h3> <p>线性规划问题是一个多变量线性函数的最优化问题，参考高中的平面线性规划</p> <ul><li>所有可行解构成的集合为线性规划问题的可行区域</li> <li>目标函数取得极值的可行解称为最优解, 在最优解 处目标函数的值称为最优值</li> <li>有些情况下可能不存在最优解
<ul><li>可行域不存在</li> <li>目标函数在可行域没有极值，即无界</li></ul></li></ul> <p>举个栗子</p> <img src="/assets/img/image-20230205012943469.e6354c65.png"> <h3 id="单纯形算法"><a href="#单纯形算法" class="header-anchor">#</a> 单纯形算法</h3> <blockquote><p>求解线性规划问题</p></blockquote> <p>极点定理：可行区域非空的任意线性规划问题有最优解，而且最优解总是能够在其可行区域的一个极点上找到</p> <p>于是产生朴素想法：穷举可行域中所有极点，找出最大值，但极点数是指数增长的</p> <p>单纯形法的几何描述</p> <ul><li>先在可行区域内找到一个极点，然后检查一下邻接极点处是否可以让目标函数取值更佳
<ul><li>No，当前顶点就是最优点，算法停止</li> <li>Yes，处理下个能让目标函数取值更佳的邻接顶点</li></ul></li> <li>有限步之后，该算法可以找到一个最优解的极点，或证明最优解不存在</li></ul> <p>线性规划问题的约束标准型，限制条件均为等式的线性规划问题称为约束标准型</p> <p>在解决线性规划问题是添加一组<strong>基变量</strong>将限制条件全化为等式的形式，转化为约束标准型，再通过单纯形法进行求解</p> <p>一个栗子：要求最大值的 z 的式子的各项系数是始终不变的；检验数均小于等于 0 时迭代完成，其中</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="54.93ex" height="8.597ex" role="img" focusable="false" viewBox="0 -2150 24279.1 3800" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-3.733ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D44D" d="M58 8Q58 23 64 35Q64 36 329 334T596 635L586 637Q575 637 512 637H500H476Q442 637 420 635T365 624T311 598T266 548T228 469Q227 466 226 463T224 458T223 453T222 450L221 448Q218 443 202 443Q185 443 182 453L214 561Q228 606 241 651Q249 679 253 681Q256 683 487 683H718Q723 678 723 675Q723 673 717 649Q189 54 188 52L185 49H274Q369 50 377 51Q452 60 500 100T579 247Q587 272 590 277T603 282H607Q628 282 628 271Q547 5 541 2Q538 0 300 0H124Q58 0 58 8Z" style="stroke-width:3;"></path></g><g data-mml-node="mi" transform="translate(716,-150) scale(0.707)"><path data-c="1D457" d="M297 596Q297 627 318 644T361 661Q378 661 389 651T403 623Q403 595 384 576T340 557Q322 557 310 567T297 596ZM288 376Q288 405 262 405Q240 405 220 393T185 362T161 325T144 293L137 279Q135 278 121 278H107Q101 284 101 286T105 299Q126 348 164 391T252 441Q253 441 260 441T272 442Q296 441 316 432Q341 418 354 401T367 348V332L318 133Q267 -67 264 -75Q246 -125 194 -164T75 -204Q25 -204 7 -183T-12 -137Q-12 -110 7 -91T53 -71Q70 -71 82 -81T95 -112Q95 -148 63 -167Q69 -168 77 -168Q111 -168 139 -140T182 -74L193 -32Q204 11 219 72T251 197T278 308T289 365Q289 372 288 376Z" style="stroke-width:3;"></path></g >2</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd></mtr></mtable><mo data-mjx-texclass="CLOSE">]</mo></mrow><mo>=</mo><mn>0</mn><mspace linebreak="newline"></mspace><msub><mi>δ</mi><mi>j</mi></msub><mo>=</mo><msub><mi>C</mi><mrow data-mjx-texclass="ORD"><msub><mi>B</mi><mi>j</mi></msub></mrow></msub><mo>−</mo><msub><mi>Z</mi><mi>j</mi></msub></math></mjx-assistive-mml></mjx-container><img src="/assets/img/image-20230206160330363.81677be6.png"> <h3 id="增广路算法"><a href="#增广路算法" class="header-anchor">#</a> 增广路算法</h3> <blockquote><p>网络最大流</p></blockquote> <p>网络：即一张有向带权图，每条边有最大容纳流量<code>cap(v,w)</code>，表示从节点 v 到节点 w 这条边的最大容纳量</p> <p>边的分类</p> <ul><li>零流边：flow = 0</li> <li>饱和边：flow = cap</li> <li>弱流边：flow &lt; cap</li></ul> <p>最大流问题：每条边的输入输出流<strong>没有浪费</strong></p> <img src="/assets/img/image-20230208145311995.97fb9686.png"> <p>从起点 s 到终点 t，边的分类</p> <ul><li>向前边：边和路的方向一致</li> <li>向后边：反之</li></ul> <p>可增广路定义：从 s 到 t 的一条路 P 中，所有向前边的 flow 均小于 cap，所有向后边 flow &gt; 0（向前边非饱和，向后边非零流）</p> <ul><li>可增广路指，可以通过修正边流量使之成为流值更大的可行流</li></ul> <p>可增广路增流：就是向前边增多少，相关联的向后边就要减多少</p> <img src="/assets/img/image-20230208151352888.cfb9171f.png"> <img src="/assets/img/image-20230208151414839.316de323.png"> <p>可增广量 d 必然是有限制的</p> <ul><li>他不会使任一向前流的 flow 超过其 cap</li> <li>同时不会使任一向后流的 flow 小于 0</li></ul> <p>增广路定理：若 flow 是一条 G 的可行流，且不存在任何可增广路，则 flow 是网络 G 的一个最大流</p> <p>一个栗子</p> <img src="/assets/img/image-20230208152031698.c6925cd1.png"> <img src="/assets/img/image-20230208152052478.fb9a9ae3.png"> <img src="/assets/img/image-20230208152119464.b6951864.png"> <p>复杂度分析</p> <img src="/assets/img/image-20230208152151880.43f5c80e.png"></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/203ddc/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">递归分治与贪心</div></a> <a href="/pages/86248e/" class="page-na
