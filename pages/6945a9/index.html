.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://javaguide.cn/java/jvm/classloader.html" target="_blank" rel="nofollow noopener noreferrer">类加载器详解 | JavaGuide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.bilibili.com/video/BV1he4y1e7nW/" target="_blank" rel="nofollow noopener noreferrer">【JVM 极简教程】2 小时快速学会 JVM，史上用时最短，效率最高！bilibili<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="jvm-和-jmm"><a href="#jvm-和-jmm" class="header-anchor">#</a> JVM 和 JMM</h2> <h3 id="java-虚拟机"><a href="#java-虚拟机" class="header-anchor">#</a> Java 虚拟机</h3> <p>JVM 即 Java Virtual Machine，Java 虚拟机，是软件层面的对各类计算机功能的虚拟仿真模拟</p> <p>相当于在操作系统上套了一层，他与操作系统交互，而不与硬件直接交互，调用 OS 系统功能向上提供统一的 Java 编程接口</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>JVM
↓ ↑
操作系统 OS
↓ ↑
硬件：磁盘、内存、CPU 等
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>参考容器技术的跨平台原理，所有软件跑在容器上，而非操作系统，从而实现跨操作系统的运行</p> <p>Java 文件运行过程</p> <img src="/assets/img/image-20251010213933971.eedac0a2.png"> <p>需要注意的是，最后运行的一定是机器码</p> <ul><li><code>.java</code>文本文件通过 javac 编译为<code>.class</code>字节码文件，而后在 JVM 中被解释为机器码并由 OS 执行</li> <li>JVM 完成字节码到机器码的转换，这个字节码的翻译过程在各个操作系统上的 JVM 都是统一的，这是 Java 跨平台的核心逻辑</li></ul> <p>一句话说：JVM 是运行字节码的工具，Java 是一门编译型的语言，Java 编译器将文本文档编译为字节码，类似的字节码语言还有很多</p> <img src="/assets/img/image-20251013154150707.1a37fddd.png"> <p>JVM 的整体结构如下</p> <img src="/assets/img/image-20251013154252502.e066b831.png"> <h3 id="java-内存模型"><a href="#java-内存模型" class="header-anchor">#</a> Java 内存模型</h3> <p>JMM（Java Memory Model），实际上是一套关于 Java 线程之间同步的约定</p> <ol><li>线程解锁前，必须把共享变量立刻同步刷回主存
<ul><li>在线程工作时，实际上是将主存中的变量拷贝一份到线程的工作内存中（值传递），对那份拷贝的变量进行操作</li> <li>线程解锁前，必须将这份变量刷新回主存，使数据更新</li></ul></li> <li>线程加锁前，必须读取主存中的最新值到工作内存中</li> <li>加锁和解锁必须使用同一把锁</li></ol> <p>关于线程、主内存、工作内存的八个操作</p> <table><thead><tr><th>操作</th> <th>解释</th></tr></thead> <tbody><tr><td>lock</td> <td>锁定，作用域主内存的变量，把一个变量表示为线程独占状态</td></tr> <tr><td>unlock</td> <td>解锁，作用于主内存的变量，它把一个处于锁定状态的的变量释放出来，释放后的变量可以被其他线程锁定</td></tr> <tr><td>read</td> <td>读取，作用于主内存变量，它把一个变量的值从主内存传输到线程的工作内</td></tr> <tr><td>load</td> <td>载入，作用于工作内存的变量，它把 read 操作从主存中变量放入工作内存中</td></tr> <tr><td>use</td> <td>线程的执行引擎使用工作内存中的变量</td></tr> <tr><td>assignstore</td> <td>赋值，把执行引擎接受到的值重新赋给那个变量</td></tr> <tr><td>store</td> <td>把工作内存中的一个变量传送到主存中</td></tr> <tr><td>write</td> <td>把 store 操作从工作内存中得到的变量的值放入主存的变量中</td></tr></tbody></table> <p>JMM 对这八种指令的使用，制定了如下规则怪谈</p> <ol><li>不允许 read / load 和 store / write 操作之一单独出现，即 read 了必须 load ，store 了必须 write</li> <li>不允许线程丢弃它最近的 assign 操作，即工作变量的数据改变了后必须告知主存</li> <li>不允许一个线程将没有 assign 的数据从工作内存同步回主存</li> <li>一个新变量必须从主存中诞生，不允许工作内存直接使用一个未被初始化的便改良，也就是说对变量实施 use、store 操作之前必须经过 load 和 assign 操作</li> <li>一个变量同一时间只有一个线程能对其进行 lock，多次 lock 后，即重入锁后，必须执行相同次数的 unlcok 才能解锁</li> <li>如果对同一变量进行 lock 操作，回清空所有工作内存中此变量的值，在执行引擎使用这个变量前，必须重新 load 或 assign 操作初始化变量的值</li> <li>如果一个变量没有被 lock，就不同对其进行 unlock，也不能 unlock 一个被其他线程锁住的变量</li> <li>对一个变量进行 unlock 操作之前，必须把此变量同步回主存</li></ol> <p>ThreadLocal 类：将数据与线程做绑定，类似于 Thread 的 Session，在多线程场景下做参数透传或数据流转</p> <h3 id="volatile-和原子类"><a href="#volatile-和原子类" class="header-anchor">#</a> Volatile 和原子类</h3> <p>对于以下代码</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">JMMTest</span> <span class="token punctuation">{</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">volatile</span> <span class="token keyword">int</span> num <span class="token operator">=</span> <span class="token number">0</span><span class="token punctuation">;</span>

    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//main线程</span>
        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span><span class="token keyword">while</span><span class="token punctuation">(</span>num<span class="token operator">==</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">{</span><span class="token punctuation">}</span><span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            num <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>num<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>当主存中变量更改后，线程的工作栈由于看不到这一改变，依旧在原来的基础上执行，即线程读入 num 为 0，导致线程一直卡死，即使在 2s 后 num 被主线程修改为 1 了，子线程依旧卡在这个 while 循环中</p> <ul><li>主线程对 num 的修改，子线程是“不可见的”</li></ul> <p>这个时候就要引入 volatile 关键字来解决这一问题，volatile 是 java 虚拟机提供的轻量级的同步机制</p> <ol><li>保证可见性</li> <li>禁止指令重排</li></ol> <p>volatile 保证可见性：在上述代码中把 num 用 volatile 修饰后可解决线程对主存变量 num 的不可见性问题，当主线程修改 num 后，会同步到每一个读入了 num 的子线程</p> <blockquote><p>指令重排：什么是指令重排？我们写的程序，计算机并不是按照我们写的那样去一行行执行，它会经过编译器优化的重排 → 指令并行重排 → 内存系统重排 → 最后执行机器码</p></blockquote> <p>Volatile 禁止指令重排：禁止编译器对你所写代码的优化指令重排，在多线程场景下，例如某个线程中 a → b → c 和 a → c → b 的执行结果一样，但另一个线程依赖于 b 的中间状态，如果擅自的重排，可能导致复杂的错乱</p> <p>但注意，Volatile 不保证原子性（事务性），在 Java 里，只有加锁能够保证代码执行的原子性</p> <ol><li>要么对 add 方法用 synchronized 修饰</li> <li>要么用 lock 锁把 add 方法锁住</li> <li>使用原子类解决原子性问题</li></ol> <p>加锁的方法不再赘述，我们来看看原子类（Atomic），这实际上是 JUC 的一个子包（<code>java.util.concurrent.atomic.*</code>），原子类的底层都直接和操作系统挂钩，通过 Unsafe 类直接调用的 C++ 实现的 Native 函数在内存中修改值，这是一个原子性的 +1</p> <img src="/assets/img/image-20210801192553197.e349e8ab.png"> <h3 id="cas-和-aba"><a href="#cas-和-aba" class="header-anchor">#</a> CAS 和 ABA</h3> <p>CAS（compare and swap）是一种基于锁的操作（乐观锁），像 synchronized、Lock、ReadWriteLock 均为悲观锁，CAS 在操作数据前通过比较值来检查“是否可修改”，原子类就利用了 CAS 操作实现其原子性</p> <blockquote><p>但需要注意的是 Java 不能直接操作内存，但能直接操作 C++（navtive 方法），通过 C++ 来操作内存，C++ 是 Java 的后门，Unsafe 类即是 C++ 提供的一扇后门</p></blockquote> <p>点开 Unsafe 类可以发现其方法都是些 native 方法</p> <img src="/assets/img/image-20210801192926744.6b5ae8f7.png"> <p>compareAndSet</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//初始化 AtomicInteger</span>
        <span class="token class-name">AtomicInteger</span> atomicInteger <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicInteger</span><span class="token punctuation">(</span><span class="token number">2021</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//达到 expect 后 update 数值，即当atomicInteger为2021时更新其为2017，否则更新失败返回false</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">2021</span><span class="token punctuation">,</span> <span class="token number">2017</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">boolean</span> <span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token keyword">int</span> expect<span class="token punctuation">,</span> <span class="token keyword">int</span> update<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> unsafe<span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">,</span> valueOffset<span class="token punctuation">,</span> expect<span class="token punctuation">,</span> update<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">native</span> <span class="token keyword">boolean</span> <span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">,</span> <span class="token keyword">int</span> var5<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>getAndIncrement</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">import</span> <span class="token import"><span class="token namespace">java<span class="token punctuation">.</span>util<span class="token punctuation">.</span>concurrent<span class="token punctuation">.</span>atomic<span class="token punctuation">.</span></span><span class="token class-name">AtomicInteger</span></span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token comment">//初始化 AtomicInteger</span>
        <span class="token class-name">AtomicInteger</span> atomicInteger <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicInteger</span><span class="token punctuation">(</span><span class="token number">2017</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//加一</span>
        atomicInteger<span class="token punctuation">.</span><span class="token function">getAndIncrement</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicInteger<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndIncrement</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">return</span> unsafe<span class="token punctuation">.</span><span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">,</span> valueOffset<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 在 AtomicInteger 的 getAndIncrement 方法中 ——&gt; var1=AtomicInteger.class（地址），var2=AtomicInteger.get()（当前值），var4=1</span>
<span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> var5<span class="token punctuation">;</span>
    <span class="token comment">//自旋锁</span>
    <span class="token keyword">do</span> <span class="token punctuation">{</span>
        <span class="token comment">//获取当前值：从地址上读取</span>
        var5 <span class="token operator">=</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getIntVolatile</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//与上类似，执行一个CAS(比较交换)函数：var1和var2确定当前值(地址+长度)，var5为其先记录的当前值，当二者相同时，将自身替换为var5+var4(1)</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token operator">!</span><span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">,</span> var5<span class="token punctuation">,</span> var5 <span class="token operator">+</span> var4<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">return</span> var5<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>缺点：循环会耗时；一次性只能保证一个共享变量的原子性；会引起 ABA 问题</p> <p>ABA 问题：单纯的 CAS 会导致 ABA 问题，这是一种无感知的 A → B → A（把某次变更记录 amend 了，虽然最后的结果是一致的），在某些场景下是不被允许的（例如转账记录）</p> <p>在以下情形，线程一并不会知道变量 A = 1 已经被线程二动过了（有一个 1 → 3 → 1 的过程），只会继续执行它的 CAS 操作，这样是不对的，因为线程一想操作的是原始的 1，而不是经过两次迭代回来的 1</p> <img src="/assets/img/image-20210801214045149.fbd65efd.png"> <p>原子引用：在 Java 中，为了解决上述问题，引入原子引用类<code>AtomicStampedReference&lt;V&gt;</code>，引入版本控制</p> <img src="/assets/img/image-20210802152221674.8cdb0fae.png"> <p>该类用版本号的方式防止 ABA 问题，即每次 cas 操作后手动令版本号（stamp）加一，若线程中事先获得的版本号与当前类版本号不符，则无法实现 cas 操作</p> <p>不符是指此处在线程 A 中事先记录的 stamp 与 <code>atomicReference.getStamp()</code> 不符，即版本号不符，无法进行 cas 操作</p> <img src="/assets/img/image-20210802164810192.e53b33da.png"> <p>一个带上版本号的 CAS +1 操作，重的没边了</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">CASDemo02</span> <span class="token punctuation">{</span>
    <span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">InterruptedException</span> <span class="token punctuation">{</span>
        <span class="token class-name">AtomicStampedReference</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">Integer</span><span class="token punctuation">&gt;</span></span> atomicReference <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicStampedReference</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span>
            <span class="token keyword">int</span> stamp <span class="token operator">=</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token keyword">try</span> <span class="token punctuation">{</span>
                <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">InterruptedException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
                e<span class="token punctuation">.</span><span class="token function">printStackTrace</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token punctuation">}</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> stamp<span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token string">&quot;A&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token keyword">new</span> <span class="token class-name">Thread</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">-&gt;</span><span class="token punctuation">{</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">121</span><span class="token punctuation">,</span> <span class="token number">95</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">compareAndSet</span><span class="token punctuation">(</span><span class="token number">95</span><span class="token punctuation">,</span> <span class="token number">121</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> atomicReference<span class="token punctuation">.</span><span class="token function">getStamp</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span><span class="token punctuation">,</span> <span class="token string">&quot;B&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">start</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

        <span class="token class-name">TimeUnit</span><span class="token punctuation">.</span><span class="token constant">SECONDS</span><span class="token punctuation">.</span><span class="token function">sleep</span><span class="token punctuation">(</span><span class="token number">3</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>atomicReference<span class="token punctuation">.</span><span class="token function">getReference</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><h2 id="类加载系统"><a href="#类加载系统" class="header-anchor">#</a> 类加载系统</h2> <h3 id="类加载过程"><a href="#类加载过程" class="header-anchor">#</a> 类加载过程</h3> <p>众所周知，程序在内存中被执行（冯诺依曼机），当我们编写并编译好了字节码文件，到实际运行，还有一个内存加载的过程，这一过程由类加载子系统实现</p> <img src="/assets/img/image-20251013161626430.34f24d7a.png"> <p>从类被加载到虚拟机内存中开始，到释放内存总共有 5 个步骤：加载，链接，初始化，使用，卸载</p> <ul><li>其中链接包括：验证、准备和解析</li></ul> <p>类的加载指的是前三步：<strong>加载、链接和初始化</strong></p> <p>链接的三步走</p> <ul><li>验证：验证<code>.class</code>文件格式</li> <li>准备：给变量赋零值，在初始化时才会正式赋值</li> <li>解析：将符号引用解析为直接引用，根据类名指定其在方法区的地址</li></ul> <h3 id="类加载器"><a href="#类加载器" class="header-anchor">#</a> 类加载器</h3> <p>类加载器完成类的加载（加载、链接和初始化）</p> <ul><li>类加载器的主要作用就是动态加载 Java 类的字节码（<code>.class</code>文件）到 JVM 中（在内存中生成一个代表该类的<code>Class</code>对象）</li></ul> <p>JVM 中内置了三个重要的<code>ClassLoader</code>（摘自 JavaGuide）</p> <ol><li><code>BootstrapClassLoader</code>（启动类加载器）：最顶层的加载类，由 C++实现，通常表示为 null，并且没有父级，主要用来加载 JDK 内部的核心类库（**<code>%JAVA_HOME%/lib</code>**目录下的<code>rt.jar</code>、<code>resources.jar</code>、<code>charsets.jar</code>等 jar 包和类）以及被<code>-Xbootclasspath</code>参数指定的路径下的所有类</li> <li><code>ExtensionClassLoader</code>（扩展类加载器）：主要负责加载**<code>%JRE_HOME%/lib/ext</code><strong>目录下的 jar 包和类以及被<code>java.ext.dirs</code>系统变量所指定的路径下的所有类（现在是</strong><code>PlatformClassLoader</code>**）</li> <li><code>AppClassLoader</code>（应用程序类加载器）：面向我们用户的加载器，负责加载当前应用**<code>-classpath</code>**下的所有 jar 包和类，如果是 SpringBoot 程序，这个目录将是<code>target/classes</code>，这个目录下所有的<code>.class</code>文件都会由 AppClassLoader 来进行加载</li></ol> <blockquote><p>🌈 拓展一下</p> <ul><li><strong><code>rt.jar</code></strong>：rt 代表“RunTime”，<code>rt.jar</code>是 Java 基础类库，包含 Java doc 里面看到的所有的类的类文件。也就是说，我们常用内置库 <code>java.xxx.*</code>都在里面，比如<code>java.util.*</code>、<code>java.io.*</code>、<code>java.nio.*</code>、<code>java.lang.*</code>、<code>java.sql.*</code>、<code>java.math.*</code></li> <li>Java 9 引入了模块系统，并且略微更改了上述的类加载器。扩展类加载器被改名为平台类加载器（platform class loader）。Java SE 中除了少数几个关键模块，比如说 <code>java.base</code> 是由启动类加载器加载之外，其他的模块均由平台类加载器所加载</li></ul></blockquote> <p>以 JDK17 为例，从最上层的 <strong>ClassLoader</strong> 往下找（即 BootStrapClassLoader），先是 SecureClassLoader</p> <ul><li>SecureClassLoader extends ClassLoader</li> <li>URLClassLoader extends SecureClassLoader</li> <li>BuiltinClassLoader extends SecureClassLoader</li></ul> <p>而后在<code>jdk/internal/loader/ClassLoaders.java</code>有（这个类很关键，维护了三个关键的类加载器）</p> <ul><li>BootClassLoader extends BuiltinClassLoader</li> <li>PlatformClassLoader extends BuiltinClassLoader</li> <li>AppClassLoader extends BuiltinClassLoader</li></ul> <p>还找到一个 WebappClassLoader extends URLClassLoader，是 Tomcat 10.1.24 的启动器</p> <p>加载器 Loader 以自顶向下的方式进行组织，每个 Loader 都会有一个 getParent 方法以获取其父类的加载器</p> <ul><li>注意：BootStrapClassLoader 的 getParent 将返回 null，因为其上层为 C++ 实现，并没有对应的 Java 类，而其余的 ClassLoader 均有双亲</li></ul> <h3 id="双亲委派模型"><a href="#双亲委派模型" class="header-anchor">#</a> 双亲委派模型</h3> <blockquote><p>向上委派，向下查找</p></blockquote> <p>双亲委派的作用</p> <ul><li>避免类的重复加载</li> <li>防止核心 API 被篡改</li></ul> <p>类加载器有很多种，当我们想要加载一个类的时候，具体是哪个类加载器加载呢？这就需要提到双亲委派模型了，根据官网介绍</p> <blockquote><p><code>ClassLoader</code>类使用委托模型来搜索类和资源，每个<code>ClassLoader</code>实例都有一个相关的父类加载器，需要查找类或资源时，<code>ClassLoader</code>实例会在试图亲自查找类或资源之前，将搜索类或资源的<strong>任务委托给其父类加载器</strong></p> <p>虚拟机中被称为 &quot;bootstrap class loader&quot; 的内置类加载器本身没有父类加载器，但是可以作为<code>ClassLoader</code>实例的父类加载器</p></blockquote> <p>用任意一个 Class 的 loadClass 方法，最终都会指向 ClassLoader 的 loadClass 方法，例如</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">ClassNotFoundException</span> <span class="token punctuation">{</span>
    <span class="token class-name">Class</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">loadClass</span><span class="token punctuation">(</span><span class="token string">&quot;cia.northboat.test.TreeTest&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>一路 ctrl b loadClass 会指向 ClassLoader 的 loadClass 方法</p> <img src="/assets/img/image-20251014143446650.f74a4a79.png"> <ul><li>在 567 行，首先会做一个 synchronized 的互斥，不允许同时加载同一个类</li> <li>在 569 行，会做一个类是否被加载过的判断，这意味着类不会被重复加载</li> <li>在 572-577 行，可以明确看到，每个 loadClass 都会去找其父类的 loadClass，直到找到 BootstrapClassLoader</li></ul> <p>这是一个递归调用，当找到 BootstrapClassLoader 后，由于其 parent 为 null，所以会执行 findBootstrapClassLoaderOrNull，其实现如下</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">static</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> <span class="token function">findBootstrapClassOrNull</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token operator">!</span><span class="token function">checkName</span><span class="token punctuation">(</span>name<span class="token punctuation">)</span><span class="token punctuation">)</span> <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token function">findBootstrapClass</span><span class="token punctuation">(</span>name<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token comment">// return null if not found</span>
<span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">native</span> <span class="token class-name">Class</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token operator">?</span><span class="token punctuation">&gt;</span></span> <span class="token function">findBootstrapClass</span><span class="token punctuation">(</span><span class="token class-name">String</span> name<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><ul><li>首先对要加载的类名进行检测</li> <li>若通过，则调用 BootstrapClassLoader 的 native 方法 findBootstrapClass 去加载这个类</li> <li>若未通过或 findBootstrapClass 加载失败，则会回到 BootstrapClassLoader 的上一级子类，执行 583-593 行代码，invoke 这个子类的 findClass 方法进行加载尝试</li> <li>同理，若当前的 findClass 仍旧查找失败，c 仍旧返回 null，则会进一步到下一级 ClassLoader 进行 findClass</li></ul> <p>所谓<strong>向上委派，向下查找</strong>就是这个意思，这是<strong>一个递归的自顶向下的尝试加载的过程</strong></p> <ul><li><p>这样能有效避免类的重复加载，即父类中加载过不为 null，子类就不会再尝试加载了，这样方法区里就只会保留一个类的一份信息</p></li> <li><p>并且，由于自顶向下加载，所以 jdk 的核心类一定会先由顶层的 BootstrapClassLoader 来加载，类的加载是可控的，因为加载器的调用顺序被写死，你不可能跨过 BootstrapClassLoader 用一个下层的 XXXLoader 去加载 jre/lib 中的 class 文件</p> <p>也就是说，jdk 可以指定一些类只能由 BootstrapClassLoader 加载，从而防止 jdk 的核心 API 被篡改</p></li></ul> <p>举一个简单的例子</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">ClassNotFoundException</span> <span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">Class</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token class-name">EncryptedTree</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">.</span><span class="token function">getClassLoader</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>以上将依次输出</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>null
null
jdk.internal.loader.ClassLoaders$AppClassLoader@63947c6b
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这就说明，Class 类和 String 类（来自 jdk）都是由 BootstrapClassLoader 加载，而 EncryptedTree 由 AppClassLoader 加载</p> <p>防止篡改的意思就是，这种底层类百分之一万是由 BootstrapClassLoader 加载的，你无法通过自定义的加载器加载，自然不可能加载进自定义的 String 类</p> <h3 id="自定义类加载器"><a href="#自定义类加载器" class="header-anchor">#</a> 自定义类加载器</h3> <p>Tomcat 为什么要用自定义加载器？</p> <p>为了进行类的隔离，如果 Tomcat 直接使用 AppClassLoader 类加载类，那就会出现如下情况，假设同时有多个项目部署在 Tomcat 中</p> <ol><li>应用 A 中有一个 com.zhouyu.Hello.class</li> <li>应用 B 中也有一个 com.zhouyu.Hello.class</li> <li>虽然都叫做 Hello，但是具体的方法、属性可能不一样</li> <li>如果 AppClassLoader 先加载了应用 A 中的 Hello.class</li> <li>那么应用 B 中的 Hello.class 就不可能再被加载了，因为名字是一样</li> <li>如果就需要针对应用 A 和应用 B 设置各自单独的类加载器，也就是 WebappClassLoader</li> <li>这样两个应用中的 Hello.class 都能被各自的类加载器所加载，不会冲突</li> <li>这就是 Tomcat 为什么用自定义类加载器的核心原因，为了实现类加载的隔离</li> <li><strong>JVM 中判断一个类是否已经被加载的逻辑是：类名 + 对应的类加载器实例</strong></li></ol> <p>也就是说，两个应用中的 Hello.class 对应的加载器实例是两个 WebappClassLoader 对象，以此供 JVM 来进行类的区分</p> <h2 id="运行时数据区"><a href="#运行时数据区" class="header-anchor">#</a> 运行时数据区</h2> <p>JVM 虚拟机的运行时数据区</p> <img src="/assets/img/image-20251015161612920.3fa6b374.png"> <ul><li>方法区</li> <li>虚拟机堆</li> <li>虚拟机栈</li> <li>本地方法栈</li> <li>程序计数器</li></ul> <p>其中，方法区和堆属于线程共享区域，存在并发问题（蓝区）；栈、本地方法栈和程序计数器属于线程独享区域，不存在线程安全问题（绿区）；JVM 的调优主要就是围绕堆，栈两大块进行</p> <ul><li>例如：Student 类的信息将存储在方法区，Student 的一个实例对象 stu 存储在虚拟机堆中，stu 的 sayName() 方法和局部变量将存放在虚拟机栈</li></ul> <p>在类加载器中，类的加载，实际上就是把类的信息加载到方法区中</p> <h3 id="程序计数器"><a href="#程序计数器" class="header-anchor">#</a> 程序计数器</h3> <p>PC Register，程序计数寄存器</p> <ul><li>物理寄存器的抽象实现</li> <li>用来记录待执行的下一跳指令的地址</li> <li>程序控制流的指示器</li> <li>解释器工作时通过程序计数器来获取下一条需要执行的字节码指令</li> <li>唯一一个在 JVM 规范中没有规定任何 OutOfMemoryError 情况的区域（程序计数器不会出现内存溢出）</li></ul> <p>每个线程都会有一个程序计数器，只记录一个地址数字而已</p> <h3 id="方法区"><a href="#方法区" class="header-anchor">#</a> 方法区</h3> <p>方法区主要的作用技术存放类的元数据信息，常量和静态变量等等，当它存储的信息过大时，会在无法满足内存分配时报错</p> <h3 id="本地方法栈"><a href="#本地方法栈" class="header-anchor">#</a> 本地方法栈</h3> <p>本地方法，即 native method，例如 Thread 类的源码，其 start0 方法带有一个 native 关键字修饰，且不存在方法体，这种用 native 修饰的方法就是本地方法，这是底层 C++ 来实现，但在 Java 中定义的方法</p> <p>和虚拟机栈一样，本地方法栈同样存储的是栈帧，只不过是本地方法调用过程中的栈帧，其同样是线程私有的，也可能出现 OOM 和 SOF</p> <p>需要注意的是，如果执行的是 native 方法，程序计数器指针就不工作了</p> <h3 id="虚拟机栈"><a href="#虚拟机栈" class="header-anchor">#</a> 虚拟机栈</h3> <p>又称 Java 栈或 Java 方法栈，每个线程在创建时都会创建一个虚拟机栈，<strong>方法栈会保存一个个的栈帧</strong>，每个栈帧对应一个方法，其特点如下</p> <ol><li>虚拟机栈是线程私有的，生命周期和线程保持一致</li> <li>一个方法开始执行栈帧入栈、方法执行完对应的栈帧就出栈，所以虚拟机栈不需要进行垃圾回收</li> <li>虚拟机栈存在 OutOfMemoryError 和 StackOverflowError
<ul><li>线程太多，就可能会出现 OutOfMemoryError，线程创建时没有足够的内存去创建虚拟机栈了</li> <li>方法调用层次太多，就可能会出现 StackOverflowError</li> <li>可以通过 -Xss 指定参数来设置虚拟机栈的大小</li></ul></li></ol> <img src="/assets/img/image-20251016165023611.33e064a0.png"> <p>栈帧结构</p> <img src="/assets/img/image-20251016165203829.38cc292e.png"> <ul><li>局部变量表：记录一个 Slot 变量数组，即局部变量的信息，包括局部变量的数量，地址和长度</li> <li>操作数栈：执行字节码时，帮助进行计算的寄存器，类似于计算后缀表达式值时的操作数栈</li></ul> <p>以以下代码为例</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">int</span> a <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">,</span> b <span class="token operator">=</span> <span class="token number">20</span><span class="token punctuation">;</span>
    <span class="token keyword">int</span> c <span class="token operator">=</span> a <span class="token operator">+</span> b<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>假设初始时，局部变量表为，其中数字标号表示变量的地址</p> <table><thead><tr><th>局部变量表</th> <th></th></tr></thead> <tbody><tr><td>0（args）</td> <td></td></tr> <tr><td>1（a）</td> <td></td></tr> <tr><td>2（b）</td> <td></td></tr> <tr><td>3（c）</td> <td></td></tr></tbody></table> <p>其字节码大致如下</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>0: bipush	10
1: istore_1
2: bipush	20
3: istore_2
4: iload_1
5: iload_2
6: iadd
7: istore_3
8: return
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>操作数栈会经历以下步骤</p> <ul><li>压栈 10</li> <li>弹栈，把 10 存入地址为 1 的变量，即 a</li> <li>压栈 20</li> <li>弹栈，把 20 存入地址为 2 的变量，即 b</li> <li>从地址为 1 的内存取出值 10，压栈</li> <li>从地址为 2 的内存取出值 20，压栈</li> <li>执行加法指令，自动从操作数栈中取出两个值计算，并将结果 30 压栈</li> <li>弹栈，把 30 存入地址为 3 的变量，即 c</li></ul> <p>最终，局部变量表将成为</p> <table><thead><tr><th>局部变量表</th> <th></th></tr></thead> <tbody><tr><td>0（args）</td> <td></td></tr> <tr><td>1（a）</td> <td>10</td></tr> <tr><td>2（b）</td> <td>20</td></tr> <tr><td>3（c）</td> <td>30</td></tr></tbody></table> <h3 id="虚拟机堆"><a href="#虚拟机堆" class="header-anchor">#</a> 虚拟机堆</h3> <p>堆是一个共享的内存区域，存储着所有 Java 对象和数组，程序中所使用的所有引用，都是按照地址从堆中获取</p> <img src="/assets/img/image-20251016202022125.d26faf44.png"> <p>栈帧会随着方法的结束而消失，而方法中涉及到的对象不会立马被回收，因为<strong>对象和数组都存储在堆中</strong>，和虚拟机栈是相对独立的内存空间，只有在 JVM 后台执行 GC 后，对象才会被回收</p> <p>堆的空间大小可以通过 Java 命令指定</p> <ul><li>-Xms：ms 即 memory start，指定堆的初始化内存大小，等价于<code>-XX:InitialHeapSize</code></li> <li>-Xmx：mx 即 memory max，指定堆的最大内存大小，等价于<code>-XX:MaxHeapSize</code></li></ul> <p>通常会把 -Xms 和 -Xmx 设为一样，这样在运行过程中，就不会在 GC 后去修改堆的大小，提高效率（这是建议的情况）</p> <p>默认情况下（这是什么也不设置的情况）</p> <ul><li>初始化内存大小 = 物理内存大小 / 64</li> <li>最大内存大小 = 物理内存大小 / 4</li></ul> <p>另外，可以通过`-XX: NewRatio``来配置新生代和老年代的比例，默认为 2，即</p> <mjx-container jax="SVG" display="true" class="MathJax" style="direction:ltr;display:block;text-align:center;margin:1em 0;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="16.456ex" height="5.285ex" role="img" focusable="false" viewBox="0 -1426 7273.6 2336" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-2.059ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mfrac"><g data-mml-node="mrow" transform="translate(220,676)"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">新</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">生</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">代</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">对</text></g><g data-mml-node="mi" transform="translate(4000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">象</text></g></g><g data-mml-node="mrow" transform="translate(220,-710)"><g data-mml-node="mi"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">老</text></g><g data-mml-node="mi" transform="translate(1000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">年</text></g><g data-mml-node="mi" transform="translate(2000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">代</text></g><g data-mml-node="mi" transform="translate(3000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">对</text></g><g data-mml-node="mi" transform="translate(4000,0)"><text data-variant="normal" transform="scale(1,-1)" font-size="884px" font-family="serif">象</text></g></g><rect width="5200" height="60" x="120" y="220"></rect></g><g data-mml-node="mo" transform="translate(5717.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z" style="stroke-width:3;"></path></g><g data-mml-node="mn" transform="translate(6773.6,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z" style="stroke-width:3;"></path></g></g></g></svg><mjx-assistive-mml unselectable="on" display="block" style="top:0px;left:0px;clip:rect(1px, 1px, 1px, 1px);-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;position:absolute;padding:1px 0px 0px 0px;border:0px;display:block;overflow:hidden;width:100%;"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mrow><mi mathvariant="normal">新</mi><mi mathvariant="normal">生</mi><mi mathvariant="normal">代</mi><mi mathvariant="normal">对</mi><mi mathvariant="normal">象</mi></mrow><mrow><mi mathvariant="normal">老</mi><mi mathvariant="normal">年</mi><mi mathvariant="normal">代</mi><mi mathvariant="normal">对</mi><mi mathvariant="normal">象</mi></mrow></mfrac><mo>=</mo><mn>2</mn></math></mjx-assistive-mml></mjx-container><p>也就是说在整个堆中，新生代对象占 1/3，老年代对象占 2/3，一般情况下不需要手动调整，只有明确知道存活时间长的对象偏多，那么就要调大 NewRatio</p> <p>在新生代中，又分为 Eden 区，Survivor0 区和 Survivor1 区，同样可以通过<code>-XX: SurvivorRatio</code>来进行调整，默认为<code>8:1:1</code></p> <ul><li>其中 Survivor0 区又叫 S0 区，也叫 from 区</li> <li>Survivor1 区又叫 S1 区，也叫 to 区</li></ul> <p>S0 和 S1 区用来存放 MinorGC（YGC）后存在的对象</p> <p><strong>对象 A 在堆中各个区域的流转过程</strong></p> <ol><li>A 被创建后，首先待在 Eden 区，当 Eden 区满了，触发 GC，如果 A 仍存活，流转至 S0 区</li> <li>经过不断的创建和 GC，S0 区也满了，同样触发 GC，此时 A 仍然存活，流转至 S1 区</li> <li>经过不断的创建和 GC，S1 区也满了，触发 GC，A 仍存活，流转至 S0 区（对象将在 S0 和 S1 区来回交替）</li> <li>A 经过了 15 次 YGC（阈值）仍然存活在 S0/S1，又一次 GC，A 仍存活，则流转至老年代</li></ol> <p>除了上述进入老年代的情形，还有这样两种特殊情况</p> <ul><li>当 S0 和 S1 都放不下 Eden 区本次 GC 存活的对象 B，那么 B 会直接流转至老年代（直接从 Eden 区跳转到老年代）</li> <li>还有一种情况，当创建了一个超大对象 C，整个 Eden 区都放不下，那么会直接把 C 放到老年代</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/08/30, 20:00:00</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/2d1368/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Spring Boot 基础</div></a> <a href="/pages/e85ae0/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">JVM 基础（二）</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
