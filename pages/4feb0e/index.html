ng-content content__default"><h2 id="基本命令"><a href="#基本命令" class="header-anchor">#</a> 基本命令</h2> <p>环境</p> <ul><li>本地 Manjaro：<code>6.1.12-1-MANJARO</code></li> <li>目标机 Debian：<code>5.10.0-19-amd64</code></li> <li>云服务器：CentOS 7.6（沟槽的阿里）</li> <li>ssh：<code>OpenSSH_9.2p1, OpenSSL 3.0.8 7 Feb 2023</code></li></ul> <h3 id="连接服务器"><a href="#连接服务器" class="header-anchor">#</a> 连接服务器</h3> <p>本地连接：用 WinSCP 和 PuTTY 连接远程服务器</p> <ul><li>下载 WinSCP 和 PuTTY</li> <li>在 WinSCP 用服务器 IP 以及 linux 用户名密码连接服务器</li> <li>在 WinSCP 中开启 PuTTY，SSH 终端连接服务器</li></ul> <p>其他常用 SSH 连接软件</p> <ul><li>XShell</li> <li>Mobaxterm</li></ul> <p>在<code>manjaro</code>上连接<code>debian</code>服务器</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ssh</span> root@43.163.218.127
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查看主机基本信息</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">uname</span> <span class="token parameter variable">-a</span>    <span class="token comment"># 内核版本、主机名、架构等</span>
<span class="token comment"># Linux VM-0-17-debian 5.10.0-19-amd64 #1 SMP Debian 5.10.149-2 (2022-10-21) x86_64 GNU/Linux</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 显示当前文件路径</span>
<span class="token builtin class-name">pwd</span>
<span class="token comment"># 查看当前目录所有文件</span>
<span class="token function">ls</span>
<span class="token comment"># 获取root权限</span>
<span class="token function">sudo</span> <span class="token function">su</span>
<span class="token comment"># 切换目录</span>
<span class="token builtin class-name">cd</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>vim</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> test.log
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>按<code>:</code>对vim进行功能选择</p> <ul><li>开始编辑：<code>i</code></li> <li>不保存退出：<code>q!</code></li> <li>保存并退出：<code>wq!</code></li></ul> <p>跑路</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">rm</span> <span class="token parameter variable">-rf</span> /*
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="文件与目录操作"><a href="#文件与目录操作" class="header-anchor">#</a> 文件与目录操作</h3> <p>搜索文件</p> <img src="/assets/img/find4.21778ab9.png"> <p>查看文件内容</p> <img src="/assets/img/cat.79fb625e.png"> <p>通过管道过滤查找关键字</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">cat</span> /etc/passwd <span class="token operator">|</span> <span class="token function">grep</span> root    <span class="token comment"># 管道将 cat 的输出交给 grep 过滤</span>
<span class="token comment"># root:x:0:0:root:/root:/usr/bin/fish</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>创建目录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">mkdir</span> dir1          <span class="token comment"># 创建目录</span>
<span class="token function">mkdir</span> <span class="token parameter variable">-p</span> dir1/dir2  <span class="token comment"># 递归创建多级目录</span>
<span class="token function">ls</span>                  <span class="token comment"># 查看结果</span>
<span class="token comment"># dir1</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>创建文本文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">touch</span> <span class="token function">file</span>          <span class="token comment"># 创建空文件</span>
<span class="token function">ls</span>                  <span class="token comment"># 查看结果</span>
<span class="token comment"># file</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>编辑文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> <span class="token function">file</span>            <span class="token comment"># 进入 vim 编辑，i 开始编辑，wq! 保存退出</span>
<span class="token function">cat</span> <span class="token function">file</span>            <span class="token comment"># 查看写入的内容</span>
<span class="token comment"># hello debain</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>复制文件</p> <img src="/assets/img/cp.1ce890d3.png"> <p>删除文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">rm</span> <span class="token function">file</span>             <span class="token comment"># 删除文件，成功时无输出</span>
<span class="token function">ls</span>                  <span class="token comment"># 列表中已无 file</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>删除目录</p> <img src="/assets/img/rm-rf.7d1292d8.png"> <p>补充：<code>tail -f file</code> 动态查看文件尾部、<code>less file</code> 分页查看、<code>mv A B</code> 重命名、软连接 <code>ln -s a b</code>（将 a 软连接到 b，相当于快捷方式）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">ln</span> <span class="token parameter variable">-s</span> /usr/local/bin/redis-server /home/northboat/Desktop/redis-server
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="用户与权限管理"><a href="#用户与权限管理" class="header-anchor">#</a> 用户与权限管理</h3> <p>新建用户</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">useradd</span> <span class="token parameter variable">-m</span> user1    <span class="token comment"># 新建用户，-m 同时创建 home 目录</span>
<span class="token function">passwd</span> user1        <span class="token comment"># 设置密码，回车后依次输入两次新密码</span>
<span class="token comment"># New password:</span>
<span class="token comment"># Retype new password:</span>
<span class="token comment"># passwd: password updated successfully</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>切换并测试用户</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">su</span> user1            <span class="token comment"># 切换用户</span>
<span class="token function">whoami</span>              <span class="token comment"># 确认当前用户</span>
<span class="token comment"># user1</span>
<span class="token function">mkdir</span> /test         <span class="token comment"># 普通用户在根目录下无写权限</span>
<span class="token comment"># mkdir: cannot create directory '/test': Permission denied</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><img src="/assets/img/sumkdir.a92366b7.png"> <p>用户组：<code>sudo addgroup wheel</code> 新建组，<code>usermod -a -G wheel user1</code> 将用户加入组，<code>groupdel wheel</code> 删除组</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> addgroup wheel        <span class="token comment"># Debian 默认没有 wheel 组，直接 usermod 会报 group wheel does not exist</span>
<span class="token function">usermod</span> <span class="token parameter variable">-a</span> <span class="token parameter variable">-G</span> wheel user1  <span class="token comment"># 将用户加入 wheel 组，成功时无输出</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>查看用户组：<code>cat /etc/group</code>，也可将用户加入已有的 <code>root</code> 组：<code>usermod -a -G root northboat</code></p> <img src="/assets/img/catgroup.d3bfee92.png"> <p>删除用户</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">userdel</span> user1       <span class="token comment"># 删除用户，成功时无输出</span>
<span class="token function">userdel</span> <span class="token parameter variable">-r</span> user1    <span class="token comment"># 连同 home 目录一起删除，目录不存在时会提示 not found</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>赋予权限：<code>+rw</code>为赋予读写权限，<code>-w</code>为删除写权限</p> <p>每个文件的权限由三部分组成：<code>drwxrwxrw-</code></p> <ul><li><code>rwx</code>：所有者 Owner，缩写 u</li> <li><code>rwx</code>：用户组 Group，缩写 g</li> <li><code>rw-</code>：其他 Others，缩写 o</li></ul> <p>权限类型有三种：r（读）、w（写）和 x（执行）</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">chmod</span> +rw xxx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>权限的数字表示法：所谓数字表示法，是指将 r、w 和 x 分别用 4、2、1 来代表，没有授予权限的则为 0，然后把权限相加，如</p> <table><thead><tr><th>原始权限</th> <th>转换为数字</th> <th>数字表示法</th></tr></thead> <tbody><tr><td>rwxrwxr-x</td> <td>(421)(421)(401)</td> <td>775</td></tr> <tr><td>rwxr-xr-x</td> <td>(421)(401)(401)</td> <td>755</td></tr></tbody></table> <h3 id="文件解压缩"><a href="#文件解压缩" class="header-anchor">#</a> 文件解压缩</h3> <p>压缩与解压</p> <img src="/assets/img/tar.da433aea.png"> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-xvf</span> lexer.tar              <span class="token comment"># 解压 .tar，-v 会列出被解压的文件</span>
<span class="token function">zip</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> lexer.zip lexer       <span class="token comment"># 压缩成 zip</span>
<span class="token function">tar</span> <span class="token parameter variable">-czvf</span> lexer.tar.gz lexer    <span class="token comment"># 压缩为 .tar.gz</span>
<span class="token function">tar</span> <span class="token parameter variable">-xzvf</span> lexer.tar.gz          <span class="token comment"># 解压 .tar.gz 到当前目录</span>
<span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> xxx.tar.gz <span class="token parameter variable">-C</span> /opt    <span class="token comment"># 解压到指定目录</span>
<span class="token function">tar</span> <span class="token parameter variable">-xvf</span> mysql-8.0.16-2.el7.x86_64.rpm-bundle.tar    <span class="token comment"># 解压 rpm 包合集</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h3 id="环境变量与自定义命令"><a href="#环境变量与自定义命令" class="header-anchor">#</a> 环境变量与自定义命令</h3> <p>设置快捷键</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">vim</span> ~/.bashrc
<span class="token builtin class-name">source</span> .bashrc
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>通过配置 bashrc 文件创建自定义 linux 命令（快捷键）</p> <p>在<code>~/.bashrc</code>中添加</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">export</span> <span class="token assign-left variable"><span class="token environment constant">PATH</span></span><span class="token operator">=</span>/opt/anaconda/bin:<span class="token environment constant">$PATH</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="包管理"><a href="#包管理" class="header-anchor">#</a> 包管理</h3> <p>apt：Debian 和 Ubuntu 的包管理器，换源即修改配置文件后执行 <code>apt update</code>，Centos 为 <code>/etc/yum.repolist.d</code>，Ubuntu 为 <code>/etc/apt/sources.list</code>，源见<a href="https://mirrors.tuna.tsinghua.edu.cn/help/ubuntu/" target="_blank" rel="nofollow noopener noreferrer">清华镜像<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>与<a href="https://developer.aliyun.com/mirror/ubuntu" target="_blank" rel="nofollow noopener noreferrer">阿里云镜像<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>常用命令</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">apt</span> <span class="token function">install</span> <span class="token function">vim</span>          <span class="token comment"># 安装软件包</span>
<span class="token function">apt</span> remove <span class="token function">curl</span> <span class="token parameter variable">-y</span>       <span class="token comment"># 移除软件包</span>
<span class="token function">apt</span> purge nginx          <span class="token comment"># 移除软件包及配置文件</span>
<span class="token function">apt</span> update               <span class="token comment"># 刷新存储库</span>
<span class="token function">apt</span> upgrade              <span class="token comment"># 升级所有可用软件包</span>
<span class="token function">apt</span> autoremove           <span class="token comment"># 自动删除不需要的包</span>
<span class="token function">apt</span> search nginx         <span class="token comment"># 搜索包</span>
<span class="token function">apt</span> list <span class="token parameter variable">--installed</span>     <span class="token comment"># 列出已安装的包（--upgradable 列出可升级的包）</span>
<span class="token function">apt-cache</span> depends nginx  <span class="token comment"># 查看包依赖</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>wget：一个下载工具，并非包管理器，用于从网络上下载资源，不指定目录时默认为当前目录</p> <p>命令格式</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">wget</span> <span class="token punctuation">[</span>参数<span class="token punctuation">]</span> <span class="token punctuation">[</span>URL地址<span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>下载参数</p> <table><thead><tr><th>短格式</th> <th>长格式</th> <th>说明</th></tr></thead> <tbody><tr><td></td> <td>--bind-address=ADDRESS</td> <td>指定本地使用地址（主机名或 IP，当本地有多个 IP 或名字时使用）</td></tr> <tr><td>-t</td> <td>--tries=NUMBER</td> <td>设定最大尝试链接次数（0 表示无限制）</td></tr> <tr><td>-O</td> <td>--output-document=FILE</td> <td>把文档写到 FILE 文件中</td></tr> <tr><td>-nc</td> <td>--no-clobber</td> <td>不要覆盖存在的文件或使用 .# 前缀</td></tr> <tr><td>-c</td> <td>--continue</td> <td>接着下载没下载完的文件</td></tr> <tr><td></td> <td>--progress=TYPE</td> <td>设定进程条标记</td></tr> <tr><td>-N</td> <td>--timestamping</td> <td>不要重新下载文件除非比本地文件新</td></tr> <tr><td>-S</td> <td>--server-response</td> <td>打印服务器的回应</td></tr> <tr><td></td> <td>--spider</td> <td>不下载任何东西</td></tr> <tr><td>-T</td> <td>--timeout=SECONDS</td> <td>设定响应超时的秒数</td></tr> <tr><td>-w</td> <td>--wait=SECONDS</td> <td>两次尝试之间间隔 SECONDS 秒</td></tr> <tr><td></td> <td>--waitretry=SECONDS</td> <td>在重新链接之间等待 1…SECONDS 秒</td></tr> <tr><td></td> <td>--random-wait</td> <td>在下载之间等待 0…2*WAIT 秒</td></tr> <tr><td>-Y</td> <td>--proxy=on/off</td> <td>打开或关闭代理</td></tr> <tr><td>-Q</td> <td>--quota=NUMBER</td> <td>设置下载的容量限制</td></tr> <tr><td></td> <td>--limit-rate=RATE</td> <td>限定下载速率</td></tr></tbody></table> <h2 id="系统管理"><a href="#系统管理" class="header-anchor">#</a> 系统管理</h2> <h3 id="系统服务"><a href="#系统服务" class="header-anchor">#</a> 系统服务</h3> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>systemctl start/restart/stop <span class="token function">docker</span>    <span class="token comment"># 启动 / 重启 / 停止服务</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>较新版本的 linux 启动服务时，会先找 <code>/etc/systemd/system/</code> 中的 <code>.service</code> 文件，再通过它连接到 <code>/lib/systemd/system</code>，例如 <code>systemctl start docker</code> 就是经由 <code>docker.service</code> 启动</p> <h3 id="网络管理"><a href="#网络管理" class="header-anchor">#</a> 网络管理</h3> <p>查看网卡信息</p> <img src="/assets/img/ifconfig.4ebbe1bf.png"> <blockquote><p>设置静态 IP：manjaro 下用 netctl 统一管理，系统自带配置每次重启或重连都会被重置</p></blockquote> <p>下载 netctl</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> netctl
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>查看网卡信息</p> <img src="/assets/img/ipaddr.f9f4e4d4.png"> <p>得知网卡名称<code>wlp12s0</code></p> <p>终止网络服务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> systemctl stop NetworkManager
<span class="token function">sudo</span> systemctl disable NetworkManager
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>复制<code>netctl</code>默认配置文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">cp</span> /etc/netctl/examples/ethernet-static /etc/netctl/enp13s0f1
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>编辑文件<code>wlp12s0</code></p> <img src="/assets/img/netconfig.2c0bdc85.png"> <p>配置 DNS 解析</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> <span class="token function">vim</span> /etc/resolv.conf    <span class="token comment"># 添加 nameserver，如 nameserver 8.8.8.8</span>
<span class="token function">cat</span> /etc/resolv.conf         <span class="token comment"># 查看修改后的解析配置</span>
<span class="token comment"># nameserver 192.168.106.90</span>
<span class="token comment"># nameserver 2408:841d:2530:4acd::fd</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>重启网络服务</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> systemctl start NetworkManager
<span class="token function">sudo</span> systemctl <span class="token builtin class-name">enable</span> NetworkManager
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>查看网络连接状态</p> <img src="/assets/img/netstat.3980f513.png"> <p>ping  通</p> <img src="/assets/img/ping.57547506.png"> <h3 id="进程与磁盘管理"><a href="#进程与磁盘管理" class="header-anchor">#</a> 进程与磁盘管理</h3> <p><code>ps</code>命令查看进程</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ps</span>      <span class="token comment"># 查看当前终端的进程</span>
<span class="token comment">#   PID TTY          TIME CMD</span>
<span class="token comment">#  5066 pts/1    00:00:00 bash</span>
<span class="token comment">#  5072 pts/1    00:00:00 ps</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>查看所有用户所有进程信息</p> <img src="/assets/img/psaux.e85187ec.png"> <p>进程信息排序</p> <ul><li>按内存占用</li></ul> <img src="/assets/img/pssort.2b1734c3.png"> <ul><li>按 CPU 占用</li></ul> <img src="/assets/img/pssortbycpu.669a2f7b.png"> <p>动态查看进程信息</p> <img src="/assets/img/top.79492610.png"> <p>终止进程</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 根据 pid 杀死进程</span>
<span class="token function">kill</span> <span class="token parameter variable">-9</span> pid

<span class="token comment"># 根据进程名查找 pid</span>
pgrep <span class="token parameter variable">-f</span> name

<span class="token comment"># 根据进程名杀死进程</span>
<span class="token function">pkill</span> <span class="token parameter variable">-f</span> name
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>查看已挂载磁盘总容量、已使用、剩余容量</p> <img src="/assets/img/df-h.c8331838.png"> <p>查看目录或文件所占空间</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">du</span> <span class="token parameter variable">-s</span> <span class="token function">dir</span>       <span class="token comment"># 查看目录所占空间，-s 只输出汇总，单位为 KB（加 -h 转为人类可读）</span>
<span class="token comment"># 212780  dir</span>
<span class="token function">du</span> <span class="token parameter variable">-s</span> <span class="token function">file</span>      <span class="token comment"># 查看文件所占空间</span>
<span class="token comment"># 4  file</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="文件系统"><a href="#文件系统" class="header-anchor">#</a> 文件系统</h3> <p>Linux 和 K8s 的本地文件系统，常用的三种</p> <ul><li>ext4：最经典、应用最广的本地文件系统，稳定兼容，本地双系统的通用选择</li> <li>XFS：CentOS 7+ 的默认文件系统，大文件读写快、支持在线扩容，服务器与数据库常用</li> <li>Btrfs：类似 ZFS 的 Linux 实现，支持快照回滚与压缩，适合容器/虚拟机存储，生产环境建议搭配 RAID 卡并避开早期 RAID5/6 的坑</li></ul> <p>一个容器挂载卷示例：同一台 Docker 主机上 <code>/dockerData</code> 为 ext4（105 GB）、<code>/dockerData/000</code> 为 xfs（7.5 TB）、<code>/dockerData/base</code> 为 btrfs</p> <p>CephFS：分布式存储系统，提供三种存储</p> <ul><li>对象存储（RADOS GW，兼容 AWS S3）</li> <li>块存储（RBD，像云硬盘一样挂载给虚拟机）</li> <li>文件存储（CephFS），类似于 BOS，用于公共存储</li></ul> <p>在 K8s 里：Ceph 通常作为后端持久化存储（提供 PVC），提供给 Pod 使用；而 XFS 或 Btrfs 则作为宿主机（Node） 操作系统的文件系统，用来格式化承载 Ceph 数据盘或本地 PV 的物理磁盘</p> <h4 id="overlayfs"><a href="#overlayfs" class="header-anchor">#</a> OverlayFS</h4> <p>OverlayFS 是一种联合文件系统（Union File System），它将多个目录（称为“层”）透明地叠加在一起，呈现为一个统一的目录视图，这是 Docker 和 Kubernetes 容器镜像和容器运行时默认的存储驱动之一，即 Pod 的默认文件系统</p> <ul><li>image (lower) + upper = merged</li></ul> <p>查看 GraphDriver</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">docker</span> inspect <span class="token operator">&lt;</span>容器名/ID或镜像名<span class="token operator">&gt;</span> <span class="token operator">|</span> jq <span class="token string">'.[0].GraphDriver'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>一个实际 overlay 信息</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
  <span class="token property">&quot;GraphDriver&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
    <span class="token property">&quot;Data&quot;</span><span class="token operator">:</span> <span class="token punctuation">{</span>
      <span class="token property">&quot;LowerDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/xxx-init/diff:/data/docker/overlay2/xxx/diff:（实际为冒号拼接的数十个只读镜像层，此处省略）&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;MergedDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/merged&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;UpperDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/diff&quot;</span><span class="token punctuation">,</span>
      <span class="token property">&quot;WorkDir&quot;</span><span class="token operator">:</span> <span class="token string">&quot;/data/docker/overlay2/f5e5262918163b8d9099acf54b6caa4ce6b6a100cdb49daafea375784c5a1afb/work&quot;</span>
    <span class="token punctuation">}</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><table><thead><tr><th>层级</th> <th>说明</th></tr></thead> <tbody><tr><td>LowerDir</td> <td>只读层（镜像层），用冒号 <code>:</code> 拼接，表示容器文件系统的底层堆叠</td></tr> <tr><td>UpperDir</td> <td>容器的读写层（容器运行时产生的修改）</td></tr> <tr><td>MergedDir</td> <td>将 Lower 和 Upper 统一挂载后的合并视图（容器内看到的最终文件系统）</td></tr> <tr><td>WorkDir</td> <td>OverlayFS 内部用于原子操作的工作目录</td></tr></tbody></table> <h2 id="环境配置"><a href="#环境配置" class="header-anchor">#</a> 环境配置</h2> <p>实验环境：CentOS 7.6</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>Linux VM-0-17-centos <span class="token number">3.10</span>.0-1160.88.1.el7.x86_64 <span class="token comment">#1 SMP Tue Mar 7 15:41:52 UTC 2023 x86_64 x86_64 x86_64 GNU/Linux</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="mariadb"><a href="#mariadb" class="header-anchor">#</a> MariaDB</h3> <p>通过 yum 安装</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yum <span class="token function">install</span> mariadb-server
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>启动 mariadb</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>systemctl start mariadb  <span class="token comment"># 开启服务</span>
systemctl <span class="token builtin class-name">enable</span> mariadb  <span class="token comment"># 设置为开机自启动服务</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>数据库配置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>mysql_secure_installation
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 依次回答：设置 root 密码、移除匿名用户、拒绝 root 远程登录、删除 test 库、重载权限表</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>登录</p> <img src="/assets/img/mariadb.aa84b041.png"> <h3 id="redis"><a href="#redis" class="header-anchor">#</a> Redis</h3> <p>wget 下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">wget</span> https://github.com/redis/redis/archive/redis-7.0.9.tar.gz
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>解压</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zvxf</span> redis-7.0.9.tar.gz <span class="token parameter variable">-C</span> /usr/local/redis
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>编译</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> /usr/local/redis/redis/redis-7.0.9
<span class="token function">make</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>安装</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">make</span> <span class="token assign-left variable">PREFIX</span><span class="token operator">=</span>/usr/local/redis <span class="token function">install</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>复制默认配置文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">cp</span> redis.conf <span class="token punctuation">..</span>/bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>设置 redis.conf</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>requirepass <span class="token number">123456</span> <span class="token comment"># 设置密码</span>
daemonize <span class="token function">yes</span> <span class="token comment"># 允许后台运行</span>
<span class="token builtin class-name">bind</span> <span class="token number">0.0</span>.0.0 <span class="token comment"># 允许远程访问</span>

yum <span class="token function">install</span> <span class="token parameter variable">-y</span> erlang
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>安装 RabbitMQ</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">rpm</span> <span class="token parameter variable">--import</span> https://packagecloud.io/rabbitmq/rabbitmq-server/gpgkey   <span class="token comment"># 不导入 key 会报 NOKEY 警告</span>
<span class="token function">curl</span> <span class="token parameter variable">-s</span> https://packagecloud.io/install/repositories/rabbitmq/rabbitmq-server/script.rpm.sh <span class="token operator">|</span> <span class="token function">sudo</span> <span class="token function">bash</span>
<span class="token function">wget</span> https://github.com/rabbitmq/rabbitmq-server/releases/download/v3.8.5/rabbitmq-server-3.8.5-1.el7.noarch.rpm
<span class="token function">rpm</span> <span class="token parameter variable">-ivh</span> rabbitmq-server-3.8.5-1.el7.noarch.rpm    <span class="token comment"># 缺 socat 依赖时报 Failed dependencies</span>

systemctl start rabbitmq-server
rabbitmqctl add_user admin 011026                   <span class="token comment"># 创建用户</span>
rabbitmqctl set_user_tags admin administrator       <span class="token comment"># 设为超级管理员</span>
systemctl restart rabbitmq-server
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>查看可视化界面：<code>43.163.218.127:15672</code>，设置 <code>virtual host</code> 为 <code>/</code>（默认为 <code>ALL</code>）</p> <img src="/assets/img/rabbitmq.0094b32a.png"> <h3 id="manjaro"><a href="#manjaro" class="header-anchor">#</a> Manjaro</h3> <p>准备镜像制作启动盘</p> <ul><li>下载镜像，需要去官网下载，速度并不慢</li> <li>下载 <code>Rufus</code> 制作启动盘</li></ul> <p>分区</p> <ul><li>primary，挂在目录选择<code>/</code>，该分区类似于 win 的 c</li> <li>logical，use as为<code>swap area</code>，为内存大小，以电脑为准</li> <li>logical，挂在目录选择<code>/boot</code>目录，为启动盘，<code>300MB</code>即可；若启动方式为<code>uefi</code>，该处需要选择<code>/efi</code>目录</li> <li>logical，Mount point选择 /home，你的所有软件将下在该目录</li> <li>选中boot区，continue</li> <li>选择时区、设置密码，等待安装</li> <li>补驱动</li></ul> <p>环境配置：初始化脚本对应的命令（<code>yay</code> 装 AUR 包、<code>pacman</code> 装官方包，逐条执行即可）：</p> <table><thead><tr><th>用途</th> <th>命令</th></tr></thead> <tbody><tr><td>换国内源、同步库、装 yay</td> <td><code>sudo pacman-mirrors -c China</code><br><code>sudo pacman -Syy</code><br><code>sudo pacman -Sy yay</code></td></tr> <tr><td>让 manjaro 读到 win 的引导；改 <code>/etc/default/grub</code>（去掉 <code>quiet</code>、加 <code>loglevel=5</code>）后重新生成 <code>grub.cfg</code> 生效，该文件可能在 <code>/boot/efi/</code></td> <td><code>sudo update-grub</code><br><code>sudo grub-mkconfig -o /boot/grub/grub.cfg</code></td></tr> <tr><td>亮度调节，1~4 档对应 9000/15000/20000/25000</td> <td><code>cd /sys/class/backlight/intel_backlight</code><br><code>echo $bright &gt; brightness</code></td></tr> <tr><td>中文输入法 fcitx，另需在 <code>~/.xprofile</code> 写入环境变量</td> <td><code>yay -S vim</code><br><code>sudo pacman -S fcitx-im fcitx-configtool fcitx-googlepinyin</code><br><code>export GTK_IM_MODULE=fcitx</code><br><code>export QT_IM_MODULE=fcitx</code><br><code>export XMODIFIERS=@im=fcitx</code></td></tr> <tr><td>安装时选了中文系统，把 home 下目录名改成英文</td> <td><code>sudo pacman -S xdg-user-dirs-gtk</code><br><code>export LANG=en_US</code><br><code>xdg-user-dirs-gtk-update</code><br><code>export LANG=zh_CN.UTF-8</code></td></tr> <tr><td>编辑器、休闲软件、QQ 与内网穿透</td> <td><code>yay -S visual-studio-code-bin gdb</code><br><code>yay -S netease-cloud-music microsoft-edge-dev-bin</code><br><code>yay -S deepin-wine-qq linuxqq-new</code><br><code>./natapp -authtoken=xxxxx</code></td></tr> <tr><td>git 全局配置与密钥</td> <td><code>git config --global user.name &quot;NorthBoat&quot;</code><br><code>git config --global user.email &quot;northboat@163.com&quot;</code><br><code>ssh-keygen -t rsa -C &quot;northboat@163.com&quot;</code><br><code>cat ~/.ssh/id_rsa.pub</code></td></tr> <tr><td>Python 环境与 conda 换源</td> <td><code>yay -S anaconda</code><br><code>conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free</code><br><code>conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main</code><br><code>conda config --set show_channel_urls yes</code><br><code>source /opt/anaconda/bin/activate root</code></td></tr> <tr><td>Java 8/11 与默认版本切换</td> <td><code>yay -S jdk8-openjdk jdk11-openjdk</code><br><code>archlinux-java status</code><br><code>archlinux-java set java-11-openjdk</code></td></tr> <tr><td>MySQL 初始化、开机自启、改 root 密码</td> <td><code>yay -S mysql</code><br><code>mysqld --initialize --user=mysql --basedir=/usr --datadir=/var/lib/mysql</code><br><code>systemctl enable --now mysqld.service</code><br><code>mysql -u root -p</code> 后执行 <code>ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '新密码';</code><br><code>yay -S mysql-workbench</code></td></tr> <tr><td>源码编译安装 Redis，改配置后按配置文件启动</td> <td><code>yay -S gcc g++ make pkg-config</code><br><code>make &amp;&amp; make install</code><br><code>mkdir /usr/local/bin/config</code><br><code>cp ~/tool/redis-6.2.6/redis.conf /usr/local/bin/config</code><br><code>./redis-server config/redis.conf</code></td></tr> <tr><td>下载、启动 RabbitMQ 并开启管理插件（15672 / 5672）</td> <td><code>yay -S rabbitmq rabbitmqadmin</code><br><code>sudo rabbitmq-plugins enable rabbitmq_management</code><br><code>sudo rabbitmq-server</code></td></tr> <tr><td>科学上网，AppImage 版 qv2ray 配内核</td> <td><code>yay -S v2ray</code></td></tr> <tr><td>nodejs、hexo、vuepress 环境与插件</td> <td><code>yay -S nodejs npm</code><br><code>npm config set registry https://registry.taobao.org</code><br><code>sudo npm install cnpm -g</code><br><code>cnpm install -g hexo-cli</code><br><code>npm install --save hexo-theme-fluid hexo-tag-aplayer</code><br><code>sudo npm install vue -g</code><br><code>sudo npm install vuepress -g</code><br><code>npm install @vuepress-reco/vuepress-plugin-bgm-player --save</code></td></tr> <tr><td>拉取 Blog、Docs、Index 三个仓库</td> <td><code>for d in Blog Docs Index; do cd $d &amp;&amp; git pull; cd ..; done</code></td></tr></tbody></table> <p><code>yay</code> 配置文件在 <code>~/.config/yay/config.json</code>，也可直接改 <code>/etc/pacman.d/mirrorlist</code> 指定国内源</p> <p>补充</p> <ul><li>解压即用的工具：Typora、dataspell、IDEA（学生账号激活）、Maven（手动建 repo 目录装包）</li> <li>AppImage 版本：度盘、another-redis-desktop-manager</li> <li>解压即用的工具：Typora、dataspell、IDEA（学生账号激活）、Maven（手动建 repo 目录装包）</li> <li>AppImage 版本：度盘、another-redis-desktop-manager</li></ul> <p>调整时间（<a href="https://www.jianshu.com/p/92a2de6d9862" target="_blank" rel="nofollow noopener noreferrer">参考<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>）：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>timedatectl set-local-rtc <span class="token number">1</span> --adjust-system-clock   <span class="token comment"># 硬件时钟按本地时间</span>
timedatectl set-ntp <span class="token number">0</span>                               <span class="token comment"># 关闭自动同步</span>
timedatectl status                                  <span class="token comment"># RTC time 即硬件时钟时间</span>
timedatectl <span class="token operator">|</span> <span class="token function">grep</span> Time                             <span class="token comment"># 查看当前时区</span>
timedatectl list-timezones                          <span class="token comment"># 查看所有可用时区</span>
timedatectl list-timezones <span class="token operator">|</span> <span class="token function">egrep</span> <span class="token parameter variable">-o</span> <span class="token string">&quot;Asia/B.*&quot;</span>    <span class="token comment"># 按地域过滤，Europe/、America/ 同理</span>
timedatectl set-timezone Asia/Shanghai              <span class="token comment"># 设置本地时区</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>桌面：用 <code>*.desktop</code> 创建桌面快捷方式</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>#godotengine.desktop
[Desktop Entry]
Name=godot engine
GenericName=Game Engine
Exec=~/tool/godotengine/godotengine
Icon=godot.png
Terminal=false
Type=Application
StartupNotify=false
Categories=Development;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>桌面面板排布：</p> <img src="/assets/img/panel.23bffe27.png"> <p>Timeshift 快照：使用 rsync 快照，在第一次存储的基础上不断更新，单个快照 7-9G</p> <p>更改启动项：</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sudo</span> efibootmgr             <span class="token comment"># 显示 efi 启动项</span>
<span class="token function">sudo</span> efibootmgr <span class="token parameter variable">-b</span> 000C <span class="token parameter variable">-B</span>  <span class="token comment"># 删除编号为 000C 的引导项</span>
blkid                       <span class="token comment"># 查看分区信息，包括 uuid</span>
<span class="token function">sudo</span> <span class="token function">update-grub</span>            <span class="token comment"># 让 linux 自动生成合适的 grub.cfg</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><ul><li>引导分区被格式化后 uuid 会变，导致 manjaro 进不了 windows，此时需把 <code>/boot/grub/grub.cfg</code> 中 <code>set=root uuid=</code> 后的内容改成新 uuid，或直接 <code>sudo update-grub</code></li> <li>虚拟控制台：<code>ctrl alt f2-f6</code> 开启黑框框 linux，<code>f7</code> 回到图形界面</li></ul> <h2 id="服务部署"><a href="#服务部署" class="header-anchor">#</a> 服务部署</h2> <h3 id="nginx-服务器"><a href="#nginx-服务器" class="header-anchor">#</a> Nginx 服务器</h3> <p>包管理器安装</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code><span class="token function">apt</span> update
<span class="token function">apt-get</span> <span class="token function">install</span> nginx
systemctl start nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>访问 IP:80 端口，可以看到 Nginx 的欢迎界面</p> <p>在目录<code>/usr/share/nginx/html</code>中，存放有默认的 index 页面，我们将其换成自己的，然后找到文件<code>/etc/nginx/sites-available/default</code>，修改其 server 模块</p> <div class="language-nginx line-numbers-mode"><pre class="language-nginx"><code><span class="token directive"><span class="token keyword">server</span></span> <span class="token punctuation">{</span>
    <span class="token directive"><span class="token keyword">listen</span> <span class="token number">80</span> default_server</span><span class="token punctuation">;</span>
    <span class="token directive"><span class="token keyword">listen</span> [::]:80 default_server</span><span class="token punctuation">;</span>

    <span class="token comment"># 确认根目录指向你的网页目录</span>
    <span class="token directive"><span class="token keyword">root</span> /usr/share/nginx/html</span><span class="token punctuation">;</span>

    <span class="token comment"># 优先识别你的 index.html（核心修改）</span>
    <span class="token directive"><span class="token keyword">index</span> index.html index.htm</span><span class="token punctuation">;</span>

    <span class="token comment"># 确保 charset 正确（非必须，但建议保留）</span>
    <span class="token directive"><span class="token keyword">charset</span> utf-8</span><span class="token punctuation">;</span>

    <span class="token comment"># 强制指向 index.html，避免路径匹配问题</span>
    <span class="token directive"><span class="token keyword">location</span> /</span> <span class="token punctuation">{</span>
        <span class="token directive"><span class="token keyword">try_files</span> <span class="token variable">$uri</span> <span class="token variable">$uri</span>/ /index.html</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment"># 其他默认配置（如 error_page 等）保留不变</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>将静态页面 root 指向自定义的网页目录，这样一个静态页面就部署好了，重新加载配置文件。静态页面可以随时换，Nginx 采用热部署</p> <div class="language-sh line-numbers-mode"><pre class="language-sh"><code>systemctl reload nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>古法源码编译安装：通过 wget 在 nginx 官网下载</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">wget</span> http://nginx.org/download/nginx-1.17.6.tar.gz
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>安装必要依赖</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yum <span class="token parameter variable">-y</span> <span class="token function">install</span> gcc pcre pcre-devel zlib zlib-devel openssl openssl-devel
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>创建目录</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">mkdir</span> /usr/local/nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>解压 nginx 压缩包</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-zxvf</span> nginx-1.17.6.tar.gz <span class="token parameter variable">-C</span> /usr/local/nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>编译 nginx</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> /usr/local/nginx/nginx-1.17.6
./configure
<span class="token function">make</span>
<span class="token function">make</span> <span class="token function">install</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>启动 nginx</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">cd</span> /usr/local/nginx
./nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>查看启动情况，浏览器进入<code>http://43.163.218.127/</code></p> <img src="/assets/img/nginx.fbbc45b9.png"> <p>Nginx 反向代理与负载均衡</p> <ul><li>正向代理：VPN 即挂在客户端上的代理，流量路径为<code>客户端 → VPN → 服务器</code></li> <li>反向代理：挂在服务器上的代理，作为中间代理分发请求给服务器，实现负载均衡。如访问<code>www.baidu.com</code>，服务端代理这个域名，将请求分发给不同的服务器去接收请求</li></ul> <p>负载均衡轮询</p> <ul><li>轮询：请求依次打到服务器（循环）</li> <li>加权轮询：优先打到权重较高的服务器，保证服务器性能最大化</li></ul> <p>IPHash</p> <ul><li>Session 保存在 Tomcat 中，用 Redis 共享 Session</li> <li>通过 IP 进行计算，固定的 IP 打到固定的服务器，这样 Session 就不会丢失，但一旦这台服务器挂了，Session 也全没了</li></ul> <p>动静分离：静态资源直接通过 Nginx 返回，不走项目，如前端静态网页</p> <p>Nginx 基础配置：核心配置文件为 <code>nginx.conf</code>，<code>worker_processes</code>、<code>events.worker_connections</code> 决定并发能力，<code>server</code> 块的 <code>listen</code>、<code>root</code>、<code>index</code> 决定站点行为</p> <p>配置 server</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 配置负载均衡</span>
upstream PerformanceSystem<span class="token punctuation">{</span>
	<span class="token comment"># 邮件发送服务器资源</span>
	server <span class="token number">127.0</span>.0.1:8084 <span class="token assign-left variable">weight</span><span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">;</span>
	server <span class="token number">127.0</span>.0.1:8085 <span class="token assign-left variable">weight</span><span class="token operator">=</span><span class="token number">1</span><span class="token punctuation">;</span> 
<span class="token punctuation">}</span>

server <span class="token punctuation">{</span>
	listen       <span class="token number">8080</span><span class="token punctuation">;</span>
	server_name  localhost<span class="token punctuation">;</span>

	location / <span class="token punctuation">{</span>
		root   html<span class="token punctuation">;</span>
		index  index.html index.htm<span class="token punctuation">;</span>
		<span class="token comment"># 配置服务</span>
		proxy_pass http://PerformanceSystem<span class="token punctuation">;</span>
	<span class="token punctuation">}</span>

	error_page   <span class="token number">500</span> <span class="token number">502</span> <span class="token number">503</span> <span class="token number">504</span>  /50x.html<span class="token punctuation">;</span>
	location <span class="token operator">=</span> /50x.html <span class="token punctuation">{</span>
		root   html<span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><p>更多</p> <ul><li>动静分离</li> <li>跨域</li> <li>重写</li> <li>错误码排查</li></ul> <h3 id="ftp-上传部署"><a href="#ftp-上传部署" class="header-anchor">#</a> FTP 上传部署</h3> <p>使用 ftp 工具上传文件</p> <ul><li>一个前端网页</li> <li>一个 jar 包</li></ul> <p>将 nginx 目录下 html 文件夹内容替换为上传的<code>index.html</code>，并将资源放在相应目录下</p> <p>配置 nginx.conf 文件，设置端口及负载均衡</p> <p>启动 jar 包</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">nohup</span> <span class="token function">java</span> <span class="token parameter variable">-jar</span> Shadow-0.0.1-SNAPSHOT.jar <span class="token operator">&amp;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>访问<code>43.163.218.127:80</code></p> <img src="/assets/img/index.c7416717.png"> <p>至此通过 mysql、redis、rabbitmq、nginx 搭好服务器环境，跑通两个 Java 网页服务</p> <h3 id="frp-内网穿透"><a href="#frp-内网穿透" class="header-anchor">#</a> FRP 内网穿透</h3> <blockquote><p>使用 frp 进行内网穿透玩 MC</p></blockquote> <p><a href="https://www.unvone.com/72356.html" target="_blank" rel="nofollow noopener noreferrer">FRP 内网穿透反向代理实现 Windows 远程桌面连接 - 合一学院 (unvone.com)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h4 id="server"><a href="#server" class="header-anchor">#</a> Server</h4> <p>就是利用<code>frp</code>这个软件对端口进行映射，需要一个具有公网<code>ip</code>的服务器</p> <p>配置<code>frps.ini</code>文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token punctuation">[</span>common<span class="token punctuation">]</span>
bind_port <span class="token operator">=</span> <span class="token number">7000</span>
             
dashboard_port <span class="token operator">=</span> <span class="token number">7500</span>
dashboard_user <span class="token operator">=</span> admin
dashboard_pwd <span class="token operator">=</span> <span class="token number">123456</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>其中 <code>7000</code> 是对外开放端口，需要开启防火墙供人访问；<code>dashboard</code> 是 frp 自带的监控平台，<code>dashboard_port</code> 为网站入口，<code>dashboard_user</code> / <code>dashboard_pwd</code> 为用户名与密码</p> <p>启动<code>frp</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>./frps <span class="token parameter variable">-c</span> frps.ini
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>编辑 <code>/etc/systemd/system/frps.service</code> 实现开机自启，<code>ExecStart</code> 指向 <code>frps -c frps.ini</code> 的实际路径，随后 <code>systemctl start frps &amp;&amp; systemctl enable frps</code>（<code>restart</code> / <code>stop</code> / <code>status</code> 同理）</p> <h4 id="client"><a href="#client" class="header-anchor">#</a> Client</h4> <p>配置<code>frpc.ini</code>文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token punctuation">[</span>common<span class="token punctuation">]</span>
<span class="token comment"># 公网ip地址</span>
server_addr <span class="token operator">=</span> <span class="token number">80.251</span>.215.170
<span class="token comment"># frps服务端口号</span>
server_port <span class="token operator">=</span> <span class="token number">7000</span>

<span class="token punctuation">[</span>RDP<span class="token punctuation">]</span>
<span class="token builtin class-name">type</span> <span class="token operator">=</span> tcp
<span class="token comment"># 自身本地ip</span>
local_ip <span class="token operator">=</span> <span class="token number">192.168</span>.1.5
<span class="token comment"># 自身要映射的端口号</span>
local_port <span class="token operator">=</span> <span class="token number">3389</span>
<span class="token comment"># 要映射到的端口号</span>
remote_port <span class="token operator">=</span> <span class="token number">7001</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>主要<code>frps</code>配置的<code>port:7000</code>是<code>frp</code>服务的端口号，这里映射的<code>7001</code>是本地应用服务的端口号，若要访问同样需要开放<code>7001</code>端口</p> <p>启动<code>frp</code>客户端</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>.<span class="token punctuation">\</span>frpc.exe <span class="token parameter variable">-c</span> frpc.ini
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="shell-脚本"><a href="#shell-脚本" class="header-anchor">#</a> Shell 脚本</h3> <p><code>hello.sh</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 脚本内容</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;Hello World!&quot;</span>

<span class="token comment"># 运行脚本</span>
<span class="token function">sh</span> hello.sh
<span class="token comment"># Hello World!</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>利用脚本获取系统信息</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> System time: <span class="token variable"><span class="token variable">`</span><span class="token function">date</span> <span class="token string">&quot;+%Y-%m-%d %H:%M:%S&quot;</span><span class="token variable">`</span></span>
<span class="token builtin class-name">echo</span> Running time: <span class="token variable"><span class="token variable">`</span><span class="token function">uptime</span> <span class="token parameter variable">-p</span><span class="token variable">`</span></span>
<span class="token builtin class-name">echo</span> Load average: <span class="token variable"><span class="token variable">`</span><span class="token function">cat</span> /proc/loadavg <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $1,$2,$3}'</span><span class="token variable">`</span></span>
<span class="token assign-left variable">totalMem</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">free</span> <span class="token parameter variable">-h</span> <span class="token operator">|</span> <span class="token function">grep</span> 内存 <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $2}'</span><span class="token variable">`</span></span>
<span class="token assign-left variable">usedMem</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">free</span> <span class="token parameter variable">-h</span> <span class="token operator">|</span> <span class="token function">grep</span> 内存 <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $3}'</span><span class="token variable">`</span></span>
<span class="token builtin class-name">echo</span> used memory: <span class="token variable">$usedMem</span> / <span class="token variable">$totalMem</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><img src="/assets/img/system_info.a8d29770.png"> <p>获取网卡信息：<code>network_monitor.sh</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token builtin class-name">echo</span> IP: <span class="token variable"><span class="token variable">`</span><span class="token function">ifconfig</span> wlp12s0 <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-w</span> inet <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $2}'</span><span class="token variable">`</span></span>

<span class="token comment"># 取 10 秒前后的收发字节数，比较后判断流量涨落</span>
<span class="token assign-left variable">inputBytes1</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">cat</span> /proc/net/dev <span class="token operator">|</span> <span class="token function">grep</span> wlp12s0 <span class="token operator">|</span> <span class="token function">awk</span> -F: <span class="token string">'{print $2}'</span> <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $1}'</span><span class="token variable">`</span></span>
<span class="token assign-left variable">outputBytes1</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">cat</span> /proc/net/dev <span class="token operator">|</span> <span class="token function">grep</span> wlp12s0 <span class="token operator">|</span> <span class="token function">awk</span> -F: <span class="token string">'{print $2}'</span> <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $9}'</span><span class="token variable">`</span></span>
<span class="token function">sleep</span> <span class="token number">10</span>
<span class="token assign-left variable">inputBytes2</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">cat</span> /proc/net/dev <span class="token operator">|</span> <span class="token function">grep</span> wlp12s0 <span class="token operator">|</span> <span class="token function">awk</span> -F: <span class="token string">'{print $2}'</span><span class="token operator">|</span><span class="token function">awk</span> <span class="token string">'{print $1}'</span><span class="token variable">`</span></span>
<span class="token assign-left variable">outputBytes2</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token function">cat</span> /proc/net/dev <span class="token operator">|</span> <span class="token function">grep</span> wlp12s0 <span class="token operator">|</span> <span class="token function">awk</span> -F: <span class="token string">'{print $2}'</span><span class="token operator">|</span><span class="token function">awk</span> <span class="token string">'{print $9}'</span><span class="token variable">`</span></span>

<span class="token keyword">if</span> <span class="token punctuation">[</span> <span class="token variable">$inputBytes1</span> <span class="token parameter variable">-le</span> <span class="token variable">$inputBytes2</span> <span class="token punctuation">]</span>
	<span class="token keyword">then</span>
	<span class="token builtin class-name">echo</span> Network traffic is on the rise.
 	<span class="token keyword">else</span>
 	<span class="token builtin class-name">echo</span> Network traffic is on the falling.
<span class="token keyword">fi</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">sh</span> network_monitor.sh    <span class="token comment"># 比较 10 秒前后网卡收发字节数</span>
<span class="token comment"># IP: 192.168.17.185</span>
<span class="token comment"># Input bytes1: 976723881 Output bytes1: 36754668</span>
<span class="token comment"># Input bytes2: 977488153 Output bytes2: 36863239</span>
<span class="token comment"># Network traffic is on the rise.</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>监控 CPU 负载：<code>cpu_monitor.sh</code></p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 记录 CPU 型号与核心数，之后每 2 秒采样一次 /proc/stat，共 50 次</span>
<span class="token keyword">if</span> <span class="token punctuation">[</span> <span class="token parameter variable">-f</span> cpu_monitor.txt <span class="token punctuation">]</span>
	<span class="token keyword">then</span>
	<span class="token function">touch</span> cpu_monitor.txt
<span class="token keyword">fi</span>
<span class="token keyword">if</span> <span class="token punctuation">[</span> <span class="token parameter variable">-w</span> cpu_monitor.txt <span class="token punctuation">]</span>
	<span class="token keyword">then</span>
	<span class="token function">chmod</span> <span class="token number">755</span> cpu_monitor.txt
<span class="token keyword">fi</span>

<span class="token function">cat</span> /proc/cpuinfo <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">&quot;model name&quot;</span> <span class="token operator">&gt;</span> cpu_monitor.txt
<span class="token function">cat</span> /proc/cpuinfo <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">&quot;cpu cores&quot;</span> <span class="token operator">&gt;&gt;</span> cpu_monitor.txt
<span class="token builtin class-name">echo</span> <span class="token string">&quot; &quot;</span> <span class="token operator">&gt;&gt;</span> cpu_monitor.txt
<span class="token builtin class-name">echo</span> Total data: <span class="token operator">&gt;&gt;</span> cpu_monitor.txt
<span class="token builtin class-name">echo</span> user <span class="token function">nice</span> system idle iowait irq softirq <span class="token operator">&gt;&gt;</span> cpu_monitor.txt

<span class="token keyword">for</span> <span class="token variable"><span class="token punctuation">((</span>i<span class="token operator">=</span><span class="token number">0</span><span class="token punctuation">;</span>i<span class="token operator">&lt;=</span><span class="token number">50</span><span class="token punctuation">;</span>i<span class="token operator">++</span><span class="token punctuation">))</span></span>
	<span class="token keyword">do</span>
	<span class="token function">cat</span> /proc/stat <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'cpu '</span> <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print $2&quot; &quot;$3&quot; &quot;$4&quot; &quot;$5&quot; &quot;$6&quot; &quot;$7&quot; &quot;$8}'</span> <span class="token operator">&gt;&gt;</span> cpu_monitor.txt
	<span class="token function">sleep</span> <span class="token number">2</span>
<span class="token keyword">done</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="编译内核"><a href="#编译内核" class="header-anchor">#</a> 编译内核</h3> <h4 id="工具及环境准备"><a href="#工具及环境准备" class="header-anchor">#</a> 工具及环境准备</h4> <p>手动下载 Busybox，<code>apt</code>安装 QEMU 等工具</p> <p>环境配置</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">apt-get</span> <span class="token function">install</span> gcc qemu qemu-system-arm gcc-arm-linux-gnueabi libncurses5-dev build-essential flex bison <span class="token function">bc</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="编译最小文件系统"><a href="#编译最小文件系统" class="header-anchor">#</a> 编译最小文件系统</h4> <p>解压 busybox 至根目录，编译配置文件</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">tar</span> <span class="token parameter variable">-jxvf</span> busybox-1.28.4.tar.bz2

<span class="token function">mount</span> <span class="token parameter variable">-t</span> devpts devpts /dev/pts

mdev –s
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><p>修改该文件权限</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">chmod</span> <span class="token number">755</span> rcS

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="运行-qemu"><a href="#运行-qemu" class="header-anchor">#</a> 运行 QEMU</h4> <p>在编译好的 linux 内核根目录下执行</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>qemu-system-arm <span class="token parameter variable">-M</span> vexpress-a9 <span class="token parameter variable">-m</span> 256M <span class="token parameter variable">-kernel</span> arch/arm/boot/zImage <span class="token parameter variable">-append</span> <span class="token string">&quot;rdinit=/linuxrc console=ttyAMA0 loglevel=8&quot;</span> <span class="token parameter variable">-dtb</span> arch/arm/boot/dts/vexpress-v2p-ca9.dtb <span class="token parameter variable">-nographic</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>以上命令中参数含义如下</p> <ul><li>-M：指定硬件芯片框架</li> <li>-m：指定运行内存大小</li> <li>-kernel：指定运行的内核镜像</li> <li>-dtb：指定具体芯片的配置信息</li> <li>-nographic：指定不使用图形界面</li></ul> <p>成功进入内核命令行</p> <img src="/assets/img/image-20230401235235660.651b3ce4.png"> <p>手动编译内核并用 qemu 启动，对操作系统与内核的构成有了直观认识</p> <h3 id="内核模块"><a href="#内核模块" class="header-anchor">#</a> 内核模块</h3> <h4 id="简单的内核模块"><a href="#简单的内核模块" class="header-anchor">#</a> 简单的内核模块</h4> <p>编写模块程序：hello_module.c</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;linux/module.h&gt;</span></span>
<span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;linux/kernel.h&gt;</span></span>

<span class="token keyword">static</span> <span class="token keyword">int</span> __init <span class="token function">hello_init</span><span class="token punctuation">(</span><span class="token keyword">void</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
	<span class="token function">printk</span><span class="token punctuation">(</span><span class="token string">&quot;This is hello_module, welcome to Linux kernel \n&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token keyword">return</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token keyword">static</span> <span class="token keyword">void</span> __exit <span class="token function">hello_exit</span><span class="token punctuation">(</span><span class="token keyword">void</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
	<span class="token function">printk</span><span class="token punctuation">(</span><span class="token string">&quot;see you next time!\n&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token function">module_init</span><span class="token punctuation">(</span>hello_init<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token function">module_exit</span><span class="token punctuation">(</span>hello_exit<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token function">MODULE_LICENSE</span><span class="token punctuation">(</span><span class="token string">&quot;GPL&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token function">MODULE_AUTHOR</span><span class="token punctuation">(</span><span class="token string">&quot;Mr Yu&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token function">MODULE_DESCRIPTION</span><span class="token punctuation">(</span><span class="token string">&quot;hello kernel module&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token function">MODULE_ALIAS</span><span class="token punctuation">(</span><span class="token string">&quot;hello&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>编译内核模块：编写<code>Makefile</code>文件</p> <div class="language-makefile line-numbers-mode"><pre class="language-makefile"><code>obj-m <span class="token operator">:=</span> hello_module.o
KERNELBUILD <span class="token operator">:=</span> /lib/modules/<span class="token variable">$</span><span class="token punctuation">(</span><span class="token function">shell</span> uname -r<span class="token punctuation">)</span>/build
CURRENT_PATH <span class="token operator">:=</span> <span class="token variable">$</span><span class="token punctuation">(</span><span class="token function">shell</span> pwd<span class="token punctuation">)</span>
<span class="token target symbol">all</span><span class="token punctuation">:</span>
	make -C <span class="token variable">$</span><span class="token punctuation">(</span>KERNELBUILD<span class="token punctuation">)</span> M<span class="token operator">=</span><span class="token variable">$</span><span class="token punctuation">(</span>CURRENT_PATH<span class="token punctuation">)</span> modules
<span class="token target symbol">clean</span><span class="token punctuation">:</span>
	make -C <span class="token variable">$</span><span class="token punctuation">(</span>KERNELBUILD<span class="token punctuation">)</span> M<span class="token operator">=</span><span class="token variable">$</span><span class="token punctuation">(</span>CURRENT_PATH<span class="token punctuation">)</span> clean
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>编译：将<code>hello_module.c</code>和<code>Makefile</code>放在同一目录做</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">make</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>得到<code>hello_module.ko</code>文件</p> <img src="/assets/img/image-20230401170609023.9ac49142.png"> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">file</span> hello_module.ko         <span class="token comment"># 检查模块</span>

lsmod                        <span class="token comment"># 查看已加载模块，/sys/module 下会出现同名目录</span>
<span class="token function">tail</span> /var/log/messages
<span class="token function">dmesg</span>                        <span class="token comment"># 输出 This is hello_module, welcome to Linux kernel</span>
rmmod hello_module           <span class="token comment"># 卸载模块，dmesg 输出 see you next time!</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>编译、插入与打印信息无误，说明模块编写正确</p> <h4 id="带参模块"><a href="#带参模块" class="header-anchor">#</a> 带参模块</h4> <p>Linux 内核提供一个宏来实现模块的参数传递</p> <p>编写模块代码：parm_module.c</p> <div class="language-c line-numbers-mode"><pre class="language-c"><code><span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;linux/module.h&gt;</span></span>
<span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">include</span> <span class="token string">&lt;linux/kernel.h&gt;</span></span>

<span class="token function">MODULE_PARM_DESC</span><span class="token punctuation">(</span>debug<span class="token punctuation">,</span> <span class="token string">&quot;debugging information&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token macro property"><span class="token directive-hash">#</span><span class="token directive keyword">define</span> <span class="token macro-name function">dprintk</span><span class="token expression"><span class="token punctuation">(</span>args<span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">.</span><span class="token punctuation">)</span> <span class="token keyword">if</span><span class="token punctuation">(</span>debug<span class="token punctuation">)</span><span class="token punctuation">{</span><span class="token function">printk</span><span class="token punctuation">(</span>KERN_DEBUG args<span class="token punctuation">)</span><span class="token punctuation">;</span><span class="token punctuation">}</span></span></span>
<span class="token keyword">static</span> <span class="token keyword">int</span> myparm <span class="token operator">=</span> <span class="token number">10</span><span class="token punctuation">;</span>

<span class="token function">MODULE_PARM_DESC</span><span class="token punctuation">(</span>myparm<span class="token punctuation">,</span> <span class="token string">&quot;kernel module parameter experiment.&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

	<span class="token function">dprintk</span><span class="token punctuation">(</span><span class="token string">&quot;module parameter = %d\n&quot;</span><span class="token punctuation">,</span> myparm<span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token punctuation">}</span>
<span class="token keyword">static</span> <span class="token keyword">void</span> __exit <span class="token function">parm_exit</span><span class="token punctuation">(</span><span class="token keyword">void</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
	<span class="token function">printk</span><span class="token punctuation">(</span><span class="token string">&quot;see you next time!\n&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
