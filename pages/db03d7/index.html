JRU5ErkJggg==">摘抄<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="_2020"><a href="#_2020" class="header-anchor">#</a> 2020</h2> <p>有一个夜晚，我烧毁了所有的记忆，从此我的梦透明了；有一个早晨，我扔掉所有的昨天，从此我的脚步就轻盈了</p> <blockquote><p>—— 泰戈尔</p></blockquote> <hr> <p>楼下一个男人病得要死，那间隔壁得一家唱着留声机，对面是弄孩子。楼上有两人狂笑；还有打牌声。河中的船上有女人哭着她死去的母亲。人类的悲欢并不相通，我只觉得他们吵闹</p> <blockquote><p>—— 鲁迅《小杂感》</p></blockquote> <hr> <p>对于人生的种种不可躲避的灾祸和不可改变的苦难，除了忍，别无他法。苦难生英灵，最强壮的人，性格上总带烙印。一切享乐和幸福都是消极的，只有痛苦才是积极的</p> <hr> <p>他们不觉悟，就永远不会反抗；而不反抗，他们就永远无法觉悟</p> <blockquote><p>—— 奥威尔《1984》</p></blockquote> <hr> <h2 id="_2021"><a href="#_2021" class="header-anchor">#</a> 2021</h2> <p>&quot;愿我早逝，且无来生&quot;</p> <hr> <p>真爱就是个屎，不拉憋得慌，拉的时候特别爽，但真拉完了又嫌臭，就想赶快换个地儿再蹲</p> <hr> <p>他那时还太年轻，不知道所有命运赠送的礼物，早已在暗中标好了价格</p> <blockquote><p>—— 茨威格</p></blockquote> <hr> <h2 id="_2022"><a href="#_2022" class="header-anchor">#</a> 2022</h2> <p>It's already doomed</p> <blockquote><p>—— CS188</p></blockquote> <hr> <p>阳光撒在我们肩头，仿佛我们都是自由人</p> <blockquote><p>——《肖申克的救赎》弹幕</p></blockquote> <hr> <p>一个成熟的人，有自己的价值观，他能够做出基于他价值观的认可和否定；但是他会保有其他观点的存在的可能性，认为自己是出于现在认知做出的决定；而且会根据利益来否定与肯定他人，因为有些事无关对错，而只关利益</p> <p>人的认知将经过看山是山，看水是水的第一阶段：根据自己局限的认知来狭隘的否定或肯定他人；再到看山不是山，看水不是水的第二阶段：不去评判无关对错，世界混沌又无序，没有统一的标准，这也是世界的真相；然后又再回到看山是山，看水是水的阶段：我根据我的喜好憎恶来评判事物，即使我认为世界本无对错、无意义。但我会创造意义、标准、价值。基于现有认知和利益权衡去评判事物，这样自我才会逐渐完善</p> <blockquote><p>——《守望者》影评</p></blockquote> <hr> <p>永远不要相信苦难是值得的，苦难就是苦难，苦难不会带来成功，苦难不值得追求，磨练意志是因为苦难无法躲开</p> <blockquote><p>—— 余华《活着》</p></blockquote> <hr> <p>夜深忽梦少年事，梦啼妆泪红阑干</p> <blockquote><p>—— 白居易《琵琶行》</p></blockquote> <hr> <p>我想说明我是一个不论何时都追求内心平稳的人，不拘泥于胜负，不纠结于烦恼，不树立会使我夜不能寐的敌人，这就是我在这社会的生活态度，我也清楚这就是我的幸福</p> <blockquote><p>—— 吉良吉影</p></blockquote> <hr> <p>Or are we ashes and wine</p> <p>而或我们不过是风中尘埃、杯中劣酒</p> <blockquote><p>—— A Fine Frenzy《Ashes And Wine》</p></blockquote> <hr> <p>大人者，不失其赤子之心</p> <blockquote><p>——《孟子 离娄下》</p></blockquote> <hr> <p>如果有人不相信数学是简单的，那是因为他们没有意识到人生有多复杂</p> <blockquote><p>—— 冯诺依曼</p></blockquote> <hr> <p>痛苦是无止境的，我们只能去学着习惯，你应该去期待未来的每一天都比现在更痛苦，如此才能算是乐观</p> <hr> <p>我从来不提前做梦，无论是美梦，还是噩梦</p> <blockquote><p>—— zhan |</p></blockquote> <hr> <p>世间好物不坚牢，彩云易散琉璃碎</p> <hr> <p>A man provides, and he does it even he is not appreciated, or respected, or even loved. He simply bears up, and he does it because he is a man</p> <blockquote><p>《绝命毒师》第三季 第五集</p></blockquote> <h2 id="_2023"><a href="#_2023" class="header-anchor">#</a> 2023</h2> <p>青春在跌跌撞撞中戛然而止</p> <hr> <p>且视他人之凝目如盏盏鬼火，大胆的去走你的夜路</p> <blockquote><p>—— 史铁生</p></blockquote> <hr> <p>缺乏艺术性的艺术品，无论政治上怎样进步，都是没有力量的</p> <blockquote><p>—— 毛泽东</p></blockquote> <hr> <p>我向来不惮以最坏的恶意揣测中国人</p> <blockquote><p>—— 鲁迅《纪念刘和珍君》</p></blockquote> <h2 id="_2024"><a href="#_2024" class="header-anchor">#</a> 2024</h2> <p>一群猴子爬树，向上看都是屁股，向下看都是笑脸，左右都是耳目</p> <hr> <p>学生作为脱产阶级，天生带有小资属性，因为不参与社会生产，不用承担家庭支出，所以很容易忽视自己家庭的所在阶级，对于自己的定位没有明确的认知，对于社会生产没有清晰的看法，认为所谓“人定胜天理论”，其实，他们口中的“努力”是极其片面的</p> <hr> <p>看似一朝，实则两代，然汉人不知东西，宋人不识南北，今人亦难分左右</p> <h2 id="_2025"><a href="#_2025" class="header-anchor">#</a> 2025</h2> <p>So we beat on, boats against the current, borne back ceaselessly into the past</p> <p>于是我们奋力前进，却如同逆水行舟，注定要不停地退回过去</p> <blockquote><p>—— 《The Great Gatsby》</p></blockquote> <hr> <p>风险自担者，落子不易</p> <h2 id="_2026"><a href="#_2026" class="header-anchor">#</a> 2026</h2> <p>疲劳加班和为了工作长期熬夜是最傻最没有意义的事情。没有人感谢你的付出，没有人记得你做的事儿，没有人会佩服你,没有人会记得你，最重要的是，你的工作也远没有你想象的那么有意义。早日参透，早日收获</p> <blockquote><p>—— 峰哥亡命天涯</p></blockquote> <p>急事不慌，缓事不怠</p> <blockquote><p>—— 鹏寰大厦 5F</p></blockquote> <p>我们在讲台上拼命的将马克思主义哲学，位的就是让这一代年轻人不要觉得有技术、有能力的人，毕业之后就一定只能与资本共舞，进而顺应这种“合理化趋势”。要让学生明白与它博弈的另一条路是存在的，需要有人闯出来。我也希望通过哲学思政课，让学生明白成才不应该是任何人竞争到你死我活。人才是一批一批的，不是一个一个的成才</p> <blockquote><p>—— 张双利</p></blockquote> <p>年轻人不要触碰一切黑箱产物 —— 即一个事务它完全由内部的圈层把控。掌握里面一切的话语权、定价权。外部的人不仅不能插手，甚至连了解详细规则的权力都没有，只能单方面的接受输出。最典型的其实是：文玩、字画、珠宝、玉石、白酒、彩礼等等</p> <p>在传统习俗中隐藏着大量黑箱产物，他们披上了一层传统文化习俗的皮囊，本质上是要来收割你</p> <blockquote><p>—— 知乎</p></blockquote> <p>人生其实跟股票一样，是需要在高点套现的：表达欲最强的时候，多留下一些作品；荷尔蒙旺盛、流动性最强的时候，多做爱；有体力还有探索欲的时候，赶紧去旅行；父母健在、家庭和睦的时候，有时间就多聚聚</p> <p>人最容易犯的错误，就是在高点的时候，以为自己会永远处于高点</p> <blockquote><p>—— 小五在加州</p></blockquote></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/11/12, 10:07:47</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/study/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">2084 进厂指南</div></a> <a href="/pages/633508/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">酒吧舞</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
