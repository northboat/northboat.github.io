Akj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">并发、异步和锁<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="生产消费和锁"><a href="#生产消费和锁" class="header-anchor">#</a> 生产消费和锁</h2> <p>只要是并发编程必须要加锁</p> <h3 id="生产消费关系"><a href="#生产消费关系" class="header-anchor">#</a> 生产消费关系</h3> <p>生产消费关系：线程通信流程为“判断等待 → 执行业务 → 通知解锁”</p> <ul><li>虚假唤醒：判断等待使用 if 判断，唤醒后线程会从 wait 之后的代码开始运行，但是不会重新判断 if 条件，直接继续运行 if 代码块之后的代码（if 判断在第一进入的适合），而如果使用 while 的话，会再次进行判断</li></ul> <p>例如一个具体买卖的等待唤醒场景，由于买卖关系的严肃性（防超卖、防超扣），必须实现对线程的精确控制</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">class</span> <span class="token class-name">Shoes</span><span class="token punctuation">{</span>

    <span class="token keyword">int</span> num <span class="token operator">=</span> <span class="token number">5</span><span class="token punctuation">;</span>
    <span class="token comment">//用状态码去判断是否让线程等待</span>
    <span class="token keyword">int</span> status <span class="token operator">=</span> <span class="token number">1</span><span class="token punctuation">;</span>

        <span class="token punctuation">}</span><span class="token keyword">finally</span> <span class="token punctuation">{</span>

="line-number">51</span><br><span class="line-number">52</span><br><span class="line-number">53</span><br><span class="line-number">54</span><br><span class="line-number">55</span><br><span class="line-number">56</span><br><span class="line-number">57</span><br><span class="line-number">58</span><br><span class="line-number">59</span><br><span class="line-number">60</span><br><span class="line-number">61</span><br></div></div><p>通常而言，消费者通过“回调”的方式告知生产者消费结果，生产者通常是我们程序的控制面</p> <h3 id="锁的分类"><a href="#锁的分类" class="header-anchor">#</a> 锁的分类</h3> <h4 id="悲观锁和乐观锁"><a href="#悲观锁和乐观锁" class="header-anchor">#</a> 悲观锁和乐观锁</h4> <blockquote><p>悲观锁：synchronized，乐观锁：CAS</p></blockquote> <p>悲观锁：上面的 SetNX 就是天然的分布式悲观锁（Redis 单线程），同一时间只有一个操作者独占锁，其他请求必须等待，适合冲突频繁的场景</p> <p>乐观锁：不阻塞，多个操作可以并行，可以通过版本号来检测冲突，只有用户当前的版本号和服务器的版本号一致的情况，才允许修改数据，适合冲突少的场景，性能优于悲观锁，有一点要注意的是，更新版本号的操作必须要上锁，这得是一个原子操作，常见的乐观锁实现</p> <ul><li>基于版本号实现：在数据上新增一个版本号字段，例如通过<code>newVersion := currentVersion + 1</code>实现</li> <li>基于时间戳实现：和版本号差不多，一个道理，只不过更新的数据从版本号变成当前时间戳</li> <li>基于 CAS（Compare And Swap）实现：版本号的优化版本</li></ul> <p>基于版本号的 CAS 示例</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// SaveBDJsonWithCAS 使用CAS实现乐观锁</span>
<span class="token keyword">func</span> <span class="token function">SaveBDJsonWithCAS</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> req <span class="token operator">*</span>SaveBDJsonParam<span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
  versionKey <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>DocVersionKey<span class="token punctuation">,</span> req<span class="token punctuation">.</span>DocID<span class="token punctuation">)</span>

  <span class="token comment">// 重试机制，上限为 3</span>
  maxRetries <span class="token operator">:=</span> <span class="token number">3</span>
  <span class="token keyword">for</span> i <span class="token operator">:=</span> <span class="token number">0</span><span class="token punctuation">;</span> i <span class="token operator">&lt;</span> maxRetries<span class="token punctuation">;</span> i<span class="token operator">++</span> <span class="token punctuation">{</span>
    <span class="token comment">// 1. 获取当前版本</span>
    currentVersion<span class="token punctuation">,</span> err <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>PegaDocOther<span class="token punctuation">.</span><span class="token function">Get</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> versionKey<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Int64</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token operator">&amp;&amp;</span> err <span class="token operator">!=</span> redis<span class="token punctuation">.</span>Nil <span class="token punctuation">{</span>
      <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>

    <span class="token comment">// 2. 检查版本（首次保存时跳过）</span>
    <span class="token keyword">if</span> req<span class="token punctuation">.</span>Version <span class="token operator">!=</span> <span class="token number">0</span> <span class="token operator">&amp;&amp;</span> req<span class="token punctuation">.</span>Version <span class="token operator">!=</span> currentVersion <span class="token punctuation">{</span>
      <span class="token keyword">return</span> <span class="token operator">&amp;</span>ConflictError<span class="token punctuation">{</span>
        CurrentVersion<span class="token punctuation">:</span> currentVersion<span class="token punctuation">,</span>
        Message<span class="token punctuation">:</span>       <span class="token string">&quot;文档已被其他用户修改，请刷新后重试&quot;</span><span class="token punctuation">,</span>
      <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// 3. CAS操作：只有当版本没变时才更新</span>
    newVersion <span class="token operator">:=</span> currentVersion <span class="token operator">+</span> <span class="token number">1</span>
    updated<span class="token punctuation">,</span> err <span class="token operator">:=</span> resource<span class="token punctuation">.</span><span class="token function">Redis</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span>PegaDocOther<span class="token punctuation">.</span><span class="token function">SetNX</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> versionKey<span class="token punctuation">,</span> newVersion<span class="token punctuation">,</span> <span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Result</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
      <span class="token keyword">return</span> err
    <span class="token punctuation">}</span>

    <span class="token keyword">if</span> updated <span class="token punctuation">{</span>
      <span class="token comment">// CAS成功，保存BDJSON</span>
      <span class="token keyword">return</span> <span class="token function">saveBDJsonToBOS</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> req<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>

    <span class="token comment">// CAS失败，版本被修改，重试</span>
    resource<span class="token punctuation">.</span><span class="token function">LoggerService</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warning</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;CAS failed, retrying&quot;</span><span class="token punctuation">,</span>
                                     logit<span class="token punctuation">.</span><span class="token function">Int64</span><span class="token punctuation">(</span><span class="token string">&quot;retry&quot;</span><span class="token punctuation">,</span> <span class="token function">int64</span><span class="token punctuation">(</span>i<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
  <span class="token punctuation">}</span>

  <span class="token keyword">return</span> errors<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;保存失败，请重试&quot;</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br></div></div><h4 id="非公平锁和公平锁"><a href="#非公平锁和公平锁" class="header-anchor">#</a> 非公平锁和公平锁</h4> <blockquote><p>非公平锁：synchronized，公平锁：ReentrantLock(true)</p></blockquote> <p>公平锁 / 非公平锁和乐观锁 / 悲观锁是一组正交的概念，他们讨论的是两类问题</p> <ul><li>乐观锁和悲观锁关注的是如何处理冲突，即具体实施，是通过 SetNX 还是通过版本号</li> <li>公平锁和非公平锁关注的是锁的获取，是 FIFO 还是饥饿抢占，即等待锁的排队顺序是否“公平”</li></ul> <p>例如：对于公平锁，如果有三个请求 a、b、c 按顺序打到互斥资源，那么锁的获取将按照 a、b、c 的顺序；但若是非公平锁，每一次锁释放，都会重新进行抢占，第一次 a 抢到了，释放后，b 和 c 重新进行抢占，谁抢到就是谁的，这时候要是又来一个请求 d，d 也有可能在 c 前面抢到锁，导致 c 饥饿（非公平，先来但抢不到）</p> <p>公平锁</p> <ul><li>严格按照请求顺序（FIFO）</li> <li>不会饥饿</li> <li>性能相对较低（需要维护队列）</li></ul> <p>非公平锁特点</p> <ul><li>不保证请求顺序，后来的可能先获得锁</li> <li>性能高（不需要维护队列）</li> <li>可能产生饥饿（某个请求一直抢不到）</li></ul> <p>进一步看，非公平锁有独占互斥的前置条件，即必须独占，才有饥饿等待，这指向悲观锁（因为乐观锁其实不会锁住），也就是说，只有悲观锁才会发生非公平的现象，乐观锁不需要考虑公平性，因为没有真正的阻塞</p> <ul><li>非公平悲观锁：如画布的风控锁，每个请求直接去拿 SetNX 锁</li> <li>公平悲观锁：用 Redis List 排队去拿 SetNX 锁</li></ul> <p>Java AQS 公平锁：AQS 是 AbstractQueuedSynchronizer（抽象队列同步器）的缩写，是 Java 并发包（JUC）中的核心框架，通过一个 state 变量 + 一个 FIFO 队列来实现同步</p> <p>在 Java 里，ReentrantLock 默认是非公平的，采用 CAS 检查，若构造为公平，则会利用 AQS 队列实现 FIFO，以实现公平锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// ReentrantLock 默认非公平</span>
<span class="token class-name">ReentrantLock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token comment">// ReentrantLock 公平模式</span>
<span class="token class-name">ReentrantLock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token boolean">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h4 id="互斥锁和信号量"><a href="#互斥锁和信号量" class="header-anchor">#</a> 互斥锁和信号量</h4> <p>互斥锁：就是独占锁，例如基于 SetNX 实现的悲观锁、Java 里的 synchronized 锁和默认的 ReentrantLock 锁</p> <p>信号量：通过一个变量控制并发数量，如 JUC 里的 CountDownLatch</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">CountDownLatch</span> cdl <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">CountDownLatch</span><span class="token punctuation">(</span><span class="token number">10</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 同时允许 10 个并发</span>
<span class="token function">countDown</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 减一</span>
<span class="token function">await</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 加锁，当 cdl 减为 0 的时候阻塞</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>读写锁是信号量的一个实例，一般而言，“写”使用互斥锁保证同时只有一个在写，而读操作利用信号量机制，同时允许 10 个用户去读（或者压根不对读加锁）</p> <p>信号量机制和互斥锁有本质区别，互斥锁的上锁解锁，必须由同一人触发，但信号量的“解锁”，可以是任意一个拿到信号量的线程去放开，这里在逻辑上存在一个优先级的判断</p> <p>值得区分的是：互斥锁和是否公平没有必然联系，但互斥锁大多数情况下默认是非公平的，例如 synchronized 和默认的 ReentrantLock，都是互斥非公平锁，但 ReentrantLock 也可以利用 AQS 排队实例化为公平锁</p> <h4 id="分段锁和桶级锁"><a href="#分段锁和桶级锁" class="header-anchor">#</a> 分段锁和桶级锁</h4> <p>全局锁、分段锁和桶级锁是锁细粒度层面的区分</p> <p>分段锁其实在很多地方都有应用，例如数据库的行级锁，一次事务只锁一行，如果用全局锁锁整个表将会是灾难，其核心思路即：把一整个共享资源拆成多个独立分段，每一段配一把独立锁；不同分段的线程互不阻塞、并发执行，仅同一段内才会锁竞争，降低全局锁的竞争、提升高并发吞吐</p> <ul><li>还有一个例子，腾讯文档的协同编辑，每一个数据块实际上是一个操作单元，后写会覆盖前写（这里没有加锁，采用的 Last Write Wins 的策略，追求性能），不同的数据块可以同时写</li></ul> <p>一般的处理步骤入戏</p> <ol><li>将大集合 / 大资源（哈希表、库存、计数器）均匀划分为 N 个独立段（Segment），每段存储一部分数据</li> <li>段独立锁：每个分段自带一把独立互斥锁，段与段之间锁完全隔离</li> <li>路由定位：通过 <code>key.hash % 分段数</code> 哈希取模，把操作路由到对应分段</li> <li>局部加锁：读写仅锁住当前分段，不影响其他所有分段</li></ol> <p>JDK 7 中的 ConcurrentHashMap 就是采用的分段锁处理</p> <ul><li>一个 ConcurrentHashMap 默认分成 16 个 Segment 分段，每个 Segment 是一个独立小哈希表 + 一把 <code>ReentrantLock</code> 锁</li> <li>增删改：先通过 key 哈希定位到分段 → 只锁住该分段 → 操作</li> <li>查询：无锁直接读，读写并发友好</li> <li>JDK8 及之后：废弃分段锁，改用 CAS + 数组桶级 synchronized 细粒度锁，粒度更细、开销更低</li></ul> <p>为什么要从分段锁改成 synchronized 的桶级锁？桶是什么，桶就是哈希链表的头</p> <ol><li><code>synchronized</code>被优化了，偏向锁 → 轻量级锁（自旋 CAS）→ 重量级锁，大部分情况性能碾压 ReentrantLock</li> <li><code>synchronized</code> 是 JVM 原生指令，更轻量，不用额外创建 Lock 对象，代码实现简单，不用手动加解锁</li> <li>锁粒度极小（仅桶头节点），竞争极低，synchronized 完全够用</li></ol> <p>二者对比</p> <table><thead><tr><th>锁类型 \ 特点</th> <th>锁</th> <th>锁住范围</th> <th>并发度</th> <th>问题</th></tr></thead> <tbody><tr><td>JDK7 分段锁</td> <td>16 个 Segment，1 个 Segment 一把锁</td> <td>分段内所有桶</td> <td>最高 16 个线程同时修改</td> <td>同分段不同桶依然互斥</td></tr> <tr><td>JDK8 桶级锁</td> <td>每一个数组桶单独一把锁（锁头节点）</td> <td>当前这一个桶</td> <td>理论上 = 数组长度（几千级别）</td> <td>只有同一个桶多线程操作才互斥，不同桶完全并行</td></tr></tbody></table> <h4 id="可重入锁、自旋锁和死锁"><a href="#可重入锁、自旋锁和死锁" class="header-anchor">#</a> 可重入锁、自旋锁和死锁</h4> <p>递归锁：只要拿到了外面的锁，就自动拿到了内部的锁，如一个同步方法中调用了另一个同步方法，在单个线程拿到外部方法的锁时，也自动同时拿到了内部同步方法的锁</p> <p>可重入锁：ReentrantLock 锁可以重复上锁，但 lock 和 unlock 必须配对，否则就会死锁，可重入就是指可以重复上锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token class-name">Lock</span> lock <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ReentrantLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">a</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    lock<span class="token punctuation">.</span><span class="token function">lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;方法a加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token comment">// 调用方法b</span>
    lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    lock<span class="token punctuation">.</span><span class="token function">lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">// 同一个线程，再次加同一把锁！</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;方法b加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    lock<span class="token punctuation">.</span><span class="token function">unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>每一次上锁 state 加一，解锁 state 减一，直到 state = 0，锁才真正释放 —— 一个区分加锁者的信号量（只有加锁者能够解锁）</p> <p>synchronized 是天然的可重入锁，递归锁到方法 b，调用方法 a 完全正常，不会死锁</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">synchronized</span> <span class="token keyword">void</span> <span class="token function">a</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;a加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">synchronized</span> <span class="token keyword">void</span> <span class="token function">b</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;b加锁&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>为什么要用可重入锁，以 CHM 为例：CHM 内部方法嵌套调用非常多，比如 put 里面会调用扩容、调用节点插入、调用计数方法，层层调用都要加同一把分段锁，必须可重入，否则直接死锁</p> <p>自旋锁（Spin Lock）：AtomicInteger 的 getAndIncrement 方法用了自旋锁，本质上是一个<code>do{} while()</code>循环</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token comment">// 在 AtomicInteger 的 getAndIncrement 方法中 ——&gt; var1=AtomicInteger.class（地址），var2=AtomicInteger.get()（当前值），var4=1</span>
<span class="token keyword">public</span> <span class="token keyword">final</span> <span class="token keyword">int</span> <span class="token function">getAndAddInt</span><span class="token punctuation">(</span><span class="token class-name">Object</span> var1<span class="token punctuation">,</span> <span class="token keyword">long</span> var2<span class="token punctuation">,</span> <span class="token keyword">int</span> var4<span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">int</span> var5<span class="token punctuation">;</span>
    <span class="token comment">//自旋锁</span>
    <span class="token keyword">do</span> <span class="token punctuation">{</span>
        <span class="token comment">//获取当前值：从地址上读取</span>
        var5 <span class="token operator">=</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">getIntVolatile</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token comment">//与上类似，执行一个CAS(比较交换)函数：var1和var2确定当前值(地址+长度)，var5为其先记录的当前值，当二者相同时，将自身替换为var5+var4(1)</span>
    <span class="token keyword">while</span><span class="token punctuation">(</span><span class="token operator">!</span><span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">compareAndSwapInt</span><span class="token punctuation">(</span>var1<span class="token punctuation">,</span> var2<span class="token punctuation">,</span> var5<span class="token punctuation">,</span> var5 <span class="token operator">+</span> var4<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">return</span> var5<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><p>死锁（Dead Lock）：比如<code>ReentrantLock l</code>锁<code>l.lock()</code>后忘记<code>l.unlock()</code>了，那么所有等待锁<code>l</code>的线程都会卡死，即为死锁</p> <h2 id="锁的实践"><a href="#锁的实践" class="header-anchor">#</a> 锁的实践</h2> <h3 id="go-的并发和锁"><a href="#go-的并发和锁" class="header-anchor">#</a> Go 的并发和锁</h3> <blockquote><p>只有单例才考虑本地锁，例如 daemon 服务，在线服务都得用 redis 锁，简单的事得想明白</p></blockquote> <p>go func 并发，TriggerBackupCron 触发 uid 对应的异步备份任务</p> <ol><li>提前生成本次 opTask uid 并立即返回，实际业务 <code>inspect + rsync + callback</code> 在 goroutine 中异步执行</li> <li>goroutine 使用基于 <code>goinfra.GlobalCtx</code> 派生的独立 <code>ctx</code>，因为上游 <code>ctx</code> 在 HTTP Response 后将自动销毁，从而导致下游回调失败</li> <li>返回的 <code>opTaskUid</code> 由上游透传给调用方，稍后 <code>web-server</code> 会收到同一 <code>uid</code> 的 <code>/env/opTask/callback</code> 回调，由 goroutine 发起</li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>CronTaskController<span class="token punctuation">)</span> <span class="token function">TriggerBackupCron</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> uid <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	task <span class="token operator">:=</span> <span class="token operator">&amp;</span>models<span class="token punctuation">.</span>BackupCronTask<span class="token punctuation">{</span><span class="token punctuation">}</span>
    <span class="token comment">// 从 LDB 里拿出任务</span>
	<span class="token keyword">if</span> err <span class="token operator">:=</span> base<span class="token punctuation">.</span><span class="token function">GetV</span><span class="token punctuation">(</span>models<span class="token punctuation">.</span><span class="token function">BackupKey</span><span class="token punctuation">(</span>uid<span class="token punctuation">)</span><span class="token punctuation">,</span> task<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;getBackupTaskFailed, uid:%s, err:%w&quot;</span><span class="token punctuation">,</span> uid<span class="token punctuation">,</span> err<span class="token punctuation">)</span>

	opTaskUid <span class="token operator">:=</span> common<span class="token punctuation">.</span><span class="token function">GetTaskUuidByPrefix</span><span class="token punctuation">(</span>opTask<span class="token punctuation">.</span>Prefix<span class="token punctuation">)</span>
	<span class="token comment">// 基于 goinfra.GlobalCtx 派生独立 ctx，与 HTTP 请求生命周期解耦；沿用原请求的 traceId 便于串联链路</span>
	asyncCtx <span class="token operator">:=</span> tcontext<span class="token punctuation">.</span><span class="token function">WithContext</span><span class="token punctuation">(</span>goinfra<span class="token punctuation">.</span>GlobalCtx<span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">TraceId</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token comment">// 异步执行：不能沿用请求 ctx（HTTP 返回后会被 cancel，导致 rsync 后的回调 context canceled）</span>
	<span class="token keyword">go</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">if</span> err <span class="token operator">:=</span> <span class="token function">runBackupOnce</span><span class="token punctuation">(</span>asyncCtx<span class="token punctuation">,</span> task<span class="token punctuation">,</span> opTaskUid<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
