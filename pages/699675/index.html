				uid<span class="token punctuation">,</span> opTaskUid<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">return</span> opTaskUid<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>go func 跑异步任务，一个主要的问题就是上下文 ctx 会丢失，外部 http 携带的 ctx 会随着 http response 销毁，销毁时异步任务还未结束......空的 ctx</p> <ul><li>这里折中的采用上游 ctx 派生一个有着同样信息的 ctx 下放，这个 ctx 只参与异步任务，不会随着 http response 销毁，以此串联异步任务和 http 请求的调用链路</li> <li>但更通用且优雅的办法是用队列 workqueue 实现（参考 k8s client-go 的 workqueue）</li></ul> <p>Go sync.Map 本地锁，对 rsync 传输任务加锁，按照目录粒度给传输过程上锁，如果重复传输某一目录，将直接拒绝并返回 error</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// rsyncLocks 以 srcDir 为粒度防并发，同一个目录上一次 rsync 未结束时直接跳过，不同目录互不阻塞</span>
<span class="token keyword">var</span> rsyncLocks sync<span class="token punctuation">.</span>Map <span class="token comment">// key: srcDir (string), value: *sync.Mutex</span>

<span class="token comment">// DoRsyncPush 执行一次 rsync 同步，把 srcDir 内容推送到 targetNode 的 targetDir 目录</span>
<span class="token keyword">func</span> <span class="token function">DoRsyncPush</span><span class="token punctuation">(</span>srcDir<span class="token punctuation">,</span> targetNode<span class="token punctuation">,</span> targetDir <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> srcDir <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">||</span> targetNode <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">||</span> targetDir <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;doRsyncPush invalid args, upperDir:%q, targetNode:%q, targetDir:%q&quot;</span><span class="token punctuation">,</span>
			srcDir<span class="token punctuation">,</span> targetNode<span class="token punctuation">,</span> targetDir<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 以 srcDir 为粒度加锁：同一目录上一次 rsync 未结束则跳过，不同目录并发互不影响</span>
	lock <span class="token operator">:=</span> <span class="token operator">&amp;</span>sync<span class="token punctuation">.</span>Mutex<span class="token punctuation">{</span><span class="token punctuation">}</span>
	actual<span class="token punctuation">,</span> loaded <span class="token operator">:=</span> rsyncLocks<span class="token punctuation">.</span><span class="token function">LoadOrStore</span><span class="token punctuation">(</span>srcDir<span class="token punctuation">,</span> lock<span class="token punctuation">)</span>
	<span class="token keyword">if</span> loaded <span class="token punctuation">{</span>
		lock <span class="token operator">=</span> actual<span class="token punctuation">.</span><span class="token punctuation">(</span><span class="token operator">*</span>sync<span class="token punctuation">.</span>Mutex<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>lock<span class="token punctuation">.</span><span class="token function">TryLock</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;doRsyncPush skipped, previous rsync still running for dir:%s&quot;</span><span class="token punctuation">,</span> srcDir<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">defer</span> lock<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

	<span class="token comment">// 源目录必须存在，否则 rsync 会报错，提前校验</span>
	<span class="token keyword">if</span> fi<span class="token punctuation">,</span> err <span class="token operator">:=</span> os<span class="token punctuation">.</span><span class="token function">Stat</span><span class="token punctuation">(</span>srcDir<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;doRsyncPush stat srcDir failed, dir:%s, err:%w&quot;</span><span class="token punctuation">,</span> srcDir<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> <span class="token operator">!</span>fi<span class="token punctuation">.</span><span class="token function">IsDir</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;doRsyncPush srcDir is not a directory, dir:%s&quot;</span><span class="token punctuation">,</span> srcDir<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token comment">// 只传目录内容：src 末尾加 &quot;/&quot;，rsync 语义为&quot;传目录下的所有文件&quot;，避免把 upperDir 本身(diff)带过去</span>
	src <span class="token operator">:=</span> strings<span class="token punctuation">.</span><span class="token function">TrimRight</span><span class="token punctuation">(</span>srcDir<span class="token punctuation">,</span> <span class="token string">&quot;/&quot;</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot;/&quot;</span>
	dest <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;rsync://%s@%s:%s/%s/%s/&quot;</span><span class="token punctuation">,</span> config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>RsyncConfig<span class="token punctuation">.</span>User<span class="token punctuation">,</span> targetNode<span class="token punctuation">,</span>
		config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>RsyncConfig<span class="token punctuation">.</span>Port<span class="token punctuation">,</span> config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>RsyncConfig<span class="token punctuation">.</span>Module<span class="token punctuation">,</span> strings<span class="token punctuation">.</span><span class="token function">Trim</span><span class="token punctuation">(</span>targetDir<span class="token punctuation">,</span> <span class="token string">&quot;/&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

	<span class="token comment">// -aHAX 完整保留容器可写层元数据：-a 归档(-rlptgoD)，-H 硬链接，-A ACL，-X 扩展属性(xattr/capabilities)</span>
	<span class="token comment">// --delete 使目标与源保持一致（删除源已不存在的文件）</span>
	<span class="token comment">// --mkpath 自动创建目标端不存在的多级父目录（如 envId/backupUid 两级），需 rsync &gt;= 3.2.3</span>
	cmd <span class="token operator">:=</span> exec<span class="token punctuation">.</span><span class="token function">Command</span><span class="token punctuation">(</span><span class="token string">&quot;rsync&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-aHAX&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;--delete&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;--mkpath&quot;</span><span class="token punctuation">,</span> src<span class="token punctuation">,</span> dest<span class="token punctuation">)</span>
	<span class="token comment">// 密码经 RSYNC_PASSWORD 环境变量注入，不落盘、不出现在命令行参数里</span>
	cmd<span class="token punctuation">.</span>Env <span class="token operator">=</span> <span class="token function">append</span><span class="token punctuation">(</span>os<span class="token punctuation">.</span><span class="token function">Environ</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;RSYNC_PASSWORD=%s&quot;</span><span class="token punctuation">,</span> config<span class="token punctuation">.</span>Conf<span class="token punctuation">.</span>RsyncConfig<span class="token punctuation">.</span>Secret<span class="token punctuation">)</span><span class="token punctuation">)</span>

	out<span class="token punctuation">,</span> err <span class="token operator">:=</span> cmd<span class="token punctuation">.</span><span class="token function">CombinedOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>out<span class="token punctuation">)</span><span class="token punctuation">,</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>out<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br><span class="line-number">40</span><br><span class="line-number">41</span><br><span class="line-number">42</span><br><span class="line-number">43</span><br><span class="line-number">44</span><br><span class="line-number">45</span><br><span class="line-number">46</span><br></div></div><p>其实这里还有一种方案，就是对操作上锁，用一个信号量 + 维护一个 map 手动实现一个 <code>ConcurrentHashMap</code></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">var</span> <span class="token punctuation">(</span>
    mu    sync<span class="token punctuation">.</span>Mutex              <span class="token comment">// 保护 tasks map</span>
    tasks <span class="token operator">=</span> <span class="token function">make</span><span class="token punctuation">(</span><span class="token keyword">map</span><span class="token punctuation">[</span><span class="token builtin">string</span><span class="token punctuation">]</span><span class="token builtin">bool</span><span class="token punctuation">)</span> <span class="token comment">// key: srcDir, value: true 表示正在执行</span>
<span class="token punctuation">)</span>

<span class="token comment">// DoRsyncPush 按源目录粒度加锁，同一时刻同一 srcDir 只允许一个 rsync 任务</span>
<span class="token keyword">func</span> <span class="token function">DoRsyncPush</span><span class="token punctuation">(</span>ctx context<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> srcDir<span class="token punctuation">,</span> destDir <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token comment">// 1. 加锁检查并标记任务</span>
    mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> exist <span class="token operator">:=</span> tasks<span class="token punctuation">[</span>srcDir<span class="token punctuation">]</span><span class="token punctuation">;</span> exist <span class="token punctuation">{</span>
        mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;rsync task for %s is already running&quot;</span><span class="token punctuation">,</span> srcDir<span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    tasks<span class="token punctuation">[</span>srcDir<span class="token punctuation">]</span> <span class="token operator">=</span> <span class="token boolean">true</span>
    mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token comment">// 立即释放锁，避免阻塞其他目录的任务</span>

    <span class="token comment">// 2. 延迟清理标记（无论成功或失败都会执行）</span>
    <span class="token keyword">defer</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        mu<span class="token punctuation">.</span><span class="token function">Lock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
        <span class="token function">delete</span><span class="token punctuation">(</span>tasks<span class="token punctuation">,</span> srcDir<span class="token punctuation">)</span>
        mu<span class="token punctuation">.</span><span class="token function">Unlock</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span><span class="token punctuation">(</span><span class="token punctuation">)</span>

    <span class="token comment">// 3. 执行 rsync 命令（不持有锁，允许其他目录并发执行）</span>
    cmd <span class="token operator">:=</span> exec<span class="token punctuation">.</span><span class="token function">CommandContext</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;rsync&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;-avz&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;--mkpath&quot;</span><span class="token punctuation">,</span> srcDir<span class="token punctuation">,</span> destDir<span class="token punctuation">)</span>
    output<span class="token punctuation">,</span> err <span class="token operator">:=</span> cmd<span class="token punctuation">.</span><span class="token function">CombinedOutput</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;rsync failed: %w, output: %s&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">,</span> <span class="token function">string</span><span class="token punctuation">(</span>output<span class="token punctuation">)</span><span class="token punctuation">)</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> <span class="token function">string</span><span class="token punctuation">(</span>output<span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br></div></div><p>一般来讲，<code>sync.Mutex + map[string][bool]</code>写操作会快于原生的 <code>sync.Map</code>，后者是针对读多写少的场景优化的，读近乎无锁，而前者的读写更均衡</p> <h3 id="redis-分布式锁"><a href="#redis-分布式锁" class="header-anchor">#</a> Redis 分布式锁</h3> <p>通过 <code>SET NX EX</code> 实现分布式的悲观锁</p> <p><strong>utils/clients/redis.go</strong></p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// RedisLock ...</span>
<span class="token keyword">func</span> <span class="token function">RedisLock</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> client redis<span class="token punctuation">.</span>Client<span class="token punctuation">,</span> key <span class="token builtin">string</span><span class="token punctuation">,</span> timeout <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    ret<span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SET&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> <span class="token string">&quot;NX&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;EX&quot;</span><span class="token punctuation">,</span> timeout<span class="token punctuation">)</span>
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;lock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">if</span> ret <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token comment">// lock failed</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span>
    <span class="token punctuation">}</span>
    <span class="token comment">// lock ok</span>
    unlock <span class="token operator">:=</span> <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> client<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;del&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token string">&quot;unlock failed:&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> err<span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">return</span> unlock
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p>在业务层基于主键粒度对某一操作上锁，设置超时和重试实践</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">const</span> <span class="token punctuation">(</span>
	EnvSshLockKeyFmt      <span class="token operator">=</span> <span class="token string">&quot;CODEV_ENV_SSH_LOCK_%s&quot;</span> <span class="token comment">// envId 粒度，下发/移除共用同一把锁</span>
	EnvSshLockExpire      <span class="token operator">=</span> <span class="token number">60</span>                      <span class="token comment">// 秒，锁自动释放兜底（覆盖最坏执行：paas 超时10s × 3次重试 + DB 操作）</span>
	EnvSshLockWaitSeconds <span class="token operator">=</span> <span class="token number">15</span>
<span class="token punctuation">)</span>

<span class="token comment">// LockEnvSsh 以 envId 为粒度对 ssh 下发/移除加锁，等待至多 EnvSshLockWaitSeconds</span>
<span class="token keyword">func</span> <span class="token function">LockEnvSsh</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> envId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token keyword">func</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	key <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span>EnvSshLockKeyFmt<span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
	deadline <span class="token operator">:=</span> time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span>EnvSshLockWaitSeconds <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token punctuation">{</span>
		<span class="token keyword">select</span> <span class="token punctuation">{</span>
		<span class="token keyword">case</span> <span class="token operator">&lt;-</span>deadline<span class="token punctuation">:</span>
			<span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;环境ssh操作进行中，请稍后重试, envId: %s&quot;</span><span class="token punctuation">,</span> envId<span class="token punctuation">)</span>
		<span class="token keyword">default</span><span class="token punctuation">:</span>
			<span class="token keyword">if</span> unlock <span class="token operator">:=</span> clients<span class="token punctuation">.</span><span class="token function">RedisLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> config<span class="token punctuation">.</span>RedisClientGlobal<span class="token punctuation">,</span> key<span class="token punctuation">,</span> EnvSshLockExpire<span class="token punctuation">)</span><span class="token punctuation">;</span> unlock <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">return</span> unlock<span class="token punctuation">,</span> <span class="token boolean">nil</span>
			<span class="token punctuation">}</span>
			time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">300</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br></div></div><p>真正的调用</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token keyword">func</span> <span class="token punctuation">(</span>its <span class="token operator">*</span>collaboratorController<span class="token punctuation">)</span> <span class="token function">CreateCollaborator</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> envId <span class="token builtin">string</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token comment">// 对 enableSsh 操作上锁</span>
    unlock<span class="token punctuation">,</span> err <span class="token operator">:=</span> <span class="token function">LockEnvSsh</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> envId<span class="token punctuation">)</span> 
    <span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
        <span class="token keyword">return</span> <span class="token boolean">nil</span><span class="token punctuation">,</span> err
    <span class="token punctuation">}</span>
    <span class="token comment">// enableSsh 业务逻辑</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>又例如一个复杂的业务逻辑：任务执行后的状态回写</p> <ul><li>因为可能存在多个线程同时操作同一环境并进行回写，这里做一个必然的排斥，只有拿到锁才有回写的权限</li> <li>并且，这里区分了操作来源，进行不同级别的上锁（被动回写的优先级大于主动回写），我理解是：被动回调是系统的内部处理，如果报错将是复杂流程中的一个 500 错误；而主动回写可能就是一个主动 HTTP 请求，报错了直接让用户重试就行</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// UpdateStatus ...</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">UpdateStatus</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> taskId<span class="token punctuation">,</span> status<span class="token punctuation">,</span> userName<span class="token punctuation">,</span> source<span class="token punctuation">,</span>
    message <span class="token builtin">string</span><span class="token punctuation">,</span> code <span class="token builtin">int</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
    <span class="token comment">// 主动处理任务需要加锁</span>
    <span class="token keyword">if</span> source <span class="token operator">==</span> Source <span class="token punctuation">{</span>
        <span class="token comment">// 定时任务触发的主动回调，尝试获取锁，获取不到退出</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token punctuation">{</span>
        <span class="token comment">// 加高优先级锁</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleCallbackLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
        <span class="token keyword">defer</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleCallbackUnlock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
        <span class="token comment">// 第三方被动回调，会不停尝试获取锁，直到超时</span>
        <span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskWaitingLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
            <span class="token keyword">return</span> err
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">defer</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskUnlock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
    <span class="token comment">// ...</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br></div></div><p>这里的第三方被动回调去拿取任务锁，用了一个 5s 的自旋锁，将每隔 100 毫秒去尝试获取锁，印证了保证“被动回调”成功的重要性</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// HandleTaskWaitingLock 获取任务回调update status锁，乐观锁，最多等5秒</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">HandleTaskWaitingLock</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> taskId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token builtin">error</span> <span class="token punctuation">{</span>
	timeoutChan <span class="token operator">:=</span> time<span class="token punctuation">.</span><span class="token function">After</span><span class="token punctuation">(</span><span class="token number">5</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Second<span class="token punctuation">)</span>
	<span class="token keyword">for</span> <span class="token punctuation">{</span>
		<span class="token keyword">select</span> <span class="token punctuation">{</span>
		<span class="token keyword">case</span> <span class="token operator">&lt;-</span>timeoutChan<span class="token punctuation">:</span>
			<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>InvokeErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;等待任务回调update status锁超时, taskId: %s&quot;</span><span class="token punctuation">,</span> taskId<span class="token punctuation">)</span>
		<span class="token keyword">default</span><span class="token punctuation">:</span>
			<span class="token keyword">if</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">HandleTaskLock</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> taskId<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
				<span class="token keyword">return</span> <span class="token boolean">nil</span>
			<span class="token punctuation">}</span>
			time<span class="token punctuation">.</span><span class="token function">Sleep</span><span class="token punctuation">(</span><span class="token number">100</span> <span class="token operator">*</span> time<span class="token punctuation">.</span>Millisecond<span class="token punctuation">)</span>
		<span class="token punctuation">}</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p>自旋锁本质上是悲观锁的变体，而不是乐观锁，xiyou 的注释有误</p> <h3 id="lua-原子锁"><a href="#lua-原子锁" class="header-anchor">#</a> Lua 原子锁</h3> <p>正常使用 Set NX EX 对前缀上锁</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// lockUser 对用户加分布式锁，防止并发领取</span>
<span class="token comment">// 返回 lockValue 用于后续释放锁</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>c <span class="token operator">*</span>CCPoolController<span class="token punctuation">)</span> <span class="token function">lockUser</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> username<span class="token punctuation">,</span> poolId <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">(</span><span class="token builtin">string</span><span class="token punctuation">,</span> <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	key <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;%s%s:%s&quot;</span><span class="token punctuation">,</span> ccPoolUserLockPrefix<span class="token punctuation">,</span> username<span class="token punctuation">,</span> poolId<span class="token punctuation">)</span>
	lockValue <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;%d-%s&quot;</span><span class="token punctuation">,</span> time<span class="token punctuation">.</span><span class="token function">Now</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">UnixNano</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> common<span class="token punctuation">.</span><span class="token function">GetTaskUuidByPrefix</span><span class="token punctuation">(</span><span class="token string">&quot;lock&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>

	reply<span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>Redis<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;SET&quot;</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> lockValue<span class="token punctuation">,</span>
		<span class="token string">&quot;NX&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;EX&quot;</span><span class="token punctuation">,</span> <span class="token function">int</span><span class="token punctuation">(</span>ccPoolLockTimeout<span class="token punctuation">.</span><span class="token function">Seconds</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> fmt<span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;Redis SET命令失败: %w&quot;</span><span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> reply <span class="token operator">==</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">,</span> <span class="token boolean">nil</span> <span class="token comment">// 加锁失败，已有任务在处理</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">return</span> lockValue<span class="token punctuation">,</span> <span class="token boolean">nil</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><p>在解锁时，实现先比较再删除的 CAS，通过 Lua 脚本执行保证 Redis 的指令的原子性（事务）</p> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// unlockUser 释放用户分布式锁（Lua脚本保证原子性）</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>c <span class="token operator">*</span>CCPoolController<span class="token punctuation">)</span> <span class="token function">unlockUser</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> username<span class="token punctuation">,</span> poolId<span class="token punctuation">,</span> lockValue <span class="token builtin">string</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	key <span class="token operator">:=</span> fmt<span class="token punctuation">.</span><span class="token function">Sprintf</span><span class="token punctuation">(</span><span class="token string">&quot;%s%s:%s&quot;</span><span class="token punctuation">,</span> ccPoolUserLockPrefix<span class="token punctuation">,</span> username<span class="token punctuation">,</span> poolId<span class="token punctuation">)</span>
	script <span class="token operator">:=</span> <span class="token string">`
		if redis.call(&quot;GET&quot;, KEYS[1]) == ARGV[1] then
			return redis.call(&quot;DEL&quot;, KEYS[1])
		else
			return 0
		end
	`</span>
	<span class="token keyword">if</span> <span class="token boolean">_</span><span class="token punctuation">,</span> err <span class="token operator">:=</span> config<span class="token punctuation">.</span>Redis<span class="token punctuation">.</span><span class="token function">Do</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> <span class="token string">&quot;EVAL&quot;</span><span class="token punctuation">,</span> script<span class="token punctuation">,</span> <span class="token number">1</span><span class="token punctuation">,</span> key<span class="token punctuation">,</span> lockValue<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Errorf</span><span class="token punctuation">(</span><span class="token string">&quot;[CCPool] 释放用户锁失败, username=%s, poolId=%s, err=%v&quot;</span><span class="token punctuation">,</span> username<span class="token punctuation">,</span> poolId<span class="token punctuation">,</span> err<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h2 id="消息队列异步"><a href="#消息队列异步" class="header-anchor">#</a> 消息队列异步</h2> <p>在异步场景，消息队列的比重相当大，甚至在极端流量下，所有的 DB 写操作都会先经过 MQ 转发</p> <ul><li>文库所有的 SQL 都会经过一层 NMQ 转发</li></ul> <h3 id="rabbitmq-基础"><a href="#rabbitmq-基础" class="header-anchor">#</a> RabbitMQ 基础</h3> <p>消息队列模型</p> <ul><li>点对点模型：又叫队列模型，每个生产者对应一个消费者（一对一）</li> <li>订阅发布模型：一个生产者将把消息广播到每一个订阅者，即一对多模型，订阅发布能够将串行执行的任务变成“并行”，对于以下串行任务</li></ul> <img src="/assets/img/image-20250303143017426.77128625.png"> <p>它可以变成如下“并发”的形式，这是合理的，实际上，更新积分、通知商家、更新用户标签这三个事件并没有直接的逻辑联系或是执行顺序问题，他们都是由“更新订单状态触发”</p> <ul><li>不得不让人联想观察者模式，本质上是一样的，通过观察（订阅）事件驱动业务逻辑</li></ul> <img src="/assets/img/image-20250303143143342.6d217d1f.png"> <p>安装和启动</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>yay <span class="token parameter variable">-S</span> rabbitmq rabbitmqadmin
<span class="token function">sudo</span> rabbitmq-plugins <span class="token builtin class-name">enable</span>
<span class="token function">sudo</span> rabbitmq-server
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>后台运行：管理后台 15672，客户端 5672</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>rabbitmq-server <span class="token parameter variable">-detached</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>Maven 依赖</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.boot<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-amqp<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>配置</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token key atrule">spring</span><span class="token punctuation">:</span>
	<span class="token key atrule">rabbitmq</span><span class="token punctuation">:</span>
		<span class="token key atrule">host</span><span class="token punctuation">:</span> 10.2.1.231
		<span class="token key atrule">port</span><span class="token punctuation">:</span> <span class="token number">5672</span>
		<span class="token key atrule">username</span><span class="token punctuation">:</span> northboat
		<span class="token key atrule">password</span><span class="token punctuation">:</span> <span class="token number">123456</span>
		<span class="token key atrule">virtualHost</span><span class="token punctuation">:</span> order
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>消费者示例，订阅队列 <code>rabbitmq_queue</code></p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Consumer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@RabbitHandler</span>
	<span class="token annotation punctuation">@RabbitListener</span><span class="token punctuation">(</span>queuesToDeclare <span class="token operator">=</span> <span class="token annotation punctuation">@Queue</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue&quot;</span><span class="token punctuation">)</span><span class="token punctuation">)</span>
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">process</span><span class="token punctuation">(</span><span class="token class-name">String</span> message<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;消费者消费消息: &quot;</span> <span class="token operator">+</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>生产者示例：生产字符串</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Producer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@Autowired</span>
	<span class="token keyword">private</span> <span class="token class-name">RabbitTemplate</span> rabbitTemplate<span class="token punctuation">;</span>
	
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">produce</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">String</span> message <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">Date</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot;Beijing&quot;</span><span class="token punctuation">;</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;生产者产生消息: &quot;</span> <span class="token operator">+</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
		rabbitTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue&quot;</span><span class="token punctuation">,</span> message<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>我们尝试传输一个实体对象 User，需要进行序列化，继承<code>Serializable</code>类</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">User</span> <span class="token keyword">implements</span> <span class="token class-name">Serializable</span> <span class="token punctuation">{</span>
	<span class="token keyword">public</span> <span class="token class-name">String</span> name<span class="token punctuation">;</span>
	<span class="token keyword">public</span> <span class="token class-name">String</span> password<span class="token punctuation">;</span>
	<span class="token comment">// 省略get和set方法</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>仍然通过<code>convertAndSend</code>方法进行传输，<code>convertAndSend()</code> 支持 String、Integer 等基础数据类型，传输 Object 对象需要实现序列化接口 Serializable</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">Producer</span> <span class="token punctuation">{</span>
	<span class="token annotation punctuation">@Autowired</span>
	<span class="token keyword">private</span> <span class="token class-name">RabbitTemplate</span> rabbitTemplate<span class="token punctuation">;</span>
	
	<span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">produce</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>	
		<span class="token class-name">User</span> user <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">User</span><span class="token punctuation">(</span><span class="token string">&quot;nmsl&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;wdnmd&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;生产者生产消息: &quot;</span> <span class="token operator">+</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
		
		rabbitTemplate<span class="token punctuation">.</span><span class="token function">convertAndSend</span><span class="token punctuation">(</span><span class="token string">&quot;rabbitmq_queue_object&quot;</span><span class="token punctuation">,</span> user<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>RabbitMQ 交换机：定义 MQ 队列的传输类型，一对一 or 一对多</p> <table><thead><tr><th style="text-align:center;">交换机</th> <th style="text-align:center;">匹配规则</th> <th style="text-align:center;">场景</th></tr></thead> <tbody><tr><td style="text-align:center;">Direct</td> <td style="text-align:center;">路由键与绑定键完全相等</td> <td style="text-align:center;">精准路由、任务分发</td></tr> <tr><td style="text-align:center;">Fanout</td> <td style="text-align:center;">忽略路由键，广播到所有绑定队列</td> <td style="text-align:center;">发布订阅、消息广播</td></tr> <tr><td style="text-align:center;">Topic</td> <td style="text-align:center;">路由键与绑定键支持通配符（<code>*</code>匹配一个词，<code>#</code>匹配多个词）</td> <td style="text-align:center;">模糊匹配、分类路由</td></tr> <tr><td style="text-align:center;">Headers</td> <td style="text-align:center;">基于消息头属性匹配，不依赖路由键</td> <td style="text-align:center;">复杂属性匹配（极少使用）</td></tr></tbody></table> <p>RabbitMQ 三大队列</p> <ul><li>Classic：基础队列</li> <li>Quorum：部分是一致性仲裁队列</li> <li>Stream：流式日志队列</li></ul> <h3 id="消息队列解耦业务"><a href="#消息队列解耦业务" class="header-anchor">#</a> 消息队列解耦业务</h3> <p>设计模式</p> <ul><li>模板工厂模式：抽象判题流程</li> <li>策略模式：三种策略编译执行代码</li></ul> <p>例如车票排队等订单处理的设计</p> <img src="/assets/img/image-20260301175158350.7aaf4e8d.png"> <p>用户从页面查询、填写并发起一次判题请求，具体经过了如下步骤</p> <ol><li>从 Redis 读出题目详细信息，进入做题页面</li> <li>用户填写表单，包含用户信息、题目信息、用户代码等内容，点击提交</li> <li>后端收到请求，生成判题记录编号，而后将判题记录编号作为任务投递给 MQ，同时将记录编号返给前端（生产者的工作完成了）</li> <li>判题机作为消费者，读取 MQ 消息，根据编号读数据库信息进行编译执行，并将结果与数据库比对，更新 MySQL 判题记录状态，并把记录状态以<code>{judge:status:记录编号, 1/2/3/4/5}</code>的键值对形式写进 Redis</li> <li>用户点击提交后，将收到后端返回的判题编号，前端将根据判题编号不断轮询 Redis 查询判题状态，这一状态将持续 20s 左右，而后再从 MySQL 中拿取判题的详细信息</li></ol> <p>如何保证消息被成功消费？ACK 机制？重试机制？死信队列？</p> <h3 id="可靠传输和一致性"><a href="#可靠传输和一致性" class="header-anchor">#</a> 可靠传输和一致性</h3> <p>在使用消息队列时，因为生产者和消费者不直接交互，所以面临下面几个问题</p> <ol><li>要把消息添加到队列中，怎么保证消息成功添加？</li> <li>如何保证消息发送出去时一定会被消费者正常消费？</li> <li>消费者正常消费了，生产者或者队列如何知道消费者已经成功消费了消息？</li></ol> <p>如何保证消息 100% 可靠性发送？可以采用 ack 应答 + 日志记录 + 定时任务来实现</p> <p>假设有一个创建订单业务，后端收到请求后，将该业务通过消息队列发送到具体的业务模块，我们这样保证消息的可靠传输</p> <ol><li>完成订单业务处理后，生产者发送一条消息到消息队列，同时记录这条操作日志（发送中）</li> <li>消费者收到消息后处理进行</li> <li>消费者处理成功后给消息队列发送 ack 应答</li> <li>消息队列收到 ack 应答后，给生成者的 Confirm Listener 发送确认</li> <li>生产者对消息日志表进行操作，修改之前的日志状态（发送成功）</li> <li>在消费端返回应答的过程中，可能发生网络异常，导致生产者未收到应答消息，因此需要一个定时任务去提取其状态为“发送中”并已经超时的消息集合</li> <li>使用定时任务判断为消息事先设置的最大重发次数，大于最大重发次数就判断消息发送失败，更新日志记录状态为发送失败</li></ol> <img src="data:image/png;base64,UklGRhAXAABXRUJQVlA4IAQXAACQggCdASpCAusAPm00lUikIqIhIjI62IANiWlu/BV4hUbl6JOHbO6X60/3ntX/xn5E+dv4z8q/ZPzJ/u/txZT7TP5t9mP0/9z9C/9P4T/EP/L9QL8q/n/+l8TvaJbD/pfQC9Yvpn/G/w/iLf7noJ9bP937gH8y/r3ov/o/Bv+3/6n2Af5f/if2D91/+x/+f+y9BP03/6/9R8BP8+/wP/c7HX7qkFIRLNwKdnIIIIIIIIIAWrGxodzNcof0U2GM9jc09pWWTFbbbbbbbbbEeVlM6Sm63M1yh/RTYYz2NytrPrJXzY3KZ2Re7kir9u5zpeCgnWrAOQEy/hpAuqGq1oxk+VnCQQvkBAQUU1RWlktsOTbe3s5wR8BnuZreqD1WCkHcyEKIM7nJm7oI6HgcDk95C4+HK9YnqEsxXFa0A2oRwA08TE6Bp7K6qK0c3KZaXMsXtIApc+f4ENfpD585s/v6DifKVSaLr+epA03eWXNhDPsil+9ymHXm5vzXehNM9pcGuXplTnsYfqczfLjT4gPmGOYUy/hb/fFSHsCKmzxPhB9QuiA0Fq2J2xSFKYdRUIj/RvxEluCDosA1h9Vp8FnOko2lz9uBnFEIJGg5UB3k/mGCaEQZpXR/VQdqX/5j4a4K5r+3VuQSfb3gQdiajBTn8bQCkoKP8ffdnZssGf52Argd/LwgmwUnPQa5fCPPnE6JC7+jGttPCCoXJp0rnGYc6D4Ayo5P1EtfwVqk1iJ4jTAhIY1ZMlIid7c5io64jzbVt4aaLfQIRoBySClqSp16V6FsKeDCIhs9nrbcqn1XnUtuSmE8+Y4eECMM1HX5+dE2uIRZYGsMRtpN+QHnein83D9oRM6X76Ehsh80dX/Rx/k3jgL99B8Wur4cLCg0rtRXqaeZCZw1fWxK7zYIU0oa9MRUFO80VivjTL//uYdBY3MXSbk979AY0d7vHIjAKYyZVUV1BAxzKrzfHPxGTfBop2RLeT7y+tnFY2c3Qz2+dmH3+E44SQIxRr01y1+XDJyeH8R2nmunu2oGe68LVxUVCPkemxx6zXrQ+LIevAuusr7Mzg5j3I+ 7jDfexhUwC2QQpi9tp/tnmrQa3gAuBoNcCeLXMIVemqnC3/Z4jxC3/2VSiKfueEbhmH+FWXlLHRotY9tjy7boZgMPKSrMGR713an9YAFNZ8YDUg+ceTn5PXeSAxE9zSjl/kkS8704sxbQ6uVs2MBO9qVl7NKNLzKn7bUqG+mHys7zReT8P1XjzWnPW/bQcr4k1weVkUT8N+VXynYQUTAs989Acyn9aeLtxhW8nHL+hrE0set6NgsGO6E9PGeAFeGDDH+P2jitFXAiuiGyBO18r3ld0LTM8LjSuJLqIs78TnCSZJ0LYgi1ZSRBTBZ9Fdz2IW3aSBISQdl87gAAAADfaBNiopHMUuTSJe2/P68rRtwJ4ZCCbvtsM4MhqOyX60EpRS3NKNiLaLdhN90GdKrZ0l/Fbx9xafLQmM70ORJFiP+swHbMCeoqfcu2QjgNM7f2ZK1vOR1nXqUDWq72V3iYfoY9ayIoB+bjZ1y83cgKs4Drec1GHWTEbjTdVpa+HknA/1mLq+HAfhdGXv3Wk497jg5gMEf9yqOSzfgtT5kl2FGKM86zTva/Toe4y4cBPY9KLMbajM0K0xfyevOZCA14IGNgeLpfZTg10w8w4YaVV4clsMwnore+TtpWbJIGiuEAjYSsAd/uqfPToAAAAHQP4zuwiKAAAABgktJNfYRwZMHHR6p1bObOMd1IAqSktBUTJrZMReWyOj0scVZ3uGeO38Rordk7fxGit2Tt/EaK3ZPJ3LxC51HR7ZHr/jvDxcRvOKgJMrlUAAA="> <p>如何在分布式环境下保证消息队列中的消息按顺序消费？在单片 Topic 中，每个消息将按照他进入消息队列的顺序被依次消费，但很多时候 Topic 不止一个，我们该如何保证每个消息的顺序执行呢</p> <ul><li>我们只关心特定的操作顺序，在粗粒度下进行单 Topic 的传输，例如对于一次个订单，下单、付款、发货三个操作必须按照顺序执行，那么他们必须存在同一个 Topic 下，但对于其他订单并不产生影响，所以我只需要考虑将需要按照顺序执行的消息存放在同一个 Topic 就行</li></ul> <h3 id="kafka-和-rabbitmq"><a href="#kafka-和-rabbitmq" class="header-anchor">#</a> Kafka 和 RabbitMQ</h3> <blockquote><p>Kafka、RabbitMQ 和 Pulsar</p></blockquote> <p>在日志处理上为什么 Kafka 比 RabbitMQ 权威？为什么 Kafka 更适合批处理？</p> <p>Kafka 的核心结构是 Append-only log，他的写入是从缓存到磁盘再到缓存，并且“永远只追加、顺序写、批量写”</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>Producer → PageCache → Disk → PageCache → Consumer
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>在写的过程中，Kafka 实际是在用操作系统的磁盘 I/O 当作 Socket 网络缓冲区，在这，Kafka 用到了一个关键的技术：Zero Copy + mmap（某传奇 Web 服务器表示赞同）</p> <ul><li>顺序读写 + mmap（Memory Map 内存映射）：使用 linux 内核提供的 api，mmap 将磁盘文件映射到内存，支持读写，对内存的操作就会反映在磁盘文件上，但这不是实时写入磁盘的，操作系统会在程序主动调用 flush 的时候才真正的把数据写到硬盘，实现的批量写入</li> <li>零拷贝：使用 linux 内核提供的 sendfile api，sendfile 是将读到内核空间的数据直接发送到 socket buffer，这是一个直接的网络发送</li> <li>用通信实现内存共享，而不是使用内存共享来通信 → 零拷贝</li></ul> <p>而对应的 RabbitMQ 写入模型为 AMQP（Advanced Message Queue Protocol），这是 CPU + 内存驱动的架构</p> <ol><li>发布者（Publisher）发布消息（Message），经由交换机（Exchange）</li> <li>交换机根据路由规则将收到的消息分发给与该交换机绑定的队列（Queue）</li> <li>最后 AMQP 代理会将消息投递给订阅了此队列的消费者，或者消费者按照需求自行获取</li></ol> <img src="/assets/img/amqp.a151d41c.png"> <p>在 RabbitMQ 中，每次消息分发到指定队列，都是对原来的消息的一次<strong>逻辑复制</strong></p> <ul><li>什么叫“逻辑复制”？就是说，每次复制，消息体复制一份指针指向共享内存，但由于需要状态管理，在每个队列中，都必须有自己的 offset、ack 状态、重试、TTL、死信等信息，这些信息都是需要复制一份的</li> <li>AMQP 的每条消息都要经过这样几个步骤：“解析协议，路由 → <strong>复制到队列</strong> → 做 ACK，做状态维护”</li></ul> <p>Kafka 吞吐显著大于 RabbitMQ</p> <ol><li>从消息传递方式考虑，RabbitMQ 要分发要复制，Kafka 是直接把磁盘作为 Socket 网络缓存，采用零拷贝和系统 mmap 接口，更直接、更快</li> <li>从硬件资源考虑，Kafka 用磁盘缓冲，量级远大于 RabbitMQ 用内存缓冲</li> <li>从任务的复杂度考虑，Kafka 不需要维护消息状态，不需要 ack 相应，这使得他对消息的处理更加简单</li></ol> <p>但相应的：由于 CPU + 内存的处理速度远大于 CPU + I/O，故而 RabbitMQ 的响应速度远大于 Kafka，并且由于 RabbitMQ 的确认机制，使之更适合做功能解耦的业务场景</p> <ul><li>Kafka 是“重消费者模型”，一个消费者干大量的活，但不支持连接过多的消费者</li> <li>RabbitMQ 的 Channel 是“轻量级虚拟连接”，支持连接大量的消费者，但每个消费者的吞吐较慢</li></ul> <p>一句话说：Kafka 是重卡，RabbitMQ 是摩托车队</p></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/48385f/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Golang 基础</div></a> <a href="/pages/32163c/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">接口与表设计</div></a></div
