弈中可能采取的行动方案</li> <li>收益（Payoffs）：在所有参与者选择特定策略组合后，每个参与者最终得到的结果（如利润、效用等）</li></ul> <p>纳什均衡（Nash Equilibrium）：博弈的解，是一种博弈后的必然的稳定状态 —— 所有参与方在当前策略下均追求最优收益的一种必然平衡</p> <p>博弈分类：按照参与者之间是否存在具备严格约束的合作协议来分类</p> <ul><li>合作博弈（Cooperative Game）：参与者之间可以达成并执行具有约束力的协议，比如和亲、道誓</li> <li>非合作博弈（Non-cooperative Game）：参与者之间无法达成或执行有约束力的协议，现代博弈论的主要模型</li></ul> <p>对于非合作协议按照行动顺序和信息公开进行分类</p> <table><thead><tr><th style="text-align:left;">博弈类型</th> <th style="text-align:left;">行动顺序</th> <th style="text-align:left;">信息结构</th> <th style="text-align:left;">核心均衡概念</th></tr></thead> <tbody><tr><td style="text-align:left;">完全信息静态博弈</td> <td style="text-align:left;">同时行动</td> <td style="text-align:left;">相互完全了解</td> <td style="text-align:left;">纳什均衡 (Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">相互完全了解</td> <td style="text-align:left;">子博弈精炼纳什均衡 (Subgame Perfect Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息静态博弈</td> <td style="text-align:left;">同时行动</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">贝叶斯纳什均衡 (Bayesian Nash Equilibrium)</td></tr> <tr><td style="text-align:left;">不完全信息动态博弈</td> <td style="text-align:left;">有先后顺序</td> <td style="text-align:left;">至少一方信息不完全</td> <td style="text-align:left;">精炼贝叶斯纳什均衡 (Perfect Bayesian Nash Equilibrium)</td></tr></tbody></table> <p>其他博弈分类</p> <ul><li>按博弈双方利益关系：零和博弈（Zero-sum Game），一方的收益恰好是另一方的损失，否则为非零和博弈（Non-zero-sum Game）</li> <li>按博弈次数：有限博弈（Finite Game）与无限博弈（Infinite Game）</li></ul> <h3 id="囚徒困境"><a href="#囚徒困境" class="header-anchor">#</a> 囚徒困境</h3> <h3 id="纳什均衡"><a href="#纳什均衡" class="header-anchor">#</a> 纳什均衡</h3> <h3 id="性别大战"><a href="#性别大战" class="header-anchor">#</a> 性别大战</h3> <h3 id="鹰鸽博弈"><a href="#鹰鸽博弈" class="header-anchor">#</a> 鹰鸽博弈</h3> <h2 id="对称博弈"><a href="#对称博弈" class="header-anchor">#</a> 对称博弈</h2> <p>对称博弈（Symmetric Game）：在对称博弈中，所有参与者是“可互换的”，这意味着参与者拥有完全相同的可选策略，并且对于某个特定策略组合，收益仅取决于你采取了什么行动，而不取决于你是谁；否则即为非对称博弈</p> <h3 id="囚徒博弈"><a href="#囚徒博弈" class="header-anchor">#</a> 囚徒博弈</h3> <p>典型的对称博弈</p> <h2 id="非对称博弈"><a href="#非对称博弈" class="header-anchor">#</a> 非对称博弈</h2> <p>非对称博弈 (Asymmetric Game)：博弈的参与方是“不可互换”的，参与者的“地位”不对等，这种不对称可以体现在两个方面</p> <ol><li>策略集不同：参与者可选的行动方案不同</li> <li>收益不同：即使选择完全相同的策略，不同参与者获得的收益也不一样</li></ol> <h3 id="智猪博弈"><a href="#智猪博弈" class="header-anchor">#</a> 智猪博弈</h3> <p>猪圈里有两只猪，一只大猪一支小猪，一个食槽，一个食槽按钮</p> <ul><li>每按一次按钮会消耗两格能量</li> <li>食槽会投入十格能量</li></ul> <p>由于时间差，按按钮的猪会比等在食槽前的猪少吃一会，并且大猪吃的比小猪快很多，于是每此进食都存在“谁去按按钮”的博弈</p> <table><thead><tr><th>智猪博弈</th> <th>小猪按</th> <th>小猪等</th></tr></thead> <tbody><tr><td><strong>大猪按</strong></td> <td><code>(5, 1)</code></td> <td><code>(4, 4)</code></td></tr> <tr><td><strong>大猪等</strong></td> <td><code>(9, -1)</code></td> <td><code>(0, 0)</code></td></tr></tbody></table> <ul><li>对于小猪而言，如果大猪去按，它也去按，只会得到 1 个能量，而不去按会得到 4 个能量，等待更好；同理大猪等，小猪不去按也是更好（<code>0 &gt; -1</code>）</li> <li>而对于大猪而言，小猪按的话，当然等更好，如果不按的话，按更好（<code>4 &gt; 0</code>）</li></ul> <p>所以只要小猪忍着不按，对于大猪而言，按是比不按更好的选择，并且无论如何，小猪等待都是<strong>严格占有策略</strong></p> <p>于是得到纳什均衡：<code>(按, 等)</code></p> <ul><li>大猪明明知道小猪在搭便车，依然不得不承担按按钮的成本，因为对于等待的小猪，按按钮依旧是更优策略，大猪被数学规则逼着承担全部成本</li></ul> <p>当规则让“搭便车”成为最优解时，大猪唯一的解是让食槽彻底空上一阵子，能力强 ≠ 承担更多</p> <h3 id="海盗分金"><a href="#海盗分金" class="header-anchor">#</a> 海盗分金</h3> <p>5 名海盗瓜分 100 个金币，分赃规则如下</p> <ul><li>五人按照序号 1-5 依次行动</li> <li>每次行动，当事人将提出一种分赃方案，然后五个人一起举手表决，只要同意者超过半数，即为分赃成功</li> <li>如果方案被否决（同意者未过半数），则当事人会被丢到海里喂鱼，由下一个人继续提方案</li></ul> <p>这场博弈的纳什均衡是：序号为 1 的人拿到了 98 个金币，序号为 3 和 5 各拿到一个金币，序号为 2 和 4 一无所获</p> <p>为什么会这样？需要递归的从后往前推导</p> <h3 id="猎鹿博弈"><a href="#猎鹿博弈" class="header-anchor">#</a> 猎鹿博弈</h3> <h3 id="酒吧博弈"><a href="#酒吧博弈" class="header-anchor">#</a> 酒吧博弈</h3> <h3 id="枪手博弈"><a href="#枪手博弈" class="header-anchor">#</a> 枪手博弈</h3> <h3 id="警察与小偷博弈"><a href="#警察与小偷博弈" class="header-anchor">#</a> 警察与小偷博弈</h3></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/
