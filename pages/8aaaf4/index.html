WYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">渗透与安全编码<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>渗透最重要的是思路和经验</p> <h2 id="网安基础"><a href="#网安基础" class="header-anchor">#</a> 网安基础</h2> <p>ICSL 考试</p> <h3 id="规范与方法论"><a href="#规范与方法论" class="header-anchor">#</a> 规范与方法论</h3> <table><thead><tr><th>方向 \ 内容</th> <th></th></tr></thead> <tbody><tr><td>Java &amp; Web</td> <td>1. Spring Boot<br>2. Java 三大器：Listener、Filter、Intercepter<br>3. Java 安全模型<br>4. Java 类加载机制<br>5. Java 多线程<br>6. Java 网络编程<br>7. IOC、DI 和 AOP<br>8. Java 反射机制</td></tr> <tr><td>数据库 DB</td> <td>1. MySQL<br>2. ORM<br>3. Redis<br>4. MongoDB</td></tr> <tr><td>脚本语言 Script</td> <td>1. Python HTTP<br>2. Python Socket<br>3. Python Burpsuite 插件开发<br>4. Python 本地碰撞密码</td></tr> <tr><td>后端安全 Web Back Security</td> <td>1. 身份认证和权限控制<br>2. SQL 注入<br>3. 代码注入<br>4. OS 命令注入<br>5. XML 注入<br>6. SSRF 漏洞<br>7. Java 反序列化漏洞</td></tr> <tr><td>前端安全 Web Front Security</td> <td>1. XSS 反射漏洞</td></tr> <tr><td>框架安全 Web Framework Security</td> <td>1. Apache<br>2. Nginx<br>3. Tomcat<br>4. Jetty<br>5. Flask<br>6. Beego<br>7. BME</td></tr></tbody></table> <p>五大设计规范</p> <ol><li>会话管理安全设计规范</li> <li>密码算法应用规范</li> <li>密码管理安全规范</li> <li>身份与访问管理安全规范</li> <li>隐私保护设计规范</li></ol> <p>白盒验证测试方法（验证测试部）一般的审计流程</p> <ol><li>工具扫危险点，通常是一些危险函数和危险语句</li> <li>分析入参传递，是否能从上层达到危险点并执行</li> <li>依次排除</li></ol> <p>方法论</p> <ul><li>收集产品信息</li> <li>制定测试策略</li> <li>掌握测试方法</li> <li>输出测试报告</li></ul> <p>合规类问题验证</p> <ul><li>敏感信息泄露</li> <li>密码算法合规</li> <li>不安全协议和加密套件</li> <li>源码无公网地址</li></ul> <p>典型漏洞验证</p> <ul><li>SQL 注入</li> <li>远程命令执行</li> <li>XML 注入</li> <li>XSS 漏洞</li> <li>文件上传 / 下载</li></ul> <p>业务逻辑类问题验证</p> <ul><li>权限控制</li> <li>绕过安全过滤</li> <li>条件竞争</li></ul> <p>一些调试习惯</p> <ul><li>断点调试
<ul><li>打断点跑项目或许是读懂源码的最快方式</li> <li>打断点 → debug 运行 → 打断点 → 查看变量值 / 计算表达式值 → 断点步入 → 下一跳 → 下一断点 → 忽略断点</li></ul></li> <li>IDEA 快捷键
<ul><li>Ctrl + Alt + 左右方向键：找到上/下一个高亮</li> <li>Alt + F8：计算表达式值</li> <li>Ctrl + Alt + H：查看完整调用链</li> <li>准星设置：“始终选择打开的文件”</li></ul></li></ul> <p>重点是关注漏洞的传递，即污点是否能够抵达危险函数，危险函数并不可怕，只需要加上防御机制就并非漏洞</p> <h3 id="常见漏洞"><a href="#常见漏洞" class="header-anchor">#</a> 常见漏洞</h3> <p><a href="https://github.com/whgojp/JavaSecLab" target="_blank" rel="nofollow noopener noreferrer">whgojp/JavaSecLab: JavaSecLab is a comprehensive Java vulnerability platform<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>SQL 注入：攻击者在 Web 应用的输入字段中插入恶意 SQL 语句，使得服务器执行非预期的数据库操作，造成</p> <ul><li>数据泄露（如用户名密码）</li> <li>数据篡改或删除</li> <li>登录绕过</li> <li>提权（如使用 <code>xp_cmdshell</code>）</li></ul> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code>输入用户名: <span class="token string">' OR '</span><span class="token number">1</span><span class="token string">'='</span><span class="token number">1</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>文件操纵：利用用户对文件路径或内容的输入控制，执行非法文件操作，如读取任意文件、覆盖系统文件等</p> <ul><li>任意文件读取（LFI / Path Traversal）</li> <li>任意文件上传</li> <li>文件包含（RFI / LFI）</li></ul> <p>例如</p> <ul><li>读取敏感文件（如 <code>/etc/passwd</code>）</li> <li>上传 Webshell，远程控制服务器</li></ul> <div class="language-http line-numbers-mode"><pre class="language-http"><code>GET /?file=../../../../etc/passwd
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>SSRF 服务器端请求伪造：攻击者诱导服务器向内网或其他受保护资源发起请求，实现信息收集或攻击内网</p> <ul><li>扫描内网服务</li> <li>获取内网接口数据</li> <li>利用云服务元数据获取访问凭证（如 AWS）</li></ul> <p>示例</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code>http://localhost:8080/fetch?url<span class="token operator">=</span>http://169.254.169.254/latest/meta-data/
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>命令注入：Web 应用中拼接了用户输入到系统命令中，攻击者可以注入并执行恶意命令</p> <ul><li>远程执行任意系统命令</li> <li>上传、删除、修改文件</li> <li>建立反弹 shell</li></ul> <p>XML 注入：包括 XXE，攻击者构造恶意 XML 数据，通过外部实体注入（XXE）实现文件读取、请求伪造等</p> <ul><li>任意文件读取</li> <li>SSRF</li> <li>拒绝服务（DoS）</li> <li>泄露内存信息</li></ul> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token doctype"><span class="token punctuation">&lt;!</span><span class="token doctype-tag">DOCTYPE</span> <span class="token name">foo</span> <span class="token punctuation">[</span><span class="token internal-subset">
  <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>!ELEMENT</span> <span class="token attr-name">foo</span> <span class="token attr-name">ANY</span> <span class="token punctuation">&gt;</span></span>
  &lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot; &gt;
</span><span class="token punctuation">]</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>foo</span><span class="token punctuation">&gt;</span></span><span class="token entity named-entity" title="&amp;xxe;">&amp;xxe;</span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>foo</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>本地提权（Local Privilege Escalation）：攻击者在系统中已经获得低权限账户，通过利用系统漏洞、配置错误等方式，提升至管理员权限</p> <ul><li>利用 SUID 程序漏洞</li> <li>滥用计划任务（cron）</li> <li>漏洞内核（如 Dirty COW）</li></ul> <p>例如</p> <ul><li>获得 root 权限</li> <li>控制整个主机</li> <li>持久化攻击入口</li></ul> <h3 id="靶场渗透基础"><a href="#靶场渗透基础" class="header-anchor">#</a> 靶场渗透基础</h3> <p>练手靶场</p> <ul><li><a href="https://www.wechall.net/" target="_blank" rel="nofollow noopener noreferrer">WeChall<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://ctf.hacker101.com/ctf" target="_blank" rel="nofollow noopener noreferrer">Hacker101 CTF<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/whgojp/JavaSecLab" target="_blank" rel="nofollow noopener noreferrer">JavaSecLab<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>常见工具</p> <ul><li>Kali Linux</li> <li>Windows：UTools、Listary、BurpSuite</li></ul> <h4 id="micro-cms-v1"><a href="#micro-cms-v1" class="header-anchor">#</a> Micro-CMS v1</h4> <p>CMS（Content Management System）：网站内容管理系统</p> <p>通过 js 脚本直接注入 html，这是最简单常用的 POC（Proof of Concept，漏洞验证）</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>script</span><span class="token punctuation">&gt;</span></span><span class="token script"><span class="token language-javascript"><span class="token function">alert</span><span class="token punctuation">(</span>\xss<span class="token punctuation">)</span></span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>script</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>通过 img 标签的错误事件（随便请求一张图片）注入js事件</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>img</span> <span class="token attr-name">src</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span>x</span> <span class="token special-attr"><span class="token attr-name">onerror</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token value javascript language-javascript"><span class="token function">alert</span><span class="token punctuation">(</span>xss<span class="token punctuation">)</span></span></span></span><span class="token punctuation">&gt;</span></span> 
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h4 id="training-get-sourced"><a href="#training-get-sourced" class="header-anchor">#</a> Training: Get Sourced</h4> <p><code>F12</code>查看<code>HTML</code>源码，答案写在注释里，藏在<code>body</code>的右下方</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token comment">&lt;!-- Now this is a comment! --&gt;</span>
<span class="token comment">&lt;!-- You are looking for this password: html_sourcecode --&gt;</span>       
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>body</span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>html</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h4 id="training-stegano-i"><a href="#training-stegano-i" class="header-anchor">#</a> Training: Stegano Ⅰ</h4> <p>通过<code>html</code>代码找到图片源下载，得到<code>btegano1.bmp</code>，直接用记事本或者<code>notepad++</code>打开，或修改后缀为<code>.txt</code>打开，可得到答案</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>BMf       6   (               0                   Look what the hex-edit revealed: passwd:steganoI
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以用<code>notepad++</code>等编辑器打开<code>bmp</code>文件，在末尾加入文字信息（若用记事本直接修改将损坏文件）</p> <h4 id="training-mysql-i"><a href="#training-mysql-i" class="header-anchor">#</a> Training: MySQL Ⅰ</h4> <p>查看后端源码发现登录的<code>SQL</code>语句是这么写的，同时发现了管理员用户名<code>admin</code></p> <div class="language-php line-numbers-mode"><pre class="language-php"><code><span class="token variable">$query</span> <span class="token operator">=</span> <span class="token string double-quoted-string">&quot;SELECT * FROM users WHERE username='<span class="token interpolation"><span class="token variable">$username</span></span>' AND password='<span class="token interpolation"><span class="token variable">$password</span></span>'&quot;</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以在传入用户名时动手脚</p> <p>1、传入<code>admin'#</code>，这样<code>sql</code>语句的字符串将变成</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>&quot;select * from users where username='admin''#...&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>于是验证密码的部分被替换为<code>sql</code>注释，因为<code>admin</code>存在，返回一定为真</p> <p>2、传入<code>admin' or '1</code></p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">select</span> <span class="token operator">*</span> <span class="token keyword">from</span> users <span class="token keyword">where</span> username<span class="token operator">=</span><span class="token string">'admin'</span> <span class="token operator">or</span> <span class="token string">'1'</span> <span class="token operator">and</span> password<span class="token operator">=</span><span class="token string">'$password'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>同样因为掺入了<code>1</code>，于是返回始终为真</p> <h4 id="training-crypto-caesar-i"><a href="#training-crypto-caesar-i" class="header-anchor">#</a> Training:  Crypto-Caesar Ⅰ</h4> <p>简单的古典密码解密，给定一串码</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>PDA MQEYG XNKSJ BKT FQILO KRAN PDA HWVU ZKC KB YWAOWN WJZ UKQN QJEMQA OKHQPEKJ EO BWCYZILHHNKW
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>合理猜测每个字母加上一个相同的数变为当前码，如<code>A+2=C, Z+1=A</code></p> <p>于是编写程序列出总共26种可能性，同时将大写转小写便于阅读</p> <p>python 代码</p> <div class="language-python line-numbers-mode"><pre class="language-python"><code>code <span class="token operator">=</span> <span class="token string">&quot;LZW IMAUC TJGOF XGP BMEHK GNWJ LZW DSRQ VGY GX USWKSJ SFV QGMJ MFAIMW KGDMLAGF AK YZJJKAKWUUKH&quot;</span>
i <span class="token operator">=</span> <span class="token number">0</span>
<span class="token keyword">while</span> i <span class="token operator">&lt;</span> <span class="token number">26</span><span class="token punctuation">:</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span>i<span class="token operator">+</span><span class="token number">1</span><span class="token punctuation">,</span> end<span class="token operator">=</span><span class="token string">'.'</span><span class="token punctuation">)</span>

            <span class="token keyword">continue</span>
        <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token builtin">chr</span><span class="token punctuation">(</span><span class="token number">97</span><span class="token operator">+</span><span class="token punctuation">(</span><span class="token builtin">ord</span><span class="token punctuation">(</span>c<span class="token punctuation">)</span><span class="token operator">-</span><span class="token number">65</span><span class="token operator">+</span>i<span class="token punctuation">)</span><span class="token operator">%</span><span class="token number">26</span><span class="token punctuation">)</span><span class="token punctuation">,</span>end<span class="token operator">=</span><span class="token string">&quot;&quot;</span><span class="token punctuation">)</span>
    i <span class="token operator">+=</span> <span class="token number">1</span>
    <span class="token keyword">print</span><span class="token punctuation">(</span><span class="token string">'\n'</span><span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>从 26 句中找到有意义的一行</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>the quick brown fox jumps over the lazy dog of caesar and your unique solution is ghrrsiseccsp

ber">110</span><span class="token punctuation">,</span> <span class="token number">114</span><span class="token punctuation">,</span> <span class="token number">97</span><span class="token punctuation">,</span> <span class="token number">103</span><span class="token punctuation">,</span> <span class="token number">103</span><span class="token punctuation">,</span> <span class="token number">115</span><span class="token punctuation">,</span> <span class="token number">114</span><span class="token punctuation">]</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="burpsuite-抓包重放"><a href="#burpsuite-抓包重放" class="header-anchor">#</a> BurpSuite 抓包重放</h3> <blockquote><p>通过 BurpSuite 对网络请求进行抓包</p></blockquote> <p>Burp Suite Professional 是一套来自 PortSwigger，用于测试 web 安全性的高级工具集，从一个基本的拦截代理到尖端的 Burp 扫描器</p> <ul><li><a href="https://sysin.org/blog/burp-suite-pro-win/" target="_blank" rel="nofollow noopener noreferrer">Burp Suite Professional 2025.12 for Windows x64 - 领先的 Web 渗透测试软件<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://portswigger.net/burp/communitydownload" target="_blank" rel="nofollow noopener noreferrer">Download Burp Suite Community Edition - PortSwigger<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>入门：<a href="https://www.cnblogs.com/xingzhifeng/p/18702715" target="_blank" rel="nofollow noopener noreferrer">BurpSuite 安装及使用实操 - 刑之风 - 博客园<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>BurpSuite 测试流程</p> <ol><li>设置端口代理</li> <li>抓包</li> <li>重放</li></ol> <p>基本思路：在 Burp 设置 Proxy 拦截，然后把浏览器/程序/应用写一个代理发到 Burp 的 Proxy 上，Burp 将作为一个中转站进行网络通信，这样就能对每个 HTTP 进行数据抓包</p> <p>首先在 Burp 的 Settings → Tools → Proxy 中设置代理<code>127.0.0.1:8080</code></p> <p>若是 Spring 程序，可以在启动类前设置代理</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;http.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyHost&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;127.0.0.1&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span><span class="token function">setProperty</span><span class="token punctuation">(</span><span class="token string">&quot;https.proxyPort&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;8080&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>

<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token class-name">ProxyUtil</span><span class="token punctuation">.</span><span class="token function">setProxy</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">AuditAiAgentApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>这样从 Spring 打出的所有网络请求都会走<code>127.0.0.1:8080</code>，从而被 Burp 捕捉</p> <p>其他代理设置</p> <ul><li>在浏览器中，通过 Zero Omega 同样可以设置这样的代理：选项 → 情景模式 → 新建情景模式（设置为<code>127.0.0.1:8080</code>）同默，而后启用即可，这样 Burp 就能捕捉到当前浏览器发出的所有 HTTP 请求</li> <li>本地应用代理设置：Proxifier</li></ul> <p>一些使用小技巧</p> <ul><li>Ctrl + R 重放请求 Repeater</li> <li>Intercept on 打开网络断电</li> <li>HTTP history 查看每一次请求包</li></ul> <h2 id="脚本与协议"><a href="#脚本与协议" class="header-anchor">#</a> 脚本与协议</h2> <p>脚本语言，如 PHP、Bash、Lua 等等</p> <h3 id="php-基础"><a href="#php-基础" class="header-anchor">#</a> PHP 基础</h3> <p>PHP（Hypertext Preprocessor），超文本预处理器，原名 Personal Home Page，养活中文互联网 10 年渗透，内核为 C</p> <ul><li>PHP 文件可包含文本、HTML、JavaScript 代码和 PHP 代码</li> <li>PHP 代码在服务器上执行，结果以纯 HTML 形式返回给浏览器</li></ul> <p>LAMP（Linux + Apache + MySQL + PHP）环境：<a href="http://www.wampserver.com/" target="_blank" rel="nofollow noopener noreferrer">WampServer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>下载完成后，启动 wampmanager.exe，这将启动一系列服务</p> <ul><li>PHP 编译执行环境</li> <li>MySQL：跑在 3306 端口</li> <li>Apache 服务器：通过<code>localhost/index.php</code>将可以访问到 wamp 根目录 www 目录下的动态 html 文件</li></ul> <p>一个简单的 PHP 示例，简单来说，就是在 HTML 页面里面嵌入 PHP 代码</p> <p><strong>test_mysql.php</strong></p> <div class="language-php line-numbers-mode"><pre class="language-php"><code><span class="token php language-php"><span class="token delimiter important">&lt;?php</span>
<span class="token keyword">echo</span> <span class="token string single-quoted-string">'&lt;h1&gt;&lt;center&gt;NMSL&lt;center&gt;&lt;/h1&gt;'</span><span class="token punctuation">;</span>

<span class="token variable">$user</span> <span class="token operator">=</span> <span class="token string single-quoted-string">'root'</span><span class="token punctuation">;</span>
<span class="token variable">$password</span> <span class="token operator">=</span> <span class="token string single-quoted-string">''</span><span class="token punctuation">;</span>
<span class="token variable">$database</span> <span class="token operator">=</span> <span class="token string single-quoted-string">''</span><span class="token punctuation">;</span>
<span class="token variable">$port</span> <span class="token operator">=</span> <span class="token constant">NULL</span><span class="token punctuation">;</span>
<span class="token variable">$mysqli</span> <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">mysqli</span><span class="token punctuation">(</span><span class="token string single-quoted-string">'127.0.0.1'</span><span class="token punctuation">,</span> <span class="token variable">$user</span><span class="token punctuation">,</span> <span class="token variable">$password</span><span class="token punctuation">,</span> <span class="token variable">$database</span><span class="token punctuation">,</span> <span class="token variable">$port</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

<span class="token keyword">if</span> <span class="token punctuation">(</span><span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token property">connect_error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">die</span><span class="token punctuation">(</span><span class="token string single-quoted-string">'Connect Error ('</span> <span class="token operator">.</span> <span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token property">connect_errno</span> <span class="token operator">.</span> <span class="token string single-quoted-string">') '</span>
            <span class="token operator">.</span> <span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token property">connect_error</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
<span class="token keyword">echo</span> <span class="token string single-quoted-string">'&lt;p&gt;Connection OK '</span><span class="token operator">.</span> <span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token property">host_info</span><span class="token operator">.</span><span class="token string single-quoted-string">'&lt;/p&gt;'</span><span class="token punctuation">;</span>
<span class="token keyword">echo</span> <span class="token string single-quoted-string">'&lt;p&gt;Server '</span><span class="token operator">.</span><span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token property">server_info</span><span class="token operator">.</span><span class="token string single-quoted-string">'&lt;/p&gt;'</span><span class="token punctuation">;</span>
<span class="token keyword">echo</span> <span class="token string single-quoted-string">'&lt;p&gt;Initial charset: '</span><span class="token operator">.</span><span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token function">character_set_name</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">.</span><span class="token string single-quoted-string">'&lt;/p&gt;'</span><span class="token punctuation">;</span>

<span class="token variable">$mysqli</span><span class="token operator">-&gt;</span><span class="token function">close</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token delimiter important">?&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br></div></div><p><a href="./assets/webshell.txt">PHP Web Shell</a>：一个简单的 PHP WebShell，一般来说，将 webshell 上传至服务器并具有执行权限的 WEB 目录下，就能实现远程访问 webshell 控制服务器的目的</p> <h3 id="常用-linux-命令"><a href="#常用-linux-命令" class="header-anchor">#</a> 常用 Linux 命令</h3> <p>查进程：ps + grep</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">ps</span> <span class="token parameter variable">-ef</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token keyword">function</span>
<span class="token function">kill</span> <span class="token parameter variable">-0</span> pid
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>查日志：cat + grep</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">cat</span> service.log.* <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'313126566710330'</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token string">'makepptoutline'</span>

pdo2 <span class="token parameter variable">-bns</span> group.gdp-ghome-online.pandora.all <span class="token parameter variable">-y</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> <span class="token number">5</span> <span class="token parameter variable">-show</span> row <span class="token string">&quot; cat /home/work/odp/log/service/service.log.wf | grep '2947948859' &quot;</span>  <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;need jump&quot;</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;sshMatrix&quot;</span>

pdo2 <span class="token parameter variable">-bns</span> group.gdp-ghome-online.pandora.all <span class="token parameter variable">-y</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> <span class="token number">5</span> <span class="token parameter variable">-show</span> row <span class="token string">&quot; cat /home/work/odp/log/service/service.log | grep '1809944544' &quot;</span>  <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;need jump&quot;</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;sshMatrix&quot;</span>

pdo2 <span class="token parameter variable">-bns</span> group.gdp-ghome-online.pandora.all <span class="token parameter variable">-y</span> <span class="token parameter variable">-q</span> <span class="token parameter variable">-r</span> <span class="token number">5</span> <span class="token parameter variable">-show</span> row <span class="token string">&quot; cat /home/work/odp/log/access_log | grep '1809944544' &quot;</span>  <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;need jump&quot;</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-v</span> <span class="token string">&quot;sshMatrix&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>查进程（没有 ps 的情况下）：top</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token function">top</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>默认 3 秒刷新一次。</li> <li>按内存排序：按<code>M</code>键 (大写)，内存占用最高的进程会排到最上面</li> <li>退出：<code>q</code>键</li> <li>核心字段：<code>RES</code>常驻物理内存，真正占用的物理内存大小 (单位 KB)；<code>%MEM</code>为 RES 占总物理内存的百分比；<code>VIRT</code>虚拟内存总量</li></ul> <p>如何定位 OOM？OOM 是内核行为，日志会记录在内核缓冲区或系统日志中，所以核心思路是</p> <ol><li>使用<code>top</code>命令进行实时监控</li> <li><code>cat grep</code>读取<code>/proc</code>日志文件</li> <li><code>dmesg</code>查看内核日志</li></ol> <p>通过内核查看进程信息：所有进程信息都在 <code>/proc/[PID]</code> 目录下</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 列出所有进程 PID (替代 ps -ef)</span>
<span class="token function">ls</span> /proc <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-E</span> <span class="token string">'^[0-9]+$'</span>

<span class="token comment"># 查看进程详细状态 (包含内存)</span>
<span class="token function">cat</span> /proc/1234/status

<span class="token comment"># 过滤出关键内存指标</span>
<span class="token function">cat</span> /proc/1234/status <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-E</span> <span class="token string">&quot;^VmRSS|^VmSize|^VmData&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><ul><li><code>VmRSS</code>: 物理内存占用 (KB)，对应 top 的 RES</li> <li><code>VmSize</code>: 虚拟内存总大小 (KB)，对应 top 的 VIRT</li></ul> <p>查看 OOM 日志</p> <div class="language-bash line-numbers-mode"><pre class="language-bash"><code><span class="token comment"># 过滤 OOM 相关日志</span>
<span class="token function">dmesg</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-i</span> <span class="token string">&quot;out of memory\|killed process&quot;</span>

<span class="token comment"># 显示更友好的时间格式 (-T)，并查看上下文 (-B 前5行, -A 后30行)</span>
<span class="token function">dmesg</span> <span class="token parameter variable">-T</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-A</span> <span class="token number">30</span> <span class="token parameter variable">-B</span> <span class="token number">5</span> <span class="token string">&quot;Out of memory&quot;</span>

<span class="token comment"># 查看 OOM 计数</span>
<span class="token function">cat</span> /proc/meminfo <span class="token operator">|</span> <span class="token function">grep</span> OomKillCount
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h3 id="摩斯密码"><a href="#摩斯密码" class="header-anchor">#</a> 摩斯密码</h3> <blockquote><p>有种原始的美</p></blockquote> <p>字母</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>A</td> <td>．━</td> <td>B</td> <td>━ ．．．</td> <td>C</td> <td>━ ．━ ．</td> <td>D</td> <td>━ ．．</td></tr> <tr><td>E</td> <td>．</td> <td>F</td> <td>．．━ ．</td> <td>G</td> <td>━ ━ ．</td> <td>H</td> <td>．．．．</td></tr> <tr><td>I</td> <td>．．</td> <td>J</td> <td>．━ ━ ━</td> <td>K</td> <td>━ ．━</td> <td>L</td> <td>．━ ．．</td></tr> <tr><td>M</td> <td>━ ━</td> <td>N</td> <td>━ ．</td> <td>O</td> <td>━ ━ ━</td> <td>P</td> <td>．━ ━ ．</td></tr> <tr><td>Q</td> <td>━ ━ ．━</td> <td>R</td> <td>．━ ．</td> <td>S</td> <td>．．．</td> <td>T</td> <td>━</td></tr> <tr><td>U</td> <td>．．━</td> <td>V</td> <td>．．．━</td> <td>W</td> <td>．━ ━</td> <td>X</td> <td>━ ．．━</td></tr> <tr><td>Y</td> <td>━ ．━ ━</td> <td>Z</td> <td>━ ━ ．．</td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <p>数字</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>0</td> <td>━ ━ ━ ━ ━</td> <td>1</td> <td>．━ ━ ━ ━</td> <td>2</td> <td>．．━ ━ ━</td> <td>3</td> <td>．．．━ ━</td></tr> <tr><td>4</td> <td>．．．．━</td> <td>5</td> <td>．．．．．</td> <td>6</td> <td>━ ．．．．</td> <td>7</td> <td>━ ━ ．．．</td></tr> <tr><td>8</td> <td>━ ━ ━ ．．</td> <td>9</td> <td>━ ━ ━ ━ ．</td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <p>标点符号</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>.</td> <td>．━ ．━ ．━</td> <td>:</td> <td>━ ━ ━ ．．．</td> <td>,</td> <td>━ ━ ．．━ ━</td> <td>;</td> <td>━ ．━ ．━ ．</td></tr> <tr><td>?</td> <td>．．━ ━ ．．</td> <td>=</td> <td>━ ．．．━</td> <td>'</td> <td>．━ ━ ━ ━ ．</td> <td>/</td> <td>━ ．．━ ．</td></tr> <tr><td>!</td> <td>━ ．━ ．━ ━</td> <td>━</td> <td>━ ．．．．━</td> <td>_</td> <td>．．━ ━ ．━</td> <td>&quot;</td> <td>．━ ．．━ ．</td></tr> <tr><td>(</td> <td>━ ．━ ━ ．</td> <td>)</td> <td>━ ．━ ━ ．━</td> <td>$</td> <td>．．．━ ．．━</td> <td>&amp;</td> <td>． ．．．</td></tr> <tr><td>@</td> <td>．━ ━ ．━ ．</td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <p>非英语字符</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>à或å</td> <td>．━ ━ ．━</td> <td>ä或æ</td> <td>．━ ．━</td> <td>ch</td> <td>━ ━ ━ ━</td> <td>ç或ĉ</td> <td>━ ．━ ．．</td></tr> <tr><td>ð</td> <td>．．━ ━ ．</td> <td>é</td> <td>．．━ ．．</td> <td>è</td> <td>．━ ．．━</td> <td>ĝ</td> <td>━ ━ ．━ ．</td></tr> <tr><td>ĥ</td> <td>━ ．━ ━ ．</td> <td>ĵ</td> <td>．━ ━ ━ ．</td> <td>ñ</td> <td>━ ━ ．━ ━</td> <td>ö或ø</td> <td>━ ━ ━ ．</td></tr> <tr><td>ŝ</td> <td>．．．━ ．</td> <td>þ</td> <td>．━ ━ ．．</td> <td>ü或ŭ</td> <td>．．━ ━</td> <td></td> <td></td></tr></tbody></table> <p>特殊符号</p> <table><thead><tr><th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th> <th>字符</th> <th>电码符号</th></tr></thead> <tbody><tr><td>AR</td> <td>．━ ．━ ．</td> <td>AS</td> <td>．━ ．．．</td> <td>K</td> <td>━ ．━</td> <td>SK</td> <td>．．．━ ．━</td></tr> <tr><td>BT</td> <td>━ ．．．━</td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td></tr></tbody></table> <h3 id="https-与-tls-协议"><a href="#https-与-tls-协议" class="header-anchor">#</a> HTTPS 与 TLS 协议</h3> <blockquote><p>HTTPS = HTTP + SSL / TLS</p></blockquote> <p>众所周知，HTTP 是建立在 TCP 基础上的应用层协议，TPC 通过三次握手在服务端和客户端之间建立长连接（在 HTTP1.0 之后），通过超时重传、确认帧来保证可靠传输</p> <p>而三次握手并不存在身份认证，他仅靠累加的 ACK 码来确认握手双方的回应，这会造成</p> <ul><li>客户端无法认证服务端身份，任意一个服务器可以伪造响应来欺骗客户端，例如，攻击者可以搭建一个伪造网站（如模仿银行官网），并让用户的 HTTP 请求指向该伪造站点获取用户敏感信息</li> <li>HTTP 没有机制确认传输的数据是否完整，攻击者可在传输过程中随意修改数据包内容，接收方无法察觉数据已被篡改，无法抵抗中间人攻击</li></ul> <p>HTTPS 在电商与支付兴起的背景下应运而生，其本质上是一个组合协议，由 HTTP 实现数据可靠传输，SSL / TLS 实现身份安全认证，HTTPS 连接的建立顺序如下</p> <ol><li>TCP 三次握手</li> <li>TLS 握手</li> <li>HTTP 加密传输</li></ol> <p>在实际应用中，HTTPS 引入密钥协商、对称加密、数字证书、哈希摘要等技术来保证数据隐私、身份可信以及消息完整性，具体而言</p> <ol><li>使用非对称加密 + 对称加密的混合加密机制，如采用 RSA/ECC 进行密钥协商，AES 进行加密传输</li> <li>利用数字证书证明服务端可信：服务器需要向权威的证书颁发机构（CA）申请包含自身身份信息的数字证书，客户端（浏览器）在建立连接时，会验证服务器证书的合法性：若证书无效（如伪造、过期），浏览器会弹出安全警告，提醒用户 “该网站不安全”</li> <li>消息认证机制保证消息完整性：服务器会对传输的数据生成哈希摘要，并通过密钥进行签名，接收方在解密数据后，会重新计算哈希值并与签名比对：若不一致，说明数据已被篡改，直接丢弃数据包</li></ol> <p>SSL / TLS 握手过程</p> <img src="/assets/img/https.70d70a51.png"> <p>数字证书如何保证其可信度 → 证书链</p> <h3 id="tcp-连接"><a href="#tcp-连接" class="header-anchor">#</a> TCP 连接</h3> <p>TCP 报文头部字段</p> <img src="/assets/img/image-20260612003349465.6936b3a2.png"> <p>三次握手</p> <img src="/assets/img/image-20260612002953457.10b7c7a6.png"> <p>四次挥手</p> <img src="/assets/img/image-20260612003052305.08099b17.png"> <ul><li>客户端：FIN-WAIT-1/2 + TIME-WAIT + CLOSED</li> <li>服务器：CLOSE-WAIT + LAST-ACK + CLOSED</li></ul> <p>为什么都是一次请求一次确认，挥手要四次，握手只需要三次？</p> <ol><li>握手实际上是服务端在一次发送里同时进行了确认和请求，所以少了一次</li> <li>但在挥手时不能这么做，因为需要等待数据传输完，有等待时间，例如 server 收到 FIN 请求后，还有 50KB 数据在传，所以要等传完之后，再发 FIN 请求告知自己不会再传了；此时 client 虽然发了 FIN，但也只是不传输，但仍接收</li></ol> <h3 id="syn-flood-泛洪攻击"><a href="#syn-flood-泛洪攻击" class="header-anchor">#</a> SYN Flood 泛洪攻击</h3> <p>TCP 握手 SYN 泛洪攻击（SYN Flood）：TCP 建立连接的三次握手，服务端（被动一方）必须严格按照这个程序来进行，即对客户端始终响应，如果客户端发送 SYN 包企图与服务端建立连接，但发送完 SYN 包后就不管，那会发送什么事情捏</p> <img src="/assets/img/image-20260612003757340.f6bdf958.png"> <ul><li>客户端发送一个 SYN 包给服务端后就退出，而服务端接收到 SYN 包后，会回复一个 SYN+ACK 包给客户端，然后等待客户端回复一个 ACK 包</li> <li>但此时客户端并不会回复 ACK 包，所以服务端只能一直等待直到超时，服务端超时后，会重发 SYN+ACK 包给客户端，默认重试 5 次，而且每次等待的时间都会增加（可以参考 TCP 协议超时重传的实现）</li> <li>另外，当服务端接收到 SYN 包后，会建立一个半连接状态的 Socket，所以，当客户端一直发送 SYN 包，但不回复 ACK 包，那么将会耗尽服务端的资源，这就是 SYN Flood 攻击</li></ul> <h2 id="安全编码"><a href="#安全编码" class="header-anchor">#</a> 安全编码</h2> <h3 id="非侵入式编码"><a href="#非侵入式编码" class="header-anchor">#</a> 非侵入式编码</h3> <h4 id="函数变长入参"><a href="#函数变长入参" class="header-anchor">#</a> 函数变长入参</h4> <p>新增入参函数</p> <ol><li>定义结构体参数 <code>AllocOperateOption</code></li> <li>定义入参接口 <code>AllocOperateOpt</code></li> <li>实现入参函数 <code>WithCollaboratorAuth</code></li></ol> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// AllocOperateOption 环境操作鉴权配置</span>
<span class="token comment">// CollaboratorRole 表示协作成员执行本次操作所需的最低角色。</span>
<span class="token keyword">type</span> AllocOperateOption <span class="token keyword">struct</span> <span class="token punctuation">{</span>
	EnvID            <span class="token builtin">string</span>
	CollaboratorRole <span class="token builtin">string</span>
<span class="token punctuation">}</span>

<span class="token comment">// AllocOperateOpt 环境操作鉴权选项</span>
<span class="token comment">// 默认仅允许环境属主和管理员操作；传入协作鉴权选项后，可按角色放行协作成员。</span>
<span class="token keyword">type</span> AllocOperateOpt <span class="token keyword">func</span><span class="token punctuation">(</span><span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span>

<span class="token comment">// WithCollaboratorAuth 配置协作成员鉴权</span>
<span class="token keyword">func</span> <span class="token function">WithCollaboratorAuth</span><span class="token punctuation">(</span>envID<span class="token punctuation">,</span> role <span class="token builtin">string</span><span class="token punctuation">)</span> AllocOperateOpt <span class="token punctuation">{</span>
	<span class="token keyword">return</span> <span class="token keyword">func</span><span class="token punctuation">(</span>o <span class="token operator">*</span>AllocOperateOption<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		o<span class="token punctuation">.</span>EnvID <span class="token operator">=</span> envID
		o<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">=</span> role
	<span class="token punctuation">}</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br></div></div><p>在现有函数中使用变长的函数入参 <code>opt ...AllocOperateOpt</code>，这样做的好处是</p> <ul><li>对原有函数无侵入式，不影响已有调用逻辑</li> <li>新增的参数可读性极佳，相较于 <code>args ...string</code> 的方式，实现了一个有名字的强类型参数</li></ul> <div class="language-go line-numbers-mode"><pre class="language-go"><code><span class="token comment">// AllocOperate 校验当前用户是否允许操作环境，owner 为环境属主，AllocOperateOpt 为协作环境选项</span>
<span class="token keyword">func</span> <span class="token punctuation">(</span>envInstance <span class="token operator">*</span>EnvInstanceController<span class="token punctuation">)</span> <span class="token function">AllocOperate</span><span class="token punctuation">(</span>ctx tcontext<span class="token punctuation">.</span>Context<span class="token punctuation">,</span> owner <span class="token builtin">string</span><span class="token punctuation">,</span> opt <span class="token operator">...</span>AllocOperateOpt<span class="token punctuation">)</span> <span class="token punctuation">(</span>err <span class="token builtin">error</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
	<span class="token keyword">if</span> owner <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;环境属主不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	opts <span class="token operator">:=</span> <span class="token operator">&amp;</span>AllocOperateOption<span class="token punctuation">{</span><span class="token punctuation">}</span>
	<span class="token keyword">for</span> <span class="token boolean">_</span><span class="token punctuation">,</span> o <span class="token operator">:=</span> <span class="token keyword">range</span> opt <span class="token punctuation">{</span>
		<span class="token function">o</span><span class="token punctuation">(</span>opts<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	username <span class="token operator">:=</span> ctx<span class="token punctuation">.</span><span class="token function">UserName</span><span class="token punctuation">(</span><span class="token punctuation">)</span>
	<span class="token keyword">if</span> username <span class="token operator">==</span> owner <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> ok<span class="token punctuation">,</span> err <span class="token operator">:=</span> envInstance<span class="token punctuation">.</span><span class="token function">IsAdmin</span><span class="token punctuation">(</span>ctx<span class="token punctuation">)</span><span class="token punctuation">;</span> err <span class="token operator">!=</span> <span class="token boolean">nil</span> <span class="token punctuation">{</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Error</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span> <span class="token keyword">else</span> <span class="token keyword">if</span> ok <span class="token punctuation">{</span>
		<span class="token keyword">return</span> <span class="token boolean">nil</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，环境所有人:%s&quot;</span><span class="token punctuation">,</span> owner<span class="token punctuation">)</span>
		ctx<span class="token punctuation">.</span><span class="token function">Logger</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">Warn</span><span class="token punctuation">(</span>err<span class="token punctuation">)</span>
		<span class="token keyword">return</span> err
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>EnvID <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token operator">||</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">==</span> <span class="token string">&quot;&quot;</span> <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">New</span><span class="token punctuation">(</span><span class="token string">&quot;协作环境和协作角色不能为空&quot;</span><span class="token punctuation">)</span>
	<span class="token punctuation">}</span>

	<span class="token keyword">if</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Manager <span class="token operator">&amp;&amp;</span> opts<span class="token punctuation">.</span>CollaboratorRole <span class="token operator">!=</span> Collaborator <span class="token punctuation">{</span>
		<span class="token keyword">return</span> goinfra<span class="token punctuation">.</span>ParamInvalidErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;不支持的协作鉴权角色:%s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
	<span class="token punctuation">}</span>
	<span class="token keyword">if</span> <span class="token operator">!</span>collaboratorController<span class="token punctuation">.</span><span class="token function">AllocCollaborate</span><span class="token punctuation">(</span>ctx<span class="token punctuation">,</span> username<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>EnvID<span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		err <span class="token operator">=</span> goinfra<span class="token punctuation">.</span>ForbiddenErrorCode<span class="token punctuation">.</span><span class="token function">Newf</span><span class="token punctuation">(</span><span class="token string">&quot;你无权限操作环境，当前协作权限不足，所需权限: %s&quot;</span><span class="token punctuation">,</span> opts<span class="token punctuation">.</span>CollaboratorRole<span class="token punctuation">)</span>
