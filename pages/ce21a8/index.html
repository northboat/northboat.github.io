Bbyz3nwgTd3AVFqUJ5hpHlq9MveLnWwttUfoygBmvVjuikxND3znrhsELnZk7k+OjIGxeNEkomyLVta0xxn+HZhjBc4YZ/AFjHjz9u3xRZl2BN4aq9nFwWh16IrQ1aHHEd3j1+4/dB9OtH4e29A2H1DyHQRmOSfQZ1Fy7MHBTGB6J/Djq6p3OxyO2cB+4Car7v/o3GXgfAkj23+x9ID1Teoamo/SXcbvSf2PX7Vc8DdCmE1vN9di+32P9/5YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">登录认证<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="jwt"><a href="#jwt" class="header-anchor">#</a> JWT</h2> <p>给 WebSocket 连接添加 JWT 认证，参考：<a href="https://www.cnblogs.com/duanxz/p/5440716.html" target="_blank" rel="nofollow noopener noreferrer">websocket 之四：WebSocket 的鉴权授权方案 - duanxz - 博客园 (cnblogs.com)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h3 id="web-认证概述"><a href="#web-认证概述" class="header-anchor">#</a> Web 认证概述</h3> <blockquote><p>Cookie → Session → Token</p></blockquote> <p>本质上都是字段的校验</p> <ul><li>Cookie 是服务端生成信息，客户端存储信息，服务端单向校验字段</li> <li>Session 是服务端存储信息，客户端仅存储 SessionId，通过服务端维护会话来实现认证</li> <li>Token 是无状态登录，由服务端生成令牌，客户端存储加密信息，服务端不存储，而只对加密信息认证</li></ul> <p>这么来看，Token 更像是一个使用了加密认证技术的 Cookie，Cookie 由于不加密，客户端可以伪造字段骗取服务器权限，但由于 Token 是服务器加密生成，天然对这个字段有校验权限，并且由于加密，客户端无法伪造</p> <h3 id="json-web-token"><a href="#json-web-token" class="header-anchor">#</a> Json Web Token</h3> <p>JWT 是一种基于 JSON 的 Token 认证方式，其核心特征是<strong>无状态</strong>，服务器不需要存储用户的会话信息，而是将所有必要的信息封装在 Token（令牌）里，让客户端在每次请求时携带，从而实现身份认证，其特点如下</p> <ul><li>无状态认证：服务器不需要存储 Token，每次请求独立验证用户身份</li> <li>跨平台：JSON 格式通用性</li> <li>安全：JWT 可加密和签名</li> <li>高效：减少后端查询 Session</li></ul> <p>无状态登录导致，服务器端不需要存储会话 Session，这避免了分布式场景下用户会话丢失的情况</p> <p>例如：登陆时请求打在服务器</p> <ol><li>登录信息故而存在服务器 a，而后续请求却被分流在服务器 b</li> <li>如果用传统 Session，服务器 b 就会因为没有登录信息导致权限错误</li></ol> <p>一个朴素的解决方案：用 Redis 做分布式处理，把所有 Session 统一存在一个 Redis 里</p> <p>而 JWT 其实是把认证逻辑放在了后端，而不使用 session 做校验</p> <h3 id="jwt-鉴权应用"><a href="#jwt-鉴权应用" class="header-anchor">#</a> JWT 鉴权应用</h3> <p>WebSocket 是基于 HTTP 的协议（而 HTTP 基于 TCP，有时我们也说 WebSocket 基于 TCP 协议），HTTP 有诸多缺点，如</p> <ol><li>不支持异步请求，解决方案如 Ajax</li> <li>服务端无法进行主动推送，可使用 Comet 对请求进行挂起，延迟推送，这样客户端不需要忙等（但实际上服务端做了忙等的工作），常见的解决方案有 WS、SSE</li> <li>本身无状态，每个 HTTP 连接无法对用户进行识别，需要服务端维护用户 Session，同时用户在本地 Cookie 中存储 SessionID，进行状态维护</li> <li>安全方面欠缺，其明文封装在 TCP 报文中传输，解决方案是 HTTPS，通过在 HTTP 外层再套一层 TSL 协议，实现数据加密、身份验证、完整性验证，其中身份验证通过证书实现，完整性验证通过数字签名实现，证书的可信通过证书链实现</li></ol> <p>为了实现异步请求和服务端推送的功能，出现了 WebSocket 这样的全双工异步通信的协议，由于 WebSocket 基于 HTTP，他天然的继承了这些个 HTTP 的部分“缺点”如 3 和 4</p> <p>WebSocket 协议的 RFC（Request For Comment） 提到，可以使用例如 Cookies、HTTP auth 或 TLS auth 来进行鉴权，在这使用 JWT 对 WebSocket 连接进行权限认证</p> <p>首先实现一个简单的 WebSocket 服务器，在 Java 后端引入依赖</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token comment">&lt;!--WebSocket--&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>dependency</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>groupId</span><span class="token punctuation">&gt;</span></span>org.springframework.boot<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>groupId</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>artifactId</span><span class="token punctuation">&gt;</span></span>spring-boot-starter-websocket<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>artifactId</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>dependency</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>在 Spring 主类上启动 WebSocket 服务</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SpringBootApplication</span>
<span class="token annotation punctuation">@MapperScan</span><span class="token punctuation">(</span><span class="token string">&quot;com.northboat.bearchat.mapper&quot;</span><span class="token punctuation">)</span>
<span class="token annotation punctuation">@EnableWebSocket</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">BearChatApplication</span> <span class="token punctuation">{</span>

	<span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">void</span> <span class="token function">main</span><span class="token punctuation">(</span><span class="token class-name">String</span><span class="token punctuation">[</span><span class="token punctuation">]</span> args<span class="token punctuation">)</span> <span class="token punctuation">{</span>
		<span class="token class-name">SpringApplication</span><span class="token punctuation">.</span><span class="token function">run</span><span class="token punctuation">(</span><span class="token class-name">BearChatApplication</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">,</span> args<span class="token punctuation">)</span><span class="token punctuation">;</span>
	<span class="token punctuation">}</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>WebSocket 服务器</p> <ul><li><code>onlineCount</code>变量是<code>static</code>的，一开始使用了<code>synchronized</code>来修改计数，这在高并发情况下可能仍然存在竞争问题，后使用<code>AtomicInteger</code>代替</li> <li>一开始采用<code>CopyOnWriteArraySet&lt;WebSocketServer&gt;</code>去存放 WS 连接，后改成<code>ConcurrentHashMap&lt;String, WebSocketServer&gt;</code>，一是提高了查询效率<code>O(1)</code>，二是避免了<code>CopyOnWriteArraySet</code>在高并发下的性能瓶颈</li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Component</span>
<span class="token annotation punctuation">@Slf4j</span>
<span class="token annotation punctuation">@Service</span>
<span class="token annotation punctuation">@ServerEndpoint</span><span class="token punctuation">(</span><span class="token string">&quot;/chat/{sid}&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">WebSocketServer</span> <span class="token punctuation">{</span>
    <span class="token comment">//静态变量，用来记录当前在线连接数。应该把它设计成线程安全的。</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">AtomicInteger</span> onlineCount <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">AtomicInteger</span><span class="token punctuation">(</span><span class="token number">0</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">//concurrent包的线程安全Set，用来存放每个客户端对应的MyWebSocket对象。</span>
    <span class="token keyword">private</span> <span class="token keyword">static</span> <span class="token keyword">final</span> <span class="token class-name">ConcurrentHashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token class-name">String</span><span class="token punctuation">,</span> <span class="token class-name">WebSocketServer</span><span class="token punctuation">&gt;</span></span> webSocketMap <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">ConcurrentHashMap</span><span class="token generics"><span class="token punctuation">&lt;</span><span class="token punctuation">&gt;</span></span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token comment">//与某个客户端的连接会话，需要通过它来给客户端发送数据</span>
    <span class="token keyword">private</span> <span class="token class-name">Session</span> session<span class="token punctuation">;</span>

    <span class="token comment">//接收sid</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> sid <span class="token operator">=</span> <span class="token string">&quot;&quot;</span><span class="token punctuation">;</span>

    <span class="token comment">/**
     * 连接建立成功调用的方法
     */</span>
    <span class="token annotation punctuation">@OnOpen</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">onOpen</span><span class="token punctuation">(</span><span class="token class-name">Session</span> session<span class="token punctuation">,</span> <span class="token annotation punctuation">@PathParam</span><span class="token punctuation">(</span><span class="token string">&quot;sid&quot;</span><span class="token punctuation">)</span> <span class="token class-name">String</span> sid<span class="token punctuation">)</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>session <span class="token operator">=</span> session<span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>sid <span class="token operator">=</span> sid<span class="token punctuation">;</span>
        webSocketMap<span class="token punctuation">.</span><span class="token function">put</span><span class="token punctuation">(</span>sid<span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">)</span><span class="token punctuation">;</span>     <span class="token comment">//加入set中</span>
        <span class="token function">addOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>           <span class="token comment">//在线数加1</span>
        <span class="token keyword">try</span> <span class="token punctuation">{</span>
            <span class="token function">sendMessage</span><span class="token punctuation">(</span><span class="token string">&quot;Connection Test Message&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
            log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;有新窗口开始监听:&quot;</span> <span class="token operator">+</span> sid <span class="token operator">+</span> <span class="token string">&quot;, 当前总共在线人数为:&quot;</span> <span class="token operator">+</span> <span class="token function">getOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span> <span class="token keyword">catch</span> <span class="token punctuation">(</span><span class="token class-name">IOException</span> e<span class="token punctuation">)</span> <span class="token punctuation">{</span>
            log<span class="token punctuation">.</span><span class="token function">error</span><span class="token punctuation">(</span><span class="token string">&quot;websocket IO Exception&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * 连接关闭调用的方法
     */</span>
    <span class="token annotation punctuation">@OnClose</span>
    <span class="token keyword">public</span> <span class="token keyword">void</span> <span class="token function">onClose</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
        webSocketMap<span class="token punctuation">.</span><span class="token function">remove</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span>sid<span class="token punctuation">)</span><span class="token punctuation">;</span>  <span class="token comment">//从set中删除</span>
        <span class="token function">subOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>           <span class="token comment">//在线数减1</span>
        <span class="token comment">//断开连接情况下，更新主板占用情况为释放</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;释放的sid为：&quot;</span> <span class="token operator">+</span> sid<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token comment">//这里写你 释放的时候，要处理的业务</span>
        log<span class="token punctuation">.</span><span class="token function">info</span><span class="token punctuation">(</span><span class="token string">&quot;有一连接关闭！当前在线人数为&quot;</span> <span class="token operator">+</span> <span class="token function">getOnlineCount</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>

    <span class="token comment">/**
     * 收到客户端消息后调用的方法
     * @ Param message 客户端发送过来的消息
     */</span>
    <span class="token comment">// 全双工通信，服务器接收到客户端的消息后进行处理，可以是分发，可以是其他</span>
    <span class="token comment">// 这里是将信息发送给 sid 相同的所有连接</span>

        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>

<span class="token keyword">let</span> room <span class="token operator">=</span> document<span class="token punctuation">.</span><span class="token function">getElementById</span><span class="token punctuation">(</span><span class="token string">&quot;room&quot;</span><span class="token punctuation">)</span><span class="token punctuation">.</span>innerText<span class="token punctuation">;</span>
<span class="token keyword">let</span> websocket <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">WebSocket</span><span class="token punctuation">(</span><span class="token template-string"><span class="token template-punctuation string">`</span><span class="token string">ws://localhost:8080/chat/</span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>room<span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">/</span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span>token<span class="token interpolation-punctuation punctuation">}</span></span><span class="token template-punctuation string">`</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="jwt-撤销问题"><a href="#jwt-撤销问题" class="header-anchor">#</a> JWT 撤销问题</h3> <p>我们说，JWT 是无状态的，服务器并不存放 JWT 任何信息，全部的有效信息，包括生效时间、权限等等都加密存放在用户本地</p> <p>如果有这样一种情况，用户操作完成后，想要退出登录，销毁当前本地机上的那份 JWT 权限，如何做到呢？答案是做不到</p> <p>在 JWT 的鉴权中，服务端只是一个算法工具，只提供 verify 功能，不管用户本地如何“撤销”，只要 JWT 还是那个 Token，他就始终能通过服务器的检测，所以要实现这样的业务需求，就只能在后端加一个 JWT 的存储，例如存在 Redis 里</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>{ jwt:id:{token}, jwt_content }
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后在用户登出时，把这个键值对删了，这样用户下次再用这个 JWT，就会因为通不过 Redis 的检测拒绝登录</p> <p>那么问题又来了，我 TM 都存了 Redis，为什么不直接存 SessionID 呢？这不脱裤子放屁吗，综上，其实 JWT 的应用场景十分有限</p> <h2 id="_2fa"><a href="#_2fa" class="header-anchor">#</a> 2FA</h2> <h3 id="_2fa-概述"><a href="#_2fa-概述" class="header-anchor">#</a> 2FA 概述</h3> <p>2FA，Two-Factor Authentication，即双因素认证</p> <ul><li>传统的账号密码为单重认证，如 QQ 的登录；Stream 的登录则为双因素，一重为账号密码，二为手机接收的认证码短信</li></ul> <p>密码 + 某种个人物品是常见的双因素组合，如银行使用的 U 盾（一个 U 盘），在此处 U 盾 充当“某种个人物品”的作用，每位用户将配备各自的 U 盾，内置有用户的签名证书与加密证书，同时 U 盾的访问受 PIN 码保护</p> <p>一种典型实现方案为</p> <ul><li>用户在完成口令、验证码的输入后，前端调用 USBKEY 的接口对登录请求数据进行签名，并且将该签名作为一个字段加入 HTTP 请求中</li> <li>后端系统会部署一个签名验签服务器，接收到前端登录请求后，利用签名验签服务器完成验签，验签正确则身份鉴别通过，而后再进行密码的认证，实现双因素认证</li></ul> <p>奥联的 USBKEY 以及其相对应的密码机实现 U 盾的 2FA 认证，真的不得不说，奥联给的接口简直是一坨大芬🤮，文档更是牛头不对马嘴</p> <p>一些前置工作</p> <ul><li>在后端签名验签服务器中注册用户 UKey 中所使用的签名证书</li> <li>下载安装 UKEY 的插件环境（我不想说有多屎）</li> <li>需要一个倒霉蛋将 U 盘从西安邮到秦皇岛</li></ul> <h3 id="ukey-pwd"><a href="#ukey-pwd" class="header-anchor">#</a> UKey + Pwd</h3> <p>前端通过 Websocket 和 Ukey 交互实现签名，这里 UKey 接收一个 PIN 码和签名格式，通过异步回调的方式返回一份签名</p> <p>插入 U 盘后，通过检测环境获取 UKey 的明文信息<code>keyindex, container</code></p> <p>核心在于一条加密函数</p> <div class="language-js line-numbers-mode"><pre class="language-js"><code>ntlsUtil<span class="token punctuation">.</span>func<span class="token punctuation">.</span><span class="token function">data_sm2_signature</span><span class="token punctuation">(</span>ukey_val<span class="token punctuation">,</span> identity_val<span class="token punctuation">,</span> pass<span class="token punctuation">,</span> inData<span class="token punctuation">,</span> hashtype<span class="token punctuation">,</span> format<span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>doLogin<span class="token punctuation">)</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>其中<code>ukey_val</code>和<code>identity_val</code>为即为<code>keyindex</code>和<code>container</code>，<code>pass</code>为 UKEY 的 PIN 码，<code>format</code>是签名的格式，<code>inData</code>为登陆的表单原文（Json 数据），如</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token string">&quot;{\&quot;account\&quot;:\&quot;wx\&quot;, \&quot;password\&quot;:\&quot;123456\&quot;, \&quot;verify_code\&quot;:\&quot;dQ3k\&quot;, \&quot;PIN\&quot;:\&quot;123456\&quot;}&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>this.doLogin</code>为签名成功的回调函数，具体如下</p> <div class="language-js line-numbers-mode"><pre class="language-js"><code><span class="token comment">// 打请求</span>
<span class="token function">doLogin</span><span class="token punctuation">(</span><span class="token parameter">message</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span><span class="token operator">!</span>message <span class="token operator">||</span> <span class="token operator">!</span>message<span class="token punctuation">.</span>data<span class="token punctuation">)</span><span class="token punctuation">{</span>
        <span class="token function">alert</span><span class="token punctuation">(</span><span class="token string">&quot;签名失败, 请检查UKey是否插入或PIN码是否正确, 或PIN码是否被锁定&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>loading <span class="token operator">=</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
        <span class="token keyword">return</span> <span class="token boolean">false</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    console<span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token string">&quot;签名所用证书为: &quot;</span> <span class="token operator">+</span> <span class="token keyword">this</span><span class="token punctuation">.</span>cert  <span class="token operator">+</span> <span class="token string">&quot;\n前端签名原文为&quot;</span> <span class="token operator">+</span> <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token function">encodeBase64</span><span class="token punctuation">(</span><span class="token keyword">this</span><span class="token punctuation">.</span>loginForm<span class="token punctuation">.</span>iniData<span class="token punctuation">)</span> <span class="token operator">+</span> <span class="token string">&quot;\n前端签名所得密文为: &quot;</span> <span class="token operator">+</span> message<span class="token punctuation">.</span>data<span class="token punctuation">)</span>
    <span class="token keyword">this</span><span class="token punctuation">.</span>loginForm<span class="token punctuation">.</span>signature <span class="token operator">=</span> message<span class="token punctuation">.</span>data<span class="token punctuation">;</span>

    <span class="token keyword">this</span><span class="token punctuation">.</span>$store<span class="token punctuation">.</span><span class="token function">dispatch</span><span class="token punctuation">(</span><span class="token string">'user/login'</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>loginForm<span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">then</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
        localStorage<span class="token punctuation">.</span><span class="token function">setItem</span><span class="token punctuation">(</span><span class="token string">&quot;pin&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>loginForm<span class="token punctuation">.</span>key<span class="token punctuation">)</span><span class="token punctuation">;</span>
        localStorage<span class="token punctuation">.</span><span class="token function">setItem</span><span class="token punctuation">(</span><span class="token string">&quot;keyindex&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>keyindex<span class="token punctuation">)</span><span class="token punctuation">;</span>
        localStorage<span class="token punctuation">.</span><span class="token function">setItem</span><span class="token punctuation">(</span><span class="token string">&quot;container&quot;</span><span class="token punctuation">,</span> <span class="token keyword">this</span><span class="token punctuation">.</span>container<span class="token punctuation">)</span><span class="token punctuation">;</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>$router<span class="token punctuation">.</span><span class="token function">push</span><span class="token punctuation">(</span><span class="token punctuation">{</span> <span class="token literal-property property">path</span><span class="token operator">:</span> <span class="token keyword">this</span><span class="token punctuation">.</span>redirect <span class="token operator">||</span> <span class="token string">'/'</span> <span class="token punctuation">}</span><span class="token punctuation">)</span>

        <span class="token keyword">this</span><span class="token punctuation">.</span>loading <span class="token operator">=</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">catch</span><span class="token punctuation">(</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token operator">=&gt;</span> <span class="token punctuation">{</span>
        <span class="token keyword">this</span><span class="token punctuation">.</span>loading <span class="token operator">=</span> <span class="token boolean">false</span>
    <span class="token punctuation">}</span><span class="token punctuation">)</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><p>传入的<code>message</code>为待签名数据，这份数据必须是 Base64 编码，并且在签名时，必须要规定传参<code>format</code>为<code>asn.1</code>，才能签名得到 Base64 编码的密文，什么狗屎</p> <p>后端验签接受一个 User 对象</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">User</span> <span class="token punctuation">{</span>
    <span class="token annotation punctuation">@JsonSerialize</span><span class="token punctuation">(</span>using <span class="token operator">=</span> <span class="token class-name">ToStringSerializer</span><span class="token punctuation">.</span><span class="token keyword">class</span><span class="token punctuation">)</span>
    <span class="token keyword">private</span> <span class="token class-name">Long</span> id<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> username<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> password<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> avatar<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> email<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Integer</span> gender<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Integer</span> age<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Integer</span> role<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Integer</span> status<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">Integer</span> code<span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">String</span> certificate<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> idCard<span class="token punctuation">;</span>
    <span class="token keyword">private</span> <span class="token class-name">String</span> payPassword<span class="token punctuation">;</span>

    <span class="token keyword">private</span> <span class="token class-name">Date</span> gmtModified<span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><p>对 user 的签名内容 inData 和 signature 进行验证</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@Override</span>

    <span class="token class-name">User</span> uu <span class="token operator">=</span> userMapper<span class="token punctuation">.</span><span class="token function">findByName</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getUsername</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">String</span> cert <span class="token operator">=</span> uu<span class="token punctuation">.</span><span class="token function">getCertificate</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">String</span> iniData <span class="token operator">=</span> user<span class="token punctuation">.</span><span class="token function">getIniData</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">String</span> signData <span class="token operator">=</span> user<span class="token punctuation">.</span><span class="token function">getSignature</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;iniData: &quot;</span> <span class="token operator">+</span> iniData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;signature: &quot;</span> <span class="token operator">+</span> signData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">boolean</span> flag <span class="token operator">=</span> <span class="token class-name">OlymSignature</span><span class="token punctuation">.</span><span class="token function">verifySignature</span><span class="token punctuation">(</span>cert<span class="token punctuation">,</span> iniData<span class="token punctuation">,</span> signData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>flag<span class="token punctuation">)</span>
        <span class="token keyword">return</span> <span class="token function">doLogin</span><span class="token punctuation">(</span>user<span class="token punctuation">.</span><span class="token function">getUsername</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">,</span> user<span class="token punctuation">.</span><span class="token function">getPassword</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">else</span>
        <span class="token keyword">return</span> <span class="token keyword">null</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><p>verifySignature 实际上是一个对密码机的 HTTP 请求</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">static</span> <span class="token keyword">boolean</span> <span class="token function">verify</span><span class="token punctuation">(</span><span class="token class-name">String</span> cert<span class="token punctuation">,</span> <span class="token class-name">String</span> inData<span class="token punctuation">,</span> <span class="token class-name">String</span> signature<span class="token punctuation">)</span> <span class="token keyword">throws</span> <span class="token class-name">Exception</span> <span class="token punctuation">{</span>
    <span class="token keyword">if</span><span class="token punctuation">(</span>cert <span class="token operator">==</span> <span class="token keyword">null</span><span class="token punctuation">)</span><span class="token punctuation">{</span>
        cert <span class="token operator">=</span> <span class="token class-name">Cert</span><span class="token punctuation">;</span>
    <span class="token punctuation">}</span>
    <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> signerIDBytes <span class="token operator">=</span> <span class="token class-name">SignerID</span><span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Integer</span> signerIDLen <span class="token operator">=</span> signerIDBytes<span class="token punctuation">.</span>length<span class="token punctuation">;</span>
    <span class="token class-name">String</span> signerID <span class="token operator">=</span> <span class="token class-name">Base64</span><span class="token punctuation">.</span><span class="token function">getEncoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">encodeToString</span><span class="token punctuation">(</span>signerIDBytes<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token keyword">byte</span><span class="token punctuation">[</span><span class="token punctuation">]</span> inDataBytes <span class="token operator">=</span> inData<span class="token punctuation">.</span><span class="token function">getBytes</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Integer</span> inDataLen <span class="token operator">=</span> inDataBytes<span class="token punctuation">.</span>length<span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>inDataLen<span class="token punctuation">)</span><span class="token punctuation">;</span>
    inData <span class="token operator">=</span> <span class="token class-name">Base64</span><span class="token punctuation">.</span><span class="token function">getEncoder</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">.</span><span class="token function">encodeToString</span><span class="token punctuation">(</span>inDataBytes<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;验签所使用的证书为: &quot;</span> <span class="token operator">+</span> cert<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;验签所使用的原文为: &quot;</span> <span class="token operator">+</span> inData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;验签所使用的签名密文为: &quot;</span> <span class="token operator">+</span> signature<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token string">&quot;验签所使用的签名ID为: &quot;</span> <span class="token operator">+</span> signerID<span class="token punctuation">)</span><span class="token punctuation">;</span>

    <span class="token class-name">VerifySignedDataReq</span> verifySignedDataReq <span class="token operator">=</span> <span class="token keyword">new</span> <span class="token class-name">VerifySignedDataReq</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setSignMethod</span><span class="token punctuation">(</span><span class="token constant">SGD_SM3_SM2</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setType</span><span class="token punctuation">(</span><span class="token class-name">Type</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setCert</span><span class="token punctuation">(</span>cert<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// Type为1时certSN没用，将使用cert</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setInData</span><span class="token punctuation">(</span>inData<span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setInDataLen</span><span class="token punctuation">(</span>inDataLen<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token comment">// 这个ID默认为&quot;1234567812345678&quot;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setSignerID</span><span class="token punctuation">(</span>signerID<span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setSignerIDLen</span><span class="token punctuation">(</span>signerIDLen<span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setSignature</span><span class="token punctuation">(</span>signature<span class="token punctuation">)</span><span class="token punctuation">;</span>
    verifySignedDataReq<span class="token punctuation">.</span><span class="token function">setVerifyLevel</span><span class="token punctuation">(</span><span class="token class-name">VerifyLevel</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>verifySignedDataReq<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">Integer</span> verifySignedDataResult <span class="token operator">=</span> <span class="token class-name">SignVerifyUtil</span><span class="token punctuation">.</span><span class="token function">verifySignedData</span><span class="token punctuation">(</span>verifySignedDataReq<span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span>
        <span class="token string">&quot;单包验证数字签名结果：&quot;</span> <span class="token operator">+</span> <span class="token class-name">Objects</span><span class="token punctuation">.</span><span class="token function">equals</span><span class="token punctuation">(</span><span class="token constant">SVSRESPONSE_RESPVALUE_SUCCESS</span><span class="token punctuation">,</span> verifySignedDataResult<span class="token punctuation">)</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
    <span class="token keyword">return</span> <span class="token class-name">SignVerifyUtil</span><span class="token punctuation">.</span><span class="token function">verifySignedData</span><span class="token punctuation">(</span>verifySignedDataReq<span class="token punctuation">)</span> <span class="token operator">==</span> <span class="token number">0</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br></div></div><p>非常垃圾的实现，通过签名验证之后，再对用户密码做一个比对，实现 2FA</p> <h3 id="totp"><a href="#totp" class="header-anchor">#</a> TOTP</h3> <blockquote><p>GitHub 的 2FA 方案，参考：<a href="https://ruanyifeng.com/blog/2017/11/2fa-tutorial.html" target="_blank" rel="nofollow noopener noreferrer">双因素认证（2FA）教程 - 阮一峰的网络日志 (ruanyifeng.com)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></blockquote> <p>TOTP（Time-based One-time Password），基于时间的一次性口令，这是一种安全性高于密码 + 手机验证码的公认 2FA 可靠解决方案（因为 Sim 卡可伪造），已写入国际标准 <a href="https://tools.ietf.org/html/rfc6238" target="_blank" rel="nofollow noopener noreferrer">RFC6238<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>GitHub 在 23 年启用了 TOTP 的 2FA 登录，其核心原理基于对时间戳进行哈希实现，具体而言</p> <ol><li>用户和服务器协商好一份统一的密钥 key</li> <li>用户本地采用一个计时程序，每 t 秒生成一串定长的短验证码，验证码的生成公式为 <mjx-container jax="SVG" class="MathJax" style="direction:ltr;position:relative;"><svg xmlns="http://www.w3.org/2000/svg" width="22.201ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 9812.8 1000" aria-hidden="true" style="overflow:visible;min-height:1px;min-width:1px;vertical-align:-0.566ex;"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D43B" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 219 683Q260 681 355 681Q389 681 418 681T463 682T483 682Q499 682 499 672Q499 670 497 658Q492 641 487 638H485Q483 638 480 638T473 638T464 637T455 637Q416 636 405 634T387 623Q384 619 355 500Q348 474 340 442T328 395L324 380Q324 378 469 378H614L615 381Q615 384 646 504Q674 61 ass="ORD"><mi>n</mi><mi>o</mi><mi>w</mi></mrow></msub><mo>−</mo><msub><mi>T</mi><mrow data-mjx-texclass="ORD"><mn>1970</mn></mrow></msub><mo stretchy="false">)</mo><mrow data-mjx-texclass="ORD"><mo>/</mo></mrow><mn>30</mn></math></mjx-assistive-mml></mjx-container>，30s 是登录码的刷新频率</li> <li>将传入的 Hash 与 Hash' 比对，若不一样，则返回状态 3（哈希错误），若一样，则返回状态 1（认证成功）</li></ol> <p>这里的 TC 计算是 TOTP 算法的精髓：本地计算 TC 后，将请求打到服务器，服务器会立马计算当前时间戳对应的 TC'，由于向下取整的关系，在 30s 内，本地生成的 TC 和服务器的 TC' 将会保持一致，于是最后生成的哈希值将会一致（在私钥一致的前提下）</p> <p>当然本地和服务器的时间需要是同步的，同时会有少许的网络延迟</p> <h2 id="sso"><a href="#sso" class="header-anchor">#</a> SSO</h2> <blockquote><p>Single Sign On 单点登录</p></blockquote> <p>如何实现一个单点登录，使一个用户登陆一次便可访问所有的百度产品，如何设计跨域登陆状态同步和等处逻辑，以及如何避免状态不一致，This is a question</p> <p>基本思路为</p> <ol><li>统一认证中心</li> <li>ticket 机制，一次性 ticket 验证</li> <li>顶级域 cookie 共享</li> <li>Redis 存 sso session</li> <li>单点注销回调所有 logout API</li> <li>定期 SSO 校验与本地 Session 同步</li></ol> <h3 id="sso-架构设计"><a href="#sso-架构设计" class="header-anchor">#</a> SSO 架构设计</h3> <p>核心是一个 统一认证中心（Auth Server）</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>           +------------------+
           |   Auth Server    |
           |   (login.baidu)  |
           +------------------+
                /      \
               /        \
      +------------+  +------------+
      | pan.baidu  |  | tieba.baidu|
      +------------+  +------------+
             \          /
              \        /
              用户浏览器
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>认证中心负责</p> <ul><li>用户登录</li> <li>生成登录凭证</li> <li>管理 Session</li></ul> <p>例如</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>https://login.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>而业务系统，例如</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>pan.baidu.com

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>不做登录，只负责校验凭证</p> <h3 id="session-建立"><a href="#session-建立" class="header-anchor">#</a> Session 建立</h3> <h4 id="sso-session"><a href="#sso-session" class="header-anchor">#</a> SSO Session</h4> <p>第一步，用户访问业务系统</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>https://pan.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>发现没有登录，重定向到认证中心</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>redirect → login.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>并且带上回调地址</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>https://login.baidu.com/login?service=https://pan.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>用户在认证中心登录，输入</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>username
password
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>认证成功后，认证中心创建 SSO Session</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>sso_session_id = abc123
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>可以直接存储 Redis HMap 中</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>Redis {
	authserver:session {
		sso_session_id: user_info
	}
}
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>然后返回浏览器 SSO Cookie，令其 Domain 为一级域名</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>Set-Cookie:
SSO_SESSION=abc123
Domain=.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>这样业务系统都能使用这个 SSO Session ID</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>pan.baidu.com
tieba.baidu.com
wenku.baidu.com
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h4 id="业务-session"><a href="#业务-session" class="header-anchor">#</a> 业务 Session</h4> <p>在上一步，用户通过了认证中心的登录，服务器会返回一个 SSO Session ID，同时将生成并返回一个一次性的 ticket，该凭证用于当前系统的认证，存储在 Redis HMap 中</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>redis {
	auth:ticket{
		ticket_content: user_info
	}
}
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>因为用户通过业务系统<code>https://pan.baidu.com</code>，所以第一次访问认证中心，认证中心的重定向将会是</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>https://pan.baidu.com?ticket=ST-xxx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>而后业务系统拿着这个 ticket 去请求认证中心</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>POST /validate
ticket=ST-xxx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>认证中心若通过，则返回 Redis HMap 中存的用户信息<code>user_info</code>，返回业务系统</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>
    user_id<span class="token operator">:</span> <span class="token number">10001</span><span class="token punctuation">,</span>
    username<span class="token operator">:</span> xxx
<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>而后业务系统建立本地 Session，至此一次登录完成</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>pan_session = abc123
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>然后只要访问其他子域名网站，浏览器携带 SSO Session ID 的顶级域名的 Cookie SSO Session ID 会被业务系统识别，然后再走一次认证中心生成 ticket，业务系统重定向 ticket 生成本地 Session 登录的流程</p> <p>这里需要注意 ticket 的生命周期，这是一个很短的过程，可能 30s，认证成功之后就在 HMap 中删除 ticket</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>生成 ticket
      ↓
redirect 到业务系统
      ↓
业务系统 validate
      ↓
ticket 删除
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h3 id="logout-统一登出"><a href="#logout-统一登出" class="header-anchor">#</a> logout 统一登出</h3> <p>一种靠前端实现，在某一页面登出时，直接广播所有子网站，触发其 /logout 逻辑</p> <div class="language-html line-numbers-mode"><pre class="language-html"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>iframe</span> <span class="token attr-name">src</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>https://pan.baidu.com/logout<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>iframe</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>iframe</span> <span class="token attr-name">src</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>https://tieba.baidu.com/logout<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>iframe</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>iframe</span> <span class="token attr-name">src</span><span class="token attr-value"><span class="token punctuation attr-equals">=</span><span class="token punctuation">&quot;</span>https://wenku.baidu.com/logout<span class="token punctuation">&quot;</span></span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>iframe</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>另一种就是后端通知，认证中心记录当前 SSO Session ID 登陆过的所有网站，然后在注销时，回调每个系统的 logout API，实现注销</p> <p>如何保证状态一致？</p> <p>主要是一个过期时间的问题，因为在认证中心会有一份 SSO Session，在业务系统也会有各自的本地 Session，按道理来说，如果 SSO Session 过期，所有的本地 Session 都应该过期</p> <p>一个简单的解决办法：设置短时效的本地 Session + 定期检查 SSO Session ，例如每十分钟校验一次 SSO Session</p> <h3 id="kerberos-sso"><a href="#kerberos-sso" class="header-anchor">#</a> Kerberos SSO</h3> <p>Kerberos 是一套网络认证协议，支持无密码传输、票据认证、域内一次登录全系统通行，是 Windows 域、AD、Hadoop、Kafka、Elasticsearch 等最主流的安全 SSO 方案</p> <p>其思路和上述流程类似，其实相对于复杂的密码学，这是一个相对简易的工程系统</p> <p>在 Kerberos 中，有三种角色，分别是</p> <ul><li>Client：用户 / 浏览器 / 应用</li> <li>KDC（Key Distribution Center） 密钥分发中心，包括
<ol><li>AS（Authentication Service）认证服务：验证身份，发 TGT</li> <li>TGS（Ticket Granting Service）票据授予服务：凭 TGT 发 Service Ticket</li></ol></li> <li>Server：真正要访问的业务服务（Web、DB、API）</li></ul> <p>其认证流程如下</p> <ol><li>用户登录域 → 输密码</li> <li>Client → AS：若 AS 验证成功，则发给用户 TGT 票据（Ticket Granting Ticket）</li> <li>Client → TGS：出示 TGT，申请访问某个服务，若 TGS 验证通过，则发 ST 服务票据</li> <li>Client → Server：出示 ST 服务验证通过，直接登录成功，免输密码</li></ol> <p>核心的密钥管理分为两部分</p> <ul><li>AS 认证服务：一部分负责分发 TGT（Ticket Granting Ticket）票据授权票据</li> <li>TGS 票据授予服务：一部分根据 TGT 分发 ST（Service Ticket）服务票据，用以真正的访问业务系统</li></ul></div></div> <!----> <div class="page-edit"><!----> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/10/29, 15:35:29</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/8aaaf4/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">渗透与安全编码</div></a> <a href="/pages/ef6e91/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">网关与代理</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
